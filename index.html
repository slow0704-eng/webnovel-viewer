다. 그가 말하는 동안, 내 손을 쥔 채 그 안에 밀어 넣은 것이었다.<\/p>\n<p>손가락을 폈다. 은테 안에 박힌 검은 돌이 블라인드 틈의 빛을 받았다. 그리고 그 빛을 돌려주지 않고 삼켰다.<\/p>\n<p>안쪽 테에 가는 각인. <span class=\"sys\">判官會 書記<\/span>.<\/p>\n<p>\"서기가 되던 날 받았어.\" 그의 목소리가 갈라졌다. \"받는 순간 알았어. 꿈속의 그 돌이라는 거.\"<\/p>\n<p>그가 내 손에 쥐여준 건 판관 서기의 흑요석 반지였다. 똑같은 돌이었다.<\/p>","chars":4870},{"title":"앞당겨진 아침","html":"<div class=\"timer\">[D-12 / 07:59]<\/div>\n<p>밤새 반지를 쥐고 있었다.<\/p>\n<p>달래 방 바닥, 얇은 요 위에서. 불에 그을린 내 방은 아직 테이프로 봉해져 있었다. 손바닥 안에서 흑요석이 체온만큼 데워졌다가, 손가락을 펼 때마다 다시 차가워졌다. 옆에서 달래가 코를 골았다. 창밖으로 녹두거리 첫 배달 오토바이가 지나갔다.<\/p>\n<p>08:00.<\/p>\n<p>머리맡의 휴대폰 두 대가 동시에 비명을 질렀다.<\/p>\n<hr class=\"scene\">\n<div class=\"doc\">[속보] 법무부 장관, 사형 집행 명령서 서명… &#x27;관악 일가족 살인&#x27; 유모 씨 포함<\/div>\n<p>글자가 화면 위에서 흔들렸다. 아니, 내 손이 흔들리고 있었다.<\/p>\n<p>달래가 이불을 걷어차고 일어났다. 부스스한 머리로 화면을 보더니, 입에서 욕이 먼저 나왔다.<\/p>\n<p>\"씨, 이거 22일 아니었어? 내부 일정 22일이라며.\"<\/p>\n<p>\"명령서에 서명했으면 아니야.\"<\/p>\n<p>목소리가 내 것 같지 않았다. 머릿속에서 법전 한 쪽이 저절로 펼쳐졌다. 형사소송법 제466조. 활자 크기, 줄 간격, 쪽 아래 각주까지.<\/p>\n<p>\"법무부장관이 사형의 집행을 명한 때에는, 5일 이내에 집행하여야 한다.\"<\/p>\n<p>\"닷새?\"<\/p>\n<p>\"오늘이 10일이야.\" 손가락으로 셀 필요도 없었다. \"15일.\"<\/p>\n<p>달래가 숨을 들이켰다. 방 안에 식은 라면 국물 냄새가 떠돌았다. 그 냄새가 갑자기 역했다.<\/p>\n<p>판례집 앱이 떨었다. 검은 화면 위에 흰 글씨.<\/p>\n<div class=\"doc\">공지 — 최종 공판 기일 변경: 9월 14일 23:00.<br>사건 발생 15주년입니다. 당사자 여러분의 건투를 빕니다.<\/div>\n<div class=\"timer\">[D-5 / 08:03]<\/div>\n<p>일주일이 한 줄 공지로 사라졌다.<\/p>\n<p>\"재, 재심.\" 나는 벌떡 일어나 가방을 뒤졌다. \"재심 청구하면—\"<\/p>\n<p>\"그거 집행 멈춰?\"<\/p>\n<p>\"아니.\"<\/p>\n<p>제428조. 재심의 청구는 형의 집행을 정지하는 효력이 없다. 다만 관할 검찰청 검사는 재심청구에 대한 재판이 있을 때까지 형의 집행을 정지할 수 있다.<\/p>\n<p>외운 문장이 목구멍에서 돌처럼 굴렀다. 멈출 수 있는 사람은 검사뿐. 그리고 15년 전 그 검사는 지금 강단에서 무죄추정을 가르치고 있었다.<\/p>\n<p>\"그럼 검사를 움직이면 되잖아.\" 달래가 청바지를 꿰며 말했다. \"검사는 증거 앞에서만 움직여. 내가 5년 동안 지검 기자실에서 본 게 그거야. 증거 갖고 와, 그럼 걔네도 사람이야.\"<\/p>\n<p>현관에서 노크 소리가 났다. 세 번, 정확한 간격으로.<\/p>\n<p>문을 열자 백시헌이 서 있었다. 노트북을 옆구리에 끼고, 셔츠 단추를 하나 잘못 끼운 채.<\/p>\n<p>\"[속보] 피해자 유족, 가해자 딸 옆방에 출몰.\" 달래가 팔짱을 꼈다. \"너 여기 어떻게 알았어.\"<\/p>\n<p>\"판례집 로그.\" 그가 대답하며 노트북을 열었다. \"봐.\"<\/p>\n<p>화면에 서버 기록이 흘렀다. 그가 한 줄을 짚었다.<\/p>\n<div class=\"doc\">07:40 — 공지 등록 예약: 최종 공판 기일 변경<\/div>\n<p>속보보다 20분 빨랐다. 판관회는 장관이 펜을 들기 전부터 알고 있었다.<\/p>\n<p>\"잠깐.\" 달래가 화면과 시헌의 얼굴을 번갈아 봤다. \"판례집 서버 로그를 니가 왜 봐. 당사자가.\"<\/p>\n<p>시헌이 대답하기 전에 내가 말했다.<\/p>\n<p>\"서, 서기야. 얘.\"<\/p>\n<p>방 안이 조용해졌다. 냉장고 모터 소리만 웅웅 울렸다. 달래의 얼굴에서 핏기가 빠졌다가, 천천히 다시 붉어졌다.<\/p>\n<p>\"[단독] 정진서, 적군 장교를 집에 들여… 본인은 '시간이 없었다' 해명.\" 그녀가 이를 갈며 말했다. \"너 나중에 나한테 이거 전부 설명해. 한 줄도 빼지 말고.\"<\/p>\n<p>\"응.\"<\/p>\n<p>시헌이 스크롤을 내렸다. 당사자 명단. 열두 줄 중 네 줄에 붉은 선이 그어져 있었다. 권태오, 최민규, 그리고 내가 모르는 사이 떨어져 나간 두 이름.<\/p>\n<div class=\"doc\">잔여 당사자: 8명<\/div>\n<p>여덟. 그중 셋만 법복을 입는다. 그리고 그 셋에게 주어지는 청원권만이, 닷새 안에 아빠를 살릴 수 있는 유일한 문이었다.<\/p>\n<p>나는 달래를 봤다. 달래는 시헌을 봤다. 시헌은 나를 봤다. 셋이 한 방에서 같은 숫자를 보고 있었다. 닷새.<\/p>\n<p>\"너 못 믿어.\" 달래가 말했다.<\/p>\n<p>\"알아.\"<\/p>\n<p>\"근데 시간이 없어.\"<\/p>\n<p>\"그것도 알아.\"<\/p>\n<p>달래가 혀를 찼다. 그리고 휴대폰을 집어 들었다. \"대리운전 회사, 폐업했다 해도 사람은 남아. 찾아볼게.\"<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-5 / 14:20]<\/div>\n<p>사당역 뒷골목 기사 쉼터는 담배 연기와 믹스커피 냄새에 절어 있었다.<\/p>\n<p>전 배차실장 구 씨는 예순이 넘은 얼굴로 종이컵을 구기며 우리를 봤다. 달래가 기자 시절 명함을 내밀자 그의 눈이 가늘어졌다.<\/p>\n<p>\"그 사건 얘기는 15년 동안 아무도 안 물었어.\"<\/p>\n<p>\"지금 물어요.\" 달래가 웃었다. \"늦어서 죄송해요.\"<\/p>\n<p>구 씨가 담배를 비벼 껐다. 재떨이에서 매캐한 냄새가 올라왔다.<\/p>\n<p>\"서버 오류? 웃기지 마. 그 주에 양복쟁이들이 와서 하드를 통째로 뜯어갔어. 법무법인 한결. 영장도 없이, 사장이 굽신거리면서 내줬지.\"<\/p>\n<p>\"백업은요?\"<\/p>\n<p>\"그 사람들이 백업까지 다 챙겨갔어. 자기네 기록실에 보관한다더라.\"<\/p>\n<p>한결. 시헌의 손가락이 테이블 아래에서 주먹을 쥐는 게 보였다.<\/p>\n<p>나는 눈을 감았다. 머릿속에서 아빠의 공판조서가 펼쳐졌다. 3회 공판, 열한 번째 쪽.<\/p>\n<div class=\"doc\">사망 추정 시각: 9월 14일 23:30경부터 익일 00:30경 사이.<\/div>\n<p>넘겼다. 피고인 신문. 스물두 번째 줄.<\/p>\n<div class=\"doc\">피고인은 23시 52분경 사당동에서 다음 콜을 수락하였다고 주장하나, 이를 뒷받침할 자료가 없다.<\/div>\n<p>또 넘겼다. 증거목록. 통신 기록.<\/p>\n<div class=\"doc\">피해자 김○○ 휴대전화 발신 23:47, 통화시간 9초.<\/div>\n<p>눈을 떴다. 숨이 가빴다.<\/p>\n<p>\"23시 47분에 피해자 부인이 살아 있었어.\" 내가 말했다. \"그리고 23시 52분에 아빠는 사당동에서 콜을 잡았어. 콜은 앱 위치가 픽업 지점 근처여야 잡혀요. 그렇죠?\"<\/p>\n<p>구 씨가 천천히 고개를 끄덕였다. \"반경 1킬로.\"<\/p>\n<p>\"봉천동 그 집에서 여기까지 차로 15분이에요.\"<\/p>\n<p>5분 만에 사람 둘을 죽이고 15분 거리를 올 수는 없었다.<\/p>\n<p>\"콜 기록이 있었으면.\" 시헌이 말했다. 목소리가 낮게 갈라졌다. \"그게 알리바이였어.\"<\/p>\n<p>그래서 가져간 것이었다.<\/p>\n<p>구 씨가 새 담배에 불을 붙이다 말고 나를 빤히 봤다. 라이터 불꽃이 그의 눈동자에서 흔들렸다.<\/p>\n<p>\"아가씨, 혹시.\"<\/p>\n<p>등줄기에 식은땀이 흘렀다. 엄지가 큐티클을 찾았다.<\/p>\n<p>\"유 기사가 딸 자랑을 그렇게 했어. 대기할 때마다 하늘 보면서 별 이름 대고. 우리 딸은 한 번 들으면 안 잊어버린다고.\"<\/p>\n<p>\"아, 아니에요. 그냥 기자 선배 따라온 학생이에요.\"<\/p>\n<p>손톱이 살을 파고들었다. 따끔했다. 피 냄새가 담배 연기에 묻혔다.<\/p>\n<p>구 씨는 더 묻지 않았다. 대신 종이컵에 남은 커피를 바닥에 털며 중얼거렸다. \"그 양반이 사람 죽일 손이었으면, 나는 대통령 하지.\"<\/p>\n<p>쉼터를 나서는데 달래가 내 손을 잡아끌어 손가락의 피를 휴지로 눌렀다. 아무 말도 하지 않았다. 시헌은 몇 걸음 뒤에서 걸었다. 그의 시선이 내 피 묻은 손가락에, 그리고 하늘에 차례로 머무는 게 느껴졌다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-5 / 21:30]<\/div>\n<p>리걸클리닉의 불은 밤에도 꺼지지 않았다.<\/p>\n<p>임소라 변호사는 내 전화를 받자마자 \"오세요\"라고만 했다. 문을 열자 흰 백합 향이 먼저 나를 안았다. 책상 위 유리 화병에 꽂힌 백합 세 송이, 그 옆에 김이 오르는 커피 두 잔.<\/p>\n<p>\"설탕 두 개. 맞죠?\"<\/p>\n<p>나는 고개를 끄덕였다. 언제 말했는지 기억나지 않았다.<\/p>\n<p>우리는 재심 청구서를 같이 썼다. 그녀가 형식을 잡고, 나는 공판조서의 쪽수와 줄을 불렀다. 그녀의 펜이 내 목소리를 따라 사각사각 움직였다. 형광등 아래 그녀의 손등에 잔주름이 보였다. 장갑을 벗은 오른손, 장갑을 낀 채인 왼손.<\/p>\n<p>\"알리바이 부분이 핵심이에요.\" 그녀가 말했다. \"그러려면—\"<\/p>\n<p>나는 입을 열었다. 콜 기록. 그 말을 하려는데.<\/p>\n<p>\"콜 기록이 있어야겠죠.\"<\/p>\n<p>그녀가 먼저 말했다. 펜 끝을 종이에서 떼지 않은 채.<\/p>\n<p>역시 이 사람은 다 알고 있었다. 나는 커피를 한 모금 삼켰다. 들척지근한 단맛이 목을 데웠다.<\/p>\n<p>자정이 가까워지자 그녀가 펜을 내려놓았다. 한참 백합만 봤다. 꽃잎 끝이 누렇게 말리기 시작한 한 송이를.<\/p>\n<p>\"진서 씨한테 말 안 한 게 있어요.\"<\/p>\n<p>나는 그녀를 봤다.<\/p>\n<p>\"아버님 1심. 제가 국선이었어요.\"<\/p>\n<p>손에 든 종이컵이 우그러졌다. 미지근한 커피가 손가락 사이로 흘렀다.<\/p>\n<p>\"1년차였어요. 사건 기록이 이만큼 왔는데, 공판까지 3주였어요.\" 그녀가 손으로 허공에 높이를 그렸다. \"아무것도 못 했어요. 아버님은 접견 때마다 똑같은 말만 했어요. '사당동에서 콜 잡았다니까요.' 저는 그 말을 증명 못 했어요.\"<\/p>\n<p>그녀의 목소리가 떨렸다. 눈가가 젖어 있었다.<\/p>\n<p>\"그래서 공익변호사 됐어요. 그날 이후로 매일, 그 사건이 꿈에 나와요.\"<\/p>\n<p>15년. 이 사람도 15년이었다.<\/p>\n<p>나는 무언가를 말하려 했다. 그런데 입이 아니라 몸이 먼저 기울었다. 이마가 그녀의 어깨에 닿았다. 니트의 보드라운 결, 백합과 커피가 섞인 냄새.<\/p>\n<p>그녀의 손이 내 등을 천천히 쓸었다. 엄마가 하던 속도로.<\/p>\n<p>눈물이 그녀의 어깨를 적셨다. 15년 동안 아무 앞에서도 울지 않았는데. 숨이 끊겼다 이어졌다. 흐느낌이 목구멍에서 울컥울컥 터졌다.<\/p>\n<p>\"괜찮아요.\" 그녀가 속삭였다. \"이번엔 같이 해요. 이번엔 제가 안 놓쳐요.\"<\/p>\n<p>나는 그 말을 믿었다. 누군가를 믿는다는 게 이렇게 몸이 풀리는 일인 줄, 처음 알았다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-5 / 23:12]<\/div>\n<p>휴대폰이 떨었다. 시헌이었다.<\/p>\n<div class=\"doc\">법학관 3층 복도. 지금.<\/div>\n<p>클리닉을 나서자 복도는 비상등만 켜져 초록빛이었다. 시헌은 창틀에 노트북을 올려놓고 서 있었다. 화면 빛이 그의 얼굴을 푸르게 물들였다. 제3공판까지 48분. 한 시간도 안 돼, 우리는 피고인과 검사로 마주 설 사이였다.<\/p>\n<p>\"서기 권한으로 열 수 있는 데까지 열었어.\" 그가 말했다. \"판례집 서버, 가장 오래된 폴더.\"<\/p>\n<p>먼지 냄새가 나는 것 같았다. 디지털 파일에서 그럴 리 없는데.<\/p>\n<p>스캔된 문서였다. 누렇게 바랜 종이, 붓글씨 제목.<\/p>\n<div class=\"doc\">第四十七期 公判 記錄<\/div>\n<p>\"47기면….\" 나는 숫자를 거꾸로 셌다. 62기에서 열다섯을 빼면.<\/p>\n<p>\"2011년.\" 시헌이 대신 말했다.<\/p>\n<p>그가 페이지를 넘겼다. 표지 다음 장, 기일 목록. 손가락이 마지막 줄에서 멈췄다.<\/p>\n<p>내 심장이 한 박자 늦게 뛰었다.<\/p>\n<div class=\"doc\">2011년 9월 14일 — 제47기 공판 최종 기일.<\/div>\n<p>그날 밤이었다. 봉천동 그 집에서 두 사람이 죽던 밤. 열세 살 아이가 옷장에서 숨을 참던 밤. 아빠가 사당동에서 콜을 잡던 밤.<\/p>\n<p>같은 시각, 이 지하 어딘가에서 누군가는 판결을 내리고 있었다.<\/p>\n<p>시헌이 마지막 장으로 넘겼다. 판결문 양식. 맨 아래 서명란. 만년필 잉크가 번진 자국까지 스캔되어 있었다.<\/p>\n<p>그날 밤 재판장 서명란에 적힌 이름은 — 검사 조윤강이었다.<\/p>","chars":4893},{"title":"제3공판","html":"<div class=\"timer\">[D-4 / 00:00]<\/div>\n<p>종이 울렸다.<\/p>\n<p>천장의 낡은 법정 종이 한 번, 두 번. 쇳소리가 지하의 돌벽을 타고 내려와 내 갈비뼈 안에서 다시 울렸다.<\/p>\n<p>나는 피고인석에 서 있었다. 손바닥 아래 쇠 난간이 땀에 미끄러웠다. 맞은편 검사석에 백시헌. 그의 손에 갈색 봉투. 갑 제3호증. 내 이름이 든 봉투.<\/p>\n<p>그리고 내 손에도 봉투가 있었다. 판례집 1129 뒤에서 처음 꺼낸 그 밤부터 한 번도 열지 못한 것.<\/p>\n<div class=\"doc\">갑 제11호증 — 봉인 증거. 공판정 개봉.<\/div>\n<hr class=\"scene\">\n<p>흑유리 너머에서 푸른 불빛들이 깜빡였다. 판관들의 태블릿. 얼굴 없는 실루엣들이 고개를 기울이는 게 보였다. 습한 돌 냄새와 오래된 밀랍 냄새가 법정에 고여 있었다.<\/p>\n<p>방청석 앞줄, 남은 당사자들. 서이안이 팔짱을 끼고 나를 봤다. 달래는 의자 끝에 엉덩이만 걸친 채 무릎을 떨고 있었다. 반소로 끌려온 피고인과, 그 피고인의 봉투를 쥔 검사. 판관들이 좋아할 만한 대진표였다. 내 귓속에서 맥박이 북처럼 울렸다.<\/p>\n<p>변조된 목소리가 법대 위에서 울렸다.<\/p>\n<p>\"제3공판을 개정합니다. 피고인 정진서. 검사 백시헌. 검사는 공소를 제기하십시오.\"<\/p>\n<p>시헌이 일어섰다. 법복 소매가 검사석 모서리를 쓸었다.<\/p>\n<p>\"검사는 피고인을 위계에 의한 업무방해로 기소합니다.\" 그의 목소리는 평소처럼 짧고 정확했다. \"피고인은 입학 자기소개서에 가족 사항을 거짓으로 적었고, 그 거짓 위에서 이 자리에 섰습니다.\"<\/p>\n<p>판례집 그래프가 출렁였다. 유죄 쪽 막대가 쭉 올라갔다. 판관들은 이야기를 좋아했다. 피해자의 아들이 가해자의 딸을 기소하는 이야기라면 더더욱.<\/p>\n<p>\"증거로 갑 제3호증을—\"<\/p>\n<p>그가 봉투를 들어 올리기 전에, 나는 손을 들었다.<\/p>\n<p>\"피, 피고인은.\"<\/p>\n<p>첫 음절이 목에 걸렸다. 흑유리 너머에서 누군가 웃는 것 같았다. 판례집 화면의 투표 그래프가 붉은 쪽으로 슬쩍 기울었다.<\/p>\n<p>나는 숨을 삼켰다. 천천히.<\/p>\n<p>\"피고인은 봉인 증거 개봉을 신청합니다. 규칙 제9조, 피고인은 공판정에서 반증을 제출할 수 있다.\"<\/p>\n<p>침묵. 그리고 재판장의 목소리.<\/p>\n<p>\"허가합니다.\"<\/p>\n<p>수입인지에 엄지손톱을 넣었다. 종이가 찢어지는 소리가 너무 컸다. 봉투 안에서 A4 몇 장이 미끄러져 나왔다. 맨 위 장에 굵은 활자.<\/p>\n<div class=\"doc\">보관 대상: 백시헌(본명 이시헌)<\/div>\n<p>손가락이 굳었다.<\/p>\n<div class=\"doc\">백시헌은 판관회 서기로서, 지난 3년간 &#x27;집행&#x27; 폭로글 7건을 작성·게시하였다. 첨부: 게시글 원문 및 작성 로그.<\/div>\n<p>다음 장을 넘겼다. 케이스북 게시글 캡처. 날짜와 제목이 한 줄씩.<\/p>\n<div class=\"doc\">2024. 9. [실명] 1L ○○○, 학부 시절 성적 조작…<br>2025. 9. [실명] 1L ○○○, 인턴 회사 기밀 유출…<\/div>\n<p>그리고 맨 아래 두 줄.<\/p>\n<div class=\"doc\">2026. 9. 2. [실명] 1L 권태오, 로스쿨 입시 대리시험<br>2026. 9. 4. [실명] 1L 최민규, 군 가혹행위 은폐 가담<\/div>\n<p>민규의 글. 내가 위조된 증거로 끝낸 그 사람을, 세상에 내건 문장. 그걸 쓴 손이 지금 검사석에서 내 봉투를 쥐고 있었다.<\/p>\n<p>나는 고개를 들었다. 시헌은 이미 알고 있는 얼굴이었다. 봉투 안에 뭐가 들었는지. 그가 아주 작게, 고개를 끄덕였다. 내라는 뜻이었다.<\/p>\n<p>판례집 화면에 알림이 떴다.<\/p>\n<div class=\"doc\">반증으로 제출하시겠습니까? [제출] [보류]<\/div>\n<p>이걸 내면 판관들은 피고인의 반격에 열광할 것이다. 투표는 내 쪽으로 쏠린다. 무죄. 그리고 반소, 다음 피고인은 시헌. 그의 7건이 그의 실명으로 돌아온다. 사흘 뒤 최종 공판에 서는 건 나고, 청원권을 손에 쥘 확률은 올라간다.<\/p>\n<p>아빠의 닷새.<\/p>\n<p>엄지가 화면의 [제출] 위에 떠 있었다. 손톱 끝이 유리에 닿을 듯 말 듯.<\/p>\n<p>모빌랙의 쇳소리가 떠올랐다. 내 어깨를 짓누르던 서가를 반대로 돌리던 팔. 연기 속에서 나를 들쳐 업던 등. 옷장 문틈으로 손가락 두 개만큼의 빛을 보던 열세 살.<\/p>\n<p>나는 화면을 껐다.<\/p>\n<p>그리고 종이를 다시 봉투에 넣었다. 반으로 접었다. 한 번 더 접었다. 손바닥만 해진 봉투를 법복 안주머니에 밀어 넣었다.<\/p>\n<p>\"피고인은 반증 제출을 보류합니다.\"<\/p>\n<p>방청석에서 이안이 낮게 욕을 뱉었다. 달래가 입을 틀어막았다. 흑유리 너머의 푸른 불빛들이 어지럽게 흔들렸다.<\/p>\n<p>시헌의 얼굴이 하얘졌다.<\/p>\n<p>\"검사.\" 재판장이 말했다. \"증거를 낭독하십시오.\"<\/p>\n<p>판례집 그래프의 유죄 막대가 다시 차올랐다. 70, 75, 80퍼센트. 반증을 버린 피고인. 판관들에게 그건 항복이었다.<\/p>\n<p>시헌이 나를 봤다. 아주 짧게. 그 눈이 묻고 있었다. 왜.<\/p>\n<p>나는 대답 대신 난간을 쥔 손에 힘을 줬다. 손바닥이 쇠에 쩍 달라붙었다.<\/p>\n<p>그가 봉투를 열었다. 내 갑호증을 꺼냈다. 종이가 그의 손끝에서 떨렸다. 그는 첫 줄을 읽었다.<\/p>\n<p>\"피고인의 본명은—\"<\/p>\n<p>멈췄다.<\/p>\n<p>1초. 2초. 법정 종의 줄이 천장에서 미세하게 흔들렸다. 그가 숨을 들이켰다. 숨이 목에서 걸렸다. 나는 그 소리를 알았다.<\/p>\n<p>그는 종이를 내려놓았다.<\/p>\n<p>\"검사는 공소를 취소합니다.\"<\/p>\n<p>법정이 얼어붙었다.<\/p>\n<p>\"사유를 말하십시오.\" 재판장의 변조된 목소리가 처음으로, 반 박자 늦었다.<\/p>\n<p>\"이 증거가 증명하는 건 피고인의 죄가 아닙니다. 피고인이 누구의 딸인가, 그것뿐입니다.\" 시헌이 고개를 들었다. \"헌법 제13조 제3항. 누구도 친족의 행위로 불이익한 처우를 받지 아니한다.\"<\/p>\n<p>긴 정적이 흘렀다.<\/p>\n<p>\"…공소취소를 받아들입니다. 폐정.\"<\/p>\n<p>종이 한 번 울렸다.<\/p>\n<hr class=\"scene\">\n<p>사람들이 빠져나갔다. 이안이 내 옆을 지나며 \"미쳤네, 둘 다\"라고 중얼거렸다. 달래는 계단 입구에서 나를 한참 보다가, 아무 말 없이 먼저 올라갔다. 위에서 망을 보겠다는 뜻이었다.<\/p>\n<p>흑유리 너머의 불빛이 하나씩 꺼졌다. 마지막 불이 꺼지자 법정에는 비상등 두 개만 남았다. 붉은빛이 돌벽을 핏물처럼 물들였다.<\/p>\n<p>시헌이 검사석에서 걸어 나왔다. 구두 소리가 돌바닥에 또각, 또각. 그가 피고인석 난간 앞에서 멈췄다. 쇠 난간 하나를 사이에 두고.<\/p>\n<p>\"니가 나를 끝낼 수 있었잖아.\"<\/p>\n<p>내가 먼저 말했다. 목소리가 갈라졌지만 걸리지 않았다.<\/p>\n<p>\"넌 나를 끝낼 수 있었고.\"<\/p>\n<p>\"왜 안 읽었어.\"<\/p>\n<p>\"너는 왜 안 냈어.\"<\/p>\n<p>대답하지 않았다. 둘 다. 대답하는 순간 무언가가 끝날 것 같았다. 아니면, 시작되거나.<\/p>\n<p>나는 법복 주머니에서 그것을 꺼냈다. 그가 빈 강의실에서 내 손에 쥐여준 흑요석 반지. 이틀 동안 한 번도 손에서 놓지 않은 것.<\/p>\n<p>난간 위에 올려놓았다. 쇠와 돌이 부딪히는 작은 소리가 텅 빈 법정에 또렷하게 울렸다.<\/p>\n<p>\"이거 낀 손을 찾을 거야. 너랑 같이.\"<\/p>\n<p>시헌이 반지를 내려다봤다. 비상등의 붉은빛이 검은 돌 위에서 미끄러졌다. 그는 반지를 집지 않았다. 대신 반지를 덮은 내 손 위에 자기 손을 얹었다. 차가운 손이 천천히 데워졌다.<\/p>\n<p>그가 손을 거뒀다. 그리고 난간을 넘어왔다. 한 손으로 쇠기둥을 짚고, 가볍게. 거리가 사라졌다. 그의 셔츠에서 서늘한 섬유유연제 냄새, 그 아래 땀 냄새, 그리고 법정의 밀랍 냄새.<\/p>\n<p>\"너희 아버지는 우리 부모님을—\"<\/p>\n<p>\"우리 아빠는 아니야.\"<\/p>\n<p>\"나는 15년 동안 탄원서를 냈어.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"이러면 안 돼, 우리는.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>그의 손이 내 얼굴 옆으로 올라왔다가 멈췄다. 닿지 않았다. 그의 손끝이 떨렸다. 나는 그 손목을 잡았다. 분필 냄새 나던 빈 강의실에서 하지 못했던 일을.<\/p>\n<p>그리고 그를 끌어당겼다.<\/p>\n<p>입술이 부딪혔다. 이가 부딪힐 만큼 서툴고, 거칠었다. 내 등이 피고인석 난간에 닿았다. 쇠가 법복 너머로 차가웠다. 그의 손이 내 뒷머리를 감쌌다. 머리가 난간에 부딪히지 않게.<\/p>\n<p>분노의 맛이었다. 15년 묵은 소금기. 그리고 그 아래, 처음 느끼는 단맛.<\/p>\n<p>그가 숨을 쉬려 떨어졌다가, 다시 왔다. 이번엔 천천히. 확인하듯이. 내 손이 그의 셔츠 깃을 움켜쥐었다. 그 아래에서 심장이 뛰었다. 빨랐다. 내 것과 같은 속도로.<\/p>\n<p>이마를 맞댄 채 그가 속삭였다.<\/p>\n<p>\"너 지금, 한 번도 안 더듬었어.\"<\/p>\n<p>\"말할 게 없었으니까.\"<\/p>\n<p>\"거짓말.\"<\/p>\n<p>\"응. 거짓말.\"<\/p>\n<p>나는 웃었다. 큐티클을 뜯을 생각은 들지 않았다. 손이 둘 다 그를 붙잡고 있어서.<\/p>\n<hr class=\"scene\">\n<p>종이 울렸다.<\/p>\n<p>아무도 없는 법정에서, 천장의 종이 혼자.<\/p>\n<p>한 번. 두 번. 세 번. 쇳소리가 멈추지 않았다. 우리는 동시에 떨어졌다. 시헌의 손이 반사적으로 내 손목을 쥐었다.<\/p>\n<p>법대 뒤 스크린에 불이 들어왔다. 흰 글씨가 한 줄씩.<\/p>\n<div class=\"doc\">판례 변경.<\/div>\n<div class=\"doc\">검사의 공소취소는 직무유기로 본다.<\/div>\n<div class=\"doc\">서기 백시헌을 해임한다.<\/div>\n<div class=\"doc\">그의 봉인 증거를 집행한다.<\/div>\n<p>스크린이 바뀌었다. 낯익은 문서가 떴다. 내가 방금 반으로, 다시 반으로 접어 안주머니에 넣은 바로 그 종이. 사본이었다. 판관회는 처음부터 원본 같은 건 필요 없었다.<\/p>\n<p>나는 안주머니를 움켜쥐었다. 접힌 봉투의 모서리가 손바닥을 찔렀다.<\/p>\n<p>\"아니야.\" 목소리가 나오지 않았다. \"아, 아니야. 나는 안 냈어. 안 냈다고—\"<\/p>\n<p>시헌은 스크린을 보지 않았다. 나를 보고 있었다. 이상할 만큼 조용한 얼굴로.<\/p>\n<p>\"알아.\" 그가 말했다. \"네가 안 낸 거, 내가 알아.\"<\/p>\n<p>그가 난간 위에 남아 있던 반지를 집었다. 내 손바닥을 펴고, 그 위에 다시 올려놓고, 손가락을 하나씩 접어 감쌌다. 마지막 손가락을 접을 때 그의 손이 조금 오래 머물렀다.<\/p>\n<p>\"찾아. 이거 낀 손.\"<\/p>\n<p>그는 그 말만 남기고 계단을 올라갔다. 구두 소리가 돌계단을 타고 멀어졌다. 나는 그를 부르지 못했다. 이번엔 첫 음절조차 나오지 않았다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-4 / 07:00]<\/div>\n<p>달래 방 바닥에서, 달래와 나는 한숨도 못 잔 얼굴로 휴대폰을 봤다. 새로고침할 때마다 숫자가 올라갔다.<\/p>\n<p>케이스북 1위 글.<\/p>\n<div class=\"doc\">[실명] 1L 백시헌, 지난 3년간 동기 7명 인생 끝낸 익명 폭로범<\/div>\n<p>댓글 2,431개.<\/p>\n<p><span class=\"sys\">이 새끼 한결 아들 아님?<\/span> <span class=\"sys\">7명이면 사람 몇 명 죽인 거냐<\/span> <span class=\"sys\">얼음 왕자 실체 ㅋㅋ 법학관 나오기만 해봐<\/span><\/p>\n<p>스크롤을 내릴 때마다 문장이 날카로워졌다. 그가 3년 동안 써온 문장들과 똑같은 온도로.<\/p>\n<p>시헌에게 전화를 걸었다. 신호가 가다 끊겼다. 다시 걸었다. 전원이 꺼져 있다는 안내 음성. 문자를 보냈다. 읽음 표시가 뜨지 않았다.<\/p>\n<p>\"[속보]….\" 달래가 입을 열었다가 닫았다. 처음이었다. 그녀가 헤드라인을 끝까지 말하지 못한 건.<\/p>\n<p>안주머니의 접힌 봉투를 꺼냈다. 밤새 쥐고 있어서 모서리가 눅눅해져 있었다. 나는 이걸 지켰다. 그리고 아무것도 지키지 못했다.<\/p>\n<p>판례집을 열었다. 당사자 명단. 그의 이름 옆에 붉은 줄이 그어져 있었다 — '보호 해제'.<\/p>","chars":4858},{"title":"가면","html":"<div class=\"timer\">[D-4 / 08:40]<\/div>\n<p>법학관 로비에 들어서자마자 셔터 소리가 들렸다.<\/p>\n<p>찰칵, 찰칵, 찰칵. 수십 개의 휴대폰이 한 방향을 향해 있었다. 둥글게 모인 동기들 한가운데, 백시헌이 서 있었다. 새벽 제0법정의 그 셔츠 그대로였다.<\/p>\n<p>누군가 테이크아웃 컵을 던졌다.<\/p>\n<p>갈색 액체가 그의 가슴팍에서 터졌다. 식은 아메리카노 냄새가 로비에 확 번졌다. 커피가 셔츠를 타고 흘러 바닥에 뚝뚝 떨어졌다. 그는 피하지도, 닦지도 않았다.<\/p>\n<p>\"7명이라며. 다음은 누구 쓸 건데?\"<\/p>\n<p>\"얼음 왕자님, 한마디만 해 주세요.\"<\/p>\n<p>카메라 플래시가 그의 얼굴을 하얗게 지웠다.<\/p>\n<p>나는 걸어 들어갔다. 어깨로 사람들을 밀면서. 누군가의 팔꿈치가 옆구리를 찔렀다. 그의 손목을 잡았다. 젖어 있었다. 차가웠다.<\/p>\n<p>\"가.\"<\/p>\n<p>그를 끌고 로비를 가로질렀다. 등 뒤에서 셔터 소리가 두 배로 커졌다.<\/p>\n<hr class=\"scene\">\n<p>법학관 뒤편 비상계단. 철문이 등 뒤에서 쾅 닫히자 바깥 소음이 끊겼다. 시멘트 냄새와 담배꽁초 냄새.<\/p>\n<p>휴대폰이 떨었다. 케이스북 알림.<\/p>\n<div class=\"doc\">[실명] 정진서, 백시헌과 공범설… 로비에서 손잡고 도주 (영상)<\/div>\n<p>조회수가 숫자가 아니라 속도로 올라갔다.<\/p>\n<p>\"바보야.\" 시헌이 말했다. 커피 방울이 턱 끝에서 떨어졌다. \"너까지 끌려 들어가.\"<\/p>\n<p>\"이미 들어가 있어.\"<\/p>\n<p>달래가 계단 위층에서 쿵쿵 내려왔다. 숨을 헐떡이며, 손에는 편의점 물티슈 한 통.<\/p>\n<p>\"[단독] 정진서, 공범설 3분 만에 사실로 판명… 본인 '어쩌라고.'\" 그녀가 물티슈를 시헌의 가슴팍에 거칠게 문질렀다. \"가만있어. 너 좋아서 하는 거 아니야. 증거 인멸 중이야.\"<\/p>\n<p>시헌이 처음으로, 아주 희미하게 웃었다.<\/p>\n<p>웃음은 오래가지 않았다. 판례집 앱을 열자 그의 화면만 달랐다. 갑호증 보관 목록이 비어 있었다. 투표 그래프도, 로그 열람 권한도 없었다. 서기의 검은 아이콘 대신 회색 자물쇠 하나.<\/p>\n<p>\"보호 해제.\" 그가 말했다. \"아무것도 없어. 이제 나는 당사자도 서기도 아니야. 그냥 표적이야.\"<\/p>\n<p>\"그럼 우리도 아무것도 없네.\" 달래가 물티슈를 구겨 던졌다. \"제4공판까지 이틀, 최종 공판까지 사흘 남짓. 우리 손에 있는 건 낡은 공판 기록 한 장이랑, 조윤강이라는 이름 하나.\"<\/p>\n<p>\"2011년 재판장이 지금 재판장이란 보장은 없어.\" 내가 말했다. \"재판장은 매년 바뀐다며.\"<\/p>\n<p>시헌이 고개를 끄덕였다. 그리고 한참 계단 난간의 녹슨 페인트를 손톱으로 긁었다.<\/p>\n<p>\"하나 있어.\"<\/p>\n<p>우리 둘이 동시에 그를 봤다.<\/p>\n<p>\"서기는 기일마다 판결문 원본을 재판장실에 올려. 직접 들고.\" 그가 말했다. \"제0법정 법대 뒤에 문이 하나 있어. 판사실 통로. 그 끝이 합의실이야. 판관들이 매달 합의하는 곳.\"<\/p>\n<p>\"언제.\"<\/p>\n<p>\"오늘 밤. 02:00.\" 그의 목소리가 낮아졌다. \"서기 권한이 없어도 통로는 기억해. 꺾이는 데가 일곱 번. 계단 두 개. 바닥에 물 고이는 데 하나.\"<\/p>\n<p>달래가 그를 오래 노려봤다. 기자의 눈이었다. 문장 속 주어를 찾는 눈.<\/p>\n<p>\"너 따라갔다가 우리 셋 다 갇히면?\"<\/p>\n<p>\"그럼 내가 제일 먼저 숨 못 쉬겠지.\" 시헌이 말했다. \"좁은 데서는.\"<\/p>\n<p>달래의 입이 다물렸다. 그녀가 길게 한숨을 쉬었다.<\/p>\n<p>\"그려 봐. 그 통로.\"<\/p>\n<p>시헌이 계단참에 쪼그려 앉아, 내 공책 뒷장에 볼펜으로 선을 그었다. 망설임이 없었다. 법대 뒤 판자벽, 세 번째 판자. 오른쪽, 오른쪽, 왼쪽. 내리막 계단 열네 칸. 물웅덩이. 다섯 번째 모퉁이에 X 표시.<\/p>\n<p>\"여긴 뭐야.\"<\/p>\n<p>\"좁아져.\" 그가 볼펜 끝을 X 위에 오래 대고 있었다. 잉크가 번져 점이 커졌다. \"옆으로 서야 지나가.\"<\/p>\n<p>나는 그 X를 한 번 보고 외웠다. 선 하나, 꺾임 하나까지. 종이를 접어 주머니에 넣는데, 손끝에 반지가 닿았다. 그가 쥐여준 검은 돌. 아직 내 주머니에 있었다.<\/p>\n<p>\"합의실 들어가면 판관들은 가면 안 써.\" 시헌이 덧붙였다. \"자기들끼리니까. 재판장만 써. 재판장 얼굴은 판관들도 몰라. 서기도.\"<\/p>\n<p>\"그럼 오늘 처음 보는 거네.\" 달래가 휴대폰의 녹음 앱을 켰다 껐다 하며 말했다. \"누가 이 판을 짜는지.\"<\/p>\n<p>그리고 그녀가 손가락 세 개를 펼쳤다. 우리 셋.<\/p>\n<p>\"[기획] 오늘의 리더, 전직 서기 백시헌… 실패 시 책임은 전액 본인 부담.\"<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-3 / 01:48]<\/div>\n<p>제0법정은 비어 있었다. 비상등의 붉은빛 아래, 피고인석 난간이 어제의 일을 기억하는 것처럼 번들거렸다. 나는 그쪽을 보지 않으려 했다.<\/p>\n<p>시헌이 법대 뒤 판자벽을 손바닥으로 더듬었다. 세 번째 판자 아래쪽, 못 머리 하나를 누르자 벽이 안쪽으로 반 뼘 밀려났다. 차갑고 축축한 바람이 새어 나왔다.<\/p>\n<p>통로는 어깨 너비였다.<\/p>\n<p>벽돌 벽이 양쪽에서 옷깃을 스쳤다. 천장이 낮아 고개를 숙여야 했다. 휴대폰 손전등을 손바닥으로 가려 바닥만 비췄다. 곰팡이와 녹물 냄새. 어디선가 물이 똑, 똑 떨어졌다.<\/p>\n<p>첫 번째 모퉁이. 두 번째. 시헌의 발걸음은 정확했다. 셋째 모퉁이에서 바닥의 물웅덩이를 그가 손짓으로 알렸다. 우리는 벽에 등을 붙이고 옆걸음으로 지나갔다.<\/p>\n<p>다섯 번째 모퉁이에서 그가 멈췄다.<\/p>\n<p>통로가 더 좁아져 있었다. 몸을 옆으로 세워야 겨우 들어갈 틈. 위에서 낡은 배관이 내려와 있었다. 시헌이 그 틈 앞에서 숨을 들이켰다.<\/p>\n<p>숨이 걸렸다.<\/p>\n<p>다시 들이켰다. 또 걸렸다. 짧고, 얕고, 빠른 숨. 그의 손이 벽돌을 긁었다. 손전등 불빛 끝에서 그의 목줄기에 땀이 번들거렸다. 이마를 벽에 댄 채 그가 중얼거렸다.<\/p>\n<p>\"…문틈. 손가락 두 개.\"<\/p>\n<p>옷장이었다. 그는 지금 열세 살이었다.<\/p>\n<p>나는 그의 손을 잡았다. 젖은 손바닥이 미끄러졌다. 다시 잡았다. 그리고 그 손을 내 가슴 왼쪽에 댔다. 법복 천 너머로.<\/p>\n<p>\"내 심장 세.\"<\/p>\n<p>그의 손가락이 굳었다.<\/p>\n<p>\"하나.\" 내가 속삭였다. \"둘.\"<\/p>\n<p>쿵. 쿵. 내 심장이 그의 손바닥을 밀어냈다. 빨랐다. 나도 무서웠으니까. 그래도 일정했다.<\/p>\n<p>\"셋. 넷.\"<\/p>\n<p>그의 숨이 내 숫자를 따라왔다. 다섯에서 걸렸다. 여섯에서 풀렸다. 일곱, 여덟. 그의 손바닥에서 떨림이 조금씩 빠져나갔다. 그 손이 내 심장 위에서 천천히 데워졌다.<\/p>\n<p>\"열.\" 그가 먼저 말했다. 목소리가 갈라져 있었다.<\/p>\n<p>뒤에서 달래가 이를 악물고 속삭였다.<\/p>\n<p>\"[단독] 두 사람, 내가 보는 앞에서 이러기냐.\"<\/p>\n<p>웃음이 터질 뻔했다. 셋 다 동시에 입을 틀어막았다. 어깨가 들썩였다. 좁은 통로에서 세 사람의 숨죽인 웃음이 벽돌에 부딪혀 흩어졌다. 무섭고, 우스꽝스럽고, 이상하게 따뜻했다.<\/p>\n<p>시헌이 몸을 옆으로 세웠다. 그리고 틈 안으로 들어갔다. 내 손을 놓지 않은 채로.<\/p>\n<hr class=\"scene\">\n<p>일곱 번째 모퉁이 끝에 무거운 벨벳 커튼이 있었다.<\/p>\n<p>커튼 너머는 둥근 방이었다. 촛대 다섯 개가 타고 있었다. 밀랍 타는 냄새가 코를 찔렀다. 원탁 하나, 등받이 높은 의자들. 판관들은 아직 오지 않았다.<\/p>\n<p>정면 벽에 액자 하나. 누렇게 바랜 한지에 붓글씨.<\/p>\n<div class=\"doc\">法은 누가 만드는가가 아니라, 누가 고르는가로 선다.<br>一九六一年 九月.<\/div>\n<p>그 아래 다섯 개의 이름 대신, 다섯 개의 반지 자국. 붉은 인주에 반지를 눌러 찍은 둥근 도장이 나란히 다섯.<\/p>\n<p>\"서약문.\" 시헌이 속삭였다.<\/p>\n<p>나는 주머니 속 반지를 쥐었다. 인주 도장의 둥근 테두리, 가운데 오목하게 눌린 자국. 손안의 돌과 크기가 똑같았다. 65년 동안 이 방에서 사람의 인생을 고른 손가락들이, 같은 돌을 끼고 있었다.<\/p>\n<p>촛불이 흔들렸다. 내 그림자가 서약문 위로 길게 늘어졌다가 줄어들었다.<\/p>\n<p>그 옆 벽에는 나무 명패가 줄지어 걸려 있었다. 역대 재판장. 촛불에 금박 글씨가 흔들렸다. 나는 한 줄씩 훑었다. 사진처럼, 하나도 빠뜨리지 않고.<\/p>\n<p><span class=\"sys\">第一期 一九六五<\/span> … <span class=\"sys\">第三十期 一九九四<\/span> …<\/p>\n<div class=\"doc\">第四十七期 二〇一一 — 曺允剛<\/div>\n<p>조윤강. 거기 있었다. 그리고 다음 칸들은 해마다 다른 이름이었다. 2012, 2013, 2014. 열네 개의 낯선 이름들.<\/p>\n<p>그리고 맨 마지막 칸.<\/p>\n<div class=\"doc\">第六十二期 二〇二六 —<\/div>\n<p>이름이 없었다. 명패 위에 검은 천이 덮여 있었다.<\/p>\n<p>\"과거야.\" 달래가 숨을 내쉬었다. \"조윤강은 15년 전 재판장. 지금은 다른 놈이야.\"<\/p>\n<p>나는 대답하지 않았다. 검은 천의 주름에서 눈을 뗄 수 없었다. 천 아래 금박 글씨의 끝이 아주 조금, 촛불을 받아 반짝였다. 세 글자 분량이었다.<\/p>\n<p>복도 쪽에서 발소리가 났다.<\/p>\n<p>우리는 커튼 뒤로 몸을 밀어 넣었다. 벨벳이 얼굴에 닿았다. 먼지 냄새가 목구멍을 긁었다. 시헌의 팔이 내 어깨 뒤에서 굳었다. 달래의 숨이 내 귀 옆에서 멎었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-3 / 02:00]<\/div>\n<p>판관들이 들어왔다. 커튼 틈으로 손만 보였다. 의자를 끄는 손, 서류를 펼치는 손. 왼손 약지마다 흑요석이 촛불을 삼키고 있었다.<\/p>\n<p>마지막으로 들어온 사람은 가면을 쓰고 있었다.<\/p>\n<p>공판 때와 같은 흰 가면, 같은 검은 법복. 그가 원탁 상석에 앉았다. 판관들이 일제히 일어섰다가 앉았다.<\/p>\n<p>그가 가면의 끈을 풀었다.<\/p>\n<p>천천히. 아주 정중하게. 가면이 원탁 위에 내려놓이는 소리가 났다.<\/p>\n<p>백발. 단정하게 넘긴 머리. 온화한 눈매.<\/p>\n<p>형사소송법 첫 강의 날, 강단 끝에서 출석부도 펼치지 않고 내 이름을 부르던 그 얼굴.<\/p>\n<p>조윤강이었다.<\/p>\n<p>커튼을 쥔 손가락이 저절로 오그라들었다. 엄지가 검지 큐티클을 파고들었다. 피가 맺히는 따끔한 감각. 귀에서 다시 물소리가 났다. 강의실에서처럼.<\/p>\n<p>\"올해만큼은 제가 직접 맡겠다고 했지요.\" 그가 웃었다. 변조기 없는 목소리였다. 낮고, 부드럽고, 따뜻했다. \"15주년이니까요.\"<\/p>\n<p>판관 몇이 낮게 웃었다.<\/p>\n<p>\"오늘 합의 전에, 질문 하나 드리겠습니다.\" 그가 원탁을 손끝으로 톡톡 두드렸다. \"무죄추정의 원칙이 깨지는 순간은 언제입니까?\"<\/p>\n<p>침묵. 그리고 누군가 헛기침을 했다.<\/p>\n<p>\"판결이 확정될 때입니다.\"<\/p>\n<p>\"모범답안이군요. 15년 전엔 저도 그렇게 썼습니다.\" 조윤강이 고개를 기울였다. \"그런데 오늘 밤은, 다른 대답을 듣고 싶습니다.\"<\/p>\n<p>그가 의자를 조금 돌렸다.<\/p>\n<p>우리 쪽으로가 아니었다. 그는 커튼을 보지 않았다. 원탁 위 촛불만, 다정하게 내려다보고 있었다.<\/p>\n<p>시헌의 손이 내 손목을 꽉 쥐었다. 달래의 손톱이 내 팔을 파고들었다.<\/p>\n<p>그가 우리가 숨은 커튼 쪽을 보지도 않고 말했다.<\/p>\n<p>\"정진서 학생. 무죄추정의 원칙이 깨지는 순간은 언제입니까? — 대답할 때까지 기다리지요. 법정은 원래 그런 곳이니까.\"<\/p>","chars":4799},{"title":"한결","html":"<div class=\"timer\">[D-3 / 02:09]<\/div>\n<p>나는 커튼을 걷었다.<\/p>\n<p>벨벳이 손바닥에 축축하게 감겼다. 먼지가 형광등 빛 속으로 떠올랐다. 뒤에서 달래가 내 법복 자락을 잡아당겼지만, 나는 이미 합의실 바닥을 밟고 있었다.<\/p>\n<p>조윤강은 놀라지 않았다. 그는 찻잔을 하나 더 꺼내 탁자에 놓았다. 도자기가 유리 상판에 닿는 소리가 작게, 정확하게 울렸다.<\/p>\n<p>\"앉아요. 15년 만에 피고인 가족과 대화하는군요.\"<\/p>\n<hr class=\"scene\">\n<p>홍차 냄새가 났다. 베르가모트. 강의실 교탁 위 텀블러에서 늘 풍기던 그 냄새였다.<\/p>\n<p>방청석에서 내려온 판관들은 이미 흩어지고 없었다. 벽에는 1961년의 서약문이 액자에 걸려 있었다. 다섯 개의 이름, 다섯 개의 검은 반지 그림.<\/p>\n<p>\"저, 저는—\"<\/p>\n<p>\"천천히 하세요.\"<\/p>\n<p>그가 찻잔을 내 쪽으로 밀었다. 김이 내 턱에 닿았다. 나는 손대지 않았다.<\/p>\n<p>\"아, 아빠 사건. 당신이 기소했어요. 그리고 그날 밤, 이 방에 있었어요.\"<\/p>\n<p>\"있었죠. 그게 무슨 죄입니까?\"<\/p>\n<p>그는 홍차를 한 모금 마셨다. 목울대가 천천히 움직였다. 시헌이 내 등 뒤에 섰다. 숨소리가 얕고 빨랐다. 좁은 통로를 기어 온 탓이었다.<\/p>\n<p>\"이시헌 군도 앉지요. 자네 자리는 늘 거기였잖아요.\"<\/p>\n<p>시헌은 앉지 않았다.<\/p>\n<p>조윤강이 웃었다. 콜드콜에서 내가 더듬을 때마다 짓던, 기다려주는 얼굴.<\/p>\n<p>\"가요. 오늘은 기일이 아닙니다. 최종 공판에서 봅시다.\"<\/p>\n<p>그가 찻잔을 내려놓았다.<\/p>\n<p>\"그날은 날짜가 좋아요.\"<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-3 / 22:00]<\/div>\n<p>남은 시간은 60시간이었다.<\/p>\n<p>강남대로의 밤은 젖은 아스팔트 냄새를 풍겼다. 법무법인 한결 사옥은 유리로 된 칼날처럼 서 있었다. 32층 기록실. 대리운전 회사 배차실장의 말이 맞다면, 15년 전 사라진 콜 기록의 하드가 거기 있었다.<\/p>\n<p>\"[현장] 로스쿨생 세 명, 국내 최대 로펌에 '청소하러' 출근.\"<\/p>\n<p>달래가 청소 용역 조끼의 지퍼를 올리며 속삭였다. 형광 주황색 조끼에서 섬유유연제 대신 락스 냄새가 났다. 그녀는 오후 내내 용역 업체 단톡방에 '대타'로 끼어들어 출입 명단에 이름 세 개를 올려놓았다.<\/p>\n<p>\"근데 이 조끼, 누가 입던 거야. 겨드랑이가 아직 따뜻한 기분이야.\"<\/p>\n<p>\"조용히 해.\"<\/p>\n<p>시헌이 지갑에서 카드 한 장을 꺼냈다. 은회색 바탕에 한결 로고, 그리고 그의 사진. <span class=\"sys\">가족 출입 — 백시헌<\/span>.<\/p>\n<p>\"아직 살아 있어?\"<\/p>\n<p>\"아버지는 자기 물건을 잘 안 버려.\"<\/p>\n<p>카드를 쥔 그의 엄지가 사진 속 자기 얼굴을 문질렀다. 열여섯 살쯤의 얼굴이었다. 입양되고 3년 뒤. 웃지 않는 소년이 플라스틱 안에서 우리를 올려다봤다.<\/p>\n<p>그 말에 달래가 그를 힐끗 봤다. 주어 없는 문장. 그녀가 싫어하는 종류의 문장이었다.<\/p>\n<hr class=\"scene\">\n<p>직원용 출입문의 게이트에 카드를 대자 초록 불이 들어왔다. 삑. 짧은 전자음이 로비의 대리석에 튕겼다. 나는 청소 카트를 밀며 시헌의 뒤를 따랐다. 바퀴 하나가 덜그럭거렸다.<\/p>\n<p>엘리베이터 안은 거울이었다. 주황 조끼를 입은 나, 마스크를 쓴 달래, 그리고 정장 차림의 시헌. 그의 이마에 땀이 맺혀 있었다.<\/p>\n<p>좁은 상자. 닫힌 문.<\/p>\n<p>그의 오른손이 바지 옆선을 쥐었다 폈다. 나는 카트 손잡이에서 손을 떼고 그의 손등에 손가락 하나를 댔다. 맥박이 손끝까지 튀었다.<\/p>\n<p>\"하나.\"<\/p>\n<p>내가 입 모양으로 말했다. 그가 눈을 감았다.<\/p>\n<p>\"둘.\"<\/p>\n<p>32층. 땡. 문이 열리자 그가 먼저 숨을 뱉었다.<\/p>\n<p>복도에는 카펫이 깔려 있어 발소리가 죽었다. 유리 벽 너머로 회의실들이 이어졌다. 밤 열 시가 넘었는데도 절반은 불이 켜져 있었다. 넥타이를 푼 남자들, 서류 더미, 식은 배달 음식 냄새.<\/p>\n<p>복도 끝, 가장 큰 방 앞에서 시헌의 걸음이 반 박자 늦어졌다.<\/p>\n<p>반투명 유리문. 블라인드가 반쯤 내려와 있었다. 그 틈으로 손 하나가 보였다. 찻잔을 돌리고 있는 왼손. 약지에 검은 돌.<\/p>\n<p>나는 카트를 멈추지 않았다. 이 층에서 반지를 낀 손은 그것 하나가 아니었다. 회의실마다 금반지, 은반지, 대학 졸업 반지가 서류 위를 오갔다. 검은 오닉스는 강남 로펌에서 넥타이핀만큼 흔했다.<\/p>\n<p>\"누구 방이야?\"<\/p>\n<p>\"아버지.\"<\/p>\n<p>시헌은 그 이상 말하지 않았다. 그의 눈은 블라인드 틈에 아주 잠깐 머물렀다가 떨어졌다. 유리문 너머에서 찻잔이 받침에 내려앉는 소리가 났다.<\/p>\n<p>복도 모퉁이를 돌자 남자 하나가 탕비실에서 나오고 있었다. 셔츠 소매를 걷은 젊은 어소시에이트. 손에 든 컵라면에서 김이 올랐다. 그의 눈이 시헌의 얼굴에서 멈췄다.<\/p>\n<p>\"어, 혹시—\"<\/p>\n<p>그의 다른 손에 휴대폰이 들려 있었다. 화면은 케이스북이었다. 어제 아침부터 내려오지 않는 1위 글. 실명, 사진, 댓글은 이제 4천 개가 넘었다.<\/p>\n<p>시헌의 어깨가 굳었다. 나는 카트를 남자 쪽으로 밀었다. 덜그럭거리던 바퀴가 그의 구두코 앞에서 멈췄다.<\/p>\n<p>\"죄송합니다, 쓰레기통 비워드릴게요.\"<\/p>\n<p>내 목소리였다. 더듬지 않았다. 나는 그의 책상 옆 휴지통을 들어 카트에 쏟았다. 구겨진 서면 초안, 귤껍질, 에너지 드링크 캔. 시큼한 냄새가 올라왔다.<\/p>\n<p>달래가 끼어들었다. 마스크 위로 눈웃음을 지으며, 속사포로.<\/p>\n<p>\"아이고 변호사님, 라면 국물 여기 버리시면 안 돼요. 저번에 누가 버려서 배관 막혀가지고 저희 팀장님 시말서 썼잖아요. 그 팀장님이 저희 이모거든요.\"<\/p>\n<p>남자는 얼떨떨한 얼굴로 컵라면을 내려다봤다. 그사이 시헌은 모퉁이 너머로 사라져 있었다.<\/p>\n<p>\"…아, 네. 죄송합니다.\"<\/p>\n<p>남자가 탕비실로 되돌아갔다. 달래가 내 옆구리를 팔꿈치로 찔렀다.<\/p>\n<p>\"[단독] 정진서, 처음으로 안 더듬어… 이유는 쓰레기통.\"<\/p>\n<p>나는 웃지 못했다. 손바닥에 귤껍질의 즙이 끈적하게 남아 있었다. 그리고 등 뒤로, 그 남자가 다시 휴대폰 화면을 켜는 빛이 느껴졌다.<\/p>\n<hr class=\"scene\">\n<p>기록실은 공기부터 달랐다.<\/p>\n<p>문이 열리자 냉기가 얼굴을 덮었다. 항온항습기가 낮게 웅웅거렸다. 철제 선반이 끝없이 이어졌고, 그 사이로 형광등이 푸르게 떨렸다. 문서 파쇄기 냄새 — 뜨거워진 종이와 기계 기름이 섞인 냄새가 코끝에 걸렸다.<\/p>\n<p>\"감사 보존 규정. 소송 관련 저장매체는 20년간 전원 유지.\"<\/p>\n<p>시헌이 선반 번호를 따라 걸으며 말했다. 안쪽에 서버 랙처럼 생긴 보존함이 늘어서 있었다. 상자마다 녹색 불이 깜빡였다. 꺼지지 않은 기억들.<\/p>\n<p>\"B 구역. 2011.\"<\/p>\n<p>달래는 문 앞에 남았다. 무전기 대신 휴대폰을 귀에 대고, 용역 단톡방과 복도 CCTV 화면을 번갈아 봤다.<\/p>\n<p>\"30분. 그 이상은 내 입담으로도 안 돼.\"<\/p>\n<p>나는 선반의 라벨을 훑었다. B-1101, B-1104, B-1117. 숫자가 머릿속에서 저절로 줄을 섰다. 한 번 본 건 잊지 않는다. 그게 이번엔 축복이길 바랐다.<\/p>\n<hr class=\"scene\">\n<p>찾는 데 12분이 걸렸다.<\/p>\n<p>그동안 시헌은 내 맞은편 선반에서 상자를 하나씩 확인했다. 철제 선반 너머로 그의 얼굴이 칸칸이 잘려 보였다.<\/p>\n<p>\"그날 밤.\"<\/p>\n<p>그가 먼저 말했다. 상자를 내려놓는 손이 멈춰 있었다.<\/p>\n<p>\"옷장 안이었어. 문틈으로 빛이 한 줄 들어왔어. 그 빛 안에서 손이 움직였고.\"<\/p>\n<p>나는 라벨을 짚던 손가락을 멈췄다. 항온항습기 소리만 남았다.<\/p>\n<p>\"반지 낀 손이 나가고 나서, 누가 또 왔어.\"<\/p>\n<p>\"…누가.\"<\/p>\n<p>\"몰라. 얼굴은 못 봤어. 옷장 문이 조금 열렸고, 누가 내 입을 손바닥으로 막았어. 그리고 속삭였어.\"<\/p>\n<p>그가 눈을 감았다. 15년 전의 옷장 속으로 들어가는 사람처럼.<\/p>\n<p>\"소리 내지 마라.\"<\/p>\n<p>선반의 금속이 내 손바닥에 차갑게 박혔다.<\/p>\n<p>\"그 손에서 담배 냄새가 났어. 피 냄새도. 근데 이상하지. 무섭지 않았어. 그 목소리는 — 날 죽이려는 사람 목소리가 아니었어.\"<\/p>\n<p>\"법정에서 그 얘기 했어?\"<\/p>\n<p>\"검사가 묻지 않았어.\"<\/p>\n<p>조윤강. 홍차를 마시던 목울대.<\/p>\n<p>나는 아빠의 목소리를 떠올리려 했다. 접견실 유리 너머, 녹음 램프 아래서 \"밥은\" 하고 묻던 목소리. 낮고, 갈라지고, 말끝을 삼키는 목소리.<\/p>\n<p>소리 내지 마라.<\/p>\n<p>그 다섯 음절을 아빠의 목소리로 겹쳐보는 순간, 목구멍이 막혔다. 나는 고개를 흔들었다. 그럴 리 없다. 그럴 리 없어야 했다. 아빠가 그 집 안에 있었다면, 그건 아빠가 범인이라는 뜻일 수도 있었으니까.<\/p>\n<p>\"진서야.\"<\/p>\n<p>시헌이 선반 너머에서 나를 봤다.<\/p>\n<p>\"네 아버지 목소리, 기억나?\"<\/p>\n<p>\"여, 열한 살 때 이후로는—\"<\/p>\n<p>나는 말을 끝내지 못했다. 그는 재촉하지 않았다. 기다렸다. 선반 칸 사이로 그의 눈만 보였다. 피해자의 아들이 가해자의 딸에게, 가해자의 목소리를 묻고 있었다.<\/p>\n<p>\"…모르겠어.\"<\/p>\n<p>거짓말은 아니었다. 큐티클은 멀쩡했다. 그게 더 무서웠다.<\/p>\n<p>달래의 목소리가 휴대폰 스피커로 낮게 끼어들었다.<\/p>\n<p>\"경비 순찰 3분 전. 3층부터 올라오고 있어. 둘이 무슨 얘기 하는지 모르겠는데, 키스는 나가서 해.\"<\/p>\n<hr class=\"scene\">\n<p>B-1129.<\/p>\n<p>맨 아래 칸, 가장 안쪽이었다. 무릎을 꿇자 바닥의 냉기가 청바지를 뚫고 올라왔다. 회색 보존함에 손글씨 라벨. <span class=\"sys\">2011 / 대리운전 ○○ / 압수 외 임의제출 / 보존<\/span>.<\/p>\n<p>압수가 아니라 임의제출. 누가, 누구에게. 그 단어 하나에 위가 뒤틀렸다.<\/p>\n<p>녹색 불이 깜빡이고 있었다. 살아 있었다.<\/p>\n<p>\"임의제출이면, 누가 직접 들고 왔다는 뜻이야.\"<\/p>\n<p>시헌이 라벨을 손가락으로 짚었다. 제출자 칸은 수정액으로 하얗게 지워져 있었다. 그 위를 손톱으로 긁자 하얀 가루가 떨어졌지만, 아래의 글씨는 이미 종이째 긁혀 나가 있었다.<\/p>\n<p>시헌이 보존함의 잠금을 풀었다. 그의 양자 카드가 여기서도 통했다. 삑. 안에서 은색 하드디스크가 미끄러져 나왔다. 손바닥 위에서 묵직하고 따뜻했다. 15년 동안 꺼지지 않은 기계의 체온.<\/p>\n<p>달래의 노트북에 케이블을 꽂았다. 화면이 깜빡였다. 드라이브 아이콘이 떴다.<\/p>\n<div class=\"doc\">CALL_LOG_2011<\/div>\n<p>손가락이 떨려 두 번 만에 폴더를 열었다.<\/p>\n<p>비어 있었다.<\/p>\n<p>0바이트. 하얀 화면. 커서만 깜빡였다.<\/p>\n<p>\"아니야. 아니야, 그럴 리가—\"<\/p>\n<p>내가 폴더를 닫았다가 다시 열었다. 하얀 화면. 시헌이 내 손에서 노트북을 받아 관리 프로그램을 띄웠다. 그의 손가락이 자판 위에서 빨라졌다. 검은 창에 흰 글자가 줄줄이 흘렀다.<\/p>\n<p>복도 쪽에서 엘리베이터 도착음이 들렸다. 땡.<\/p>\n<p>\"30층. 진짜 2분이야.\"<\/p>\n<p>달래의 목소리가 갈라졌다.<\/p>\n<p>시헌의 손가락이 멈췄다.<\/p>\n<p>화면 맨 아래, 한 줄이 노랗게 반전되어 있었다. 삭제 로그.<\/p>\n<p>나는 그 줄을 읽었다. 한 번 읽은 건 잊지 못한다. 잊을 수 있다면 좋았을 텐데.<\/p>\n<div class=\"doc\">DELETE /CALL_LOG_2011/* — 원격 승인 완료<\/div>\n<p>시헌의 얼굴에서 핏기가 빠지는 게 보였다. 형광등이 그의 뺨 위에서 푸르게 떨렸다. 그는 화면을 보고 있었지만, 나는 그를 보고 있었다.<\/p>\n<p>삭제 시각 — 어제 21:14. 삭제 승인 계정 — 백시헌.<\/p>","chars":4927},{"title":"탄원서","html":"<div class=\"timer\">[D-3 / 23:47]<\/div>\n<p>비상계단 문이 등 뒤에서 쾅 닫혔다.<\/p>\n<p>지하 3층 주차장. 배기가스와 고인 빗물 냄새. 32층을 계단으로 뛰어 내려온 다리가 후들거렸다. 나는 기둥에 손을 짚고 헛구역질을 삼켰다.<\/p>\n<p>달래가 청소 조끼를 벗어 바닥에 내던졌다. 그리고 시헌의 멱살을 잡았다.<\/p>\n<p>\"너지. 처음부터 너였지.\"<\/p>\n<hr class=\"scene\">\n<p>시헌의 등이 콘크리트 기둥에 부딪혔다. 둔한 소리. 달래는 그보다 머리 하나가 작았지만, 그녀의 주먹은 그의 셔츠 깃을 비틀어 쥐고 놓지 않았다.<\/p>\n<p>\"내가 아니야.\"<\/p>\n<p>\"아니긴 뭐가 아니야, 이 씨발 주어 없는 새끼야. 네 계정이잖아. 네 이름이 찍혀 있잖아.\"<\/p>\n<p>\"해임될 때 정지됐어. 서기 권한은 전부—\"<\/p>\n<p>\"정지된 계정이 원격 승인을 해? 귀신이 했어? [단독] 한결 기록실에 귀신 출몰, 하필 백시헌 아이디로.\"<\/p>\n<p>달래의 목소리가 주차장 천장에 부딪혀 두 번씩 울렸다. 형광등 하나가 깜빡였다.<\/p>\n<p>시헌은 그녀의 손을 떼어내지 않았다. 나를 봤다.<\/p>\n<p>나는 아무 말도 하지 못했다.<\/p>\n<p>기록실에서 그의 얼굴에서 핏기가 빠지던 순간이 떠올랐다. 놀란 사람의 얼굴이었나. 들킨 사람의 얼굴이었나. 사진처럼 기억하는 내 머리는, 표정까지는 판결해주지 않았다.<\/p>\n<p>\"진서야.\"<\/p>\n<p>그가 불렀다. 그 목소리에 무엇이 담겨 있는지 듣기 전에, 나는 고개를 돌렸다.<\/p>\n<p>달래가 그의 멱살을 놓았다. 셔츠 단추 하나가 튀어 바닥을 굴렀다. 딸그락, 딸그락. 어둠 속으로 사라질 때까지 셋 다 그 소리만 들었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-2 / 00:00]<\/div>\n<p>휴대폰이 떨었다.<\/p>\n<p>판례집. 공지가 아니었다. 처음 보는 붉은 테두리. 개인 메시지.<\/p>\n<div class=\"doc\">발신: 재판장<\/div>\n<div class=\"doc\">제4공판 특별 기일을 개정합니다. 9월 13일 03:00.<\/div>\n<div class=\"doc\">정진서 당사자가 백시헌의 남은 봉인 증거(갑 제11-2호증)를 제출하면, 유태석의 집행을 7일 연기하도록 판관회에 &#x27;청원&#x27;해 드립니다.<\/div>\n<div class=\"doc\">증거는 360.2 판 1129 자리에 있습니다. 제출 마감 02:00.<\/div>\n<p>7일.<\/p>\n<p>9월 15일 10:00이 9월 22일 10:00이 된다. 원래의 날짜. 일주일이면 장부를 찾을 수 있을지도 몰랐다. 한도경 검사를 움직일 수 있을지도. 재심 청구서가 법원 서랍에서 꺼내질 수 있을지도.<\/p>\n<p>일주일이면, 아빠는 일곱 번 더 아침밥을 먹는다.<\/p>\n<p>나는 화면을 끄고 주차장 기둥에 이마를 댔다. 콘크리트가 차가웠다. 눈을 감자 아빠의 손가락이 접견실 유리에 별을 그리고 있었다. W. 카시오페이아.<\/p>\n<p>등 뒤에서 시헌의 구두 소리가 멀어지고 있었다. 그는 아무것도 묻지 않고 계단 쪽으로 걸어갔다. 그의 휴대폰도 같은 순간 떨었을 것이다. 피고인이 될 사람에게도 기일 통지는 간다.<\/p>\n<p>\"뭔데. 뭐 왔어.\"<\/p>\n<p>달래가 내 어깨 너머로 화면을 들여다보려 했다. 나는 휴대폰을 주머니에 넣었다.<\/p>\n<p>\"고, 공지. 최종 공판 시간 재확인.\"<\/p>\n<p>엄지손톱이 큐티클을 긁었다. 달래의 시선이 내 손가락으로 떨어졌다. 녹두거리 순댓국집에서 내가 본명을 털어놓던 날 이후로, 그녀는 그 손가락을 읽는 법을 알았다.<\/p>\n<p>\"너 지금 거짓말했지.\"<\/p>\n<p>\"…고시원 가서 잘게. 너도 가.\"<\/p>\n<p>\"진서야. [사설] 혼자 결정하는 놈들이 제일 크게 사고 친다.\"<\/p>\n<p>나는 대답하지 않고 주차장 출구 경사로를 올라갔다. 등 뒤에서 그녀가 욕을 한 번 짧게 뱉었다. 따라오지는 않았다. 따라오지 않아 줘서, 나는 그녀를 조금 미워했다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-2 / 01:12]<\/div>\n<p>택시 안에서 나는 메시지를 다섯 번 다시 읽었다.<\/p>\n<p>문장을 판결문처럼 읽는 버릇. 주어, 서술어, 조건. '청원해 드립니다.' 연기해 드린다가 아니었다. 청원해 드린다. 청원은 들어주는 자의 몫이다. 내가 노리던 청원권도 결국 그런 단어였다.<\/p>\n<p>알았다. 알면서도 화면을 끄지 못했다.<\/p>\n<p>창밖으로 남부순환로의 가로등이 지나갔다. 주황색 불빛이 차창에 길게 번졌다가 끊겼다. 택시 기사가 라디오를 틀었다. 새벽 뉴스. 앵커가 사형 집행 명령 서명 이후 여론조사 결과를 읽고 있었다. 찬성 71%.<\/p>\n<p>\"아이고, 그런 놈들은 빨리 보내야지.\"<\/p>\n<p>기사가 혼잣말을 했다. 나는 창문에 이마를 댔다. 유리가 진동했다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-2 / 01:41]<\/div>\n<p>폐가 서고는 그날 밤과 똑같은 냄새였다. 곰팡이, 먼지, 바스러지는 제본 실.<\/p>\n<p>360.2 판 1129. 하늘색 하드커버를 뽑자 그 뒤의 어둠 속에 갈색 봉투가 놓여 있었다. 수입인지 봉인. 붓글씨.<\/p>\n<div class=\"doc\">갑 제11-2호증 — 봉인 증거. 공판정 개봉.<\/div>\n<p>열어볼 수 없었다. 무엇이 들었는지도 모르고, 나는 그를 피고인석에 세워야 했다.<\/p>\n<p>봉투를 쥔 손이 떨렸다. 엄지손톱이 검지 옆 큐티클을 찾았다. 아직 거짓말은 하지 않았는데.<\/p>\n<p>나는 스스로에게 이유를 댔다. 삭제 로그. 그의 이름. 처음부터 그는 사형수의 딸이 법복을 입는 걸 막으려고 이 공판에 들어왔다. 그가 직접 그렇게 말했다. 그가 몇 번이나 나를 구한 건, 나를 끝내는 손이 자기 손이어야 했기 때문일지도 몰랐다.<\/p>\n<p>그리고 피고인석 난간에 등이 닿던 그 밤. 그의 숨. 더듬지 않던 내 입술.<\/p>\n<p>\"아, 아빠의—\"<\/p>\n<p>빈 서고에서 혼자 말했다. 첫 음절이 걸렸다. 나는 끝까지 말하지 못했다.<\/p>\n<p>아빠의 일주일이야.<\/p>\n<p>판례집 앱을 열었다. <span class=\"sys\">증거 제출<\/span>. 손가락이 버튼 위에서 오래 멈췄다. 형광등이 찌르르 울었다. 01:58.<\/p>\n<p>눌렀다.<\/p>\n<div class=\"doc\">제출 완료. 검사: 정진서. 피고인: 백시헌.<\/div>\n<p>큐티클이 찢어지는 감각이 났다. 내려다보지 않았다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-2 / 03:00]<\/div>\n<p>종이 울렸다.<\/p>\n<p>천장의 낡은 법정 종. 녹슨 쇠의 진동이 발바닥까지 내려왔다. 제0법정은 숨을 죽였다. 흑유리 너머에서 태블릿 불빛들이 푸르게 떠올랐다.<\/p>\n<p>피고인석에 시헌이 서 있었다.<\/p>\n<p>쇠 난간을 쥐지도 않았다. 법복도 입지 않았다. 지하 주차장에서 단추가 떨어진 셔츠 그대로였다. 목 아래가 벌어져 쇄골이 보였다.<\/p>\n<p>방청석 맨 앞줄, 당사자석에 달래가 앉아 있었다. 그녀는 팔짱을 끼고 턱을 들었다. 서이안은 그 옆에서 손톱을 보고 있었다. 남은 당사자는 일곱 명. 다들 숨소리를 죽였다.<\/p>\n<p>\"검사, 공소를 제기하세요.\"<\/p>\n<p>가면 뒤의 변조된 목소리. 그 아래에서 홍차를 마시던 목울대가 움직이는 게 보이는 것 같았다.<\/p>\n<p>나는 봉투의 수입인지를 뜯었다. 종이 찢어지는 소리가 법정 끝까지 울렸다.<\/p>\n<p>A4 한 장. 그 아래 복사본 열네 장. 법무부 민원 접수 도장이 찍힌 탄원서들.<\/p>\n<p>나는 읽었다. 목소리가 내 것이 아닌 것처럼 나왔다.<\/p>\n<p>\"백시헌은 2012년부터 매년 9월, 사형확정수 유태석의 조속한 집행을 청원하는 탄원서를 법무부에 제출했다. 총 14회.\"<\/p>\n<p>흑유리 너머에서 웅성거림이 일었다.<\/p>\n<p>나는 첫 장의 탄원서를 들었다. 2012년 9월. 열네 살 소년의 글씨. 비뚤고, 꾹꾹 눌러 써서 종이 뒷면까지 튀어나온 글씨.<\/p>\n<div class=\"doc\">우리 엄마 아빠를 죽인 사람이 아직 살아 있습니다. 빨리 죽여 주세요.<\/div>\n<p>손이 떨려 종이가 바스락거렸다. 읽지 않았다. 그 문장은 법정에 내놓을 수가 없었다.<\/p>\n<p>맨 아래 장을 넘겼다. 2025년 9월. 열네 번째. 글씨는 이제 반듯했다. 법학적성시험 답안지처럼 단정한 글씨. 단 두 줄.<\/p>\n<div class=\"doc\">집행을 요청합니다. 저는 아직 옷장 안에 있습니다.<\/div>\n<p>목구멍 안쪽에서 무언가가 걸렸다. 첫 음절이 아니었다. 숨이었다.<\/p>\n<p>흑유리 너머 투표 그래프가 꿈틀거렸다. 판관들은 증거를 보지 않는다. 법정에서의 모습을 본다. 지금 그들이 보는 건, 피해자의 아들이 15년 동안 쓴 편지를 사형수의 딸이 읽어 내려가는 장면이었다. 그들에게 이보다 좋은 구경은 없었다.<\/p>\n<p>\"피고인, 변론하세요.\"<\/p>\n<p>재판장이 말했다.<\/p>\n<p>시헌은 아무 말도 하지 않았다.<\/p>\n<p>재판장을 보지 않았다. 흑유리를 보지 않았다. 방청석의 달래도, 투표 그래프가 떠오른 스크린도. 그는 처음부터 끝까지 나만 봤다.<\/p>\n<p>그 눈은 원망이 아니었다. 그게 견딜 수 없었다.<\/p>\n<p>\"피고인, 마지막으로 묻습니다. 변론하지 않겠습니까?\"<\/p>\n<p>\"없습니다.\"<\/p>\n<p>짧고 정확했다. 늘 그랬던 것처럼.<\/p>\n<p>투표 그래프가 차올랐다. 붉은 막대가 하나, 둘, 아홉. 푸른 막대 하나가 맨 끝에 혼자 서 있었다. 누가 그걸 눌렀는지 나는 알 수 없었다.<\/p>\n<p>유죄 9 : 무죄 1.<\/p>\n<p>종이 울렸다.<\/p>\n<div class=\"doc\">피고인 백시헌 — 탈락. 집행.<\/div>\n<p>스크린에 탄원서 열네 장이 차례로 떠올랐다. 그 위로 케이스북 화면. <span class=\"sys\">[실명] 백시헌, 15년 전 살인사건 생존자… 사형수 집행 탄원 14회.<\/span> 그리고 그 아래, 아무도 요구하지 않은 한 줄.<\/p>\n<div class=\"doc\">관련 당사자: 정진서.<\/div>\n<hr class=\"scene\">\n<p>폐정 후 법정 계단은 축축했다.<\/p>\n<p>당사자들이 하나둘 내 옆을 스쳐 올라갔다. 누구도 나를 보지 않았다. 이안이 지나가며 혀를 찼다. 그 소리가 뺨을 때리는 것보다 아팠다.<\/p>\n<p>시헌이 마지막으로 계단을 올라왔다.<\/p>\n<p>그는 내 옆에서 멈췄다. 한 계단 아래. 우리 눈높이가 같았다. 그의 셔츠에서 지하 주차장의 배기가스 냄새와, 그 아래 섬유유연제 냄새가 아직 남아 있었다. 첫날 강의실에서 맡았던 그 서늘한 냄새.<\/p>\n<p>\"그 탄원서.\"<\/p>\n<p>그가 말했다. 목소리가 낮았다. 원망도 변명도 없이.<\/p>\n<p>\"올해는 안 냈어. 너 만나고 나서.\"<\/p>\n<p>그는 대답을 기다리지 않았다. 내 옆을 지나 계단을 올라갔다. 철문이 열리고, 닫혔다. 경첩이 끼익 울었다.<\/p>\n<p>나는 손을 내려다봤다.<\/p>\n<p>엄지손톱이 검지 옆을 깊이 파고들어 있었다. 피가 맺힌 게 아니었다. 흘렀다. 손가락 마디를 타고, 손목으로, 법복 소매 안으로. 따뜻했다. 그리고 금방 차가워졌다.<\/p>\n<p>언제부터 뜯고 있었는지 기억나지 않았다. 한 번 본 건 잊지 못하는 내가.<\/p>\n<p>\"진서야.\"<\/p>\n<p>달래였다. 계단 위에서 나를 내려다보고 있었다. 무언가 말하려다가 입을 다물었다. 그리고 고개를 돌렸다.<\/p>\n<p>달래가 나에게서 고개를 돌린 건 처음이었다.<\/p>\n<p>나는 계단에 주저앉았다. 젖은 돌이 청바지를 적셨다. 피 묻은 손가락을 입에 물었다. 쇠 맛이 혀에 번졌다.<\/p>\n<p>아빠의 일주일이야. 아빠의 일주일이야.<\/p>\n<p>주문처럼 외웠다. 외울수록 그 말이 무슨 뜻인지 모르게 되었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-2 / 06:00]<\/div>\n<p>고시원 총무실의 간이침대에서 나는 한숨도 자지 못했다. 그을린 벽지 냄새가 아직 방 안에 배어 있었다.<\/p>\n<p>법무부 홈페이지. 보도자료 게시판. 새로고침.<\/p>\n<p>변화가 없었다.<\/p>\n<p>새로고침. 새로고침. 엄지가 화면을 내리누를 때마다 붕대 아래 상처가 욱신거렸다. 창밖에서 첫 마을버스가 녹두거리를 지나갔다. 엔진 소리가 유리창을 떨게 했다.<\/p>\n<div class=\"doc\">형 집행 예정 — 9월 15일 10:00. 서울구치소.<\/div>\n<p>그대로였다. 숫자 하나 바뀌지 않았다.<\/p>\n<p>휴대폰이 떨었다. 붉은 테두리. 판례집.<\/p>\n<div class=\"doc\">발신: 재판장<\/div>\n<p>나는 숨을 참았다. 옷장 속의 아이처럼.<\/p>\n<p>\"판관회는 거래하지 않습니다. 판결할 뿐이죠. 집행은 9월 15일 10:00 그대로입니다. 좋은 판결이었어요, 정진서 검사.\"<\/p>","chars":4964},{"title":"흰 백합","html":"<div class=\"timer\">[D-2 / 14:00]<\/div>\n<p>좋은 판결이었어요, 정진서 검사.<\/p>\n<p>여덟 시간 동안 그 문장을 지우지 못했다. 화면을 끄면 눈꺼풀 안쪽에 떠올랐다. 나는 법학관 3층 복도 끝, 흰 백합 스티커가 붙은 문 앞에 서 있었다.<\/p>\n<p>리걸클리닉. 이 학교에서 내가 아직 문을 두드릴 수 있는 유일한 곳.<\/p>\n<p>노크하기도 전에 문이 열렸다.<\/p>\n<hr class=\"scene\">\n<p>임소라 변호사는 아무것도 묻지 않았다.<\/p>\n<p>그녀는 분홍색 고무장갑을 낀 채였다. 화병 물을 갈던 중이었는지 장갑 끝에서 물방울이 떨어졌다. 그 손이 그대로 내 등을 감쌌다. 젖은 고무의 차가움이 셔츠를 뚫고 들어왔고, 그 위로 체온이 번졌다.<\/p>\n<p>흰 백합 향. 진하고 달아서, 숨을 쉴 때마다 목 안이 간지러웠다.<\/p>\n<p>\"케이스북 봤어요. 진서 씨 이름이 거기 왜 있는지도 알아요.\"<\/p>\n<p>나는 그녀의 어깨에 이마를 묻었다. 이틀 전 새벽, 재심 청구서를 같이 쓰던 그 밤처럼.<\/p>\n<p>\"제, 제가… 시헌이를—\"<\/p>\n<p>\"쉬. 알아요.\"<\/p>\n<p>그녀가 내 등을 두 번 두드렸다. 엄마가 그랬던 박자였다.<\/p>\n<p>\"잘했어요. 아버님이 먼저예요. 누구라도 그랬을 거예요.\"<\/p>\n<p>그 말에 다리에서 힘이 빠졌다. 누군가 잘했다고 말해주기를, 나는 여덟 시간 동안 기다리고 있었다.<\/p>\n<hr class=\"scene\">\n<p>클리닉 상담실은 작고 밝았다. 창가에 백합 화병이 세 개. 책상 위에는 형사소송법 주석서와 반쯤 먹다 만 샌드위치. 커피 머신이 그르렁거리며 김을 뿜었다.<\/p>\n<p>임소라가 서류철에서 종이 한 장을 꺼내 내 앞에 놓았다.<\/p>\n<div class=\"doc\">재심청구서 접수증명 — 서울중앙지방법원 — 청구인 유태석<\/div>\n<p>법원 직인이 붉게 번져 있었다. 접수 시각, 9월 12일 17:40.<\/p>\n<p>\"어제 냈어요. 집행정지 효력은 없지만, 기록은 남아요. 법원이 '청구가 있었다'는 걸 아는 상태에서 집행하는 건 부담이거든요.\"<\/p>\n<p>\"거, 검사만 멈출 수 있다고 하셨잖아요.\"<\/p>\n<p>\"그래서 하나 더.\"<\/p>\n<p>그녀가 휴대폰 연락처를 보여줬다. 이름 대신 이니셜. <span class=\"sys\">H. 서울중앙지검<\/span>.<\/p>\n<p>\"집행정지 신청, 제가 아는 검사님께 부탁해볼게요. 확답은 못 해요. 그래도 해볼 거예요.\"<\/p>\n<p>나는 접수증을 손바닥으로 쓸었다. 종이의 오돌토돌한 직인 자국. 한 번 본 건 잊지 못하는 나는, 그 숫자들을 저절로 외웠다. 접수번호, 담당 재판부, 접수 직원 이름.<\/p>\n<p>임소라가 커피잔을 내 손에 쥐여줬다. 고무장갑 위로 열기가 전해졌는지, 그녀가 살짝 손을 털었다. 그리고 다시 화병 앞으로 돌아가 시든 꽃잎을 땄다. 꽃가루가 장갑 끝에 노랗게 묻었다.<\/p>\n<p>\"백합 꽃가루는 손에 묻으면 잘 안 지워져요. 그래서 장갑을 껴요.\"<\/p>\n<p>\"…예쁘네요.\"<\/p>\n<p>\"죽은 사람 앞에 놓는 꽃이라서요. 이 방에 오는 사람들은 다들 누군가를 잃었거든요.\"<\/p>\n<p>그녀가 웃었다. 나도 웃으려 했다.<\/p>\n<p>\"아버님 편지는요. 불 난 뒤로 어디 뒀어요?\"<\/p>\n<p>그녀가 꽃잎을 따며 물었다. 손을 멈추지 않고, 지나가듯이.<\/p>\n<p>\"총무실이요. 침대 밑에… 그을린 것도 마흔한 통이나 돼서.\"<\/p>\n<p>\"버리지 마요. 재심에선 그런 게 정상참작 자료가 돼요. 15년 동안 딸한테 편지 쓴 사형수. 판사들도 사람이거든요.\"<\/p>\n<p>나는 고개를 끄덕였다. 커피가 혀끝에서 썼다. 설탕을 넣지 않은 커피였다. 달래라면 두 배로 넣어줬을 텐데. 달래는 오늘 아침부터 메시지를 한 통도 보내지 않았다.<\/p>\n<p>\"시헌 씨는요. 연락 왔어요?\"<\/p>\n<p>\"…아, 아니요.\"<\/p>\n<p>\"그럼 됐어요. 당분간은 그쪽도 진서 씨를 안 보는 게 나아요.\"<\/p>\n<p>그녀의 목소리는 한결같이 부드러웠다. 꽃잎 하나가 그녀의 장갑에서 떨어져 바닥에 내려앉았다. 소리 없이.<\/p>\n<p>그때 휴대폰이 떨었다.<\/p>\n<hr class=\"scene\">\n<p>모르는 번호였다. 받지 않으려다, 끝자리를 보고 손이 멈췄다. 제1공판의 그 밤 이후로 지우지 못한 번호. 관악산 연주대, 내가 손목을 붙잡았던 사람.<\/p>\n<p>\"잠깐만요.\"<\/p>\n<p>나는 상담실을 나와 복도 끝 비상구 앞으로 갔다. 유리창 너머로 관악산 능선이 보였다.<\/p>\n<p>\"…민규 씨?\"<\/p>\n<p>\"진서 씨. 시간 없어요. 지금 혼자예요?\"<\/p>\n<p>최민규의 목소리는 낮고 빨랐다. 뒤에서 항온항습기가 웅웅거렸다. 어젯밤 내가 들었던 그 소리였다.<\/p>\n<p>\"너, 너 거기 어디야.\"<\/p>\n<p>\"한결 기록실. 계약직이에요. 퇴학당하고 엄마 병원비 때문에… 그건 됐고. 어젯밤 B 구역에 누가 들어왔다고 보안 감사가 떨어졌어요. 로그 정리하는 게 내 일이에요.\"<\/p>\n<p>숨이 멎었다. 그가 우리를 봤다. 아니, 우리가 남긴 흔적을 정리하고 있었다.<\/p>\n<p>\"그거, 진서 씨죠. 괜찮아요. 아무한테도 안 말했어요. 그 대신 이거 들어요.\"<\/p>\n<p>자판 두드리는 소리.<\/p>\n<p>\"B-1129 하드 삭제한 단말기, 한결 내부가 아니에요. 원격이었어요. 계정은 백시헌인데, 접속한 IP가 달라요.\"<\/p>\n<p>\"어, 어디.\"<\/p>\n<p>\"서울대 법학관. 리걸클리닉.\"<\/p>\n<p>복도의 공기가 갑자기 백합 향으로 가득 찼다. 등 뒤의 상담실 문틈에서 새어 나오는 향.<\/p>\n<p>\"그리고 하나 더요.\"<\/p>\n<p>민규가 침을 삼키는 소리가 들렸다.<\/p>\n<p>\"제1공판 때 진서 씨가 읽은 그 문서. 나 그거 집행 사본으로 받아서 아직 갖고 있었어요. 컬러 레이저 프린터는 종이에 노란 점을 찍어요. 눈에 안 보이는 일련번호. 그걸 한결 자산 대장이랑 대조했어요. 한결 공익재단이 기증한 프린터예요.\"<\/p>\n<p>\"…어디에.\"<\/p>\n<p>\"같은 곳이요. 리걸클리닉.\"<\/p>\n<p>나는 비상구 문손잡이를 쥐었다. 쇠가 손바닥에 차갑게 박혔다.<\/p>\n<p>\"진서 씨가 나 살렸잖아요. 연주대에서. 이걸로 갚는 거예요.\"<\/p>\n<p>전화가 끊겼다.<\/p>\n<p>나는 비상구 유리에 등을 댔다. 손가락이 저절로 연락처를 넘겼다. 백시헌.<\/p>\n<p>신호가 가지 않았다. <span class=\"sys\">전원이 꺼져 있어 —<\/span> 기계음이 끝나기 전에 끊었다.<\/p>\n<p>메시지 창을 열었다. 미, 까지 쳤다. 지웠다. 다시 쳤다. 미안. 두 글자가 화면 위에서 깜빡였다. 탈락자의 휴대폰에서 판례집은 지워진다. 그가 이 메시지를 받는다 해도, 내가 그에게서 빼앗은 것은 돌아가지 않는다.<\/p>\n<p>전송 버튼을 누르지 못했다. 엄지가 화면 위에서 떨렸다.<\/p>\n<p>복도 저편, 상담실 문이 반쯤 열려 있었다. 그 틈으로 임소라의 등이 보였다. 분홍색 장갑. 꽃을 다듬는 손. 아까와 똑같은 박자로.<\/p>\n<p>나는 휴대폰을 주머니에 넣고 걸었다. 복도 바닥의 왁스 냄새가 발밑에서 올라왔다. 한 걸음마다 백합 향이 짙어졌다.<\/p>\n<hr class=\"scene\">\n<p>상담실로 돌아왔을 때, 임소라는 창가에 서 있었다. 화병의 물을 가는 중이었다. 수돗물이 유리 안으로 쏟아지는 소리. 그녀는 나를 돌아보지 않았다.<\/p>\n<p>내 눈은 그녀의 책상 위 모니터로 갔다.<\/p>\n<p>화면 보호기가 꺼져 있었다. 원격 접속 프로그램의 작은 창이 작업 표시줄에 최소화되어 있었다. 나는 마우스에 손을 댔다. 클릭 한 번.<\/p>\n<div class=\"doc\">최근 세션<\/div>\n<div class=\"doc\">9월 11일 21:09 — 연결 — hangyeol-archive / 사용자: baek.sh<\/div>\n<div class=\"doc\">9월 11일 21:14 — 명령 실행 완료<\/div>\n<div class=\"doc\">9월 11일 21:16 — 연결 종료<\/div>\n<p>baek.sh. 백시헌.<\/p>\n<p>그날 밤 21:14에 시헌은 어디 있었나. 나는 기억했다. 사진처럼. 9월 11일 밤 아홉 시. 합의실 잠입을 다섯 시간 앞두고, 그는 법학도서관 열람실 맨 끝자리에서 내 옆에 앉아 있었다. 노트북을 펴지도 않고, 휴대폰도 엎어둔 채로. 연습장에 판사실 통로를 볼펜으로 그리면서. 내 옆에서.<\/p>\n<p>나는 그걸 기억하고 있었다. 기억하면서도, 어젯밤 지하 주차장에서 고개를 돌렸다.<\/p>\n<p>심장이 늑골 안쪽을 두드렸다. 한 번, 아주 크게. 그리고 박자를 잃었다.<\/p>\n<p>나는 그를 팔았다. 거짓 증거를 근거로. 그를 피고인석에 세우고, 열네 살 소년의 탄원서를 판관들 앞에서 낭독했다. 그는 변론하지 않았다. 변론할 게 있었는데. 그가 그 시간에 내 옆에 있었다고, 내가 증언해 줄 수 있었는데.<\/p>\n<p>그는 알았을 것이다. 내가 그 시간을 기억한다는 걸. 한 번 본 건 잊지 못하는 여자라는 걸, 그는 첫날부터 알고 있었다. 그래서 변론하지 않았다. 내가 먼저 기억해내기를 기다린 걸까. 아니면 기억하고도 그를 판 나를, 마지막까지 보고 싶었던 걸까.<\/p>\n<p>천천히 해. 법정은 네 말이 끝날 때까지 기다려야 하는 곳이야.<\/p>\n<p>그는 피고인석에서도 기다렸다. 내 말이 끝날 때까지. 내가 끝내 아무 말도 하지 않을 때까지.<\/p>\n<p>입 안에 신물이 고였다. 나는 책상 모서리를 쥐었다. 모니터의 푸른 빛이 손등 위에서 떨렸다.<\/p>\n<p>제1공판의 위조 문서. 그때도 봉투가 내 손을 떠난 건 단 한 번, 이 방에서였다. 20분.<\/p>\n<p>엄지손톱이 큐티클을 찾았다. 붕대가 감긴 자리가 다시 젖어들었다.<\/p>\n<p>\"진서 씨, 커피 식어요.\"<\/p>\n<p>임소라가 말했다. 여전히 등을 돌린 채였다. 화병에 새 백합을 꽂으며. 한 송이, 두 송이. 줄기 끝을 가위로 비스듬히 잘랐다. 싹둑. 그 소리가 상담실 안에서 지나치게 크게 울렸다.<\/p>\n<p>그녀는 내가 무엇을 봤는지 알고 있었다. 알면서도 꽃을 꽂고 있었다.<\/p>\n<p>나는 모니터 옆의 프린터를 봤다. 하얀 컬러 레이저 프린터. 옆면에 은색 스티커. <span class=\"sys\">기증 — 한결 공익재단<\/span>. 제1공판 전날, 나는 바로 이 프린터에서 재심 상담 자료를 뽑았다. 그녀가 따뜻한 종이를 내 손에 쥐여주며 웃었었다.<\/p>\n<p>나는 일어섰다. 의자가 바닥을 긁었다.<\/p>\n<p>\"왜요.\"<\/p>\n<p>더듬지 않았다. 첫 음절이 목에 걸리지 않았다. 너무 차가워서, 걸릴 틈이 없었다.<\/p>\n<hr class=\"scene\">\n<p>임소라가 가위를 내려놓았다.<\/p>\n<p>그녀가 돌아섰다. 얼굴은 그대로였다. 이틀 전 새벽 내게 어깨를 내주던 얼굴. 눈가의 잔주름, 화장기 없는 입술. 다정한 얼굴이 조금도 무너지지 않아서, 그게 가장 무서웠다.<\/p>\n<p>\"진서 씨 가방, 그날 여기 두고 갔었죠. 20분.\"<\/p>\n<p>그녀가 말했다. 날씨 얘기를 하듯이.<\/p>\n<p>\"봉투 하나 바꾸는 데는 4분이면 돼요. 나머지 16분은 진서 씨 자소서를 읽었어요. 잘 썼더라. 가족 사항만 빼고.\"<\/p>\n<p>귀에서 물소리가 났다. 첫 강의 날, 속보 알림이 울리던 그 순간처럼. 상담실의 소음이 수조 너머로 멀어졌다. 커피 머신의 그르렁거림, 창밖의 매미 소리, 수돗물 떨어지는 소리.<\/p>\n<p>\"진서 씨는 늘 문장을 끝까지 들어주는 사람이었어요. 그래서 좋았어요.\"<\/p>\n<p>그녀가 오른손으로 왼손 고무장갑의 손목을 잡았다. 천천히 당겼다. 젖은 고무가 피부에서 떨어지는 소리. 쩍.<\/p>\n<p>물기 어린 손가락이 하나씩 드러났다. 희고 가늘었다. 엄지, 검지, 중지.<\/p>\n<p>약지.<\/p>\n<p>검은 돌이 형광등 아래서 빛을 삼켰다. 흑요석 반지. 법학관 빈 강의실에서 시헌이 내 손에 쥐여줬던 것과 똑같은 돌. 옷장 틈으로 열세 살 아이가 본 것과 똑같은 돌.<\/p>\n<p>백합 향이 목구멍을 막았다. 달고, 진하고, 썩기 직전의 과일처럼.<\/p>\n<p>\"장갑은 꽃가루 때문이 아니었어요.\"<\/p>\n<p>그녀가 반지를 엄지로 한 번 돌렸다. 익숙한 손버릇처럼.<\/p>\n<p>그녀가 웃었다. \"15년 전 그 콜 기록, 내가 잃어버린 게 아니에요. 내가 넘겼어요. 그날 처음으로 이 반지를 받았죠.\"<\/p>","chars":4951},{"title":"별자리","html":"<div class=\"timer\">[D-2 / 14:51]<\/div>\n<p>임소라는 도망치지 않았다.<\/p>\n<p>그녀는 벗은 고무장갑을 개수대 옆에 가지런히 걸었다. 물기를 털고, 반지 낀 손으로 의자를 빼 앉았다. 식은 커피를 한 모금 마셨다.<\/p>\n<p>\"콜 기록은 이제 세상에 없어요. 진서 씨는 아무것도 증명 못 해요.\"<\/p>\n<p>그 목소리가 너무 다정해서, 나는 뒷걸음질을 쳤다. 의자 다리가 발목을 쳤다. 나는 문을 밀고 뛰쳐나갔다. 복도 끝까지 백합 향이 따라왔다.<\/p>\n<hr class=\"scene\">\n<p>남은 건 편지 183통이었다.<\/p>\n<p>녹두거리로 내려가는 언덕길에서 나는 두 번 넘어질 뻔했다. 무릎이 후들거렸고, 입 안에서 쇠 맛이 났다. 큐티클에 감은 붕대가 땀에 젖어 미끄러졌다.<\/p>\n<p>고시원 2층 복도. 그을린 벽지 냄새. 나는 내 방이 아니라 옆방 문을 두드렸다.<\/p>\n<p>문이 열렸다. 달래가 부스스한 머리로 나를 봤다. 눈 밑이 퀭했다. 그녀도 자지 못한 얼굴이었다.<\/p>\n<p>\"시, 시헌이 아니었어.\"<\/p>\n<p>달래의 눈썹이 움직였다.<\/p>\n<p>\"임소라야. 클리닉. 반지— 흑요석. 삭제도, 제1공판 봉투도, 전부.\"<\/p>\n<p>달래는 3초쯤 아무 말도 하지 않았다. 그리고 문틀을 손바닥으로 쾅 쳤다.<\/p>\n<p>\"씨발. 씨발, 씨발. [정정보도] 본지는 백시헌을 범인으로 지목한 바 있으나—\"<\/p>\n<p>그녀의 목소리가 갈라졌다. 그녀는 말을 끝내지 못하고 나를 끌어당겼다. 라면 스프와 샴푸 냄새. 내 어깨에 그녀의 턱이 박혔다.<\/p>\n<p>\"미안해. 아침에 고개 돌려서.\"<\/p>\n<p>\"내가 더 미안해.\"<\/p>\n<p>\"알아. 그러니까 이제 일해.\"<\/p>\n<p>그녀가 나를 놓고 휴대폰을 꺼냈다. 엄지가 빠르게 움직였다. 누구에게 보내는지 묻지 않았다. 그녀가 화면을 끄며 말했다.<\/p>\n<p>\"편지 가져와. 전부.\"<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-2 / 20:00]<\/div>\n<p>달래의 방바닥에 183통이 깔렸다.<\/p>\n<p>3평짜리 방이 하얀 종이로 덮였다. 서울구치소 편지지. 18줄짜리 괘선, 왼쪽 위에 수번 칸. 그중 41통은 가장자리가 갈색으로 그을려 있었다. 탄 종이의 매캐한 냄새가 방 안에 깔렸다.<\/p>\n<p>편지마다 끝에 별자리가 있었다. 볼펜으로 콕콕 찍은 점들. 그리고 그중 별 하나만, 유독 진했다. 종이 뒷면까지 볼록하게 튀어나올 만큼 눌러 찍은 점.<\/p>\n<p>\"날짜순으로 깔았어. 2011년 10월부터 지난달까지.\"<\/p>\n<p>나는 바닥에 무릎을 꿇고 앉았다. 한 번 본 건 잊지 못한다. 그런데 나는 이 편지들을 제대로 본 적이 없었다. 15년 동안 뜯지도 않고 상자에 처박아 두었다. 지난주에야 처음으로 읽기 시작했다.<\/p>\n<p>\"별 이름 첫 글자를 이어보면?\"<\/p>\n<p>\"해봤어. 북, 카, 오, 북, 카, 오. 말이 안 돼.\"<\/p>\n<p>\"진한 별 개수는? 날짜 숫자랑 맞춰보면?\"<\/p>\n<p>\"그것도.\"<\/p>\n<p>시계가 21시를 넘겼다. 22시를 넘겼다. 형광등이 찌르르 울었다. 남은 시간은 36시간이었다. 최종 공판까지는 25시간.<\/p>\n<p>나는 머리를 쥐어뜯었다. 숫자들이 머릿속에서 줄을 서지 않았다. 아빠의 별들은 법전의 조문처럼 정렬되지 않았다.<\/p>\n<p>\"야.\"<\/p>\n<p>달래가 그을린 편지 두 통을 집어 들었다. 탄 자리 근처는 종이가 얇아져 반투명했다.<\/p>\n<p>\"이거, 겹쳐서 불빛에 비춰 보자.\"<\/p>\n<p>\"…뭐?\"<\/p>\n<p>\"옛날에 신문사 암실에서 필름 겹쳐 보던 거 있잖아. 위조 여권 사진 잡을 때 그렇게 했어. 두 장 겹치면 안 맞는 데가 튀어.\"<\/p>\n<p>말이 안 되는 소리였다. 편지는 위조가 아니었다. 그런데 그녀는 이미 책상 스탠드를 끌어와 갓을 벗기고 있었다. 맨 전구의 열기가 내 뺨까지 닿았다.<\/p>\n<p>그녀가 두 장을 겹쳐 전구 앞에 댔다.<\/p>\n<p>빛이 종이를 통과했다. 괘선 두 겹, 글씨 두 겹, 별자리 두 겹이 엉켜 보였다. 그리고 그 엉킨 점들 사이에서.<\/p>\n<p>진한 점 두 개가, 거의 같은 자리에 겹쳐 있었다.<\/p>\n<p>거의. 반 칸쯤 어긋나서.<\/p>\n<p>\"어.\"<\/p>\n<p>달래가 세 번째 장을 겹쳤다. 네 번째. 진한 점들이 전구 빛 속에서 하나의 얼룩으로 모여들었다. 하지만 정확히 겹치지는 않았다. 조금씩, 조금씩 미끄러져 있었다.<\/p>\n<p>\"아깝다. 아빠가 손이 떨렸나 봐.\"<\/p>\n<p>아니었다.<\/p>\n<p>나는 그 반 칸의 어긋남을 봤다. 진한 점이 아니라, 그 옆의 다른 것을 봤다. 편지마다 별자리 맨 위에 작게 찍힌 십자 표시. 진하지 않은, 그냥 기준점 같은 별.<\/p>\n<p>북극성.<\/p>\n<p>\"북극성부터 찾아라.\"<\/p>\n<p>목소리가 내 입에서 나왔다. 아빠의 목소리로.<\/p>\n<p>여덟 살의 관악산. 바위에 누운 아빠의 팔베개. 담배 냄새와 풀 냄새. 아빠의 손가락이 밤하늘을 짚었다.<\/p>\n<div class=\"doc\">북극성부터 찾아라. 길을 잃으면 거기서 다시.<\/div>\n<p>\"종이 끝이 아니야. 북극성에 맞춰야 해.\"<\/p>\n<hr class=\"scene\">\n<p>나는 눈을 감았다.<\/p>\n<p>183통이 머릿속에 떠올랐다. 한 장씩. 사진처럼. 쪽수와 줄까지. 괘선 열여덟 줄, 왼쪽 위 수번 칸, 아빠의 단정한 글씨. 나는 그 종이들을 머릿속에서 들어 올렸다. 그리고 겹쳤다. 종이 끝이 아니라, 북극성 십자를 기준으로.<\/p>\n<p>한 장. 두 장. 열 장. 백 장.<\/p>\n<p>머리가 깨질 것 같았다. 관자놀이에서 맥박이 쿵쿵 울렸다. 코 밑이 뜨끈해졌다. 달래가 휴지를 대주는 감각이 멀리서 느껴졌다.<\/p>\n<p>백팔십삼 장.<\/p>\n<p>진한 점들이 움직였다. 미끄러지고, 모이고, 겹쳤다.<\/p>\n<p>세 개.<\/p>\n<p>183개의 진한 점이, 단 세 자리로 겹쳤다.<\/p>\n<p>북두칠성을 그린 편지의 진한 별은 전부 북극성에서 열네 줄 아래. 카시오페이아는 세 줄 아래. 오리온은 열두 줄 아래. 그리고 편지는 15년 동안 그 순서를 한 번도 어기지 않았다. 북두칠성, 카시오페이아, 오리온. 다시 북두칠성.<\/p>\n<p>길을 잃으면 거기서 다시.<\/p>\n<p>\"14. 3. 12.\"<\/p>\n<p>나는 눈을 떴다. 코피가 입술 위에서 짰다.<\/p>\n<p>\"183은 3의 61배야. 예순한 번을 반복했어. 혹시 내가 몇 통을 안 읽어도, 몇 통이 타도, 알아볼 수 있게.\"<\/p>\n<p>\"그게 뭔데. 14, 3, 12가.\"<\/p>\n<p>\"서가. 칸. 권.\"<\/p>\n<p>폐가 서고의 서가에는 번호가 있었다. 처음 소환장을 들고 들어간 밤, 나는 그 번호들을 전부 외웠다. 14번 서가는 360.2 판 1129보다 두 줄 안쪽. 1970년대 판례집 구역.<\/p>\n<p>달래가 편지 뭉치를 내려다봤다. 그리고 천천히 고개를 들었다.<\/p>\n<p>\"[단독] 사형수, 15년간 딸에게 '보물지도' 보내… 매달 한 장씩.\"<\/p>\n<p>웃음이 아니었다. 그녀의 목소리가 떨렸다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-1 / 22:24]<\/div>\n<p>서고는 하루 종일 열리지 않았다. 출입문에 붙은 공지 한 장 — <span class=\"sys\">폐가 서고 서가 정비로 금일 22시까지 출입 통제<\/span>. 누가 붙였는지는 묻지 않아도 알았다. 우리는 열람실 구석에서 장부 대신 시계를 보며 하루를 통째로 태웠다. 최종 공판까지 서른 시간이 스무 시간이 되고, 한 시간이 됐다.<\/p>\n<p>밤 열 시의 폐가 서고는 불이 반만 켜져 있었다.<\/p>\n<p>레일 위로 서가가 끝없이 이어졌다. 먼지와 곰팡이와 바스러지는 제본 실 냄새. 우리의 운동화 소리가 철제 선반에 부딪혀 두 번씩 울렸다.<\/p>\n<p>출입 게이트에서 학생증을 댈 때, 화면은 이번에도 0.5초 동안 다른 이름을 띄웠다. <span class=\"sys\">유진서<\/span>. 나는 뒤돌아보지 않았다. 달래가 천장 구석의 CCTV를 올려다보며 중얼거렸다. \"[관전평] 누가 보든 말든, 이제 늦었다.\"<\/p>\n<p>14번 서가. 손잡이를 돌리자 모빌랙이 덜컹이며 벌어졌다. 사람 하나 들어갈 틈.<\/p>\n<p>셋째 칸. 하늘색 하드커버들이 빼곡했다. 1970년대 판례집. 나는 손가락으로 책등을 셌다. 하나, 둘, 셋. 차가운 금속 선반이 손등을 긁었다.<\/p>\n<p>열둘.<\/p>\n<div class=\"doc\">대법원 판례집 1974 제12권<\/div>\n<p>책등 맨 아래, 금박이 벗겨진 자리에 볼펜 점 하나가 찍혀 있었다. 콕. 아빠가 별을 찍던 그 압력으로.<\/p>\n<p>책을 뺐다. 이상하게 가벼웠다.<\/p>\n<p>표지를 열자 안쪽이 네모나게 파여 있었다. 칼로 도려낸 종이 단면이 누렇게 바랬다. 그 안에 검은 수첩 한 권과, 반으로 접힌 메모지.<\/p>\n<p>수첩의 첫 장. 깨알 같은 숫자들. 날짜, 금액, 이니셜. 그리고 페이지 상단마다 같은 표기. <span class=\"sys\">한결 신탁 — 判<\/span>.<\/p>\n<p>비자금 장부. 이정우 회계사의 글씨.<\/p>\n<p>메모를 펼쳤다. 만년필 잉크가 번져 있었다.<\/p>\n<div class=\"doc\">이 장부를 가진 자를 판관회는 죽인다. 백정만, 조윤강.<\/div>\n<p>그 아래, 서둘러 쓴 듯 기울어진 손글씨.<\/p>\n<div class=\"doc\">기사님께. 만약 제게 무슨 일이 생기면 — 별이 있는 책.<\/div>\n<p>기사님.<\/p>\n<p>대리운전 기사. 그날 밤 이정우를 집까지 태워다 준 사람.<\/p>\n<p>아빠.<\/p>\n<hr class=\"scene\">\n<p>나는 장부를 끌어안고 서가 사이에 주저앉았다.<\/p>\n<p>등에 닿은 판례집들이 차가웠다. 장부의 가죽 표지에서 오래된 종이와 곰팡이 냄새가 났다. 15년. 그 냄새가 15년이었다.<\/p>\n<p>아빠는 범인이 아니었다.<\/p>\n<p>믿어서가 아니었다. 처음으로, 증거로.<\/p>\n<p>이정우는 아빠에게 별이 있는 책을 맡겼다. 아빠는 그걸 아무에게도 말하지 않았다. 말할 수 없었다. 판관회가 수사하고, 판관회가 기소하고, 판관회가 판결하는 세상에서, 전과 있는 대리기사의 말을 들어줄 사람은 없었다. 그래서 아빠는 딸에게 보냈다. 매달 한 장씩. 구치소 검열관이 읽어도 그냥 별자리 그림으로 보이게.<\/p>\n<p>그리고 딸은 15년 동안 답장하지 않았다.<\/p>\n<div class=\"doc\">별은 거기 그대로 있다. 안 보일 뿐이다.<\/div>\n<p>소리가 나오지 않았다. 목 안에서 무언가가 끓어올랐는데, 입 밖으로 나오지 않았다. 눈물만 흘렀다. 턱을 타고, 장부의 가죽 위로. 나는 그게 번질까 봐 손바닥으로 닦았다. 닦아도 닦아도 떨어졌다.<\/p>\n<p>달래가 내 옆에 쪼그려 앉아 어깨를 감쌌다. 그녀의 팔이 떨렸다.<\/p>\n<p>\"[속보] 유태석, 15년간 딸에게 지도를 보내… 딸은 이제야 읽어.\"<\/p>\n<p>그녀가 속삭였다. 나는 그녀의 소매에 얼굴을 묻었다. 라면 스프 냄새. 살아 있는 사람의 냄새.<\/p>\n<p>\"이제 됐어, 진서야. 이거 들고 한 검사한테—\"<\/p>\n<p>딸깍.<\/p>\n<hr class=\"scene\">\n<p>형광등이 꺼졌다.<\/p>\n<p>반만 켜져 있던 불이 전부. 칠흑 같은 어둠이 서고를 삼켰다. 내 손에 쥔 장부의 윤곽조차 보이지 않았다.<\/p>\n<p>그리고 모터가 돌았다.<\/p>\n<p>웅.<\/p>\n<p>등줄기의 털이 곤두섰다. 그날 밤과 같은 소리. 그러나 이번엔 하나가 아니었다. 서고의 왼쪽 끝에서, 그리고 오른쪽 끝에서. 두 개의 모터가 동시에.<\/p>\n<p>레일이 삐걱였다. 바닥이 진동했다. 양옆의 서가가, 동시에 움직이기 시작했다.<\/p>\n<p>\"달래야, 일어나—\"<\/p>\n<p>나는 그녀의 팔을 잡아끌었다. 장부를 후드 집업 안쪽, 심장 바로 위에 쑤셔 넣고 지퍼를 끝까지 올렸다. 휴대폰 손전등을 켜자 하얀 원 안으로 판례집 책등들이 밀려들었다. 틈이 좁아지고 있었다. 어깨너비. 그보다 좁게.<\/p>\n<p>달래가 몸을 일으키다 휘청였다. 그녀의 오른발이 레일 홈에 걸렸다.<\/p>\n<p>\"잠깐, 내 발— 진서야, 발이—\"<\/p>\n<p>서가가 그녀의 정강이에 닿았다.<\/p>\n<p>멈추지 않았다.<\/p>\n<p>뼈가 짓눌리는 둔한 소리. 그리고 달래의 비명이 서고 천장을 찢었다. 손전등 불빛 속에서 그녀의 얼굴이 하얗게 일그러졌다. 판례집들이 선반에서 쏟아져 내 머리와 어깨를 때렸다.<\/p>\n<p>나는 수동 핸들을 향해 손을 뻗었다. 손끝이 차가운 쇠에 닿지 않았다. 한 뼘이 모자랐다.<\/p>\n<p>그때였다.<\/p>\n<p>서가 너머에서 흰 백합 향이 났다.<\/p>\n<p>진하고, 달고, 썩기 직전의 과일 같은 향. 어둠 속에서 구두 굽 소리가 천천히 다가왔다. 서두르지 않는 걸음이었다.<\/p>\n<p>\"장부는 두고 가요, 진서 씨. 아니면 둘 다 여기서 판례집이 되는 거예요.\"<\/p>","chars":5065},{"title":"최종 공판","html":"<div class=\"timer\">[D-1 / 22:40]<\/div>\n<p>달래의 비명이 철제 선반을 타고 울렸다.<\/p>\n<p>서가가 다가오고 있었다. 양쪽에서 동시에. 모터가 웅웅거릴 때마다 레일 위 바퀴가 쇳가루를 갈아내는 소리가 났고, 선반에서 쏟아진 판례집들이 내 발등을 찍었다. 오래된 종이 먼지가 목구멍에 엉겼다.<\/p>\n<p>\"진서야, 다리, 다리가—\"<\/p>\n<p>달래의 오른쪽 정강이가 아래 선반 틈에 물려 있었다. 서가 사이 간격은 이미 어깨 너비도 안 됐다.<\/p>\n<p>나는 장부를 점퍼 안쪽에 쑤셔 넣고 지퍼를 목까지 올렸다. 딱딱한 표지가 가슴뼈를 눌렀다. 서가 끝 수동 핸들까지 팔을 뻗었다. 손가락 끝이 차가운 쇠에 닿을락 말락 했다. 한 뼘. 서가가 내 팔꿈치를 밀어붙였다.<\/p>\n<p>닿지 않았다.<\/p>\n<p>흰 백합 향이 짙어졌다. 서가 너머 어디선가 구두 굽이 느릿하게 돌아섰다.<\/p>\n<p>\"시간 끌어봤자예요, 진서 씨.\"<\/p>\n<p>그때 반대편 끝에서 쇳소리가 났다.<\/p>\n<p>끼익. 끼이익.<\/p>\n<p>모터 소리가 한 박자 늦어졌다. 내 쪽 서가가 멈칫했다. 누군가 맞은편 핸들을 모터와 반대로 돌리고 있었다.<\/p>\n<p>틈 사이로 보였다. 흰 셔츠 등판이 땀에 젖어 살갗에 달라붙어 있었다. 핸들을 쥔 두 손등에 핏줄이 섰다.<\/p>\n<p>백시헌이었다.<\/p>\n<hr class=\"scene\">\n<p>그는 서가와 서가 사이, 사람 하나 겨우 들어갈 틈에 몸을 비집어 넣고 있었다. 옷장만 한 어둠이었다.<\/p>\n<p>숨소리가 들렸다. 짧고, 얕고, 빨랐다. 들이쉬기만 하고 내쉬지 못하는 숨.<\/p>\n<p>\"시헌아—\"<\/p>\n<p>\"말 시키지 마.\"<\/p>\n<p>이가 딱딱 부딪는 소리 사이로 그가 말했다. 핸들이 반 바퀴 돌았다. 서가가 손가락 두 마디만큼 물러났다. 모터가 앙탈하듯 으르렁거렸다.<\/p>\n<p>\"비상 정지. 기둥 아래, 빨간 거.\"<\/p>\n<p>나는 발밑을 더듬었다. 쏟아진 판례집, 레일의 미끈한 기름, 그리고 손바닥만 한 플라스틱 덮개. 덮개를 손톱으로 뜯어내고 버튼을 주먹으로 내리쳤다.<\/p>\n<p>웅— 하던 소리가 뚝 끊겼다.<\/p>\n<p>정적이 귀를 먹먹하게 눌렀다. 형광등 하나가 찌르르 울다 켜졌다.<\/p>\n<p>서가 너머에서 한숨 같은 웃음이 들렸다.<\/p>\n<p>\"이시헌 씨. 좁은 데 싫어하잖아요. 15년 전에도 그랬고.\"<\/p>\n<p>구두 굽 소리가 멀어졌다. 서두르지 않는 걸음이었다. 흰 백합 향이 계단 쪽으로 옅어졌다. 그녀가 어디로 가는지 나는 알았다. 아래로. 제0법정, 흑유리 너머 그녀의 자리로. 쫓아갈 시간은 없었다.<\/p>\n<p>시헌이 핸들을 놓지 못한 채 무릎을 꿇었다. 손이 쇠에 얼어붙은 것 같았다. 나는 서가 틈으로 기어가 그의 손가락을 하나씩 폈다. 손바닥이 얼음장이었다.<\/p>\n<p>\"됐어. 멈췄어.\"<\/p>\n<p>그가 그제야 숨을 내쉬었다. 길게, 쇳소리 섞인 숨을.<\/p>\n<p>\"…네 친구가 문자 보냈어. 서고, 지금, 빨리. 마침표도 없이.\"<\/p>\n<p>달래가 바닥에 누운 채 손을 흔들었다. 정강이가 이상한 각도로 꺾여 있었다. 얼굴은 하얬는데 입꼬리는 올라가 있었다.<\/p>\n<p>\"[단독] 오달래, 다리 부러지고 특종 잡아.\"<\/p>\n<p>\"웃지 마. 진짜 부러졌어.\"<\/p>\n<p>\"아니까 웃는 거야. 안 웃으면 울 거 같거든.\"<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-1 / 22:51]<\/div>\n<p>달래의 다리 양옆에 판례집 두 권을 대고 시헌의 넥타이로 묶었다. 달래가 이를 악물었다가 욕을 한 바가지 뱉었다. 땀 냄새와 피 냄새와 묵은 종이 냄새가 한데 뒤섞였다.<\/p>\n<p>달래는 누운 채로 휴대폰 카메라를 들었다. 내가 장부를 한 장씩 넘기면 한 장씩 찍었다. 손이 떨리지 않았다. 5년 동안 사건 현장에서 단련된 손이었다.<\/p>\n<p>\"한도경 검사님한테 보냈어. 서울중앙지검 강력부. 나한테 빚이 제일 많은 취재원.\"<\/p>\n<p>답장은 1분 만에 왔다. 달래가 화면을 내 쪽으로 돌렸다.<\/p>\n<div class=\"doc\">사본으론 안 됨. 원본 대조해야 집행정지 지휘 가능. 428조 단서. 내일 09:00까지 원본 들고 와요. 그 전엔 나도 못 움직여.<\/div>\n<p>09:00. 집행은 10:00.<\/p>\n<p>한 시간.<\/p>\n<p>나는 장부를 점퍼 안에 다시 넣었다. 심장이 표지를 두드렸다.<\/p>\n<p>\"진서야.\"<\/p>\n<p>달래가 내 손목을 잡았다.<\/p>\n<p>\"지금 나가면 돼. 지검 앞에서 밤새고, 아홉 시에 문 열리면 들어가. 공판 같은 거 안 가도—\"<\/p>\n<p>판례집 앱이 손안에서 떨었다.<\/p>\n<div class=\"doc\">최종 공판 23:00. 생존 당사자 3인 — 정진서, 서이안, 도경민. 불출석 시 즉시 집행.<\/div>\n<p>불출석하면 내 갑호증이 열린다. 그건 괜찮았다. 문제는 그다음이었다. 사형수의 딸이 훔쳐 낸 장부. 판관회는 그렇게 쓸 것이다. 케이스북에, 언론에, 한 검사의 상관 책상 위에. 원본이 지검에 닿기도 전에 장부는 장물이 된다.<\/p>\n<p>그리고 살아남아 받는 청원권. 재판장은 들어주지 않을 것이다. 판관회는 거래하지 않는다고, 그가 직접 말했으니까.<\/p>\n<p>들어주지 않을 사람에게 청원하는 대신—<\/p>\n<p>\"달래야. 규칙 제1조, 기억나?\"<\/p>\n<p>달래가 눈을 가늘게 떴다. 기자가 냄새를 맡는 얼굴.<\/p>\n<p>\"너 지금 되게 위험한 생각 하는 얼굴이다.\"<\/p>\n<p>\"응. 청원 말고, 기소할 거야.\"<\/p>\n<p>\"누굴.\"<\/p>\n<p>나는 천장을 봤다. 이 바닥 아래, 스물세 칸 계단 밑에서 종이 울릴 자리를.<\/p>\n<p>\"재판장.\"<\/p>\n<p>달래가 입을 벌렸다가 닫았다. 그리고 부목 댄 다리를 툭 쳤다. 욕이 먼저 나왔다.<\/p>\n<p>\"[속보] 정진서, 미쳤다. 동료 '말릴 다리가 없어'.\"<\/p>\n<p>시헌이 고개를 들었다. 젖은 앞머리 사이로 눈이 날카로워져 있었다. 공황이 빠져나간 자리에 검사의 눈이 돌아오고 있었다.<\/p>\n<p>\"제1조엔 단서가 없어.\"<\/p>\n<p>\"확실해?\"<\/p>\n<p>\"서기 할 때 원본을 필사했어. 3년 동안 매년. 조문 열네 개 중에 단서 없는 건 제1조 하나야. 재판장이 일부러 그렇게 썼어. 판관들한테 겁주려고.\"<\/p>\n<p>\"겁준 문장이니까, 겁을 돌려주면 되겠네.\"<\/p>\n<p>판례집 공지창을 스크롤했다. 첫 기일의 규칙 전문. 머릿속에 이미 박혀 있는 글자들이 화면 위의 글자들과 한 줄씩 겹쳤다. 틀린 데가 없었다.<\/p>\n<p>시헌은 서가에 등을 기대고 앉아 나를 보고 있었다. 손끝이 아직 떨렸다. 나는 그에게 다가갔다. 입술이 먼저 움직였다. 제4공판의 계단, 내가 그를 판 그 밤.<\/p>\n<p>\"시헌아, 나, 그때—\"<\/p>\n<p>\"나중에.\"<\/p>\n<p>그가 손목시계를 내 눈앞에 들었다. 22:54.<\/p>\n<p>\"23시야.\"<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-1 / 22:58]<\/div>\n<p>달래는 철문 계단 맨 위 칸에 남았다. 시헌의 등에 업혀 내려왔다가, 거기서 내려 달라고 했다. 탈락자는 문턱을 넘지 못한다. 그녀는 벽에 등을 기대고 휴대폰 두 대를 무릎에 세웠다.<\/p>\n<p>\"여기서 다 찍을 거야. 소리만이라도. 한 검사님 실시간으로 듣게.\"<\/p>\n<p>\"달래야, 너 다리—\"<\/p>\n<p>\"내 다리는 내가 알아서 해. 넌 네 입이나 챙겨.\"<\/p>\n<p>그녀가 내 손에 레몬맛 사탕을 쥐여줬다. 첫 강의 날처럼. 비닐이 손바닥에 끈적하게 붙었다.<\/p>\n<p>제0법정으로 내려가는 계단은 열세 칸이었다. 한 칸 내려갈 때마다 공기가 차가워지고 젖은 돌 냄새가 짙어졌다.<\/p>\n<p>나는 열두 번째 칸에서 흑색 법복을 입었다. 소매가 손등을 덮었다. 처음 입던 밤엔 이 무게가 수의 같았다.<\/p>\n<p>단추를 잠그는 손가락이 자꾸 미끄러졌다. 시헌이 한 칸 위에서 내려와 내 앞에 섰다. 그는 탈락자였다. 법정 문턱을 넘을 수 없었다. 그래도 계단 끝까지는 따라왔다.<\/p>\n<p>그가 내 옷깃을 바로잡았다. 비뚤어진 깃을 두 손가락으로 펴는 손이 아직 차가웠다. 그 차가움이 목덜미에 닿을 때마다 숨이 멎었다.<\/p>\n<p>\"너, 저 안에서 말해야 해. 판관들 앞에서. 길게.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"더듬어도 돼.\"<\/p>\n<p>그가 마지막 단추를 잠갔다.<\/p>\n<p>\"기다릴게. 네 말이 끝날 때까지.\"<\/p>\n<p>목구멍이 뜨거워졌다. 15년 동안 아무도 나를 기다려주지 않았다. 나는 늘 첫 음절에서 걸려 넘어졌고, 사람들은 넘어진 나를 지나쳐 갔다. 이 사람은 지나가지 않았다. 내가 그를 판 다음에도.<\/p>\n<p>그의 손목을 잡았다. 맥박이 내 손가락 밑에서 빠르게 뛰었다. 공황이 아직 다 빠져나가지 않은 맥이었다. 그 맥으로 그는 서가 틈에 몸을 밀어 넣었다. 나 때문에.<\/p>\n<p>\"…고마워.\"<\/p>\n<p>\"그것도 나중에.\"<\/p>\n<p>또각, 또각. 아래에서 구두 소리가 올라왔다.<\/p>\n<p>서이안이었다. 흑색 법복에 은색 저울 브로치. 그녀는 철문 앞에 서서 우리를 올려다봤다. 단정하게 묶은 머리, 늘 사람을 내려다보는 턱.<\/p>\n<p>모두가 예상했다. 마지막 날, 서이안은 서씨 가문의 표로 나를 끝낼 거라고. 나도 그랬다. 시헌의 몸이 반 걸음 내 앞으로 나왔다.<\/p>\n<p>이안이 피식 웃었다.<\/p>\n<p>\"비켜, 백시헌. 안 물어.\"<\/p>\n<p>그녀가 계단을 두 칸 올라와 내 귀 가까이 입을 댔다. 비싼 향수 아래로 땀 냄새가 났다. 그녀도 떨고 있었다.<\/p>\n<p>\"우리 할아버지도 오늘 방청석에 있어.\"<\/p>\n<p>\"…알아.\"<\/p>\n<p>\"서씨 표는 내가 움직일게.\"<\/p>\n<p>나는 그녀를 봤다. 첫날 밤 '장학생도 오네'라고 비웃던 입술이, 지금은 웃지 않았다.<\/p>\n<p>\"왜.\"<\/p>\n<p>\"조윤강은 우리 집안 사람이 아니거든.\"<\/p>\n<p>그녀가 철문을 밀었다. 경첩이 길게 울었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-1 / 23:00]<\/div>\n<p>종이 울렸다.<\/p>\n<p>천장의 낡은 법정 종. 소리가 돌벽에 부딪혀 세 번, 네 번 되울렸다. 흑유리 너머에서 푸른 태블릿 불빛이 하나씩 켜졌다. 평소보다 많았다. 열다섯. 얼굴 없는 실루엣들.<\/p>\n<p>법대 위에 그가 앉아 있었다.<\/p>\n<p>가면은 없었다. 단정히 넘긴 백발, 금테 안경, 온화한 눈. 형사소송법 첫 강의에서 나를 무너뜨린 그 얼굴. 조윤강이 만년필 뚜껑을 닫았다. 딸깍.<\/p>\n<p>\"제62기 공판, 최종 기일을 개정합니다.\"<\/p>\n<p>낮고 부드러운 목소리. 변조기를 거치지 않은 진짜 목소리였다.<\/p>\n<p>\"오늘은 날짜가 좋군요. 15년 전 오늘 밤에도, 저는 이 자리에 있었습니다.\"<\/p>\n<p>그가 나를 보고 웃었다.<\/p>\n<p>\"생존 당사자 세 분, 축하합니다. 청원은 폐정 후에 받지요.\"<\/p>\n<p>흑유리 너머 오른쪽 끝, 실루엣 하나가 막 자리에 앉았다. 숨이 고르지 않은 어깨. 백합 향은 유리를 넘어오지 못했지만, 나는 그게 누군지 알았다.<\/p>\n<p>도경민이 고개를 숙인 채 손톱을 깨물었다. 이안은 정면만 봤다. 은색 저울이 그녀의 가슴께에서 아주 미세하게 떨렸다.<\/p>\n<p>\"정진서 학생.\"<\/p>\n<p>조윤강이 다정하게 덧붙였다.<\/p>\n<p>\"오늘은 대답을 기다릴 필요가 없겠죠. 묻지 않을 테니까.\"<\/p>\n<p>나는 손을 들었다.<\/p>\n<p>법정의 공기가 한쪽으로 쏠렸다. 이안이 숨을 삼켰다. 도경민의 의자가 삐걱였다.<\/p>\n<p>\"정진서 당사자. 발언하세요.\"<\/p>\n<p>손바닥에 땀이 찼다. 혀뿌리에 쇠붙이가 걸리는 익숙한 감각이 올라왔다. 철문 뒤에 시헌이 있었다. 기다리고 있었다.<\/p>\n<p>숨을 쉬었다.<\/p>\n<p>\"공판 규칙 제1조. 원문 그대로 낭독합니다.\"<\/p>\n<p>첫 기일 밤, 가면의 재판장이 판결문처럼 읽어 내려간 문장. 나는 그날 그것을 쪽과 줄까지 외웠다.<\/p>\n<p>\"본 법정 안의 모든 자는 당사자다.\"<\/p>\n<p>흑유리 너머 푸른 불빛 몇 개가 흔들렸다.<\/p>\n<p>\"판관도. 재판장도. 이 법정 안에 있는 한, 모두 당사자입니다. 그리고 당사자의 죄를 증거로 제출한 자는—\"<\/p>\n<p>조윤강의 미소가 아주 조금, 굳었다.<\/p>\n<p>\"검사가 됩니다.\"<\/p>\n<p>나는 점퍼 속에서 장부를 꺼냈다. 가죽 표지에 15년 묵은 곰팡이 냄새가 뱄다. 첫 장에 이정우의 마지막 손글씨가 있었다. 증거석 위에 그것을 내려놓았다. 툭. 둔한 소리가 법정 끝까지 굴러갔다.<\/p>\n<p>그리고 말했다.<\/p>\n<p>첫 음절이 걸리지 않았다.<\/p>\n<p>\"검사 유진서. 피고인 조윤강, 피고인석으로 나오십시오.\"<\/p>","chars":5071},{"title":"선고","html":"<div class=\"timer\">[D-0 / 00:00]<\/div>\n<p>종이 울리지 않았다.<\/p>\n<p>자정이었다. 날짜가 바뀔 때마다 울리던 천장의 종이 오늘은 입을 다물었다. 대신 흑유리 너머에서 태블릿 불빛 열다섯 개가 일제히 흔들렸다. 바람 없는 방의 촛불처럼.<\/p>\n<p>유진서.<\/p>\n<p>내가 내 입으로, 이 법정에서, 그 이름을 말했다. 혀끝에 쇠 맛이 남았다. 입술 안쪽을 깨물고 있었던 모양이었다.<\/p>\n<p>조윤강이 웃었다.<\/p>\n<p>\"훌륭합니다.\"<\/p>\n<p>그가 만년필을 내려놓고 일어섰다. 법복 자락이 법대 모서리를 쓸었다. 그는 계단을 천천히 내려왔다. 구두 소리가 돌바닥에 또박또박 박혔다.<\/p>\n<p>\"규칙은 제가 썼습니다. 제가 거부하면, 제가 쓴 규칙을 제 손으로 깨는 거죠.\"<\/p>\n<p>그가 피고인석의 쇠 난간을 손바닥으로 쓸었다. 민규가 울고, 달래가 버티고, 시헌이 침묵하던 그 난간.<\/p>\n<p>\"생각보다 차갑군요, 이 자리.\"<\/p>\n<p>그가 앉아 다리를 꼬았다. 피고인석에서도 그는 재판장처럼 앉았다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-0 / 01:20]<\/div>\n<p>나는 공소장을 쓰지 않았다. 외웠다.<\/p>\n<p>\"증 제1호. 이정우의 장부 원본. 2008년부터 2011년까지 법무법인 한결을 거친 판관회 자금 흐름. 마지막 장 메모 — '이 장부를 가진 자를 판관회는 죽인다. 백정만, 조윤강.'\"<\/p>\n<p>장부를 실물화상기 위에 펼쳤다. 스크린에 누렇게 바랜 글씨가 떴다. 볼펜이 종이를 파고든 필압까지 보였다.<\/p>\n<p>\"증 제2호. 2011고합1129 제3회 공판조서 14쪽 7행, 사망추정시각 23시 30분부터 0시 30분. 같은 조서 22쪽 2행, 피고인 유태석의 다음 콜 수락 23시 52분, 사당동.\"<\/p>\n<p>\"그 콜 기록은 존재하지 않습니다, 검사.\"<\/p>\n<p>조윤강이 다리를 바꿔 꼬았다. 부드러운 목소리였다.<\/p>\n<p>\"서버 장애였죠. 조서에도 그렇게 적혀 있을 텐데요.\"<\/p>\n<p>\"적혀 있습니다. 그래서 증 제3호.\"<\/p>\n<p>\"잠깐.\"<\/p>\n<p>그가 손바닥을 들었다. 강의실에서 학생의 말을 끊을 때와 똑같은 손짓이었다.<\/p>\n<p>\"증 제1호부터 다시 보죠. 그 장부, 어디서 났습니까? 폐가 서고 장서를 무단으로 훼손해서 꺼냈겠죠. 절취한 물건입니다. 형사소송법 제308조의2. 위법하게 수집된 증거는 증거로 할 수 없다. 검사가 제2공판에서 직접 쓰신 조문이던데요.\"<\/p>\n<p>흑유리 너머 실루엣들이 고개를 끄덕였다. 그래프가 무죄 쪽으로 한 칸 기울었다.<\/p>\n<p>혀뿌리가 굳었다. 그는 내 무기를 집어 내게 겨누고 있었다. 엄지가 검지를 더듬었다. 나는 그 손을 증거석 모서리에 눌렀다. 쇠가 차가웠다.<\/p>\n<p>\"그 조문은, 수사기관이 수집한 증거에 적용됩니다.\"<\/p>\n<p>\"이 법정은 수사기관이 아닙니다.\"<\/p>\n<p>\"네. 첫 기일에 재판장께서 직접 말씀하셨죠. 이곳은 국가의 법정이 아니라고. 사인(私人)이 수집한 증거는 공익과 사익을 형량해 판단합니다. 대법원 판례입니다. 일가족 둘의 목숨, 한 사람의 15년, 그리고 판례집 한 권.\"<\/p>\n<p>나는 그를 봤다.<\/p>\n<p>\"형량해 보시죠.\"<\/p>\n<p>조윤강이 처음으로 대답하지 않았다. 그가 만년필을 찾듯 빈손을 쥐었다 폈다.<\/p>\n<p>스크린이 바뀌었다. 최민규가 보내온 화면. 프린터 메타데이터와 원격 접속 IP.<\/p>\n<p>\"제1공판 위조 증거를 출력한 프린터, 한결 기록실 하드를 지운 접속지. 모두 서울대 법학관 리걸클리닉입니다. 지도 변호사 임소라. 15년 전 이 사건 1심 국선변호인. 왼손 약지에 흑요석 반지.\"<\/p>\n<p>방청석이 웅성거렸다. 실루엣 몇이 고개를 맞댔다.<\/p>\n<p>투표 그래프가 꿈틀했다. 유죄 쪽으로 다섯. 여섯. 그리고 거기서 멈췄다.<\/p>\n<p>이안이 고개를 들어 흑유리를 올려다봤다. 은색 저울 브로치가 형광등 아래서 번뜩였다. 그녀가 엄지로 휴대폰을 몇 번 눌렀다. 방청석 왼쪽 끝, 실루엣 셋이 동시에 태블릿을 들었다.<\/p>\n<p>일곱. 여덟.<\/p>\n<p>조윤강의 시선이 처음으로 방청석으로 갔다.<\/p>\n<p>\"서 원장님.\"<\/p>\n<p>대답은 없었다. 왼쪽 끝 실루엣 하나가 태블릿 불빛을 꺼버렸다. 기권. 그건 어떤 대답보다 큰 소리였다.<\/p>\n<p>\"검사.\"<\/p>\n<p>조윤강이 다시 나를 봤다. 목소리가 아주 조금 빨라져 있었다.<\/p>\n<p>\"장부에 이름이 있다고 살인의 증거가 되진 않습니다. 옷장 속 아이가 본 건 얼굴이 아니라 손이었죠. 15년 전 그 아이는 제 앞에서 고개를 끄덕였습니다.\"<\/p>\n<p>\"그래서 증인을 신청합니다.\"<\/p>\n<p>나는 철문을 봤다.<\/p>\n<p>\"증인 이시헌.\"<\/p>\n<hr class=\"scene\">\n<p>탈락자는 법정에 들어올 수 없다. 그러나 증인은 당사자가 아니다. 철문이 열렸다.<\/p>\n<p>시헌이 걸어 들어왔다. 셔츠가 서고 먼지로 잿빛이었다. 증인석까지 열네 걸음. 그는 한 번도 비틀거리지 않았다. 난간을 쥔 손가락 마디만 하얬다.<\/p>\n<p>\"증인은 2011년 9월 14일 밤, 어디에 있었습니까.\"<\/p>\n<p>\"안방 옷장 안에요.\"<\/p>\n<p>목소리가 잠겼다. 그가 목을 가다듬었다.<\/p>\n<p>\"문틈이 손가락 하나만큼 열려 있었습니다. 거기로 손이 보였어요. 왼손. 약지에 검은 돌. 그 손이 엄마의—\"<\/p>\n<p>그가 멈췄다. 나는 기다렸다. 그가 나를 기다려준 만큼.<\/p>\n<p>\"그 손을 15년 동안 꿈에서 봤습니다. 그리고 며칠 전, 한결 32층 대표 집무실 앞에서 봤어요. 결재 서류를 넘기던 손. 반지가 살을 파고든 자국, 검지 첫 마디의 흉터까지 같았습니다.\"<\/p>\n<p>그가 숨을 들이쉬었다.<\/p>\n<p>\"그 손은 제 양아버지, 백정만의 손입니다.\"<\/p>\n<p>방청석에서 의자 끄는 소리가 났다.<\/p>\n<p>흑유리 너머 가장 안쪽 자리. 실루엣 하나가 천천히 일어섰다. 큰 키, 넓은 어깨. 그가 유리 앞까지 걸어오자 조명이 비스듬히 얼굴에 닿았다. 은테 안경, 반백의 머리, 인자하게 처진 눈꼬리. 백정만이었다.<\/p>\n<p>그가 마이크 버튼을 눌렀다. 스피커에서 숨소리가 먼저 흘러나왔다.<\/p>\n<p>\"시헌아.\"<\/p>\n<p>아이를 재우는 목소리였다.<\/p>\n<p>\"그날 밤 많이 무서웠지. 무서우면 사람은 아무 손이나 기억한단다. 아버지가 그걸 제일 잘 알지.\"<\/p>\n<p>시헌의 어깨가 움찔했다.<\/p>\n<p>\"이제 그만 내려오렴. 저 아가씨는 사형수 딸이란다. 제 아비 살리려고 너를 쓰는 거야. 너는 또 이용당하는 거고.\"<\/p>\n<hr class=\"scene\">\n<p>그래프가 멈췄다. 그리고 뒤로 물러났다. 여덟. 일곱.<\/p>\n<p>판관들은 장부를 믿지 않는 게 아니었다. 그들이 믿지 못하는 건 장부를 든 사람이었다. 사형수의 딸. 가짜 이름으로 이 학교에 들어온 거짓말쟁이.<\/p>\n<p>시헌이 증인석 난간을 쥔 채 나를 봤다. 그의 입술이 하얗게 말라 있었다. 양아버지의 목소리가 그의 귀에 아직 남아 있는 게 보였다. 15년 동안 그를 재우던 목소리.<\/p>\n<p>여기서 지면, 그는 다시 옷장으로 돌아간다. 거짓말한 아이로. 그리고 아빠는 열 시에.<\/p>\n<p>엄지가 검지로 갔다. 큐티클이 이미 너덜했다. 나는 손을 펴서 증거석 위에 올렸다. 손바닥 밑으로 가죽 표지의 거친 결이 느껴졌다.<\/p>\n<p>이 법정이 믿지 못하는 건 내 이름이었다. 정진서. 열한 살 겨울에 엄마가 지어준 가짜. 가짜 이름으로는 진짜 장부를 들 수 없었다.<\/p>\n<p>그렇다면 진짜를 내놓으면 됐다. 입학 취소. 실명 공개. 15년 동안 도망쳐 온 모든 것. 그게 내가 걸 수 있는 유일한 담보였다.<\/p>\n<p>판례집 앱을 열었다. 갑호증 목록 맨 아래, 붉은 자물쇠가 걸린 칸.<\/p>\n<div class=\"doc\">갑 제3호증 — 사건명: 유진서. 보관자 2인.<\/div>\n<p>규칙 어디에도, 본인이 자기 갑호증의 집행을 신청할 수 없다는 조항은 없었다. 나는 그 규칙을 보름 동안 외웠다.<\/p>\n<p>\"검사는 갑 제3호증의 집행을 신청합니다.\"<\/p>\n<p>조윤강의 눈썹이 올라갔다. 처음 보는 표정이었다.<\/p>\n<p>\"누구 것인지 알고 하는 말입니까.\"<\/p>\n<p>\"제 겁니다.\"<\/p>\n<p>화면을 눌렀다. 스크린이 하얗게 번쩍였다.<\/p>\n<p>내 학생증 사진. 그 옆에 열한 살의 내 사진. 2011년 9월 15일자 신문 스캔. 개명 허가 결정문. 그리고 내가 쓴 자기소개서의 한 줄. <span class=\"sys\">가족 사항: 부 사망.<\/span><\/p>\n<p>옆 창에 송출 화면이 열렸다. 케이스북 메인 게시. 교학과 메일 발송. 언론사 제보 일곱 곳.<\/p>\n<p>전송 완료.<\/p>\n<p>\"저는 사형수 유태석의 딸, 유진서입니다.\"<\/p>\n<p>목소리가 법정 끝 돌벽에 부딪혀 돌아왔다. 걸리지 않았다.<\/p>\n<p>\"이 장부가 거짓이면, 제 인생도 같이 끝내십시오.\"<\/p>\n<p>정적.<\/p>\n<p>흑유리 너머 어딘가에서, 누군가 태블릿을 내려놓았다.<\/p>\n<p>휴대폰이 떨었다. 철문 밖 계단에 판례집 부목을 댄 다리를 뻗고 누워 있을 달래였다.<\/p>\n<div class=\"doc\">생중계 한 검사님한테 계속 쏘는 중. 검사님이 화면 보고 욕함. 좋은 욕.<\/div>\n<hr class=\"scene\">\n<div class=\"timer\">[D-0 / 05:58]<\/div>\n<p>종이 울렸다.<\/p>\n<div class=\"doc\">선고 — 유죄 11 : 무죄 4.<\/div>\n<p>조윤강이 피고인석에서 일어섰다. 그는 웃으려 했다. 입꼬리가 올라가다 중간에서 멈췄다. 처음이었다. 그 얼굴에서 온화함이 벗겨져 나가는 걸 본 건. 그 밑에 있던 건 늙고 마른, 아주 평범한 분노였다.<\/p>\n<p>\"판결은 진실이 아니에요, 유진서 양. 질서지.\"<\/p>\n<p>\"그러니까 다시 할 수 있죠. 재심으로.\"<\/p>\n<p>나는 장부를 안고 돌아섰다. 06:00. 집행까지 네 시간.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-0 / 06:40]<\/div>\n<p>시헌이 운전했다. 달래는 뒷좌석에 다리를 뻗고 누워 휴대폰 두 대를 번갈아 귀에 댔다. 새벽의 남부순환로, 가로등이 차창에 주황색 줄을 그었다. 히터에서 먼지 타는 냄새가 났다. 장부를 안은 내 팔이 저렸다.<\/p>\n<p>케이스북 알림이 끊임없이 떴다. <span class=\"sys\">[실명] 1L 정진서 = 사형수 유태석의 딸<\/span>. 댓글 수가 초 단위로 올라갔다. 나는 화면을 엎었다. 손이 떨리지 않았다. 이상했다. 15년 동안 제일 무서웠던 일이 지금 벌어지고 있는데.<\/p>\n<p>\"후회해?\"<\/p>\n<p>시헌이 앞을 본 채 물었다.<\/p>\n<p>\"아니.\"<\/p>\n<p>\"거짓말이면 손가락 봐.\"<\/p>\n<p>나는 손을 펴서 그에게 보여줬다. 피는 말라 있었다. 새로 뜯긴 데가 없었다. 그가 한 번 보고, 다시 도로를 봤다. 핸들을 쥔 손가락이 조금 풀렸다.<\/p>\n<p>뒷좌석에서 달래가 전화에 대고 소리쳤다.<\/p>\n<p>\"네, 검사님. 원본이요. 원, 본. 47쪽 다 있어요. 우리 진서가 쪽수까지 외웠어요. 네? 아뇨, 그건 사람이에요, 복사기 아니고.\"<\/p>\n<p>08:47, 서초동 서울중앙지검. 09:00, 한도경 검사가 로비로 직접 내려왔다. 짧은 머리, 밤샌 눈, 식은 커피 냄새. 그녀는 인사 대신 장부를 받아 들었다. 그리고 나를 한 번 봤다.<\/p>\n<p>\"생중계 봤어요. 그 집행, 본인이 한 거죠.\"<\/p>\n<p>\"네.\"<\/p>\n<p>\"미쳤네.\" 그녀가 엘리베이터 버튼을 눌렀다. \"좋은 쪽으로.\"<\/p>\n<p>09:00부터 09:31까지, 나는 감정실 앞 플라스틱 의자에 앉아 벽시계 초침을 셌다. 1,860번. 형광등이 윙윙거렸다. 자판기 커피의 탄 냄새가 복도에 고였다. 시헌은 내 옆에서 한 번도 휴대폰을 보지 않았다.<\/p>\n<p>09:31. 감정실 문이 열렸다.<\/p>\n<p>\"필체, 지질, 잉크, 2011년 압수물 목록. 다 맞아요.\"<\/p>\n<p>09:44, 지휘서 작성. 09:52, 차장검사 결재. 결재판을 든 수사관이 복도를 뛰었다.<\/p>\n<p>09:58. 팩스가 울었다.<\/p>\n<div class=\"doc\">형집행정지 지휘 — 형사소송법 제428조 단서. 사형확정자 유태석.<\/div>\n<p>한 검사가 스피커폰을 켰다. 서울구치소 보안과장의 목소리가 지직거렸다.<\/p>\n<div class=\"timer\">[D-0 / 10:00]<\/div>\n<p>\"지금, 집행조가 감방 앞에—\"<\/p>\n<p>숨이 쉬어지지 않았다. 시헌이 내 손을 잡았다. 달래가 목발로 바닥을 짚고 일어섰다.<\/p>\n<p>\"교도관이… 멈췄습니다. 감방 앞에서. 멈췄어요.\"<\/p>\n<p>다리에서 힘이 빠졌다. 시헌이 나를 받쳤다.<\/p>\n<p>그때 복도 끝 엘리베이터가 열렸다. 수사관 둘이 한 남자의 양팔을 잡고 나왔다. 변호인단을 이끌고 지검에 들어왔다가 그 자리에서 긴급체포됐다고 했다. 수갑 위에 양복 상의가 덮여 있었다.<\/p>\n<p>백정만이 시헌 앞에서 멈췄다. 수사관이 팔을 당겼지만 그는 움직이지 않았다. 인자한 눈꼬리가 내려왔다. 그가 수갑 찬 두 손을 들어, 아들의 볼을 쓰다듬듯 허공에 멈췄다.<\/p>\n<p>\"기억 안 나니, 시헌아.\"<\/p>\n<p>목소리가 다정했다.<\/p>\n<p>\"그날 문을 열어준 건 너였잖니. 내가 '아빠 친구'라고 했더니.\"<\/p>","chars":5342},{"title":"재심","html":"<div class=\"timer\">[D-0 / 10:03]<\/div>\n<p>시헌이 무릎을 꿇었다.<\/p>\n<p>엘리베이터 문이 닫히고 백정만의 구두 소리가 사라진 뒤에도, 그는 지검 복도의 회색 타일 위에 그대로 있었다. 두 손이 바닥을 짚었다. 손등의 핏줄이 떨렸다. 숨이 들어가기만 하고 나오지 않았다.<\/p>\n<p>나는 그 옆에 앉았다. 차가운 타일이 무릎뼈를 찔렀다. 아무 말도 하지 않았다.<\/p>\n<p>그의 등에 손바닥을 댔다. 젖은 셔츠 너머로 갈비뼈가 오르내렸다. 하나. 둘.<\/p>\n<p>셋에서 그가 숨을 내쉬었다.<\/p>\n<p>넷에서 그가 소리 내어 셌다.<\/p>\n<p>\"…다섯.\"<\/p>\n<p>복도 끝 정수기가 꾸르륵 울었다. 달래가 목발을 짚고 멀찍이 서서, 지나가는 수사관들을 눈빛으로 막고 있었다. 아무도 우리 쪽으로 오지 않았다.<\/p>\n<p>\"문 열었대. 내가.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"기억이 안 나.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"근데, 맞는 거 같아.\"<\/p>\n<p>나는 그의 손을 잡았다. 차가운 손가락이 내 손가락 사이로 파고들었다.<\/p>\n<p>\"열세 살이었어. 아빠 친구라고 했고.\"<\/p>\n<p>열 번째 숨에서, 그가 고개를 들었다.<\/p>\n<hr class=\"scene\">\n<div class=\"doc\">[9월 16일 / 07:10]<\/div>\n<p>텔레비전 소리가 고시원 복도까지 새어 나왔다.<\/p>\n<div class=\"doc\">법무법인 한결 본사 압수수색… 32층 대표실·기록실 B동<\/div>\n<p>화면 속 강남 빌딩 로비에서 파란 박스가 줄줄이 실려 나갔다. 달래는 총무실 간이침대에 깁스한 다리를 올려놓고 리모컨을 쥐고 있었다. 정강이부터 발목까지 하얀 석고. 거기 매직으로 큼직하게 써 있었다. <span class=\"sys\">[단독] 이 다리, 특종의 대가.<\/span> 본인 글씨였다.<\/p>\n<p>\"한 검사님 장난 아니다. 영장 세 개를 이틀 만에 받아냈어.\"<\/p>\n<p>컵라면 국물 냄새가 방에 눅눅하게 배어 있었다. 제4공판 이후 처음으로, 나는 배가 고팠다.<\/p>\n<p>다음 날, 조윤강의 영장실질심사. 포승에 묶여 법원 계단을 오르는 얼굴 위로 플래시가 터졌다. \"사법부의 양심이라 불리셨는데요.\" 기자의 물음에 그는 대답하지 않았다. 백발이 흐트러져 있었다. 처음 보는 모습이었다.<\/p>\n<p>같은 날 임소라. 그녀는 장갑을 끼지 않았다. 왼손 약지에 반지 자국만 하얗게 남아 있었다. 그리고 그다음 날, 백정만. 증거인멸 우려. 구속.<\/p>\n<p>나는 화면 대신 달래의 노트북을 봤다. 장부 마지막 장, 송금 수령인 명단. 이정우가 볼펜으로 눌러 쓴 이름은 다섯이었다.<\/p>\n<p>\"달래야. 기사에 나온 판관, 몇 명이야.\"<\/p>\n<p>\"조윤강, 백정만, 임소라. 셋. 왜.\"<\/p>\n<p>\"장부엔 다섯이야.\"<\/p>\n<p>달래가 리모컨을 내려놓았다. 기자의 얼굴이 돌아왔다.<\/p>\n<p>\"나머지 둘은.\"<\/p>\n<p>나는 화면을 짚었다. 네 번째 줄, <span class=\"sys\">서규헌<\/span>. 다섯 번째 줄은 이니셜 두 글자뿐이었다.<\/p>\n<p>어떤 언론도 그 두 줄을 쓰지 않았다. 한 검사의 영장 청구서에도 없다고 했다. 달래가 휴대폰을 들었다가, 천천히 내려놓았다.<\/p>\n<p>\"[단독] 다섯 개의 반지 중 두 개는, 아직 손가락에 있다.\"<\/p>\n<p>그날 밤, 총무실 CCTV 모니터에 낯익은 어깨가 잡혔다. 고시원 현관 앞, 여행 가방 하나를 든 남자.<\/p>\n<p>나는 슬리퍼를 끌고 내려갔다. 녹두거리의 밤공기에서 기름 냄새와 비 냄새가 났다. 시헌이 가방 손잡이를 쥔 채 서 있었다. 셔츠 대신 회색 후드티. 처음 보는 옷이었다.<\/p>\n<p>\"한남동 집, 압수수색 들어왔어. 내 방도.\"<\/p>\n<p>\"…그래서.\"<\/p>\n<p>\"방 있어? 제일 싼 걸로.\"<\/p>\n<p>뒤에서 목발 소리가 났다. 달래가 계단참에 서서 우리를 내려다보고 있었다.<\/p>\n<p>\"[단독] 한결 상속자, 3평 고시원 입주… 총무 '월세는 깎아줄 수 없어'.\"<\/p>\n<p>시헌이 웃었다. 소리 없이, 어깨만 떨면서. 나는 그의 가방을 받아 들었다. 생각보다 가벼웠다. 15년을 산 집에서 그가 들고 나온 건 이만큼이었다.<\/p>\n<p>\"304호. 창문 없어. 괜찮아?\"<\/p>\n<p>그가 잠깐 멈췄다. 좁고 어두운 방. 옷장 같은.<\/p>\n<p>\"…문 열어 놓고 자면 돼.\"<\/p>\n<hr class=\"scene\">\n<div class=\"doc\">[9월 19일 / 14:00]<\/div>\n<p>법학관 5층 소회의실. 긴 탁자 끝에 교수 다섯과 교학과장. 식어가는 종이컵 커피 냄새. 에어컨 바람이 너무 셌다.<\/p>\n<p>\"학생은 입학 서류에 가족 사항을 허위로 기재했습니다. 인정합니까.\"<\/p>\n<p>\"인정합니다.\"<\/p>\n<p>첫 음절이 걸리지 않았다. 교수 한 명이 안경을 고쳐 썼다.<\/p>\n<p>\"사유를 말해보세요.\"<\/p>\n<p>\"제 이름으로는 여기 못 들어올 거라고 생각했습니다. 제가 틀렸으면 좋겠습니다.\"<\/p>\n<p>\"감정에 호소하는 겁니까.\"<\/p>\n<p>맨 끝의 교수가 서류를 덮었다. 형사법 담당. 조윤강의 수제자라는 소문이 있던 사람이었다.<\/p>\n<p>\"허위 기재는 사실입니다. 동기가 어떻든.\"<\/p>\n<p>\"네. 사실입니다.\"<\/p>\n<p>나는 그를 똑바로 봤다. 손은 탁자 위에 펴져 있었다.<\/p>\n<p>\"그래서 제가 직접 공개했습니다. 아무도 저를 고발하기 전에. 판결이 틀렸으면 다시 하는 게 법이라고, 여기서 배웠습니다. 제 입학이 틀렸으면 다시 하십시오. 대신 제 이름으로 하십시오. 유진서.\"<\/p>\n<p>회의실이 조용해졌다. 에어컨 송풍구가 덜컥, 하고 한 번 울었다.<\/p>\n<p>노크도 없이 문이 열렸다.<\/p>\n<p>서이안이 서류철을 한 아름 안고 들어왔다. 그녀가 그것을 탁자 위에 쿵 내려놓았다.<\/p>\n<p>\"탄원서입니다. 1L부터 3L까지, 312명.\"<\/p>\n<p>교학과장이 서류철을 넘겼다. 첫 번째 서명란, 서이안. 두 번째, 최민규 — 괄호 안에 '재입학 신청 중'. 세 번째, 삐뚤빼뚤한 글씨로 오달래.<\/p>\n<p>종이 넘기는 소리가 한참 이어졌다. 312명. 내 이름을 알게 된 지 나흘 된 사람들이었다.<\/p>\n<p>심의는 재심 판결 때까지 보류됐다. 퇴학도, 통과도 아닌 말. 그래도 나는 회의실 문을 내 발로 걸어 나왔다.<\/p>\n<p>회의실을 나서며 이안이 내 옆을 스쳤다. 향수 냄새 아래로 잉크 냄새가 났다.<\/p>\n<p>\"고마워하지 마.\"<\/p>\n<p>\"…왜.\"<\/p>\n<p>\"우리 할아버지 이름, 기사에 안 나왔지. 그거 내가 한 거 아니야.\"<\/p>\n<p>은색 저울 브로치가 복도 형광등 아래 차갑게 빛났다. 나는 그 말의 뒷면을 오래 만졌다.<\/p>\n<hr class=\"scene\">\n<div class=\"doc\">[9월 21일 / 21:30]<\/div>\n<p>녹두거리 순댓국집은 그대로였다. 김 서린 유리문, 끓어 넘치는 뚝배기, 벽에 붙은 '공기밥 무한'.<\/p>\n<p>넷이 앉았다. 나, 달래, 시헌, 민규. 민규는 재입학 신청서 접수증을 테이블 위에 펼쳐 놓고 자꾸 쓰다듬었다. 달래는 깁스한 다리를 옆 의자에 올리고 새우젓을 국에 쏟아부었다.<\/p>\n<p>\"편집국장이 복직하래. 부장 달아준대.\"<\/p>\n<p>\"그래서.\"<\/p>\n<p>\"싫다 그랬지. 나 변호사 할 거야. 기사 쓰는 변호사.\" 달래가 숟가락으로 시헌을 가리켰다. \"[단독] 백시헌, 순댓국에 다대기 안 넣는 남자로 밝혀져.\"<\/p>\n<p>시헌이 다대기를 한 숟갈 떴다. 민규가 웃다가 사레가 들렸다. 그가 물을 들이켜고 나를 봤다.<\/p>\n<p>\"진서 씨. 연주대에서 나 잡았을 때요.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"손목 아팠어요. 진짜 세게 잡아서.\"<\/p>\n<p>\"미안.\"<\/p>\n<p>\"아뇨.\" 민규가 접수증을 접어 가슴 주머니에 넣었다. \"그거 갚으려고 한결 들어간 거예요. 이제 됐죠.\"<\/p>\n<p>나도 웃었다. 목구멍 깊은 데서 올라오는 웃음이었다. 1학기 첫 주, 아무것도 모르던 밤처럼.<\/p>\n<p>휴대폰이 떨었다. 한도경 검사.<\/p>\n<div class=\"doc\">재심 개시 결정 내일 오전 선고. 형집행정지 유지, 석방은 구속집행정지 형식. 10시, 정문.<\/div>\n<p>테이블이 조용해졌다. 뚝배기 끓는 소리만 남았다.<\/p>\n<p>나는 가방에서 편지지를 꺼냈다. 15년 동안 한 번도 쓰지 않은 종류의 종이였다. 볼펜 끝이 종이 위에서 오래 멈췄다.<\/p>\n<div class=\"doc\">아빠.<\/div>\n<p>그다음이 써지지 않았다. 달래가 아무 말 없이 뚝배기를 내 쪽에서 치웠다. 시헌은 창밖을 봤다. 기다리는 얼굴이었다.<\/p>\n<div class=\"doc\">별 봤어. 아빠 말이 맞았어. 거기 그대로 있더라. 내가 안 본 거였어.<\/div>\n<div class=\"doc\">답장 늦어서 미안해. 183통 다 읽었어. 이제 184통째는 내가 쓸게.<\/div>\n<p>편지 끝에 점을 찍었다. 하나, 둘, 일곱 개. 국자 모양의 북두칠성, 그리고 그 끝에서 길을 따라 올라간 자리에 진한 점 하나. 북극성. 길을 잃으면 거기서 다시.<\/p>\n<p>볼펜을 내려놓자 시헌이 내 손을 끌어갔다. 그가 주머니에서 밴드를 꺼내 검지 옆에 붙였다. 아물어가는 딱지 위로 얇은 비닐이 서늘하게 감겼다.<\/p>\n<p>\"이제 안 뜯네.\"<\/p>\n<p>\"거짓말 안 하니까.\"<\/p>\n<p>그가 웃었다. 아주 작게. 처음 보는 웃음이었다.<\/p>\n<hr class=\"scene\">\n<div class=\"doc\">[9월 22일 / 10:00]<\/div>\n<p>서울구치소 정문 앞은 조용했다. 원래대로라면 오늘이었다. 9월 22일 10시.<\/p>\n<p>의왕의 아침 공기는 도시보다 차가웠다. 담장 너머에서 배식 수레 바퀴 소리가 들렸다. 높은 회색 벽, 그 위에 감긴 철조망. 15년 동안 한 번도 오지 않던 곳이었다. 처음 온 건 보름 남짓 전, 번호표 237번을 쥐고였다.<\/p>\n<p>달래와 민규는 길 건너 편의점 앞에 있었다. 달래가 자기가 끼면 기사가 된다며 오지 않겠다고 했다가, 결국 목발을 짚고 따라왔다. 시헌은 내 몇 걸음 뒤에 섰다. 오는 내내 차 안에서 한 마디도 하지 않았다.<\/p>\n<p>09:58. 10:00. 초침 소리가 내 손목 안쪽에서 뛰었다.<\/p>\n<p>철문 옆 작은 쪽문이 열렸다. 경첩이 끼익 울었다.<\/p>\n<p>아빠가 걸어 나왔다.<\/p>\n<p>하얗게 센 머리. 15년 전보다 한 뼘 줄어든 어깨. 비닐봉지 하나를 든 손. 그 안에 편지 묶음이 보였다. 내 첫 답장은 아직 그 안에 없었다. 내가 주머니에 쥐고 있었으니까.<\/p>\n<p>발이 먼저 움직였다. 몇 걸음이었는지 모른다. 나는 그의 가슴에 얼굴을 묻었다.<\/p>\n<p>담배 냄새. 그리고 비누 냄새. 열한 살 겨울, 현관에서 나를 안아 올리던 그 냄새 그대로였다.<\/p>\n<p>\"밥은.\"<\/p>\n<p>아빠가 말했다. 목소리가 갈라졌다. 나는 대답 대신 그의 등을 더 세게 끌어안았다. 등뼈가 손바닥에 하나하나 짚였다.<\/p>\n<p>주머니에서 편지를 꺼내 그의 손에 쥐여줬다. 접힌 모서리가 땀에 눅눅했다. 아빠는 봉투를 열지 않고 오래 쥐고만 있었다. 엄지로 겉면의 내 글씨를 쓸었다. <span class=\"sys\">유진서<\/span>.<\/p>\n<p>\"…답장이구나.\"<\/p>\n<p>\"184통째.\"<\/p>\n<p>아빠의 입꼬리가 떨렸다. 웃는 건지 우는 건지 알 수 없는 얼굴이었다. 15년 전 계단을 올라가며 돌아보던 그 얼굴과 같았다. 그날 아빠가 입 모양으로 뭐라고 했는지, 나는 이제 물어볼 수 있었다. 나중에. 시간은 이제 있었다.<\/p>\n<p>한참 뒤, 아빠의 팔이 느슨해졌다. 그의 시선이 내 어깨 너머로 갔다.<\/p>\n<p>시헌이 몇 걸음 뒤에 서 있었다. 두 손을 바지 옆에 붙이고, 도망치지도 다가오지도 않은 채.<\/p>\n<p>아빠는 그를 봤다. 오래. 아주 오래. 바람이 담장 위 철조망을 울렸다.<\/p>\n<p>\"너, 많이 컸구나.\"<\/p>\n<p>아빠가 말했다.<\/p>\n<p>\"옷장 안에서 숨 참던 아이. 그날 너한테 소리 내지 말라고 한 게 나다.\"<\/p>\n<p>시헌의 얼굴에서 핏기가 빠졌다. 입술이 움직였지만 아무 소리도 나오지 않았다.<\/p>\n<p>그리고 아빠가 내 손을 꽉 쥐었다. 거칠고 마른 손바닥이 떨리고 있었다.<\/p>\n<p>\"진서야, 그날 그 집엔 반지 낀 남자 말고 한 사람이 더 있었다. 피 묻은 장갑을 벗던 여자. 그 여자가 — 네 입학식에서 축사를 하더라.\"<\/p>","chars":4886}]},{"slug":"cadaver","color":"#1F3A3D","title":"서울의대 지하 3층, 카데바는 학생이었다","subtitle":"","genre":"메디컬 캠퍼스 스릴러 / 서바이벌 / 비밀결사 / 위험한 로맨스","logline":"2년 전 해부학 실습실에서 '자살'한 오빠의 진실을 쫓아 서울의대 본과에 올라온 한이수가, 의대 안의 비밀결사 백의회(白衣會)가 여는 14일간의 탈락 게임 '선별(選別)'에 호명되어, 해부학 땡시가 끝나는 순간까지 혈액 4단위를 지키고 오빠를 죽인 자를 찾아내지 못하면 제적·누명·'처치'로 인생째 지워진다.","notice":"서울대학교 의과대학 연건캠퍼스(대학로)의 실제 지명·건물·학사 관행을 배경으로만 차용한다. 백의회·선별·카르테 등 모든 조직·사건·인물은 허구이며, 실존 인물·기관과 무관하다.","chapters":[{"title":"검은 꼬리표","html":"<div class=\"timer\">[D-14 / 09:12]<\/div>\n<p>하얀 시트가 걷히는 소리는 생각보다 작았다.<\/p>\n<p>사각, 하고 마른 천이 미끄러졌다. 그 아래에서 회색 어깨가 드러났다. 포르말린이 눈알을 찔렀다. 마스크 두 겹을 뚫고 들어온 냄새가 혀뿌리에 쓴 침을 고이게 했다.<\/p>\n<p>나는 메스를 쥔 손을 내려다봤다. 떨리지 않았다.<\/p>\n<p>다행이었다. 회색은 괜찮다. 피가 아니니까.<\/p>\n<hr class=\"scene\">\n<p>\"자, 0412조. 다들 손 모으고.\"<\/p>\n<p>조장 민재석이 장갑 낀 손을 카데바 가슴 위에 가만히 얹었다. 해부학 실습 첫날의 관례였다. 이 몸을 기증한 분께 드리는 묵념.<\/p>\n<p>여섯 명의 손이 차례로 포개졌다. 내 손이 마지막이었다. 라텍스 너머로 냉기가 스몄다. 사람의 피부가 아니라 오래 냉장고에 둔 고무 같았다.<\/p>\n<p>\"감사합니다, 선생님.\"<\/p>\n<p>재석의 목소리는 다정했다. 그는 모두에게 다정했다. 지방에서 올라온 지역균형 전형, 족보 한 장 받아본 적 없는 나에게조차.<\/p>\n<p>묵념이 끝나자 맞은편에서 메스가 먼저 움직였다.<\/p>\n<p>서무진이었다.<\/p>\n<p>본과 1학년 수석. 해부학 주임교수의 외아들. 예과 때부터 해부학교실에서 조교 보조를 했다는 소문이 있었다. 그는 아무에게도 묻지 않고 흉골 위에 칼끝을 댔다. 망설임이 없었다. 회색 피부가 종이처럼 갈라졌다.<\/p>\n<p>\"야, 무진아. 순서는 좀….\"<\/p>\n<p>\"교과서대로 하면 오늘 안에 못 끝내.\"<\/p>\n<p>무진은 고개도 들지 않았다. 재석이 멋쩍게 웃으며 어깨를 으쓱했다. 병철 오빠가 내 옆구리를 팔꿈치로 쿡 찔렀다.<\/p>\n<p>\"저 자슥 봐라. 눈이 사람 안 보고 혈관 본다.\"<\/p>\n<p>오병철. 서른두 살, 전직 119 구급대원, 5수 끝에 들어온 동기. 다들 그를 '병장님'이라 불렀다. 예과 1학년 응급실 견학 날, 피를 보고 쓰러진 나를 업고 나온 사람이었다. 그 뒤로 그는 내 보호자를 자처했다.<\/p>\n<p>\"오빠, 조용히 해요.\"<\/p>\n<p>\"알았다. 무전 끊는다.\"<\/p>\n<p>나는 웃음을 삼키고 핀셋을 들었다. 피하지방층. 대흉근. 아틀라스에서 수백 번 본 구조가 회색 살결 속에서 하나씩 이름을 얻었다.<\/p>\n<p>괜찮았다. 정말로 괜찮았다.<\/p>\n<p>그때, 육지아가 작게 숨을 들이켰다.<\/p>\n<p>\"아….\"<\/p>\n<p>지아의 왼손 검지에서 붉은 것이 솟았다. 긴장한 손이 메스 날을 헛짚은 것이다. 라텍스 장갑이 찢어지고, 그 틈으로 방울이 맺혔다.<\/p>\n<p>빨갛다.<\/p>\n<p>회색 세상 한가운데에, 너무 빨갛다.<\/p>\n<p>귀가 먼저 먹먹해졌다. 수조 속에 머리를 박은 것처럼 세상의 소리가 멀어졌다. 시야 가장자리부터 하얗게 바랬다. 무릎 안쪽의 힘줄이 제멋대로 풀렸다.<\/p>\n<p>안 돼. 여기서는 안 돼. 다들 보고 있어.<\/p>\n<p>\"자살한 선배 동생\"이 첫 실습에서 쓰러졌다는 말이, 오늘 밤 턴오버에 올라올 거야.<\/p>\n<p>그 순간, 차가운 손바닥이 내 눈을 덮었다.<\/p>\n<p>\"보지 마.\"<\/p>\n<p>낮은 목소리가 귓바퀴에 닿았다. 포르말린 냄새 사이로 희미한 비누 냄새가 섞였다.<\/p>\n<p>\"내 손만 봐. 숨 쉬어. 하나, 둘.\"<\/p>\n<p>어둠 속에서 나는 그의 손가락 마디를 셌다. 하나, 둘. 그의 엄지가 내 관자놀이 옆 맥을 가볍게 눌렀다. 마치 거기 혈관이 있다는 걸 확인하듯이.<\/p>\n<p>하얗게 바래던 세상이 천천히 회색으로 돌아왔다.<\/p>\n<p>손이 치워졌을 때, 무진은 이미 제자리에 서 있었다. 아무 일도 없었다는 얼굴로 대흉근을 젖히고 있었다. 지아는 병철 오빠가 거즈로 손가락을 감아주는 동안 울먹였다.<\/p>\n<p>\"미, 미안해, 이수야. 나 때문에….\"<\/p>\n<p>\"아니야. 나 괜찮아.\"<\/p>\n<p>괜찮지 않았다. 등줄기에 식은땀이 한 줄 흘러내렸다.<\/p>\n<p>나는 무진을 봤다. 그는 나를 보지 않았다. 대신 카데바의 발치를 덮은 시트를 한 번, 아주 짧게 내려다봤다.<\/p>\n<p>나도 모르게 그 시선을 따라갔다.<\/p>\n<p>시트 끝자락이 흐트러져 있었다. 그 밑으로 엄지발가락이 삐져나와 있었다. 실습실 모든 카데바에 달린 흰 플라스틱 식별표. 그런데 그 아래에.<\/p>\n<p>검은 금속 꼬리표가 하나 더, 철사로 묶여 있었다.<\/p>\n<p>손톱만 한 크기. 무광 검정. 음각된 숫자.<\/p>\n<div class=\"doc\">No.0412<\/div>\n<p>\"저기, 이거 뭐….\"<\/p>\n<p>내가 손을 뻗기도 전에, 재석이 시트를 끌어 발을 덮었다.<\/p>\n<p>\"이수야, 2구역 신경 좀 같이 찾아줄래?\"<\/p>\n<p>웃는 얼굴이었다. 너무 매끄럽게 웃는 얼굴.<\/p>\n<p>고개를 돌리자 지아가 황급히 눈을 내리깔았다. 병철 오빠만 아무것도 모르는 얼굴로 거즈를 정리하고 있었다. 무진은 여전히, 나를 보지 않았다.<\/p>\n<p>다들 봤다. 그리고 다들 못 본 척했다.<\/p>\n<hr class=\"scene\">\n<p>실습이 끝난 건 저녁 일곱 시였다.<\/p>\n<p>지하 1층 세척실의 스테인리스 개수대에서 나는 손을 세 번 씻었다. 포르말린은 비누로 지워지지 않았다. 손톱 밑, 머리카락, 속옷 고무줄까지 스며들어 사흘은 간다고 선배들이 말했다.<\/p>\n<p>옆 개수대에 누군가 섰다. 물소리가 겹쳤다.<\/p>\n<p>무진이었다. 그는 손목까지 꼼꼼히 거품을 냈다. 외과 의사처럼. 손가락 사이, 엄지두덩, 손톱 끝. 순서가 정확했다.<\/p>\n<p>\"아까는… 고마워.\"<\/p>\n<p>\"뭐가.\"<\/p>\n<p>\"눈. 가려준 거.\"<\/p>\n<p>물이 멈췄다. 그가 종이 타월을 뽑아 손을 닦았다. 한 장, 두 장. 그리고 처음으로 나를 똑바로 봤다. 형광등 아래 그의 눈동자는 지나치게 까맸다.<\/p>\n<p>\"한이수.\"<\/p>\n<p>내 이름을 처음 부르는 목소리가 낯설게 차가웠다.<\/p>\n<p>\"이번 학기, 휴학해.\"<\/p>\n<p>\"…뭐?\"<\/p>\n<p>\"피 보고 쓰러지는 애가 여기 왜 있어. 너한텐 안 맞아.\"<\/p>\n<p>목덜미가 확 달아올랐다. 말이 혀끝에서 사투리로 샜다.<\/p>\n<p>\"니가 뭔디 나보고 가라 마라 해. 니 아부지가 교수면 다여?\"<\/p>\n<p>그는 대답하지 않았다. 구겨진 종이 타월을 휴지통에 던지고 돌아섰다. 세척실 문이 닫히기 직전, 그가 아주 낮게 말했다.<\/p>\n<p>\"0412는 건드리지 마.\"<\/p>\n<p>문이 닫혔다. 개수대에 남은 물이 배수구로 꼬르륵 빨려 들어갔다.<\/p>\n<p>나는 젖은 손을 쥔 채 서 있었다. 손끝에서 떨어지는 물방울이 차가웠다. 그가 어떻게 그 번호를 아는지 — 아니, 그가 왜 그 번호를 '건드리지 말라'고 하는지.<\/p>\n<p>그 질문이 밤까지 귓속에서 떠나지 않았다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-14 / 23:47]<\/div>\n<p>의학도서관 3층 사물함 앞에서 나는 한참을 서 있었다.<\/p>\n<p>내 사물함 문틈에 갈색 서류 봉투가 꽂혀 있었다. 발신인 없음. 테이프 대신 붉은 봉랍. 손가락으로 눌러보니 굳은 왁스에 메스 모양 문양이 찍혀 있었다.<\/p>\n<p>열람실의 형광등이 찌르르 울었다. 새벽을 앞둔 도서관은 수험생들의 한숨과 에너지 드링크 캔 따는 소리뿐이었다.<\/p>\n<p>봉투를 뜯었다.<\/p>\n<p>제본된 A4 묶음이 미끄러져 나왔다. 표지에 매직으로 휘갈긴 글씨.<\/p>\n<p class=\"em-line\"><strong>해부학 족보 — 77기 한도윤<\/strong><\/p>\n<p>숨이 멈췄다.<\/p>\n<p>오빠 글씨였다. 'ㅎ'의 꼭지를 늘 왼쪽으로 삐뚜름하게 쓰던 버릇. 왼손잡이라 볼펜 잉크가 손날에 번지던 자국까지, 복사본 위에 그대로 남아 있었다.<\/p>\n<p>2년 전 3월. 해부학 실습실. 천장 배관.<\/p>\n<p>학업 스트레스로 인한 극단적 선택. 유서 없음.<\/p>\n<p>장례식장에서 받은 유골함은 이상할 정도로 가벼웠다. 엄마는 그걸 안고 여수로 내려가는 KTX 안에서 한 번도 울지 않았다. 나는 울었다. 오빠가 마지막으로 보낸 문자에 답장하지 않았다는 사실 때문에.<\/p>\n<div class=\"doc\">이수야 밥 먹었나<\/div>\n<p>그날 밤 나는 동기들과 술을 마시느라 그 문자를 열어보지도 않았다.<\/p>\n<p>페이지를 넘겼다. 손끝이 종이 위에서 오빠의 필압을 더듬었다. 상지, 흉부, 복부. 빽빽한 정리 사이사이 여백에 라틴어 용어들이 적혀 있었다. 그중 일곱 개에만 붉은 펜으로 밑줄이 그어져 있었다.<\/p>\n<p><em>Hilum. Atrium. Meatus. Canalis. Hamulus. Uvula. Nervus.<\/em><\/p>\n<p>허파문. 심방. 도관. 관. 갈고리. 목젖. 신경.<\/p>\n<p>아무 연관 없는 단어들이었다. 시험 범위도 제각각이었다.<\/p>\n<p>그런데 오빠는 이런 걸 아무렇게나 하는 사람이 아니었다.<\/p>\n<p>어릴 적 여수 오동도 방파제에서, 오빠는 나한테 첫 글자 놀이를 가르쳤다. 단어 첫 글자만 모으면 비밀 문장이 되는 놀이. 엄마 몰래 아이스크림 사 먹으러 갈 때 우리는 그걸로 쪽지를 주고받았다.<\/p>\n<p>H. A. M. C. H. U. N.<\/p>\n<p>\"…함춘.\"<\/p>\n<p>함춘원. 연건캠퍼스 담장 너머, 밤이면 출입이 막히는 옛 궁원.<\/p>\n<p>마지막 페이지를 넘겼다. 오른쪽 아래 귀퉁이, 볼펜으로 꾹꾹 눌러 쓴 네 자리 숫자.<\/p>\n<div class=\"doc\">0412<\/div>\n<p>오늘 오후, 카데바 발가락에 묶여 있던 그 숫자.<\/p>\n<p>그리고 오빠의 생일.<\/p>\n<hr class=\"scene\">\n<p>기숙사 2인실은 비어 있었다. 룸메이트는 주말마다 본가에 갔다. 나는 불도 켜지 않고 침대에 웅크려 병철 오빠에게 전화를 걸었다.<\/p>\n<p>\"어, 이수. 이 시간에 뭔 일이고. 응급이가?\"<\/p>\n<p>\"오빠.\"<\/p>\n<p>입을 열자 목소리가 먼저 무너졌다.<\/p>\n<p>\"오빠 글씨가 왔어요. 오빠가… 우리 오빠가.\"<\/p>\n<p>\"천천히. 숨 쉬고. 현장 상황부터 말해봐라.\"<\/p>\n<p>구급대 시절 버릇이 튀어나온 그의 말투에 나는 웃다가 울었다. 우는 동안 그는 끊지 않았다. 고시원의 얇은 벽 너머로 누군가 기침하는 소리, 그가 슬리퍼를 끌고 복도로 나가는 소리가 들렸다.<\/p>\n<p>\"이수야.\"<\/p>\n<p>\"네.\"<\/p>\n<p>\"니 오빠, 내가 본 적 있다 했제.\"<\/p>\n<p>\"…네?\"<\/p>\n<p>\"아이다. 다음에 말하께. 지금은 자라. 내일 실습 있다.\"<\/p>\n<p>그가 무언가를 삼키는 소리를 나는 들었다. 하지만 물어볼 기운이 없었다. 통화가 끊기고, 어둠 속에서 나는 족보를 가슴에 안았다. 종이에서 오래된 복사기 토너 냄새가 났다. 오빠 방 냄새였다.<\/p>\n<p>잘 자라, 하고 오빠가 말해줄 것 같았다.<\/p>\n<p>대신 휴대폰이 진동했다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-13 / 00:00]<\/div>\n<p>화면이 저절로 켜졌다.<\/p>\n<p>나는 아무것도 누르지 않았다. 그런데 홈 화면 위로 검은 사각형이 번졌다. 설치 진행 바가 순식간에 차올랐다. 앱 이름은 없었다. 아이콘은 그저 검은 바탕에 흰 십자 하나.<\/p>\n<p>전원 버튼을 길게 눌렀다. 꺼지지 않았다.<\/p>\n<p>검은 화면 위로 혈액백 네 개가 떠올랐다. 수혈용 팩. 붉은 액체가 출렁이는 애니메이션이 지나치게 정교했다.<\/p>\n<p>그 아래 글자가 한 줄씩 떠올랐다.<\/p>\n<div class=\"doc\">KARTE<\/div>\n<div class=\"doc\">제79기 선별(選別)에 호명되셨습니다.<\/div>\n<div class=\"doc\">보유 혈액: 4 Unit<\/div>\n<div class=\"doc\">04:12, 함춘원.<\/div>\n<p>심장이 귓속에서 뛰었다. 쿵, 쿵. 방 안의 공기가 갑자기 포르말린처럼 무거워졌다. 등 뒤의 창문 너머로 대학로의 취객 웃음소리가 멀리 지나갔다.<\/p>\n<p>장난이다. 누군가의 장난이다. 오늘 실습실의 그 표정들, 그 꼬리표. 다 같이 짜고 '자살한 선배 동생'을 놀리는 거다.<\/p>\n<p>그렇게 생각하려는데, 화면이 한 번 더 깜빡였다.<\/p>\n<div class=\"doc\">호명자 No.0412 한이수.<\/div>\n<p>글자가 천천히 이어졌다. 한 글자씩, 누군가 타이핑하듯이.<\/p>\n<div class=\"doc\">당신의 오빠도 이 앱에서 시작했습니다.<\/div>\n<div class=\"doc\">— 제77기 우승자, 한도윤.<\/div>","chars":4782},{"title":"함춘원 04:12","html":"<div class=\"timer\">[D-13 / 03:58]<\/div>\n<p>담장 위의 철망이 손바닥을 긁었다.<\/p>\n<p>나는 이를 악물고 몸을 끌어올렸다. 운동화 코가 젖은 벽돌에서 미끄러졌다. 담장 너머는 캄캄했다. 함춘원. 밤이면 철문을 걸어 잠그는 옛 궁원. 3월 새벽의 공기가 목덜미로 파고들어 땀을 얼렸다.<\/p>\n<p>뛰어내리려는 순간, 등 뒤에서 하얀 빛이 내 그림자를 담장에 못 박았다.<\/p>\n<p>\"거, 내려오는 자세가 영 틀렸다.\"<\/p>\n<p>심장이 목구멍까지 튀어 올랐다. 돌아보니 손전등 너머로 낯익은 패딩이 보였다. 병철 오빠였다.<\/p>\n<p>\"오빠가 여길 왜….\"<\/p>\n<p>\"니 혼자 가게 둘 것 같나.\"<\/p>\n<p>그가 손전등을 입에 물고 담장을 짚었다. 단번에 올라와 내 옆에 쪼그려 앉았다. 숨도 차지 않았다. 그러고는 주머니에서 휴대폰을 꺼내 내 얼굴 앞에 들이밀었다.<\/p>\n<p>검은 바탕. 흰 십자. 핏빛 혈액백 네 개.<\/p>\n<div class=\"doc\">호명자 No.0412 오병철.<\/div>\n<p>\"새벽 열두 시에 이기 깔리더라. 니 전화 끊고 바로.\"<\/p>\n<p>나는 아무 말도 하지 못했다. 그가 어제 통화에서 삼킨 것이 무엇이었는지, 그제야 조금 알 것 같았다.<\/p>\n<hr class=\"scene\">\n<p>함춘원 안은 젖은 흙과 썩은 낙엽 냄새가 났다.<\/p>\n<p>손전등 빛이 닿는 곳마다 동백이 떨어져 있었다. 꽃잎이 아니라 꽃송이째로. 목이 꺾인 것처럼 통째로 떨어진 붉은 꽃들이 검은 흙 위에 점점이 박혀 있었다. 나는 그것들을 밟지 않으려고 발끝을 세웠다. 빨간 건 싫었다.<\/p>\n<p>\"석탑이 저쪽이다.\"<\/p>\n<p>오빠는 지도도 안 보고 걸었다. 구급대 시절 이 동네를 몇 번이나 뛰었다고 했다.<\/p>\n<p>석탑 뒤 낮은 축대 아래, 사람 하나 겨우 들어갈 배수구가 있었다. 녹슨 철문이 덮여 있었다. 자물쇠는 없었다. 손잡이도 없었다.<\/p>\n<p>휴대폰 시계가 04:11에서 04:12로 넘어갔다.<\/p>\n<p>철컥.<\/p>\n<p>철문 안쪽에서 무언가 풀리는 소리가 났다. 문이 저절로 한 뼘 밀려났다. 그 틈으로 냉기가 흘러나왔다. 지하실의 곰팡이, 녹물, 그리고 그 밑에 깔린 익숙한 냄새.<\/p>\n<p>포르말린이었다.<\/p>\n<p>\"옛날에 시신 실어 나르던 길이라 카더라.\"<\/p>\n<p>오빠가 낮게 말했다. 농담하는 목소리가 아니었다.<\/p>\n<p>계단은 좁고 가팔랐다. 벽에 손을 짚자 시멘트가 아니라 차갑고 매끈한 타일이 만져졌다. 손전등을 비췄다. 누렇게 바랜 타일에 숫자가 새겨져 있었다.<\/p>\n<div class=\"doc\">1947<\/div>\n<p>그 옆에 길쭉한 홈이 일곱 줄. 누군가 칼날을 세워 타일을 일곱 번 그은 자국이었다. 메스 날의 폭이었다. 손끝으로 홈을 따라 쓸자 오래된 먼지가 장갑처럼 손가락에 묻었다.<\/p>\n<p>오빠도 이 벽을 짚었을까.<\/p>\n<p>이 계단을, 이 냄새를, 나보다 먼저.<\/p>\n<hr class=\"scene\">\n<p>계단 끝은 둥근 방이었다.<\/p>\n<p>천장이 낮은 원형 공간. 벽을 따라 백열등이 띄엄띄엄 매달려 있었고, 정면에 검게 칠한 유리창이 길게 박혀 있었다. 유리 너머는 보이지 않았다. 그 위에 놋쇠 명판 하나.<\/p>\n<div class=\"doc\">觀覽室<\/div>\n<p>입구 옆 쇠 옷걸이에 흰 가운이 줄지어 걸려 있었다. 가슴마다 번호가 박음질돼 있었다. 0412. 0412. 0409. 0415. 나는 내 이름이 수놓인 가운을 찾았다. 소매에 팔을 넣자 풀 먹인 천이 바스락거렸다. 오른쪽 주머니가 묵직했다.<\/p>\n<p>꺼내 보니 가는 은사슬에 꿰인 검은 금속판이었다. 어제 카데바 발가락에 묶여 있던 그 꼬리표. 앞면에 <span class=\"sys\">No.0412<\/span>, 뒷면에 작게 <span class=\"sys\">韓<\/span>.<\/p>\n<p>\"목에 걸어라.\"<\/p>\n<p>오빠가 자기 것을 목에 걸며 말했다. 뒷면에 <span class=\"sys\">吳<\/span>가 보였다.<\/p>\n<p>방 안에는 이미 흰 가운들이 서 있었다. 나는 머릿수를 셌다. 우리까지 열여섯.<\/p>\n<p>아는 얼굴이 너무 많았다.<\/p>\n<p>조장 재석이 나를 보고 작게 손을 흔들었다. 언제나처럼 다정하게, 마치 동아리 MT에서 만난 것처럼. 그 옆에 지아가 가운 자락을 움켜쥔 채 떨고 있었다. 손가락에 감긴 반창고가 백열등 아래 누렇게 빛났다.<\/p>\n<p>그리고 벽 쪽, 등을 기댄 채 팔짱을 낀 사람.<\/p>\n<p>서무진은 나를 보고 있었다. 내가 계단을 내려온 순간부터. 다른 사람은 하나도 보지 않고, 나만.<\/p>\n<p>\"어머.\"<\/p>\n<p>날카로운 목소리가 끼어들었다. 0409조 가운의 여자가 걸어 나왔다. 강하린. 병원장 손녀라는 소문이 입학식 날부터 돌던 애였다. 가운 깃에 붉은 동백 모양 브로치가 꽂혀 있었다.<\/p>\n<p>\"자살한 선배 동생도 왔네.\"<\/p>\n<p>몇 명이 고개를 돌렸다. 누군가 킥 웃었다.<\/p>\n<p>\"그 선배, 여기서 1등 했다며? 근데 왜 죽었대. 견습까지 해놓고.\"<\/p>\n<p>하린이 고개를 기울였다. 진심으로 궁금하다는 얼굴이었다. 그게 더 잔인했다.<\/p>\n<p>나는 대답하지 못했다. 1등. 견습. 모르는 단어들이 오빠 이름에 붙어 있었다. 오빠가 여기 서 있었다. 이 백열등 아래, 이 포르말린 속에, 이 사람들 사이에. 그리고 나한테는 한마디도 하지 않았다.<\/p>\n<p>갈비뼈 안쪽이 쪼그라드는 것 같았다. 숨이 반만 들어왔다.<\/p>\n<p>\"무전 칩니다.\"<\/p>\n<p>병철 오빠가 내 어깨에 툭 손을 얹었다. 하린 쪽은 쳐다보지도 않고, 들으라는 듯 큰 소리로.<\/p>\n<p>\"현장 도착. 인원 열여섯. 현장 분위기, 장례식장. 육개장은 안 나옴.\"<\/p>\n<p>누군가 풉 하고 웃음을 터뜨렸다. 하린이 혀를 찼다. 나도 모르게 입꼬리가 비틀렸다. 웃는 건지 우는 건지 모를 얼굴로, 나는 겨우 숨을 끝까지 들이쉬었다.<\/p>\n<p>벽 쪽에서 무진이 고개를 돌렸다. 아주 잠깐, 그의 입매가 굳었다가 풀렸다.<\/p>\n<hr class=\"scene\">\n<p>지지직.<\/p>\n<p>천장 스피커가 울었다. 웃음소리가 칼로 자른 듯 끊겼다.<\/p>\n<p>\"호명자 여러분, 입원을 환영합니다.\"<\/p>\n<p>기계로 비튼 목소리였다. 남자인지 여자인지, 늙었는지 젊었는지 알 수 없었다. 그런데 말투만은 이상하게 익숙했다. 회진 도는 교수가 차트를 읽는 말투.<\/p>\n<p>\"처방 하나. 각자 혈액 4단위.\"<\/p>\n<p>모두의 휴대폰이 동시에 진동했다. 화면 속 혈액백 네 개가 출렁였다.<\/p>\n<p>\"처방 둘. 꼬리표는 몸에서 떼지 마십시오. 타인의 꼬리표를 06:00 라운딩 전 시계탑 투입구에 넣으면, 그 사람의 피 1단위가 당신에게 수혈됩니다.\"<\/p>\n<p>목에 걸린 금속판이 갑자기 무거워졌다. 열여섯 명의 시선이 서로의 목으로 미끄러졌다. 나는 반사적으로 꼬리표를 가운 안으로 집어넣었다. 옆에서 지아도 똑같이 했다.<\/p>\n<p>\"처방 셋. 0단위는 DNR. 소생시키지 않습니다. 다음 라운딩에 처치합니다.\"<\/p>\n<p>\"처치가 뭔데요.\"<\/p>\n<p>누군가 물었다. 스피커는 대답하지 않았다.<\/p>\n<p>\"금기. 무명에게 누설하지 말 것. 카데바를 훼손하지 말 것. 지하 3층에 내려가지 말 것. 그리고 제9조.\"<\/p>\n<p>잠깐의 정적. 백열등 필라멘트가 지잉 울었다.<\/p>\n<p>\"감찰은 호명자와 사적 관계를 맺지 않는다. 위반 시, 양자 모두 DNR.\"<\/p>\n<p>감찰. 이 방 안에, 우리를 지켜보는 누군가가 섞여 있다는 뜻이었다.<\/p>\n<p>나는 저도 모르게 무진을 봤다. 그는 여전히 나를 보고 있었다. 눈을 피하지도 않았다.<\/p>\n<p>\"기한은 14일. 블록 1 땡시 종료 종이 울릴 때, 피가 가장 많이 남은 네 명만 퇴원합니다.\"<\/p>\n<p>\"미친 짓이네.\"<\/p>\n<p>0415조 가운의 남자가 앞으로 나섰다. 키가 크고 목소리가 컸다. 정우람이라고, 오리엔테이션 때 과대 선거에 나왔던 애였다. 그는 휴대폰을 높이 치켜들었다. 화면에 빨간 녹음 표시가 깜빡이고 있었다.<\/p>\n<p>\"다 녹음했어. 이거 그대로 경찰 가고, 턴오버에 올린다. 니들 다 같이 미쳤냐?\"<\/p>\n<p>아무도 대답하지 않았다. 그가 하하 웃었다. 웃음이 원형 벽에 부딪쳐 이상하게 길게 울렸다.<\/p>\n<p>그 순간 모든 휴대폰이 한 번 더 떨었다.<\/p>\n<div class=\"doc\">0415 정우람 — DNR.<\/div>\n<p>그의 혈액백 네 개가 한꺼번에 비워지는 애니메이션이 내 화면에도 떴다. 붉은 액체가 아래로 빠지며 빈 비닐만 남았다.<\/p>\n<p>\"쇼 잘하네.\"<\/p>\n<p>우람은 그렇게 말하고 가운을 벗어 바닥에 던졌다. 계단 쪽으로 걸어갔다. 휘파람까지 불면서. 그의 발소리가 위로, 위로 멀어졌다.<\/p>\n<p>아무도 그를 붙잡지 않았다.<\/p>\n<p>나는 바닥에 떨어진 흰 가운을 봤다. 가슴에 박음질된 0415가, 시트를 덮어놓은 시신처럼 납작했다.<\/p>\n<p>\"이수야, 괜찮아?\"<\/p>\n<p>재석이 어느새 옆에 와 있었다. 그가 내 가운 깃을 바로잡아 주었다. 손길이 부드러웠다. 형이 동생 옷매무새 챙기듯이.<\/p>\n<p>\"쫄지 마. 저거 다 겁주려고 하는 거야. 우리 조끼리 뭉치면 돼.\"<\/p>\n<p>\"…조장은 알았어요? 이런 거.\"<\/p>\n<p>\"나도 오늘 처음이야.\"<\/p>\n<p>재석은 웃었다. 대답이 너무 빨랐다. 생각할 틈도 없이 미끄러져 나온 말이었다. 나는 그의 웃는 눈가를 봤다. 주름 하나 흐트러지지 않았다.<\/p>\n<p>지아가 내 소매를 잡았다. 손끝이 얼음장 같았다.<\/p>\n<p>\"이수야. 우람이… 진짜 처치, 그거 당하는 거야?\"<\/p>\n<p>나는 대답 대신 지아의 손을 쥐었다. 반창고의 까슬한 감촉이 손바닥에 걸렸다. 어제 저 상처에서 솟던 빨간 방울이 떠올라, 나는 얼른 눈을 감았다.<\/p>\n<p>\"오빠.\"<\/p>\n<p>병철 오빠 쪽으로 몸을 기울였다. 목소리를 최대한 낮췄다.<\/p>\n<p>\"어제 그랬잖아요. 우리 오빠 본 적 있다고. 여기서예요?\"<\/p>\n<p>오빠의 턱 근육이 꿈틀했다. 그는 정면의 검은 유리창만 노려봤다.<\/p>\n<p>\"나가서 말하께. 살아서.\"<\/p>\n<p>유리창 너머에서 무언가 움직였다. 아주 희미하게, 잔이 부딪치는 듯한 소리가 났다. 쨍. 누군가 저 안에서 우리를 보며 건배를 하고 있었다.<\/p>\n<hr class=\"scene\">\n<p>딸깍.<\/p>\n<p>백열등이 한꺼번에 꺼졌다.<\/p>\n<p>완벽한 어둠이었다. 눈을 떴는지 감았는지도 모를 검정. 계단 위에서 쾅, 쇳덩이가 맞물리는 소리가 내려와 고막을 때렸다. 철문이 닫혔다.<\/p>\n<p>누군가 비명을 질렀다.<\/p>\n<p>휴대폰 화면들이 하나둘 켜졌다. 어둠 속에 떠오른 푸른 얼굴들이 유령 같았다. 내 화면에 글자가 떴다.<\/p>\n<div class=\"doc\">첫 증례.<\/div>\n<div class=\"doc\">06:00까지 지상으로.<\/div>\n<div class=\"doc\">마지막 4명, 각 1단위 차감.<\/div>\n<p>그리고 아래쪽에서 물소리가 들렸다. 졸졸, 하다가 콸콸. 바닥 어딘가에서 물이 차오르는 소리.<\/p>\n<p>방이 터졌다.<\/p>\n<p>어깨가 부딪쳤다. 누군가의 팔꿈치가 내 갈비뼈를 찍었다. 휴대폰 불빛이 미친 듯이 흔들리며 벽 여기저기 뚫린 시커먼 입구들을 비췄다. 하나, 둘, 셋, 넷. 사람들이 그 구멍들로 쏟아져 들어갔다. 발소리, 욕설, 울음.<\/p>\n<p>\"이수야! 이수!\"<\/p>\n<p>병철 오빠 목소리가 멀어졌다. 밀려드는 몸들 사이로 그의 손전등 빛이 휙 꺾였다가 사라졌다.<\/p>\n<p>\"오빠!\"<\/p>\n<p>나는 소리치며 앞으로 나가려 했다. 발목까지 차가운 물이 감겼다. 운동화 속으로 얼음 같은 물이 스몄다. 포르말린 냄새가 물 위로 피어올랐다.<\/p>\n<p>그때였다.<\/p>\n<p>차가운 손이 내 입을 틀어막았다.<\
