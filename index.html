p>획 하나하나에 힘을 주었다. 엄마가 보여준 여덟 획처럼. 점을 찍고, 가로로 긋고, 세로로 내리고, 삐치고, 파였다.<\/p>\n<p class=\"em-line\"><strong>낙명제는 없었다.<\/strong><\/p>\n<p>마지막 획을 떼는 순간, 세상이 숨을 들이켰다.<\/p>\n<p>발밑의 종이가 빛났다. 내가 쓴 일곱 글자가 먹에서 금빛으로 바뀌었다. 그리고 그 빛이 사방으로 번져 나갔다. 떠 있는 이름들로, 실들로, 하늘의 균열로.<\/p>\n<p>떠 있던 이름들이 흔들렸다.<\/p>\n<p>차갑게 닳아 있던 이름들이 하나씩 따뜻해졌다. 갉아먹힌 가장자리가 차올랐다. 사백 년 동안 거둬진 기록이, 한 장씩 거꾸로 넘어갔다. 거둔 것은 돌려지고, 바친 것은 무효가 되고.<\/p>\n<p>균열 너머 홀이 보였다.<\/p>\n<p>홀 바닥의 마흔아홉 개 홈에서 빛이 터져 나왔다. 홈에 끼워졌던 명패들이 튀어 올라 각자의 주인 가슴으로 날아갔다. 빼앗긴 명패들도. 흡수된 명패들도. 세아의 손에서 열두 개의 빛이 빠져나가 열두 명에게로 돌아갔다. 태산의 가슴에서도.<\/p>\n<p>그리고 — 은솔의 손에 쥐인 거울 조각에서, 작은 빛 하나가 튀어나와 어딘가로 날아갔다. 아홉 살짜리 이름 하나가 집으로 돌아가는 빛.<\/p>\n<p>도준의 가슴. 내가 피로 이름을 써준 그 명패가 반짝였다. 그리고 그 옆에서, 검게 타 버렸던 그의 옛 명패가 재 속에서 다시 형체를 갖췄다. 도준이 자기 가슴의 명패 두 개를 내려다보며 입을 벌렸다.<\/p>\n<p>그리고 제하.<\/p>\n<p>바닥에 쓰러진 투명한 윤곽 위로, 은빛 실 한 가닥이 내려왔다. 그 실 끝에 매달린 이름. 반쯤 닳아 읽을 수 없었던 이름. 그 이름이 다시 차오르고 있었다. 획이 하나씩 돌아왔다. 원장이 저당 잡았던 절반이. 그가 여덟 살 이전에 가졌던, 원래의 이름이.<\/p>\n<p>그의 몸이 다시 색을 입었다. 손끝부터, 어깨까지. 얼굴까지.<\/p>\n<p>원장이 비명을 질렀다.<\/p>\n<p>처음 듣는 소리였다. 다정함도 마른 목소리도 아닌, 짐승 같은 소리. 그의 손이 책의 표지에서 미끄러졌다. 그의 몸에서 빛이 빠져나갔다. 거둬진 이름으로 쌓아 올린 힘이, 썰물처럼.<\/p>\n<p>그 순간 그가 손을 뻗었다.<\/p>\n<p>책 안으로. 내가 있는 하얀 공간 안으로. 거대한 손가락이 하늘의 균열을 뚫고 들어왔다.<\/p>\n<p>내가 아니었다. 그가 노린 건.<\/p>\n<p>내 가슴이었다.<\/p>\n<p>방금 새겨졌던 이름. 쓰이지 않은 채 남아 있던 이름. 내가 책에 쓰지 않았기 때문에, 아직 어디에도 고정되지 않은 이름.<\/p>\n<p>남궁영.<\/p>\n<p>그 세 글자가 내 가슴에서 뜯겨 나갔다. 살갗이 찢어지는 것 같았다. 비명이 나왔다. 이름은 먹물 덩어리처럼 허공으로 끌려가더니, 하얀 페이지 한 장에 철썩 달라붙었다.<\/p>\n<p>원장의 손가락이 그 페이지를 움켜쥐었다.<\/p>\n<p>찢었다.<\/p>\n<p>종이 찢어지는 소리가 하늘을 갈랐다. 그리고 균열 너머로, 원장이 무너지는 홀 저편으로 비틀거리며 사라지는 게 보였다. 찢긴 페이지 한 장을 가슴에 꽉 끌어안은 채로.<\/p>\n<p>\"쫓지 마.\"<\/p>\n<p>엄마의 목소리였다.<\/p>\n<p>엄마는 거의 투명했다. 하얀 공간에 섞여 들어가고 있었다.<\/p>\n<p>\"오늘은 아니야. 지금은, 돌아가.\"<\/p>\n<p>\"엄마, 같이 —\"<\/p>\n<p>\"잘 골랐다, 영아.\"<\/p>\n<p>엄마가 웃었다. 그 웃음이 하얀 공간에 번지듯 흩어졌다. 먹 냄새. 비누 냄새. 그리고 아무것도.<\/p>\n<p>발밑의 종이가 꺼졌다.<\/p>\n<p>나는 떨어졌다.<\/p>\n<p>돌바닥이었다. 무릎이 깨지는 통증. 코를 찌르는 유황 연기와 먼지. 그리고 소리. 소리가 한꺼번에 귀로 쏟아졌다. 사람들의 고함, 무너지는 돌, 꺼져 가는 명경들의 지지직 소리.<\/p>\n<p>명경 하나가 시계를 띄우고 있었다.<\/p>\n<p>23:59:58.<\/p>\n<p>59.<\/p>\n<p>00:00:00.<\/p>\n<p>종이 울렸다.<\/p>\n<p>깊고 낮은, 뱃속까지 울리는 자정의 종.<\/p>\n<p>아무도 사라지지 않았다.<\/p>\n<p>홀 안의 마흔아홉 명 — 아니, 마흔여덟 명과 나 — 이 서로를 쳐다보았다. 자기 손을 내려다보았다. 가슴의 명패를 만졌다. 재가 되지 않았다. 아무도.<\/p>\n<p>홀 구석에서 낯선 얼굴 몇이 비틀거리며 일어나고 있었다. 이틀째 밤 열쇠가 없어 복도에 남았던 그 '1명'. 투표 전날 사냥당했던 아이들. 재가 되어 흩어졌던 이름들이, 무엇에 홀린 얼굴로 자기 몸을 더듬고 있었다.<\/p>\n<p>태산이 집행관 셋을 털어내고 일어섰다. 그가 자기 가슴의 명패 하나만 남은 걸 내려다보더니, 어깨를 으쓱했다.<\/p>\n<p>\"아깝네. 아홉 개였는데.\"<\/p>\n<p>그리고 첫날 그에게 명패를 뜯겼던 소년의 머리를 툭 쳤다. 사과 대신.<\/p>\n<p>은솔이 바닥에 주저앉아 거울 조각을 품에 안고 있었다. 빛이 꺼진 조각. 그녀가 그걸 귀에 대고 뭔가를 들으려는 것처럼 웅크렸다. 그리고 갑자기 어깨를 들썩이며 울기 시작했다. 우는 얼굴이 웃고 있었다.<\/p>\n<p>집행관들은 은색 장갑을 하나둘 벗고 있었다. 그들의 장갑 속 손도, 제하의 것처럼 흉터투성이였다.<\/p>\n<p>\"…야.\"<\/p>\n<p>누군가 내 팔을 잡아당겼다. 돌아보기도 전에 그 사람이 나를 끌어안았다. 숨 막히게.<\/p>\n<p>도준이었다. 그가 소매를 걷어붙인 팔을 내 눈앞에 들이밀었다. 볼펜 글씨가 땀에 번져 있었다.<\/p>\n<p>\"여기, 여기 써 있어. 강하루. 강하루. 강하루. 백 번 썼다. 너 맞지? 맞잖아. 아, 몰라. 맞아. 내 친구. 질문 금지.\"<\/p>\n<p>나는 웃었다. 울면서.<\/p>\n<p>세아가 다가왔다. 피 묻은 손으로 머리를 쓸어 넘겼다. 나를 한참 보더니, 처음으로 그 이름을 불렀다.<\/p>\n<p>\"하루.\"<\/p>\n<p>번호가 아니라. 사촌이 아니라. 무명이 아니라.<\/p>\n<p>나는 자기 이름을 쓰지 않았다. 나는 여전히 무명이었다. 가슴이 비어 있었다. 찢겨 나간 자리가 쓰라렸다.<\/p>\n<p>그래도 괜찮았다.<\/p>\n<p>나는 도준의 팔에서 빠져나와 달렸다. 홀 맞은편. 그가 쓰러져 있던 곳으로.<\/p>\n<p>그가 일어나 앉아 있었다.<\/p>\n<p>완전히 선명했다. 횃불 빛이 그의 몸을 통과하지 않고 그의 뺨에 따뜻한 그림자를 드리웠다. 은색 장갑이 바닥에 떨어져 있었다. 맨손. 손목의 흉터가 더 이상 하얗게 타지 않았다. 그냥, 오래된 흉터였다.<\/p>\n<p>그가 자기 손바닥을 내려다보고 있었다. 무언가를 처음 만져본 사람처럼.<\/p>\n<p>\"제하야.\"<\/p>\n<p>내가 불렀다.<\/p>\n<p>그가 고개를 들었다.<\/p>\n<p>회색 눈동자가 나를 보았다. 맑았다. 일주일 동안 본 적 없을 만큼 맑았다. 감정이 있는 눈이었다. 지워지지 않은 눈.<\/p>\n<p>그리고 그 눈에, 나는 없었다.<\/p>\n<p>그가 아주 정중하게, 조금 당황한 얼굴로 입을 열었다.<\/p>\n<p>\"…괜찮으세요? 저희, 아는 사이였나요?\"<\/p>","chars":4915},{"title":"영원","html":"<p>[낙명제 종료 후 7일 · 04:44]<\/p>\n<p>\"신입이야?\"<\/p>\n<p>사장님이 물었다. 새벽 네 시, 교대 시간. 패딩 지퍼를 올리며 하품을 하는 얼굴로.<\/p>\n<p>일주일 전의 나였으면 그 질문에 웃었을 것이다. 입꼬리만. 네, 신입이에요. 그리고 속으로 숫자를 셌겠지. 이 질문을 몇 번째 듣는 건지.<\/p>\n<p>\"네.\" 나는 웃었다. 이번엔 눈까지. \"오늘부터요.\"<\/p>\n<p>사장님이 이상하다는 얼굴로 나를 한 번 더 보았다. 신입이 왜 저렇게 신났지, 하는 얼굴. 그러고는 금고 열쇠를 건네며 이것저것 설명했다. 폐기 시간, 담배 진열 순서, 진상 손님 대처법. 나는 다 아는 걸 처음 듣는 척 고개를 끄덕였다.<\/p>\n<p>딸랑. 문이 닫혔다.<\/p>\n<p>편의점에 혼자 남았다.<\/p>\n<p>형광등이 웅웅거렸다. 온장고에서 캔커피 데워지는 냄새가 났다. 바닥 타일은 차갑고, 계산대 모서리에는 일주일 전 내 손을 벤 자국이 아직 하얗게 남아 있었다.<\/p>\n<p>그날 새벽, 이 자리에서 피투성이 노인이 내 손목을 잡았다. 그리고 은색 장갑을 낀 청년이 그 노인을 재로 만들었다.<\/p>\n<p>모든 게 처음으로 돌아왔다.<\/p>\n<p>거의.<\/p>\n<p>나는 셔츠 단추 하나를 풀고 가슴을 내려다보았다. 심장 바로 위, 손바닥만 한 자리에 붉은 자국이 있었다. 화상 같기도, 긁힌 상처 같기도 한. 이름이 뜯겨 나간 자리.<\/p>\n<p>손가락으로 만지면 아직 따끔했다.<\/p>\n<p>딸랑.<\/p>\n<p>\"야, 강하루!\"<\/p>\n<p>문이 열리기도 전에 목소리가 먼저 들어왔다.<\/p>\n<p>봉도준이 숨을 헐떡이며 계산대로 달려왔다. 패딩 한쪽 어깨가 흘러내려 있었다. 그가 계산대에 수첩을 쾅 내려놓았다. 표지에 매직으로 크게 쓰여 있었다. '하루 노트 2'.<\/p>\n<p>그리고 소매를 걷었다. 손목에 볼펜 글씨.<\/p>\n<p>강하루 = 내 친구. 믿어도 됨. 질문 금지.<\/p>\n<p>\"강하루 맞지?\" 그가 손목과 내 얼굴을 번갈아 보았다. \"노트에 생긴 거 써놨거든. 눈 동그랗고, 편의점 조끼 입고, 웃을 때 왼쪽만 보조개. 맞네. 오늘도 친구 하자.\"<\/p>\n<p>\"매일 그 말 하는 거 안 지겨워?\"<\/p>\n<p>\"노트에 그것도 써 있어. '하루가 지겹냐고 물어보면 안 지겹다고 할 것. 진짜로 안 지겨움.' 내 글씨 맞네.\" 도준이 씩 웃었다. \"그리고 진짜로 안 지겨워. 나한텐 매일 처음이니까. 개이득 아니냐?\"<\/p>\n<p>나는 웃음이 터졌다. 도준이 그걸 보더니 노트를 펼쳐 뭔가를 적었다. '04:12. 하루 웃음. 오늘 첫 번째.'<\/p>\n<p>\"그거까지 적어?\"<\/p>\n<p>\"당연하지. 이게 내 메인 퀘스트야.\"<\/p>\n<p>도준은 삼각김밥 두 개를 사서 하나를 내게 밀었다. 그리고 오늘의 '뉴스'를 읊기 시작했다. 노트를 넘기면서. 매일 아침 그가 하는 일이었다. 그는 자기가 어제 내게 뭘 말했는지 모르니까, 늘 처음부터 전부 말했다.<\/p>\n<p>명부원은 낙명제를 공식 폐지했다. 정확히는, 폐지할 필요도 없었다. 최초의 명부에 '낙명제는 없었다'고 쓰인 순간부터 칠명회의 어떤 기록에도 낙명제 규정이 남아 있지 않았으니까. 서류에서, 교칙에서, 사백 년 치 회의록에서. 깨끗하게.<\/p>\n<p>칠명회는 쪼개지고 있었다. 수확 명단에 자기 집 아이가 있었던 가문들이 먼저 등을 돌렸다.<\/p>\n<p>원장 자리는 비었고, 임시로 남궁세아가 원장 대리를 맡았다.<\/p>\n<p>\"세아 누나가 그러는데, 너 입학 제안 또 거절했다며?\" 도준이 김밥 비닐을 뜯으며 말했다. \"노트에 별표 세 개 쳐 있어. '하루한테 왜 거절했는지 다시 물어볼 것. 대답 듣고도 이해 안 되면 또 물어볼 것.'\"<\/p>\n<p>\"아직은 싫어.\"<\/p>\n<p>\"왜?\"<\/p>\n<p>\"거긴 다들 나를 무명이라고 불러. 여기선 신입이라고 불러.\" 나는 계산대를 손바닥으로 쓸었다. \"신입이 더 좋아. 매일 새로 시작해도 되는 이름이잖아.\"<\/p>\n<p>도준이 한참 나를 보더니 노트에 적었다. '이해 안 됨. 근데 멋있음.'<\/p>\n<p>은솔은 동생 은별을 되찾았다. 은별이의 이름이 돌아온 그날 밤, 은솔은 동생을 업고 명부원 계단 칠 층을 한 번도 안 쉬고 올라갔다고 했다. 둘은 지금 세아가 마련해 준 기숙사 방에서 지낸다. 은솔은 매일 아침 나를 잊고, 매일 저녁 도준이 보여주는 사진을 보며 \"아, 이 언니!\" 한다고 했다.<\/p>\n<p>곽태산은 명부원 경비로 채용됐다. 본인 희망이었다.<\/p>\n<p>\"왜 경비냐고 물었더니 뭐랬는지 알아?\" 도준이 노트를 읽다가 웃었다. \"'다음에 판 짜는 놈 오면 제일 먼저 패려고.' 이거 그대로 적어놨네.\"<\/p>\n<p>나는 김밥을 한 입 베어 물었다. 참치마요. 편의점 김밥은 늘 똑같은 맛이었다. 그게 좋았다.<\/p>\n<p>도준이 노트를 덮었다. 장난기가 빠진 얼굴이었다.<\/p>\n<p>\"그리고 마지막 줄.\" 그가 말했다. \"'제하 형 소식 물어보면, 하루 표정 볼 것. 괜찮으면 말하고 안 괜찮으면 말하지 말 것.'\"<\/p>\n<p>나는 김밥을 내려놓았다.<\/p>\n<p>\"…괜찮아. 말해.\"<\/p>\n<p>\"형은 명부원 떠났대. 세아 누나가 남으라고 했는데. 집행관 다 해산됐고, 장갑도 다 반납했고. 형은 원래 이름 찾고 나서, 그냥… 사람이 됐대. 웃기도 하고, 밥도 맛있다고 하고.\" 도준이 머뭇거렸다. \"근데 너는 기억 못 한대. 세아 누나가 사진을 보여줬는데, 모르는 사람이라고.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"괜찮아?\"<\/p>\n<p>나는 대답 대신 가슴의 붉은 자국을 셔츠 위로 눌렀다.<\/p>\n<p>이름을 되찾은 대가로, 그는 더 이상 이름 없는 것을 볼 수 없게 되었다. 반쯤 지워진 사람만이 비어 있는 걸 본다. 그가 온전해졌다는 건, 내가 그에게서 사라졌다는 뜻이었다.<\/p>\n<p>내가 그렇게 썼다. 그 한 줄로. 알고 썼다.<\/p>\n<p>후회하지 않았다. 다만, 가끔 아팠다. 이름 하나 지울 때마다 하나씩 못 느끼게 된다던 사람이, 처음으로 다 느끼게 되었는데. 그 다 느끼는 세상 안에 내가 없을 뿐이었다.<\/p>\n<p>\"괜찮아.\" 내가 말했다. 이번엔 반쯤 진짜였다.<\/p>\n<p>도준은 노트에 '안 괜찮음. 근데 괜찮다고 함. 내일 아침에 또 물어볼 것.'이라고 적고, 손을 흔들며 나갔다. 오후에 다시 온다고 했다. 매일 그랬다.<\/p>\n<p>그날 밤이 떠올랐다. 자정의 종이 울린 뒤, 무너진 홀에서.<\/p>\n<p>그는 \"아는 사이였나요\" 하고 물은 뒤, 내가 대답을 못 하자 미안하다는 듯 고개를 숙였다. 그리고 바닥에 떨어진 은색 장갑을 한참 내려다보다가, 줍지 않고 일어섰다. 세아가 그를 부축해 데려갔다. 그는 홀을 나가기 전에 한 번 돌아보았다. 나를 본 건지, 무너진 책을 본 건지는 모르겠다.<\/p>\n<p>그게 마지막이었다.<\/p>\n<p>나는 그날 도준의 노트 마지막 장에 한 줄을 부탁했다. '제하 형 얘기는 하루 표정 먼저 보고 할 것.' 도준은 그걸 지키고 있었다. 매일, 처음부터.<\/p>\n<p>04:38.<\/p>\n<p>편의점이 다시 조용해졌다. 냉장고 모터 소리. 형광등 웅웅거림. 바깥은 아직 깜깜했다. 첫차까지는 한참 남은 시간.<\/p>\n<p>나는 습관처럼 재고를 셌다. 컵라면 스물넷. 생수 서른여섯. 숫자를 세면 마음이 가라앉았다. 일주일 전에도, 지금도.<\/p>\n<p>딸랑.<\/p>\n<p>문이 열렸다. 찬 공기가 밀려들었다. 새벽 냄새. 젖은 아스팔트, 멀리서 오는 매연.<\/p>\n<p>\"어서 오세요.\"<\/p>\n<p>고개를 들었다.<\/p>\n<p>검은 코트. 장갑 없는 맨손. 키가 크고, 조금 마른. 머리카락이 바람에 헝클어져 있었다. 회색 눈동자.<\/p>\n<p>숫자가 머릿속에서 전부 날아갔다.<\/p>\n<p>윤제하가 — 아니, 이제는 다른 이름을 가졌을 그가 — 편의점 입구에 서 있었다.<\/p>\n<p>그는 나를 보았다. 낯선 사람을 보는 눈으로. 정중하고, 조금 머뭇거리는 눈.<\/p>\n<p>그는 계산대로 다가오지 않았다. 대신 문 앞에서 잠시 서성였다. 무언가를 망설이는 사람처럼. 그러다 결심한 듯 걸어왔다. 그리고 계산대 위에 왼손을 올려놓았다.<\/p>\n<p>소매가 조금 걷혀 있었다.<\/p>\n<p>손목에 흉터가 있었다. 오래된, 하얀 흉터들. 이름을 긁어낸 듯한 자국들. 그리고 그 가장 끝, 오른쪽 아래로 길게 뻗은 파임 한 획.<\/p>\n<p>그 획 옆에, 먹으로 쓴 글자가 있었다.<\/p>\n<p>永.<\/p>\n<p>그리고 그 아래, 작고 반듯한 글씨로.<\/p>\n<p>찾을 것.<\/p>\n<p>\"이상한 질문인데요.\"<\/p>\n<p>그의 목소리. 일주일 동안 짧게, 낮게, 감정 없이 말하던 목소리가 아니었다. 같은 목소리인데 온도가 있었다. 조금 쑥스러워하는 온도.<\/p>\n<p>\"이 글자를 아세요?\"<\/p>\n<p>나는 대답하지 못했다. 목이 막혔다.<\/p>\n<p>\"일어났을 때부터 손목에 있었어요. 제 글씨예요. 근데 언제 썼는지 기억이 안 나요. 먹인데, 아무리 씻어도 안 지워져요.\" 그가 글자를 엄지로 문질렀다. 지워지지 않았다. \"매일 아침 이걸 보면, 누군가를 찾아야 할 것 같아서요. 그래서 일주일째 아무 데나 걸어 다녔어요. 오늘은 여기까지 왔고요.\"<\/p>\n<p>그가 편의점 안을 둘러보았다. 형광등, 온장고, 계산대 모서리의 하얀 자국.<\/p>\n<p>\"여기, 처음 와 보는 데인데. 이상하게 익숙해서.\"<\/p>\n<p>나는 웃었다.<\/p>\n<p>체념이 아니었다. 열여덟 해 동안 입꼬리만 올리던 그 웃음이 아니었다. 눈이 먼저 웃었다. 가슴의 붉은 자국이 따끔거렸는데, 아프지 않았다.<\/p>\n<p>기대였다. 처음으로.<\/p>\n<p>\"네.\" 내가 말했다. \"알아요, 그 글자.\"<\/p>\n<p>그의 눈이 커졌다.<\/p>\n<p>\"근데 길어요, 그 얘기.\" 나는 계산대에 팔꿈치를 올렸다. \"엄청 길어요. 그리고 아마 매일 해줘야 할 수도 있어요. 처음부터.\"<\/p>\n<p>그가 나를 보았다. 오래. 무언가를 기억해 내려는 듯이, 아니면 처음 보는 걸 외우려는 듯이.<\/p>\n<p>\"…괜찮아요.\" 그가 말했다. 입꼬리가 아주 조금 올라갔다. \"매일 올게요.\"<\/p>\n<p>나는 고개를 끄덕였다. 그리고 바코드 스캐너를 집어 들었다. 손이 떨려서.<\/p>\n<p>그 순간이었다.<\/p>\n<p>지직.<\/p>\n<p>계산대 위 천장 구석, 감시 카메라 모니터가 지지직거렸다. 화면이 일그러졌다. 흑백 CCTV 화면이 물결치더니, 색이 번졌다. 모니터 테두리를 따라 은빛 서리 같은 것이 번져 나갔다.<\/p>\n<p>명경이었다.<\/p>\n<p>벽시계가 째깍 넘어갔다. 04:44.<\/p>\n<p>화면 속에 남자가 있었다. 회색 양복. 은테 안경. 반쯤 무너진 미소. 일주일 사이에 십 년은 늙어 보이는 얼굴.<\/p>\n<p>남궁현.<\/p>\n<p>그가 손에 든 것을 화면 가까이 들어 올렸다. 찢어진 종이 한 장. 가장자리가 불에 그을린 하얀 페이지. 그 한가운데에 먹으로 쓰인 세 글자가, 아직 따뜻하게 빛나고 있었다.<\/p>\n<p>南宮永.<\/p>\n<p>\"영아.\"<\/p>\n<p>그 목소리. 다정하고 부드러운, 동화를 읽어주는 삼촌의 목소리.<\/p>\n<p>\"네 이름은 내가 가지고 있단다. 찾으러 오렴.\"<\/p>\n<p>화면이 꺼졌다. 모니터에 다시 흑백의 편의점이 비쳤다. 계산대 앞에 선 나. 그리고 그 옆의 그.<\/p>\n<p>가슴의 붉은 자국이 불에 덴 듯 화끈거렸다.<\/p>\n<p>옆에서 숨을 들이켜는 소리가 났다.<\/p>\n<p>그가 모니터를 보고 있었다. 그리고 자기 손목을 내려다보았다. 다시 모니터. 다시 손목. 손목의 먹 글씨와, 방금 꺼진 화면 속 종이의 마지막 글자.<\/p>\n<p>그가 천천히 나를 돌아보았다.<\/p>\n<p>\"…저 글자. 같은 거죠?\"<\/p>","chars":4864}]}];

const pref = Object.assign({theme:null, font:'serif', fs:19, lh:'1.9'}, store.get('pref', {}));
if(!pref.theme) pref.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
function applyPref(){

['segTheme','segFont','segLh'].forEach(id => $('#'+id).addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  pref[{segTheme:'theme', segFont:'font', segLh:'lh'}[id]] = b.dataset.v; applyPref();
}));

/* ---------- 진행 ---------- */
const prog = store.get('progress', {});   // slug → {ch, y, read:[...]}
const P = slug => (prog[slug] ||= {ch:0, y:0, read:[]});
const saveProg = () => store.set('progress', prog);

/* ---------- 화면 ---------- */
const views = ['shelf', 'book', 'readerWrap'];
function show(id){ views.forEach(v => $('#'+v).classList.toggle('hidden', v !== id)); closeAll(); }

function cover(b, big){
  return `<div class="cover" style="background:${b.color}">
    <span class="no">${b.chapters.length}화 완결</span>
    <h2>${esc(b.title)}</h2>${b.subtitle ? `<small>${esc(b.subtitle)}</small>` : ''}</div>`;
}

function renderShelf(){
  $('#grid').innerHTML = BOOKS.map(b => {
    const p = P(b.slug), n = b.chapters.length, r = p.read.length;
    const total = b.chapters.reduce((s, c) => s + c.chars, 0);
    return `<button class="card" data-go="#/${b.slug}">${cover(b)}
      <div class="body"><div class="tags">${esc(b.genre)}</div>
      <p class="log">${esc(b.logline)}</p>
      <div class="meter"><i style="width:${r / n * 100}%"></i></div>
      <div class="meta"><span>${r ? `${r}/${n}화 읽음` : '아직 읽지 않음'}</span><span>${Math.round(total / 1000)}천 자</span></div></div></button>`;
  }).join('');
  show('shelf'); document.title = '지하서가 — 캠퍼스 스릴러 웹소설'; scrollTo(0, 0);
}

function tocHTML(b, cur){
  const p = P(b.slug);
  return b.chapters.map((c, i) => `<li><button class="${p.read.includes(i) ? 'read' : ''} ${i === cur ? 'cur' : ''}" data-go="#/${b.slug}/${i + 1}">
    <span class="n">${String(i + 1).padStart(2, '0')}화</span><span class="t">${esc(c.title)}</span><span class="c">${(c.chars / 1000).toFixed(1)}천</span></button></li>`).join('');
}

function renderBook(b){
  const p = P(b.slug), started = p.read.length || p.ch;
  $('#book').innerHTML = `<div class="crumb"><button data-go="#/">← 지하서가</button></div>
    ${cover(b, true)}
    <p class="lead">${esc(b.logline)}</p>
    ${b.notice ? `<p class="notice">${esc(b.notice)}</p>` : ''}
    <div class="actions">
      <button class="btn primary" data-go="#/${b.slug}/${started ? p.ch + 1 : 1}">${started ? `${p.ch + 1}화 이어 읽기` : '1화부터 읽기'}</button>
      ${started ? `<button class="btn" data-go="#/${b.slug}/1">처음부터</button>` : ''}
    </div>
    <ul class="toc">${tocHTML(b)}</ul>`;
  show('book'); document.title = `${b.title} — 지하서가`; scrollTo(0, 0);
}

let cur = null;   // {b, i}
function renderChapter(b, i){
  const c = b.chapters[i], n = b.chapters.length;
  const prev = b.chapters[i - 1], next = b.chapters[i + 1];
  $('#barTitle').textContent = `${b.title} · ${i + 1}화`;
  $('#reader').innerHTML = `<header class="chhead"><div class="k">제${i + 1}화</div><h2>${esc(c.title)}</h2></header>
    <div class="text">${c.html}</div>
    ${next ? '' : '<p class="fin">— 시즌 1 완결 —</p>'}
    <nav class="endnav">
      <button ${prev ? `data-go="#/${b.slug}/${i}"` : 'disabled'}><small>← 이전 화</small><b>${prev ? esc(prev.title) : '첫 화입니다'}</b></button>
      <button class="next" ${next ? `data-go="#/${b.slug}/${i + 2}"` : `data-go="#/${b.slug}"`}><small>${next ? '다음 화 →' : '작품으로 →'}</small><b>${next ? esc(next.title) : '목차 보기'}</b></button>
    </nav>`;
  $('#drawerTitle').textContent = b.title;
  $('#drawerToc').innerHTML = tocHTML(b, i);
  show('readerWrap');
  document.title = `${i + 1}화 ${c.title} — ${b.title}`;
  const p = P(b.slug);
  const resume = p.ch === i && p.y > 0 ? p.y : 0;
  p.ch = i; saveProg();
  cur = {b, i};
  requestAnimationFrame(() => { scrollTo(0, resume * maxY()); onScroll(); });
  $('#bar').classList.remove('off');
}

/* ---------- 라우팅 ---------- */
function route(){
  const [, slug, ch] = location.hash.split('/');
  const b = bySlug[decodeURIComponent(slug || '')];
  cur = null;
  if(!b) return renderShelf();
  const i = parseInt(ch, 10) - 1;
  if(i >= 0 && i < b.chapters.length) return renderChapter(b, i);
  renderBook(b);
}
addEventListener('hashchange', route);

/* ---------- 스크롤 ---------- */
const maxY = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
let lastY = 0, saveT = 0;
function onScroll(){
  if(!cur) return;
  const y = scrollY, r = Math.min(1, y / maxY());
  $('#prog').style.width = (r * 100) + '%';
  $('#bar').classList.toggle('off', y > lastY + 4 && y > 120);
  if(y < lastY - 4) $('#bar').classList.remove('off');
  lastY = y;
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    if(!cur) return;
    const p = P(cur.b.slug);
    p.ch = cur.i; p.y = r;
    if(r > .92 && !p.read.includes(cur.i)) p.read.push(cur.i);
    saveProg();
  }, 250);
}
addEventListener('scroll', onScroll, {passive:true});

/* ---------- 서랍 · 시트 ---------- */
function open(id){ closeAll(); $('#'+id).classList.add('on'); $('#scrim').classList.add('on'); }
function closeAll(){ ['drawer', 'sheet', 'scrim'].forEach(id => $('#'+id).classList.remove('on')); }
$('#scrim').addEventListener('click', closeAll);

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if(g){ e.preventDefault(); const h = g.dataset.go; if(location.hash === h) route(); else location.hash = h; return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act;
  if(act === 'settings') open('sheet');
  else if(act === 'toc'){ open('drawer'); $('#drawerToc .cur')?.scrollIntoView({block:'center'}); }
  else if(act === 'close') closeAll();
  else if(act === 'up' && cur) location.hash = '#/' + cur.b.slug;
  else if(act === 'fs-' || act === 'fs+'){
    pref.fs = Math.min(28, Math.max(14, pref.fs + (act === 'fs+' ? 1 : -1))); applyPref();
  }
});

document.addEventListener('keydown', e => {
  if(e.altKey || e.ctrlKey || e.metaKey) return;
  if(e.key === 'Escape') return closeAll();
  if(!cur) return;
  if(e.key === 'ArrowRight' && cur.i + 1 < cur.b.chapters.length) location.hash = `#/${cur.b.slug}/${cur.i + 2}`;
  else if(e.key === 'ArrowLeft' && cur.i > 0) location.hash = `#/${cur.b.slug}/${cur.i}`;
  else if(e.key === 't' || e.key === 'T') open('drawer');
});

applyPref();
route();
</script>
</body>
</html>
