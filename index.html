해가 안 되는 건 무섭다. 그런데 이상하게, 다시 보고 싶었다.<\/p>\n<p>나는 무릎에 이마를 박고 숫자를 셌다. 스물까지 세고 나서야 다리가 말을 들었다.<\/p>\n<hr class=\"scene\">\n<p>통로를 내려갔을 때 싸움은 끝나 있었다.<\/p>\n<p>태산이 플랫폼에 엎어져 있었다. 쇠사슬이 그의 팔다리에 엉겨 연기를 피웠다. 가슴에 매달렸던 명패 아홉 개와 그의 7번 명패는 전부 세아의 손에 있었다.<\/p>\n<p>\"성공이야!\"<\/p>\n<p>도준이 나를 보고 달려왔다. 얼굴이 검댕투성이였다.<\/p>\n<p>\"야, 너 어디 갔었어? 떨어지는 거 봤는데 내가, 진짜, 심장이…….\"<\/p>\n<p>\"괜찮아. 붙잡을 데가 있었어.\"<\/p>\n<p>거짓말은 아니었다.<\/p>\n<p>은솔이 내 허리를 끌어안았다. \"언니, 다행이다, 다행이다.\" 작은 몸이 따뜻했다.<\/p>\n<p>세아가 태산의 명패를 들어 올렸다. 그녀가 낮게 이름을 부르자 명패가 빛을 토하며 그녀의 손바닥으로 녹아들었다. 세아의 머리카락이 바람도 없이 일렁였다.<\/p>\n<p>열 개. 한꺼번에.<\/p>\n<p>그녀가 눈을 감고 숨을 들이켰다. 칠명가 영애의 얼굴에 처음 보는 표정이 스쳤다. 굶주림이었다.<\/p>\n<p>\"이 정도면.\"<\/p>\n<p>세아가 중얼거렸다.<\/p>\n<p>\"아버지도 이제 제하 오빠 말고 나를 보시겠지.\"<\/p>\n<p>그 말이 귀에 걸렸다. 제하 오빠. 아버지. 나는 아직 그 두 단어를 하나로 엮을 줄 몰랐다.<\/p>\n<p>\"세아, 약속대로—\"<\/p>\n<p>내가 말을 꺼내는 순간이었다.<\/p>\n<p>세아의 손이 뱀처럼 뻗었다. 도준의 가슴으로.<\/p>\n<p>찢어지는 소리.<\/p>\n<p>도준의 31번 명패가 그녀의 손안에 있었다.<\/p>\n<p>\"어……?\"<\/p>\n<p>도준이 자기 가슴을 내려다봤다. 명패가 달려 있던 자리에 실밥만 덜렁거렸다.<\/p>\n<p>\"동맹은.\"<\/p>\n<p>세아가 무심하게 말했다. 측근 둘이 은솔과 나를 가로막았다.<\/p>\n<p>\"저 괴물이 쓰러질 때까지였어.\"<\/p>\n<p>\"약속했잖아!\"<\/p>\n<p>\"했지. 태산 거는 내가 가지고, 너희 건 안 건드린다고. 근데 넌 사냥당하지 않잖아. 그러니까 네 건 안 건드려.\"<\/p>\n<p>그녀가 도준의 명패를 들어 올렸다. 입술이 열렸다.<\/p>\n<p>\"봉—\"<\/p>","chars":4940},{"title":"후원","html":"<p>[낙명제 3일째 · 마감까지 98시간]<\/p>\n<p>\"봉—\"<\/p>\n<p>생각보다 몸이 먼저 갔다.<\/p>\n<p>나는 세아를 향해 몸을 던졌다. 어깨가 그녀의 팔꿈치에 박혔다. 뼈끼리 부딪치는 둔탁한 소리.<\/p>\n<p>명패가 그녀 손에서 튕겨 나갔다.<\/p>\n<p>쨍그랑, 쨍, 쨍.<\/p>\n<p>동판이 플랫폼 위를 튀며 굴러갔다. 레일 틈으로. 그리고 배수구 철망 사이로 쏙 빠져서, 어둠 속으로 사라졌다.<\/p>\n<p>\"너……!\"<\/p>\n<p>세아가 손목을 감싸 쥐었다. 이름은 끝까지 불리지 않았다. 아직 흡수 전이었다.<\/p>\n<p>아직은.<\/p>\n<p>\"너 지금 무슨 짓을 했는지 알아?\"<\/p>\n<p>세아의 목소리가 낮게 깔렸다. 고함보다 무서운 목소리였다. 손바닥에서 태산의 마력이 붉게 일렁이며 공기를 데웠다. 열 사람분의 이름이 그녀 안에서 끓고 있었다.<\/p>\n<p>\"알아. 약속 지키게 해 준 거.\"<\/p>\n<p>\"이름도 없는 게.\"<\/p>\n<p>\"그러니까 잃을 것도 없지.\"<\/p>\n<p>나는 버텼다. 무릎이 후들거렸지만, 세아의 시선이 내 얼굴을 자꾸 놓치는 게 보였다. 그녀는 나를 노려보려다 초점을 잃고, 다시 찾고, 또 잃었다. 이름 없는 얼굴은 미워하기도 어렵다.<\/p>\n<p>\"잡아!\"<\/p>\n<p>세아가 고개를 돌려 소리쳤다. 측근들이 배수구로 달려갔다. 나는 도준의 팔을 잡아끌었다. 그의 팔은 차갑고 축축했다. 땀인지 물인지 몰랐다.<\/p>\n<p>\"도준, 정신 차려. 아직 안 끝났어.\"<\/p>\n<p>\"나, 나 명패, 명패가…….\"<\/p>\n<p>\"찾으면 돼. 이름 안 불렸어. 찾으면 돼.\"<\/p>\n<p>은솔이 도준의 다른 팔을 붙들었다. 우리는 배수구 옆 정비 계단으로 뛰어들었다.<\/p>\n<hr class=\"scene\">\n<p>지하 3층 하수로는 무릎까지 물이 찼다.<\/p>\n<p>검고 미지근한 물. 썩은 이끼와 쇳물 냄새가 코를 찔렀다. 천장에서 떨어지는 물방울이 목덜미를 타고 등줄기로 흘렀다.<\/p>\n<p>명패는 물살을 따라 굴러가고 있을 것이다.<\/p>\n<p>\"이쪽.\"<\/p>\n<p>도준이 이를 딱딱거리며 물살을 가리켰다. 떨면서도 눈은 살아 있었다.<\/p>\n<p>\"물이 이 방향으로 흘러. 배수구 각도 봐. 남쪽 교차점에 침전 웅덩이가 있어. 무거운 건 다 거기 가라앉아. 우리 집 지하실이랑 구조가 똑같아.\"<\/p>\n<p>\"너네 집 지하실이 하수로야?\"<\/p>\n<p>\"몰명 집은 다 지하실이 하수로야.\"<\/p>\n<p>농담인지 진담인지 몰랐다. 우리는 물살을 따라 걸었다. 발밑에서 뭔가 미끄덩한 게 밟혔다. 은솔이 작게 비명을 삼켰다. 손전등 대신 도준이 고친 발광 부적 하나가 우리 앞을 희미하게 비췄다. 초록빛이 젖은 벽에 번들거렸다.<\/p>\n<p>벽에는 오래된 낙서가 있었다. 누군가 손톱으로 긁은 이름들. 획이 비뚤어지고, 끝이 흐려진 이름들. 그중 몇 개는 이름의 반쯤에서 긁기를 멈춘 채였다.<\/p>\n<p>쓰다가 잊어버린 걸까. 쓰다가 사라진 걸까.<\/p>\n<p>나는 그 앞을 빨리 지나쳤다.<\/p>\n<p>뒤쪽에서 물살 가르는 소리가 났다. 세아 쪽. 그리고 앞쪽에서도.<\/p>\n<p>\"……저기.\"<\/p>\n<p>은솔이 속삭였다. 하수로가 넓어지는 교차점에, 태산을 따라다니던 놈들이 모여 있었다. 다섯. 주인을 잃은 하이에나들. 태산이 쓰러진 걸 알고 남은 걸 주우러 내려온 것이다.<\/p>\n<p>그중 하나가 물속에서 무언가를 건져 올렸다. 동판이 손전등 불빛에 번쩍였다.<\/p>\n<p>31.<\/p>\n<p>도준이 숨을 들이켰다. 나는 그의 입을 손으로 막았다. 그의 숨이 손바닥에 뜨겁게 닿았다.<\/p>\n<p>\"그거 내놔.\"<\/p>\n<p>세아의 목소리였다. 반대편 수로에서 그녀가 측근들과 함께 나타났다. 손바닥에 태산의 마력이 아직 일렁이고 있었다.<\/p>\n<p>\"칠명가 년이 왜 여기까지 기어 내려와?\"<\/p>\n<p>\"내 거니까.\"<\/p>\n<p>\"주운 놈이 임자지.\"<\/p>\n<p>공기가 팽팽해졌다. 아무도 내 쪽을 보지 않았다. 당연했다. 나는 원래 잘 안 보이니까.<\/p>\n<p>나는 숫자를 셌다.<\/p>\n<p>하나. 세아가 손을 들었다.<\/p>\n<p>둘. 하이에나들이 부적을 꺼냈다.<\/p>\n<p>셋.<\/p>\n<p>빛과 물보라가 동시에 터졌다. 세아의 마력이 수면을 갈랐고, 하이에나들의 부적이 터지며 매캐한 연기가 수로를 메웠다. 비명, 욕설, 물 튀는 소리.<\/p>\n<p>명패를 든 놈이 세아의 공격을 피해 몸을 비트는 순간, 손이 비었다.<\/p>\n<p>그 틈이었다.<\/p>\n<p>나는 연기 속으로 잠수하듯 몸을 낮춰 들어갔다. 물이 가슴까지 차올랐다. 차가웠다. 누군가의 팔꿈치가 내 광대를 쳤다. 눈앞이 번쩍했다. 피 맛.<\/p>\n<p>손끝에 금속이 닿았다.<\/p>\n<p>나는 그걸 움켜쥐고 뒤로 빠졌다. 아무도 쫓아오지 않았다. 아무도 내가 들어왔다는 걸 몰랐으니까.<\/p>\n<p>정비 계단 아래로 돌아왔을 때, 나는 주먹을 펼쳤다.<\/p>\n<p>31. 봉도준.<\/p>\n<p>도준이 그걸 보고, 다리에 힘이 풀려 물속에 주저앉았다.<\/p>\n<hr class=\"scene\">\n<p>\"나 진짜…….\"<\/p>\n<p>도준은 명패를 가슴에 꽉 쥔 채 덜덜 떨었다. 이가 딱딱 부딪쳤다.<\/p>\n<p>\"진짜 죽는 줄 알았어. 아니 죽는 게 아니라 사라지는 거지, 사라지는 게 더 무섭지, 죽으면 제사라도 지내 주는데 사라지면 그것도 없잖아, 아니 우리 집은 제사 안 지내나, 아 몰라.\"<\/p>\n<p>\"도준.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"숨 쉬어.\"<\/p>\n<p>그가 숨을 쉬었다. 길게. 젖은 앞머리에서 물이 떨어졌다.<\/p>\n<p>은솔이 손수건으로 내 광대를 눌렀다. \"언니 피 나요.\" 손수건에서 희미한 비누 냄새가 났다.<\/p>\n<p>위쪽 어딘가에서 세아의 고함이 메아리쳤다. 명패가 사라진 걸 이제 안 것이다. 하이에나들의 욕설이 뒤섞였다. 서로가 서로를 의심하고 있었다. 칠명가 영애는 하이에나가 숨겼다고, 하이에나는 칠명가가 빼돌렸다고.<\/p>\n<p>아무도 나를 의심하지 않았다.<\/p>\n<p>이상한 기분이었다. 평생 나를 괴롭혀 온 것이, 지금 나를 지켜 주고 있었다.<\/p>\n<p>우리는 하수로 위쪽, 버려진 보일러실에 몸을 숨겼다. 녹슨 보일러에서 아직 온기가 미세하게 새어 나왔다. 셋이서 거기 등을 붙이고 앉았다.<\/p>\n<p>그때, 천장에서 빛이 내려왔다.<\/p>\n<p>작은 명경 조각이 공중에 떠올랐다. 그 표면이 물결처럼 일렁이더니, 꾸러미 하나가 툭 떨어졌다.<\/p>\n<p>\"후, 후원이다.\"<\/p>\n<p>도준이 눈을 크게 떴다.<\/p>\n<p>\"귀족이 너한테 후원을 보냈어. 명경으로 보고 있다가 마음에 들면 보내는 거. 야, 너 진짜 뭐 했길래?\"<\/p>\n<p>꾸러미 안에는 붕대 한 롤, 아직 따뜻한 버터빵 세 개, 그리고 반으로 접힌 쪽지 한 장이 들어 있었다.<\/p>\n<p>빵 냄새가 보일러실을 채웠다. 은솔의 배에서 꼬르륵 소리가 났다. 우리는 아무 말 없이 빵을 나눴다. 버터가 손가락에 묻었다. 사흘 만에 먹는 따뜻한 음식이었다.<\/p>\n<hr class=\"scene\">\n<p>도준이 빵을 다 먹고 나서도 한참을 말이 없었다.<\/p>\n<p>말 많은 애가 조용하면 무섭다. 나는 그를 봤다. 그는 무릎을 끌어안고 보일러의 녹슨 표면만 보고 있었다.<\/p>\n<p>\"우리 아빠가.\"<\/p>\n<p>목소리가 작았다.<\/p>\n<p>\"말소되던 날 있잖아. 낙명제에서. 집에 있는 사람들이 다 아빠를 잊었어. 엄마도, 할머니도, 형도. 아빠 밥그릇을 왜 꺼냈냐고 엄마가 물었어.\"<\/p>\n<p>물방울이 똑, 떨어졌다.<\/p>\n<p>\"나만 기억했어. 사흘 동안. 사흘째 밤에 아빠 얼굴이 기억이 안 나더라. 근데 '기억이 안 난다'는 건 기억났어. 그게 제일 끔찍했어.\"<\/p>\n<p>나는 숨을 삼켰다.<\/p>\n<p>\"그래서 너 잊는 게 무서워.\"<\/p>\n<p>도준이 나를 봤다. 젖은 눈이었다.<\/p>\n<p>\"오늘 밤 지나면 나 또 너 잊잖아. 노트 보고 다시 친구 해야 되잖아. 그게…… 너한테 미안해.\"<\/p>\n<p>\"미안할 게 뭐가 있어. 원래 다 그래.\"<\/p>\n<p>\"원래 다 그런 게 제일 싫어.\"<\/p>\n<p>그가 노트를 꺼내 펼쳤다. 젖어서 잉크가 번진 페이지. 그 위에 그는 꾹꾹 눌러 썼다. 오늘 하루가 명패 찾아 줌. 물속으로 들어감. 광대 다침. 진짜 친구임.<\/p>\n<p>\"내가 너 잊어도, 노트는 안 잊어.\"<\/p>\n<p>그가 노트를 덮었다.<\/p>\n<p>\"그러니까 너도 나 포기하지 마.\"<\/p>\n<p>목 안쪽이 뜨거워졌다. 참으려고 했다. 숫자를 세려고 했다. 하나도 셀 수가 없었다.<\/p>\n<p>눈물이 먼저 떨어졌다.<\/p>\n<p>언제 마지막으로 울었는지 기억나지 않았다. 울어 봐야 내일이면 아무도 기억 못 하니까, 울 이유가 없었다. 그런데 지금은, 내일 이 애가 노트를 읽으면, 내가 울었다는 것도 거기 적혀 있을 것이다.<\/p>\n<p>은솔이 내 등을 토닥였다. 도준은 당황해서 \"아니 왜 울어, 내가 울려야 되는 거 아니야?\" 하고 허둥댔다.<\/p>\n<p>나는 울면서 웃었다.<\/p>\n<p>\"야, 은솔이도 써 줘.\"<\/p>\n<p>도준이 코를 훌쩍이며 노트를 은솔에게 내밀었다. 은솔은 볼펜을 받아 들고 한참 고민하더니, 귀퉁이에 작은 글씨로 적었다.<\/p>\n<p>하루 언니는 우는 것도 예쁨.<\/p>\n<p>\"이걸 왜 써!\"<\/p>\n<p>\"내일 오빠가 읽어야 되잖아요. 중요한 정보예요.\"<\/p>\n<p>도준이 배를 잡고 웃었다. 보일러실 벽에 웃음소리가 둥글게 울렸다. 젖은 옷에서 김이 피어올랐다. 버터 냄새와 녹 냄새와 하수 냄새가 뒤섞인, 세상에서 제일 지저분한 방이었다.<\/p>\n<p>그런데 그 방이, 내가 기억하는 어느 방보다 따뜻했다.<\/p>\n<p>은솔이 먼저 꾸벅꾸벅 졸다가 내 어깨에 머리를 기댔다. 머리카락에서 비누 냄새가 났다. 도준은 노트를 가슴에 안고 보일러에 등을 기댄 채 잠들었다. 입을 벌리고, 가끔 잠꼬대로 \"질문 금지……\" 하고 중얼거리면서.<\/p>\n<p>나는 두 사람의 숨소리를 들었다. 하나, 둘. 하나, 둘.<\/p>\n<p>내일 아침이면 이 애들은 나를 처음 보는 얼굴로 볼 것이다. 그래도 괜찮다고 생각했다. 노트가 있으니까. 오늘이 거기 적혀 있으니까.<\/p>\n<hr class=\"scene\">\n<p>둘이 잠든 뒤, 나는 쪽지를 펼쳤다.<\/p>\n<p>종이는 두껍고 오래된 한지였다. 손끝에 결이 거칠게 걸렸다. 은은한 묵향.<\/p>\n<p>그리고 글씨.<\/p>\n<p>나는 그 글씨를 알았다. 금서고 기록부, 사진 아래 적혀 있던 서명. 남궁연. 날렵하게 꺾이는 획, 끝을 살짝 들어 올리는 버릇.<\/p>\n<p>엄마의 필체였다.<\/p>\n<p>\"■야. 너는 하루가 아니란다.\"<\/p>\n<p>첫 글자는 불에 그을린 듯 까맣게 타서 읽을 수 없었다.<\/p>\n<p>\"지우개를 믿지 마라.\"<\/p>\n<p>심장이 귀에서 뛰었다.<\/p>\n<p>쪽지 맨 끝, 서명이 있어야 할 자리에는 이름 대신 획 하나만 그어져 있었다. 아래로 내려오다가 끝에서 위로 톡 튀어 오르는 갈고리.<\/p>\n<p>넷째 획.<\/p>\n<p>점, 가로, 세로, 갈고리. 나는 손가락으로 허공에 그 넷을 그려 봤다. 아직은 아무 글자도 되지 않았다.<\/p>\n<p>등불 아래 쪽지를 기울였다. 먹이 마른 결이 빛에 드러났다. 가로획 하나, 붓끝이 처음 눌린 자국이 오른쪽에 있었다. 먹이 왼쪽으로 갈수록 옅어졌다.<\/p>\n<p>오른쪽에서 왼쪽으로 그은 선.<\/p>\n<p>이상하다고 생각했다. 그 생각은 오래가지 않았다. 다음 문장이 다른 모든 걸 덮었으니까.<\/p>\n<p>너는 하루가 아니란다.<\/p>\n<p>나에게는 진짜 이름이 있다.<\/p>\n<p>보육원 원장 선생님이 붙여 준 이름. 하루만 기억되는 아이라서 하루. 출석부에서, 상장에서, 편의점 근무표에서 매일 지워지던 그 두 글자가 내 것이 아니었다.<\/p>\n<p>나는 쪽지의 타 버린 첫 글자를 엄지로 쓸었다. 그을음이 손끝에 묻어났다. 한 글자. 단 한 글자가 지워져 있었다.<\/p>\n<p>무슨 글자였을까. 어떤 소리로 불렸을까. 엄마는 그 이름을 몇 번이나 불러 봤을까.<\/p>\n<p>그리고 엄마가 그걸 알고 있다.<\/p>\n<p>나는 명경 조각이 떠 있던 천장의 빈자리를 올려다봤다. 지금도 누군가 저 너머에서 나를 보고 있었다.<\/p>\n<p>말소된 사람이.<\/p>","chars":4889},{"title":"공시, 투표","html":"<p>[낙명제 4일째 · 마감까지 85시간]<\/p>\n<p>밤새 쪽지를 쥐고 잤다.<\/p>\n<p>눈을 뜨자 손바닥에 한지의 결이 찍혀 있었다. 땀에 불어 글씨 몇 개가 손금에 번져 있었다. 지우개를 믿지 마라.<\/p>\n<p>머릿속에서 그 문장 위로 다른 목소리가 겹쳤다.<\/p>\n<p>넌 내일도 기억나. 그게 문제야.<\/p>\n<p>둘 중 하나는 거짓말이었다. 아니면 둘 다 진실이거나. 그게 더 끔찍했다.<\/p>\n<p>보일러실 구석에서 도준이 노트를 읽고 있었다. 입술을 달싹이다가 한 줄에서 멈추고, 나를 보고, 다시 노트를 보고, 얼굴이 빨개졌다.<\/p>\n<p>\"……하루 언니는 우는 것도 예쁨?\"<\/p>\n<p>\"그건 은솔이가 쓴 거야.\"<\/p>\n<p>\"아, 다행이다. 난 내가 쓴 줄 알고.\"<\/p>\n<p>그가 손목을 보고 고개를 끄덕였다. 강하루 = 내 친구. 믿어도 됨. 질문 금지. 볼펜 글씨가 어제보다 진해져 있었다. 자기 전에 덧쓴 모양이었다.<\/p>\n<p>\"안녕, 친구. 오늘은 뭐 해?\"<\/p>\n<p>대답하기도 전에 종이 울렸다.<\/p>\n<p>지하 전체가 떨리는 소리였다. 벽의 녹이 부스스 떨어졌다. 은솔이 잠에서 깨 두리번거렸다.<\/p>\n<p>\"공시예요.\"<\/p>\n<p>은솔이 속삭였다. 얼굴이 하얗게 질려 있었다.<\/p>\n<p>\"두 번째 공시.\"<\/p>\n<hr class=\"scene\">\n<p>투표장은 지하 5층에 있었다.<\/p>\n<p>내려가는 계단에서 우리는 곽태산을 지나쳤다. 그는 벽에 등을 기대고 앉아 자기 빈 가슴을 내려다보고 있었다. 명패가 달려 있던 자리에 뜯긴 실밥이 늘어져 있었다. 그 거구가, 처음으로 작아 보였다.<\/p>\n<p>도준이 내 소매를 당겼다. 빨리 지나가자는 뜻이었다. 나는 걸음을 늦췄다. 태산이 고개를 들었다. 나를 보고, 미간을 찌푸렸다. 기억을 더듬는 얼굴이었다.<\/p>\n<p>\"……너, 어디서 봤는데.\"<\/p>\n<p>\"환기구에서.\"<\/p>\n<p>그는 한참 생각하다가 고개를 저었다. 기억나지 않는다는 듯이. 그러고는 다시 가슴을 내려다봤다.<\/p>\n<p>나를 밟겠다던 사람이 나를 기억하지 못했다. 고소해야 할 텐데, 목구멍이 쓰기만 했다.<\/p>\n<p>원형 계단식 강당. 마흔 몇 명의 참가자가 비탈진 좌석에 흩어져 앉았다. 첫날 마흔아홉이었던 숫자가 눈에 띄게 줄어 있었다. 빈자리마다 서늘한 공기가 고여 있었다.<\/p>\n<p>천장은 둥근 돔이었다. 그 아래 수십 개의 명경이 원을 그리며 떠 있었다. 거울 표면 너머로 희미한 실루엣들이 비쳤다. 비단옷, 찻잔, 부채. 칠명가 귀족들이 차를 마시며 우리를 보고 있었다.<\/p>\n<p>강당 한가운데 시험관이 섰다. 회색 도포, 얼굴 없는 가면.<\/p>\n<p>\"두 번째 공시. 규칙은 단순하다.\"<\/p>\n<p>목소리가 돔에 부딪혀 사방에서 들렸다.<\/p>\n<p>\"각자 종이에 한 사람의 번호를 적는다. 최다 득표자는 오늘 자정, 집행된다.\"<\/p>\n<p>강당이 술렁였다. 누군가 욕을 삼켰고, 누군가 웃었다. 웃은 쪽이 더 무서웠다.<\/p>\n<p>\"기권은 없다. 백지는 자기 번호로 간주한다. 투표까지 한 시간.\"<\/p>\n<p>시험관이 사라졌다. 남은 건 마흔 몇 개의 시선이 서로를 재는 소리 없는 소음이었다.<\/p>\n<hr class=\"scene\">\n<p>정치는 오 분 만에 시작됐다.<\/p>\n<p>세아가 맨 앞줄에서 일어섰다. 태산의 마력까지 흡수한 그녀는 어제보다 한 뼘 커 보였다. 측근 해원과 지강이 그녀 양옆에 섰다.<\/p>\n<p>\"칠명가 출신은 이쪽으로.\"<\/p>\n<p>열 명 남짓이 그녀 쪽으로 움직였다.<\/p>\n<p>태산을 따르던 하이에나들은 반대편 구석에 뭉쳤다. 태산은 명패를 잃었다. 그런데도 그 거구는 하이에나들 뒤에 무너진 성벽처럼 앉아 있었다. 명패 없는 자는 마감 때 말소된다. 그는 아무것도 보지 않고 있었다.<\/p>\n<p>몰명 출신들은 계단 중간에 어정쩡하게 모였다. 도준이 그쪽 애들과 수군거렸다.<\/p>\n<p>\"칠명가가 몰명 찍을 거래. 그러니까 우리는 칠명가 하나를 몰아 찍자는데…….\"<\/p>\n<p>\"누구를?\"<\/p>\n<p>\"그게, 세아는 무섭고. 해원이는…….\"<\/p>\n<p>정치의 언어는 단순했다. 누가 미운가. 누가 약한가. 누가 내 편이 아닌가.<\/p>\n<p>은솔이 내 손을 잡았다. 손바닥이 땀에 젖어 미끄러웠다.<\/p>\n<p>\"언니, 무서워요.\"<\/p>\n<p>\"나도.\"<\/p>\n<p>나는 강당을 둘러보며 고개를 들었다.<\/p>\n<p>돔 천장에 문양이 있었다. 금박이 벗겨진 오래된 장식 사이로, 왼쪽 아래에서 오른쪽 위로 짧게 치켜 올라간 획 하나. 붓을 눌렀다가 힘차게 튕겨 올린 모양.<\/p>\n<p>다섯째.<\/p>\n<p>나는 무릎 위에 손가락으로 그어 봤다. 점. 가로. 세로. 갈고리. 치킴.<\/p>\n<p>다섯 개의 획이 무릎 위에서 겹쳤다. 흩어진 조각이 아니었다. 순서가 있었다. 누군가 한 글자를 일부러 해체해서 이 지하 곳곳에 뿌려 놓은 것이다.<\/p>\n<p>이것들이 모이면 글자가 된다.<\/p>\n<p>그리고 그 글자는, 아마도, 타 버린 쪽지의 첫 글자일 것이다.<\/p>\n<p>심장이 빨라졌다. 하지만 지금 그걸 끝까지 따라갈 시간이 없었다. 강당의 공기가 변하고 있었다.<\/p>\n<p>계단을 내려오는 발소리가 들렸다. 굽 있는 구두. 일정한 박자.<\/p>\n<p>세아였다. 측근도 없이 혼자. 그녀는 내 옆자리에 앉았다. 은솔이 움찔하며 내 쪽으로 붙었다.<\/p>\n<p>\"어제 일은.\"<\/p>\n<p>세아가 정면을 본 채 말했다. 손목에 붕대가 감겨 있었다. 내가 어깨로 들이받은 자리.<\/p>\n<p>\"사과 안 할 거야.\"<\/p>\n<p>\"안 기다렸어.\"<\/p>\n<p>\"그 몰명 애, 명패 찾았다며. 하이에나들이 서로 의심하다 둘이나 뜯겼어. 덕분에 내 쪽 표가 늘었고.\"<\/p>\n<p>그녀가 나를 봤다. 시선이 내 얼굴 위를 미끄러지다 간신히 걸렸다.<\/p>\n<p>\"거래 하나 더 하자. 넌 나 안 찍어. 난 내 쪽 애들한테 너 안 찍게 해. 간단하지?\"<\/p>\n<p>\"네 쪽 애들이 내가 누군지 기억은 해?\"<\/p>\n<p>세아의 입이 다물어졌다. 그녀는 강당을 한 번 둘러보고, 다시 나를 봤다. 아주 잠깐, 그 오만한 얼굴에 당혹이 스쳤다. 자기가 지금 누구와 거래하고 있는지 설명할 단어를 찾지 못하는 얼굴.<\/p>\n<p>\"……번호는 기억하겠지.\"<\/p>\n<p>\"그럼 번호한테 약속해.\"<\/p>\n<p>세아가 짧게 웃었다. 비웃음인지 진짜 웃음인지 알 수 없었다.<\/p>\n<p>\"너 진짜 재수 없다.\"<\/p>\n<p>그녀는 일어서서 계단을 올라갔다. 세 걸음쯤 가다가 멈추고, 뒤돌아봤다. 나를 찾는 눈이었다. 찾지 못했다. 그녀는 미간을 찡그리고 그냥 올라갔다.<\/p>\n<p>은솔이 숨을 내쉬었다. \"저 언니 무서워요.\"<\/p>\n<p>\"응. 근데 거짓말은 잘 못하는 것 같아.\"<\/p>\n<p>어제 그녀는 약속의 문구를 지켰다. 문구만. 그게 세아의 방식이었다. 무섭지만, 읽을 수는 있었다.<\/p>\n<p>읽을 수 없는 건 따로 있었다.<\/p>\n<hr class=\"scene\">\n<p>투표 십오 분 전.<\/p>\n<p>나는 계단 끝에 앉아 사람들을 보다가, 이상한 걸 깨달았다.<\/p>\n<p>세아의 무리가 몰명 쪽을 노려본다. 몰명 쪽은 하이에나를 노려본다. 하이에나는 칠명가를 노려본다. 미움은 얼굴이 있는 사람에게 향했다. 이름이 있고, 기억이 쌓인 사람에게.<\/p>\n<p>그런데 누구도 진짜 표적을 정하지 못하고 있었다. 칠명가를 찍으면 칠명가의 보복이 온다. 몰명을 찍으면 몰명이 뭉친다. 하이에나를 찍으면 하이에나가 이빨을 드러낸다.<\/p>\n<p>모두가 서로를 기억하고 있었다. 기억은 곧 관계였고, 관계는 곧 보복이었다.<\/p>\n<p>그렇다면, 보복이 없는 표는 어디로 갈까.<\/p>\n<p>얼굴은 본 적 있는데, 아무도 이름을 모르는 사람.<\/p>\n<p>미워할 수도, 지켜 줄 수도 없는 사람.<\/p>\n<p>나는 손끝이 차가워지는 것을 느꼈다. 위장이 뒤틀렸다. 숨이 얕아졌다.<\/p>\n<p>강당 저쪽에서 누군가 나를 가리키며 옆 사람에게 속삭이는 게 보였다. \"저 애 몇 번이야?\" \"몰라. 근데 계속 있었던 것 같은데.\" \"명패 비었지? 이름 없는 애.\" \"그럼 걔 찍으면 아무도 안 화내겠네.\"<\/p>\n<p>그 말이 강당 안에서 물처럼 번져 나갔다. 소리 없이. 나를 보는 시선이 하나씩 늘었다. 그리고 시선들은 나를 보다가, 초점을 잃고, 다시 찾았다. 찾을 때마다 표정이 조금씩 편해졌다.<\/p>\n<p>잊어도 되는 사람을 찾았다는 얼굴이었다.<\/p>\n<p>\"언니.\"<\/p>\n<p>은솔이 내 귀에 입을 댔다. 숨결이 따뜻했다.<\/p>\n<p>\"언니는 내가 안 찍을게요. 진짜로요. 약속.\"<\/p>\n<p>나는 은솔을 봤다. 동그란 눈이 젖어 있었다. 진심이었다. 이 아이는 지금 진심이었다.<\/p>\n<p>고맙다고 말하려 했다. 목이 막혔다.<\/p>\n<p>이 약속도 내일이면 은솔은 잊을 것이다. 약속했다는 사실조차. 하지만 오늘의 은솔은 약속을 지킬 것이다. 그거면 됐다고 생각하려 했다.<\/p>\n<p>생각이 잘 되지 않았다.<\/p>\n<p>\"고마워.\"<\/p>\n<p>간신히 말했다. 은솔이 내 손을 더 세게 쥐었다.<\/p>\n<p>도준이 계단을 뛰어 올라왔다. 숨이 차 있었다.<\/p>\n<p>\"야, 큰일 났어. 몰명 쪽 애들이, 칠명가 애들이랑 하이에나까지, 다 같은 번호 쓰자고 말 맞추고 있어.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"너 알아? 누군지 알아?\"<\/p>\n<p>\"응.\"<\/p>\n<p>도준의 얼굴에서 핏기가 빠졌다. 그가 내 가슴의 빈 명패를 봤다.<\/p>\n<p>\"……아니지. 아니라고 해.\"<\/p>\n<p>나는 아무 말도 하지 않았다.<\/p>\n<p>도준은 노트를 꺼냈다. 손이 덜덜 떨려서 볼펜이 종이를 긁었다. 그는 강당을 둘러보며 소리쳤다.<\/p>\n<p>\"야! 이 애, 이 애 어제 내 명패 찾아 줬어! 물에 들어가서! 얘 찍으면…….\"<\/p>\n<p>몇 명이 그를 돌아봤다. 그리고 그가 가리키는 쪽을 봤다. 나를. 초점을 잃었다. 다시 도준을 봤다.<\/p>\n<p>\"누구 말하는 거야?\"<\/p>\n<p>도준의 입이 벌어진 채 굳었다.<\/p>\n<hr class=\"scene\">\n<p>투표는 조용했다.<\/p>\n<p>종이를 접는 소리. 펜이 사각거리는 소리. 투표함에 종이가 떨어지는 소리. 마흔 몇 번의 작은 낙하음.<\/p>\n<p>나는 내 종이에 아무것도 적지 않으려다, 백지는 자기 번호라는 말이 떠올라 아무 번호나 적었다. 7. 이미 명패를 잃은 태산의 번호. 아무도 해치지 않는 숫자.<\/p>\n<p>도준은 종이에 힘을 줘서 49라고 쓴 다음, 줄을 긋고, 또 긋고, 결국 22라고 썼다가 은솔을 보고 지웠다. 마지막엔 세아의 번호를 적었다. 이를 악물고.<\/p>\n<p>시험관이 돌아왔다. 투표함이 열렸다.<\/p>\n<p>종이가 한 장씩 펼쳐질 때마다 번호가 불렸다. 강당이 숨을 죽였다.<\/p>\n<p>\"1번.\"<\/p>\n<p>\"31번.\"<\/p>\n<p>\"49번.\"<\/p>\n<p>\"49번.\"<\/p>\n<p>\"49번.\"<\/p>\n<p>내 번호가 반복될 때마다, 명경 너머 귀족들의 실루엣이 부채를 흔들었다. 재미있다는 듯이.<\/p>\n<p>열. 열다섯. 스물.<\/p>\n<p>숫자를 세지 않으려 했다. 버릇은 무서웠다. 나는 셌다.<\/p>\n<p>스물셋.<\/p>\n<p>\"최다 득표, 스물세 표.\"<\/p>\n<p>시험관이 고개를 들었다.<\/p>\n<p>\"49번.\"<\/p>\n<p>강당의 모든 고개가 나를 향했다. 그리고 초점을 잃었다. 몇은 벌써 다른 곳을 보고 있었다. 결과가 정해졌으니, 더 기억할 필요도 없다는 듯이.<\/p>\n<p>은솔이 내 손을 놓지 않았다. 손이 얼음처럼 차가웠다. 그녀가 무엇을 적었는지 나는 묻지 않았다.<\/p>\n<p>그때 돔 천장의 명경들이 일제히 빛났다.<\/p>\n<p>원장의 얼굴이 떠올랐다. 첫날 개막식에서처럼 온화한 미소. 그가 우리 모두를 내려다봤다. 아니, 정확히는 나를.<\/p>\n<p>\"공정한 결과로군요.\"<\/p>\n<p>목소리가 부드러웠다. 차를 권하는 사람처럼.<\/p>\n<p>\"오늘 자정, 49번의 집행을 거행합니다. 집행자는—\"<\/p>\n<p>명경 속 원장이 잠시 숨을 골랐다. 마치 이 순간을 아껴 두었다는 듯이.<\/p>\n<p>\"윤제하.\"<\/p>\n<p>강당 반대편, 그림자 진 출입구에 그가 서 있었다.<\/p>\n<p>언제부터 거기 있었는지 몰랐다. 검은 코트. 무표정한 얼굴.<\/p>\n<p>그가 고개를 숙이고 은색 장갑을 천천히 꼈다. 손가락 하나씩. 아주 천천히.<\/p>\n<p>그리고 고개를 들어 나를 봤다.<\/p>","chars":4939},{"title":"가짜 집행","html":"<p>[낙명제 4일째 · 마감까지 73시간]<\/p>\n<p>격리실은 하얀 방이었다.<\/p>\n<p>벽도, 바닥도, 천장도 하얬다. 모서리가 보이지 않아서 방이 어디서 끝나는지 알 수 없었다. 소리가 벽에 먹혔다. 내 숨소리마저 솜에 싸인 듯 멀게 들렸다.<\/p>\n<p>나는 바닥에 앉아 숫자를 셌다. 천까지 세면 한 시간이 조금 안 된다는 걸 편의점에서 배웠다.<\/p>\n<p>팔백하나에서 문이 열렸다.<\/p>\n<p>열린다기보다, 하얀 벽의 일부가 사라졌다. 그 틈으로 검은 코트가 들어왔다.<\/p>\n<p>윤제하.<\/p>\n<p>그는 문을 닫았다. 하얀 벽이 다시 메워졌다. 은색 장갑 낀 손이 옆구리에서 가볍게 주먹을 쥐었다 폈다.<\/p>\n<p>나는 일어서지 않았다. 다리에 힘이 없어서가 아니었다. 일어서면 도망치고 싶어질 것 같았다.<\/p>\n<p>\"벌써 시간 됐어?\"<\/p>\n<p>\"한 시간 남았어.\"<\/p>\n<p>\"그럼 왜 왔어. 미리 인사라도 하러?\"<\/p>\n<p>그가 내 앞에 한쪽 무릎을 꿇었다. 눈높이가 맞았다. 가까웠다. 코트에서 쇠와 먹이 섞인 냄새가 났다.<\/p>\n<p>\"시간 없어. 듣기만 해.\"<\/p>\n<hr class=\"scene\">\n<p>\"넌 지울 이름이 없어.\"<\/p>\n<p>그가 낮게 말했다. 벽이 소리를 먹어서, 그의 목소리만 또렷하게 남았다.<\/p>\n<p>\"내가 네 명패에 손을 대고 읽어도, 아무 일도 안 일어나. 읽을 게 없으니까.\"<\/p>\n<p>\"그럼 집행 실패잖아. 다들 보고 있을 텐데.\"<\/p>\n<p>\"그래서 연기하는 거야.\"<\/p>\n<p>나는 그를 봤다. 무표정한 얼굴이 진지했다.<\/p>\n<p>\"넌 원래 명경에 흐릿하게 잡혀. 내가 읽는 척하면, 넌 쓰러져. 숨 참고. 그다음은 내가 처리해. 명경에선 네가 사라진 것처럼 보일 거야. 원래도 잘 안 보이니까.\"<\/p>\n<p>\"……그게 돼?\"<\/p>\n<p>\"해 본 적은 없어.\"<\/p>\n<p>솔직해서 웃음이 나왔다. 그가 아주 조금 눈을 찡그렸다. 웃음을 처음 보는 사람처럼.<\/p>\n<p>\"왜 이렇게까지 해?\"<\/p>\n<p>대답이 없었다.<\/p>\n<p>\"나 너 안 믿어. 어제 쪽지 받았어. 지우개를 믿지 말래.\"<\/p>\n<p>그의 눈동자가 아주 미세하게 흔들렸다. 그가 물었다.<\/p>\n<p>\"누가?\"<\/p>\n<p>\"……몰라.\"<\/p>\n<p>엄마라고 말하지 않았다. 그 단어를 이 사람 앞에서 꺼내는 게 이상하게 무서웠다.<\/p>\n<p>제하는 한참 나를 봤다. 그리고 일어섰다.<\/p>\n<p>\"믿지 마. 그래도 숨은 참아.\"<\/p>\n<p>그가 벽 쪽으로 돌아섰다. 나는 그 등에 대고 말했다.<\/p>\n<p>\"만약에 실패하면?\"<\/p>\n<p>\"안 해.\"<\/p>\n<p>\"만약에.\"<\/p>\n<p>그가 멈췄다. 돌아보지 않은 채로 대답했다.<\/p>\n<p>\"그럼 내가 실패한 거지, 네가 아니라.\"<\/p>\n<p>그 대답이 이상하게 화가 났다. 나는 무릎을 끌어안았다.<\/p>\n<p>\"그런 말 하지 마. 나 원래 아무한테도 그런 말 들어본 적 없어. 갑자기 들으면 헷갈린단 말이야.\"<\/p>\n<p>그의 어깨가 아주 조금 굳었다. 그는 대답하지 않았다. 하얀 벽이 열리고, 닫혔다.<\/p>\n<p>나는 다시 숫자를 셌다. 팔백둘부터. 이번엔 숫자 사이사이에 그의 목소리가 끼어들었다. 그럼 내가 실패한 거지. 팔백삼. 네가 아니라. 팔백사.<\/p>\n<p>천까지 세는 동안 세 번 틀렸다.<\/p>\n<p>집행관 둘이 나를 데리러 왔을 때, 나는 마지막으로 빈 명패를 손바닥으로 덮었다. 차가운 금속 아래에서 내 심장이 뛰고 있었다. 이름은 없어도, 그건 분명히 뛰고 있었다.<\/p>\n<hr class=\"scene\">\n<p>자정.<\/p>\n<p>집행장은 지하 6층 대수조 위의 원형 단상이었다. 발밑 유리 바닥 아래로 검은 물이 소리 없이 일렁였다. 서늘한 습기가 발목을 감았다.<\/p>\n<p>단상 둘레에 명경 수십 개가 떠 있었다. 거울마다 귀족들의 그림자가 겹쳐 있었다. 웃음소리가 희미하게 새어 나왔다. 잔 부딪히는 소리.<\/p>\n<p>나는 단상 가운데 섰다. 빈 명패가 가슴에서 무겁게 느껴졌다.<\/p>\n<p>멀리 관람석 쪽에 도준과 은솔이 보였다. 참가자들이 의무적으로 끌려 나와 있었다. 도준은 노트를 가슴에 꽉 끌어안고 있었다. 은솔은 두 손으로 입을 막고 있었다.<\/p>\n<p>저 애들은 내일 아침이면 이 장면도 잊겠지. 다행이라고 생각했다. 진심으로.<\/p>\n<p>제하가 단상에 올랐다.<\/p>\n<p>명경들이 일제히 그를 비췄다. 귀족들의 웃음이 잦아들었다. 기대하는 침묵.<\/p>\n<p>그가 내 앞에 섰다. 장갑 낀 손을 들어, 내 가슴의 빈 명패에 얹었다.<\/p>\n<p>차가웠다. 금속 너머로, 그의 손바닥 무게가 느껴졌다.<\/p>\n<p>그리고 떨림이 느껴졌다.<\/p>\n<p>아주 작은 떨림이었다. 장갑과 명패와 내 갈비뼈를 거쳐서야 겨우 닿는 떨림. 명경에는 절대 잡히지 않을 정도의.<\/p>\n<p>그가 입을 열었다. 낮고 이상한 음절들이 흘러나왔다. 거꾸로 된 소리. 의미 없는 소리. 그는 아무것도 읽고 있지 않았다. 아무 이름도.<\/p>\n<p>나는 숨을 멈췄다.<\/p>\n<p>눈을 감고, 무릎을 꺾었다. 몸을 그의 손 쪽으로 무너뜨렸다. 그가 나를 받았다. 내 몸이 그의 코트에 반쯤 가려졌다.<\/p>\n<p>명경 속 귀족들이 환호했다.<\/p>\n<p>박수. 휘파람. 잔 부딪히는 소리. 누군가 \"깔끔하군\" 하고 말했다. 누군가 \"이름 없는 건 재도 안 남는구먼\" 하고 웃었다.<\/p>\n<p>관람석 어딘가에서 짧은 비명이 들렸다. 은솔이었다.<\/p>\n<p>나는 숨을 참은 채 그의 코트 안에서 그 모든 소리를 들었다. 나의 죽음을 축하하는 소리를.<\/p>\n<p>이상하게 슬프지 않았다. 그냥, 그의 심장 소리가 너무 빨랐다.<\/p>\n<p>제하는 나를 안은 채 단상 뒤편 그림자로 걸어갔다. 명경들이 그를 따라 고개를 돌렸다. 그는 코트 자락을 펼쳐 나를 완전히 덮었다. 거울에 비친 건 아마 검은 천과, 그 아래로 흩어지는 무언가였을 것이다. 그가 미리 손에 쥐고 있던 재 한 줌.<\/p>\n<p>\"끝났습니다.\"<\/p>\n<p>그가 명경을 향해 말했다. 평평한 목소리. 아무 감정도 없는 목소리.<\/p>\n<p>명경들이 하나씩 꺼졌다. 귀족들의 웃음소리가 멀어졌다. 마지막 거울이 꺼질 때까지, 그의 팔은 한 번도 느슨해지지 않았다.<\/p>\n<p>관람석에서 도준이 일어서는 소리가 들렸다. 의자가 넘어지는 소리. \"야, 야, 걔 어디 갔어? 방금 거기 있던 애, 걔 이름이…….\" 그가 말을 잇지 못했다. 노트를 펼치는 소리. 종이가 바르르 떨리는 소리.<\/p>\n<p>미안해, 도준아. 내일 노트에 써 줘. 나 안 죽었다고.<\/p>\n<hr class=\"scene\">\n<p>사람이 다 빠져나간 뒤에도 한참을 기다렸다.<\/p>\n<p>제하는 나를 대수조 아래 정비 통로로 데려갔다. 거대한 유리 수조 밑. 머리 위로 검은 물이 천장처럼 흔들렸다. 물에 걸러진 등불이 푸르게 일렁이며 벽에 물결무늬를 그렸다.<\/p>\n<p>둘뿐이었다.<\/p>\n<p>나는 벽에 등을 대고 주저앉았다. 그제야 참았던 숨이 한꺼번에 터졌다. 어깨가 들썩였다. 웃음인지 울음인지 모를 소리가 나왔다.<\/p>\n<p>\"나 죽었어.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"다들 박수 쳤어.\"<\/p>\n<p>\"……응.\"<\/p>\n<p>\"웃기다. 살아 있을 땐 아무도 안 봤는데, 죽으니까 박수 쳐 주네.\"<\/p>\n<p>제하가 내 옆에 앉았다. 어깨와 어깨 사이에 손가락 두 개 정도의 거리.<\/p>\n<p>나는 다시 물었다. 이번엔 진짜로 답을 듣고 싶었다.<\/p>\n<p>\"왜 이렇게까지 해?\"<\/p>\n<p>그는 대답 대신 오른손을 들었다. 왼손으로 은색 장갑의 손끝을 하나씩 당겼다. 천천히. 장갑이 벗겨졌다.<\/p>\n<p>처음 보는 맨손이었다.<\/p>\n<p>손등부터 손목까지, 흉터가 빼곡했다. 날카로운 것으로 긁어낸 듯한 가느다란 선들. 겹치고, 엇갈리고, 어떤 건 오래되어 하얗고, 어떤 건 아직 분홍빛이었다. 마치 누군가 그의 피부 위에 글씨를 쓰고, 그걸 다시 긁어 지운 것 같았다.<\/p>\n<p>나는 숨을 삼켰다.<\/p>\n<p>\"이름을 하나 지울 때마다.\"<\/p>\n<p>그가 자기 손을 내려다보며 말했다. 목소리가 평평했다. 너무 평평해서 오히려 무너질 것 같았다.<\/p>\n<p>\"뭔가 하나를 못 느끼게 돼. 처음엔 무서운 거. 그다음엔 슬픈 거. 그다음엔 화나는 거. 몇 년 전부터는 그냥, 아무것도.\"<\/p>\n<p>물이 머리 위에서 일렁였다. 푸른 빛이 그의 흉터 위를 지나갔다.<\/p>\n<p>\"근데 너랑 있으면.\"<\/p>\n<p>그가 손을 쥐었다 폈다. 흉터들이 당겨졌다.<\/p>\n<p>\"아파.\"<\/p>\n<p>나는 그의 손을 봤다. 그리고 내 손을 뻗었다. 손끝이 그의 손등의 흉터 하나에 닿았다. 그가 움찔했다. 피하지는 않았다.<\/p>\n<p>피부가 생각보다 뜨거웠다. 흉터의 결이 손끝에 오돌토돌 걸렸다.<\/p>\n<p>\"아픈 게, 나빠?\"<\/p>\n<p>\"모르겠어.\"<\/p>\n<p>그가 나를 봤다. 회색 눈 속에 처음으로 무언가가 고여 있었다. 그게 뭔지 그 자신도 모르는 것 같았다.<\/p>\n<p>\"오랜만이라서.\"<\/p>\n<p>거리가 좁혀졌다. 누가 먼저였는지 모르겠다. 그의 숨이 내 뺨에 닿았다. 따뜻하고, 조금 떨렸다. 물 냄새, 쇠 냄새, 그리고 그의 체온 냄새.<\/p>\n<p>입술 사이가 한 뼘. 반 뼘.<\/p>\n<p>지우개를 믿지 마라.<\/p>\n<p>쪽지의 글씨가 눈꺼풀 안쪽에서 번쩍였다. 나는 멈췄다. 그도 멈췄다. 우리는 그 거리에서 숨만 쉬었다. 서로의 숨을.<\/p>\n<p>그때 그의 코트 안쪽에서 무언가가 울렸다. 작은 명경 조각이 붉게 빛났다.<\/p>\n<p>제하의 얼굴에서 표정이 빠져나갔다. 순식간에. 마치 누가 스위치를 내린 것처럼.<\/p>\n<p>\"호출이야.\"<\/p>\n<p>그가 장갑을 다시 꼈다.<\/p>\n<p>\"여기 있어. 아무 데도 가지 마.\"<\/p>\n<p>그는 그렇게 말하고 사라졌다.<\/p>\n<p>물론 나는 따라갔다.<\/p>\n<hr class=\"scene\">\n<p>정비 통로를 빠져나오며 나는 계단을 몇 번이나 헛디뎠다. 다리가 아직 집행장의 떨림을 기억하고 있었다. 입술에는 닿지 않은 숨의 온도가 남아 있었다. 그게 부끄러워서 소매로 입을 문질렀다. 소용없었다.<\/p>\n<p>원장실은 지하 2층 꼭대기, 등이 가장 가까이 보이는 곳에 있었다.<\/p>\n<p>나는 복도 끝 기둥 뒤에 숨었다. 집행관 두 명이 문 앞을 지키고 있었지만, 그들의 시선은 나를 몇 번이나 그냥 지나쳤다. 죽은 사람은 더 안 보이는 모양이었다.<\/p>\n<p>문이 반쯤 열려 있었다. 따뜻한 등불과 차 향기가 새어 나왔다. 국화차. 달큰하고 쌉쌀한 냄새.<\/p>\n<p>\"앉으렴.\"<\/p>\n<p>원장의 목소리였다. 부드러웠다. 개막식 때와 똑같이.<\/p>\n<p>찻잔에 차 따르는 소리가 졸졸 들렸다.<\/p>\n<p>\"잘했다, 제하야.\"<\/p>\n<p>정적.<\/p>\n<p>\"연기 말이다.\"<\/p>\n<p>나는 기둥을 붙잡은 손에 힘이 들어갔다. 손톱이 나무에 박혔다.<\/p>\n<p>\"나도 속을 뻔했지. 손이 떨리는 것만 빼면 완벽했다. 명경엔 안 잡혔으니 걱정 말거라. 나만 봤으니까.\"<\/p>\n<p>찻잔이 받침에 놓이는 소리. 딸깍.<\/p>\n<p>\"이름 없는 아이는 지워지지 않는다. 그건 네가 나보다 잘 알 테지. 그러니 나는 네가 무엇을 할지 궁금했단다. 그 아이를 숨길지, 나에게 데려올지.\"<\/p>\n<p>원장이 웃었다. 작고 다정한 웃음.<\/p>\n<p>\"숨기더구나.\"<\/p>\n<p>제하는 아무 말도 하지 않았다. 숨소리조차 들리지 않았다.<\/p>\n<p>\"괜찮다. 화나지 않았다. 너도 그 손으로 처음 무언가를 느꼈을 테니, 이해한다.\"<\/p>\n<p>의자가 끌리는 소리. 원장이 일어서는 것 같았다.<\/p>\n<p>\"그러니 기회를 주마.\"<\/p>\n<p>목소리가 가까워졌다. 문 쪽으로.<\/p>\n<p>\"내일 밤까지 그 아이를 데려와라.\"<\/p>\n<p>다정한 목소리가 한 치도 변하지 않았다.<\/p>\n<p>\"그러지 않으면, 네 이름의 나머지 절반을 지우마.\"<\/p>","chars":4740},{"title":"열쇠","html":"<p>[낙명제 5일째 · 마감까지 66시간]<\/p>\n<p>나는 죽은 사람이 되었다.<\/p>\n<p>아침 등이 떠오르자 명부원 곳곳의 게시 명경에 어젯밤 집행 기록이 올라왔다. 흰 글씨로, 짧게.<\/p>\n<p>49번. 말소 완료.<\/p>\n<p>복도를 지나는 참가자들이 그 글씨를 힐끗 보고 지나갔다. 아무도 멈추지 않았다. 누군가는 하품을 했다.<\/p>\n<p>나는 그 게시판 바로 앞에 서 있었다. 내 말소 공지를 읽으면서. 내 옆으로 사람들이 어깨를 스치며 지나갔다. 아무도 나를 보지 않았다.<\/p>\n<p>원래도 그랬다. 그런데 이제는 그게 무기였다.<\/p>\n<p>죽은 사람을 찾는 사람은 없다.<\/p>\n<hr class=\"scene\">\n<p>도준은 보일러실에 있었다.<\/p>\n<p>노트를 펼쳐 놓고, 마지막 페이지를 손가락으로 짚은 채 굳어 있었다. 어젯밤 그가 쓴 글씨는 엉망이었다. 꾹꾹 눌러써서 종이가 군데군데 찢어져 있었다.<\/p>\n<p>하루 집행됨. 49번. 지우개가 했음. 나 아무것도 못 했음.<\/p>\n<p>그 아래, 다른 펜으로, 더 흔들리는 글씨.<\/p>\n<p>근데 하루가 누구였는지 벌써 잘 기억이 안 남. 그래서 이거 쓰는 중. 잊지 마. 잊지 마. 잊지 마.<\/p>\n<p>나는 문가에서 그걸 봤다. 목 안쪽이 꽉 막혔다.<\/p>\n<p>\"도준.\"<\/p>\n<p>그가 고개를 들었다. 부적을 반사적으로 꺼냈다. 그리고 나를 봤다. 그의 시선이 손목으로 내려갔다. 강하루 = 내 친구. 믿어도 됨. 질문 금지. 다시 노트로. 하루 집행됨.<\/p>\n<p>그의 얼굴이 하얗게 질렸다.<\/p>\n<p>\"……나 지금 죽은 사람이랑 얘기하는 거야?\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"질문 금지라고 써 있긴 한데, 이건 좀 물어봐도 되지 않냐?\"<\/p>\n<p>나는 웃어 버렸다. 웃다가 눈가가 뜨거워져서 고개를 돌렸다.<\/p>\n<p>\"안 죽었어. 연기였어. 노트에 써.\"<\/p>\n<p>도준은 한참 나를 보다가, 볼펜을 집어 들었다. 손이 떨렸다. 그는 어젯밤 글씨 아래에 크게 적었다.<\/p>\n<p>안 죽었음!!!! 연기였음. 본인 확인함.<\/p>\n<p>그리고 노트를 덮고, 갑자기 나를 끌어안았다. 뼈가 아플 만큼 세게. 그의 몸에서 녹과 땀과 하수 냄새가 났다.<\/p>\n<p>\"모르는 사람인데 왜 이렇게 다행이냐, 씨.\"<\/p>\n<hr class=\"scene\">\n<p>나는 도준에게 어젯밤 원장실 앞에서 들은 걸 말했다.<\/p>\n<p>그 아이를 데려와라. 그러지 않으면 네 이름의 나머지 절반을 지우마.<\/p>\n<p>도준이 입을 막았다.<\/p>\n<p>\"원장이 너를 왜 원해? 너 그냥, 이름 없는 애잖아.\"<\/p>\n<p>\"그러니까 알아야겠어.\"<\/p>\n<p>금서고 기록부의 붉은 도장이 떠올랐다. 딸, 행방 수색 중. 수색 담당, 원장 직속.<\/p>\n<p>\"원장실에 들어갈 거야.\"<\/p>\n<p>\"미쳤어?\"<\/p>\n<p>\"난 죽은 사람이야. 아무도 안 찾아.\"<\/p>\n<p>\"그건 너고! 난 살아 있는 사람이라고!\"<\/p>\n<p>\"너는 문만 따 줘.\"<\/p>\n<p>도준은 볼펜 꽁무니를 씹으며 한참 끙끙대다가, 노트에 한 줄 적었다. 하루랑 원장실 털러 감. 이유: 친구라서. 이건 내 결정임. 나중에 원망하지 말 것, 나야.<\/p>\n<hr class=\"scene\">\n<p>지하 2층으로 올라가는 중앙 계단에서 세아와 마주쳤다.<\/p>\n<p>정확히는, 세아가 나를 스쳐 지나갔다. 해원과 지강을 양옆에 두고, 어깨가 닿을 만큼 가까이. 그녀의 코트 자락이 내 손등을 쓸었다. 비싼 먹 냄새.<\/p>\n<p>도준이 숨을 멈췄다. 나는 걸음을 멈추지 않았다.<\/p>\n<p>세아는 몇 계단 위에서 멈췄다. 고개를 반쯤 돌렸다. 미간이 좁혀졌다.<\/p>\n<p>\"해원.\"<\/p>\n<p>\"네.\"<\/p>\n<p>\"어젯밤에 집행된 애. 49번. 진짜 사라진 거 맞아?\"<\/p>\n<p>\"명경 공지 떴잖아요.\"<\/p>\n<p>\"……그렇지.\"<\/p>\n<p>세아는 한참 계단 아래를 내려다봤다. 바로 그 계단 위에 내가 서 있었다. 그녀의 시선이 내 얼굴을 지나가고, 다시 돌아오려다, 길을 잃었다.<\/p>\n<p>\"이상해. 그 애 얼굴이 기억이 안 나는데, 기억이 안 난다는 게 자꾸 걸려.\"<\/p>\n<p>그녀는 혀를 차고 다시 계단을 올라갔다.<\/p>\n<p>도준이 내 귀에 속삭였다. 목소리가 갈라져 있었다.<\/p>\n<p>\"……저거 우리 아빠 때 나랑 똑같은 말이다.\"<\/p>\n<p>나는 대답하지 않았다. 세아의 등이 계단 위로 사라질 때까지 보고 있었다. 그때는 몰랐다. 그 애가 왜 나를 놓치는 게 그렇게 신경 쓰이는지. 같은 피가 흐르는 사람을 놓치는 감각이 어떤 건지.<\/p>\n<p>원장은 매일 아침 칠명회 회의에 나간다. 은솔이 지나가듯 알려 준 정보였다. 그녀는 그게 무슨 의미인지도 모르고 말했다.<\/p>\n<p>지하 2층 꼭대기. 어젯밤 숨었던 그 기둥 옆을 지나 원장실 문 앞에 섰다. 문 앞 집행관 둘은 교대 중이었다. 정확히 사 분의 공백. 도준이 문고리 아래에 무릎을 꿇었다.<\/p>\n<p>철사가 자물쇠 안을 긁는 소리. 사각, 사각. 도준의 이마에서 땀이 떨어졌다. 그의 숨소리가 점점 빨라졌다.<\/p>\n<p>\"빨리.\"<\/p>\n<p>\"알아, 알아, 이거 칠명가 자물쇠라 핀이 일곱 개…….\"<\/p>\n<p>딸깍.<\/p>\n<p>문이 열렸다. 국화차 향이 아직 방 안에 남아 있었다. 어젯밤 그 냄새였다. 속이 메슥거렸다.<\/p>\n<p>원장실은 넓고 조용했다. 벽 한 면을 채운 서가, 등이 내려다보이는 둥근 창, 그리고 육중한 흑단 책상. 책상 위에는 찻잔 두 개가 그대로 놓여 있었다. 하나는 비었고, 하나는 가득 찬 채 식어 있었다.<\/p>\n<p>제하는 차를 마시지 않았던 것이다.<\/p>\n<p>그 사실 하나에 가슴이 쓸데없이 조여들었다. 마시지 않았다. 따라 준 차를, 그 다정한 목소리 앞에서, 끝까지 손대지 않았다. 그게 무슨 뜻인지 생각하지 않으려 했다. 생각하면 그를 믿고 싶어질 것 같았다.<\/p>\n<p>\"하루, 시간.\"<\/p>\n<p>도준이 문틈을 흘끔거렸다. 삼 분 남았다.<\/p>\n<p>\"서랍.\"<\/p>\n<p>도준이 책상 서랍의 자물쇠에 철사를 꽂았다. 이번엔 빨랐다. 첫 번째 서랍에는 칠명회 회의록. 두 번째에는 낙명제 참가자 명단. 세 번째 서랍은 비어 있었다.<\/p>\n<p>비어 있는 서랍치고는 바닥이 너무 높았다.<\/p>\n<p>나는 손톱으로 서랍 바닥 모서리를 긁었다. 얇은 판이 들렸다. 그 아래에 오래된 서류철 세 개가 있었다.<\/p>\n<hr class=\"scene\">\n<p>첫 번째 서류철.<\/p>\n<p>누렇게 바랜 종이. 칠명회 인장. 그리고 칸마다 단정한 붓글씨.<\/p>\n<p>집행 기록.<br>대상: 남궁연.<br>사유: 최초의 명부 훼손. 자녀의 진명 무단 삭제.<br>집행자: 윤제하 (8세). 첫 집행.<br>입회: 남궁현.<\/p>\n<p>나는 그 줄을 세 번 읽었다.<\/p>\n<p>윤제하. 여덟 살. 첫 집행.<\/p>\n<p>글자들이 종이 위에서 미끄러졌다. 초점이 맞지 않았다. 내가 다른 사람들 눈에 보이는 방식이 이런 걸까. 보이는데, 잡히지 않는.<\/p>\n<p>\"하루?\"<\/p>\n<p>도준의 목소리가 멀었다.<\/p>\n<p>나는 두 번째 서류철을 열었다. 손이 내 손 같지 않았다.<\/p>\n<p>가계도였다.<\/p>\n<p>남궁가. 맨 위에 오래된 이름들이 뻗어 내려와, 아래쪽에 두 개의 가지로 갈라졌다.<\/p>\n<p>남궁현. 그 아래, 딸. 남궁세아.<\/p>\n<p>남궁연. 그 아래, 딸. 이름 칸이 비어 있었다. 먹으로 그었다가 긁어낸 자국만 남은 공란.<\/p>\n<p>공란 옆에 누군가 작은 글씨로 덧붙여 놓았다. 행방 확인. 신설동. 가명 사용 중.<\/p>\n<p>원장은 내 외삼촌이었다. 세아는 내 사촌이었다.<\/p>\n<p>그리고 그는 처음부터 내가 어디 있는지 알고 있었다.<\/p>\n<p>세 번째 서류철은 얇았다. 종이 한 장. 오래된 문서를 베껴 쓴 것이었다.<\/p>\n<p>최초의 명부 개봉 조건.<br>명부는 이름으로 열리지 않는다.<br>이름 없는 페이지, 즉 무명자(無名者)만이 그 표지를 넘길 수 있다.<\/p>\n<p>그 아래, 붉은 먹으로 원장의 글씨.<\/p>\n<p>열쇠 확보. 낙명제 중 회수 예정.<\/p>\n<hr class=\"scene\">\n<p>나는 바닥에 주저앉았다.<\/p>\n<p>카펫이 두꺼웠다. 손바닥 밑에서 털이 눌렸다. 그 감촉에 집중했다. 다른 것에 집중하면 무너질 것 같았다.<\/p>\n<p>하나.<\/p>\n<p>엄마를 지운 사람.<\/p>\n<p>둘.<\/p>\n<p>그 손으로, 추락하는 나를 붙잡은 사람.<\/p>\n<p>셋.<\/p>\n<p>어젯밤, 반 뼘 거리에서 숨을 나눈 사람.<\/p>\n<p>넷.<\/p>\n<p>장갑을 벗고 흉터를 보여 준 사람. 이름을 지울 때마다 무언가를 잃었다던 사람. 첫 번째로 잃은 게 무서움이었다고 했다. 여덟 살에.<\/p>\n<p>다섯.<\/p>\n<p>여덟 살짜리가 무엇을 지웠는지, 이제 알았다.<\/p>\n<p>여섯.<\/p>\n<p>숫자가 자꾸 끊겼다. 머릿속에서 기록부의 글씨가 숫자를 덮었다. 집행자: 윤제하. 입회: 남궁현.<\/p>\n<p>입회.<\/p>\n<p>옆에 서서 보고 있었다는 뜻이다. 여덟 살짜리 손이 자기 여동생을 지우는 걸.<\/p>\n<p>일곱.<\/p>\n<p>나는 무릎을 끌어안았다. 이가 딱딱 부딪쳤다. 춥지 않은데 추웠다. 배 속 깊은 곳에서 무언가가 뒤집혀 목까지 올라왔다. 삼켰다. 또 올라왔다.<\/p>\n<p>도준이 내 옆에 앉았다.<\/p>\n<p>그는 아무 말도 하지 않았다. 농담도 하지 않았다. 노트도 펼치지 않았다. 그냥 앉아 있었다. 어깨가 내 어깨에 닿을 만큼 가까이.<\/p>\n<p>그 침묵이 고마웠다. 이 애는 내일이면 이 순간을 잊을 것이다. 그래서 더 고마웠다. 기억하지도 못할 위로를, 지금 주고 있었으니까.<\/p>\n<p>여덟.<\/p>\n<p>\"……나, 열쇠래.\"<\/p>\n<p>목소리가 갈라져서 나왔다.<\/p>\n<p>도준은 서류를 흘끗 보고, 다시 나를 봤다.<\/p>\n<p>\"응. 봤어.\"<\/p>\n<p>\"사람인데. 열쇠래.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"웃기지. 아무도 날 기억 못 하는데, 다들 날 찾고 있었대. 열여덟 년 동안.\"<\/p>\n<p>도준이 내 손을 잡았다. 그의 손은 땀에 젖어 있었고, 철사에 긁혀 피가 맺혀 있었다.<\/p>\n<p>\"나는.\"<\/p>\n<p>그가 말을 고르다가, 포기하고, 그냥 말했다.<\/p>\n<p>\"열쇠 말고 너 찾을게. 내일 아침에. 노트 보고.\"<\/p>\n<p>나는 그의 어깨에 이마를 묻었다. 아홉. 열. 숫자가 다시 이어지기 시작했다.<\/p>\n<hr class=\"scene\">\n<p>전 층에 종이 울렸다.<\/p>\n<p>공시 종이 아니었다. 더 높고, 더 길고, 귀를 찢는 소리. 비상종. 원장실 창이 진동으로 떨었다. 찻잔이 받침 위에서 달각거렸다.<\/p>\n<p>벽의 명경이 저절로 빛났다.<\/p>\n<p>원장의 얼굴이 떠올랐다. 온화한 미소. 칠명회 회의실을 배경으로, 그의 뒤에 검은 옷의 노인 여섯이 앉아 있었다.<\/p>\n<p>\"참가자 여러분께 알립니다.\"<\/p>\n<p>다정한 목소리가 방 안을 채웠다.<\/p>\n<p>\"칠명회의 결정으로, 금번 낙명제의 마감을 하루 앞당깁니다.\"<\/p>\n<p>도준의 손이 내 손 안에서 굳었다.<\/p>\n<p>\"새 마감은 6일째 자정입니다. 마감 시각에 명패를 지니지 못한 자는, 예정대로 말소됩니다.\"<\/p>\n<p>명경 귀퉁이의 숫자가 바뀌었다.<\/p>\n<p>66시간.<\/p>\n<p>깜박.<\/p>\n<p>42시간.<\/p>\n<p>스물네 시간이 그냥, 사라졌다. 숫자 하나가 바뀌는 것만으로.<\/p>\n<p>원장이 명경 너머에서 미소 지었다. 시선이 화면 밖을 향했다. 정확히 이 방을 보는 것 같았다. 아니, 그럴 리 없다. 그는 지금 회의실에 있다.<\/p>\n<p>\"모두에게 행운을.\"<\/p>\n<p>명경이 꺼졌다.<\/p>\n<p>방 안이 고요해졌다. 내 심장 소리만 들렸다. 쿵. 쿵. 마흔두 시간짜리 심장 소리.<\/p>\n<p>\"……나가자.\"<\/p>\n<p>도준이 일어섰다. 서류를 품에 쑤셔 넣었다.<\/p>\n<p>\"빨리, 교대 끝나기 전에…….\"<\/p>\n<p>문 쪽으로 돌아서던 그가 멈췄다.<\/p>\n<p>나도 봤다.<\/p>\n<p>원장실 문이 열려 있었다. 언제부터인지 모르게, 소리도 없이.<\/p>\n<p>문가에 누군가 서 있었다. 검은 코트. 오른손의 은색 장갑. 서랍을 뒤진 흔적과, 바닥에 흩어진 집행 기록과, 그 기록 옆에 주저앉은 나를 내려다보고 있었다.<\/p>\n<p>윤제하였다.<\/p>","chars":4775},{"title":"지우개의 고백","html":"<p>[낙명제 5일째 · 마감까지 39시간]<\/p>\n<p>나는 기록부를 그의 가슴에 던졌다.<\/p>\n<p>종이 묶음이 은색 장갑에 부딪혀 바닥으로 흩어졌다. 낡은 종이 냄새와 원장실의 백단향이 한꺼번에 코를 찔렀다.<\/p>\n<p>\"여덟 살.\"<\/p>\n<p>목소리가 내 것 같지 않았다. 갈라지고, 낮고, 떨렸다.<\/p>\n<p>\"첫 집행. 남궁연.\"<\/p>\n<p>제하는 피하지 않았다. 흩어진 종이 한 장이 그의 구두 끝에 걸렸다. 그는 그걸 내려다보지도 않았다. 나만 봤다. 늘 그랬듯이.<\/p>\n<p>그게 지금은 견딜 수 없었다.<\/p>\n<p>\"말해 봐. 아니라고.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"아니라고 하라고!\"<\/p>\n<p>복도 끝에서 쇳소리가 났다. 은색 장갑이 벽을 긁으며 다가오는 소리. 집행관들이었다. 서랍을 뒤진 흔적, 꺼진 결계. 들키는 건 시간문제였다.<\/p>\n<p>제하가 내 손목을 잡았다.<\/p>\n<p>\"나중에 해. 지금은 뛰어.\"<\/p>\n<p>\"놔.\"<\/p>\n<p>\"하루야.\"<\/p>\n<p>그가 내 이름을 불렀다. 이 세상에서 내 이름을 다음 날까지 기억하는 유일한 입으로. 나는 그 입이 엄마의 이름을 거꾸로 읽었다는 걸 알게 된 지 십 분도 안 됐다.<\/p>\n<p>그래도 나는 뛰었다. 살아야 했으니까.<\/p>\n<hr class=\"scene\">\n<p>원장실 뒤편 비상 계단은 좁고 축축했다. 벽마다 이끼가 끼어 있었고, 계단참마다 꺼져 가는 등잔이 녹색으로 깜박였다.<\/p>\n<p>뒤에서 발소리가 셋. 아니, 넷.<\/p>\n<p>\"왼쪽.\"<\/p>\n<p>제하가 낮게 말했다. 나는 왼쪽으로 꺾었다. 그가 뒤에 남아 장갑 낀 손으로 벽을 쓸었다. 계단 위에 무언가가 '지워졌다'. 방금까지 있던 계단참 하나가 통째로 사라지고, 쫓아오던 집행관의 욕설이 허공에서 끊겼다.<\/p>\n<p>\"계단을 지워?\"<\/p>\n<p>\"계단 이름을 지웠어. 잠깐이야. 오 분이면 돌아와.\"<\/p>\n<p>\"그런 것도 돼?\"<\/p>\n<p>\"이름 있는 건 다 돼.\"<\/p>\n<p>그 말에 다리가 풀릴 뻔했다. 이름 있는 건 다. 사람도. 엄마도.<\/p>\n<p>우리는 지하 4층과 5층 사이, 보일러 배관이 지나가는 좁은 틈에 몸을 밀어 넣었다. 쇠 냄새와 뜨거운 증기. 숨을 쉴 때마다 목이 따가웠다. 그와 나 사이의 거리는 한 뼘도 안 됐다.<\/p>\n<p>나는 그 한 뼘이 지옥 같았다.<\/p>\n<p>\"말해.\"<\/p>\n<p>이번엔 소리치지 않았다. 그래서 더 무서웠는지, 제하가 처음으로 눈을 피했다.<\/p>\n<p>\"……여덟 살이었어.\"<\/p>\n<p>\"그건 읽었어.\"<\/p>\n<p>\"원장님이 내 손 위에 손을 겹쳤어. 장갑도 없이. 내 손가락으로 명패를 짚게 하고, 귀에 대고 이름을 읽어 줬어. 거꾸로. 나는 따라 했어.\"<\/p>\n<p>증기가 쉭, 하고 새어 나왔다. 그가 말을 멈췄다가 다시 이었다.<\/p>\n<p>\"그 여자는 울지 않았어. 웃었어.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"마지막에 나한테 그랬어. 괜찮아, 넌 나중에 그 애를 알아볼 거야.\"<\/p>\n<p>나는 숨을 삼켰다.<\/p>\n<p>\"그게 무슨 뜻인지 17년 동안 몰랐어.\"<\/p>\n<p>그가 나를 봤다. 녹색 등잔 빛에 그의 회색 눈동자가 물에 잠긴 돌처럼 보였다.<\/p>\n<p>\"편의점에서 너를 보기 전까지.\"<\/p>\n<hr class=\"scene\">\n<p>웃기는 일이었다.<\/p>\n<p>나는 평생, 단 한 사람이라도 나를 기억해 주길 바랐다. 그런데 그 한 사람이 엄마를 지운 손으로 나를 기억하고 있었다. 엄마가 지워지는 순간에 남긴 말 덕분에.<\/p>\n<p>엄마는 알았던 거다. 이 아이가 나중에 내 딸을 알아볼 거라고. 자기를 지우는 아이에게, 딸을 맡겼다.<\/p>\n<p>그게 너무 엄마 같아서, 본 적도 없는 엄마 같아서, 나는 토할 것 같았다.<\/p>\n<p>\"가.\"<\/p>\n<p>\"하루야.\"<\/p>\n<p>\"가라고. 날 데려가서 네 이름 지키든지, 말든지.\"<\/p>\n<p>나는 그의 가슴을 밀었다. 장갑 낀 손이 잠깐 내 어깨 쪽으로 올라왔다가, 허공에서 멈췄다. 그는 나를 붙잡지 않았다.<\/p>\n<p>그래서 더 화가 났다.<\/p>\n<p>나는 배관 틈에서 빠져나와 반대쪽 통로로 걸었다. 뛰지 않았다. 뒤돌아보지도 않았다. 다섯 걸음, 여섯 걸음. 편의점에서 재고를 세던 버릇대로 걸음을 셌다. 열한 걸음째, 뒤에서 그의 목소리가 들렸다.<\/p>\n<p>\"네 시간 뒤에 그쪽 통로에 순찰 돌아. 3층 창고로 가.\"<\/p>\n<p>나는 대답하지 않았다.<\/p>\n<p>그리고 3층 창고로 갔다.<\/p>\n<hr class=\"scene\">\n<p>3층으로 올라가는 길은 길었다.<\/p>\n<p>복도마다 명경이 걸려 있었다. 평소엔 그냥 거울처럼 보이던 것들이, 오늘은 일제히 같은 숫자를 띄우고 있었다. 붉은 숫자. 39:12:07. 39:12:06. 1초씩 깎여 나가는 소리가 들리지 않는데도, 귀 안쪽에서 똑딱거렸다.<\/p>\n<p>어제까지는 63시간이었다. 칠명회는 회의 한 번으로 내 인생에서 하루를 지웠다.<\/p>\n<p>복도 모퉁이에서 참가자 둘이 싸우고 있었다. 하나가 다른 하나의 명패를 움켜쥐고 있었고, 쥐인 쪽은 울면서 빌었다. \"하루 당겨졌잖아, 하루! 나 이거 없으면 내일 밤에 죽어!\" 명패를 쥔 쪽의 손이 떨렸다. 그는 이름을 부르지 못하고 있었다.<\/p>\n<p>나는 그 옆을 지나갔다. 아무도 나를 보지 않았다. 나는 이제 명경 기록상 죽은 사람이었다.<\/p>\n<p>어제는 그게 무기였다. 오늘은 그냥 춥기만 했다.<\/p>\n<p>계단 난간을 잡은 손바닥에 녹이 묻었다. 비릿한 쇠 냄새가 손금 사이로 스몄다. 나는 그 냄새가 제하의 장갑 냄새와 같다는 걸 깨닫고, 손을 바지에 세게 문질렀다. 지워지지 않았다.<\/p>\n<hr class=\"scene\">\n<p>창고는 곰팡이와 오래된 밀가루 냄새가 났다. 부서진 책상, 쌓인 의자, 천장에서 떨어지는 물방울이 양동이에 톡, 톡, 박자를 맞췄다.<\/p>\n<p>도준은 거기 있었다. 내가 남긴 쪽지대로.<\/p>\n<p>그런데 표정이 이상했다.<\/p>\n<p>\"야, 너, 너 혹시…… 내 노트 봤어?\"<\/p>\n<p>\"뭐?\"<\/p>\n<p>\"하루 노트. 수첩. 가방 앞주머니에 넣어 놨는데 없어.\"<\/p>\n<p>도준이 가방을 뒤집었다. 부적 뭉치, 녹슨 드라이버, 반쯤 먹은 건빵. 노트는 없었다.<\/p>\n<p>\"원장실 갈 때 가지고 갔어?\"<\/p>\n<p>\"아니, 여기 두고 갔어. 확실해. 분명히…….\"<\/p>\n<p>그의 손이 떨렸다. 나도 손이 떨렸다. 이유는 같았다.<\/p>\n<p>오늘 밤 노트를 쓰지 못하면, 내일 아침 도준은 나를 모른다. 손목의 볼펜 글씨 한 줄만 남는다. <em>강하루 = 내 친구. 믿어도 됨. 질문 금지.<\/em> 그 한 줄로는 오늘을 설명할 수 없었다. 원장실도, 기록부도, 엄마도, 제하도.<\/p>\n<p>\"누가 가져간 거야.\"<\/p>\n<p>\"누가? 왜? 내 노트를 왜 훔쳐? 거기 별거 없어. 너 좋아하는 컵라면 맛, 너 긴장하면 숫자 세는 거, 이런 거밖에…….\"<\/p>\n<p>도준이 입을 다물었다. 그도 알았다. 그 '별거 없는 것'이 나를 기억하는 유일한 방법이었다는 걸.<\/p>\n<p>\"……미안.\"<\/p>\n<p>\"네가 왜 미안해.\"<\/p>\n<p>\"내가 잃어버렸잖아.\"<\/p>\n<p>나는 웃으려고 했다. 잘 안 됐다. 피곤했다. 다리가 후들거렸고, 눈 안쪽이 모래를 문지른 것처럼 따가웠다. 오늘만 해도 엄마의 기록을 봤고, 엄마를 지운 사람을 봤고, 마감이 하루 당겨지는 걸 들었다.<\/p>\n<p>그리고 이제, 내일 아침이면 친구가 나를 처음 보는 사람이 된다.<\/p>\n<p>언제나처럼. 하루만 기억되는 아이.<\/p>\n<hr class=\"scene\">\n<p>나는 바닥에 앉았다. 도준도 맞은편에 앉았다. 물방울이 양동이에 떨어졌다. 톡. 톡.<\/p>\n<p>\"도준아.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"처음부터 다시 말해 줄게.\"<\/p>\n<p>\"……어?\"<\/p>\n<p>\"오늘 있었던 거. 전부. 네가 노트에 못 쓰니까, 대신 내가 말해 줄게. 내일 아침에도 해 줄게. 너 손목 글씨 보고 '질문 금지'인데 질문하고 싶어서 죽겠는 얼굴 할 때, 그때 처음부터 다 말해 줄게.\"<\/p>\n<p>도준이 입을 벌렸다가, 닫았다.<\/p>\n<p>평생 나는 기억되길 기다렸다. 누가 나를 붙잡아 주길, 내 이름을 다음 날에도 불러 주길. 기다리고, 실망하고, 다시는 기대하지 않겠다고 다짐하고.<\/p>\n<p>그런데 지금 처음으로, 기다리지 않기로 했다.<\/p>\n<p>기억되는 게 아니라, 기억시키기로.<\/p>\n<p>\"좋아. 첫째, 우리는 원장실에 갔어. 네가 자물쇠 땄어. 세 번 실패했고, 네 번째에 성공하면서 '역시 나야'라고 했어.\"<\/p>\n<p>\"내가 그랬어?\"<\/p>\n<p>\"그랬어. 진짜 재수 없었어.\"<\/p>\n<p>도준이 웃었다. 코끝이 빨개진 채로.<\/p>\n<p>나는 계속 말했다. 서랍, 가계도, '이름 없는 페이지'. 엄마의 이름에서 목이 잠겼고, 제하의 이름에서 한 번 멈췄다. 도준은 끼어들지 않았다. 대신 볼펜을 꺼내 자기 팔 안쪽에 작은 글씨로 단어들을 받아 적었다. 원장 = 삼촌. 세아 = 사촌. 제하 = ???<\/p>\n<p>물음표 세 개를 보고, 나는 처음으로 진짜 웃었다.<\/p>\n<p>\"그 물음표는 뭐야.\"<\/p>\n<p>\"몰라. 너 그 사람 얘기할 때 표정이 세 가지였어. 화남, 슬픔, 그리고…… 뭔지 모르겠는 거. 그래서 세 개.\"<\/p>\n<p>\"관찰력 좋네.\"<\/p>\n<p>\"원래 좋아. 아침마다 처음 보는 애 믿어야 되는 인생이라.\" 도준이 볼펜 뚜껑을 씹었다. \"근데 하나만 물어봐도 돼? 질문 금지인 건 아는데.\"<\/p>\n<p>\"해.\"<\/p>\n<p>\"그 사람이 너 기억하는 거, 좋아?\"<\/p>\n<p>나는 대답하지 못했다.<\/p>\n<p>좋았다. 그게 문제였다. 엄마를 지운 손이 나를 붙잡아서, 내가 처음으로 이 세상에 붙어 있는 느낌이 들었다는 게. 그 느낌이 좋았다는 게.<\/p>\n<p>\"……모르겠어.\"<\/p>\n<p>\"그럼 물음표 그대로 둘게.\"<\/p>\n<p>도준은 그렇게 말하고, 내일 아침의 자신이 읽을 수 있도록 팔 안쪽 글씨 옆에 작게 덧붙였다. <em>하루한테 이거 다시 묻지 말 것.<\/em><\/p>\n<p>나는 무릎을 끌어안고 그 글씨를 오래 봤다. 내일 아침 그는 이 글씨를 읽고, 이유도 모른 채 그 질문을 참을 것이다. 나를 모르면서도 나를 배려할 것이다.<\/p>\n<p>기억이 없어도 남는 것이 있었다. 그게 뭔지는 아직 몰랐다.<\/p>\n<hr class=\"scene\">\n<p>똑똑.<\/p>\n<p>창고 문을 두드리는 소리가 났다.<\/p>\n<p>우리는 동시에 굳었다. 도준이 부적을 꺼냈다. 나는 양동이 옆의 쇠파이프를 쥐었다. 손바닥이 금방 땀으로 미끄러웠다.<\/p>\n<p>똑똑. 똑.<\/p>\n<p>규칙적이지 않았다. 힘이 빠진 손으로 두드리는 소리.<\/p>\n<p>\"……누구야.\"<\/p>\n<p>대답 대신, 문이 스르륵 열렸다.<\/p>\n<p>남궁세아가 서 있었다.<\/p>\n<p>혼자였다. 늘 그녀를 둘러싸던 측근들은 없었다. 칠명가의 흑색 제복은 어깨에서 찢어져 있었고, 관자놀이에서 흐른 피가 턱까지 말라붙어 있었다. 쇠 냄새가 확 끼쳤다.<\/p>\n<p>도준의 부적이 지직거렸다. 사흘 전, 그의 명패를 뜯어 이름을 부르려던 그 손이 문틀을 짚고 있었다.<\/p>\n<p>\"거기서 멈춰.\"<\/p>\n<p>\"멈출게.\"<\/p>\n<p>세아가 정말로 멈췄다. 오만하게 턱을 들지도, 비웃지도 않았다. 그게 더 무서웠다.<\/p>\n<p>\"아버지 서재에 갔었어. 너희가 뒤집어 놓은 거 정리하라고 불려서.\"<\/p>\n<p>그녀가 웃었다. 피 묻은 입술로.<\/p>\n<p>\"의식 명단이 있더라. 최종일에 수확할 이름들. 참가자 전원. 맨 위에.\"<\/p>\n<p>세아가 숨을 들이쉬었다.<\/p>\n<p>\"남궁세아.\"<\/p>\n<p>창고 안이 조용해졌다. 물방울 소리마저 멎은 것 같았다.<\/p>\n<p>\"우리 아버지가, 의식 날 나도 수확할 거래.\"<\/p>\n<p>그녀가 문틀에서 손을 떼고, 피 묻은 손을 내 쪽으로 내밀었다.<\/p>\n<p>\"재동맹하자, 사촌.\"<\/p>","chars":4723},{"title":"의심의 핑퐁","html":"<p>[낙명제 5일째 · 마감까지 27시간]<\/p>\n<p>다섯 명이 창고 바닥에 둘러앉았다.<\/p>\n<p>나, 도준, 세아, 은솔. 그리고 세아가 어딘가에서 데려온 측근 하나 — 해원. 마른 체격에 안경을 쓴 소년이었다. 말이 없었고, 손톱을 물어뜯는 버릇이 있었다.<\/p>\n<p>바닥에는 도준이 분필로 그린 지하 5층 지도가 있었다.<\/p>\n<p>\"순찰은 정각마다 동쪽 복도에서 시작해. 그러니까 50분에 서쪽 배수로로 빠지면…….\"<\/p>\n<p>도준이 분필로 선을 그었다. 세아가 고개를 끄덕였다. 은솔은 내 옆에 붙어 앉아 내 소매를 쥐고 있었다. 오늘 아침 은솔은 나를 처음 보는 얼굴로 쳐다봤다. 내가 '언니'라고 불러 달라고 하기도 전에, 은솔은 다시 나를 언니라고 불렀다. 그게 고맙고, 이상했다.<\/p>\n<p>\"50분. 서쪽 배수로. 다들 기억했지?\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"네.\"<\/p>\n<p>\"…….\"<\/p>\n<p>해원만 대답 대신 손톱을 물었다.<\/p>\n<p>우리는 49분에 창고를 나섰다.<\/p>\n<p>51분에, 서쪽 배수로 입구에서 은색 장갑 둘이 우리를 기다리고 있었다.<\/p>\n<hr class=\"scene\">\n<p>\"뒤로!\"<\/p>\n<p>세아가 먼저 외쳤다. 그녀의 손끝에서 검은 먹물 같은 마력이 튀었다. 집행관 하나가 벽에 처박혔다. 다른 하나가 장갑 낀 손을 뻗었다. 도준의 부적이 공중에서 타올랐다. 매캐한 연기, 종이 타는 냄새, 누군가의 비명.<\/p>\n<p>우리는 뛰었다. 막다른 골목, 꺾인 계단, 물이 고인 복도. 발목까지 차는 물이 얼음장 같았다. 은솔이 넘어졌다. 내가 끌어올렸다. 그 애의 손이 땀에 미끄러졌다.<\/p>\n<p>창고로 돌아와 문을 닫았을 때, 다섯 명 모두 숨이 턱까지 차 있었다.<\/p>\n<p>그리고 누구도 먼저 말하지 않았다.<\/p>\n<p>말하지 않아도 알았다. 경로를 아는 건 이 방의 다섯 명뿐이었다.<\/p>\n<p>\"……누가 흘렸어.\"<\/p>\n<p>세아가 말했다. 그리고 나를 봤다.<\/p>\n<p>\"너 지우개랑 붙어 다니잖아.\"<\/p>\n<p>\"뭐?\"<\/p>\n<p>\"윤제하. 너 어제 원장실에서 그 인간이랑 같이 나왔다며. 이 판에서 아버지한테 바로 보고할 수 있는 사람은 제하뿐이야. 그리고 제하랑 연결된 사람은 너뿐이고.\"<\/p>\n<p>목 뒤가 뜨거워졌다. 도준이 나를 봤다. 그의 팔 안쪽, 어젯밤 적은 '제하 = ???'가 보였다. 물음표 세 개.<\/p>\n<p>\"나 아니야.\"<\/p>\n<p>\"증명해 봐.\"<\/p>\n<p>\"그럼 너는? 사흘 전에 동맹 깨고 도준이 명패 뜯은 게 누구더라?\"<\/p>\n<p>세아의 턱이 굳었다.<\/p>\n<p>\"그건 게임이었어.\"<\/p>\n<p>\"이것도 게임 아니야?\"<\/p>\n<p>\"아버지가 나까지 수확한다는데 내가 아버지한테 정보를 줘?\"<\/p>\n<p>\"그러니까. 정보를 주고 명단에서 빼 달라고 할 수도 있잖아.\"<\/p>\n<p>말을 뱉는 순간 알았다. 나도 지금 같은 짓을 하고 있었다. 의심은 공처럼 튀었다. 내가 받으면 남에게 넘겨야 했다. 쥐고 있으면 손이 탔으니까.<\/p>\n<p>세아가 고개를 돌렸다. 시선이 해원에게 꽂혔다.<\/p>\n<p>\"해원. 너 아까 49분에 어디 있었어.\"<\/p>\n<p>\"……화장실.\"<\/p>\n<p>\"창고 안에 화장실이 어딨는데.\"<\/p>\n<p>\"양동이.\"<\/p>\n<p>\"웃기지 마.\"<\/p>\n<p>해원의 손톱 끝에서 피가 배어 나왔다. 그는 대답하지 않고 더 세게 물어뜯었다. 세아가 그의 멱살을 잡았다.<\/p>\n<p>\"그만 싸워요!\"<\/p>\n<p>은솔이었다. 그 애가 울면서 둘 사이로 끼어들었다. 작은 손으로 세아의 손목을 붙잡고, 눈물이 뚝뚝 떨어졌다.<\/p>\n<p>\"다들 왜 그래요. 우리 편이잖아요. 언니도, 세아 언니도, 해원 오빠도…….\"<\/p>\n<p>세아의 손이 천천히 풀렸다. 공기가 조금 내려앉았다.<\/p>\n<p>나는 은솔의 등을 쓸어 주었다. 그 애의 등이 작게 떨렸다. 꼭 추운 사람처럼.<\/p>\n<p>\"……미안.\" 세아가 먼저 말했다. 해원에게가 아니라, 허공에. 칠명가 영애는 사과하는 법을 배우지 않는다. 그래서 그 말은 이상하게 각지고 서툴렀다.<\/p>\n<p>해원은 대답하지 않았다. 대신 손톱 물어뜯기를 멈췄다. 그게 그의 대답 같았다.<\/p>\n<p>도준이 분필을 들고 바닥 지도 위에 X 표시를 했다. 서쪽 배수로.<\/p>\n<p>\"정리하자. 경로 아는 사람 다섯. 우리 다섯. 근데 우리 중에 원장한테 직통으로 연락할 수단 있는 사람?\"<\/p>\n<p>아무도 손을 들지 않았다.<\/p>\n<p>\"그렇지. 아무도 없지. 그럼 누가 몰래 갖고 있는 거지.\" 도준이 분필 끝으로 자기 관자놀이를 톡톡 쳤다. \"아니면 이 방에 귀가 있거나.\"<\/p>\n<p>우리는 동시에 천장을 올려다봤다. 물이 새는 얼룩, 거미줄, 녹슨 환풍기. 명경 같은 건 없었다.<\/p>\n<p>\"아니면 너.\" 세아가 다시 나를 봤지만, 아까처럼 날이 서 있지는 않았다. \"너 명경에 흐릿하게 찍히잖아. 원장이 널 못 보니까 다른 눈을 심었을 수도 있어. 네 근처에.\"<\/p>\n<p>내 근처. 나는 무심코 옆을 봤다. 은솔이 내 소매를 쥔 채 눈을 감고 있었다. 지쳐서 잠든 것처럼.<\/p>\n<p>아니, 설마.<\/p>\n<p>그 애는 오늘 아침에도 나를 잊었다. 그리고 다시 언니라고 불렀다. 그런 애가.<\/p>\n<p>나는 그 생각을 머릿속에서 지웠다. 지우개처럼, 거꾸로 읽어서. 그게 내가 이 판에서 한 가장 큰 실수였다는 건, 몇 시간 뒤에야 알게 됐다.<\/p>\n<hr class=\"scene\">\n<p>긴장을 끊은 건 의외로 세아였다.<\/p>\n<p>그녀는 벽에 기대 앉아 눈을 감고 있었다. 그러다 아주 작게, 무심하게, 노래를 흥얼거렸다.<\/p>\n<p>\"일곱 계단 내려가면, 왼쪽으로 길게 눕고…….\"<\/p>\n<p>나는 고개를 들었다.<\/p>\n<p>\"그거 뭐야.\"<\/p>\n<p>\"뭐가.\"<\/p>\n<p>\"노래.\"<\/p>\n<p>\"아, 이거?\" 세아가 눈을 떴다. \"칠명가 애들은 다 알아. 어릴 때 유모가 불러 주는 자장가. 일곱 계단 내려가면, 왼쪽으로 길게 눕고, 짧게 한 번 쪼아 보면, 잠든 책이 눈을 뜨네.\"<\/p>\n<p>머릿속에서 무언가가 딸깍 맞물렸다.<\/p>\n<p>왼쪽으로 길게 눕고.<\/p>\n<p>나는 손가락으로 허공에 그었다. 위에서 시작해, 왼쪽 아래로 길게 휘어 내리는 삐침. 서예 시간에 한 번도 배운 적 없는데, 몸이 먼저 알았다. 지금까지 모은 다섯 개의 획 — 점, 가로, 세로, 갈고리, 치킴. 그다음에 와야 하는 것.<\/p>\n<p>\"략(掠).\"<\/p>\n<p>\"뭐?\"<\/p>\n<p>\"긴 삐침. 여섯 번째야.\"<\/p>\n<p>도준이 내 손가락이 그린 궤적을 따라 시선을 움직였다. 세아는 미간을 찌푸렸다.<\/p>\n<p>\"잠든 책이 눈을 뜨네. 이거 자장가 아니야. 길이야. 지하 7층. 서고 아래 서고.\"<\/p>\n<p>\"7층은 없어. 명부원은 6층까지야.\"<\/p>\n<p>\"지도에는.\"<\/p>\n<p>세아가 나를 오래 봤다. 처음으로, 오만함 없는 눈이었다.<\/p>\n<p>\"……너 진짜 우리 고모 딸 맞구나.\"<\/p>\n<p>그 말이 이상하게 따뜻해서, 나는 대답할 말을 찾지 못했다.<\/p>\n<hr class=\"scene\">\n<p>나는 6층 계단참으로 혼자 내려갔다.<\/p>\n<p>동요의 첫 소절을 확인하고 싶었다. 아니, 거짓말이다. 저 방에서, 서로를 의심하는 네 쌍의 눈에서 벗어나고 싶었다.<\/p>\n<p>6층 계단참은 어두웠다. 등잔이 꺼져 있었고, 벽에서 오래된 먹 냄새가 났다. 나는 계단을 셌다. 하나, 둘, 셋…… 일곱. 일곱 번째 계단 아래, 왼쪽 벽. 손바닥으로 쓸어 보니 돌 위에 무언가가 파여 있었다. 길고 부드럽게 휘어 내린 홈. 손끝에서 서늘한 감촉이 팔뚝까지 타고 올라왔다.<\/p>\n<p>여섯 번째 획.<\/p>\n<p>\"여기 오면 안 되는 거 알지.\"<\/p>\n<p>나는 돌아보지 않았다. 목소리만으로 알았다. 금서고에서 처음 들었던 그 말.<\/p>\n<p>\"너도 여기 오면 안 되잖아.\"<\/p>\n<p>제하가 계단 위에서 내려왔다. 그의 발소리는 거의 나지 않았다. 지우개들은 걸음의 이름까지 지운다고, 도준이 그랬었다.<\/p>\n<p>그가 내 옆, 한 계단 위에 앉았다. 닿지 않을 만큼. 그러나 체온은 느껴질 만큼.<\/p>\n<p>\"날 데려가면 넌 살아.\"<\/p>\n<p>내가 먼저 말했다.<\/p>\n<p>\"알아.\"<\/p>\n<p>\"원장이 그랬잖아. 내일 밤까지 안 데려가면 네 이름 나머지 절반을 지운다고.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"근데 왜 안 데려가?\"<\/p>\n<p>그는 대답하지 않았다. 어둠 속에서 그의 숨소리만 들렸다. 길게, 천천히. 무언가를 참는 사람의 숨.<\/p>\n<p>\"……모르겠어.\"<\/p>\n<p>그가 말했다.<\/p>\n<p>\"처음으로 모르겠는 게 생겼어.\"<\/p>\n<p>지우개는 감정을 하나씩 지운다. 그는 이름을 지울 때마다 무언가를 못 느끼게 된다고 했다. 그런 사람이 '모르겠다'고 했다. 그건 아직 남은 무언가가 있다는 뜻이었다.<\/p>\n<p>나는 아직 그를 용서하지 않았다. 용서할 수 있을지도 몰랐다.<\/p>\n<p>그래도 그가 장갑을 벗은 맨손으로 내 손목을 잡았을 때, 나는 뿌리치지 않았다.<\/p>\n<p>그의 손바닥은 차가웠다. 흉터가 많아 거칠었다. 그런데 손목을 감싼 엄지는 아주 조심스러워서, 꼭 깨지는 걸 쥔 사람 같았다.<\/p>\n<p>\"7층에 뭐가 있는지 알아?\"<\/p>\n<p>내가 물었다. 그의 엄지가 멈췄다.<\/p>\n<p>\"……한 번 내려가 봤어. 열두 살 때. 원장님 뒤를 따라서.\"<\/p>\n<p>\"뭐가 있었는데.\"<\/p>\n<p>\"책.\" 그가 잠깐 말을 골랐다. \"사람 키만 한 책. 닫혀 있었어. 근데 숨을 쉬었어. 표지가 오르락내리락했어.\"<\/p>\n<p>등줄기가 서늘해졌다. 잠든 책이 눈을 뜨네.<\/p>\n<p>\"원장님이 그 앞에서 한 시간 동안 아무 말도 안 했어. 그냥 보기만 했어. 나는 그때, 그 사람이 뭔가를 그리워하는 얼굴을 처음 봤어.\"<\/p>\n<p>\"엄마.\"<\/p>\n<p>\"……아마도.\"<\/p>\n<p>나는 무릎에 턱을 괴었다. 엄마를 지우라고 시킨 사람이, 엄마를 그리워한다. 엄마를 지운 아이가, 엄마의 딸 손목을 잡고 있다. 이 학교의 모든 관계는 거꾸로 읽어야 뜻이 통하는 이름 같았다.<\/p>\n<p>\"제하.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"내일 밤까지 안 데려가면, 너 어떻게 돼.\"<\/p>\n<p>그는 대답하지 않았다. 대답하지 않는 게 대답이었다.<\/p>\n<p>나는 그의 손을 뿌리치지도, 마주 잡지도 않았다. 그냥 그대로 두었다. 우리는 한참을 그렇게 앉아 있었다.<\/p>\n<hr class=\"scene\">\n<p>계단을 올라 창고로 돌아가는 길에, 냄새가 먼저 왔다.<\/p>\n<p>연기. 종이 타는 냄새가 아니었다. 그보다 무겁고, 쇠가 녹는 듯한, 비릿한 냄새.<\/p>\n<p>나는 뛰었다.<\/p>\n<p>계단이 끝없이 길었다. 올라갈 때는 일곱 계단이었는데, 지금은 칠십 계단 같았다. 숨이 목구멍에 걸렸다. 무릎이 계단 모서리에 부딪혔다. 아프지 않았다. 아플 틈이 없었다. 냄새가 점점 짙어졌다. 눈이 매웠다.<\/p>\n<p>창고 문이 반쯤 열려 있었다. 안은 연기로 뿌옜다. 세아가 기침을 하며 창문 대신 뚫린 환기구를 찢고 있었고, 해원은 벽 구석에 웅크려 있었다. 은솔은 문 옆에서 입을 막고 울고 있었다. 손가락 사이로 흐느낌이 새어 나왔다.<\/p>\n<p>그리고 바닥에, 도준이 쓰러져 있었다.<\/p>\n<p>그의 가슴 위에서 명패가 검게 타고 있었다.<\/p>\n<p>빼앗긴 게 아니었다. 이름을 부른 것도 아니었다. 그냥 — 태워졌다. 동판이 숯처럼 갈라지며 붉은 불씨를 토해 냈다. 명패가 없으면 마감 때 말소된다. 그런데 이건 마감을 기다리지 않았다.<\/p>\n<p>\"도준아.\"<\/p>\n<p>무릎을 꿇었다. 그의 손을 잡았다.<\/p>\n<p>그의 손가락 끝이, 재처럼 바스러졌다.<\/p>","chars":4709},{"title":"빈 명패","html":"<p>[낙명제 6일째 · 마감까지 19시간 30분]<\/p>\n<p>손가락 끝이 바스러졌다.<\/p>\n<p>모래처럼. 아니, 재처럼. 허문 할아버지가 편의점 바닥에 흩어지던 그날 새벽처럼. 회색 가루가 내 손바닥에 묻었다. 따뜻했다. 그게 제일 끔찍했다.<\/p>\n<p>\"도준아. 봉도준.\"<\/p>\n<p>나는 그의 이름을 불렀다. 계속 불렀다.<\/p>\n<p>도준이 눈을 떴다. 초점이 한참 늦게 맞았다. 그리고 웃으려고 했다. 입꼬리가 덜덜 떨렸다.<\/p>\n<p>\"야…….\"<\/p>\n<p>\"말하지 마.\"<\/p>\n<p>\"나 오늘 노트 안 썼다.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"그럼 내일 너 몰라도 되는 거네. 개이득.\"<\/p>\n<p>나는 그의 가슴을 쳤다. 아주 약하게. 그가 기침을 했고, 기침과 함께 손톱 하나가 가루가 되어 떨어졌다.<\/p>\n<p>\"누가 그랬어.\"<\/p>\n<p>\"몰라. 문 열리는 소리 나서 돌아봤는데…… 장갑. 은색. 그거밖에 못 봤어.\" 그가 숨을 몰아쉬었다. \"근데 이상했어. 그 사람, 내 이름 안 불렀어. 그냥 명패에 손 대고, 뭐라고 그었어. 손가락으로.\"<\/p>\n<p>\"그었다고?\"<\/p>\n<p>\"응. 붓글씨 쓰듯이. 그러니까 불이 붙었어.\"<\/p>\n<p>은솔이 구석에서 무릎을 끌어안았다. 그 애의 어깨가 더 작아졌다. 나는 그때 그걸 무서워서라고만 생각했다.<\/p>\n<hr class=\"scene\">\n<p>\"시간이 없어.\"<\/p>\n<p>세아가 무릎을 꿇고 도준의 손목을 짚었다. 그녀의 손이 처음으로 떨리고 있었다.<\/p>\n<p>\"소각은 마감을 안 기다려. 몇 시간이면 끝까지 가. 길어야 네 시간.\"<\/p>\n<p>새벽 4시 반. 시계를 보지 않아도 알았다. 마감까지는 열아홉 시간 반. 도준에게는 네 시간. 편의점에서 일하던 몸은 새벽의 공기를 기억했다. 차갑고 묽은 공기. 첫차가 오기 전의 공기.<\/p>\n<p>\"방법 있어?\"<\/p>\n<p>\"있어.\"<\/p>\n<p>세아가 일어섰다. 그리고 창고를 나갔다. 오 분 뒤, 그녀는 무언가를 들고 돌아왔다.<\/p>\n<p>명패였다.<\/p>\n<p>\"5층 동쪽 복도에 기절한 애가 있었어. 집행관이랑 붙었다가 나가떨어졌나 봐. 명패는 아직 가슴에 붙어 있었고.\"<\/p>\n<p>그녀가 내 손에 명패를 쥐여 주었다. 손바닥만 한 동판. 아직 체온이 남아 있었다. 새겨진 이름은 내가 모르는 이름이었다. 하지만 이름이었다. 누군가가 열여덟 해, 혹은 열아홉 해 동안 불려 온 이름.<\/p>\n<p>\"이걸 도준한테 붙이면 돼. 새 명패가 소각을 덮어.\"<\/p>\n<p>\"그럼 이 애는.\"<\/p>\n<p>\"마감 때 말소되겠지.\"<\/p>\n<p>세아는 눈을 피하지 않았다. 그게 칠명가의 방식이었다. 정직하게 잔혹한 것.<\/p>\n<p>\"선택해, 사촌. 네 친구야, 모르는 애야.\"<\/p>\n<p>명패가 손바닥 안에서 무거워졌다. 내 심장이 그 동판 안에서 뛰는 것 같았다. 도준의 숨소리가 가늘어졌다. 은솔이 구석에서 훌쩍였다. 해원이 손톱을 물었다.<\/p>\n<p>나는 명패에 새겨진 이름을 손끝으로 더듬었다. 획이 깊었다. 오래 불린 이름일수록 명패의 홈이 깊어진다고 도준이 그랬었다. 이 애는 많이 불렸다. 누군가 아침마다, 저녁마다, 밥 먹으라고, 일어나라고, 어디 갔다 왔냐고 이 이름을 불렀다.<\/p>\n<p>엄마가. 아빠가. 동생이.<\/p>\n<p>\"하루야.\" 세아가 재촉했다. \"생각할 시간 없어. 손가락 하나 더 갔어.\"<\/p>\n<p>정말이었다. 도준의 왼손 약지가 마디째 가루가 되어 흩어졌다. 그는 신음도 안 냈다. 대신 이를 악물고, 남은 손가락으로 바닥을 긁었다. 손톱이 콘크리트를 긁는 소리가 귀에 박혔다.<\/p>\n<p>하나, 둘, 셋. 나는 숫자를 셌다. 넷, 다섯. 편의점 재고처럼. 컵라면 스물네 개, 삼각김밥 열여섯 개, 생수 마흔여덟 병. 숫자는 늘 맞아떨어졌다. 하나를 빼면 하나가 빈다. 그게 세상의 계산이었다.<\/p>\n<p>그런데 사람도 그렇게 세도 되는 걸까.<\/p>\n<p>모르는 애. 얼굴도 모르는. 내일이면 나를 기억도 못 할.<\/p>\n<p>나는 그 애가 되어 본 적이 있었다. 평생.<\/p>\n<p>아무도 모르게 사라지는 사람. 다음 날 아무도 찾지 않는 사람. 출석부에서 조용히 빠지는 이름.<\/p>\n<p>나는 명패를 바닥에 내려놓았다.<\/p>\n<p>\"뭐 하는 거야.\"<\/p>\n<p>\"다른 방법이 있어.\"<\/p>\n<hr class=\"scene\">\n<p>나는 품에서 내 명패를 꺼냈다.<\/p>\n<p>빈 명패. 이름 대신 숫자 '49'만 새겨진 동판. 엿새 전 새벽, 계산대 모서리에 베인 내 피를 빨아들이고 숫자를 토해 낸 것.<\/p>\n<p>그때는 몰랐다. 왜 이름이 아니라 숫자였는지.<\/p>\n<p>허문 할아버지가 남긴 테두리 글귀를 도준과 함께 처음부터 다시 읽은 건 어젯밤이었다. 원장실에서 가져온 문서 귀퉁이에 같은 문장이 있었다.<\/p>\n<p><em>빈 명패는 피로 쓴 이름을 단 한 번 받는다. 받은 이름의 것이 된다.<\/em><\/p>\n<p>내 피에는 쓸 이름이 없었다. 그래서 명패는 이름 대신 순번만 새겼다. 49번째 참가자. 나는 이름이 아니라 숫자로 이 게임에 들어왔다.<\/p>\n<p>그러니까 이 명패에는 아직, 이름 한 칸이 비어 있었다.<\/p>\n<p>\"하루야. 너 지금…….\"<\/p>\n<p>세아가 이해했다. 그녀의 얼굴이 하얗게 질렸다.<\/p>\n<p>\"그거 쓰면 너는 명패가 없어. 마감 때 너가 말소돼.\"<\/p>\n<p>\"알아. 그래서 서두르는 거야.\"<\/p>\n<p>\"진명을 찾을 때까지라는 보장도 없어. 넌 아직 이름도 몰라.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"그런데 왜!\"<\/p>\n<p>나는 대답 대신 엄지를 깨물었다. 이로. 생각보다 세게. 비린 맛이 입 안에 확 번졌다. 피가 방울져 맺혔다.<\/p>\n<p>명패 뒷면에, 숫자 49 옆에, 피로 썼다.<\/p>\n<p>봉. 도. 준.<\/p>\n<p>획을 그을 때마다 손끝이 화끈거렸다. 동판이 피를 빨아들였다. 마지막 획에서 명패가 뜨거워졌다. 손바닥이 데일 만큼. 숫자 49가 녹아내리듯 흐려지고, 그 자리에 세 글자가 금빛으로 떠올랐다.<\/p>\n<p>봉도준.<\/p>\n<p>명패 표면이 아직 뜨거웠다. 쥔 손바닥이 쓰라렸다. 금속과 피가 섞인 냄새가 났다. 나는 그 열기를 놓지 않았다.<\/p>\n<p>나는 그걸 도준의 가슴, 검게 탄 옛 명패 위에 눌렀다.<\/p>\n<p>불씨가 꺼졌다.<\/p>\n<p>바스러지던 손끝이 멈췄다. 가루가 더 이상 떨어지지 않았다. 도준의 가슴이 크게 오르내렸다. 숨이었다. 살아 있는 사람의 숨.<\/p>\n<hr class=\"scene\">\n<p>그리고 내 가슴이 가벼워졌다.<\/p>\n<p>명패가 걸려 있던 자리. 엿새 동안 무게를 느끼지도 못했던 동판이 사라지자, 갈비뼈 안쪽이 텅 빈 것 같았다. 바람이 들어왔다. 지하 6층의 차가운 공기가, 가슴 한가운데로 그냥 지나갔다.<\/p>\n<p>나는 이제 명패가 없다. 아무것도 없다.<\/p>\n<p>6일째 자정. 열아홉 시간 뒤. 나는 말소된다.<\/p>\n<p>진명을 찾지 못하면.<\/p>\n<p>\"야.\"<\/p>\n<p>도준이 상체를 일으켰다. 아직 얼굴이 잿빛이었다. 그는 자기 가슴의 명패를 내려다보고, 내 빈 가슴을 보고, 다시 명패를 봤다.<\/p>\n<p>\"너 이거 뭐야.\"<\/p>\n<p>\"네 명패.\"<\/p>\n<p>\"이게 왜 내 명패야. 이거 너 거잖아. 이거 49번이잖아!\"<\/p>\n<p>\"이제 아니야.\"<\/p>\n<p>\"강하루!\"<\/p>\n<p>그가 소리쳤다. 처음이었다. 엿새 동안, 매일 아침 나를 처음 보는 얼굴로 쳐다보고 손목 글씨를 믿기로 했던 그가, 처음으로 진짜로 화를 냈다.<\/p>\n<p>\"너 미쳤어? 나 내일이면 너 기억도 못 한다고! 노트도 없어! 기억도 못 하는 놈 때문에, 너가, 너가 왜…….\"<\/p>\n<p>목소리가 갈라졌다. 그는 울고 있었다. 화내면서. 콧물까지 흘리면서.<\/p>\n<p>\"그래서 그런 거야.\"<\/p>\n<p>나는 그의 손을 잡았다. 손톱 두 개가 없는 손. 그래도 따뜻한 손.<\/p>\n<p>\"너는 매일 아침 나를 처음부터 믿어 줬잖아. 질문 금지라고 써 놓고, 진짜로 질문 안 하고. 처음 보는 애한테 컵라면 나눠 주고.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"한 번쯤은, 내가 너를 기억해 줄게.\"<\/p>\n<p>도준이 이를 악물었다. 그리고 내 손에서 볼펜을 빼앗았다.<\/p>\n<p>그는 소매를 걷어 올렸다. 손목의 볼펜 글씨, <em>강하루 = 내 친구. 믿어도 됨. 질문 금지.<\/em> 그 위로, 팔꿈치까지, 그는 미친 사람처럼 쓰기 시작했다.<\/p>\n<p>강하루. 강하루. 강하루. 명패 준 애. 목숨 빚. 강하루. 절대 잊지 마. 잊으면 죽어. 강하루.<\/p>\n<p>볼펜 끝이 살갗을 긁어 붉은 줄이 생겼다. 그래도 그는 멈추지 않았다.<\/p>\n<p>\"노트 없으면 몸에 쓰면 되지.\"<\/p>\n<p>그가 코를 훌쩍였다.<\/p>\n<p>\"질문 금지는 취소야. 내일 아침에 너한테 질문 존나 많이 할 거야.\"<\/p>\n<hr class=\"scene\">\n<p>나는 웃었다. 울면서.<\/p>\n<p>세아는 아무 말 없이 바닥에 내려놓았던 남의 명패를 집어 들었다. 그리고 창고를 나갔다. 돌아왔을 때 그녀의 손은 비어 있었다.<\/p>\n<p>\"돌려놨어. 그 애 가슴에.\"<\/p>\n<p>\"……왜.\"<\/p>\n<p>\"몰라.\" 세아가 벽에 기대 팔짱을 꼈다. 시선은 천장에 고정한 채였다. \"칠명가에선 이런 거 안 가르쳐 줘. 남의 걸 가져올 수 있으면 가져오는 거야. 그게 이름이 강해지는 방법이라고.\"<\/p>\n<p>그녀가 코웃음을 쳤다. 자기 자신에게.<\/p>\n<p>\"근데 너 보니까, 이름이 없는 애가 제일 무겁더라.\"<\/p>\n<p>나는 대답하지 않았다. 세아도 대답을 기다리지 않았다. 해원이 처음으로 손톱이 아닌 다른 걸 했다. 자기 손수건을 꺼내 도준의 잘려 나간 손가락 끝을 감아 주었다. 피는 나지 않았다. 재가 된 상처는 피를 흘리지 않았다. 그게 더 아파 보였다.<\/p>\n<p>창고 안이 잠깐, 아주 잠깐 따뜻했다. 양동이에 떨어지는 물소리가 다시 들렸다. 톡. 톡.<\/p>\n<p>그 소리를 들으며 나는 생각했다. 열아홉 시간. 그 안에 이름을 찾으면 된다. 아니면 찾지 못하고 사라지면 된다. 어느 쪽이든, 오늘 나는 처음으로 내가 고른 계산을 했다.<\/p>\n<p>그러다 시선이 바닥에 떨어진 도준의 옛 명패에 멈췄다. 숯처럼 갈라진 동판. 그을음이 표면을 덮고 있었다.<\/p>\n<p>그 그을음 사이에, 한 줄.<\/p>\n<p>짧고 날카롭게, 왼쪽 위로 쪼아 올린 삐침. 새가 부리로 한 번 쪼는 모양. 불길이 우연히 남긴 자국이 아니었다. 소각 마법을 거는 손이, 습관처럼, 명패에 남긴 서명이었다.<\/p>\n<p>\"잠든 책이 눈을 뜨네…….\" 세아의 자장가가 머릿속에서 울렸다. <em>짧게 한 번 쪼아 보면.<\/em><\/p>\n<p>탁(啄). 일곱 번째 획.<\/p>\n<p>누군가 이 명패를 태웠다. 그 누군가는 영자팔법의 획을 아는 사람이었다. 혹은 — 그 획을 아는 사람의 명령을 받은 사람이었다.<\/p>\n<p>나는 고개를 들어 창고 안을 둘러보았다.<\/p>\n<p>세아는 도준의 맥을 다시 짚고 있었다. 해원은 벽에 기대 눈을 감고 있었다. 은솔은 창고 구석, 어둠이 가장 짙은 자리에 웅크리고 있었다.<\/p>\n<p>은솔의 소매 속에서, 무언가가 깜박였다.<\/p>\n<p>아주 작은 빛. 거울 조각 같은. 손톱만 한 명경 파편이 박자에 맞춰 반짝였다. 깜박. 깜박. 깜박. 신호처럼.<\/p>\n<p>은솔이 고개를 들었다. 나와 눈이 마주쳤다.<\/p>\n<p>그 애는 울고 있었다. 처음부터 계속, 울고 있었다.<\/p>\n<p>\"미안해요, 언니.\"<\/p>\n<p>그 애가 소매를 끌어내렸다. 너무 늦게.<\/p>\n<p>\"우리 별이가…… 별이가 저기 있어요.\"<\/p>\n<p>창고 문 너머로 발소리가 들렸다. 하나, 둘, 셋.<\/p>\n<p>문틈 아래로 은색이 번쩍였다.<\/p>","chars":4721},{"title":"이중 스파이","html":"<p>[낙명제 6일째 · 마감까지 15시간]<\/p>\n<p>문이 터졌다.<\/p>\n<p>경첩이 비명을 지르며 날아갔다. 먼지와 나무 조각. 그 사이로 은색 장갑 셋이 들어왔다. 집행관들의 얼굴은 흐릿했다. 이름을 너무 많이 태운 사람들의 얼굴. 기억에 잘 남지 않는 얼굴.<\/p>\n<p>\"뒤!\"<\/p>\n<p>세아가 먹빛 마력을 휘둘렀다. 첫 번째 집행관이 벽에 처박혔다. 도준이 비틀거리며 부적을 던졌다. 불꽃이 터졌다.<\/p>\n<p>그리고 나는, 은솔의 손목을 잡았다.<\/p>\n<p>\"언니……?\"<\/p>\n<p>\"뛰어.\"<\/p>\n<p>생각할 틈은 없었다. 몸이 먼저 움직였다. 창고 뒤쪽, 배수로로 이어지는 쇠창살. 도준이 사흘 전에 나사를 풀어 둔 곳. 나는 창살을 걷어차고 은솔을 먼저 밀어 넣었다. 배신자를. 방금 우리를 팔아넘긴 아이를.<\/p>\n<p>\"하루! 그 애 버려!\"<\/p>\n<p>세아의 외침이 등 뒤에서 들렸다. 나는 대답하지 않았다.<\/p>\n<hr class=\"scene\">\n<p>배수로는 무릎까지 물이 찼다. 썩은 물 냄새가 코를 찔렀다. 머리 위 파이프에서 차가운 물방울이 목덜미로 떨어졌다. 뒤에서 세아와 도준, 해원이 따라 들어오는 소리. 그보다 멀리, 집행관들의 쇳소리.<\/p>\n<p>우리는 갈림길에서 오른쪽으로 꺾었다. 다시 왼쪽. 세아가 손을 휘저어 뒤쪽 통로의 등잔을 하나씩 꺼뜨렸다. 어둠이 우리를 삼켰다.<\/p>\n<p>막다른 곳의 펌프실. 녹슨 철문을 닫고 빗장을 질렀다. 다섯 명의 숨소리가 좁은 방 안을 채웠다.<\/p>\n<p>세아가 은솔의 멱살을 잡았다. 은솔의 발끝이 들렸다.<\/p>\n<p>\"말해.\"<\/p>\n<p>\"세아야.\"<\/p>\n<p>\"넌 빠져, 하루. 이건 칠명가 방식으로 처리해.\"<\/p>\n<p>\"말하게 해 줘. 그다음에 처리하든 말든.\"<\/p>\n<p>세아가 나를 노려봤다. 그러다 손을 놓았다. 은솔이 물속에 주저앉았다.<\/p>\n<p>\"……별이는 아홉 살이에요.\"<\/p>\n<p>은솔은 울지 않으려고 입술을 깨물었다. 피가 배어 나왔다.<\/p>\n<p>\"낙명제 시작하기 일주일 전에, 칠명회 사람들이 집에 왔어요. 별이 명패를 가져갔어요. 아직 명패 받을 나이도 아닌데, 이름을 떼어 갔어요. 그리고 원장님이 그랬어요. 이름 없는 아이가 어디 있는지 알려 주면, 별이 이름을 돌려주겠다고.\"<\/p>\n<p>\"그래서 우리 경로를 흘렸어?\"<\/p>\n<p>\"……네.\"<\/p>\n<p>\"도준이 명패도 네가 태웠어?\"<\/p>\n<p>은솔이 고개를 세차게 저었다.<\/p>\n<p>\"아니에요! 그건 아니에요. 전 위치만 보냈어요. 노트도…… 노트만 가져갔어요. 언니를 기억하는 사람을 줄이라고 해서.\"<\/p>\n<p>도준이 무언가 말하려다 입을 다물었다. 팔에 빼곡히 쓴 내 이름 위로 그의 손이 움켜쥐어졌다.<\/p>\n<p>\"집행관이 왔을 때 전 밖에 있었어요. 들어왔을 때 이미 타고 있었어요. 진짜예요, 언니. 진짜…….\"<\/p>\n<hr class=\"scene\">\n<p>\"버리자.\"<\/p>\n<p>세아가 말했다. 담담하게.<\/p>\n<p>\"배신자는 처리해. 남의 명패 뺏어서 이 애 동생 이름이 돌아오는 것도 아니고, 여기 두면 또 팔아.\"<\/p>\n<p>\"버리면 원장이 이 애를 어떻게 할 것 같아?\"<\/p>\n<p>\"그건 내 알 바 아니야.\"<\/p>\n<p>\"네 알 바야. 너도 그 명단에 있었잖아.\"<\/p>\n<p>세아의 입술이 굳었다. 그녀의 손가락이 무의식적으로 자기 가슴의 명패를 더듬었다. 남궁세아. 칠명가에서 가장 오래된 성씨. 아버지가 직접 새겨 준 이름. 그 이름이 아버지의 수확 명단 맨 위에 있었다.<\/p>\n<p>\"……그래서 더 싫은 거야.\" 그녀가 중얼거렸다. \"약한 쪽이 이용당하는 거 보는 게.\"<\/p>\n<p>나는 은솔 앞에 쭈그려 앉았다. 물이 차가웠다. 정강이가 저렸다.<\/p>\n<p>이 애는 내일이면 나를 잊는다. 오늘 아침에도 잊었었다. 그런데도 다시 나를 언니라고 불렀다. 기억하지 못하는 사람에게, 두 번째로 언니라고.<\/p>\n<p>그게 연기였을까. 처음부터 끝까지.<\/p>\n<p>모르겠다. 하지만 이 애의 손목에서 맥박이 미친 듯이 뛰는 건 연기가 아니었다.<\/p>\n<p>\"은솔아.\"<\/p>\n<p>\"……네.\"<\/p>\n<p>\"원장은 아직 네가 자기 편이라고 믿지?\"<\/p>\n<p>은솔이 눈을 깜박였다.<\/p>\n<p>\"네가 보낸 위치에 우리가 있었으니까. 넌 원장 입장에선 일 잘한 거야.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"그럼 계속 일 잘해. 대신 이번엔, 내가 불러 주는 위치를 보내.\"<\/p>\n<p>펌프실 안이 조용해졌다. 세아가 처음으로 입을 반쯤 벌렸다. 도준이 \"어?\" 하고 소리를 냈다.<\/p>\n<p>\"이중 스파이.\"<\/p>\n<p>해원이 중얼거렸다. 이번 낙명제에서 그가 한 말 중 가장 긴 문장이었다.<\/p>\n<p>\"원장이 믿는 정보원이 우리 쪽이면, 원장은 자기 눈을 우리한테 빌려준 거야.\" 나는 은솔의 소매에서 명경 파편을 꺼냈다. 깜박이는 빛. \"가장 의심받지 않는 사람이 가장 위험하잖아. 그걸 우리가 쓰는 거야.\"<\/p>\n<p>\"이 애가 또 배신하면?\"<\/p>\n<p>\"그럼 내가 사람 보는 눈이 없는 거지.\"<\/p>\n<p>\"……언니.\"<\/p>\n<p>은솔이 내 손을 붙잡았다. 손바닥이 얼음장이었다.<\/p>\n<p>\"왜요. 저 언니 팔았는데. 언니 위치 보냈는데. 도준 오빠 노트도 제가…….\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"그럼 왜요.\"<\/p>\n<p>나는 잠깐 생각했다. 정직한 대답은 멋이 없었다.<\/p>\n<p>\"너 오늘 아침에 나 처음 봤잖아.\"<\/p>\n<p>\"……네.\"<\/p>\n<p>\"근데 또 언니라고 불렀잖아. 기억도 안 나는 사람한테. 그게 연기였으면, 넌 진짜 대단한 스파이고.\"<\/p>\n<p>은솔의 입술이 떨렸다.<\/p>\n<p>\"연기 아니었어요. 그냥…… 언니 얼굴 보면, 왠지 그렇게 불러야 될 것 같았어요. 이유는 몰라요. 매일 아침마다, 처음 보는데도.\"<\/p>\n<p>가슴 한가운데가 묵직해졌다. 도준의 손목 글씨. 은솔의 언니. 기억은 없어도 무언가가 남는다. 몸에, 입버릇에, 습관에.<\/p>\n<p>엄마가 말했다던 '네가 고른 사람'이 그런 건지도 몰랐다.<\/p>\n<p>\"그럼 됐어.\" 나는 은솔의 손을 마주 잡았다. \"별이는 우리가 같이 찾아.\"<\/p>\n<p>세아가 길게 숨을 내쉬었다. 그리고 벽에 등을 기댔다.<\/p>\n<p>\"……정말 고모 딸 맞네. 우리 아버지가 제일 싫어하는 타입이야.\"<\/p>\n<hr class=\"scene\">\n<p>은솔이 파편에 손가락을 댔다. 떨리는 손끝으로 신호를 보냈다. 내가 불러 준 위치. 지하 2층 서쪽 기숙 구역. 우리와 정반대.<\/p>\n<p>삼 분 뒤, 배수로 멀리서 들리던 쇳소리가 멀어졌다. 위로. 2층으로.<\/p>\n<p>\"……됐다.\"<\/p>\n<p>도준이 물속에 주저앉았다. 그러다 다시 벌떡 일어났다.<\/p>\n<p>펌프실 철문 너머. 멀어지던 쇳소리 중 하나가 되돌아오고 있었다. 아니, 셋. 은색 장갑 셋이 배수로를 따라 이쪽으로.<\/p>\n<p>\"속은 게 아니야.\" 세아가 이를 갈았다. \"흩어진 거야. 일부만 2층으로 보내고.\"<\/p>\n<p>철문이 쾅, 하고 울렸다. 빗장이 휘었다.<\/p>\n<p>그때 문 너머에서 다른 소리가 났다.<\/p>\n<p>쇠와 쇠가 부딪히는 소리. 누군가의 신음. 물이 튀는 소리.<\/p>\n<p>나는 빗장을 풀었다.<\/p>\n<p>배수로 한가운데, 윤제하가 서 있었다.<\/p>\n<p>집행관 셋이 그를 둘러싸고 있었다. 같은 은색 장갑. 같은 흐릿한 얼굴. 동료들. 제하는 장갑 낀 오른손을 들어 올렸다. 가장 가까운 집행관의 장갑 위에 손을 얹고, 무언가를 거꾸로 읊었다. 상대의 은색 장갑이 '지워졌다'. 맨손이 된 집행관이 비명을 지르며 물러섰다.<\/p>\n<p>두 번째가 뒤에서 덮쳤다. 제하가 몸을 비틀었다. 장갑이 그의 옆구리를 스쳤다. 피가 튀었다. 물이 붉어졌다.<\/p>\n<p>\"제하!\"<\/p>\n<p>그가 나를 돌아보지 않았다. 대신 배수로 천장의 파이프에 손을 댔다. \"이름 있는 건 다 돼.\" 파이프의 이름이 지워졌고, 쏟아진 물과 쇳덩이가 집행관 둘을 덮쳤다.<\/p>\n<p>물보라가 가라앉았을 때, 서 있는 사람은 그 하나였다.<\/p>\n<hr class=\"scene\">\n<p>그는 벽에 기대 미끄러졌다.<\/p>\n<p>나는 달려가 그의 옆구리를 눌렀다. 손바닥 밑으로 뜨거운 것이 계속 배어 나왔다. 철 냄새. 그의 숨에서 나는 열기. 나는 교복 소매를 찢어 상처를 감았다. 매듭을 지을 때 손이 미끄러져 두 번 실패했다.<\/p>\n<p>\"동료잖아.\"<\/p>\n<p>\"……이제 아니야.\"<\/p>\n<p>\"원장한테 뭐라고 할 건데.\"<\/p>\n<p>\"말할 시간 없을 거야.\"<\/p>\n<p>그가 웃으려 했다. 아니, 아직 웃지는 않았다. 웃는 법을 잊은 사람이 입꼬리를 시험해 보는 것 같았다.<\/p>\n<p>뒤에서 도준이 헛기침을 했다. 세아가 은솔과 해원을 끌고 통로 모퉁이 너머로 사라졌다. 도준도 따라가며, 나를 향해 입 모양만으로 말했다. <em>미친 거 알지.<\/em><\/p>\n<p>배수로에 둘만 남았다. 정확히는, 둘과 쓰러진 사람 하나.<\/p>\n<p>쓰러진 집행관 하나가 신음했다. 장갑이 지워진 그 남자는 맨손을 눈앞에 들고, 처음 보는 물건처럼 들여다보고 있었다. 손등에 흉터가 가득했다. 제하와 똑같은.<\/p>\n<p>\"저 사람도…….\"<\/p>\n<p>\"응. 다 그래.\" 제하가 그를 보지 않고 말했다. \"장갑이 없으면 우린 그냥 이름 반쯤 없는 사람이야. 아무도 기억 못 하는.\"<\/p>\n<p>집행관이 비틀거리며 일어났다. 우리를 한 번 보고, 아무 말 없이 어둠 속으로 걸어갔다. 쫓아오지 않았다. 아마 어디로 가야 할지 몰라서였을 것이다.<\/p>\n<p>물소리. 그의 숨소리. 내 심장 소리.<\/p>\n<p>물소리. 그의 숨소리. 내 심장 소리.<\/p>\n<p>\"용서한 거 아니야.\"<\/p>\n<p>내가 먼저 말했다.<\/p>\n<p>\"알아.\"<\/p>\n<p>\"엄마를 지운 손이야. 이거.\"<\/p>\n<p>나는 그의 오른손을 잡았다. 은색 장갑 위로.<\/p>\n<p>\"알아.\"<\/p>\n<p>\"근데.\"<\/p>\n<p>목이 막혔다. 숫자를 세려 했다. 하나, 둘. 셋에서 무너졌다.<\/p>\n<p>\"근데 너 없으면, 내가 기억되는 데가 없어.\"<\/p>\n<p>엿새 동안. 아니, 열여덟 해 동안. 세상의 모든 사람이 나를 하루 만에 잃어버렸다. 이 사람만 빼고. 엄마를 지운, 그래서 엄마가 마지막에 나를 맡긴 이 사람만.<\/p>\n<p>그건 용서가 아니었다. 그냥, 선택이었다.<\/p>\n<p>나는 그에게 입을 맞췄다.<\/p>\n<p>짧게. 피 맛이 났다. 물 냄새가 났다. 그의 입술은 차가웠는데, 숨은 뜨거웠다.<\/p>\n<p>떨어졌을 때, 그가 웃고 있었다.<\/p>\n<p>처음 보는 얼굴이었다. 지우개가 아닌 얼굴. 열여덟 살쯤, 아니 여덟 살쯤 되어 보이는 얼굴. 무언가를 처음 가진 아이 같은.<\/p>\n<hr class=\"scene\">\n<p>그 웃음이 멈췄다.<\/p>\n<p>그의 윤곽이 깜박였다.<\/p>\n<p>한 번. 형광등이 나가기 직전처럼. 그의 어깨가, 손이, 얼굴이 반투명하게 흐려졌다가 돌아왔다. 다시 한 번. 이번엔 더 길게.<\/p>\n<p>\"제하?\"<\/p>\n<p>그가 오른손을 들었다. 장갑이 저절로 벗겨져 물 위로 떨어졌다. 손등에서 손목까지 이어진 흉터들이 하얗게 빛나고 있었다. 타들어 가는 종이처럼, 가장자리부터.<\/p>\n<p>\"원장님이야.\"<\/p>\n<p>그가 말했다. 이상할 만큼 침착하게.<\/p>\n<p>\"이름 나머지 절반. 지금 지우고 있어.\"<\/p>\n<p>\"멈추게 해. 어떻게든—\"<\/p>\n<p>\"못 해. 저당 잡힌 건 그쪽이 쥐고 있어.\"<\/p>\n<p>그의 손가락 끝이 투명해졌다. 내 손이 그의 손을 통과할 것 같았다. 나는 더 세게 쥐었다. 아직 잡혔다. 아직.<\/p>\n<p>제하가 나를 봤다. 그 회색 눈이, 처음으로 겁에 질려 있었다.<\/p>\n<p>\"하루야.\"<\/p>\n<p>그가 무릎을 꺾었다. 물이 튀었다.<\/p>\n<p>\"내 이름 — 기억해 줘.\"<\/p>","chars":4705},{"title":"내가 쓴 편지","html":"<p>[낙명제 6일째 · 마감까지 8시간]<\/p>\n<p>\"윤제하.\"<\/p>\n<p>몇 번째인지 모른다. 백 번은 넘었다. 천 번일지도 모른다.<\/p>\n<p>\"윤제하. 윤제하. 윤제하.\"<\/p>\n<p>목이 쉬었다. 목소리가 갈라지다 못해 바람 소리만 났다. 그래도 멈추지 않았다.<\/p>\n<p>이름이 지워지는 사람을 붙잡는 방법. 도준이 알려 줬다. 그의 아버지가 말소되던 날, 집안사람 전부가 아버지를 잊었는데 도준만 사흘을 버텼다고. 밤새 아버지 이름을 불렀다고. 불리는 동안은, 지워지는 게 느려진다고.<\/p>\n<p>\"윤제하.\"<\/p>\n<p>펌프실 바닥에 눕힌 그의 몸은 절반쯤 투명했다. 가슴 아래로는 콘크리트 바닥의 균열이 비쳐 보였다. 하지만 거기서 멈춰 있었다. 몇 시간째, 더 지워지지도 돌아오지도 않은 채.<\/p>\n<p>내 팔에는 그의 이름이 빼곡했다. 도준에게 볼펜을 빌렸다. 손목에서 어깨까지. 윤제하. 윤제하. 윤제하. 혹시 내가 잠들어도, 깨어나서 제일 먼저 볼 수 있게.<\/p>\n<p>\"……시끄러워.\"<\/p>\n<p>그가 눈을 감은 채 중얼거렸다.<\/p>\n<p>\"닥쳐. 윤제하.\"<\/p>\n<p>입꼬리가 아주 조금 올라갔다. 나는 그걸 보려고 또 불렀다.<\/p>\n<p>펌프실 구석에서 세아가 졸고 있었다. 해원은 문 앞에서 보초를 섰다. 도준은 팔뚝의 내 이름을 손가락으로 덧그리며 혼잣말을 했다. 강하루, 목숨 빚, 강하루. 둘이서 서로 다른 이름을 주문처럼 외는 방은 꼭 이상한 기도실 같았다.<\/p>\n<p>\"야, 하루.\" 도준이 고개를 들었다. \"너 아까부터 한 번도 안 쉬었어. 물이라도 마셔.\"<\/p>\n<p>그가 물병을 던졌다. 녹 맛이 나는 물이었다. 목구멍이 갈라진 데로 차갑게 스며들었다. 나는 한 모금 마시고, 다시 불렀다.<\/p>\n<p>\"윤제하.\"<\/p>\n<p>\"……그거 이름 맞긴 해?\" 도준이 물었다. \"원장이 붙인 이름이라며. 원래 이름은 반쯤 지워졌다며.\"<\/p>\n<p>손이 멈췄다. 그랬다. 윤제하는 그의 진명이 아니었다.<\/p>\n<p>\"그래도.\" 나는 다시 그의 손을 쥐었다. \"얘가 17년 동안 대답한 이름이야. 불리면 돌아본 이름. 그럼 그게 이름이지.\"<\/p>\n<p>제하가 눈을 감은 채 말했다. \"……맞아.\"<\/p>\n<p>그의 투명해진 가슴 언저리가, 아주 조금, 짙어졌다. 착각일지도 몰랐다. 하지만 나는 그 착각에 매달렸다.<\/p>\n<hr class=\"scene\">\n<p>그의 오른손을 쥐고 있었다. 맨손. 흉터투성이의 손.<\/p>\n<p>손등의 긁힌 자국들은 하나하나가 지운 이름이라고 했다. 그는 그걸 세지 않는다고 했다. 세면 잠을 못 잔다고.<\/p>\n<p>나는 엄지로 흉터를 쓸었다. 손목 쪽으로. 가장 오래된 흉터. 다른 것들보다 하얗고, 깊고, 반듯했다.<\/p>\n<p>엄지가 멈췄다.<\/p>\n<p>손목 안쪽, 왼쪽 위에서 오른쪽 아래로. 처음엔 가늘게 시작해 점점 굵어지다가, 끝에서 칼날처럼 넓게 퍼지며 멈추는 획.<\/p>\n<p>파임.<\/p>\n<p>서예 시간에 한 번도 배운 적 없는데, 이제는 안다. 엿새 동안 모은 일곱 개의 획이 머릿속에서 그 마지막 하나를 기다리고 있었으니까.<\/p>\n<p>\"이거.\"<\/p>\n<p>목소리가 안 나왔다. 다시 말했다.<\/p>\n<p>\"이거, 언제 생긴 거야.\"<\/p>\n<p>제하가 눈을 떴다. 자기 손목을 내려다봤다.<\/p>\n<p>\"……첫 집행 날. 그 여자가 내 손목을 잡았어. 이름이 다 지워지기 직전에. 손톱으로 그었어. 아팠어.\"<\/p>\n<p><em>괜찮아, 넌 나중에 그 애를 알아볼 거야.<\/em><\/p>\n<p>엄마는 여덟 살 아이의 손목에 마지막 획을 남겼다. 자기를 지우는 아이에게. 그 아이가 언젠가 딸을 알아보고, 딸이 그 아이를 붙잡게 될 걸 알고.<\/p>\n<p>책(磔). 여덟 번째 획.<\/p>\n<hr class=\"scene\">\n<p>나는 눈을 감았다.<\/p>\n<p>점. 편의점 새벽, 빈 명패 뒷면의 먹점 하나.<\/p>\n<p>가로. 금서고 선반 위의 가로선.<\/p>\n<p>세로. 폐역 환기구를 타고 내려가던 긴 세로획.<\/p>\n<p>갈고리. 쪽지 서명 끝에 걸린 갈고리.<\/p>\n<p>치킴. 투표장 천장에서 오른쪽 위로 치켜 올라가던 문양.<\/p>\n<p>긴 삐침. 일곱 계단 아래, 왼쪽으로 길게 누운 홈.<\/p>\n<p>짧은 삐침. 도준의 타버린 명패 위, 쪼아 올린 그을음.<\/p>\n<p>파임. 제하의 손목.<\/p>\n<p>어둠 속에서 여덟 개의 획이 떠올랐다. 하나씩 자리를 찾아갔다. 점이 위에 앉고, 가로와 세로가 갈고리로 이어지고, 양옆으로 삐침과 파임이 날개처럼 펼쳐졌다.<\/p>\n<p>한 글자.<\/p>\n<p>永.<\/p>\n<p>영원할 영.<\/p>\n<p>웃음이 터졌다. 쉰 목에서 이상한 소리가 났다. 웃다가, 그대로 울음이 됐다. 제하가 놀라서 몸을 일으키려다 다시 쓰러졌다.<\/p>\n<p>\"하루야?\"<\/p>\n<p>\"하루래.\"<\/p>\n<p>나는 손등으로 눈을 문질렀다. 소용없었다.<\/p>\n<p>\"보육원 원장님이 붙여 준 이름이야. 하루만 기억되는 애라서 하루. 근데 엄마가 지어 준 이름은, 영원이래.\"<\/p>\n<p>하루와 영원. 열여덟 해 동안 하루씩 잊히며 살았던 아이의 진짜 이름이, 영원이었다.<\/p>\n<p>성은 아직 몰랐다. 남궁일까. 진명은 글자 하나가 아니라 전부여야 했다. 그 전부는 최초의 명부에만 있다고, 원장실의 문서가 그랬다.<\/p>\n<p>그래도 나는 처음으로, 내 이름의 한가운데를 손에 쥐고 있었다.<\/p>\n<hr class=\"scene\">\n<p>펌프실 문이 조심스럽게 열렸다.<\/p>\n<p>은솔이었다. 이중 스파이가 된 지 일곱 시간. 그 애는 명경 파편을 두 손으로 꼭 쥐고 있었다.<\/p>\n<p>\"언니. 연락이 왔어요. 원장님한테서.\"<\/p>\n<p>\"뭐라는데.\"<\/p>\n<p>은솔이 파편을 내밀었다. 표면에 글자가 떠 있었다. 단정하고 온화한 필체.<\/p>\n<p><em>49번에게 전하거라. 직접 만나자꾸나. 원장실. 오면, 제하의 말소를 멈추마.<\/em><\/p>\n<p>제하가 내 손목을 잡았다. 투명해진 손가락으로.<\/p>\n<p>\"가지 마.\"<\/p>\n<p>\"멈춘대.\"<\/p>\n<p>\"그 사람은 거짓말 안 해. 그래서 더 위험해. 멈추긴 할 거야. 그다음에 뭘 할지는 말 안 했잖아.\"<\/p>\n<p>세아가 졸다가 깨어 파편을 들여다봤다. 그녀의 얼굴이 굳었다.<\/p>\n<p>\"아버지 글씨야. 진짜로.\" 그녀가 손끝으로 글자를 짚었다. \"우리 아버지는 협박할 때도 '꾸나'를 붙여. 어릴 때 내가 꽃병 깼을 때도 그랬어. 다시는 그러지 말자꾸나. 그러고 나서 내 방 문을 한 달 동안 밖에서 잠갔어.\"<\/p>\n<p>아무도 웃지 않았다.<\/p>\n<p>\"가면 안 돼, 하루. 그 사람은 원하는 걸 받으면 문을 닫는 사람이야.\"<\/p>\n<p>\"근데 지금 원하는 게 나잖아.\"<\/p>\n<p>\"그러니까!\"<\/p>\n<p>\"그러니까 내가 가야 문이 열리지.\"<\/p>\n<p>세아가 입을 다물었다. 은솔이 파편을 쥔 손을 떨었다. 해원은 문 앞에서 처음으로 나를 돌아봤다. 손톱 대신 입술을 깨물면서.<\/p>\n<p>나는 그의 손을 내 손으로 덮었다.<\/p>\n<p>\"알아.\"<\/p>\n<p>\"하루야.\"<\/p>\n<p>\"그러니까, 내가 이름 불러 줄 사람이 필요하잖아.\"<\/p>\n<p>나는 도준을 돌아봤다. 그는 펌프실 구석에 쪼그려 앉아 팔뚝의 글씨를 내려다보고 있었다. 강하루. 목숨 빚. 절대 잊지 마.<\/p>\n<p>\"도준아. 내가 없는 동안, 얘 이름 불러 줘.\"<\/p>\n<p>\"……나 쟤 싫어하는데.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"지우개랑 썸 타는 거 미친 거 아는데.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>도준이 한숨을 쉬고, 제하 옆에 털썩 앉았다.<\/p>\n<p>\"윤제하. 윤제하. 아 진짜 이름 부르기 싫게 생겼네. 윤제하.\"<\/p>\n<hr class=\"scene\">\n<p>원장실은 고요했다.<\/p>\n<p>백단향. 촛불. 찻잔에서 오르는 김. 어제 새벽 도준과 함께 서랍을 뒤졌던 그 방이 아무 일 없었다는 듯 정돈되어 있었다.<\/p>\n<p>남궁현은 차를 따르고 있었다. 찻물이 잔에 떨어지는 소리가 맑았다.<\/p>\n<p>\"앉으렴.\"<\/p>\n<p>나는 앉지 않았다. 그는 개의치 않았다. 내 앞에 찻잔을 놓았다. 재스민 향이 났다.<\/p>\n<p>방 한쪽 벽이 명경이었다. 그 안에 일곱 개의 먹점이 떠 있었다. 칠명회의 문장. 그 아래 붉은 숫자 — 08:00:00. 07:59:59. 원장실에서도 시간은 깎여 나가고 있었다.<\/p>\n<p>나는 숫자에서 눈을 떼고 그를 봤다.<\/p>\n<p>\"제하는.\"<\/p>\n<p>\"멈췄단다. 네가 문을 연 순간. 약속은 지켜야지.\"<\/p>\n<p>그는 정말로 다정하게 웃었다. 삼촌의 얼굴로. 그게 제일 소름 끼쳤다.<\/p>\n<p>나는 주머니에서 쪽지를 꺼냈다. 사흘 전 밤, 명경을 통해 떨어진 후원 물품 속에 있던 것. 탄 첫 글자. <em>■야. 너는 하루가 아니란다. 지우개를 믿지 마라.<\/em><\/p>\n<p>탁자 위에 내려놓았다.<\/p>\n<p>원장의 시선이 쪽지에 머물렀다. 한참.<\/p>\n<p>\"엄마 글씨인 줄 알았어요.\"<\/p>\n<p>\"그랬겠지.\"<\/p>\n<p>\"금서고 기록부의 엄마 서명이랑 똑같았으니까. 획 모양도, 기울기도, 먹의 농도도.\"<\/p>\n<p>나는 쪽지를 원장 쪽으로 밀었다.<\/p>\n<p>\"그런데 오늘 펌프실에서 여덟 획을 하나하나 다시 그려 봤어요. 손가락으로, 몇 번이고. 그러다 알았어요. 가로획.\"<\/p>\n<p>쪽지의 '하' 자. 첫 가로획의 시작점에 먹이 살짝 고여 있었다. 오른쪽 끝에.<\/p>\n<p>\"엄마는 가로획을 왼쪽에서 오른쪽으로 그었어요. 기록부 서명 전부 다. 시작점에 먹이 고이는 쪽이 왼쪽이에요. 근데 이건 오른쪽에서 시작했어요. 반대로.\"<\/p>\n<p>원장은 아무 말도 하지 않았다.<\/p>\n<p>\"누군가 엄마 글씨를 거꾸로 따라 그린 거예요. 거울을 보면서 연습한 것처럼.\"<\/p>\n<p>남궁현이 찻잔을 들었다. 한 모금 마셨다. 내려놓았다. 찻잔이 받침에 닿는 소리가 너무 작아서, 오히려 귀가 아팠다.<\/p>\n<p>그리고 그가 웃었다.<\/p>\n<p>\"그 필체, 꽤 연습했단다.\"<\/p>\n<hr class=\"scene\">\n<p>피가 식는 느낌이 들었다. 손끝부터.<\/p>\n<p>\"연이는 어릴 때부터 글씨가 좋았지. 나는 늘 그 애 글씨를 흉내 냈단다. 그 애가 왼쪽에서 오른쪽으로 쓸 때, 나는 맞은편에 앉아서 보았거든. 그래서 거꾸로 배웠지.\"<\/p>\n<p>그는 쪽지를 집어 촛불 가까이 들었다.<\/p>\n<p>\"획을 모으게 하고 싶었단다. 네가 스스로 이름에 다가가야 했으니까. 명부는 억지로 열리지 않아. 열쇠가 자기 모양을 알아야 하지.\"<\/p>\n<p>\"그리고 지우개를 믿지 말라고.\"<\/p>\n<p>\"제하는 쓸 만한 아이였는데, 너를 보고 망가졌더구나. 떼어 놓고 싶었다. 실패했지만.\" 그가 어깨를 으쓱했다. \"결과는 같으니 괜찮다. 너는 여덟 획을 다 모았고, 여기에 왔다.\"<\/p>\n<p>쪽지 끝이 촛불에 닿았다. 불이 붙었다. 엄마의 것이 아닌 엄마의 글씨가, 오그라들며 재가 됐다.<\/p>\n<p>\"永. 예쁜 이름이지. 연이가 지었단다. 나도 그 자리에 있었어.\"<\/p>\n<p>\"엄마도 그때 웃었어요? 제하한테 지워질 때처럼?\"<\/p>\n<p>원장의 손이 잠깐 멈췄다. 아주 잠깐. 촛불이 흔들렸다.<\/p>\n<p>\"……울었단다. 너를 안고서. 그게 그 애가 운 마지막이었지.\"<\/p>\n<p>나는 일어서려 했다.<\/p>\n<p>그가 손가락을 튕겼다.<\/p>\n<p>딱.<\/p>\n<p>찻잔이 기울었다. 재스민 차가 탁자 위로 쏟아져 내 손등을 적셨다. 뜨거웠다.<\/p>\n<p>발밑의 바닥이 사라졌다. 카펫도, 나무 바닥도, 그 아래 돌도. 이름이 지워진 것처럼, 그냥 없어졌다. 몸이 허공에 떴다. 위장이 목구멍까지 치솟았다.<\/p>\n<p>떨어지는 나를, 원장이 탁자 너머에서 내려다봤다.<\/p>\n<p>여전히 다정한 얼굴로.<\/p>\n<p>\"어서 오렴, 영아.\"<\/p>\n<p>어둠이 나를 삼켰다.<\/p>\n<p>\"아니 — 열쇠야.\"<\/p>","chars":4687},{"title":"의식","html":"<p>[낙명제 6일째 · 마감까지 3시간]<\/p>\n<p>차가웠다.<\/p>\n<p>뺨에 닿은 돌바닥이 얼음처럼 차가웠고, 코끝에는 오래된 종이 냄새가 났다. 습기 먹은 먹 냄새. 금서고에서 맡았던 것보다 백 배는 진한.<\/p>\n<p>눈을 떴다.<\/p>\n<p>천장이 없었다. 아니, 너무 높아서 보이지 않았다. 어둠 속 까마득한 위에서 희미한 빛이 비 오듯 떨어지고 있었다.<\/p>\n<p>나는 숫자를 셌다. 하나, 둘, 셋.<\/p>\n<p>손가락이 움직였다. 발가락도. 살아 있었다.<\/p>\n<p>몸을 일으키자 홀 전체가 눈에 들어왔다. 거대한 원형 홀이었다. 바닥에는 동그랗게 홈이 패어 있었다. 손바닥만 한 크기의 홈. 명패 모양.<\/p>\n<p>세어 보았다. 마흔아홉 개.<\/p>\n<p>그리고 홀 한가운데.<\/p>\n<p>사람 키만 한 책이 서 있었다. 누운 게 아니라, 서 있었다. 검은 가죽 표지에 금박도 제목도 없었다. 그냥 닫힌 책. 그런데 그걸 보는 순간 등줄기를 따라 식은땀이 한 줄기 흘러내렸다.<\/p>\n<p>숨을 쉬고 있는 것 같았다. 그 책이.<\/p>\n<p>\"최초의 명부란다.\"<\/p>\n<p>목소리가 뒤에서 들렸다. 부드럽고 다정한, 잠자리에서 동화를 읽어주는 삼촌 같은 목소리.<\/p>\n<p>돌아보지 않았다. 대신 사방을 보았다.<\/p>\n<p>거울. 거울. 거울.<\/p>\n<p>홀의 벽면을 따라 명경이 수백 개 떠 있었다. 크기도 모양도 제각각인 거울들이 층층이 원을 그리며 나를 비추고 있었다. 아니, 나를 비추려 애쓰고 있었다. 거울 속의 나는 늘 그렇듯 번진 수채화처럼 흐릿했다.<\/p>\n<p>그 거울 너머에 칠명가 귀족 전부가 있다는 걸 나는 알았다.<\/p>\n<p>와인잔을 들고, 소파에 기대서, 이 쇼를 보고 있겠지.<\/p>\n<p>\"일어나렴, 영아. 바닥이 차구나.\"<\/p>\n<p>원장 남궁현이 손을 내밀었다. 회색 양복, 은테 안경, 주름 하나 없는 미소. 나는 그 손을 잡지 않고 혼자 일어났다. 무릎이 한 번 휘청했지만 버텼다.<\/p>\n<p>\"제하는요.\"<\/p>\n<p>\"살아 있다.\"<\/p>\n<p>\"약속했잖아요. 내가 오면 멈춘다고.\"<\/p>\n<p>\"멈췄지.\" 원장이 고개를 기울였다. \"지우기를 멈췄다고 했지, 되돌린다고는 안 했단다.\"<\/p>\n<p>\"말장난이네요.\"<\/p>\n<p>\"규칙이란 원래 말이란다, 영아. 너도 열쇠 문 하나로 여럿을 들여보냈다지. 같은 원리야.\"<\/p>\n<p>배 속이 차갑게 뒤틀렸다. 그는 다 보고 있었다. 첫날부터. 공시마다, 내가 룰의 문구를 비틀 때마다, 명경 너머에서 흐뭇하게.<\/p>\n<p>\"그 이름도 그만 불러요. 영이라고.\"<\/p>\n<p>\"왜? 네 이름인데.\"<\/p>\n<p>\"당신이 준 거 아니잖아요.\"<\/p>\n<p>원장은 대답 대신 웃었다. 귀여운 조카의 투정을 듣는 얼굴로.<\/p>\n<p>그가 손짓했다.<\/p>\n<p>홀의 가장자리, 어둠이 걷히는 곳에 사람들이 서 있었다.<\/p>\n<p>아니, 끌려와 있었다.<\/p>\n<p>은색 장갑을 낀 집행관들이 참가자들의 팔을 하나씩 붙들고 홀 둘레를 따라 세우고 있었다. 남궁세아가 보였다. 입술이 터져 피가 말라붙어 있었지만 턱은 꼿꼿했다. 곽태산은 집행관 둘에게 양팔이 잡혀 있었다. 그 거구가 어깨를 비틀 때마다 집행관들의 구두가 바닥에서 미끄러졌다.<\/p>\n<p>은솔. 은솔은 고개를 숙이고 있었다.<\/p>\n<p>그리고 도준.<\/p>\n<p>도준의 팔은 소매가 걷혀 있었다. 손목부터 팔꿈치까지 볼펜 글씨가 빼곡했다. 멀어서 읽히지 않았지만 나는 알았다. 거기 뭐라고 쓰여 있는지.<\/p>\n<p>내 이름.<\/p>\n<p>도준이 나를 찾았다. 눈이 마주쳤다. 그가 입 모양으로 뭔가를 말했다.<\/p>\n<p>'괜, 찮, 아?'<\/p>\n<p>나는 아주 작게 고개를 끄덕였다. 거짓말이었다.<\/p>\n<p>마지막으로, 홀 맞은편.<\/p>\n<p>집행관 넷에게 둘러싸인 채 무릎 꿇은 사람.<\/p>\n<p>윤제하는 반쯤 투명했다. 등 뒤의 횃불 빛이 그의 몸을 통과해 바닥에 그림자 대신 희미한 얼룩만 남겼다. 그가 고개를 들었다. 회색 눈동자만은 선명했다.<\/p>\n<p>그 눈이 나를 보았다. 그리고 천천히, 아주 천천히 고개를 저었다.<\/p>\n<p>하지 마.<\/p>\n<p>심장이 갈비뼈 안쪽을 세게 걷어찼다.<\/p>\n<p>종이 울렸다. 깊고 낮은, 뱃속까지 울리는 종소리였다.<\/p>\n<p>원장이 홀 중앙의 단상으로 걸어 올라갔다. 명경 수백 개가 일제히 그에게로 초점을 돌렸다. 그의 목소리가 거울들을 타고 증폭되어 홀을 채웠다.<\/p>\n<p>\"칠명가의 여러분. 그리고 이 자리까지 살아남은, 자랑스러운 참가자 여러분.\"<\/p>\n<p>다정한 목소리였다. 입학식 축사 같은.<\/p>\n<p>\"오늘 밤 자정, 낙명제가 끝납니다. 여러분은 이제 명부원의 이름을 받게 될 것입니다. 이 최종 공시는 여러분을 최초의 명부 앞에 세워, 여러분의 이름을 영원히 기록하는 의식입니다.\"<\/p>\n<p>박수 소리가 났다. 명경 너머에서. 얇고 먼, 장갑 낀 손들이 부딪치는 소리.<\/p>\n<p>참가자 몇몇의 얼굴이 풀어졌다. 끝났다. 살았다. 입학이다. 그런 얼굴들.<\/p>\n<p>세아만은 아니었다. 세아는 이미 알았다. 그 명단에 자기 이름이 있었다는 걸.<\/p>\n<p>원장이 단상에서 내려왔다. 그리고 내 옆에 섰다. 명경들이 우리를 비췄지만, 그가 손가락을 한 번 까딱하자 우리 둘 주위의 공기가 물처럼 일렁였다. 소리가 막혔다. 귀가 먹먹해졌다.<\/p>\n<p>\"이제 우리 둘만 들린단다.\"<\/p>\n<p>그가 책을 올려다보았다.<\/p>\n<p>\"영아. 저 책은 빈 페이지만이 열 수 있다. 칠명회는 사백 년 동안 빈 페이지를 만들려고 애썼지. 이름을 거두고, 또 거두고. 7년마다 마흔아홉 개씩.\"<\/p>\n<p>\"…수확.\"<\/p>\n<p>\"그래. 그런데 거둔 이름으로는 페이지가 채워질 뿐, 비지는 않더구나. 진짜 빈 페이지는 태어나야 했다. 이름 없이 태어난 아이. 무명.\"<\/p>\n<p>그가 나를 보았다. 안경 너머 눈이 젖어 있었다. 연기인지 진심인지 알 수 없었다.<\/p>\n<p>\"네 엄마가 그걸 알고 너를 지웠다. 너를 숨기려고. 그 대가로 칠명회가 그 아이를 지웠고.\"<\/p>\n<p>\"당신이 서명했잖아요.\"<\/p>\n<p>원장의 미소가 아주 잠깐 굳었다.<\/p>\n<p>\"…그래. 내가 서명했다. 그러니 내가 바로잡을 거다.\"<\/p>\n<p>그가 내 어깨에 손을 얹었다. 따뜻한 손이었다. 그게 더 끔찍했다.<\/p>\n<p>\"명부가 열리면 마흔아홉 개의 이름이 바쳐진다. 그 힘으로 나는 한 줄을 쓸 수 있지. 남궁연. 네 엄마의 이름을.\"<\/p>\n<p>숨이 멎었다.<\/p>\n<p>\"네 엄마를 돌려주마, 영아. 너는 그냥 페이지가 되기만 하면 된다. 아프지 않다. 약속하마.\"<\/p>\n<p>엄마.<\/p>\n<p>사진 속 얼굴이 떠올랐다. 금서고에서, 빛바랜 흑백 사진 속에서 나와 똑같은 눈매로 웃던 여자.<\/p>\n<p>열여덟 해 동안 나는 매일 아침 처음 보는 사람이었다. 사장에게도, 담임에게도, 반 아이들에게도. 단 한 사람이라도 나를 아침에 알아봐 주길 바랐다. \"왔니?\" 그 한마디.<\/p>\n<p>엄마라면.<\/p>\n<p>엄마라면 처음부터 나를 알 것이다. 잊을 리가 없다. 나를 낳은 사람이니까.<\/p>\n<p>손끝이 떨렸다. 입 안에 쓴 침이 고였다. 무릎 안쪽이 물처럼 풀렸다.<\/p>\n<p>시선을 돌렸다. 홀 둘레의 얼굴들.<\/p>\n<p>도준. 내일 아침이면 나를 또 모를 도준. 그런데도 팔에 내 이름을 빼곡하게 적은 도준.<\/p>\n<p>은솔. 나를 팔았고, 그래서 울었던 은솔. 동생 이름을 되찾고 싶었던 열일곱 살.<\/p>\n<p>세아. 나를 배신했고, 피투성이로 돌아와 사촌이라고 불렀던 세아.<\/p>\n<p>곽태산. 첫날 내 명패를 뜯었던, 거짓말도 못 하는 바보 같은 거인.<\/p>\n<p>마흔아홉 개의 이름.<\/p>\n<p>그리고 엄마 하나.<\/p>\n<p>보육원 시절이 떠올랐다. 어린이날마다 누군가의 엄마들이 과자 상자를 들고 왔다. 아이들은 창문에 코를 박고 자기 차례를 기다렸다. 나는 늘 맨 뒤에 섰다. 앞에 서 봤자, 다음 해엔 아무도 나를 기억하지 못했으니까.<\/p>\n<p>일곱 살 때 한 번, 원장 선생님한테 물었다. 우리 엄마도 날 잊었을까요.<\/p>\n<p>선생님은 대답 대신 내 이름표를 고쳐 달아주었다. 그리고 다음 날, 내 이름을 다시 물었다.<\/p>\n<p>그날부터 묻지 않았다.<\/p>\n<p>\"세아도 명단에 있죠.\"<\/p>\n<p>내 입이 먼저 움직였다. 원장의 눈썹이 아주 조금 올라갔다.<\/p>\n<p>\"당신 딸이요. 저기 서 있는. 걔도 바치는 거잖아요.\"<\/p>\n<p>\"세아는 강한 이름이다.\" 원장이 담담하게 말했다. \"강한 이름일수록 페이지를 오래 붙잡지. 그 아이도 이해할 거다. 남궁가의 딸이니까.\"<\/p>\n<p>이해할 거다.<\/p>\n<p>그 말이 이상하게 귀에 걸렸다. 사랑한다는 말 대신, 이해할 거라는 말. 세아가 열아홉 해 동안 들었을 말.<\/p>\n<p>나는 홀 저편의 세아를 보았다. 세아는 아버지를 보지 않고 있었다. 일부러, 끝까지.<\/p>\n<p>\"생각할 시간은 많지 않단다.\" 원장이 손목시계를 보았다. \"자정까지 세 시간도 안 남았지. 그리고 너는 명패가 없어. 자정이 되면 어차피 너는 사라진다. 아무것도 남기지 못하고.\"<\/p>\n<p>그가 덧붙였다. 아주 부드럽게.<\/p>\n<p>\"아니면 엄마를 남기고 사라지든지.\"<\/p>\n<p>홀 맞은편에서 제하가 몸을 일으키려 했다. 집행관 하나가 그의 어깨를 짓눌렀다. 그가 다시 무릎을 꿇었다. 투명한 손가락이 바닥을 긁었다. 손톱 소리 대신, 아무 소리도 나지 않았다.<\/p>\n<p>그가 입을 열었다. 내 이름을 부르는 입 모양이었다.<\/p>\n<p>하루야.<\/p>\n<p>엄마가 부를 이름은 그게 아닐 것이다. 엄마는 나를 영이라고 부를 것이다. 하루는 보육원 원장이 붙여준 이름이고, 하루만 기억되라는 이름이니까.<\/p>\n<p>그런데 그 이름을 일주일 내내 불러준 사람이 저기 무릎 꿇고 있었다.<\/p>\n<p>나는 머리핀을 만졌다.<\/p>\n<p>오른쪽 귀 위, 싸구려 검은 실핀. 그 안쪽에 손톱만 하게 접힌 종이가 붙어 있었다. 도준이 원장실로 가기 전 내 머리에 꽂아주며 했던 말이 귓가에 남아 있었다.<\/p>\n<p>'녹음 부적이야. 고물상 할아버지가 쓰던 거. 삼십 분짜리. 대신 한 번 쓰면 끝.'<\/p>\n<p>'그걸로 뭘 하게.'<\/p>\n<p>'몰라. 그냥. 그 아저씨가 뭔 말을 하든 증거는 남겨야지. 우리 아빠 때는 아무것도 안 남았거든.'<\/p>\n<p>손끝에 닿은 종이가 미지근했다. 아직 타지 않았다. 작동 중이었다.<\/p>\n<p>원장이 두른 소리의 막 안에서, 원장이 한 말 전부가 이 손톱만 한 종이에 새겨지고 있었다.<\/p>\n<p>나는 숨을 깊게 들이마셨다. 종이 냄새, 먹 냄새, 차가운 돌 냄새. 그리고 어딘가에서 희미하게, 타는 밀랍 냄새.<\/p>\n<p>원장이 손짓하자 소리의 막이 걷혔다. 홀의 소음이 귀로 쏟아져 들어왔다. 참가자들의 웅성거림, 집행관들의 장갑이 스치는 소리, 명경 너머 귀족들의 수군거림.<\/p>\n<p>\"자, 영아. 모두에게 들려주렴. 네 대답을.\"<\/p>\n<p>명경 수백 개가 나를 향했다. 흐릿한 나를 어떻게든 선명하게 잡으려고 거울 표면이 물결쳤다.<\/p>\n<p>나는 고개를 들었다.<\/p>\n<p>도준이 고개를 미친 듯이 저었다. 세아가 이를 악물었다. 태산이 뭔가를 고함쳤다. 제하는 — 제하는 눈을 감았다.<\/p>\n<p>\"할게요.\"<\/p>\n<p>내 목소리는 생각보다 또렷했다.<\/p>\n<p>\"엄마를 돌려줘요. 내가 페이지가 될게요.\"<\/p>\n<p>\"하루야, 안 돼! 야, 강하루!\"<\/p>\n<p>도준의 비명이 홀을 갈랐다. 집행관이 그의 입을 틀어막았다.<\/p>\n<p>원장이 웃었다. 처음으로, 진짜로 기뻐하는 얼굴이었다. 그가 두 팔을 벌렸다. 명경 너머에서 박수가 쏟아졌다.<\/p>\n<p>나는 원장을 보지 않았다.<\/p>\n<p>원장의 등 뒤, 그의 시야가 닿지 않는 각도.<\/p>\n<p>고개를 숙이고 있던 은솔이 천천히 고개를 들었다.<\/p>\n<p>우리의 눈이 마주쳤다.<\/p>\n<p>은솔의 소매 끝에서, 원장이 쥐여준 명경 파편이 아주 작게 깜박였다.<\/p>","chars":4926},{"title":"명경 탈취","html":"<p>[낙명제 6일째 · 마감까지 1시간 20분]<\/p>\n<p>거짓말이었다.<\/p>\n<p>\"할게요\"는 내가 열여덟 해 동안 한 거짓말 중에 제일 큰 거짓말이었다. 그리고 제일 잘한 거짓말이었다.<\/p>\n<p>원장은 믿었다. 믿고 싶었으니까. 사람은 원하는 대답 앞에서 제일 쉽게 눈이 먼다. 편의점 야간 알바를 2년 하면 그 정도는 안다. 유통기한 지난 삼각김밥을 \"방금 들어온 거예요\" 하면 다들 믿는 것처럼.<\/p>\n<p>\"좋다. 착한 아이구나.\"<\/p>\n<p>원장이 손을 들었다. 집행관들이 움직이기 시작했다.<\/p>\n<p>\"참가자들을 자리로.\"<\/p>\n<p>은색 장갑들이 참가자들의 등을 떠밀었다. 바닥의 마흔아홉 개 홈을 향해. 한 명씩, 홈 하나에 하나씩. 명패를 홈에 끼우는 순간 그 사람의 이름은 책으로 흘러 들어갈 것이다.<\/p>\n<p>참가자들이 웅성거렸다. 입학식이라더니, 이게 뭐야. 왜 명패를 빼. 누군가 버티다가 집행관에게 팔이 꺾였다. 비명.<\/p>\n<p>나는 숫자를 셌다. 원장의 계획이 아니라, 우리의 계획을.<\/p>\n<p>열다섯 시간 전, 원장실에 가기 직전. 배수로 끝 창고에서 우리 넷이 머리를 맞댔었다. 나, 도준, 세아, 은솔.<\/p>\n<p>'원장은 내가 아직 자기 편인 줄 알아요.' 은솔이 소매에서 손톱만 한 거울 조각을 꺼냈었다. '이거, 원장님 명경이랑 연결돼 있어요. 위치 보내라고 준 거예요. 근데 반대로도 돼요. 여기다 뭘 비추면, 원장님 쪽 명경 전부에 떠요.'<\/p>\n<p>'전부?' 세아가 물었었다.<\/p>\n<p>'전부요. 원래 원장님이 공지할 때 쓰는 거니까.'<\/p>\n<p>그때 도준이 손을 들었다. 학교에서 질문하는 애처럼.<\/p>\n<p>'그럼 소리도 돼?'<\/p>\n<p>도준이 꺼낸 건 꼬깃꼬깃 접힌 부적 두 장이었다. 한 장은 내 머리핀에. 한 장은 자기 주머니에. 짝 부적. 한쪽에 새겨진 소리가 다른 쪽에서 재생된다.<\/p>\n<p>'5일째 아침에 원장실 들어갔을 때, 나 혼자 하나 더 붙여놨었거든. 책상 밑에. 노트엔 써놨는데 너한테 말하는 걸 까먹었어. 미안. 근데 그거 쓸 만한 게 하나도 안 찍혔어. 아저씨가 혼잣말을 안 해서.'<\/p>\n<p>'그럼 이번엔 하게 만들어야지.' 내가 말했었다. '나한테만.'<\/p>\n<p>그래서 나는 원장실로 걸어 들어갔다. 사로잡힐 걸 알면서. 그는 나를 아끼는 척할 것이고, 아끼는 척하는 사람은 비밀을 속삭이고 싶어 하니까.<\/p>\n<p>그리고 그는 속삭였다. 소리의 막 안에서. 머리핀 하나 거리에서.<\/p>\n<p>지금, 집행관이 도준을 홈 쪽으로 밀었다. 도준이 넘어지는 척 비틀거렸다. 실제로 넘어졌다. 진짜 넘어진 건지 연기인지 모를 정도로 요란하게. 바닥을 구르며 그가 은솔의 발목을 잡았다.<\/p>\n<p>\"으악, 죄송해요, 죄송해요! 다리에 쥐가!\"<\/p>\n<p>집행관이 혀를 차며 도준의 목덜미를 잡아 일으켰다. 그 3초 동안, 도준의 손에서 은솔의 손으로 꼬깃한 종이 하나가 건너갔다.<\/p>\n<p>은솔이 소매 안에서 그걸 거울 조각에 눌렀다.<\/p>\n<p>순간 내 머리핀이 뜨거워졌다. 두피가 따끔할 정도로. 부적이 마지막 힘을 토해내고 있었다.<\/p>\n<p>그리고 홀의 명경 수백 개가 동시에 하얗게 번쩍였다.<\/p>\n<p>\"— 명부가 열리면 마흔아홉 개의 이름이 바쳐진다.\"<\/p>\n<p>원장의 목소리였다.<\/p>\n<p>다정하고 부드러운, 동화를 읽어주는 삼촌의 목소리. 그 목소리가 거울 수백 개에서 동시에 울려 퍼졌다. 홀 벽을 때리고, 천장 없는 어둠으로 솟구쳤다가, 다시 쏟아졌다.<\/p>\n<p>\"그 힘으로 나는 한 줄을 쓸 수 있지. 남궁연. 네 엄마의 이름을.\"<\/p>\n<p>참가자들이 굳었다.<\/p>\n<p>\"세아는 강한 이름이다. 강한 이름일수록 페이지를 오래 붙잡지. 그 아이도 이해할 거다.\"<\/p>\n<p>명경 너머에서 박수가 뚝 끊겼다. 와인잔이 깨지는 소리 같은 게 들렸다. 어딘가의 귀족 저택에서.<\/p>\n<p>\"칠명회는 사백 년 동안 빈 페이지를 만들려고 애썼지. 이름을 거두고, 또 거두고. 7년마다 마흔아홉 개씩.\"<\/p>\n<p>원장이 천천히 돌아섰다.<\/p>\n<p>처음 보는 얼굴이었다. 미소가 없는 얼굴. 그 얼굴은 생각보다 훨씬 늙어 보였다.<\/p>\n<p>\"끄거라.\"<\/p>\n<p>집행관 하나가 가장 가까운 명경으로 달려가 손을 댔다. 거울이 꺼지지 않았다. 다른 집행관이 다른 거울에 손을 댔다. 마찬가지였다.<\/p>\n<p>\"원장님 전용 회선입니다! 원장님 파편으로만 —\"<\/p>\n<p>원장의 시선이 홀을 훑었다. 그리고 멈췄다. 은솔에게.<\/p>\n<p>은솔은 떨고 있었다. 무릎이 덜덜 흔들려서 서 있는 게 신기할 정도였다. 그런데 거울 조각을 쥔 손만은 떨리지 않았다.<\/p>\n<p>\"은솔아.\" 원장이 불렀다. 다정하게. \"동생 이름을 잊었니?\"<\/p>\n<p>\"안 잊었어요.\" 은솔의 목소리가 갈라졌다. \"별이 이름은 은별이에요. 아저씨가 지우려고 한 거. 저 매일 백 번씩 불러요. 그러니까 안 잊어요.\"<\/p>\n<p>그 순간이었다.<\/p>\n<p>\"우오오오!\"<\/p>\n<p>곽태산이 포효했다.<\/p>\n<p>양팔을 잡고 있던 집행관 둘이 동시에 허공으로 떴다. 태산이 팔을 휘두르자 둘이 바닥에 나뒹굴었다. 2미터짜리 거인이 홀 한가운데를 향해 걸어 나왔다. 발소리가 돌바닥을 울렸다.<\/p>\n<p>\"야, 원장.\"<\/p>\n<p>태산의 목소리는 단순했다. 생각한 그대로 나오는 목소리.<\/p>\n<p>\"나 첫날에 저 쪼끄만 애 명패 뜯었다. 미안하다고는 안 할 거다. 그게 룰이었으니까.\" 그가 주먹을 쥐었다. 손가락 마디가 뚝뚝 소리를 냈다. \"근데 룰 짠 놈이 사기꾼이면 얘기가 다르지. 내 명패 뺏은 놈 말고, 이 판 짠 놈 패러 간다.\"<\/p>\n<p>그가 달렸다.<\/p>\n<p>홀이 뒤집혔다.<\/p>\n<p>참가자들이 하나둘 집행관의 손을 뿌리쳤다. 일주일 동안 서로의 명패를 노리던 사람들이었다. 동맹하고 배신하고, 또 동맹하던 사람들. 그 사람들이 처음으로 같은 방향을 보았다.<\/p>\n<p>공공의 적이 바뀌었다. 태산에서, 원장으로.<\/p>\n<p>이상한 광경이었다. 사흘 전 세아에게 명패를 뜯길 뻔했던 몰명 아이가 세아의 등을 지키고 있었다. 첫날 태산에게 울며 명패를 빼앗겼던 소년이 태산이 뚫어놓은 길로 따라 뛰고 있었다. 투표장에서 나를 찍었던 스물세 명 중 누군가가, 나를 붙잡으려던 집행관의 다리에 매달려 있었다.<\/p>\n<p>아무도 서로를 용서하지 않았다. 용서할 시간이 없었다. 그냥, 지금 이 순간 적이 하나로 정해졌을 뿐이었다.<\/p>\n<p>일주일 동안 이 판이 가르쳐 준 게 그거였다. 동맹은 목표가 하나일 때만 산다. 그런데 이번 목표는 너무 커서, 아마 오늘 밤이 지나도 안 죽을 것 같았다.<\/p>\n<p>명경 너머에서도 뭔가가 무너지고 있었다. 거울 몇 개가 제멋대로 꺼졌다 켜졌다. 그 너머에서 귀족들이 서로에게 고함치는 소리가 언뜻언뜻 새어 나왔다. 수확 명단에 자기 집 아이 이름이 있었던 가문도, 아마 있었을 것이다.<\/p>\n<p>집행관 둘이 은솔 쪽으로 방향을 틀었다. 파편을 노리고.<\/p>\n<p>몰명 연합의 아이들이 집행관 하나에게 셋씩 달라붙었다. 세아의 측근 해원이 부적을 던졌다. 도준이 고물 부적 다발을 통째로 터뜨려 연막을 피웠다. 매캐한 유황 냄새가 홀을 덮었다.<\/p>\n<p>\"은솔이 뒤로!\" 도준이 소리쳤다. \"은솔이 지켜! 저거 꺼지면 끝이야!\"<\/p>\n<p>도준이 은솔 앞을 막아섰다. 다리를 후들후들 떨면서. 부적을 양손에 쥐고.<\/p>\n<p>\"나 무서워서 말 많아지는 거 알지? 지금 엄청 많아질 거야. 오지 마. 오지 마세요. 진짜 터트린다? 이거 사실 고장 난 건데 터지긴 터져!\"<\/p>\n<p>연막 너머로, 남궁세아가 걸어갔다.<\/p>\n<p>아버지를 향해.<\/p>\n<p>원장은 단상 앞에 서 있었다. 집행관들이 그를 둘러싸려 했지만, 세아가 손을 들자 원장이 오히려 집행관들을 물렸다. 딸과 아버지가 마주 섰다. 명경 수백 개가 아직 켜져 있었다. 칠명가 전부가 보고 있었다.<\/p>\n<p>\"아버지.\"<\/p>\n<p>세아의 목소리는 떨리지 않았다. 그게 더 아팠다.<\/p>\n<p>\"제가 1번이었어요. 마흔아홉 명 중에. 일주일 동안 명패 열두 개를 흡수했어요. 제하 오빠보다 잘하려고. 아버지가 한 번이라도 보시라고.\"<\/p>\n<p>\"보았다, 세아야.\"<\/p>\n<p>\"아니요.\" 세아가 고개를 저었다. 피 말라붙은 입술이 일그러졌다. \"아버지는 저를 한 번도 이름으로 부른 적 없잖아요. 남궁가의 딸. 강한 이름. 그 아이. 오늘도 그랬어요. 그 아이도 이해할 거다.\"<\/p>\n<p>원장이 입을 열었다.<\/p>\n<p>그리고 닫았다.<\/p>\n<p>처음으로, 그는 대답하지 못했다.<\/p>\n<p>나는 그 장면을 끝까지 보지 않았다. 볼 시간이 없었다. 연막과 비명과 부적 터지는 섬광 사이로, 나는 홀 맞은편을 향해 달리고 있었다.<\/p>\n<p>제하.<\/p>\n<p>그를 붙잡고 있던 집행관 넷 중 둘은 몰명 아이들에게 끌려갔다. 남은 둘 중 하나가 내가 달려오는 걸 보고 은색 장갑을 들었다.<\/p>\n<p>말소의 손. 그런데 나는 지울 이름이 없다.<\/p>\n<p>나는 그 손을 피하지 않았다. 장갑이 내 이마를 짚었다. 집행관이 거꾸로 무언가를 읊었다. 아무 일도 일어나지 않았다. 그의 눈이 커졌다. 그 틈에 나는 그의 정강이를 있는 힘껏 걷어찼다.<\/p>\n<p>남은 하나. 제하의 어깨를 짓누르고 있는 손.<\/p>\n<p>나는 그 손가락을 하나씩 떼어냈다. 손톱이 꺾이고 피가 났다. 상관없었다. 셋, 넷, 다섯. 손이 떨어졌다. 집행관이 나를 밀쳤지만, 그 뒤에서 태산이 날린 집행관 하나가 날아와 그를 덮쳤다.<\/p>\n<p>제하가 바닥에 손을 짚었다.<\/p>\n<p>그의 손이 거의 보이지 않았다. 손목 흉터만 하얗게 타는 선처럼 떠 있었다. 그가 고개를 들었다. 투명한 얼굴 속에서 회색 눈동자만 또렷했다.<\/p>\n<p>\"…바보야.\" 목소리가 바람처럼 갈라졌다. \"할게요는 왜 했어.\"<\/p>\n<p>\"거짓말이야.\"<\/p>\n<p>\"알아. 그래도 심장 멎는 줄 알았어.\" 그가 숨을 몰아쉬었다. \"나한테 아직 심장 같은 게 남아 있는 줄 몰랐는데.\"<\/p>\n<p>나는 그의 얼굴을 두 손으로 감쌌다. 차가웠다. 형체가 반쯤 없는데도 차가움은 또렷했다. 손바닥 아래 그의 맥박이, 아주 희미하게.<\/p>\n<p>\"내 이름 불러봐.\"<\/p>\n<p>\"하루야.\"<\/p>\n<p>아직. 아직 그는 기억했다.<\/p>\n<p>뒤에서 웃음소리가 멎었다.<\/p>\n<p>원장의 웃음소리. 그는 웃고 있었다, 내가 등을 돌린 사이에. 판이 무너지는 걸 보면서도. 그런데 그 웃음이 끊어졌다.<\/p>\n<p>돌아볼 틈도 없었다.<\/p>\n<p>등 한가운데에 손바닥이 닿았다. 따뜻한 손. 어깨에 얹혔던 그 손.<\/p>\n<p>\"계획은 좋았다, 영아.\" 원장의 목소리가 귓가에서 들렸다. 다정함이 전부 빠져나간, 마른 목소리. \"하지만 페이지에게는 동의가 필요 없단다.\"<\/p>\n<p>몸이 떠올랐다.<\/p>\n<p>발이 바닥에서 떨어졌다. 제하의 얼굴이 손바닥에서 빠져나갔다. 그가 나를 향해 손을 뻗었다. 투명한 손가락이 내 손가락을 스쳤다. 잡지 못했다.<\/p>\n<p>나는 홀 중앙으로 끌려갔다. 등 뒤의 손 하나에 밀려서. 바람도 없이, 소리도 없이.<\/p>\n<p>최초의 명부가 눈앞에 있었다.<\/p>\n<p>검은 표지가, 숨을 쉬듯 부풀었다.<\/p>\n<p>그리고 열렸다.<\/p>\n<p>수천, 수만 장의 하얀 페이지가 폭풍처럼 일어났다. 종이가 칼날처럼 공기를 갈랐다. 먹 냄새가 코를 찔렀다. 페이지들이 나를 휘감았다. 손목을, 발목을, 목을.<\/p>\n<p>\"하루야!\"<\/p>\n<p>제하의 목소리. 도준의 목소리. 누군가의 비명.<\/p>\n<p>홀 벽의 명경 하나가 시계를 띄우고 있었다. 하얀 페이지 사이로 마지막으로 그 숫자가 보였다.<\/p>\n<p>23:31.<\/p>\n<p>그리고 세상이 하얘졌다.<\/p>","chars":4968},{"title":"최초의 명부","html":"<p>[낙명제 6일째 · 마감까지 29분]<\/p>\n<p>하얬다.<\/p>\n<p>위도 아래도 없었다. 바닥이 없는데 서 있었다. 하늘이 없는데 빛이 있었다. 눈이 부시지 않은 빛. 갓 뜯은 A4 용지 한 묶음 속에 갇힌 것 같은 하양.<\/p>\n<p>소리도 없었다. 내 숨소리조차.<\/p>\n<p>손을 들어 보았다. 손이 있었다. 그런데 손등 위로 뭔가가 떨어져 나가고 있었다. 먼지 같은, 재 같은 것. 자세히 보니 글자였다. 아주 작은 획들. 점, 선, 삐침. 그것들이 내 살갗에서 떨어져 나와 하얀 허공으로 흩어졌다.<\/p>\n<p>아니다.<\/p>\n<p>떨어져 나가는 게 아니었다. 떨어질 게 없어서, 붙으려다 미끄러지는 거였다. 이 공간의 글자들이 나에게 달라붙으려다가 계속 미끄러지고 있었다. 기름종이에 먹물이 안 먹듯이.<\/p>\n<p>내 발밑을 보았다.<\/p>\n<p>나는 종이 위에 서 있었다. 끝없이 넓은, 아무것도 쓰이지 않은 한 장의 종이.<\/p>\n<p>빈 페이지.<\/p>\n<p>\"…그렇구나.\"<\/p>\n<p>목소리는 나왔다. 그런데 공기가 울리지 않았다. 목소리가 그냥 생각처럼 머릿속에 떴다.<\/p>\n<p>고개를 들었다.<\/p>\n<p>하얀 공간 저 멀리, 별 같은 것들이 떠 있었다. 수천, 수만, 셀 수 없이. 가까이 떠 있는 하나를 보았다. 별이 아니었다. 이름이었다. 먹으로 쓴 두 글자, 세 글자짜리 이름들이 저마다 희미하게 빛을 내며 떠 있었다.<\/p>\n<p>이름마다 온도가 달랐다. 어떤 건 따뜻했고, 어떤 건 얼음처럼 차가웠다. 차가운 이름들은 가장자리가 갉아먹힌 것처럼 닳아 있었다. 마법을 많이 쓴 사람들. 많이 잊혀진 사람들.<\/p>\n<p>손을 뻗지 않았는데, 이름 하나가 내 앞으로 흘러왔다.<\/p>\n<p>봉도준.<\/p>\n<p>세 글자가 촛불처럼 흔들렸다. 따뜻했다. 그 아래 가느다란 실 같은 게 이어져 있었다. 실을 따라 시선을 옮기자 다른 이름이 보였다. 강하루.<\/p>\n<p>내 가명. 보육원 원장이 붙여준 이름. 명부에 쓰일 리 없는 그 이름이, 도준의 이름에 매달려 대롱대롱 떠 있었다. 볼펜 잉크 색깔로.<\/p>\n<p>목구멍이 뜨거워졌다.<\/p>\n<p>그 애가 팔에 쓴 글씨가, 여기까지 와 있었다.<\/p>\n<p>\"사람이 사람을 기억하면, 여기선 그게 실이 돼.\"<\/p>\n<p>목소리가 들렸다.<\/p>\n<p>이번엔 머릿속이 아니었다. 진짜 소리였다. 이 하얀 공간에서 처음으로 공기가 떨렸다.<\/p>\n<p>나는 돌아보았다.<\/p>\n<p>이름들 사이로 여자가 걸어오고 있었다.<\/p>\n<p>흰 원피스. 맨발. 어깨까지 오는 검은 머리. 그리고 그 눈매. 거울을 볼 때마다 보던 눈매. 금서고의 빛바랜 사진 속에서 웃던 얼굴.<\/p>\n<p>발걸음 소리가 없었다. 그녀가 걸을 때마다 발밑의 하얀 종이 위에 아주 옅은 먹 자국이 번졌다가 사라졌다.<\/p>\n<p>심장이 멈췄다. 진짜로 그렇게 느껴졌다. 한 박자, 두 박자. 그리고 미친 듯이 다시 뛰었다.<\/p>\n<p>\"…엄마?\"<\/p>\n<p>그 단어를 소리 내어 말해본 건 처음이었다. 혀가 그 모양을 몰랐다. 입 안에서 낯선 사탕처럼 굴러다녔다.<\/p>\n<p>여자가 멈췄다. 나와 세 걸음 떨어진 곳에서.<\/p>\n<p>\"응.\"<\/p>\n<p>그녀가 웃었다. 사진보다 더 피곤해 보이는 웃음이었다.<\/p>\n<p>\"정확히는 엄마가 남긴 거야. 잔향. 메아리. 이 책에 마지막으로 남은 내 이름의 그림자. 그래서 오래는 못 있어.\"<\/p>\n<p>나는 다가가지 못했다. 발이 종이에 붙은 것처럼.<\/p>\n<p>\"여기 시간은 바깥이랑 달라. 바깥에선 일 분도 안 지났을 거야. 그래도 넉넉하진 않아.\"<\/p>\n<p>엄마가 손을 들었다. 손끝으로 허공을 그었다. 하얀 공간에 먹 선이 그어졌다.<\/p>\n<p>점 하나.<\/p>\n<p>가로획 하나.<\/p>\n<p>세로획, 갈고리, 치킴, 긴 삐침, 짧은 삐침, 파임.<\/p>\n<p>여덟 개의 획이 내 눈앞에서 차례로 그어졌다. 일주일 동안 내가 주워 모은 것들. 명패 뒷면의 점. 금서고 선반의 가로선. 폐역 환기구의 세로줄. 쪽지 서명의 갈고리. 투표장 천장의 문양. 동요가 가리킨 계단. 도준의 타버린 명패 그을음. 그리고 — 제하의 손목.<\/p>\n<p>획들이 모여 한 글자가 되었다.<\/p>\n<p>永.<\/p>\n<p>\"영원할 영.\" 엄마가 말했다. \"영자팔법이라고 해. 서예 배우는 사람은 이 글자 하나로 모든 획을 익혀. 이 한 글자 안에 세상 모든 글자의 획이 다 들어 있거든.\"<\/p>\n<p>\"왜…\" 목소리가 갈라졌다. \"왜 이렇게 했어요. 왜 흩어놨어요.\"<\/p>\n<p>\"네가 원할 때 찾으라고.\"<\/p>\n<p>엄마의 목소리가 조용해졌다.<\/p>\n<p>\"영아. 이 책은 빈 페이지만 열 수 있어. 칠명회는 사백 년 동안 그걸 만들려고 했지. 이름을 거두고 거둬서. 그런데 안 됐어. 거둔 이름은 페이지를 채우기만 하니까. 그러다 네가 태어났어.\"<\/p>\n<p>엄마의 손이 허공에서 무언가를 쓰다듬었다. 아기의 머리를 쓰다듬듯이.<\/p>\n<p>\"태어난 날 밤, 명부에 네 이름이 쓰였어. 남궁가의 딸. 그런데 네 이름은 이상했어. 획이 너무 가벼웠어. 쓰자마자 지워지려고 했어. 그날 알았어. 네가 열쇠라는 걸. 이 책을 열 수 있는, 처음부터 비어 있으려고 태어난 아이라는 걸.\"<\/p>\n<p>\"그래서 지웠어요?\"<\/p>\n<p>\"그래서 지웠어. 저들이 먼저 찾기 전에. 진짜로 비워버리면, 저들은 너를 찾을 수 없을 테니까.\"<\/p>\n<p>\"그건 이상하잖아요.\" 내 목소리가 높아졌다. 하얀 공간이 그 소리에 미세하게 떨렸다. \"비우면 열쇠가 되는 거잖아요. 엄마가 날 진짜 열쇠로 만든 거잖아요.\"<\/p>\n<p>엄마가 나를 보았다. 오래.<\/p>\n<p>\"맞아. 그건 도박이었어. 비어 있는 너는 열쇠지만, 아무도 너를 기억하지 못하면 아무도 너를 찾을 수 없어. 저들이 너를 찾아내기 전에, 네가 스스로 이름을 되찾으면 — 그땐 더 이상 빈 페이지가 아니게 되지. 그래서 획을 흩어놨어. 네가 걸어가는 길에.\"<\/p>\n<p>\"쪽지는요.\"<\/p>\n<p>내 손이 주머니로 갔다. 구겨진 쪽지가 아직 있었다. 사흘 전 밤, 후원 빵과 붕대 사이에 끼어 떨어졌던 것. 엄마 필체의.<\/p>\n<p>\"너는 하루가 아니란다. 지우개를 믿지 마라.\" 내가 읽었다. \"이거, 엄마가 쓴 거 아니죠.\"<\/p>\n<p>엄마가 쪽지를 보았다. 그리고 웃었다. 처음으로 진짜 웃음이 아니라 쓴웃음이었다.<\/p>\n<p>\"그 사람은 늘 내 글씨를 흉내 냈어. 어릴 때부터. 내가 상장을 받아 오면, 오빠는 그 상장에 적힌 내 이름을 따라 쓰는 연습을 했어. 가로획을 늘 오른쪽에서 왼쪽으로 그었지. 왼손잡이였거든. 고치라고 회초리를 맞으면서도, 혼자 있을 땐 늘 그렇게 썼어.\"<\/p>\n<p>나는 쪽지를 구겼다. 손바닥 안에서 종이가 바스러졌다.<\/p>\n<p>\"지우개를 믿지 말라고, 원장이 썼어요. 제하를 나한테서 떼어놓으려고.\"<\/p>\n<p>\"그 아이는 —\" 엄마의 눈이 흔들렸다. \"그 아이는 여덟 살이었어. 오빠가 그 아이 손을 겹쳐 잡고 내 이름을 거꾸로 읽게 했어. 그 아이 손이 덜덜 떨렸어. 울지도 못했어. 그래서 내가 마지막 힘으로, 그 아이 손목에 마지막 획을 남겼어.\"<\/p>\n<p>\"넌 나중에 그 애를 알아볼 거야.\" 내가 중얼거렸다. 제하가 들려준 말. \"그게 그 뜻이었어요?\"<\/p>\n<p>\"반쯤 지워진 사람은 비어 있는 걸 볼 수 있어. 그 아이는 오늘부터 평생 반쯤 지워진 채로 살 테니까, 너를 볼 수 있을 거라고 생각했어. 네가 혼자 남겨지지 않게.\" 엄마가 고개를 숙였다. \"끔찍한 짓이었지. 여덟 살짜리한테.\"<\/p>\n<p>나는 그제야 한 걸음 다가갔다.<\/p>\n<p>\"엄마.\"<\/p>\n<p>두 번째로 부른 그 단어는 첫 번째보다 덜 낯설었다.<\/p>\n<p>\"왜 날 두고 갔어요.\"<\/p>\n<p>엄마가 고개를 들었다.<\/p>\n<p>\"왜 아무도 날 기억 못 하게 만들었어요. 나 매일 아침 처음 보는 사람이었어요. 사장님한테도, 선생님한테도. 일곱 살 때 원장 선생님이 내 이름을 다시 물었어요. 열 살 때 짝꿍이 내 생일 선물을 들고 와서 이거 누구 줄 거였지, 했어요. 나 그거 다 기억해요. 나만 기억해요.\"<\/p>\n<p>말이 멈추지 않았다. 목에서 쏟아져 나왔다. 열여덟 해 동안 쌓아둔 것들이.<\/p>\n<p>\"나는 그냥, 한 명만. 단 한 명만 아침에 날 보고 '왔니' 해주길 바랐어요. 그게 엄마이길 바랐어요. 엄마는 날 잊었어요?\"<\/p>\n<p>엄마가 세 걸음을 걸어왔다.<\/p>\n<p>그리고 나를 안았다.<\/p>\n<p>따뜻했다.<\/p>\n<p>잔향이라더니. 메아리라더니. 그런데 따뜻했다. 엄마의 어깨에서 먹 냄새가 났다. 그리고 그 아래, 아주 희미하게, 비누 냄새. 기억에 없는데 기억나는 냄새.<\/p>\n<p>그녀의 손이 내 등을 쓸었다. 위에서 아래로. 아기를 재울 때처럼.<\/p>\n<p>평생 처음이었다. 기억 속에서가 아니라 지금, 여기서 누군가에게 안긴 건.<\/p>\n<p>무릎이 꺾였다. 엄마가 나를 붙든 채 같이 주저앉았다. 하얀 종이 위에 먹 자국이 번졌다.<\/p>\n<p>\"한 번도 잊은 적 없어.\" 엄마가 내 머리카락에 대고 말했다. \"단 하루도.\"<\/p>\n<p>나는 울었다. 소리 내서. 일곱 살처럼.<\/p>\n<p>\"영아. 엄마는 너를 기억 못 하게 만든 게 아니야.\" 엄마가 내 얼굴을 들어 올렸다. 엄지로 내 눈물을 닦았다. \"너를 누구에게도 빼앗기지 않게 만든 거야. 이름 없는 너는 누구도 붙잡을 수 없어. 그래서 네가 고른 사람만 너를 기억했지.\"<\/p>\n<p>엄마의 시선이 허공을 향했다. 떠 있는 이름들 사이, 가느다란 실 두 가닥.<\/p>\n<p>하나는 볼펜 잉크 색깔이었다. 봉도준에게서 강하루로.<\/p>\n<p>다른 하나는 은색이었다. 반쯤 닳아버린 이름 하나에서 나에게로. 그 이름은 너무 닳아서 읽을 수가 없었다. 원장이 붙인 '윤제하' 아래에, 원래 이름이 희미하게 비쳤다 사라졌다.<\/p>\n<p>\"노트를 쓴 아이. 그리고 손목의 아이.\"<\/p>\n<p>엄마가 미소 지었다.<\/p>\n<p>\"그 둘은 네가 고른 거야. 내가 아니라.\"<\/p>\n<p>하얀 공간이 흔들렸다.<\/p>\n<p>먼 곳에서, 종이가 찢어지는 소리가 났다. 아주 크게. 하늘 한쪽이 거대한 손에 붙잡힌 것처럼 구겨졌다.<\/p>\n<p>엄마가 고개를 들었다. 표정이 굳었다.<\/p>\n<p>\"오빠가 표지를 붙잡았어. 억지로 넘기려고 해.\" 엄마가 일어섰다. 나를 일으켜 세웠다. \"시간이 없어, 영아.\"<\/p>\n<p>엄마가 내 손을 펼쳤다. 그리고 그 위에 무언가를 놓았다.<\/p>\n<p>붓이었다.<\/p>\n<p>가느다란 대나무 붓. 털 끝에 먹이 이미 머금어져 있었다. 무게가 없는데, 손바닥이 묵직했다.<\/p>\n<p>\"잘 들어. 이 책은 빈 페이지가 열리면 딱 한 줄만 쓸 수 있어. 그 한 줄은 무엇이든 진짜가 돼. 사백 년 동안 칠명회가 원한 게 그 한 줄이야.\"<\/p>\n<p>엄마의 눈이 내 눈을 붙잡았다.<\/p>\n<p>\"네 이름을 쓰면, 너는 살아. 사람들이 너를 기억하고, 아침마다 '왔니' 하고 말해줄 거야. 대신 너는 영원히 이 책의 열쇠로 묶여. 이름이 생긴 열쇠는 언제든 다시 불릴 수 있어. 오빠가, 혹은 다음 원장이.\"<\/p>\n<p>하늘이 또 한 번 찢어졌다. 이번엔 더 가까이.<\/p>\n<p>\"내 이름을 쓰면, 나는 돌아가. 네 곁으로. 대신 거둬진 이름들은 그대로 바쳐지겠지.\"<\/p>\n<p>도준. 은솔. 세아. 태산. 마흔아홉.<\/p>\n<p>\"아니면 —\"<\/p>\n<p>엄마가 말을 멈췄다. 그리고 내 가슴, 심장 바로 위에 손바닥을 얹었다.<\/p>\n<p>\"그 전에, 이건 알고 골라. 엄마가 너한테 줄 수 있는 마지막 거니까.\"<\/p>\n<p>엄마가 입을 열었다.<\/p>\n<p>내 이름을 불렀다.<\/p>\n<p>하루가 아닌 이름. 일주일 동안 원장이 혀끝에 굴리던 반쪽짜리 이름이 아닌, 성까지 온전히 붙은 이름.<\/p>\n<p>그 소리가 내 가슴에 닿는 순간, 살갗 아래가 뜨거워졌다. 무언가가 새겨졌다. 붓이 아니라 불로 쓰는 것처럼. 하얀 공간의 글자들이 처음으로 내게서 미끄러지지 않았다. 달라붙었다. 먹이 종이에 스며들듯.<\/p>\n<p>나는 내 가슴을 내려다보았다.<\/p>\n<p>거기, 처음으로, 이름이 있었다.<\/p>\n<p>내 이름은 남궁영이었다.<\/p>","chars":5107},{"title":"한 줄","html":"<p>[낙명제 6일째 · 마감까지 2분]<\/p>\n<p>하늘이 갈라졌다.<\/p>\n<p>하얀 공간의 위쪽 — 위라는 게 있다면 — 에 검은 균열이 번개처럼 그어졌다. 그 틈으로 바깥이 보였다. 종이 너머로 비치는 그림자처럼, 일그러지고 흐릿하게.<\/p>\n<p>원장의 손이었다.<\/p>\n<p>거대한 손바닥이 책의 표지를 짓누르고 있었다. 손가락이 페이지 모서리를 움켜쥐고, 억지로 넘기려 했다. 그가 넘기려는 한 장 한 장이 이 공간을 통째로 흔들었다. 발밑의 종이가 지진처럼 출렁였다.<\/p>\n<p>\"오빠는 기다리지 않을 거야.\" 엄마가 말했다. 엄마의 윤곽이 아까보다 흐려져 있었다. \"네가 안 쓰면 오빠가 네 손을 잡고 쓰게 할 거야. 그 아이 손을 잡았던 것처럼.\"<\/p>\n<p>균열이 넓어졌다. 이번엔 홀이 보였다.<\/p>\n<p>연막이 반쯤 걷힌 홀. 연합이 밀리고 있었다. 집행관들이 다시 대열을 짜고 있었다. 태산이 셋에게 붙들려 무릎을 꿇었다. 세아의 부적이 바닥났는지 그녀가 맨손으로 집행관의 장갑을 붙잡고 있었다. 도준이 은솔을 등 뒤에 숨긴 채 뒷걸음질 치고 있었다. 은솔의 거울 조각이 아직 깜박였다. 그런데 그 빛이 약해지고 있었다.<\/p>\n<p>그리고 제하.<\/p>\n<p>제하는 거의 보이지 않았다. 홀 바닥에 쓰러진 사람의 윤곽만, 물에 젖은 유리처럼 비쳤다. 손목의 흉터만 하얗게 타고 있었다. 그 하얀 선이 점점 짧아지고 있었다.<\/p>\n<p>명경 하나에 시계가 떠 있었다.<\/p>\n<p>23:58.<\/p>\n<p>120초.<\/p>\n<p>나는 숫자를 셌다. 하나, 둘, 셋.<\/p>\n<p>손안의 붓이 무거웠다. 털 끝에서 먹 한 방울이 맺혀 떨어질 듯 말 듯 떨렸다.<\/p>\n<p>선택지는 세 개였다.<\/p>\n<p>내 이름. 남궁영. 가슴에 막 새겨진, 아직 따뜻한 이름. 그걸 쓰면 나는 산다. 내일 아침 사장님이 \"왔니\" 할 것이다. 도준이 노트 없이 나를 알아볼 것이다. 그리고 원장은 언제든 다시 나를 부를 수 있다. 열쇠야, 하고.<\/p>\n<p>엄마의 이름. 남궁연. 그걸 쓰면 엄마가 돌아온다. 사진 밖으로, 메아리 밖으로. 진짜 엄마가. 그리고 마흔아홉 명이 바쳐진다.<\/p>\n<p>아니면.<\/p>\n<p>엄마가 아까 말하다 멈춘 그 '아니면'.<\/p>\n<p>110초.<\/p>\n<p>나는 붓을 쥔 손을 내려다보았다. 엄마의 말이 머릿속에서 다시 재생됐다.<\/p>\n<p>'그 한 줄은 무엇이든 진짜가 돼.'<\/p>\n<p>무엇이든.<\/p>\n<p>일주일 동안 이 판이 가르쳐 준 게 하나 있었다. 룰은 말이다. 원장이 그렇게 말했다. 그리고 말에는 늘 구멍이 있다. 열쇠를 '가진' 자가 아니라 열쇠로 '문을 연' 자. 명패를 빼앗는 게 아니라 이름을 '불러야' 흡수. 빈 명패는 '이름'을 쓰면 그 이름의 명패.<\/p>\n<p>이 책은 '이름'을 쓰는 책이다.<\/p>\n<p>그런데 엄마는 '한 줄'이라고 했다. 한 이름이 아니라.<\/p>\n<p>100초.<\/p>\n<p>\"엄마.\"<\/p>\n<p>엄마가 나를 보았다. 이미 알고 있는 얼굴이었다.<\/p>\n<p>\"이 책이 사백 년 동안 이름을 거둔 거, 그것도 여기 적혀 있어요?\"<\/p>\n<p>\"모든 게 적혀 있어.\" 엄마가 대답했다. \"거둔 것도, 바친 것도, 지운 것도. 이 책은 아무것도 잊지 않아. 그래서 무서운 거야.\"<\/p>\n<p>\"그럼 그걸 고칠 수도 있어요?\"<\/p>\n<p>엄마가 아무 말도 하지 않았다.<\/p>\n<p>그냥 웃었다. 처음 나를 안았을 때처럼.<\/p>\n<p>90초.<\/p>\n<p>나는 무릎을 꿇었다. 발밑의 빈 종이. 나 자신인 페이지. 붓끝을 종이에 댔다.<\/p>\n<p>먹이 번졌다. 차갑고, 깊은, 오래된 냄새.<\/p>\n<p>가슴이 아팠다. 막 새겨진 이름이 살갗 아래에서 꿈틀거렸다. 나를 써. 나를 써. 이번이 마지막이야. 열여덟 해 동안 아무도 불러주지 않았잖아.<\/p>\n<p>손이 떨렸다.<\/p>\n<p>나는 눈을 감았다. 그리고 떠올렸다.<\/p>\n<p>손목에 볼펜으로 '질문 금지'라고 쓰던 바보 같은 글씨. 언니라고 부르면서 울던 열일곱 살. 피투성이로 문을 두드리던 사촌. \"패러 간다\"던 거인. 그리고 장갑을 벗은 손. 이름 하나 지울 때마다 하나씩 못 느끼게 된다던 손. 그런데 나랑 있으면 아프다던.<\/p>\n<p>그 사람들 중 누구도 나를 '남궁영'이라서 기억한 게 아니었다.<\/p>\n<p>도준은 이름 없는 애한테 컵라면을 나눠줬다. 은솔은 번호도 모르는 애를 언니라고 불렀다. 제하는 지울 이름도 없는 애 때문에 아프다고 했다.<\/p>\n<p>이름이 있어서 기억된 게 아니었다. 기억하기로 해서, 기억된 거였다.<\/p>\n<p>그리고 내가 내 이름을 쓰는 순간, 이 책은 남는다. 사백 년 동안 이름을 거둬온 이 책이, 원장이, 칠명회가, 7년 뒤의 마흔아홉 명이. 다음 무명이 태어날 때까지 기다리면서.<\/p>\n<p>엄마가 나를 지운 건 나를 숨기려고였다. 그런데 숨는 건 엄마 대에서 끝내야 했다.<\/p>\n<p>80초.<\/p>\n<p>나는 눈을 떴다.<\/p>\n<p>그리고 썼다.<\/p>\n<
