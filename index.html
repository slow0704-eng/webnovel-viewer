/p>\n<p>등 뒤에서 단단한 팔이 허리를 감았다. 비명이 손바닥 안에서 뭉개졌다. 발이 바닥에서 떴다. 나는 어둠 속으로, 사람들이 몰려간 반대쪽으로 끌려갔다.<\/p>\n<p>귓바퀴에 낮은 숨이 닿았다. 희미한 비누 냄새.<\/p>\n<p>\"소리 내지 마. 저쪽 길은 물이 차.\"<\/p>","chars":4818},{"title":"정맥 환류","html":"<div class=\"timer\">[D-13 / 04:31]<\/div>\n<p>나는 그 손을 깨물었다.<\/p>\n<p>엄지두덩, 살이 가장 두툼한 곳을. 이가 살갗을 뚫는 감촉이 났다. 입 안에 미지근한 쇠 맛이 번졌다.<\/p>\n<p>손은 떨어지지 않았다.<\/p>\n<p>등 뒤의 몸이 한 번 굳었을 뿐이었다. 숨소리 하나 흐트러지지 않았다. 그가 내 귀에 대고 말했다.<\/p>\n<p>\"다 물었으면 놔.\"<\/p>\n<p>턱에서 힘이 빠졌다. 혀끝에 남은 짠맛이 피라는 걸, 나는 머리로만 알았다. 이상했다. 시야가 하얗게 바래지 않았다. 귀도 먹먹해지지 않았다.<\/p>\n<p>보이지만 않으면, 피도 그냥 쇠 맛이었다.<\/p>\n<hr class=\"scene\">\n<p>손이 치워지자 휴대폰 불빛이 켜졌다. 서무진의 얼굴이 아래에서 위로 푸르게 떠올랐다. 그는 피가 맺힌 손을 가운 자락에 아무렇게나 닦았다. 나는 그쪽을 보지 않으려고 고개를 돌렸다.<\/p>\n<p>\"니 뭐 하는 건데.\"<\/p>\n<p>\"길 찾는 거.\"<\/p>\n<p>\"나를 왜 끌고 와.\"<\/p>\n<p>\"따라올지 말지는 네가 정해.\"<\/p>\n<p>그가 돌아섰다. 통로는 어깨 폭만 했다. 천장에서 물방울이 떨어져 목덜미로 흘러들었다. 나는 이를 갈았다. 그리고 따라갔다.<\/p>\n<p>삼십 걸음쯤 갔을 때, 뒤에서 빛이 출렁였다.<\/p>\n<p>\"이수! 거기 이수 맞나!\"<\/p>\n<p>병철 오빠였다. 손전등을 든 그의 등에 지아가 업혀 있었다. 지아는 오빠 목에 얼굴을 묻은 채 숨을 헐떡였다. 그 뒤로 재석이 따라왔다. 가운 무릎까지 젖어 있었다.<\/p>\n<p>\"아까 저쪽 구멍으로 들어갔다가 물이 허리까지 차서 돌아왔다. 지아가 좁은 데서 숨이 안 쉬어진다 캐서 업었다.\"<\/p>\n<p>\"폐소공포.\"<\/p>\n<p>지아가 내 쪽을 보지도 못하고 웅얼거렸다. 오빠는 지아의 허벅지를 고쳐 받치며 말했다.<\/p>\n<p>\"환자 하나, 의식 있음, 겁 많음. 이송 중.\"<\/p>\n<p>무진이 빛을 가렸다.<\/p>\n<p>\"손전등 꺼. 다 따라와.\"<\/p>\n<p>\"뭐라꼬?\"<\/p>\n<p>\"따라오면 출구가 막혀.\"<\/p>\n<p>오빠와 무진의 시선이 어둠 속에서 부딪쳤다. 공기가 팽팽하게 당겨졌다. 재석이 둘 사이에 손을 들었다.<\/p>\n<p>\"자자, 일단 같이 가자. 다섯이면 괜찮잖아. 그치, 무진아?\"<\/p>\n<p>무진은 대답하지 않았다. 손전등이 꺼졌다. 우리는 휴대폰 불빛 하나에 의지해 다시 걸었다.<\/p>\n<hr class=\"scene\">\n<p>통로가 갈라졌다.<\/p>\n<p>벽에 녹슨 놋쇠 명판이 붙어 있었다. 휴대폰을 비추자 음각된 글자가 드러났다.<\/p>\n<p>왼쪽, <span class=\"sys\">Aorta<\/span>. 오른쪽, <span class=\"sys\">V. jugularis<\/span>.<\/p>\n<p>\"대동맥, 목정맥.\"<\/p>\n<p>재석이 중얼거렸다. 무진은 망설이지 않고 오른쪽으로 꺾었다. 나는 그의 등을 노려봤다. 이 사람은 길을 알고 있다. 처음부터.<\/p>\n<p>왼쪽 통로 깊은 곳에서 꾸르륵, 물 들어차는 소리가 났다. 누군가의 비명이 그 위로 희미하게 얹혔다가 끊겼다.<\/p>\n<p>몇 번 더 갈라졌다. 무진은 매번 명판을 한 번 보고 꺾었다. 그런데 세 번째 갈림길에서, 그가 처음으로 멈췄다.<\/p>\n<p>명판이 세 개였다. 그중 둘은 녹이 슬어 글자가 반쯤 뭉개져 있었다.<\/p>\n<p><span class=\"sys\">A... ascendens<\/span>. <span class=\"sys\">V. cava ...<\/span>. 그리고 맨 오른쪽, 긁혀서 첫 글자만 남은 <span class=\"sys\">V<\/span>.<\/p>\n<p>무진이 나를 돌아봤다. 처음으로.<\/p>\n<p>\"골라.\"<\/p>\n<p>\"…나보고?\"<\/p>\n<p>\"네 오빠가 남긴 게 있을 거 아냐.\"<\/p>\n<p>목뒤의 털이 곤두섰다. 그가 어떻게 그걸. 하지만 따질 시간이 없었다. 발밑으로 물이 차올라 발목을 핥고 있었다. 지아가 오빠 등에서 흐느꼈다.<\/p>\n<p>족보. 어젯밤 마지막 장 뒷면, 연필로 흐리게 적혀 있던 한 줄.<\/p>\n<p><em>피는 심장으로 돌아간다.<\/em><\/p>\n<p>그때는 그냥 낙서인 줄 알았다. 오빠는 시험 전날이면 공책 귀퉁이에 그런 문장을 끄적이곤 했다. 그런데 그 문장을 지금 다시 읽자, 해부학 시간에 수백 번 외운 그림이 머릿속에 떠올랐다.<\/p>\n<p>동맥은 심장에서 나가는 피. 정맥은 심장으로 돌아오는 피.<\/p>\n<p>목정맥, 그다음은 위대정맥. 그다음은.<\/p>\n<p>\"우심방.\"<\/p>\n<p>나는 긁힌 명판을 가리키는 대신, 가운데 명판의 뭉개진 글자를 손톱으로 긁었다. 녹이 부스러지며 <span class=\"sys\">sup.<\/span>이 드러났다.<\/p>\n<p>\"V. cava sup. 위대정맥. 피가 심장으로 돌아가는 길. 대동맥 쪽은 나가는 길이라 물이 차는 거야.\"<\/p>\n<p>\"맨 오른쪽 V는?\"<\/p>\n<p>\"아래대정맥일 수도 있어. 근데 우린 목에서 왔잖아. 목에서 온 피는 위로 들어가.\"<\/p>\n<p>무진이 나를 오래 봤다. 휴대폰 빛 속에서 그의 눈동자가 아주 조금, 커졌다가 좁아졌다.<\/p>\n<p>\"맞아.\"<\/p>\n<p>그는 가운데로 들어갔다. 한 번도 뒤돌아보지 않고.<\/p>\n<p>위대정맥 통로는 오르막이었다. 그런데 물은 우리보다 빨랐다. 뒤쪽 갈림길에서 역류한 물이 무릎을 넘어 허벅지까지 감겨 올라왔다. 얼음장 같은 물에서 포르말린과 녹물 냄새가 함께 피어올랐다. 다리 감각이 점점 멀어졌다.<\/p>\n<p>\"오빠, 내려 줘, 나 걸을게, 나 때문에….\"<\/p>\n<p>\"가만있어라. 환자가 말이 많으면 이송이 늦다.\"<\/p>\n<p>병철 오빠가 미끄러졌다. 한쪽 무릎이 물속 계단 모서리에 찍히는 둔탁한 소리가 났다. 지아가 비명을 질렀다. 나는 반사적으로 오빠 팔을 잡았다. 무게에 같이 휘청였다.<\/p>\n<p>그때 앞에서 손이 뻗어 왔다. 내 손목을 잡아챘다. 아프지 않을 만큼, 그러나 빠져나갈 수 없을 만큼 단단히.<\/p>\n<p>무진이었다. 그는 나를 끌어올렸고, 내가 오빠를, 오빠가 지아를 끌어올렸다. 사슬처럼. 그는 내가 바로 서자마자 손을 놓았다. 잡았던 자리가 화끈거렸다.<\/p>\n<p>\"고마….\"<\/p>\n<p>\"빨리 걸어.\"<\/p>\n<p>등 뒤에서 재석이 숨을 몰아쉬며 웃었다. \"와, 무진이 오늘 의외다.\"<\/p>\n<p>무진은 대답 대신 걸음을 더 빨리 했다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-13 / 05:57]<\/div>\n<p>마지막 명판은 사다리 아래에 박혀 있었다. <span class=\"sys\">Atrium dextrum.<\/span> 우심방.<\/p>\n<p>녹슨 철제 사다리가 천장의 둥근 뚜껑까지 이어져 있었다. 틈새로 새벽빛이 회색으로 새어 들었다. 바깥 공기 냄새가 났다. 차가운 흙, 배기가스, 멀리서 오는 빵 굽는 냄새.<\/p>\n<p>휴대폰이 떨었다.<\/p>\n<div class=\"doc\">지상 도착 10 / 15.<\/div>\n<p>우리는 다섯이었다. 출구는 하나였다.<\/p>\n<p>누구도 먼저 말하지 않았다. 재석이 웃는 얼굴로 무진을 봤다. 오빠는 지아를 업은 채 숨을 골랐다. 지아의 눈이 내 꼬리표가 들어간 가운 가슴께로 떨어졌다가 황급히 올라갔다.<\/p>\n<p>그 짧은 순간, 우리는 서로를 계산하고 있었다.<\/p>\n<p>무진이 사다리를 잡았다.<\/p>\n<p>\"야.\"<\/p>\n<p>내 목소리가 떨렸다. 그는 첫 번째 가로대에 발을 올렸다. 두 번째. 세 번째. 뚜껑을 어깨로 밀어 올리자 회색 하늘이 쏟아졌다. 그가 밖으로 사라졌다.<\/p>\n<div class=\"doc\">지상 도착 11 / 15 — 서무진.<\/div>\n<p>재석이 짧게 웃었다. \"역시.\"<\/p>\n<p>그 뒤의 순서는 아무 의미가 없었다. 우리 넷은 차례로 올라갔다. 오빠가 지아를 밀어 올리고, 내가 마지막이었다. 맨홀 밖은 시계탑 뒤편 화단이었다. 붉은 벽돌 위로 시계 바늘이 06:00을 가리켰다.<\/p>\n<p>종이 울렸다. 뎅, 뎅.<\/p>\n<div class=\"doc\">마지막 4명 — 한이수, 육지아, 오병철, 민재석. 각 1단위 차감.<\/div>\n<p>혈액백 하나가 내 화면에서 비워졌다. 빈 비닐이 축 늘어졌다. 3 Unit.<\/p>\n<p>무진은 벌써 시계탑 모퉁이를 돌아가고 있었다. 젖은 가운 자락이 다리에 감겨 있었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-13 / 11:40]<\/div>\n<p>턴오버 인기글 1위는 오전 내내 바뀌지 않았다.<\/p>\n<div class=\"doc\">[실명] 0415조 정우람, 여자 탈의실 몰카 찍음. 증거 有.<\/div>\n<p>흐린 사진 몇 장. 탈의실 사물함 위에 놓인 휴대폰. 댓글이 천 개를 넘었다. 열두 시 정각, 학생지원팀 공지가 올라왔다. 징계위원회 회부, 제적 처분 예정.<\/p>\n<p>우람이 웃으며 계단을 올라간 지 여덟 시간이었다.<\/p>\n<p>\"처치.\"<\/p>\n<p>혜화역 4번 출구 뒷골목 국밥집에서, 나는 숟가락을 든 채 그 단어를 입에 굴렸다. 국물에서 김이 피어올랐다. 깍두기 국물이 빨개서 나는 그릇을 밀어냈다.<\/p>\n<p>병철 오빠는 말없이 내 뚝배기에 다대기를 걷어냈다. 수저로 한 번, 두 번. 빨간 기름이 다 사라질 때까지.<\/p>\n<p>\"묵어라. 굶으면 생각도 굶는다.\"<\/p>\n<p>나는 숟가락을 내려놓았다. 손가락이 식탁 모서리를 꽉 잡았다.<\/p>\n<p>\"오빠.\"<\/p>\n<p>\"어.\"<\/p>\n<p>\"우리 오빠, 자살 안 했어.\"<\/p>\n<p>국밥집의 소음이 멀어지는 것 같았다. 옆 테이블 아저씨들의 소주잔 부딪치는 소리, 주방의 칼질 소리. 그 사이에서 내 목소리만 또렷했다.<\/p>\n<p>\"나 그거 알아낼라고 왔어. 의대. 성적 맞춰서 온 거 아니여. 오빠 죽은 데 들어갈라고 온 거여.\"<\/p>\n<p>말이 다 사투리로 쏟아졌다. 목이 뜨거웠다. 2년 동안 아무한테도, 엄마한테도 하지 못한 말이었다.<\/p>\n<p>오빠는 한참 동안 나를 봤다. 그의 두꺼운 손가락이 소주잔 대신 물컵을 돌렸다. 컵 속에서 얼음이 달각거렸다.<\/p>\n<p>\"그럼.\"<\/p>\n<p>그가 말했다.<\/p>\n<p>\"살아서 알아내라. 죽어서 알아낸 건 아무 쓸모 없다. 내가 7년 동안 실어 나른 사람들이 다 그랬다.\"<\/p>\n<p>나는 고개를 숙였다. 국밥 위로 무언가 뚝 떨어졌다. 오빠가 휴지를 뽑아 내 앞에 놨다. 그리고 다시 다대기 없는 국밥을 내 쪽으로 밀었다.<\/p>\n<p>나는 숟가락을 들었다. 따뜻했다.<\/p>\n<hr class=\"scene\">\n<p>의과대학 1동 옥상 문은 늘 고장 나 있었다.<\/p>\n<p>바람이 머리카락을 얼굴에 때렸다. 난간 앞에 무진이 서 있었다. 오른손에 거즈가 감겨 있었다. 엄지두덩. 내가 문 자리.<\/p>\n<p>\"왜 도왔어?\"<\/p>\n<p>그는 돌아보지 않았다. 대학로 지붕들 너머로 시계탑의 붉은 벽돌이 보였다.<\/p>\n<p>\"안 도왔어. 나 먼저 나갔잖아.\"<\/p>\n<p>\"물 차는 데서 끌고 나왔잖아. 그 길로 갔으면 나 죽었어.\"<\/p>\n<p>\"그럼.\"<\/p>\n<p>그가 그제야 고개를 돌렸다. 바람에 앞머리가 흩어졌다. 까만 눈이 내 얼굴을 지나 목께, 가운 안에 숨긴 꼬리표 자리에서 잠깐 멈췄다.<\/p>\n<p>\"넌 빚진 거야.\"<\/p>\n<p>\"…무슨 빚.\"<\/p>\n<p>\"갚으라고 할 때 알게 돼.\"<\/p>\n<p>그가 내 옆을 지나쳤다. 어깨가 스칠 만큼 가까이. 비누 냄새와 소독약 냄새가 섞여 났다. 거즈에 배어 나온 갈색 얼룩이 시야 끝에 걸렸다.<\/p>\n<p>나는 고개를 돌려 버렸다. 심장이 쓸데없이 빨리 뛰었다. 피를 봐서라고, 나는 생각했다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-13 / 22:15]<\/div>\n<p>\"이수야. 내다.\"<\/p>\n<p>병철 오빠의 전화는 밤늦게 왔다. 목소리가 낮았다. 주변에 차 소리가 났다. 어디 밖에 서 있는 모양이었다.<\/p>\n<p>\"구급대 있을 때 알던 형이 지금 사이버수사대 있다. 우람이 그 글, 뭔가 이상해서 슬쩍 물어봤다.\"<\/p>\n<p>\"…뭐가 이상한데요.\"<\/p>\n<p>\"사진 메타데이터가 다 지워져 있대. 근데 업로드한 계정 접속 기록은 남아 있다 카더라. 형이 원래 이런 거 말해주면 안 되는데.\"<\/p>\n<p>오빠가 말을 끊었다. 라이터 켜는 소리. 그는 담배를 끊은 지 3년이었다.<\/p>\n<p>\"이수야. 니 턴오버 아이디, 뭐로 돼 있노.\"<\/p>\n<p>손에서 힘이 빠졌다. 기숙사 책상 위 노트북을 열었다. 턴오버 로그인 화면. 자동 로그인된 내 계정이 그대로 떠 있었다. 활동 내역을 눌렀다.<\/p>\n<p>작성 글 1.<\/p>\n<div class=\"doc\">[실명] 0415조 정우람, 여자 탈의실 몰카 찍음. 증거 有.<\/div>\n<p>작성 시각, 오늘 06:14.<\/p>\n<p>맨홀을 빠져나와 젖은 운동화로 기숙사까지 걸어오던, 바로 그 시각이었다.<\/p>\n<p>정우람을 처치한 폭로글은 — 내 계정에서 올라와 있었다.<\/p>","chars":4905},{"title":"증례 1: 거짓말하는 환자","html":"<div class=\"timer\">[D-13 / 23:41]<\/div>\n<p>출력된 A4 한 장이 열람실 책상 위로 날아와 내 노트를 덮었다.<\/p>\n<div class=\"doc\">[실명] 0415조 정우람, 여자 탈의실 몰카 찍음. 증거 有.<\/div>\n<p>\"이거 니 계정이지.\"<\/p>\n<p>강하린이 내 맞은편 의자를 끌어 앉았다. 의자 다리가 바닥을 긁는 소리에 열람실 몇 명이 고개를 들었다. 하린은 개의치 않았다. 손톱 끝으로 종이를 톡톡 두드렸다. 붉은 매니큐어가 형광등 아래 번들거렸다.<\/p>\n<p>\"우리 할아버지 쪽 사람들은 그런 거 금방 알아내거든. 너 집도의 개야?\"<\/p>\n<p>\"아니.\"<\/p>\n<p>\"그럼 우람이 꼬리표 노리고 미리 판 깐 거? 생각보다 독하네, 지방 애.\"<\/p>\n<p>\"내가 안 썼어.\"<\/p>\n<p>하린이 눈을 가늘게 뜨고 내 얼굴을 훑었다. 이마, 입술, 그리고 귀. 나는 손을 올려 왼쪽 귓불을 만져봤다. 차가웠다.<\/p>\n<p>거짓말을 하면 언제나 거기부터 달아올랐다. 오빠는 그걸 보고 내 비밀을 다 알아맞혔다. 지금은 아무렇지 않았다.<\/p>\n<p>내 계정은 도둑맞았다. 그걸 아는 사람은 나뿐이었다. 그리고, 훔친 사람.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-12 / 00:00]<\/div>\n<p>열람실 곳곳에서 휴대폰이 동시에 떨었다. 무명 학생들은 졸린 눈으로 알람인 줄 알고 화면을 엎었다. 하린과 나는 동시에 화면을 켰다.<\/p>\n<div class=\"doc\">증례 1. 거짓말하는 환자.<\/div>\n<p>환자 기록 다섯 장이 차례로 넘어갔다. 마지막에 처방 한 줄.<\/p>\n<div class=\"doc\">진단 코드(KCD)를 구하시오. 문자는 처음에서. 합은 가운데서. 마지막 환자는 코드에서 나이를 빼시오. 답은 의학도서관 지하 2층이 압니다.<\/div>\n<p>하린이 혀를 찼다. 그런데 그녀의 시선은 화면이 아니라 내 책상 위에 멈춰 있었다. 노트 밑으로 삐져나온 제본 묶음. 매직 글씨 <span class=\"sys\">77기 한도윤<\/span>.<\/p>\n<p>그녀의 얼굴이 바뀌었다. 아주 매끄럽게.<\/p>\n<p>\"…그거, 우승자 족보야?\"<\/p>\n<p>\"상관없잖아.\"<\/p>\n<p>\"이수야.\"<\/p>\n<p>처음으로 하린이 내 이름을 불렀다. 목소리에서 가시가 빠져 있었다.<\/p>\n<p>\"아까 건 미안. 나도 겁나서 그랬어. 우리 같이 하자. 너 혼자 이거 못 풀어.\"<\/p>\n<p>그 등 뒤로 재석이 나타났다. 손에 캔커피 세 개를 들고 있었다.<\/p>\n<p>\"오, 다들 여기 있었네. 이수야, 블랙 맞지?\"<\/p>\n<p>나는 블랙을 마시지 않았다. 재석은 웃으며 하나를 내 족보 옆에 내려놓았다. 정확히 족보 옆에.<\/p>\n<p>어제까지 나는 이 바닥의 맨 아래였다. 지방, 무인맥, 자살한 선배 동생. 그런데 지금, 병원장 손녀와 조장이 오빠의 족보 앞에서 허리를 굽히고 있었다.<\/p>\n<p>캔이 손바닥에 차가웠다. 나는 뚜껑을 땄다.<\/p>\n<hr class=\"scene\">\n<p>처음 네 장은 금방 풀렸다.<\/p>\n<p>1번, 41세 여자. 새우 먹고 전신에 팽진, 가려움. 두드러기, L50. 문자는 처음에서 — <span class=\"sys\">L<\/span>.<\/p>\n<p>2번부터 4번까지는 하린이 줄줄 불렀다. 58세 남자, 턱으로 뻗는 흉통과 식은땀, 급성 심근경색 I21. 9세 아이, 밤마다 쌕쌕거리는 기침, 천식 J45. 50세 여자, 다음·다뇨·체중 감소, 2형 당뇨병 E11.<\/p>\n<p>\"21 더하기 45 더하기 11.\"<\/p>\n<p>재석이 손가락을 접었다. \"77.\"<\/p>\n<p>나는 숨을 멈췄다. 77기. 오빠의 기수.<\/p>\n<p>남은 건 5번이었다.<\/p>\n<div class=\"doc\">46세 남자. 아침에 방에서 발견. 두통, 구토, 의식 혼미. 술 냄새 심함. 본인 진술: &quot;혼자 술 먹고 잤다.&quot; 같이 사는 개도 늘어져 있음.<\/div>\n<p>\"급성 알코올 중독. F10.\"<\/p>\n<p>하린이 단언했다. 재석이 빼봤다. 10에서 46을 빼면 마이너스 36.<\/p>\n<p>\"…마이너스?\"<\/p>\n<p>우리는 그 뒤로 세 시간을 그 한 장 앞에서 보냈다. 편두통 G43, 뇌진탕 S06, 위장염 A09. 무엇을 넣어도 숫자가 음수로 떨어졌다. 족보를 처음부터 끝까지 넘겼다. 오빠는 이런 증례를 적어두지 않았다.<\/p>\n<p>새벽 여섯 시 라운딩은 아무 일 없이 지나갔다. 목에 건 꼬리표가 옷 안에서 쇄골을 눌렀다. 오전 실습, 오후 강의. 하린은 하품을 참으며 나를 노려봤다. 재석은 계속 웃었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-12 / 19:40]<\/div>\n<p>\"이거 술 아이다.\"<\/p>\n<p>국밥집 식탁 위에 내 휴대폰을 엎어놓고, 병철 오빠가 깍두기를 씹으며 말했다. 하린이 대놓고 얼굴을 찌푸렸다. 이런 데서 밥을 먹어본 적 없는 얼굴이었다.<\/p>\n<p>\"교과서 말고, 현장에선 이거 일산화탄소다.\"<\/p>\n<p>\"술 냄새 난다잖아요.\"<\/p>\n<p>하린이 날카롭게 받았다. 오빠는 수저로 화면을 가리켰다.<\/p>\n<p>\"번개탄 피운 사람들, 냄새 감출라고 술 마신다. 진술은 거짓말이고. 개가 같이 늘어져 있다는 거, 그게 결정적이다. 개는 술 안 먹는다 아이가.\"<\/p>\n<p>하린의 입이 다물렸다. 재석이 손뼉을 쳤다.<\/p>\n<p>거짓말하는 환자. 제목이 그제야 몸을 가졌다.<\/p>\n<p>\"일산화탄소의 독성 효과. T58.\"<\/p>\n<p>나는 휴대폰 메모장에 적었다. 58에서 46을 빼면.<\/p>\n<p>\"12.\"<\/p>\n<div class=\"doc\">L-77-12.<\/div>\n<p>오빠가 국밥 국물을 들이켜며 덧붙였다. \"7년 동안 그런 집 문 따고 들어간 게 몇 번인지 모른다. 개가 먼저 죽어 있으면, 사람은 아직 살아 있을 때가 있다.\"<\/p>\n<p>아무도 웃지 않았다. 그는 웃으라고 한 말이 아니었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-11 / 03:10]<\/div>\n<p>의학도서관 지하 2층 폐서고 철문은 재석이 열었다.<\/p>\n<p>\"예과 때 도서관 근로 했거든. 열쇠 위치는 안 바뀌더라.\"<\/p>\n<p>그가 웃었다. 하린은 아무것도 묻지 않았다. 병철 오빠는 내일 실습 준비물이 있다며 기숙사로 돌아갔다. 자정이 지났지만 카르테는 새 증례 대신 랭킹만 갱신했다. 셋 다 그 화면을 열어보지도 않았다.<\/p>\n<p>폐서고는 종이가 썩는 냄새가 났다. 습기 먹은 판지, 오래된 풀, 쥐똥. 형광등 몇 개가 깜빡이며 끝없는 서가의 그림자를 흔들었다. 발소리가 콘크리트에 흡수돼 이상하게 둔탁했다.<\/p>\n<p>서가 끝에 철제 사물함이 한 줄 있었다. 페인트로 쓴 구역 표시 <span class=\"sys\">L<\/span>. 칸마다 다이얼 자물쇠.<\/p>\n<p>77번 칸. 다이얼 두 개를 돌렸다. 1, 2.<\/p>\n<p>딸깍.<\/p>\n<p>안에는 두꺼운 책 한 권뿐이었다. 손때가 묻은 해부학 아틀라스. 표지 모서리가 닳아 둥글었다. 첫 장을 열자 익숙한 글씨가 있었다. 왼쪽으로 삐뚜름한 'ㅎ'.<\/p>\n<div class=\"doc\">한도윤. 2학년 땐 진짜 잘하자.<\/div>\n<p>\"뭐야, 그냥 책이네.\"<\/p>\n<p>하린이 실망한 목소리로 말했다. 재석이 책장을 넘겨보다 멈췄다. 어떤 페이지들에 바늘 구멍이 뚫려 있었다. 수십 개, 일정하지 않은 간격으로. 빛에 비추면 별자리처럼 보였다.<\/p>\n<p>\"이거 뭔지 알겠어?\"<\/p>\n<p>\"…몰라.\"<\/p>\n<p>내 왼쪽 귀가 뜨거워지기 시작했다. 나는 머리카락을 내려 귀를 덮었다.<\/p>\n<p>\"다른 구역도 뒤져보자. 하나만 있을 리 없어.\"<\/p>\n<p>하린이 서가 안쪽으로 걸어갔다. 재석이 \"같이 가\" 하며 따라갔다. 발소리 두 개가 멀어졌다.<\/p>\n<hr class=\"scene\">\n<p>나는 사물함 앞에 혼자 쪼그려 앉아 아틀라스를 넘겼다.<\/p>\n<p>상지, 하지, 흉부. 페이지마다 오빠의 볼펜 메모가 빽빽했다. 시험 범위, 교수 이름, 외우는 요령. 그러다 복부 단원 맨 아래, 혈관 그림 옆 여백에 작은 글씨가 있었다. 다른 메모와 달리 동그라미까지 그려서.<\/p>\n<div class=\"doc\">이수 보면 밥 사주기.<\/div>\n<p>손가락이 그 글자 위에서 멈췄다.<\/p>\n<p>오빠는 내가 의대에 올 줄 알았을까. 아니, 그냥 내가 서울에 놀러 오면 사줄 생각이었겠지. 그 무렵 나는 예과 새내기랍시고 동기들이랑 노느라 오빠 전화를 귀찮다고 끊곤 했다.<\/p>\n<div class=\"doc\">이수야 밥 먹었나.<\/div>\n<p>답장 안 했잖아. 한 번도. 밥 사준다는 사람한테.<\/p>\n<p>목구멍에서 이상한 소리가 났다. 처음에는 기침인 줄 알았다. 그런데 숨을 들이쉴 때마다 그 소리가 다시 났다. 어깨가 멋대로 들썩였다. 아틀라스 위로 물방울이 떨어져 오빠의 볼펜 글씨가 번졌다. 나는 황급히 소매로 닦았다. 더 번졌다.<\/p>\n<p>장례식장에서도 울지 않았다. 유골함이 가벼웠을 때도. 2년 동안 한 번도.<\/p>\n<p>그런데 이 다섯 글자 앞에서는 멈춰지지 않았다.<\/p>\n<p>눈앞에 하얀 것이 내밀어졌다. 휴지였다. 접힌 모서리가 반듯했다.<\/p>\n<p>고개를 들었다. 서가 그림자 속에 무진이 서 있었다. 언제부터 거기 있었는지 알 수 없었다. 오른손에 아직 거즈가 감겨 있었다.<\/p>\n<p>\"니가 왜 여기….\"<\/p>\n<p>\"닦아. 책 젖는다.\"<\/p>\n<p>나는 휴지를 받지 않았다. 그가 휴지를 아틀라스 위에 올려놓고, 쪼그려 앉았다. 내 눈높이로. 그리고 번진 글씨를 내려다봤다.<\/p>\n<p>\"형은 왼손으로 메모했지. 그래서 맨날 번졌어.\"<\/p>\n<p>숨이 멎었다.<\/p>\n<p>울음이 뚝 그쳤다. 폐서고의 습기가 갑자기 차갑게 살갗에 달라붙었다. 형광등이 지직, 울었다.<\/p>\n<p>\"…형?\"<\/p>\n<p>무진의 얼굴에 아주 짧게 무언가가 지나갔다. 금이 가는 것처럼. 그는 바로 입을 다물었다. 너무 늦었다.<\/p>\n<p>\"니가 그걸 어떻게 아는데.\"<\/p>\n<p>대답이 없었다.<\/p>\n<p>\"니가 우리 오빠를 어떻게 아는데. 말해 봐. 언제부터 알았는디. 니가 우리 오빠를 어떻게….\"<\/p>\n<p>그의 손목을 잡았다. 거즈 감은 손. 그 아래에서 맥이 뛰었다. 빠르게. 그의 얼굴은 하나도 흔들리지 않는데, 손목 안쪽만은 거짓말을 못 하고 있었다.<\/p>\n<p>\"놔.\"<\/p>\n<p>\"말하기 전엔 안 놔.\"<\/p>\n<p>그가 내 얼굴을 봤다. 젖은 눈, 번진 콧등, 그리고 머리카락 사이로 드러난 왼쪽 귀. 그의 시선이 거기서 멈췄다.<\/p>\n<p>\"안 빨개졌네.\"<\/p>\n<p>\"…뭐?\"<\/p>\n<p>\"거짓말할 때만 빨개진다며. 지금 너, 진짜로 우는 거구나.\"<\/p>\n<p>등줄기로 소름이 쫙 끼쳤다. 그건 오빠만 알던 거였다. 오빠가 장난처럼, 엄마한테도 안 일러바친 내 버릇. 오빠가 이 사람한테 나를 얘기했다. 언제, 어디서, 어떤 얼굴로.<\/p>\n<p>손아귀에 힘이 들어갔다. 손톱이 거즈 위로 그의 살을 파고들었다. 그는 빼지 않았다. 그제 새벽 내가 깨문 자리였다. 거즈에 다시 붉은 것이 배어 나오기 시작했다. 나는 그걸 보지 않으려고 그의 눈만 노려봤다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-11 / 04:58]<\/div>\n<p>딸깍.<\/p>\n<p>형광등이 한꺼번에 꺼졌다.<\/p>\n<p>비상등만 남았다. 서가 끝 초록 불빛이 바닥에 길쭉한 그림자를 깔았다. 내가 잡고 있던 손목이 빠져나갔다.<\/p>\n<p>\"무진아?\"<\/p>\n<p>대답 대신, 서가 너머에서 뭔가 쓰러지는 소리가 났다. 쿵. 책들이 우수수 쏟아졌다. 하린의 날카로운 비명. 누군가의 발소리가 콘크리트 위를 빠르게 미끄러졌다. 하나가 아니었다.<\/p>\n<p>나는 아틀라스를 가슴에 끌어안고 일어났다. 그 순간 등 뒤에서 몸이 부딪쳐 왔다.<\/p>\n<p>어깨가 사물함에 처박혔다. 철판이 울리는 소리가 머릿속을 흔들었다. 누군가의 손이 내 목덜미를 훑고 지나갔다. 차가운 손가락. 장갑 낀 듯 매끈한 감촉. 목이 순간 뒤로 당겨졌다가 풀렸다.<\/p>\n<p>\"누구야!\"<\/p>\n<p>어둠은 대답하지 않았다. 발소리가 멀어지고, 철문이 끼익 열렸다가 닫혔다.<\/p>\n<p>비상등 아래, 나는 숨을 몰아쉬며 서 있었다. 하린이 서가 사이에서 기어 나왔다. 재석이 \"괜찮아? 다들 괜찮아?\" 하고 외치며 달려왔다. 무진은 보이지 않았다.<\/p>\n<p>나는 아틀라스를 확인했다. 그대로였다. 그런데 뭔가 이상했다. 목이 너무 가벼웠다.<\/p>\n<p>손을 쇄골로 가져갔다. 니트 목 안쪽을 더듬었다. 은사슬이 쓸렸던 맨살만 만져졌다.<\/p>\n<p>목에 걸려 있어야 할 꼬리표가 없었다.<\/p>\n<p>05:00. 라운딩까지 한 시간.<\/p>","chars":4953},{"title":"06:00 라운딩","html":"<div class=\"timer\">[D-11 / 05:02]<\/div>\n<p>휴대폰 화면이 붉게 번쩍였다.<\/p>\n<div class=\"doc\">꼬리표 미보유.<\/div>\n<div class=\"doc\">금일 증례 열람 불가.<\/div>\n<div class=\"doc\">06:00 정산 시, 탈취자에게 1단위 수혈.<\/div>\n<p>혈액백 세 개 중 맨 끝 하나가 깜빡였다. 심장 박동처럼. 꺼졌다, 켜졌다. 그 리듬이 내 맥박보다 느려서, 나는 화면을 쥔 손에 힘을 줬다.<\/p>\n<p>3에서 1을 빼면 2. 0까지는 두 번이면 끝났다.<\/p>\n<hr class=\"scene\">\n<p>\"니 거 보여줘.\"<\/p>\n<p>비상등 아래에서 나는 하린 앞을 막아섰다. 하린은 어이없다는 듯 웃더니, 셔츠 단추 하나를 풀어 은사슬을 꺼냈다. 검은 금속판. <span class=\"sys\">0409<\/span>. 뒷면 <span class=\"sys\">姜<\/span>.<\/p>\n<p>\"만족해? 나도 방금 밀쳐졌거든. 무릎 까졌다고.\"<\/p>\n<p>재석도 순순히 목에서 꼬리표를 꺼내 보였다. 그는 걱정스러운 얼굴로 내 어깨를 감쌌다.<\/p>\n<p>\"이수야, 일단 진정하자. 범인 못 찾으면 1단위 잃는 거지, 죽는 건 아니잖아.\"<\/p>\n<p>죽는 건 아니잖아. 그 말이 이상하게 귀에 걸렸다. 그는 2단위의 무게를 모르는 사람처럼 말했다.<\/p>\n<p>무진은 끝내 돌아오지 않았다.<\/p>\n<p>나는 바닥에 주저앉아 아틀라스를 펼쳤다. 생각해야 했다. 범인은 꼬리표를 들고 시계탑으로 갈 것이다. 그 전에 무언가, 어떤 단서든.<\/p>\n<p>핀 구멍이 뚫린 페이지를 비상등 쪽으로 들어 올렸다. 초록빛이 구멍들을 통과해 바닥에 작은 점들을 흩뿌렸다. 그 순간 뒤표지 안쪽에서 무언가 툭 떨어졌다. 접힌 복사지. 펼치자 낡은 건물 평면도였다. 귀퉁이에 <span class=\"sys\">大韓醫院 本館<\/span>.<\/p>\n<p>시계탑이었다.<\/p>\n<p>평면도를 바닥에 깔고 그 위로 아틀라스 페이지를 겹쳤다. 비상등 빛이 구멍을 지나 평면도 위에 떨어졌다. 점들이 복도와 계단 위에 하나씩 내려앉았다. 아무렇게나 뚫은 구멍이 아니었다. 오빠는 이 건물에 길을 그려놓았다.<\/p>\n<p>\"뭐야, 그거.\"<\/p>\n<p>하린이 고개를 들이밀었다. 나는 평면도를 접었다. 손이 떨려서 두 번이나 놓쳤다.<\/p>\n<p>05:14. 해독할 시간이 없었다.<\/p>\n<p>\"시계탑 투입구로 간다.\"<\/p>\n<p>\"가서 뭐 하게.\"<\/p>\n<p>\"훔친 놈은 거기 넣으러 올 거 아냐.\"<\/p>\n<hr class=\"scene\">\n<p>\"같이 가, 이수야. 혼자 위험해.\"<\/p>\n<p>재석이 따라나섰다. 하린이 팔짱을 낀 채 코웃음을 쳤다.<\/p>\n<p>\"넌 왜 그렇게 얘한테 친절해? 꼬리표 없는 애는 이제 쓸모도 없는데.\"<\/p>\n<p>\"조원이잖아.\"<\/p>\n<p>재석의 대답은 이번에도 빨랐다. 나는 기다리지 않고 계단을 뛰어올랐다.<\/p>\n<p>의학도서관을 빠져나오자 새벽 공기가 얼굴을 때렸다. 아직 캄캄했다. 연건캠퍼스의 가로등이 젖은 아스팔트 위에 노란 웅덩이를 만들고 있었다. 입김이 하얗게 흩어졌다.<\/p>\n<p>멀리, 시계탑 쪽 모퉁이에서 흰 것이 펄럭였다. 가운 자락 같았다. 눈을 깜빡이자 사라지고 없었다. 뒤를 돌아봤다. 재석은 보이지 않았다. 도서관 출입문만 천천히 닫히고 있었다.<\/p>\n<p>나는 혼자였다.<\/p>\n<p>시계탑까지 가는 가장 빠른 길은 의과대학 2동 지하 연결통로였다. 해부학 실습실 앞을 지나가는 길.<\/p>\n<p>방화문을 밀자 포르말린 냄새가 덮쳐 왔다. 복도 형광등이 반쯤 꺼져 있었다. 내 운동화 소리만 텅 빈 복도에 탁, 탁, 울렸다.<\/p>\n<p>실습실 앞 사물함 줄 끝에서, 나는 멈췄다.<\/p>\n<p>누군가 사물함에 등을 기댄 채 바닥에 앉아 있었다. 무릎 위에 펼쳐진 해부학 교과서. 고개가 한쪽으로 꺾여 있었다. 잠든 숨소리가 작게 새어 나왔다.<\/p>\n<p>육지아였다.<\/p>\n<p>실습 예습을 하다 잠든 모양이었다. 교과서 위에 형광펜 뚜껑이 굴러다녔다. 얇은 카디건 목선 사이로 은사슬이 반짝였다. 그 끝에 매달린 검은 금속판이 지아의 숨에 맞춰 오르내렸다.<\/p>\n<p><span class=\"sys\">No.0412<\/span>. 뒷면에 <span class=\"sys\">陸<\/span>.<\/p>\n<p>나는 숨을 삼켰다. 휴대폰을 켰다. 실시간 랭킹. 육지아 3 Unit. 한이수 3 Unit — 그 옆에 붉은 글씨로 <span class=\"sys\">−1 예정<\/span>.<\/p>\n<p>지아의 꼬리표를 넣으면 나는 3을 지킨다. 지아는 2가 된다.<\/p>\n<p>나처럼.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-11 / 05:38]<\/div>\n<p>전화를 걸었다. 신호가 두 번 가자 병철 오빠가 받았다. 잠긴 목소리였다.<\/p>\n<p>\"이수? 무슨 일이고.\"<\/p>\n<p>\"오빠. 꼬리표, 뺏겼어요.\"<\/p>\n<p>이불을 걷어차는 소리가 났다. 슬리퍼, 문 여는 소리.<\/p>\n<p>\"어디고. 지금 간다. 15분.\"<\/p>\n<p>15분이면 05:53. 그리고 오빠가 와서 할 수 있는 건 없었다. 범인을 모르니까. 오빠가 나 대신 누구 꼬리표를 뺏어줄 사람도 아니었다. 그런 걸 시키면, 오빠는 나를 그런 눈으로 볼 것이다.<\/p>\n<p>나는 잠든 지아를 내려다봤다.<\/p>\n<p>\"…아니에요, 오빠. 찾았어요. 서고에 떨어져 있었어요.\"<\/p>\n<p>왼쪽 귀가 화끈 달아올랐다. 수화기 너머에서 오빠가 숨을 길게 내쉬었다.<\/p>\n<p>\"하이고, 사람 심장 떨어지게. 자라, 고마. 아침에 국밥 사주께.\"<\/p>\n<p>\"응. 응, 오빠.\"<\/p>\n<p>통화가 끊겼다. 귀가 불에 덴 것처럼 뜨거웠다. 나는 그 귀를 손바닥으로 꾹 눌렀다. 누가 볼까 봐. 아무도 없는데.<\/p>\n<hr class=\"scene\">\n<p>무릎을 꿇었다. 지아와 눈높이가 같아졌다.<\/p>\n<p>가까이서 보니 지아의 눈 밑이 거뭇했다. 입술이 텄다. 이틀 전 통로에서 병철 오빠 등에 업혀 흐느끼던 얼굴. 좁은 데서는 숨이 안 쉬어진다던 애.<\/p>\n<p>손을 뻗었다. 손끝이 은사슬에 닿기 직전, 지아의 왼손이 무릎에서 미끄러졌다.<\/p>\n<p>검지에 반창고가 감겨 있었다. 사흘 전 실습 첫날, 메스에 벤 자리. 그 피를 보고 내가 쓰러질 뻔했고, 지아는 울먹이며 미안하다고 했다. 미, 미안해 이수야, 나 때문에. 자기 손가락이 찢어졌는데.<\/p>\n<p>반창고 가장자리가 들떠 있었다. 갈아 붙일 새도 없었던 모양이었다.<\/p>\n<p>나는 손을 거뒀다.<\/p>\n<p>손바닥을 허벅지에 문질렀다. 땀이 배어 있었다. 복도 끝 환풍기가 웅웅 돌았다. 실습실 문틈으로 새어 나오는 포르말린이 혀뿌리에 쓴 침을 고이게 했다. 문 하나 너머에 0412가 누워 있었다. 시트를 덮고, 엄지발가락에 흰 꼬리표 하나만 남긴 채.<\/p>\n<p>나는 일어나 실습실 문 유리창에 이마를 댔다. 유리가 차가웠다. 어둠 속에 스테인리스 해부대 스무 개가 관처럼 줄지어 있었다. 그중 하나, 시트 끝으로 삐져나온 회색 발이 비상등에 희미하게 보였다. 사흘 전 거기 묶여 있던 검은 꼬리표는 이제 없었다.<\/p>\n<p>오빠도 이랬을까.<\/p>\n<p>1등을 했다고 했다. 견습까지 했다고 했다. 그럼 오빠도 누군가의 목에서 이 사슬을 풀었을까. 잠든 누군가의 체온이 남은 금속을 쥐고, 이 복도를 달렸을까. 그래서 1등을 했을까.<\/p>\n<p>아니야. 우리 오빠는 안 그래.<\/p>\n<p>그런데 그걸 확인하려면, 나는 살아 있어야 했다. 오빠가 먼저 내려갔던 그 지하 끝까지 가려면.<\/p>\n<p>나는 오빠한테 맹세했다. 살아서 알아낸다고. 병철 오빠한테도 그랬다.<\/p>\n<p>05:47.<\/p>\n<p>2단위가 되면, 다음 밤 한 번만 더 털리면 1. 그다음은 DNR. 처치. 우람처럼 이름이 턴오버 맨 위에 걸리고. 여수의 엄마 휴대폰에 학교 번호가 뜨고. 엄마는 또 한 번도 울지 않을 것이다.<\/p>\n<p>지아가 잠결에 몸을 뒤척였다. 입술이 달싹였다.<\/p>\n<p>\"…엄마, 나 잘하고 있어….\"<\/p>\n<p>나는 눈을 감았다. 그리고 떴다.<\/p>\n<p>05:51.<\/p>\n<p>손이 떨렸다. 메스를 쥘 때는 한 번도 안 떨리던 손이었다. 은사슬의 고리를 손톱으로 더듬었다. 작은 걸쇠. 엄지로 밀었다. 딸깍, 하는 소리가 복도에 천둥처럼 울렸다.<\/p>\n<p>지아는 깨지 않았다.<\/p>\n<p>사슬이 목덜미에서 스르륵 빠져나왔다. 금속판이 내 손바닥에 떨어졌다. 지아의 체온이 남아 있었다. 따뜻했다. 그게 제일 견딜 수 없었다.<\/p>\n<p>나는 일어섰다. 뒤돌아보지 않았다.<\/p>\n<p>뛰었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-11 / 05:59]<\/div>\n<p>시계탑 앞 화단은 이슬에 젖어 있었다. 붉은 벽돌 아래, 정면 계단 옆에 놋쇠 투입구가 박혀 있었다. 우편함처럼 생긴 가느다란 틈. 그 위에 녹청이 낀 한자 두 글자. <span class=\"sys\">受付<\/span>.<\/p>\n<p>숨이 턱까지 찼다. 폐가 타는 것 같았다. 입 안에 쇠 맛이 돌았다.<\/p>\n<p>손바닥을 폈다. 땀에 젖은 꼬리표가 가로등 불빛에 검게 빛났다. 뒷면의 <span class=\"sys\">陸<\/span>이 나를 올려다봤다.<\/p>\n<p>틈에 밀어 넣었다.<\/p>\n<p>금속이 놋쇠 안쪽을 미끄러져 떨어지는 소리가 길게 이어졌다. 딸그락, 딸그락, 아주 깊은 곳까지. 우물에 돌을 던진 것처럼.<\/p>\n<p>머리 위에서 시계탑이 울었다.<\/p>\n<p>뎅.<\/p>\n<p>뎅.<\/p>\n<p>여섯 번. 종소리가 가슴뼈를 울렸다. 휴대폰이 떨었다.<\/p>\n<div class=\"doc\">06:00 라운딩 정산.<\/div>\n<div class=\"doc\">한이수 3 → 4 Unit. 수혈 완료.<\/div>\n<p>나는 화면을 다시 봤다. 4. 3이 아니라. 내 꼬리표를 가져간 누군가에게 빠져나갔어야 할 1단위가, 빠져나가지 않았다.<\/p>\n<p>그 아래 줄이 떠올랐다.<\/p>\n<div class=\"doc\">육지아 3 → 0 Unit.<\/div>\n<div class=\"doc\">동일 꼬리표 중복 투입 확인. 과다출혈. 잔여 전량 회수.<\/div>\n<div class=\"doc\">0412 육지아 — DNR.<\/div>\n<p>중복 투입.<\/p>\n<p>손에서 휴대폰이 미끄러질 뻔했다. 지아의 꼬리표는 오늘 밤 이미 한 번 이 틈으로 들어갔다는 뜻이었다. 누군가 그걸 뺏어서 넣고, 다시 지아 목에 걸어놨다는 뜻이었다. 잠든 애 목에. 내가 손을 뻗을 줄 알고.<\/p>\n<p>나는 지아를 2로 만든 게 아니었다.<\/p>\n<p>0으로 만들었다.<\/p>\n<p>화면 속에서 지아의 혈액백 세 개가 한꺼번에 비워졌다. 우람의 것이 비워지던 그 밤과 똑같은 애니메이션이었다. 붉은 액체가 아래로 빨려 나가고, 빈 비닐만 축 늘어졌다. 너무 정교해서, 진짜 피가 빠지는 것처럼 보였다.<\/p>\n<p>위장이 뒤집혔다. 나는 화단에 무릎을 꿇고 헛구역질을 했다. 나오는 건 쓴 위액뿐이었다. 이슬 젖은 흙냄새와 시큼한 냄새가 코를 찔렀다. 투입구의 놋쇠가 이마 옆에서 차갑게 빛났다.<\/p>\n<p><span class=\"sys\">受付<\/span>. 접수 완료.<\/p>\n<hr class=\"scene\">\n<p>어떻게 돌아왔는지 기억나지 않았다.<\/p>\n<p>정신을 차렸을 때 나는 실습실 앞 복도에 서 있었다. 지아는 아직 자고 있었다. 은사슬이 빠져나간 목에 사슬 자국이 빨갛게 남아 있었다. 나는 그쪽을 보지 못했다.<\/p>\n<p>내 사물함 문이 반쯤 열려 있었다.<\/p>\n<p>어젯밤 분명히 잠그고 나갔다. 손잡이에 손을 대자 금속이 얼음처럼 차가웠다. 문을 열었다.<\/p>\n<p>실습복과 아틀라스 사본 사이에, 은사슬 하나가 똬리를 틀고 있었다. 검은 금속판. <span class=\"sys\">No.0412<\/span>. 뒷면 <span class=\"sys\">韓<\/span>.<\/p>\n<p>내 꼬리표였다.<\/p>\n<p>집어 들었다. 사슬 고리가 하나도 상하지 않았다. 끊어 간 게 아니었다. 누군가 걸쇠를 풀었다. 내가 지아에게 한 것과 똑같이, 엄지로 조심스럽게. 금속판은 차가웠다. 누구의 체온도 남아 있지 않았다. 처음부터 아무도 쥐고 있지 않았던 것처럼.<\/p>\n<p>그 밑에 반으로 접힌 메모지가 깔려 있었다. 두꺼운 크림색 종이. 접힌 자리를 따라 붉은 봉랍이 눌려 있었다. 메스 문양. 오빠의 족보가 담겨 있던 봉투와 같은.<\/p>\n<p>손가락이 제멋대로 떨렸다. 봉랍이 툭 부서졌다.<\/p>\n<p>만년필로 쓴 단정한 글씨였다.<\/p>\n<p>\"훔칠 필요는 없었습니다. 당신의 꼬리표는 처음부터 제 책상에 있었으니까요. 좋은 선택이었습니다. — 집도의\"<\/p>","chars":4811},{"title":"표본실의 좌표","html":"<div class=\"timer\">[D-10 / 06:20]<\/div>\n<p>손목이 붙잡혔다.<\/p>\n<p>\"이수야.\"<\/p>\n<p>지아였다. 밤새 실습실 바닥에서 잔 얼굴에 사물함 모서리 자국이 붉게 패어 있었다. 손톱이 내 손목 안쪽 살을 파고들었다. 차가웠다. 그리고 떨렸다.<\/p>\n<p>\"누가 내 꼬리표 가져갔는지… 알아?\"<\/p>\n<p>복도 끝 환풍기가 덜덜 돌았다. 포르말린과 밤새 식은 커피 냄새가 섞여 목구멍에 걸렸다.<\/p>\n<p>\"몰라.\"<\/p>\n<p>왼쪽 귀가 화끈 달아올랐다. 나는 머리카락을 쓸어 귀를 덮었다. 지아의 눈이 그 손을 따라왔다가, 아무 말 없이 내려갔다.<\/p>\n<p>\"그렇구나.\"<\/p>\n<p>지아가 손을 놓았다. 손목에 초승달 네 개가 남았다.<\/p>\n<hr class=\"scene\">\n<p>오전 열 시, 학사 공지 알림이 의대 전체 단톡방에 떴다.<\/p>\n<div class=\"doc\">[학생지원팀] 본과 1학년 육○○ 학생, 예과 성적 산출 과정에서 부정행위 정황 확인. 징계위원회 회부 시까지 등교 정지.<\/div>\n<p>강의실이 술렁였다. 몇 분 뒤 턴오버에 글이 올라왔다. 교학과 직원 컴퓨터에 접속해 학점을 고친 IP 기록, 캡처 세 장. 댓글이 백 개를 넘는 데 십 분이 걸리지 않았다.<\/p>\n<div class=\"doc\">ㅋㅋ 조용한 애들이 더 무서움<\/div>\n<div class=\"doc\">지역균형 애들 다 털어봐야 함<\/div>\n<p>나는 화면을 끄지 못했다. 지아의 자리는 비어 있었다. 책상 위에 지아가 늘 쓰던 분홍 형광펜 하나만 굴러다녔다.<\/p>\n<p>카르테가 진동했다.<\/p>\n<div class=\"doc\">육지아 — 처치 완료.<\/div>\n<div class=\"doc\">보유 혈액: 4 Unit<\/div>\n<p>혈액백 네 개가 화면 속에서 출렁였다. 그중 하나는 지아의 것이었다. 나는 엄지로 그 아이콘을 눌렀다. 아무 일도 일어나지 않았다. 피는 돌려줄 수 없었다.<\/p>\n<p>점심시간, 1동 교학과 앞 복도에서 지아를 봤다.<\/p>\n<p>라면 상자 하나를 두 팔로 안고 있었다. 사물함에서 뺀 짐이었다. 모서리 밖으로 형광펜 뚜껑과 구겨진 족보 출력물이 삐져나와 있었다. 지아 옆에는 정장 차림의 남자 직원이 붙어 걸었다. 지아의 팔을 잡은 것도 아니고 안 잡은 것도 아닌 거리로.<\/p>\n<p>\"지아야.\"<\/p>\n<p>지아는 멈추지 않았다. 내 옆을 지나칠 때 상자에서 마른 포르말린 냄새가 훅 끼쳤다. 사흘은 간다던 그 냄새. 지아는 이제 그 냄새가 빠질 때까지 여기 올 일이 없을 것이다.<\/p>\n<p>현관 유리문이 닫혔다. 바깥의 봄볕이 상자 위 형광펜 뚜껑을 한 번 반짝 비추고, 지아는 그 빛과 함께 사라졌다.<\/p>\n<p>나는 내 오른손을 내려다봤다. 새벽에 꼬리표 끈을 끊던 손바닥에, 아직 가는 줄 자국이 붉게 남아 있었다.<\/p>\n<hr class=\"scene\">\n<p>오후 실습은 상지였다.<\/p>\n<p>\"오늘은 손바닥까지 간다. 손목굴 열고 정중신경 따라가.\"<\/p>\n<p>재석이 아틀라스를 펼쳐 들고 순서를 읽었다. 목소리는 어제와 똑같이 다정했다. 지아의 빈자리에 대해서는 아무도 말하지 않았다. 박선우만 \"지아 진짜 그랬대?\" 하고 물었다가, 병철 오빠의 눈짓에 입을 다물었다.<\/p>\n<p>카데바의 머리는 관례대로 거즈에 싸여 있었다. 나는 오른팔을 맡았다. 회색 손이 스테인리스 대 위에 손바닥을 위로 한 채 놓였다. 손가락이 길었다. 마디가 굵었다.<\/p>\n<p>메스로 손바닥 피부를 열기 전, 핀셋 끝으로 피부 결을 훑었다.<\/p>\n<p>그리고 멈췄다.<\/p>\n<p>엄지두덩 아래, 손바닥 한가운데. 오래된 흉터가 있었다. 하얗게 튀어나온 선이 둥글게 휘다가 끝에서 꺾였다. 갈고리처럼.<\/p>\n<p>낚싯바늘처럼.<\/p>\n<p>포르말린 냄새가 갑자기 짠 바닷바람 냄새로 바뀌었다. 오동도 방파제. 햇볕에 달궈진 테트라포드. 내 손등 쪽으로 날아오던 반짝이는 것, 그걸 가로막던 손.<\/p>\n<p>귀가 먹먹해졌다. 시야 가장자리가 하얗게 일어났다.<\/p>\n<p>아니다.<\/p>\n<p>손바닥 흉터는 흔하다. 유리에 베이고, 칼에 찍히고, 철사에 긁힌다. 사람 손은 원래 상처투성이다. 기증 시신 대부분은 노인이고, 노인의 손은 평생을 쥐고 산 손이다.<\/p>\n<p>\"이수, 왜. 또 하얘지나.\"<\/p>\n<p>병철 오빠가 내 어깨를 받쳤다.<\/p>\n<p>\"아니에요. 그냥… 흉터가 있어서.\"<\/p>\n<p>\"흉터 없는 손이 어딨노. 내 손 봐라, 구급차 문짝에 찍힌 거만 세 개다.\"<\/p>\n<p>그가 장갑 낀 손바닥을 흔들었다. 나는 웃는 척했다. 그리고 흉터를 피해, 그 옆으로 메스를 댔다. 피부가 열렸다. 흉터는 잘리지 않고 그대로 남았다.<\/p>\n<p>맞은편에서 무진이 그걸 봤다. 그는 아무 말도 하지 않았다. 다만 자기 쪽 왼손의 손목굴을 여는 속도가, 아주 조금 느려졌다.<\/p>\n<hr class=\"scene\">\n<p>실습이 끝나갈 무렵, 강하린이 0409조에서 건너왔다.<\/p>\n<p>붉은 동백 브로치가 가운 깃에서 번들거렸다. 향수 냄새가 포르말린을 찢고 들어왔다. 장미, 그리고 돈 냄새.<\/p>\n<p>\"0412조, 잠깐 얘기 좀 해.\"<\/p>\n<p>하린은 우리 카데바 옆에 팔짱을 끼고 섰다.<\/p>\n<p>\"지아 빠졌잖아. 너넨 이제 다섯. 우리 조랑 합치자. 꼬리표 지키는 것도 머릿수 싸움이야.\"<\/p>\n<p>\"리더는?\"<\/p>\n<p>무진이 물었다. 고개도 들지 않고.<\/p>\n<p>\"당연히 나지. 할아버지 쪽 원로들이 우리 조 지켜봐. 후원 받으려면 얼굴이 필요하잖아.\"<\/p>\n<p>하린의 시선이 내 가방으로 내려갔다. 지퍼 틈으로 오빠의 아틀라스 모서리가 보였다.<\/p>\n<p>\"조건 하나. 그 아틀라스, 공유해.\"<\/p>\n<p>\"싫은디.\"<\/p>\n<p>말이 먼저 나갔다. 하린의 눈썹이 올라갔다.<\/p>\n<p>\"뭐라고?\"<\/p>\n<p>\"싫다고. 오빠 거여. 니 할아부지 원로든 뭐든.\"<\/p>\n<p>재석이 웃으며 끼어들었다. \"에이, 하린아, 다들 예민해서 그래. 생각해볼게.\" 매끄러웠다. 거절인지 승낙인지 알 수 없을 만큼. 무진은 핀셋을 내려놓으며 짧게 말했다.<\/p>\n<p>\"난 안 해.\"<\/p>\n<p>\"서무진, 너 혼자 살 수 있을 것 같아?\"<\/p>\n<p>\"응.\"<\/p>\n<p>하린의 입꼬리가 굳었다. 동맹은 시작도 전에 금이 갔다. 그녀는 브로치를 한 번 매만지고 돌아섰다. 돌아서면서 내 귀에만 들리게 말했다.<\/p>\n<p>\"그 아틀라스에 뭐가 있는지, 나도 곧 알게 될 거야.\"<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-10 / 20:15]<\/div>\n<p>기숙사 책상에 아틀라스를 펼쳤다.<\/p>\n<p>핀 구멍이 뚫린 페이지는 일곱 장이었다. 맨 뒤에는 오빠가 풀로 붙여 둔 누런 복사본 — 옛 대한의원 본관, 시계탑 건물의 층별 평면도.<\/p>\n<p>나는 일곱 장을 겹쳐 평면도 위에 포갰다. 휴대폰 손전등을 종이 아래에 댔다. 빛이 구멍을 통과했다.<\/p>\n<p>흩어져 있던 점들이 한 줄로 이어졌다.<\/p>\n<p>지상층이 아니었다. 지하 1층도, 2층도 아니었다. 점들은 평면도 가장 아래, 계단실 옆에 연필로 덧그려진 사각형 안으로 떨어졌다. 마지막 구멍 두 개가 화살표의 머리를 만들었다.<\/p>\n<p>화살표 옆에, 아주 작게. 오빠 글씨로.<\/p>\n<div class=\"doc\">B3 — 제0<\/div>\n<p>손전등이 손에서 미끄러졌다. 빛이 천장으로 튀었다.<\/p>\n<p>시계탑 지하 3층. 지도에 없는 층. 호명되던 새벽의 그 원형 공간, 스피커 너머 집도의의 목소리가 흘러나오던 곳보다 한 층 더 아래.<\/p>\n<p>오빠는 거기에 갔다. 그리고 내가 따라올 길을 구멍으로 남겼다.<\/p>\n<p>카르테를 열었다. 규칙 목록을 끝까지 내렸다. 금지 항목 네 번째 줄이 붉게 깜빡였다.<\/p>\n<div class=\"doc\">④ 시계탑 지하 3층 무단 진입 — 즉시 DNR.<\/div>\n<p>나는 화면과 화살표를 번갈아 봤다. 오빠는 금지된 문 앞에 화살표를 그려 놓았다. 오빠다웠다. 어릴 적에도 \"들어가지 마시오\" 팻말이 붙은 등대 철문 앞에서 나를 돌아보며 씩 웃던 사람.<\/p>\n<p>책상 스탠드 불빛 아래, 일곱 장의 종이를 통과한 빛이 내 손등 위에 작은 점 일곱 개로 떨어져 있었다. 꼭 피 방울처럼.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-10 / 21:40]<\/div>\n<p>밤의 실습실은 냉장고 안 같았다.<\/p>\n<p>비상등 하나만 켜두었다. 초록빛이 스테인리스 대 위에서 미끄러졌다. 환풍기가 낮게 울었고, 어디선가 물방울이 일정한 간격으로 떨어졌다. 똑. 똑.<\/p>\n<p>나는 0412의 시트를 손목까지만 걷었다.<\/p>\n<p>회색 손. 열어둔 손바닥. 그리고 흉터.<\/p>\n<p>장갑을 벗었다. 규정 위반이었다. 상관없었다. 맨손가락으로 흉터를 더듬었다. 딱딱했다. 차가웠다. 포르말린이 손끝 살갗을 따끔하게 물었다.<\/p>\n<p>\"아니지?\"<\/p>\n<p>목소리가 실습실 타일에 부딪혀 돌아왔다.<\/p>\n<p>\"아니라고 해. 응? 아니라고….\"<\/p>\n<p>손을 쥐었다. 굳은 손가락은 내 손을 마주 쥐지 않았다. 그래도 놓을 수가 없었다. 어릴 적 방파제에서 피투성이가 된 손으로 내 머리를 쓰다듬던 감촉이, 이 차가운 손 위에 겹쳐 떠오르려 했다. 나는 이를 악물고 그걸 밀어냈다.<\/p>\n<p>흔한 흉터다. 흔한 흉터다. 흔한—.<\/p>\n<p>문이 열리는 소리가 났다.<\/p>\n<p>나는 손을 놓지 못한 채 고개만 돌렸다. 무진이 문간에 서 있었다. 후드 위에 가운을 걸친 채. 초록 비상등이 그의 얼굴 반쪽만 비췄다.<\/p>\n<p>그는 나를 봤다. 내 맨손을 봤다. 내 손이 잡고 있는 손을 봤다.<\/p>\n<p>혼날 줄 알았다. 규정 위반이라고, 나가라고.<\/p>\n<p>그는 아무 말 없이 걸어와 내 옆 의자에 앉았다. 그리고 시트 끝자락을 집어 들었다. 내 손 위로, 0412의 손 위로, 천천히 덮었다. 이불을 덮어주듯이. 차가운 면이 내 손등에 내려앉았다.<\/p>\n<p>시트 아래에서 나는 비로소 손을 뗐다.<\/p>\n<p>한참 둘 다 말이 없었다. 그의 어깨가 내 어깨에서 한 뼘 떨어져 있었다. 비누 냄새가 났다. 첫날 내 눈을 덮던 손의 냄새.<\/p>\n<p>\"니는 왜 맨날 혼자야.\"<\/p>\n<p>내 목소리가 갈라졌다.<\/p>\n<p>\"밥도 혼자 묵고, 실습 끝나도 혼자 가고. 사람들이 니 무섭다 해.\"<\/p>\n<p>무진은 시트 위, 내 손이 있던 자리를 내려다봤다.<\/p>\n<p>\"같이 있으면 다치니까.\"<\/p>\n<p>\"누가.\"<\/p>\n<p>그는 대답 대신 일어났다. 의자 다리가 타일을 긁는 소리가 길게 울렸다.<\/p>\n<p>\"장갑 껴. 포르말린 피부로 먹어.\"<\/p>\n<p>문이 닫혔다. 나는 시트 아래 불룩한 손의 윤곽을 보다가, 가방을 집어 들었다.<\/p>\n<hr class=\"scene\">\n<p>그를 따라간 건 충동이었다.<\/p>\n<p>2동 뒷문, 함춘원 담장을 끼고 도는 어두운 길. 무진은 한 번도 뒤돌아보지 않았다. 운동화 밑창이 젖은 보도블록을 밟는 소리만 앞에서 규칙적으로 났다. 나는 그 리듬에 맞춰 발을 디뎠다.<\/p>\n<p>시계탑이 나타났다.<\/p>\n<p>붉은 벽돌 위로 하얀 시계판이 떠 있었다. 바늘이 열 시 오십 분을 가리켰다. 밤바람에 탑 뒤 측백나무가 쉭쉭 울었다. 차가운 공기에 숨이 하얗게 피었다.<\/p>\n<p>무진이 탑 뒤편 그늘로 들어갔다. 거기, 누군가 서 있었다.<\/p>\n<p>키가 크지도 작지도 않은 실루엣. 검은 코트. 모자. 얼굴은 그림자에 잠겨 있었다.<\/p>\n<p>나는 측백나무 뒤에 몸을 붙였다. 젖은 잎이 뺨을 쓸었다. 송진 냄새. 심장이 갈비뼈 안쪽을 두드렸다. 너무 커서, 저들에게도 들릴 것 같았다.<\/p>\n<p>그림자 속 사람이 고개를 살짝 기울였다. 이쪽으로. 나는 숨을 멈췄다. 폐가 타들어갔다. 혀 밑에 쇠 맛 나는 침이 고였다.<\/p>\n<p>무진이 반 걸음 옆으로 움직였다. 그의 등이 상대의 시선과 측백나무 사이를 막았다. 우연인지 아닌지 알 수 없는 각도였다. 그림자가 다시 무진 쪽으로 돌아섰다.<\/p>\n<p>무진이 가방에서 서류 한 장을 꺼냈다. 상대가 받아들었다. 몇 마디 오갔지만 바람이 다 가져갔다. 상대가 서류를 펼쳐 가로등 쪽으로 기울였다.<\/p>\n<p>주황색 불빛이 종이 위로 쏟아졌다.<\/p>\n<p>세 걸음 거리였다. 인쇄된 고딕체가 또렷했다.<\/p>\n<div class=\"doc\">감찰 보고 — No.0412 한이수.<\/div>\n<div class=\"doc\">제0표본실에 대한 관심 높음. 처치 보류 요청.<\/div>","chars":4946},{"title":"4℃","html":"<div class=\"timer\">[D-10 / 23:31]<\/div>\n<p>종이가 접히는 소리에 나는 측백나무에서 등을 뗐다.<\/p>\n<p>뒤도 돌아보지 않고 걸었다. 뛰면 들킬 것 같았다. 운동화 밑창이 젖은 보도블록에 쩍쩍 달라붙었다. 시계탑 종이 울리지 않는 게 이상하게 고마웠다.<\/p>\n<p>처치 보류 요청.<\/p>\n<p>보류. 그러니까 언젠가는, 처치.<\/p>\n<p>손끝이 얼얼했다. 비상등 아래에서 그가 시트를 덮어주던 손. 그 손이 방금 내 이름이 적힌 종이를 넘겼다. 두 장면이 머릿속에서 겹쳐지지 않았다. 겹쳐지지 않아서 더 메스꺼웠다.<\/p>\n<p>주머니 속 휴대폰이 진동했다.<\/p>\n<p>카르테였다. 처음 보는 개인 메시지 창. 발신인 칸에 낯익은 이름이 떠 있었다.<\/p>\n<div class=\"doc\">오병철: 지하 2층 냉장실. 지아가 남긴 거 찾았다. 빨리.<\/div>\n<p>나는 걸음을 멈췄다.<\/p>\n<p>오빠는 카르테로 문자를 보낸 적이 없었다. 늘 전화였다. \"이수, 응급이가?\" 그 목소리부터 들려야 오빠였다.<\/p>\n<p>통화 버튼을 눌렀다. 신호음이 일곱 번 가다가 끊겼다.<\/p>\n<p>지아가 남긴 것. 상자를 안고 유리문 밖으로 사라지던 지아. 그 애가 무언가 남겼다면, 그걸 찾아낸 게 오빠라면.<\/p>\n<p>나는 2동 쪽으로 뛰기 시작했다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-10 / 23:40]<\/div>\n<p>지하 2층 복도는 지하 1층보다 두 도는 더 추웠다.<\/p>\n<p>형광등이 한 칸 걸러 하나씩만 켜져 있었다. 바닥 에폭시에 내 그림자가 늘어났다 줄어들었다. 복도 끝, 두꺼운 스테인리스 문 위에 붉은 글씨.<\/p>\n<div class=\"doc\">시신 냉장보관실 — 관계자 외 출입금지<\/div>\n<p>문이 한 뼘쯤 열려 있었다. 틈새로 하얀 냉기가 바닥을 기어 나왔다. 발목이 시렸다.<\/p>\n<p>\"오빠?\"<\/p>\n<p>대답이 없었다. 냉각기 팬 돌아가는 소리만 웅웅 울렸다.<\/p>\n<p>안으로 들어섰다. 공기가 날카로웠다. 숨을 들이쉴 때마다 콧속 점막이 따끔따끔 얼었다. 포르말린이 아니라 다른 냄새가 났다. 금속, 표백제, 그리고 아주 희미하게 달큰한 무언가.<\/p>\n<p>벽면을 따라 스테인리스 선반이 삼단으로 서 있었다. 선반마다 흰 시신 백이 누워 있었다. 지퍼 손잡이에 번호표. 0398, 0401, 0405.<\/p>\n<p>맨 안쪽 선반 하나만 달랐다.<\/p>\n<p>백이 비어 있었다. 반쯤 열린 지퍼 사이로 은박 단열 안감이 번들거렸다. 손잡이에 매달린 이름표에, 매직 글씨.<\/p>\n<div class=\"doc\">한이수<\/div>\n<p>등줄기를 타고 얼음물이 흘렀다.<\/p>\n<p>뒤에서 철컥, 소리가 났다.<\/p>\n<p>돌아봤을 때 문은 이미 닫혀 있었다. 손잡이를 잡아당겼다. 꿈쩍도 하지 않았다. 안쪽에는 손잡이만 있고 잠금장치가 없었다. 이 문은 밖에서만 열린다.<\/p>\n<p>\"누구야! 문 열어!\"<\/p>\n<p>주먹으로 문을 쳤다. 두꺼운 강철이 소리를 다 삼켰다. 주먹 뼈만 울렸다.<\/p>\n<p>휴대폰. 신호 막대가 하나도 없었다. 카르테만 혼자 빛났다.<\/p>\n<div class=\"doc\">보유 혈액: 4 Unit<\/div>\n<p>문 옆 디지털 온도계가 초록 숫자로 깜빡였다.<\/p>\n<div class=\"doc\">4.0℃<\/div>\n<p>그리고 내가 보는 앞에서, 숫자가 바뀌었다.<\/p>\n<div class=\"doc\">3.8℃<\/div>\n<hr class=\"scene\">\n<div class=\"timer\">[D-10 / 23:49]<\/div>\n<p>이가 맞부딪치기 시작했다.<\/p>\n<p>딱딱딱. 턱이 내 것이 아닌 것처럼 떨었다. 손가락 끝이 먼저 하얘졌다. 감각이 손톱 밑부터 빠져나갔다.<\/p>\n<p>생각해. 한이수. 생각해.<\/p>\n<p>아틀라스의 체온 조절 단원이 눈앞에 펼쳐졌다. 오빠가 형광펜으로 박스를 쳐둔 페이지. 열은 네 갈래로 빠져나간다. 전도, 대류, 복사, 증발. 차가운 바닥에 닿은 면으로, 흐르는 공기로, 드러난 머리와 목으로, 젖은 피부로.<\/p>\n<p>나는 바닥에서 일어났다. 엉덩이 아래 에폭시가 얼음판처럼 열을 빨아가고 있었다.<\/p>\n<p>빈 시신 백. 내 이름이 붙은 백.<\/p>\n<p>손이 떨렸다. 지퍼를 끝까지 내렸다. 은박 안감이 바스락거렸다. 이송용 보온 백이었다. 시신의 부패를 늦추려고 냉기를 가두는 안감은, 거꾸로 쓰면 체온을 가둔다.<\/p>\n<p>\"미친 거 아이가, 이수야.\"<\/p>\n<p>혼잣말이 사투리로 나왔다. 그래도 했다.<\/p>\n<p>옆 선반에서 빈 백 두 개를 더 끌어내렸다. 하나는 바닥에 깔고, 하나는 접어 그 위에 올렸다. 바닥과 내 몸 사이에 두 겹. 그 위에 앉아 내 이름이 붙은 백을 어깨부터 뒤집어썼다. 머리와 목을 감쌌다. 겨드랑이에 손을 끼우고 무릎을 가슴에 붙였다.<\/p>\n<p>비닐 안쪽에서 내 숨이 습하게 돌았다. 표백제 냄새가 코를 찔렀다. 이 백 안에 누가 누워 있었을까. 그 생각을 하지 않으려고 숫자를 셌다.<\/p>\n<div class=\"doc\">2.9℃<\/div>\n<div class=\"doc\">23:56<\/div>\n<hr class=\"scene\">\n<div class=\"timer\">[D-10 / 23:58]<\/div>\n<p>문이 열렸다.<\/p>\n<p>흰 빛이 쏟아졌다. 실루엣 하나가 뛰어들었다.<\/p>\n<p>\"한이수!\"<\/p>\n<p>무진이었다. 숨이 거칠었다. 계단을 몇 개씩 뛰어 내려온 숨이었다. 그의 손에 은색 카드키가 쥐어져 있었다. 학생증이 아니었다. 교직원용 마스터키였다.<\/p>\n<p>그가 내 앞에 무릎을 꿇었다. 백 틈으로 내 얼굴을 확인하는 그의 눈이 처음으로 흔들렸다.<\/p>\n<p>\"괜찮아? 손 줘봐.\"<\/p>\n<p>\"니가… 그거 어디서 났어.\"<\/p>\n<p>\"나중에.\"<\/p>\n<p>\"니가 어떻게 그 카드를—\"<\/p>\n<p>그 순간, 등 뒤에서 철컥.<\/p>\n<p>우리는 동시에 돌아봤다. 문이 닫혀 있었다. 무진이 튀어 올라 문으로 갔다. 카드를 대려 했지만 안쪽에는 리더기가 없었다. 그는 손바닥으로 문을 한 번 쳤다. 텅, 소리가 냉기 속에 퍼졌다가 사라졌다.<\/p>\n<p>그가 이마를 문에 댔다. 아주 잠깐.<\/p>\n<p>\"…둘 다 갇혔네.\"<\/p>\n<p>내 목소리가 웃음처럼 떨렸다.<\/p>\n<p>무진이 돌아섰다. 휴대폰을 꺼내 화면을 확인하고, 짧게 숨을 뱉었다. 신호 없음.<\/p>\n<p>\"들어오기 전에 병철 형한테 문자 보냈어.\"<\/p>\n<p>\"오빠한테? 니가?\"<\/p>\n<p>\"십 분 안에 내가 안 나오면, 문 뜯으라고.\"<\/p>\n<p>\"오빠가 니 문자를 믿겄냐.\"<\/p>\n<p>\"안 믿겠지.\"<\/p>\n<p>그는 내 옆에 앉으며 손목시계를 봤다. 나도 봤다. 23시 59분. 십 분은 길었다. 이 온도에서 십 분은 아주 길었다.<\/p>\n<p>\"근데 나 부른 거, 오빠 이름이었어.\"<\/p>\n<p>내가 카르테 메시지 창을 내밀었다. 무진은 화면을 오래 보지 않았다. 대신 턱에 힘이 들어갔다.<\/p>\n<p>\"그 형은 이런 거 안 보내. 넌 알잖아.\"<\/p>\n<p>알았다. 알면서 뛰어왔다. 지아라는 이름 하나에.<\/p>\n<div class=\"timer\">[D-9 / 00:00]<\/div>\n<p>손바닥 위에서 카르테가 진동했다. 신호가 없는데도 화면은 제멋대로 밝아졌다. 매일 자정의 공지. 오늘의 증례.<\/p>\n<div class=\"doc\">증례 2 — 저체온 환자 2명. 가용 자원 1인분.<\/div>\n<div class=\"doc\">중증도를 분류하시오.<\/div>\n<p>나는 화면을 뒤집어 은박 위에 엎었다. 무진이 그 손을 내려다봤다. 둘 다 아무 말도 하지 않았다. 이게 증례였다. 우리가 환자였다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-9 / 00:21]<\/div>\n<div class=\"doc\">0.8℃<\/div>\n<p>무진이 가운을 벗었다. 그 아래 후드티까지 벗었다. 얇은 반팔 차림이 됐다.<\/p>\n<p>\"미쳤나, 니 얼어 죽어.\"<\/p>\n<p>\"넌 지방이 없어.\"<\/p>\n<p>그는 가운과 후드를 내 은박 백 위로 덮어 씌웠다. 그의 체온이 남은 천이 어깨에 내려앉았다. 비누 냄새가 났다. 그리고 그가 내 뒤에 앉았다. 등과 등이 맞닿았다.<\/p>\n<p>얇은 천 너머로 그의 척추가 느껴졌다. 마디 하나하나. 그리고 그 너머, 심장.<\/p>\n<p>쿵. 쿵. 쿵.<\/p>\n<p>내 심장보다 느렸다. 일부러 느리게 쉬는 숨이었다. 나는 모르는 사이 그 박자에 숨을 맞추고 있었다.<\/p>\n<p>\"넷 세고 들이쉬어. 넷 세고 내쉬어.\"<\/p>\n<p>\"알아. 의대생이거든.\"<\/p>\n<p>\"그럼 해.\"<\/p>\n<p>한참 동안 냉각기 소리와 둘의 숨소리만 있었다. 등이 조금씩 따뜻해졌다. 그 따뜻함이 그의 것이라는 사실이 이상하게 목을 조였다.<\/p>\n<p>\"시계탑에서.\"<\/p>\n<p>내가 말했다. 이빨 사이로 말이 끊겨 나왔다.<\/p>\n<p>\"누구 만났어.\"<\/p>\n<p>등 뒤의 몸이 굳지 않았다. 숨도 흐트러지지 않았다. 마치 그 질문을 기다렸다는 듯.<\/p>\n<p>\"봤구나.\"<\/p>\n<p>\"봤어. 다 봤어. 내 이름. 처치 보류.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"니 뭐야. 서무진. 니 대체 뭔디.\"<\/p>\n<p>그가 고개를 뒤로 기댔다. 그의 뒤통수가 내 뒤통수에 닿았다. 젖은 머리카락이 차가웠다.<\/p>\n<p>\"널 지키는 게 보고 내용이야.\"<\/p>\n<p>\"그게 무슨—\"<\/p>\n<p>\"그것만 믿어.\"<\/p>\n<p>더는 아무것도 말하지 않았다. 나는 그 말을 이빨로 씹어보았다. 지킨다. 보고한다. 둘이 한 문장 안에 들어가 있었다. 어느 쪽이 거짓말인지 알 수 없었다. 어쩌면 둘 다 진짜라서 더 무서웠다.<\/p>\n<p>\"니가 날 지킨다고? 그럼 그 종이는 뭔데. 니가 내 이름 써서 갖다 바친 거잖아.\"<\/p>\n<p>\"보류라고 썼어.\"<\/p>\n<p>\"그게 뭐가 다른디!\"<\/p>\n<p>목이 터지듯 소리가 나왔다. 냉기 속에서 내 고함은 하얀 입김으로 흩어졌다. 그의 등이 아주 조금, 내 쪽으로 기울었다. 밀어내지도 다가오지도 않는 무게였다.<\/p>\n<p>\"보류가 아니면, 넌 오늘 밤 여기서 혼자였어.\"<\/p>\n<p>나는 입을 다물었다. 이 냉장실. 내 이름이 붙은 백. 처치는 늘 06:00에 오는 게 아니었다.<\/p>\n<p>내 손이 등 뒤로 더듬어 그의 손을 찾았다. 그도 피하지 않았다. 차가운 손가락이 내 손가락 사이로 들어왔다. 그는 아프지 않을 만큼, 그러나 빠져나갈 수 없을 만큼 쥐었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-9 / 00:47]<\/div>\n<div class=\"doc\">−2.0℃<\/div>\n<p>등이 더 이상 따뜻하지 않았다.<\/p>\n<p>이상했다. 내 몸은 은박과 그의 옷에 싸여 간신히 떨고 있는데, 등 뒤의 떨림이 멈춰 있었다. 저체온에서 떨림이 멈추는 건 나아지는 게 아니라는 걸, 나는 교과서로 알았다.<\/p>\n<p>\"서무진.\"<\/p>\n<p>대답이 늦었다.<\/p>\n<p>\"…응.\"<\/p>\n<p>몸을 돌렸다. 은박이 바스락거렸다. 그의 얼굴이 비상등 아래 드러났다. 입술이 파랬다. 속눈썹 끝에 하얀 서리가 앉아 있었다. 반팔 아래 팔뚝에 소름이 아니라 대리석 같은 얼룩이 퍼지고 있었다.<\/p>\n<p>\"야. 눈 떠. 눈 뜨라고.\"<\/p>\n<p>\"떴어.\"<\/p>\n<p>그는 웃으려 했다. 입꼬리가 제대로 올라가지 않았다.<\/p>\n<p>나는 내 몸을 감싼 가운을 벗겨 그에게 둘렀다. 그가 손목으로 밀어냈다. 힘이 없었다. 나는 그의 손목을 잡았다. 요골동맥. 검지와 중지를 댔다.<\/p>\n<p>하나. 둘.<\/p>\n<p>셋.<\/p>\n<p>간격이 길었다. 너무 길었다. 손끝 아래에서 맥이 한 번 뛰고, 한참을 망설이다가, 또 한 번.<\/p>\n<p>나는 그의 두 손을 끌어다 내 가슴팍과 은박 사이에 밀어 넣었다. 얼음덩이를 품은 것 같았다. 숨이 턱 막혔다. 그래도 놓지 않았다. 손등에 입김을 불었다. 하, 하. 하얀 김이 그의 손가락 사이에서 금세 사라졌다.<\/p>\n<p>\"니 지금 가운까지 나 주고 뭐 하자는 거여. 영웅 놀이 하냐.\"<\/p>\n<p>\"…계산한 거야.\"<\/p>\n<p>\"뭘.\"<\/p>\n<p>\"너 먼저 떨어지면, 나 혼자 못 버텨.\"<\/p>\n<p>말이 안 되는 계산이었다. 그는 수석이었고, 수석은 이런 계산을 틀리지 않았다. 일부러 틀린 거였다.<\/p>\n<p>다시 손목을 짚었다.<\/p>\n<p>\"느려지고 있어.\"<\/p>\n<p>내 목소리가 내 것이 아니었다. 그의 고개가 내 어깨 쪽으로 천천히 기울었다. 무거웠다. 내 뺨에 닿은 그의 이마가 냉장실 강철처럼 차가웠다.<\/p>\n<p>\"이수야.\"<\/p>\n<p>처음이었다. 성 없이 이름만 부른 건.<\/p>\n<p>\"…괜찮아. 넌 나가.\"<\/p>\n<p>천장 어딘가에서 지직, 하고 스피커가 켜지는 소리가 났다.<\/p>\n<p>변조된 목소리. 함춘원 지하 원형 공간에서 규칙을 처방처럼 읽던, 그 목소리가 냉기 속으로 부드럽게 흘러내렸다.<\/p>\n<p>\"둘 중 한 명만 꺼내드리죠.\"<\/p>\n<p>맥이 손끝 아래에서 한 번, 희미하게 뛰었다.<\/p>\n<p>\"누구로 할까요?\"<\/p>","chars":4901},{"title":"쇼 커플","html":"<div class=\"timer\">[D-9 / 00:49]<\/div>\n<p>\"나.\"<\/p>\n<p>입술이 그 모양을 만들었다. 소리가 나오기 직전이었다.<\/p>\n<p>\"얘.\"<\/p>\n<p>무진의 목소리가 먼저였다. 내 어깨에 이마를 기댄 채, 얼어붙은 입술로. 그의 손이 내 손목을 쥐었다. 아프지 않을 만큼, 그러나 말을 막을 만큼.<\/p>\n<p>\"얘 꺼내.\"<\/p>\n<p>\"닥쳐, 니가 뭔디 그걸—\"<\/p>\n<p>스피커가 대답하기 전에, 문 밖에서 쇳소리가 났다.<\/p>\n<p>깡. 깡. 끼이익.<\/p>\n<p>망치가 금속을 때리는 소리. 그리고 무언가 길게 뽑혀 나오는 소리. 문 위쪽 모서리가 덜컹 흔들렸다. 깡. 아래쪽에서 한 번 더. 강철 문이 경첩 쪽부터 비스듬히 기울더니, 바깥으로 쿵 쓰러졌다.<\/p>\n<p>복도 형광등 빛 속에 거대한 그림자가 서 있었다. 한 손에 장도리, 한 손에 일자 드라이버. 이마에 땀이 번들거렸다.<\/p>\n<p>\"구조대 도착.\"<\/p>\n<p>병철 오빠가 숨을 몰아쉬며 우리를 내려다봤다. 은박 백 속에서 엉켜 있는 둘을.<\/p>\n<p>\"요구조자 둘. 둘 다 의식 있음.\"<\/p>\n<p>그의 눈이 내 가슴팍에 밀어 넣어진 무진의 두 손에 가 꽂혔다.<\/p>\n<p>\"…분위기 수상함.\"<\/p>\n<hr class=\"scene\">\n<p>그다음은 오빠의 시간이었다.<\/p>\n<p>오빠는 무진을 복도 바닥에 눕히고 젖은 반팔을 가위로 잘라냈다. 가방에서 은박 보온포를 꺼내 둘둘 말았다. 구급대 시절부터 들고 다닌다던 그 가방이었다. 손바닥으로 무진의 뺨을 철썩 쳤다.<\/p>\n<p>\"이름.\"<\/p>\n<p>\"…서무진.\"<\/p>\n<p>\"오늘 날짜.\"<\/p>\n<p>\"3월 8일.\"<\/p>\n<p>\"니 주제.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"됐다, 의식 명료.\"<\/p>\n<p>오빠는 그러면서도 무진의 겨드랑이에 핫팩을 끼우는 손을 멈추지 않았다. 나는 벽에 기대 앉아 그걸 봤다. 손끝이 녹으면서 바늘 수백 개가 찌르는 것처럼 저렸다. 코끝에서 콧물이 흘러 윗입술에 닿았다. 짠맛이 났다. 살아 있는 맛이었다.<\/p>\n<p>\"오빠, 어떻게 알았어요.\"<\/p>\n<p>\"저 자슥이 문자 보냈더라.\"<\/p>\n<p>오빠가 턱으로 무진을 가리켰다. 경첩 핀을 뽑느라 까진 손가락 마디에서 피가 배어 나왔다. 나는 얼른 고개를 돌렸다.<\/p>\n<p>\"십 분 안에 안 나오면 문 뜯으라고. 기분 더럽게.\"<\/p>\n<p>그는 장도리를 가방에 쑤셔 넣었다.<\/p>\n<p>\"근데 와 그 자슥 문자를 믿었는지, 나도 모르겠다.\"<\/p>\n<p>천장 스피커가 지직, 한 번 울었다. 우리 셋이 동시에 고개를 들었다.<\/p>\n<p>\"구조대라. 예정에 없던 변수군요.\"<\/p>\n<p>변조된 목소리가 웃는 것 같았다.<\/p>\n<p>\"증례 2는 미완으로 기록하겠습니다. 수고하셨습니다, 0412조.\"<\/p>\n<p>스피커가 꺼졌다. 냉각기 팬 소리만 남았다. 쓰러진 문 너머로 은박 백 세 개가 바닥에 구겨져 있었다. 그중 하나에 매직으로 쓴 내 이름이, 복도 불빛을 받아 거꾸로 번들거렸다.<\/p>\n<p>나는 그 백을 집어 들어 이름표를 뜯어냈다. 손가락이 아직 곱아 세 번 만에 뜯겼다. 오빠가 장도리를 다시 꺼내 스피커 쪽을 노려봤다. 손이 닿지 않는 높이였다. 그는 침을 뱉듯 숨을 내뱉고, 무진의 팔을 자기 어깨에 걸쳤다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-9 / 08:10]<\/div>\n<p>아침, 카르테가 미친 듯이 울렸다.<\/p>\n<div class=\"doc\">[관람실 하이라이트] 4℃의 밤 — 0412조<\/div>\n<p>재생 버튼을 누르지 않았는데 영상이 돌아갔다. 천장 모서리에서 내려다본 흑백 화면. 은박 백 속 두 사람. 내가 그의 손을 가슴에 품는 장면. 그의 이마가 내 어깨로 기우는 장면. 소리는 지워져 있었다. 대신 화면 아래로 흰 글자가 흘렀다.<\/p>\n<div class=\"doc\">♥ 백의 K.M. 님이 1 Unit을 후원했습니다.<\/div>\n<div class=\"doc\">♥ 백의 J.S. 님이 1 Unit을 후원했습니다.<\/div>\n<div class=\"doc\">보유 혈액: 6 Unit<\/div>\n<p>혈액백 여섯 개가 화면 가득 출렁였다. 그 아래 작은 회색 글씨.<\/p>\n<div class=\"doc\">후원 차트 번호 발급: B-0791, B-0792<\/div>\n<p>빚이었다. 누군가 와인잔을 들고 우리가 얼어 죽어가는 걸 보다가, 손가락 하나로 값을 매겼다. 나는 그 숫자를 오래 노려봤다. 입안에 쓴 침이 고였다.<\/p>\n<p>그때 화면 맨 위로 빨간 띠가 떴다.<\/p>\n<div class=\"doc\">[집도의 공지] 0412조에 감찰이 있습니다.<\/div>\n<div class=\"doc\">제9조(감찰과 호명자의 사적 관계) 위반 의심.<\/div>\n<p>복도에서 하린과 마주쳤다. 그녀는 휴대폰 화면을 내 얼굴 앞에 흔들었다. 하이라이트 영상이 무한 반복되고 있었다.<\/p>\n<p>\"쇼 잘 봤어. 시청률 대박이더라.\"<\/p>\n<p>\"비켜.\"<\/p>\n<p>\"원로들이 왜 너한테 피를 붓는지 알아?\"<\/p>\n<p>하린이 한 걸음 다가왔다. 장미 향수가 코를 찔렀다.<\/p>\n<p>\"사랑 이야기 좋아해서가 아니야. 제9조 걸린 커플이 언제 같이 DNR 되는지, 그 순간 보려고 거는 거야. 경마처럼.\"<\/p>\n<p>그녀가 내 가운 깃을 손끝으로 툭 털었다. 먼지 하나 없는 깃을.<\/p>\n<p>\"잘 달려, 한이수. 다들 너 넘어지는 데 걸었으니까.\"<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-9 / 09:30]<\/div>\n<p>재석이 0412조를 2동 뒤 벤치로 불러 모았다.<\/p>\n<p>봄바람이 쌀쌀했다. 벤치 옆 화단에서 흙냄새와 담배꽁초 냄새가 올라왔다. 다섯 명이 둥글게 섰다. 박선우는 영문도 모르고 커피만 홀짝였다. 선우를 뺀 나머지 넷의 휴대폰에는 같은 빨간 띠가 떠 있었다.<\/p>\n<p>\"선우야, 미안한데 잠깐만 자리 좀.\"<\/p>\n<p>재석이 웃으며 선우를 보냈다. 그리고 웃는 얼굴 그대로 무진을 봤다.<\/p>\n<p>\"무진아. 우리 이거, 확인은 하고 가자.\"<\/p>\n<p>무진은 벤치 등받이에 기댄 채 아무 말도 하지 않았다. 얼굴이 아직 창백했다. 손등에 동상 자국이 붉게 남아 있었다.<\/p>\n<p>\"어젯밤 냉장실 카드키. 그거 교직원용이잖아. 너 그거 어디서 났어?\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"난 너 안 믿고 싶지 않아. 정말이야. 근데 공지 떴고, 영상 떴고, 그 안에 있던 게 너랑 이수잖아.\"<\/p>\n<p>재석의 목소리는 걱정으로 가득했다. 지나치게 가득했다. 하린이 0409조 쪽에서 팔짱을 끼고 이쪽을 구경하고 있었다. 입꼬리가 올라가 있었다.<\/p>\n<p>\"말해라.\"<\/p>\n<p>병철 오빠였다. 낮은 목소리.<\/p>\n<p>\"니 감찰이가.\"<\/p>\n<p>무진이 오빠를 봤다. 그리고 아주 짧게, 나를 봤다.<\/p>\n<p>대답하지 않았다.<\/p>\n<p>오빠의 손이 무진의 멱살을 움켜쥐었다. 무진의 등이 벤치에서 들렸다. 그리고 주먹이 날아갔다. 퍽, 하고 둔한 소리. 무진의 고개가 옆으로 꺾였다.<\/p>\n<p>무진은 막지 않았다. 유도 유단자라는 그가, 손 하나 올리지 않았다.<\/p>\n<p>\"막아라. 막아, 이 자슥아!\"<\/p>\n<p>두 번째 주먹. 무진의 입술이 터졌다.<\/p>\n<p>빨간 것이 그의 턱을 타고 흘렀다.<\/p>\n<p>귀가 먹먹해졌다. 세상이 수조 속으로 가라앉았다. 시야 가장자리가 하얗게 일어났다. 무릎이—.<\/p>\n<p>\"보지 마.\"<\/p>\n<p>무진이 고개를 돌렸다. 손등으로 자기 입을 막았다. 피 묻은 얼굴을 내 쪽에서 완전히 치웠다. 멱살을 잡힌 채로.<\/p>\n<p>\"한이수. 보지 마.\"<\/p>\n<p>하얗던 세상이 천천히 돌아왔다. 오빠의 주먹이 허공에서 멈춰 있었다. 오빠는 무진을 봤다가, 나를 봤다가, 다시 무진을 봤다. 그의 얼굴에 무언가 엉켜 있었다.<\/p>\n<p>오빠가 멱살을 놓았다. 무진은 손등으로 입을 가린 채 걸어갔다. 한 번도 돌아보지 않고.<\/p>\n<p>오빠는 자기 주먹을 내려다봤다. 무진의 피가 손가락 마디에 묻어 있었다. 그는 그걸 바지에 문질러 닦았다. 한 번, 두 번. 지워질 때까지.<\/p>\n<p>재석이 내 어깨를 감쌌다. \"괜찮아, 이수야? 무진이가 진짜… 아, 모르겠다.\" 따뜻한 손이었다. 나는 이상하게, 그 손 아래에서 어깨가 굳었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-9 / 11:00]<\/div>\n<p>시신 관리실은 해부학 실습실 맞은편 끝에 있었다.<\/p>\n<p>문 앞 작은 우유병에 흰 국화 한 송이가 꽂혀 있었다. 포르말린 냄새 속에서 국화 향이 이상하게 또렷했다. 쌉쌀하고 차가운 냄새.<\/p>\n<p>고은채 조교는 시신 대장을 정리하고 있었다. 서른 남짓. 머리를 하나로 질끈 묶고, 니트릴 장갑을 낀 손으로 서류를 한 장씩 넘겼다. 내가 들어가도 고개를 들지 않았다.<\/p>\n<p>\"어젯밤 냉장실 출입 기록, 볼 수 있을까요.\"<\/p>\n<p>\"학생이 왜요.\"<\/p>\n<p>\"제가 갇혔어요. 거기.\"<\/p>\n<p>그녀의 손이 멈췄다. 처음으로 나를 봤다. 피곤한 눈. 그러나 흐리지 않은 눈.<\/p>\n<p>\"냉장실은 제 관할이에요. 거기 누가 계신지 학생은 알아요?\"<\/p>\n<p>\"…기증하신 분들이요.\"<\/p>\n<p>\"그분들 옆에서 누가 장난을 쳤다면, 저도 알고 싶네요.\"<\/p>\n<p>그녀가 볼펜 뚜껑을 닫았다.<\/p>\n<p>\"저녁에 와요. 로그는 보안팀 서버에서 따로 받아야 하니까.\"<\/p>\n<p>나가려는데 그녀가 덧붙였다.<\/p>\n<p>\"0412조죠.\"<\/p>\n<p>\"…네.\"<\/p>\n<p>\"그분, 손 잘 덮어드려요. 실습 끝나면.\"<\/p>\n<p>나는 돌아봤다. 그녀는 이미 서류로 고개를 숙이고 있었다. 장갑 낀 손가락이 대장의 한 줄 위에서, 아주 잠깐 멈춰 있었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-9 / 17:40]<\/div>\n<p>혜화역 4번 출구 편의점 앞, 플라스틱 의자.<\/p>\n<p>오빠는 컵라면 두 개에 물을 붓고 나무젓가락으로 뚜껑을 눌러두었다. 김이 새어 나와 그의 턱수염에 맺혔다. 까진 손가락 마디에 반창고가 감겨 있었다.<\/p>\n<p>\"오빠, 손.\"<\/p>\n<p>\"경첩 핀이 녹이 슬어가. 별거 아이다.\"<\/p>\n<p>삼 분이 지나는 동안 그는 말이 없었다. 오빠가 말이 없는 건 드문 일이었다. 대학로를 지나는 버스 소리, 편의점 문이 열릴 때마다 울리는 차임벨, 라면 국물 냄새.<\/p>\n<p>\"이수야.\"<\/p>\n<p>\"네.\"<\/p>\n<p>\"니 저놈 좋아하제.\"<\/p>\n<p>젓가락이 손에서 미끄러질 뻔했다.<\/p>\n<p>\"아니에요.\"<\/p>\n<p>왼쪽 귀가 뜨거워졌다. 머리카락으로 덮기엔 늦었다. 오빠는 내 귀를 보지 않았다. 보지 않아도 아는 사람이었다.<\/p>\n<p>\"구급대 7년 하면서 냉동창고에서 꺼낸 사람이 둘이다.\"<\/p>\n<p>그가 컵라면 뚜껑을 뜯었다. 김이 확 피어올랐다.<\/p>\n<p>\"둘 다 못 살렸다. 어젯밤 문 뜯는데, 손이 안 떨리더라. 떨려야 정상인데. 내가 그게 더 무서웠다.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"저놈은 사람 혈관만 본다. 니 혈관도 볼 끼다. 어디를 찌르면 니가 죽는지.\"<\/p>\n<p>\"오빠.\"<\/p>\n<p>\"알았다. 무전 끊는다.\"<\/p>\n<p>그는 라면을 한 젓가락 크게 떠서 입에 넣었다. 너무 뜨거웠는지 눈가가 벌게졌다. 라면 때문이라고, 나는 믿기로 했다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-9 / 20:05]<\/div>\n<p>고은채 조교가 출력물 한 장을 반으로 접어 내밀었다.<\/p>\n<p>\"보안팀은 이게 오류라고 하더군요.\"<\/p>\n<p>\"오류요?\"<\/p>\n<p>\"직접 봐요.\"<\/p>\n<p>그녀는 접힌 종이를 내 손바닥에 올려놓고, 문 앞 국화를 한 번 바로 세웠다. 시든 꽃잎 하나를 떼어 주머니에 넣었다.<\/p>\n<p>\"시신은 거짓말 안 해요.\"<\/p>\n<p>그녀가 장갑을 벗었다. 맨손이 하얬다.<\/p>\n<p>\"산 사람이 하지.\"<\/p>\n<p>나는 복도로 나와 형광등 아래에서 종이를 펼쳤다. 손이 떨려 종이 끝이 바스락거렸다. 줄 맞춰 인쇄된 시각과 카드 번호들.<\/p>\n<div class=\"doc\">23:38:52 개방 — 수동(외부)<\/div>\n<div class=\"doc\">23:58:07 개방 — 해부학교실 교직원 공용 마스터<\/div>\n<div class=\"doc\">23:58:31 잠금 — 수동(외부)<\/div>\n<p>그리고 그 사이, 한 줄.<\/p>\n<p>나를 그 안에 가둔 줄.<\/p>\n<div class=\"doc\">23:41:16 잠금 — 학생증 2021-1047<\/div>\n<p>학번 옆 이름 칸을 읽는 데, 세 번이 걸렸다.<\/p>\n<p>23:41, 냉장실 문을 잠근 출입카드 — 학생증 2021-1047, 한도윤.<\/p>","chars":4816},{"title":"구급차의 기억","html":"<div class=\"timer\">[D-9 / 20:09]<\/div>\n<p>나는 출력물을 든 채 시신 관리실로 되돌아갔다.<\/p>\n<p>문을 밀었다. 국화 꽂힌 우유병이 흔들렸다. 고은채 조교는 아직 그 자리에 있었다. 니트릴 장갑을 다시 끼고 있었다.<\/p>\n<p>\"이거, 오류 아니에요.\"<\/p>\n<p>종이를 책상 위에 내려놓았다. 손바닥이 땀으로 젖어 종이 모서리가 쭈글쭈글해져 있었다.<\/p>\n<p>\"오빠 학생증은 장례 때 태웠어요. 제가 직접. 여수 화장장에서, 엄마가 관 위에 올려놨는데….\"<\/p>\n<p>목이 막혔다. 플라스틱이 녹으며 내던 매캐한 냄새가 아직 코 안쪽 어딘가에 붙어 있었다.<\/p>\n<p>고은채는 종이를 내려다봤다. 그 한 줄을 손가락으로 짚지도 않았다. 이미 외운 것처럼.<\/p>\n<p>\"그럼 누가 복제했겠죠.\"<\/p>\n<p>\"누가요.\"<\/p>\n<p>\"카드는 태워도, 데이터는 서버에 남아요. 사망 처리되면 권한은 지워지게 돼 있고요.\"<\/p>\n<p>그녀가 볼펜을 딸깍 눌렀다.<\/p>\n<p>\"원래는.\"<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-9 / 20:31]<\/div>\n<p>관리실을 나오자 복도 끝에서 재석이 손을 흔들었다.<\/p>\n<p>\"이수야! 찾았잖아.\"<\/p>\n<p>그는 편의점 봉투를 들고 있었다. 따뜻한 두유 두 개, 핫팩 한 묶음. 냉장실 얘기를 들었다며 내 손에 핫팩부터 쥐여주었다. 비닐 너머로 열이 번졌다.<\/p>\n<p>\"무진이 일은… 나도 아직 정리가 안 돼. 너는 괜찮아?\"<\/p>\n<p>\"괜찮아요.\"<\/p>\n<p>\"조교님한테는 왜? 출입 기록?\"<\/p>\n<p>그의 시선이 내 손에 쥔 출력물로 내려갔다. 나는 종이를 접어 가운 주머니에 넣었다. 재석은 웃었다. 아무렇지 않게.<\/p>\n<p>\"필요하면 말해. 나 교학과에 아는 선생님 있거든. 학생증 시스템 같은 거, 조장이라 가끔 봐.\"<\/p>\n<p>\"…고마워요.\"<\/p>\n<p>그가 내 머리를 가볍게 쓰다듬고 돌아섰다. 섬유유연제 냄새가 남았다. 손에 쥔 핫팩이 너무 뜨거워서, 나는 그걸 주머니 속 출력물 위에 올려두었다가 다시 뺐다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-8 / 00:00]<\/div>\n<p>자정, 해부학 실습실 앞 사물함 복도.<\/p>\n<p>병철 오빠와 나는 내 사물함 앞에 쪼그려 앉아 있었다. 하린이 아틀라스를 노린다는 걸 안 뒤로, 나는 아틀라스를 기숙사에 두지 않았다. 자물쇠 두 개, 비밀번호는 0412가 아닌 다른 숫자.<\/p>\n<p>카르테가 동시에 두 번 울렸다. 내 것과 오빠 것.<\/p>\n<div class=\"doc\">증례 3<\/div>\n<div class=\"doc\">열쇠를 쥔 손을 찾아라.<\/div>\n<div class=\"doc\">— 메스를 쥔 자.<\/div>\n<p>\"손이라. 내 손 아이가. 내 손에 쥔 건 국밥 숟가락뿐인데.\"<\/p>\n<p>오빠가 중얼거렸다. 웃기려는 말이었는데 웃음이 나오지 않았다. 냉장실 이후로 우리 둘 다 농담의 박자를 잃어버렸다.<\/p>\n<p>나는 아틀라스를 꺼내 맨 뒷장을 펼쳤다. 상지 단원의 마지막, 손바닥 근육 해부도. 그 페이지에도 핀 구멍이 있었다. 지난번 일곱 장과 달리 딱 하나.<\/p>\n<p>휴대폰 손전등을 종이 뒤에 댔다.<\/p>\n<p>빛이 한 점으로 새어 나왔다. 엄지 아래 불룩한 근육 덩어리. 짧은엄지벌림근, 엄지맞섬근, 짧은엄지굽힘근.<\/p>\n<p>\"엄지두덩.\"<\/p>\n<p>\"그게 뭐꼬.\"<\/p>\n<p>\"메스 쥘 때 손잡이가 닿는 자리요.\"<\/p>\n<p>나는 내 오른손을 쥐어 보였다. 펜을 쥐듯 메스를 쥐면, 손잡이 끝이 정확히 엄지두덩에 눌린다. 매일 칼을 쥐는 사람은 거기가 단단해진다.<\/p>\n<p>열쇠는 메스를 쥔 자의 손에 있다.<\/p>\n<p>집도의. 아니면 집도의 대신 칼을 쥐는 누군가.<\/p>\n<p>머릿속에 장면 두 개가 겹쳐졌다. 첫날 세척실, 손가락 사이와 엄지두덩과 손톱 끝을 순서대로 문지르던 손. 그리고 냉장실 문을 열던 손에 쥐어져 있던 은색 마스터키.<\/p>\n<p>\"이수.\"<\/p>\n<p>오빠의 목소리가 이상했다.<\/p>\n<p>고개를 들었다. 오빠는 내 사물함 맨 아래 칸에 손을 넣은 채 굳어 있었다. 아틀라스를 꺼내며 같이 딸려 나온 것들 — 구겨진 영수증, 머리끈, 볼펜. 그 사이에서 오빠가 무언가를 집어 들고 있었다.<\/p>\n<p>검은 끈.<\/p>\n<p>꼬리표를 목에 걸 때 쓰는 가는 나일론 끈이었다. 한쪽이 억지로 끊겨 올이 풀려 있었다. 그리고 매듭 근처에, 반쯤 떨어진 반창고 하나가 들러붙어 있었다.<\/p>\n<p>노란 곰이 그려진 어린이용 반창고.<\/p>\n<p>\"이거.\"<\/p>\n<p>오빠가 끈을 들어 올렸다. 형광등 아래에서 곰 얼굴이 빙글 돌았다.<\/p>\n<p>\"내가 붙여준 기다. 실습 첫날. 지아 손가락에.\"<\/p>\n<p>복도 끝 환풍기가 덜컥, 하고 멈췄다. 세상이 너무 조용해졌다.<\/p>\n<hr class=\"scene\">\n<p>\"니가 지아를?\"<\/p>\n<p>오빠는 소리를 지르지 않았다. 그게 더 무서웠다.<\/p>\n<p>나는 변명할 문장을 찾았다. 꼬리표를 잃어버렸다고. 2단위가 되면 끝이라고. 집도의가 처음부터 내 꼬리표를 쥐고 있었다고. 나는 몰랐다고.<\/p>\n<p>전부 사실이었다. 그리고 전부, 지아가 짐 상자를 안고 유리문 밖으로 사라진 것과는 아무 상관이 없었다.<\/p>\n<p>\"내가 뜯었어요.\"<\/p>\n<p>목소리가 생각보다 담담하게 나왔다.<\/p>\n<p>\"지아 자는데. 목에서. 내가 뜯어서 투입구에 넣었어요.\"<\/p>\n<p>오빠가 끈을 쥔 주먹을 천천히 내렸다. 그리고 일어섰다. 무릎에서 뚝 소리가 났다. 그는 나를 보지 않고 복도 끝 비상계단 쪽으로 걸어갔다.<\/p>\n<p>철문이 열렸다 닫혔다.<\/p>\n<p>나는 사물함 앞에 그대로 앉아 있었다. 바닥 타일의 냉기가 엉덩이로 스며들었다. 냉장실 바닥이 떠올랐다. 그때는 은박 백이라도 있었다.<\/p>\n<p>오 분이 지났다. 십 분.<\/p>\n<p>비상계단 철문을 밀었다. 오빠는 계단 세 번째 칸에 앉아 있었다. 등이 넓었다. 그 등이 작아 보이는 건 처음이었다. 계단실에서 시멘트 먼지와 오래된 담배 냄새가 났다.<\/p>\n<p>나는 그 뒤, 다섯 번째 칸에 앉았다. 손을 뻗으면 닿는 거리. 뻗지 않았다.<\/p>\n<p>\"3년 전 3월이었다.\"<\/p>\n<p>오빠가 먼저 입을 열었다. 나를 돌아보지 않은 채.<\/p>\n<p>\"종로 구급대 있을 때. 새벽 신고. 연건캠퍼스, 시계탑 밑에 사람 떨어졌다고.\"<\/p>\n<p>나는 숨을 죽였다.<\/p>\n<p>\"의대생이더라. 스물셋인가. 두개골 함몰, 동공 반응 없음. 나는 그 아 가슴 누르고 있었고, 구급차 뒤에 보호자라고 한 명이 같이 탔다.\"<\/p>\n<p>그의 손가락이 끈에 붙은 곰 반창고를 문질렀다.<\/p>\n<p>\"흰 가운 입은 학생이었다. 지금 따지면 내 선배지. 피 범벅인 후배 손을 잡고 있는데, 얼굴이 하얗더라. 피 보면 안 되는 사람처럼.\"<\/p>\n<p>혀끝이 쇠 맛으로 저렸다. 내가 입술을 깨물고 있었다.<\/p>\n<p>\"혜화역 사거리 지날 때쯤, 그 선배가 내 귀에 대고 속삭였다.\"<\/p>\n<p>오빠가 처음으로 고개를 돌렸다. 계단실 비상등이 그의 눈을 초록으로 적셨다.<\/p>\n<p>\"'사고 아니에요.'\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"명찰 봤다. 한도윤.\"<\/p>\n<p>계단실이 기울었다. 나는 난간을 쥐었다. 차가운 쇠가 손바닥을 파고들었다.<\/p>\n<p>\"그 아는 병원 도착 전에 심정지 왔다. 다음 날 뉴스에 '실족사' 한 줄 나왔고. 나는 그 선배 말을 아무한테도 안 했다. 못 했다. 뭘 알아야 말을 하지.\"<\/p>\n<p>그는 끈을 무릎 위에 내려놓았다.<\/p>\n<p>\"그리고 2년 전에, 그 선배도 죽었다 카더라. 실습실에서.\"<\/p>\n<p>\"오빠는….\"<\/p>\n<p>\"내가 의대 온 이유가 그것만은 아이다. 근데 그것도 있다.\"<\/p>\n<p>그가 몸을 반쯤 돌려 나를 봤다. 화난 얼굴이 아니었다. 다친 얼굴이었다.<\/p>\n<p>\"니 처음 봤을 때, 응급실에서 피 보고 쓰러졌을 때. 내가 니 업고 나오면서 니 얼굴 봤거든.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"그 선배 눈이 니 눈이랑 똑같았다.\"<\/p>\n<p>오빠가 끈을 들어 자기 점퍼 안주머니에 넣었다. 지퍼를 올렸다.<\/p>\n<p>\"그래서 니 못 버린다. 이건 내가 들고 있으께. 니가 지아한테 갚을 때까지.\"<\/p>\n<p>나는 고개를 끄덕였다. 끄덕이다가, 무릎에 이마를 박았다. 소리 없이 어깨가 들썩였다. 오빠의 손이 내 뒤통수 위에 얹혔다. 투박하고 따뜻하고, 경첩 핀에 까진 상처의 반창고가 머리카락에 걸렸다.<\/p>\n<p>\"그라고.\"<\/p>\n<p>\"…네.\"<\/p>\n<p>\"다음엔 내한테 먼저 말해라. 같이 훔치든 같이 망하든.\"<\/p>\n<p>\"그게 위로예요?\"<\/p>\n<p>\"구급대식 위로다. 현장 판단이 빠르다.\"<\/p>\n<p>나는 젖은 얼굴로 웃었다. 계단실에 우리 둘의 콧물 훌쩍이는 소리가 울렸다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-8 / 02:40]<\/div>\n<p>무진은 기숙사 동관 출입문으로 나왔다.<\/p>\n<p>나는 맞은편 자판기 그늘에서 그걸 봤다. 오빠에게는 말하지 않았다. 말하면 따라올 사람이었고, 따라오면 이번엔 문이 아니라 무진을 뜯을 사람이었다.<\/p>\n<p>다음엔 먼저 말하라고 했는데. 귀가 뜨거웠다. 거짓말은 남한테만 하는 게 아니었다.<\/p>\n<p>검은 후드. 손은 주머니 속. 그는 함춘원 담장을 따라 시계탑 쪽으로 걸었다. 새벽 공기가 맵게 코를 찔렀다. 담장 너머 동백 잎이 바람에 쇳소리를 냈다.<\/p>\n<p>시계탑이 어둠 속에 서 있었다. 시계판의 하얀 빛만 공중에 떠 있었다. 바늘이 세 시를 향해 기어가고 있었다.<\/p>\n<p>무진은 탑 옆면, 반지하로 내려가는 좁은 계단 앞에서 멈췄다. 쇠사슬이 가로질러 걸려 있었다. <span class=\"sys\">출입금지 — 시설관리팀<\/span>. 그는 사슬을 넘었다. 망설임 없이.<\/p>\n<p>휴대폰을 꺼내 오빠에게 메시지를 쳤다. <span class=\"sys\">시계탑. 무진.<\/span> 전송 버튼 위에서 엄지가 멈췄다. 계단 아래로 사라지는 검은 후드를 보다가, 나는 그 두 단어를 지웠다. 한 글자씩. 백스페이스 소리가 새벽 공기 속에서 이상하게 컸다.<\/p>\n<p>나는 열을 셌다. 그리고 따라 넘었다. 사슬이 종아리에 닿아 차갑게 짤랑였다.<\/p>\n<p>계단은 생각보다 깊었다. 한 층. 또 한 층. 공기가 축축해졌다. 곰팡이와 젖은 벽돌 냄새. 아래쪽에서 희미한 빛이 새어 나왔다. 휴대폰 손전등 빛.<\/p>\n<p>난간 틈으로 내려다봤다.<\/p>\n<p>계단 맨 아래, 녹슨 철문 앞에 무진이 서 있었다. 그가 주머니에서 손을 꺼냈다. 손가락 사이에서 무언가 은빛으로 번쩍였다.<\/p>\n<p>열쇠였다. 엄지와 검지로 쥔 손잡이가 정확히 엄지두덩에 눌려 있었다. 메스를 쥐듯이.<\/p>\n<p>열쇠가 구멍에 들어갔다. 돌아갔다. 끼이이익.<\/p>\n<p>철문이 안쪽으로 열렸다. 그 너머는 빛이 들지 않는 검정이었다. 손전등 불빛이 그 검정 속으로 빨려 들어가듯 꺼졌다.<\/p>\n<div class=\"timer\">[D-8 / 03:00]<\/div>\n<p>나는 숨을 참고 남은 계단을 더듬어 내려갔다. 한 칸, 한 칸. 마지막 계단참을 돌 때, 벽 쪽 어둠이 한 번 숨을 쉰 것 같았다. 기분 탓이라 여겼다. 운동화 밑창이 물기 어린 계단에서 미끄러질 뻔했다. 주머니 속에서 카르테가 짧게 진동했다. 나는 손으로 휴대폰을 꽉 눌러 막았다. 손가락 틈으로 붉은 빛이 샜다.<\/p>\n<div class=\"doc\">경고: 금지구역 접근 중.<\/div>\n<div class=\"doc\">④ 시계탑 지하 3층 무단 진입 — 즉시 DNR.<\/div>\n<p>여기가 지하 몇 층인지 알 수 없었다. 계단참마다 층수 표시가 뜯겨 있었다. 지금 내 발이 디딘 곳이 경계선의 이쪽인지 저쪽인지, 아무도 말해주지 않았다. 심장이 귓속에서 쿵쿵 울렸다. 그래도 발이 멈추지 않았다. 오빠가 그려둔 화살표가 이 아래를 가리키고 있었으니까.<\/p>\n<p>철문 앞에 섰다. 문은 한 뼘쯤 열린 채였다. 손바닥을 댔다. 얼음장이었다. 밀었다. 녹슨 경첩이 낮게 신음하며 안쪽으로 물러났다. 빛 한 점 없는 공간. 발소리도, 숨소리도 없었다.<\/p>\n<p>아무도 없었다.<\/p>\n<p>문틈에서 희미한 비누 냄새가 났다. 그리고 그 아래, 더 오래되고 더 차가운 냄새. 포르말린도 곰팡이도 아닌, 유리병 속에 오래 갇힌 공기 같은 냄새였다.<\/p>\n<p>손전등 빛이 사라진 계단은 칠흑이었다. 내 숨소리만 벽돌에 부딪혀 돌아왔다.<\/p>\n<p>그때, 내 등 뒤 — 방금 내려온 계단 위에서.<\/p>\n<p>\"따라오는 거 알았어.\"<\/p>\n<p>무진의 목소리였다.<\/p>\n<p>\"처음부터.\"<\/p>","chars":5017},{"title":"내가 형을 내렸어","html":"<div class=\"timer\">[D-8 / 03:12]<\/div>\n<p>열린 철문 안쪽은 비어 있었다.<\/p>\n<p>목소리는 위에서 왔다. 나는 천천히 고개를 들었다. 내가 방금 밟고 내려온 계단, 그 꺾인 층계참에 서무진이 서 있었다. 손전등은 꺼져 있었다. 비상구 표시등의 초록빛이 그의 얼굴 절반만 물들였다.<\/p>\n<p>그의 손가락 사이에서 은빛 열쇠가 흔들렸다. 짤랑. 지하의 정적 속에서 그 소리가 칼날처럼 컸다.<\/p>\n<p>\"그거 줘.\"<\/p>\n<p>\"안 돼.\"<\/p>\n<hr class=\"scene\">\n<p>그는 계단을 한 칸씩 내려왔다. 구두 굽이 시멘트에 닿을 때마다 먼지 냄새가 피어올랐다. 습기 먹은 벽에서 녹물이 배어 나와 손바닥이 끈적였다. 나는 물러서지 않았다. 물러설 계단이 없었다.<\/p>\n<p>\"열쇠는 안 돼. 대신 하나 보여줄게.\"<\/p>\n<p>\"니가 뭘 보여줘. 또 뭘 숨길라고.\"<\/p>\n<p>\"보면 알아.\"<\/p>\n<p>나는 대답 대신 그의 손목을 낚아챘다. 열쇠를 쥔 손이었다. 손톱을 세워 손등을 긁었다. 그는 아프다는 소리 하나 내지 않고 손목을 반 바퀴 비틀었다. 그것만으로 내 손가락이 풀렸다. 유도라고 했던가. 힘이 아니라 각도였다.<\/p>\n<p>그가 내 손목을 잡은 채 잠깐 서 있었다. 엄지가 맥 위에 얹혀 있었다. 첫날처럼, 혈관이 거기 있다는 걸 확인하듯이.<\/p>\n<p>\"빨라.\"<\/p>\n<p>\"놔.\"<\/p>\n<p>그가 놨다. 손목에 그의 체온이 손자국처럼 남았다. 차가운 사람인데, 체온은 이상하게 늘 남았다.<\/p>\n<p>그가 내 옆을 지나쳐 철문 안으로 들어갔다. 어깨가 스칠 만큼 좁은 통로였다. 그에게서 비누 냄새와, 그 밑에 깔린 포르말린 냄새가 났다. 우리 모두에게 배어 있는 냄새였다. 사흘은 간다는 냄새.<\/p>\n<p>나는 따라갔다. 따라가지 않을 수가 없었다.<\/p>\n<p>통로는 지하 2층의 끝까지 이어졌다. 천장의 배관이 웅웅 울었다. 어딘가에서 물방울이 떨어지는 소리가 일정한 간격으로 들렸다. 똑. 똑. 맥박처럼.<\/p>\n<p>막다른 벽에 유리창이 하나 박혀 있었다.<\/p>\n<p>무진이 그 앞에서 멈췄다. 나는 그의 어깨 너머로 안을 들여다봤다.<\/p>\n<p>벨벳 소파가 반원으로 놓여 있었다. 낮은 탁자 위에 와인잔 여섯 개. 바닥에 붉은 앙금이 말라붙어 있었고, 잔 하나의 테두리엔 옅은 립스틱 자국이 남아 있었다. 환풍구 틈으로 식은 시가 냄새가 새어 나왔다.<\/p>\n<p>그리고 벽 한 면 전체가 모니터였다.<\/p>\n<p>수십 개의 화면이 바둑판처럼 붙어 푸르게 숨 쉬고 있었다. 해부학 실습실. 의학도서관 24시간 열람실. 혜화역 4번 출구 편의점 앞. 기숙사 복도.<\/p>\n<p>화면 하나하나 아래 작은 글씨가 붙어 있었다. <span class=\"sys\">0409조 실습대<\/span>. <span class=\"sys\">열람실 3층 C구역<\/span>. <span class=\"sys\">0412조 실습대<\/span>.<\/p>\n<p>시트에 덮인 우리 카데바가, 어둠 속에서 회색으로 누워 있었다.<\/p>\n<p>\"…관람실.\"<\/p>\n<p>\"원로들 자리야. 낮에는 비어. 밤에 와.\"<\/p>\n<p>\"와서 뭐 하는데.\"<\/p>\n<p>\"구경하지.\"<\/p>\n<p>무진의 목소리엔 아무 온도도 없었다. 그는 유리에 손바닥을 댔다. 그의 손이 닿은 자리에 하얀 김이 서렸다가 사라졌다.<\/p>\n<p>모니터 벽 한가운데, 검은 바탕의 화면에서 흰 글자들이 위아래로 자리를 바꿨다. 카르테 랭킹이었다. 이름 옆에 혈액백 아이콘이 줄지어 있었고, 몇몇 이름 옆엔 작은 금색 글씨가 붙어 있었다.<\/p>\n<div class=\"doc\">한이수 — 6 Unit. 후원 +2 (사유: 냉장실, 앙코르 요망)<\/div>\n<p>앙코르. 나는 그 단어를 두 번 읽었다. 4℃의 어둠 속에서 이빨을 딱딱 부딪치던 나와, 그 등에 붙어 있던 무진. 그게 누군가에겐 무대였다. 와인을 마시며 다음 막을 기다리는.<\/p>\n<p>\"후원은 공짜가 아니야.\"<\/p>\n<p>무진이 화면을 보지도 않고 말했다.<\/p>\n<p>\"저 사람들이 너한테 2단위를 걸었으면, 언젠가 2단위어치를 받아 가.\"<\/p>\n<p>\"그것도 보고서에 쓰여 있나?\"<\/p>\n<p>그는 대답하지 않았다.<\/p>\n<p>모니터 벽 오른쪽 아래, 다른 화면보다 한 뼘 큰 것이 있었다. 나는 거기서 눈을 뗄 수 없었다.<\/p>\n<p>좁은 2인실. 개지 않은 이불. 베개 위에 펼쳐진 채 엎어진 족보. 책상 위에 반쯤 남은 컵라면 용기. 젓가락 한 짝이 바닥에 떨어져 있었다.<\/p>\n<p>어젯밤 내가 떨어뜨린 젓가락이었다.<\/p>\n<p>화면 구석에서 시계 숫자가 흘러갔다. <span class=\"sys\">03:21:07<\/span>, <span class=\"sys\">03:21:08<\/span>. 녹화가 아니었다. 지금이었다.<\/p>\n<p>목구멍 안쪽이 바짝 말랐다. 침을 삼키려 했는데 혀가 입천장에 들러붙었다. 내가 그 방에서 울던 밤. 오빠 족보를 안고 웅크렸던 밤. 병철 오빠에게 전화를 걸어 목소리가 무너졌던 밤.<\/p>\n<p>와인잔을 든 누군가가, 이 소파에 앉아서.<\/p>\n<p>\"니가.\"<\/p>\n<p>내 목소리가 내 것 같지 않았다.<\/p>\n<p>\"니가 감찰이제.\"<\/p>\n<p>무진은 유리에서 손을 뗐다. 그리고 나를 봤다. 처음 세척실에서 내 이름을 불렀을 때처럼, 똑바로.<\/p>\n<p>\"응.\"<\/p>\n<p>\"…언제부터.\"<\/p>\n<p>\"네 담당이야. 처음부터.\"<\/p>\n<p>처음부터. 시트를 걷던 첫날부터. 내 눈을 가리던 그 손부터. 냉장실에서 등을 맞대던 체온부터. 다 보고서에 적힐 문장이었다.<\/p>\n<hr class=\"scene\">\n<p>손바닥이 먼저 움직였다.<\/p>\n<p>짝, 하는 소리가 통로 끝까지 울렸다. 손바닥이 불에 덴 것처럼 화끈거렸다. 그의 고개가 옆으로 돌아갔다가 천천히 제자리로 돌아왔다. 피하지 않았다. 피할 수 있었는데, 피하지 않았다.<\/p>\n<p>그의 왼쪽 뺨에 내 손자국이 붉게 떠올랐다.<\/p>\n<p>\"니가 뭔디.\"<\/p>\n<p>입술이 떨렸다. 말이 이빨 사이로 부서져 나왔다.<\/p>\n<p>\"니가 뭔디 내 방을 보고, 내가 우는 걸 보고, 그걸 적어서 갖다 바쳐? 어? 그 손으로 내 눈 가렸잖아. 그 손으로.\"<\/p>\n<p>\"그래.\"<\/p>\n<p>\"그래가 다여?\"<\/p>\n<p>\"다른 말은 변명이니까.\"<\/p>\n<p>나는 한 번 더 손을 들었다. 그는 여전히 눈을 감지 않았다. 내 손이 허공에서 멈췄다. 손목이 바들바들 떨렸다. 때리고 싶은 게 아니었다. 무언가를 붙잡고 싶은데 붙잡을 게 이것밖에 없었다.<\/p>\n<p>손이 툭 떨어졌다.<\/p>\n<p>\"왜 이제 말해.\"<\/p>\n<p>\"네가 저 문을 열고 들어가려 했으니까.\"<\/p>\n<p>그가 고개로 철문 쪽을 가리켰다. 그 아래로 계단이 하나 더 있었다. 지하 3층으로 내려가는 계단.<\/p>\n<p>\"거기 들어가면 넌 처치야. 보류 요청도 소용없어.\"<\/p>\n<p>\"보류 요청. 그것도 니가 했제. 나 불쌍해서?\"<\/p>\n<p>\"아니.\"<\/p>\n<p>\"그라믄 뭔디. 와 하필 니가 내 담당인데.\"<\/p>\n<p>\"내가 달라고 했어.\"<\/p>\n<p>나는 숨을 들이켰다. 시가 냄새가 폐 깊숙이 들어와 기침이 났다.<\/p>\n<p>\"다른 사람이 붙으면, 넌 첫 주에 죽었어.\"<\/p>\n<p>그 말을 하는 동안 그는 내 눈을 피하지 않았다. 거짓말하는 사람의 눈이 아니었다. 그래서 더 소름이 돋았다. 이 사람은 진실만으로도 사람을 벨 줄 알았다.<\/p>\n<p>그의 목울대가 한 번 오르내렸다. 비상등 초록빛 아래서 그 얼굴이 이상하게 어려 보였다. 스물셋이 아니라, 훨씬 어린 누군가처럼.<\/p>\n<p>\"한이수. 하나만 더 들어.\"<\/p>\n<p>\"듣기 싫어.\"<\/p>\n<p>\"2년 전 3월이었어.\"<\/p>\n<p>숨이 멎었다. 등 뒤의 모니터 벽이 웅웅 울렸다.<\/p>\n<p>\"나 예과 1학년이었어. 너랑 같은 학년. 새벽 네 시쯤에 전화가 왔어. 그 사람한테서.\"<\/p>\n<p>\"그 사람이 누군디.\"<\/p>\n<p>그는 대답하지 않았다. 대신 손을 내려다봤다. 오른손을 펼쳤다가 쥐었다. 메스를 쥘 때 한 번도 떨리지 않던 손가락이, 지금은 제 맘대로 굽어 있었다.<\/p>\n<p>\"실습실로 오라고 했어. 불은 꺼져 있었고, 포르말린 냄새가 났고. 천장 배관에서 뭔가… 흔들리고 있었어.\"<\/p>\n<p>나는 고개를 저었다. 듣지 않으려고. 그런데 귀는 닫히지 않았다.<\/p>\n<p>\"내가 형을 내렸어.\"<\/p>\n<p>세상의 소리가 멀어졌다. 피를 볼 때처럼. 귓속에 물이 차오르는 것처럼.<\/p>\n<p>\"아직 따뜻했어.\"<\/p>\n<p>무릎이 접혔다.<\/p>\n<p>시멘트 바닥이 무릎뼈를 때렸다. 아픈 줄도 몰랐다. 손바닥으로 바닥을 짚었는데 바닥이 출렁였다. 장례식장에서 받은 유골함, 이상할 만큼 가볍던 그 무게가 손바닥 위에 다시 얹혔다.<\/p>\n<p>오빠는 그때 따뜻했다. 누군가 그 몸을 안아 내렸다. 그게, 이 사람이었다.<\/p>\n<p>나는 그때 술을 마시고 있었다. 오빠 문자를 열지도 않고.<\/p>\n<p>따뜻했다는 말이 귓속에서 계속 굴렀다. 오동도 방파제에서 내 머리 위에 얹히던 오빠 손바닥. 여름 햇볕에 데워져 늘 뜨끈하던 손. 그 온기가 식어가는 동안, 나는 노래방에서 탬버린을 흔들고 있었다.<\/p>\n<p>토할 것 같았다. 입 안에 쓴 침이 고였다. 나는 시멘트 바닥에 이마를 박을 듯이 숙였다.<\/p>\n<p>무진의 손이 내 쪽으로 뻗어 왔다. 어깨에 닿기 직전에 멈췄다. 그 손은 끝내 내려오지도, 거둬지지도 않았다. 허공에 걸린 채로 떨렸다.<\/p>\n<p>\"왜.\"<\/p>\n<p>목에서 쇳소리가 났다.<\/p>\n<p>\"왜 아무한테도 말 안 했어. 경찰한테도, 우리 엄마한테도. 우리 엄마는 오빠가 공부하다 미쳐서 죽은 줄 알아. 니 때문에 2년 동안 그렇게 알고 살았당께.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"알면서.\"<\/p>\n<p>\"알면서, 말 안 했어.\"<\/p>\n<p>\"니 지금 나한테 왜 이래. 내가 불쌍해서 털어놓는 거면, 그만해. 그거 동정 아니고 고문이여.\"<\/p>\n<p>\"동정 아니야.\"<\/p>\n<p>\"그라믄.\"<\/p>\n<p>\"네가 알아야 할 걸, 내가 2년 동안 쥐고 있었어. 더는 못 쥐겠어.\"<\/p>\n<p>그는 변명하지 않았다. 그게 더 아팠다. 차라리 무서웠다고, 시켰다고, 몰랐다고 해주기를 바랐다. 그래야 미워할 자리가 생길 테니까.<\/p>\n<hr class=\"scene\">\n<p>그가 내 앞에 무릎을 꿇었다. 손 하나 닿지 않을 거리에서.<\/p>\n<p>\"이것만 알아둬.\"<\/p>\n<p>나는 대답하지 않았다. 바닥의 먼지가 눈물에 젖어 진흙처럼 손바닥에 들러붙었다.<\/p>\n<p>\"형 발등에 자국이 있었어. 양쪽 다.\"<\/p>\n<p>\"…자국?\"<\/p>\n<p>\"묶인 자국. 끈이 아니라 넓은 띠 같은 걸로. 피부가 눌려서 하얗게 꺼진 줄이 발목 앞쪽에 났었어.\"<\/p>\n<p>해부학 아틀라스의 한 페이지가 머릿속에서 저절로 펼쳐졌다. 족배부. 피부 바로 아래 신전근 힘줄들. 사후에 생긴 눌림은 그대로 남는다.<\/p>\n<p>\"스스로 목맨 사람한텐 안 생기는 자국이야.\"<\/p>\n<p>발을 묶은 채로는 의자에 올라갈 수 없다. 발버둥 칠 수도 없다.<\/p>\n<p>누군가 오빠가 발버둥 치지 못하게 했다.<\/p>\n<p>나는 고개를 들었다. 눈물에 뿌옇게 번진 시야 너머, 그의 얼굴이 아주 가까웠다. 뺨의 손자국은 아직 붉었다.<\/p>\n<p>\"그걸 알면서도, 니는.\"<\/p>\n<p>\"그래서 말하는 거야. 지금.\"<\/p>\n<p>통로 끝, 유리창 너머에서 모니터 하나가 깜빡였다. 내 방 화면이었다. 빈 침대 위 족보가 푸른빛에 젖어 있었다. 누군가 지금 이 순간에도 그 화면을, 그리고 이 통로를 보고 있을지 몰랐다.<\/p>\n<p>\"여기도 찍혀?\"<\/p>\n<p>\"여긴 사각이야. 원로들이 자기 얼굴 찍히는 건 싫어하거든.\"<\/p>\n<p>그가 짧게 웃었다. 웃음이라기보다 숨이 새는 소리였다. 처음 듣는 소리였다.<\/p>\n<p>\"그래서 2년 동안, 말할 수 있는 데가 여기밖에 없었어.\"<\/p>\n<p>똑. 똑. 물방울 소리가 다시 들렸다. 나는 그 소리에 맞춰 숨을 쉬었다. 하나, 둘. 그가 첫날 가르쳐준 대로. 그게 미칠 듯이 억울했다.<\/p>\n<p>그의 숨이 하얗게 흩어졌다. 그가 은빛 열쇠를 손바닥 안에 꽉 쥐었다. 열쇠의 톱니가 살을 파고드는 게 보였다.<\/p>\n<p>\"형은 자살하지 않았어.\"<\/p>\n<p>그가 한 번, 숨을 골랐다.<\/p>\n<p>\"그리고 그날 실습실 열쇠를 가진 사람은 — 둘뿐이었어. 나랑, 그 사람.\"<\/p>","chars":4930},{"title":"개복된 시간표","html":"<div class=\"timer\">[D-7 / 08:00]<\/div>\n<p>강의실의 휴대폰 백오십 개가 동시에 울었다.<\/p>\n<p>진동이 책상을 타고 팔꿈치까지 올라왔다. 의과대학 1동 대강의실, 아침 조직학 강의 직전이었다. 나는 한숨도 못 잔 눈으로 화면을 내려다봤다. 학사 시스템의 파란 공지 배너.<\/p>\n<div class=\"doc\">[학사공지] 본과 1학년 블록 1 해부학 실습시험 일정 변경: 3월 17일(화) → 3월 13일(금)<\/div>\n<p>\"뭐야, 이거 실화야?\"<\/p>\n<p>\"나흘을 당긴다고? 근육 기시 정지도 아직 못 외웠는데.\"<\/p>\n<p>\"교학과 전화 안 받아. 아, 미친.\"<\/p>\n<p>강의실이 벌집처럼 웅웅거렸다. 누군가 커피를 엎었다. 쓴 냄새가 바닥을 타고 번졌다. 단톡방 알림이 초 단위로 쌓였다. 무명 동기들은 그저 시험 하나가 당겨졌을 뿐이라고 믿고 있었다.<\/p>\n<p>나는 공지를 끄지 않았다. 그 위로 검은 화면이 번져 올라왔으니까.<\/p>\n<div class=\"doc\">KARTE<\/div>\n<div class=\"doc\">마감 단축. 이제 진짜 수술을 시작합시다.<\/div>\n<p>화면 상단의 숫자가 소리 없이 바뀌었다.<\/p>\n<div class=\"timer\">[D-3 / 08:01]<\/div>\n<hr class=\"scene\">\n<p>\"나흘.\"<\/p>\n<p>병철 오빠가 내 옆자리에 털썩 앉았다. 눈 밑이 검었다. 그는 내 휴대폰을 힐끗 보고는 제 휴대폰을 엎었다.<\/p>\n<p>\"나흘을 그냥 칼로 오려냈네. 진짜 집도의다, 저 새끼.\"<\/p>\n<p>\"랭킹 봤어요?\"<\/p>\n<p>\"봤다. 아홉.\"<\/p>\n<p>열여섯 명으로 시작한 이름이 아홉 개 남아 있었다. 정우람, 육지아, 그리고 내가 얼굴만 아는 다섯 명. 지워진 이름 자리엔 회색 줄이 그어져 있었다. 처치 완료.<\/p>\n<p>남은 아홉 중에서 넷만 산다.<\/p>\n<p>나는 카르테 '규칙' 탭을 열었다. 첫날 함춘원 지하에서 집도의가 처방처럼 읽어 내리던 문장들이 그대로 적혀 있었다. 손가락으로 한 줄씩 짚었다.<\/p>\n<div class=\"doc\">승리: 땡시 종료 시점 단위 보유 상위 4명.<\/div>\n<div class=\"doc\">정산: 매일 06:00 라운딩.<\/div>\n<p>\"오빠.\"<\/p>\n<p>\"어.\"<\/p>\n<p>\"땡시가 9시에 시작해서 12시에 끝나잖아요. 마지막 라운딩은 그날 6시고.\"<\/p>\n<p>\"그렇지.\"<\/p>\n<p>\"그럼 6시부터 12시까지 여섯 시간은요. 정산이 없으면 그 시간 동안 단위는 얼어 있는 거잖아요. 6시 전에만 살아남으면, 땡시 중엔 아무도 아무것도 못 뺏어요.\"<\/p>\n<p>병철 오빠가 눈을 가늘게 떴다. 구급대 시절, 현장 지도를 볼 때의 눈이었다.<\/p>\n<p>\"마지막 밤만 버티면 된다, 이 말이가.\"<\/p>\n<p>\"규칙이 말을 그렇게 했으니까.\"<\/p>\n<p>카르테에는 '문진' 탭이 있었다. 호명자가 집도의에게 질의할 수 있는 유일한 창구. 지금까지 누구도 누르지 않은 버튼이었다. 나는 그걸 눌렀다.<\/p>\n<div class=\"doc\">질의: &#x27;땡시 종료 시점 단위&#x27;가 기준이고 정산이 06:00뿐이라면, 땡시 당일 06:00 이후 단위는 확정입니까?<\/div>\n<p>전송. 침이 꿀꺽 넘어갔다. 교수님이 강단에 올라 마이크를 두드렸다. 퉁, 퉁. 그 소리가 끝나기도 전에 답이 왔다.<\/p>\n<div class=\"doc\">좋은 질문입니다, 한이수 님.<\/div>\n<div class=\"doc\">규칙 개정: 땡시 중 수혈 허용. 시험장 내 꼬리표 탈취 시 즉시 정산합니다. 투입구는 각 스테이션에 비치됩니다.<\/div>\n<div class=\"doc\">덕분에 시험이 훨씬 재미있어졌습니다.<\/div>\n<p>강의실 여기저기서 몇 사람이 동시에 고개를 들었다. 아홉 명. 각자 다른 줄, 다른 자리에서. 서로의 얼굴을 찾았다가 황급히 시선을 떨궜다. 앞줄의 강하린이 고개를 돌려 나를 봤다. 붉은 동백 브로치가 형광등 아래 번들거렸다.<\/p>\n<p>입 모양만으로 그녀가 말했다. 고마워, 라고.<\/p>\n<p>목덜미에 소름이 돋았다.<\/p>\n<p>\"니.\"<\/p>\n<p>병철 오빠가 이마를 짚었다.<\/p>\n<p>\"니 방금 시험장을 전쟁터로 만들었다.\"<\/p>\n<p>\"…규칙이 비어 있으면 저쪽이 언제든 채울 거였어요. 차라리 지금 아는 게 나아요.\"<\/p>\n<p>말은 그렇게 했다. 그런데 책상 아래에서 내 무릎이 떨리고 있었다. 막으려고 판 구멍으로 물이 쏟아져 들어온 기분이었다. 저쪽은 질문을 기다리고 있었다. 내가 묻는 순간을.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-3 / 13:40]<\/div>\n<p>시신 관리실 문 앞엔 흰 국화가 꽂혀 있었다.<\/p>\n<p>플라스틱 화병 속 물이 탁했다. 꽃잎 끝이 누렇게 말려 있었다. 문을 열자 냉기가 먼저 쏟아졌다. 포르말린, 소독용 알코올, 그리고 희미한 향 냄새. 누군가 매일 아침 향을 피우는 방이었다.<\/p>\n<p>고은채 조교는 서류 캐비닛 앞에 서 있었다. 하얀 가운 소매가 팔꿈치까지 걷혀 있었다. 손목에 고무줄 하나.<\/p>\n<p>\"문 닫아요.\"<\/p>\n<p>나는 닫았다. 철컥, 하는 소리에 어깨가 움찔했다. 냉장실 이후로 닫히는 문소리가 싫었다.<\/p>\n<p>\"0412.\"<\/p>\n<p>그녀가 서류 한 장을 책상 위로 밀었다. 복사본이었다. 상단에 굵은 글씨.<\/p>\n<p class=\"em-line\"><strong>시신기증 서약서<\/strong><\/p>\n<p>기증자 성명 칸이 검은 마커로 두껍게 지워져 있었다. 주민등록번호 칸도. 주소도. 남은 건 날짜 두 개뿐이었다.<\/p>\n<div class=\"doc\">사망 일자: ████. 3. 14.<\/div>\n<div class=\"doc\">서약 일자: ████. 3. 16.<\/div>\n<p>나는 그 두 줄을 오래 봤다. 형광등이 지직거렸다.<\/p>\n<p>\"…서약을, 죽고 나서 이틀 뒤에 했다고요?\"<\/p>\n<p>\"보호자 대리 서약이라고 처리돼 있어요. 그런데 보호자 서명란은 비어 있어요. 사본에도, 원본에도.\"<\/p>\n<p>\"원본은 어디 있어요.\"<\/p>\n<p>\"해부학교실 금고요. 열쇠는 주임교수실에 있고.\"<\/p>\n<p>\"조교님은 이걸 언제 아셨어요.\"<\/p>\n<p>\"2년 전에요. 이 서류에 접수 도장을 찍으라는 지시를 받았을 때.\"<\/p>\n<p>\"찍으셨어요?\"<\/p>\n<p>그녀는 대답하지 않았다. 대신 손목의 고무줄을 한 번 튕겼다. 탁, 하고 살갗에 붉은 줄이 생겼다. 그 자리에 이미 희미한 자국이 여러 겹 겹쳐 있었다.<\/p>\n<p>그녀가 내 얼굴을 봤다. 시신을 보는 사람의 눈이었다. 감정이 아니라 사실을 읽는 눈.<\/p>\n<p>\"이 시신은 기증된 게 아니에요.\"<\/p>\n<p>손끝이 서류 위에서 차갑게 굳었다. 3월. 2년 전 3월. 숫자가 머릿속에서 저절로 자리를 찾아가려 했다. 나는 그걸 억지로 밀어냈다.<\/p>\n<p>\"왜 저한테 보여주세요.\"<\/p>\n<p>\"한이수 학생 조에 배정됐으니까.\"<\/p>\n<p>\"그게 다예요?\"<\/p>\n<p>고은채는 대답 대신 국화 한 송이를 화병에서 뽑았다. 시든 잎을 손톱으로 떼어 냈다. 툭, 툭.<\/p>\n<p>\"여기 들어오는 분들은 이름을 두고 와요. 대신 번호를 받죠. 저는 그 번호가 거짓말을 안 하게 지키는 사람이에요.\"<\/p>\n<p>\"그럼 이 번호는요.\"<\/p>\n<p>\"거짓말을 하고 있어요.\"<\/p>\n<p>그녀가 국화를 다시 꽂았다. 물이 찰랑 넘쳐 책상에 떨어졌다.<\/p>\n<hr class=\"scene\">\n<p>오후 실습은 하지(下肢)였다. 그런데 무진은 0412의 손을 놓지 않았다.<\/p>\n<p>상지 해부는 지난주에 끝났다. 오늘 범위가 아닌 손이었다. 그는 시트를 손목까지만 걷고, 손등의 힘줄을 젖혀 놓은 거즈를 새것으로 갈았다. 고정액을 적신 거즈로 손가락 하나하나를 감쌌다. 마르지 않게.<\/p>\n<p>잠든 사람을 깨우지 않으려는 손길 같았다.<\/p>\n<p>우리는 아침 이후로 한마디도 하지 않았다. 그의 왼쪽 뺨은 이제 붉지 않았다. 내 손바닥은 아직 화끈거리는 것 같았다.<\/p>\n<p>핀셋을 건네받을 때 손가락이 스쳤다. 나는 장갑 너머로도 그 온도를 알아챘다. 그가 손을 먼저 뺐다.<\/p>\n<p>\"어제 그거.\"<\/p>\n<p>내가 먼저 입을 열었다. 목소리를 낮췄다. 맞은편의 박선우는 이어폰을 꽂은 채 아무것도 모르고 근육 이름을 중얼거리고 있었다.<\/p>\n<p>\"그 사람이 누군지, 나 알아낼 거야.\"<\/p>\n<p>\"알아내지 마.\"<\/p>\n<p>\"니가 말 안 하면 내가 찾아.\"<\/p>\n<p>그가 거즈를 감던 손을 멈췄다. 고개를 들지 않은 채 말했다.<\/p>\n<p>\"찾으면, 그때부턴 내가 못 막아.\"<\/p>\n<p>그게 협박인지 부탁인지 나는 구분하지 못했다. 그의 손끝만 아주 미세하게 떨렸다. 메스를 쥐었을 땐 한 번도 떨지 않던 손이, 거즈를 쥐고서.<\/p>\n<p>\"무진아, 거긴 오늘 범위 아닌데.\"<\/p>\n<p>재석이 웃으며 말했다. 무진은 대답하지 않았다. 재석은 어깨를 으쓱하고 대퇴삼각을 열었다. 다정한 목소리로 지시했다. 넙다리신경, 넙다리동맥, 넙다리정맥. NAVEL. 바깥에서 안쪽으로.<\/p>\n<p>나는 핀셋을 쥔 채 무진의 손 아래, 거즈 사이로 비친 0412의 손바닥을 봤다.<\/p>\n<p>오른손 엄지두덩 아래. 갈고리 모양으로 휘어진 오래된 흉터.<\/p>\n<p>엿새 전에도 봤다. 흔한 흉터라고 생각했다. 칼에 베이고, 못에 찍히고, 사람 손에는 별의별 흉터가 다 있으니까.<\/p>\n<p>그런데 오늘은 거즈 사이로 그 갈고리 끝이 정확히 보였다. 바늘이 들어갔다가 미늘에 걸려 찢고 나온 자국. 그 모양을 나는 알았다. 일곱 살 여름, 피가 철철 흐르던 손바닥을 나는 기절하기 직전까지 보고 있었으니까.<\/p>\n<p>위장이 뒤틀렸다.<\/p>\n<p>포르말린 냄새가 갑자기 혀 위로 올라와 짓눌렀다. 나는 핀셋을 내려놓고 세척실로 뛰었다. 스테인리스 개수대에 이마를 박고 토했다. 아침에 먹은 것도 없었다. 노란 위액만 쓰게 올라왔다.<\/p>\n<p>등 뒤로 문이 열렸다. 묵직한 발소리.<\/p>\n<p>\"현장 도착. 환자 구토 중, 의식 명료.\"<\/p>\n<p>병철 오빠가 내 등을 쓸었다. 두꺼운 손바닥이 등뼈를 따라 천천히 내려갔다. 그는 아무것도 묻지 않고 종이컵에 물을 받아 왔다.<\/p>\n<p>나는 물을 입에 머금었다가 뱉었다. 개수대 배수구가 꼬르륵 소리를 냈다.<\/p>\n<p>\"오빠.\"<\/p>\n<p>\"어.\"<\/p>\n<p>\"저 사람 손에.\"<\/p>\n<p>목이 막혔다. 침을 두 번 삼키고 나서야 말이 나왔다.<\/p>\n<p>\"저 사람 손에, 우리 오빠 흉터가 있어.\"<\/p>\n<p>병철 오빠의 손이 내 등에서 멈췄다.<\/p>\n<p>세척실의 환풍기가 덜덜 돌았다. 수도꼭지에서 물방울이 하나 떨어졌다. 그는 한참 동안 말이 없었다. 그러다 아주 천천히, 타이르듯 말했다.<\/p>\n<p>\"그런 흉터 흔하다.\"<\/p>\n<p>\"오빠.\"<\/p>\n<p>\"흔하다, 이수야.\"<\/p>\n<p>그 목소리가 떨렸다. 구급차 안에서도, 응급실에서도, 피 흘리는 사람 앞에서 한 번도 떨린 적 없다던 목소리가.<\/p>\n<p>나는 고개를 들었다. 개수대 위 거울 속에서 그가 나를 보지 않고 있었다. 실습실 쪽 문을 보고 있었다. 그 너머의 0412를.<\/p>\n<p>그의 턱 근육이 단단히 굳어 있었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-3 / 22:17]<\/div>\n<p>기숙사 방은 불을 끄면 더 무서웠다. 이제 나는 알았다. 천장 화재감지기 옆의 작은 검은 점이 무엇인지.<\/p>\n<p>나는 이불을 머리끝까지 뒤집어쓰고 휴대폰을 켰다. 이불 속에 갇힌 화면 빛이 얼굴을 파랗게 물들였다. 숨이 차오를 만큼 답답했다. 그래도 걷지 않았다.<\/p>\n<p>메일이 와 있었다. 발신자는 해부학교실 공용 계정. 제목은 없었다. 첨부 파일 하나. 본문에 한 줄.<\/p>\n<div class=\"doc\">원본 스캔. 원본은 마커가 얇아요. 밝기를 끝까지 올려보세요.<\/div>\n<p>고은채였다.<\/p>\n<p>파일을 열었다. 아까 본 서약서와 같은 서식이었다. 그런데 종이의 질감이 달랐다. 스캐너 빛이 종이 섬유를 투과해, 지워진 칸의 검은색이 미세하게 얼룩져 있었다. 마커가 지나간 결이 보였다. 그 밑에, 볼펜 자국이 희미하게 눌려 있었다.<\/p>\n<p>나는 엄지를 화면 위에 올려둔 채 한참을 움직이지 못했다. 확대하지 않으면 모른다. 모르면, 0412는 그냥 0412다. 이름 없는 선생님. 흔한 흉터를 가진 누군가.<\/p>\n<p>오빠는 이런 걸 모른 척하는 사람이 아니었다.<\/p>\n<p>화면 밝기를 끝까지 올렸다. 눈이 시렸다.<\/p>\n<p>두 손가락으로 주민등록번호 칸을 벌렸다. 화소가 깨졌다가 다시 맞춰졌다. 검은 마커 아래로, 앞자리 여섯 개의 숫자가 유령처럼 떠올랐다.<\/p>\n<p>심장이 귓속에서 뛰었다. 쿵. 쿵. 이불 속 공기가 뜨겁고 축축했다.<\/p>\n<p>나는 그 숫자를 한 자씩 읽었다.<\/p>\n<p>0. 0. 0. 4. 1. 2.<\/p>\n<p>000412.<\/p>\n<p>오빠의 생일이었다.<\/p>","chars":5033},{"title":"제9조","html":"<div class=\"timer\">[D-3 / 23:00]<\/div>\n<p>\"아니야.\"<\/p>\n<p>이불 속에서 내 목소리가 축축하게 울렸다.<\/p>\n<p>\"4월 12일생이 한국에 몇 명인데. 그해에 태어난 사람만 해도 수천 명이야. 흉터도 흔하고. 병철 오빠도 흔하다 했어.\"<\/p>\n<p>나는 화면을 향해 말하고 있었다. 화면은 대답하지 않았다. 000412. 여섯 개의 숫자가 깨진 화소 속에서 꼼짝도 하지 않았다.<\/p>\n<p>그때 숫자 위로 검은 알림이 내려앉았다.<\/p>\n<div class=\"doc\">KARTE — 개인 메시지<\/div>\n<div class=\"doc\">발신: 집도의<\/div>\n<hr class=\"scene\">\n<div class=\"doc\">한이수 님. 오늘 질의, 즐겁게 읽었습니다.<\/div>\n<div class=\"doc\">보답으로 제안 하나 드리지요.<\/div>\n<p>메시지 아래 동영상 파일이 붙어 있었다. 썸네일은 푸르스름한 어둠이었다. 재생 버튼을 누르기 전부터 나는 그게 어디인지 알았다. 손끝이 저절로 차가워졌다.<\/p>\n<p>4℃. 시신 보관 선반. 스테인리스 문.<\/p>\n<p>화면 속 나는 무진의 가운에 싸여 있었다. 입술이 보라색이었다. 이빨 부딪치는 소리가 스피커를 타고 딱딱딱 새어 나왔다. 무진은 내 등에 가슴을 붙인 채 내 두 손을 자기 손 안에 감싸 쥐고 있었다. 하이라이트 영상에서 잘려 나간 부분이었다.<\/p>\n<p>화면 속 내가 물었다. 시계탑에서 누구 만났어.<\/p>\n<p>화면 속 그가 대답했다.<\/p>\n<div class=\"doc\">— 널 지키는 게 보고 내용이야. 그것만 믿어.<\/div>\n<p>그 목소리가 이불 속 좁은 공기를 가득 채웠다. 나는 휴대폰을 가슴에 대고 눌렀다. 소리를 막으려고. 그런데 진동처럼, 그 목소리가 갈비뼈를 타고 울렸다.<\/p>\n<p>영상 아래로 문장이 이어졌다.<\/p>\n<div class=\"doc\">선별 규칙 제9조. 감찰은 호명자와 사적 관계를 맺지 않는다. 위반 시 양자 모두 DNR.<\/div>\n<div class=\"doc\">이 원본을 &#x27;제출&#x27;해 주시면, 위반은 감찰 단독 책임으로 처리합니다.<\/div>\n<div class=\"doc\">보상: 면책권 1회(DNR 1회 무효). 그리고 제0표본실 1회 열람.<\/div>\n<div class=\"doc\">기한: 23:59.<\/div>\n<p>제0표본실. 오빠가 마지막으로 들어갔을지 모르는 방. 오빠의 차트가 있을지 모르는 방. 서약서에 찍힌 숫자가 진짜인지, 아닌지 알 수 있는 방.<\/p>\n<p>그 문이, 버튼 하나 너머에 있었다.<\/p>\n<p>나는 이불을 걷어찼다. 땀에 젖은 머리카락이 이마에 들러붙었다. 천장 구석의 검은 점이 나를 내려다보고 있었다. 저 너머 관람실 소파에서 누군가 와인잔을 기울이고 있을지도 몰랐다. 내가 어떤 버튼을 누를지, 내기를 걸면서.<\/p>\n<div class=\"timer\">[D-3 / 23:12]<\/div>\n<p>업로드 버튼이 화면 아래에서 붉게 깜빡였다.<\/p>\n<p>무진이 DNR이 되면 처치다. 제적일까. 누명일까. 말을 듣지 않는 자에게는 사고사.<\/p>\n<p>말을 듣지 않는 자. 그 사람은 2년 동안 아무 말도 하지 않았다. 내 오빠를 내렸고, 그 손으로 내 눈을 가렸다. 그 손으로 보고서를 썼다.<\/p>\n<p>미워할 이유는 넘치게 많았다.<\/p>\n<p>그리고 열람권. 나는 눈을 감고 그 방을 그려봤다. 오빠 이름이 적힌 차트. 사망 일자. 기증 처리. 그 서류 한 장이면 엄마한테 말할 수 있었다. 엄마, 오빠는 미쳐서 죽은 게 아니야. 누가 죽였어. 여수 요양원 휴게실에서 혼자 도시락을 먹는 엄마의 굽은 등이 눈꺼풀 안쪽에 떠올랐다.<\/p>\n<p>면책권까지 있으면, 나는 땡시까지 살아남을 수 있었다. 아홉 명 중 넷. 그 안에 들 수 있었다.<\/p>\n<p>한 사람만 지우면.<\/p>\n<p>나는 카카오톡을 열었다. 무진의 이름을 눌렀다. 대화창은 비어 있었다. 한 번도 연락한 적이 없었으니까. 자판 위에서 손가락이 맴돌았다.<\/p>\n<div class=\"doc\">니 지금 어디야<\/div>\n<p>썼다가 지웠다.<\/p>\n<div class=\"doc\">니 그 사람한테 나 팔았어?<\/div>\n<p>지웠다. 이 방은 보고 있었다. 이 화면도 보고 있을지 몰랐다.<\/p>\n<p>나는 엄지를 버튼 위에 올렸다. 화면이 엄지 끝에서 미세하게 따뜻했다.<\/p>\n<div class=\"timer\">[D-3 / 23:24]<\/div>\n<p>함춘원 지하, 물이 차오르던 통로가 떠올랐다. 입을 틀어막던 차가운 손. 귓가의 숨. 그리고 옥상에서 그가 한 말.<\/p>\n<p>넌 빚진 거야.<\/p>\n<div class=\"timer\">[D-3 / 23:31]<\/div>\n<p>엄지가 떨렸다. 왼쪽 귀가 뜨거웠다. 나는 아무에게도 거짓말을 하고 있지 않았다. 나 자신에게만 빼고.<\/p>\n<p>\"…씨.\"<\/p>\n<p>엄지를 옆으로 밀었다. 파일 위에 휴지통 아이콘이 떠올랐다.<\/p>\n<div class=\"doc\">삭제하시겠습니까?<\/div>\n<p>예.<\/p>\n<p>화면이 한 번 하얗게 깜빡였다. 영상이 사라졌다. 메시지 창에 회색 글자 한 줄만 남았다.<\/p>\n<div class=\"doc\">확인했습니다.<\/div>\n<p>그 네 글자가 이상할 만큼 공손했다.<\/p>\n<hr class=\"scene\">\n<p>나는 운동화를 구겨 신고 뛰었다.<\/p>\n<p>기숙사 복도의 형광등이 내 발소리에 맞춰 하나씩 켜졌다. 계단 난간이 손바닥에 차갑게 감겼다. 심장이 갈비뼈를 두드렸다. 무엇 때문에 뛰는지 나도 몰랐다. 확인하고 싶었다. 그가 아직 거기 있는지. 아직, 살아 있는 이름인지.<\/p>\n<p>밤의 연건캠퍼스는 텅 비어 있었다. 함춘원 쪽에서 바람이 불어와 동백 잎 냄새가 났다. 의과대학 2동의 비상계단 문을 밀자 지하의 냉기가 확 올라왔다. 지하 1층 복도 끝, 해부학 실습실의 유리문 너머로 불빛 하나가 새어 나왔다.<\/p>\n<p>그는 거기 있었다.<\/p>\n<p>0412조 실습대 옆 철제 의자에 혼자 앉아 있었다. 무릎 위에 낡은 노트 한 권. 형광등 하나만 켜놓아서 그의 그림자가 시트 덮인 카데바 위로 길게 드리워져 있었다.<\/p>\n<p>문이 열리는 소리에 그가 노트를 덮었다. 빠르게. 나는 그 표지를 보지 못했다.<\/p>\n<p>천장 구석, 늘 깜빡이던 CCTV의 빨간 불이 꺼져 있었다.<\/p>\n<p>\"꺼놨어.\"<\/p>\n<p>그가 내 시선을 따라 천장을 봤다.<\/p>\n<p>\"이십 분. 감찰 권한으로 되는 건 그 정도야.\"<\/p>\n<p>\"알고 있었제.\"<\/p>\n<p>숨이 차서 말이 끊겼다. 포르말린 냄새가 마스크 없는 코로 날것 그대로 쳐들어왔다. 눈이 따가웠다.<\/p>\n<p>\"그 사람이 나한테 뭘 보냈는지. 니도 알고 있었제.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"근데 여기 앉아 있었어? 도망도 안 치고?\"<\/p>\n<p>\"도망칠 데가 없어.\"<\/p>\n<p>그가 일어섰다. 노트를 의자 위에 내려놓았다. 실습대 하나를 사이에 두고 우리는 마주 섰다. 시트 아래 0412의 윤곽이 우리 사이에 누워 있었다.<\/p>\n<p>\"넌 날 팔 수 있었어.\"<\/p>\n<p>\"니도.\"<\/p>\n<p>목소리가 갈라졌다. 나는 실습대 모서리를 짚었다. 스테인리스가 손바닥을 얼렸다.<\/p>\n<p>\"니도 나를 팔 수 있었잖아. 보고서 한 장이면 됐잖아. 제0표본실 근처에 얼쩡거린다고. 처치 보류 말고, 처치 요청이라고 쓰면 됐잖아.\"<\/p>\n<p>\"팔지 않았잖아.\"<\/p>\n<p>\"그러니까.\"<\/p>\n<p>나는 실습대를 돌아 그에게 걸어갔다. 한 걸음. 두 걸음. 그는 물러서지 않았다.<\/p>\n<p>\"그러니까 니가 미운 거야. 팔았으면 내가 편했잖아. 니를 그냥 미워하면 됐잖아.\"<\/p>\n<p>주먹이 그의 가슴을 쳤다. 한 번. 그는 맞았다. 두 번. 세 번째에 그가 내 손목을 잡았다. 아프지 않을 만큼. 그러나 빠져나갈 수 없을 만큼.<\/p>\n<p>\"한이수.\"<\/p>\n<p>\"놔.\"<\/p>\n<p>\"너 지금 떨어.\"<\/p>\n<p>\"추워서 그래.\"<\/p>\n<p>거짓말이었다. 귀가 타는 것 같았다. 그의 시선이 내 왼쪽 귀에 머물렀다. 그가 그걸 알고 있다는 게, 그 사실이 나를 미치게 했다.<\/p>\n<p>그가 내 손목을 끌어당겼다. 아니, 내가 먼저 그의 가운 깃을 움켜쥐었는지도 몰랐다. 어느 쪽이 먼저였는지 나는 끝내 기억하지 못했다.<\/p>\n<p>입술이 부딪쳤다.<\/p>\n<p>부드럽지 않았다. 이빨이 그의 아랫입술에 닿았다. 쇠 맛이 아주 희미하게 번졌다. 피였다. 그런데 하얗게 바래지 않았다. 세상이 멀어지지 않았다. 오히려 너무 가까웠다. 그의 숨, 그의 심장, 손바닥 아래에서 빠르게 뛰는 그의 목덜미의 맥.<\/p>\n<p>등 뒤로 실습대 모서리가 허리를 눌렀다. 차가웠다. 그의 손이 내 등과 스테인리스 사이로 미끄러져 들어와 그 냉기를 막았다. 냉장실에서처럼.<\/p>\n<p>포르말린 냄새 속으로 비누 냄새가 섞였다. 그 밑의, 그의 냄새.<\/p>\n<p>숨이 모자라 입술을 뗐다. 이마가 맞닿은 채로 우리는 헐떡였다. 그의 속눈썹이 떨리고 있었다. 이 사람이, 떨고 있었다.<\/p>\n<p>\"…제9조.\"<\/p>\n<p>그가 속삭였다. 입술이 내 입술 위에서 움직였다.<\/p>\n<p>\"알아.\"<\/p>\n<p>\"양자 모두야.\"<\/p>\n<p>\"안다고.\"<\/p>\n<p>나는 그의 손을 찾아 쥐었다. 오른손. 메스를 쥐는 손. 2년 전 그 새벽, 천장 배관에서 오빠를 안아 내린 손.<\/p>\n<p>손가락 마디마디가 차가웠다. 나는 그 손을 놓지 않았다.<\/p>\n<p>\"니가 오빠를 내린 손이라도.\"<\/p>\n<p>목이 메어 말이 한 번 끊겼다.<\/p>\n<p>\"이 손 말고는, 잡을 게 없어.\"<\/p>\n<p>그의 이마가 내 어깨로 무너져 내렸다. 그는 아무 말도 하지 않았다. 대신 내 손을 쥔 그의 손에 힘이 들어갔다. 뼈가 아플 만큼. 그가 처음으로, 놓치지 않으려는 사람처럼.<\/p>\n<p>우리 옆에서 시트 아래의 0412가 조용히 누워 있었다. 무진의 시선이 그쪽으로 아주 잠깐 흘렀다가 돌아왔다. 그 눈에 무언가 스쳤다. 나는 그게 무엇인지 묻지 않았다.<\/p>\n<p>\"빚 갚았다.\"<\/p>\n<p>내가 그의 가운에 얼굴을 묻은 채 웅얼거렸다.<\/p>\n<p>\"함춘원. 넌 빚진 거야, 했잖아. 이제 없어.\"<\/p>\n<p>그가 내 정수리에 대고 숨을 내쉬었다. 웃음 같은 숨이었다.<\/p>\n<p>\"그거 갚으라고 한 거 아니었어.\"<\/p>\n<p>\"그라믄 뭔디.\"<\/p>\n<p>\"…갚지 말라고 한 거였어. 계속 빚지고 있으라고.\"<\/p>\n<p>그래야 살아 있을 테니까. 그 뒷말을 그는 하지 않았다. 나는 들었다.<\/p>\n<hr class=\"scene\">\n<p>천장의 빨간 불은 여전히 꺼져 있었다. 실습실 벽시계의 초침이 째깍째깍 12를 향해 기어올랐다. 이십 분이 다 되어 가고 있었다.<\/p>\n<p>\"가.\"<\/p>\n<p>그가 내 어깨를 밀었다. 다정하지 않은 손길로, 그러나 아주 조심스럽게.<\/p>\n<p>\"불 들어오기 전에. 따로 나가.\"<\/p>\n<p>\"니는.\"<\/p>\n<p>\"난 여기 있어야 돼. 보고 시간이야.\"<\/p>\n<p>보고. 그 단어에 등이 다시 굳었다. 그가 내 얼굴을 보고 고개를 저었다.<\/p>\n<p>\"너에 대해선 아무것도 안 써.\"<\/p>\n<p>그 순간 주머니 속 휴대폰이 진동했다. 그의 주머니에서도. 동시에.<\/p>\n<div class=\"timer\">[D-2 / 00:00]<\/div>\n<p>검은 화면 위로 붉은 글자가 번졌다.<\/p>\n<div class=\"doc\">KARTE — 전체 공지<\/div>\n<div class=\"doc\">제안 거절 확인.<\/div>\n<div class=\"doc\">호명자 한이수 님은 동료를 지키는 쪽을 고르셨습니다. 아름다운 선택입니다.<\/div>\n<div class=\"doc\">선택에는 수술비가 따릅니다.<\/div>\n<p>나는 숨을 멈추고 다음 줄을 기다렸다. 무진의 이름이 나올 줄 알았다. 아니면 내 이름이.<\/p>\n<div class=\"doc\">벌칙: 0412조 오병철 −2 Unit.<\/div>\n<p>손끝에서 피가 빠져나갔다.<\/p>\n<p>랭킹 화면이 저절로 열렸다. 오병철. 이름 옆에 나란히 서 있던 혈액백 세 개 중 두 개가 터지듯 사라졌다. 붉은 액체가 화면 바깥으로 흘러내리는 애니메이션. 지나치게 정교했다.<\/p>\n<p>남은 건 하나였다.<\/p>\n<p>1 Unit. 꼬리표 하나만 뺏겨도 0. DNR. 그다음 날 06:00, 처치.<\/p>\n<p>내가 지운 영상 하나의 값이, 그의 피 두 봉지였다.<\/p>\n<p>입 안이 바싹 말랐다. 무진의 입술에서 옮겨온 쇠 맛이 아직 혀끝에 남아 있었다. 그 맛이 갑자기 역겨워졌다. 집도의는 처음부터 알고 있었다. 내가 무진을 팔지 않으리란 걸. 그래서 청구서를 무진이 아니라, 내가 가장 지키고 싶은 사람 앞으로 끊었다.<\/p>\n<p>\"병철 오빠는….\"<\/p>\n<p>나는 무진을 봤다. 그는 나를 보지 않았다. 내 등 뒤, 실습실 유리문 쪽을 보고 있었다.<\/p>\n<p>나는 천천히 돌아섰다.<\/p>\n<p>복도의 비상등이 초록빛으로 문간을 물들이고 있었다. 그 빛 속에 커다란 그림자 하나가 서 있었다. 구겨진 후드티. 맨발에 꿰어 신은 슬리퍼. 한 손에 쥔 휴대폰의 푸른 빛이 그의 턱 밑을 비췄다.<\/p>\n<p>병철의 혈액백 아이콘이 하나만 남은 화면을, 병철 본인이 실습실 문간에 서서 보고 있었다.<\/p>","chars":5052},{"title":"지하 3층","html":"<div class=\"timer\">[D-2 / 00:02]<\/div>\n<p>병철 오빠가 웃었다.<\/p>\n<p>\"괜찮다.\"<\/p>\n<p>슬리퍼 끄는 소리가 실습실 타일 위로 미끄러져 들어왔다. 그는 휴대폰을 흔들어 보였다. 화면 속 혈액백 하나가 출렁였다.<\/p>\n<p>\"1단위면 살아는 있는 기다. 구급대에선 이런 걸 뭐라 카는 줄 아나. 생체징후 미약, 그러나 존재함.\"<\/p>\n<p>웃자고 한 말이었다. 아무도 웃지 않았다. 휴대폰을 쥔 그의 손가락 마디가 하얗게 질려 있었다. 손톱 밑까지 피가 빠져서.<\/p>\n<hr class=\"scene\">\n<p>\"오빠, 나 때문에….\"<\/p>\n<p>\"니 때문 아이다.\"<\/p>\n<p>그가 내 말을 잘랐다. 그러고는 무진을 봤다. 아주 천천히, 위아래로. 무진의 아랫입술에 맺힌 작은 피딱지에서 시선이 멈췄다.<\/p>\n<p>공기가 굳었다. 포르말린 냄새가 갑자기 짙어진 것 같았다.<\/p>\n<p>\"…저 자슥 때문이지.\"<\/p>\n<p>\"오빠.\"<\/p>\n<p>\"됐다. 지금 그거 따질 시간 없다.\"<\/p>\n<p>병철 오빠는 실습대 모서리에 엉덩이를 걸쳤다. 허리를 숙여 무릎에 팔꿈치를 올렸다. 구급차 뒷칸에 앉아 다음 출동을 기다리던 자세 같았다.<\/p>\n<p>\"1단위. 꼬리표 한 번 털리면 끝이다. 땡시는 사흘 뒤고. 남은 아홉 중에 나 노리는 놈 하나쯤은 있겠제. 그럼 내가 할 수 있는 건 하나다.\"<\/p>\n<p>\"뭔데요.\"<\/p>\n<p>\"먼저 끝장을 보는 거. 니가 찾던 거, 빨리 찾아라. 내 단위 다 떨어지기 전에.\"<\/p>\n<p>무진이 가운 주머니에 손을 넣었다.<\/p>\n<p>꺼낸 손바닥 위에 은빛 열쇠가 놓여 있었다. 형광등 아래서 톱니 하나하나가 차갑게 빛났다. 사흘 전 새벽, 그가 끝내 건네지 않았던 것.<\/p>\n<p>\"지하 3층.\"<\/p>\n<p>그가 말했다.<\/p>\n<p>\"오늘 밤이 마지막이야. 일정을 당겼다는 건, 정리를 시작한다는 뜻이야. 땡시 전에 그 방은 비워질 거야.\"<\/p>\n<p>\"정리.\"<\/p>\n<p>병철 오빠가 그 단어를 곱씹었다.<\/p>\n<p>\"니가 그걸 어떻게 아노.\"<\/p>\n<p>\"그 방 청소를 나도 해봤으니까.\"<\/p>\n<p>침묵이 실습실 바닥을 기어갔다. 병철 오빠의 턱 근육이 씰룩였다. 그러다 그가 코웃음을 쳤다.<\/p>\n<p>\"좋다. 근데 무단 진입은 DNR 아이가. 제4조.\"<\/p>\n<p>\"감찰 동행이면 무단이 아니야.\"<\/p>\n<p>\"그것도 규칙에 쓰여 있나.\"<\/p>\n<p>\"안 쓰여 있어. 그러니까 저쪽도 못 막아.\"<\/p>\n<p>내가 낮에 찔렀던 바로 그 틈이었다. 규칙이 비워둔 자리. 나는 무진을 봤다. 그는 열쇠를 내 손에 쥐여주지 않았다. 자기 손에 쥐고 문 쪽으로 걸어갔다. 앞장서는 사람의 등이었다.<\/p>\n<p>우리 둘은 그 등을 따라갔다. 따라갈 수밖에 없었다. 이 판에서 그 문을 열 수 있는 손은, 지금 그 손 하나뿐이었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-2 / 03:00]<\/div>\n<p>시계탑 지하 계단은 사흘 전과 똑같은 냄새가 났다. 젖은 시멘트, 녹물, 그리고 아주 오래된 먼지.<\/p>\n<p>관람실로 가는 통로를 지나쳤다. 유리창 너머 모니터 벽이 푸르게 숨 쉬고 있었다. 소파는 비어 있었다. 무진이 철문 아래, 한 층 더 내려가는 계단 앞에 섰다. 계단 폭은 어깨 하나 너비였다. 난간이 없었다.<\/p>\n<p>\"발밑 조심. 열네 칸.\"<\/p>\n<p>병철 오빠가 휴대폰 손전등을 켜려다 무진에게 손목을 잡혔다.<\/p>\n<p>\"빛 새면 안 돼. 열네 칸 세면서 와.\"<\/p>\n<p>\"무전 칩니다.\"<\/p>\n<p>병철 오빠가 내 등 뒤에서 속삭였다.<\/p>\n<p>\"현재 지하 3층 진입 중. 구조대원 1단위, 상태 불량. 동행자 수상함. 이상.\"<\/p>\n<p>\"오빠, 쉿.\"<\/p>\n<p>\"긴장 풀라꼬 하는 기다. 니 손 떨리는 거 다 보인다.\"<\/p>\n<p>하나. 둘. 나는 벽을 짚으며 셌다. 벽돌 틈의 이끼가 손가락에 묻어나왔다. 열하나. 열둘. 공기가 바뀌었다. 습기가 빠지고, 대신 쨍한 알코올 냄새가 코끝을 찔렀다. 수십 년 묵은 소독약 같은.<\/p>\n<p>열넷.<\/p>\n<p>철컥. 은빛 열쇠가 자물쇠 안에서 돌았다. 경첩이 길게 울었다.<\/p>\n<p>무진이 문 안쪽 벽을 더듬어 스위치를 올렸다. 천장의 백열등이 하나, 둘, 노랗게 깨어났다. 필라멘트가 지직거리며 떨었다.<\/p>\n<p>나는 숨을 멈췄다.<\/p>\n<p>방은 생각보다 넓었다. 그리고 생각보다 고요했다. 사방 벽을 따라 나무 진열장이 천장까지 이어져 있었다. 그 안에 유리병들이 빽빽하게 서 있었다. 수백 개. 누런 액체에 잠긴 것들이 백열등 아래서 희미하게 흔들렸다.<\/p>\n<p>병마다 누렇게 바랜 종이 라벨이 붙어 있었다. 세로로 쓴 일본어. <span class=\"sys\">京城帝國大學醫學部<\/span>. 그 아래 연호. <span class=\"sys\">昭和十二年<\/span>. <span class=\"sys\">昭和十六年<\/span>.<\/p>\n<p>그리고 이름이 있었다. 한국 이름이었다.<\/p>\n<p><span class=\"sys\">朴○○ 十九歲 男<\/span>. <span class=\"sys\">金○○ 二十二歲 女<\/span>.<\/p>\n<p>방 한가운데엔 검은 나무판 하나가 벽에 걸려 있었다. 벨벳 위에 메스 일곱 자루가 일렬로 꽂혀 있었다. 손잡이는 상아였고, 날은 검게 녹슬어 있었다. 판 아래 놋쇠 명판.<\/p>\n<div class=\"doc\">1947. 3. — 七人.<\/div>\n<p>함춘원 통로 벽에서 봤던 일곱 개의 메스 자국. 그 원본이 여기 있었다.<\/p>\n<p>\"…흑차트.\"<\/p>\n<p>무진이 진열장 맞은편을 가리켰다. 거기엔 유리병 대신 검은 바인더가 서가를 채우고 있었다. 등마다 흰 글씨. <span class=\"sys\">제38기<\/span>. <span class=\"sys\">제39기<\/span>. 연도순으로 끝없이.<\/p>\n<p>나는 손가락으로 바인더 등을 훑으며 걸었다. 가죽이 손끝에 끈적하게 달라붙었다. 1985년. 손이 멈췄다. 꺼내서 펼쳤다.<\/p>\n<div class=\"doc\">호명자 ○○○. 선별 거부. 처치 — 시계탑 낙상. 외부 처리: 극단적 선택.<\/div>\n<p>종이가 손 안에서 바스락거렸다. 몇 권 건너, 2010년대. 같은 문장이 다른 이름 옆에 있었다. <span class=\"sys\">외부 처리: 극단적 선택.<\/span> 또. 또. 나는 휴대폰을 꺼내 무음으로 셔터를 눌렀다. 화면이 번쩍이지 않게 손바닥으로 가리고. 한 장. 두 장.<\/p>\n<p>일곱 번. '극단적 선택'은 정확히 일곱 번이었다.<\/p>\n<p>\"제77기. 78기.\"<\/p>\n<p>내 목소리가 떨렸다. 서가 맨 끝 칸. 77기 바인더가 있었다. 나는 그걸 뽑아 들었다. 생각보다 무거웠다. 첫 장을 넘기자 낯익은 증명사진이 클립에 물려 있었다.<\/p>\n<p>까까머리에 가까운 짧은 머리. 카메라 앞에서 웃음을 참느라 한쪽 입꼬리만 올라간 얼굴. 고등학교 졸업 앨범에서 엄마가 오려 지갑에 넣고 다니던 그 표정.<\/p>\n<div class=\"doc\">호명자 한도윤. 최종 7 Unit. 우승. 백의 견습 승급.<\/div>\n<p>우승. 그 두 글자 옆에 붉은 도장이 찍혀 있었다. 손끝이 사진 모서리를 쓸었다. 종이가 아니라 오빠 뺨을 만지는 것 같았다. 목구멍이 막혀 숨이 반만 들어왔다.<\/p>\n<p>\"이수야. 시간.\"<\/p>\n<p>병철 오빠가 문 쪽을 보며 속삭였다. 나는 사진 위로 셔터를 한 번 더 눌렀다. 그리고 77기를 제자리에 꽂았다. 그 옆, 78기 자리엔 —<\/p>\n<p>계단 위에서 소리가 났다.<\/p>\n<p>구두 굽. 시멘트를 밟는 소리. 하나. 둘.<\/p>\n<p>무진이 내 손목을 낚아챘다.<\/p>\n<hr class=\"scene\">\n<p>그가 스위치를 내렸다. 방이 칠흑으로 가라앉았다. 백열등의 필라멘트만 잠깐 붉게 남았다가 꺼졌다.<\/p>\n<p>무진은 나와 병철 오빠를 서가와 진열장 사이 틈으로 밀어 넣었다. 어깨 하나 겨우 들어가는 틈이었다. 등 뒤로 차가운 유리가 닿았다. 병 안의 액체가 내 체온에 반응하듯 출렁, 하고 울렸다.<\/p>\n<p>어둠에 눈이 익는 동안, 비상구 등의 초록 잔광이 문틈에서 새어 들어왔다. 그 빛에 내 바로 옆 유리병이 보였다.<\/p>\n<p>손이었다.<\/p>\n<p>사람의 손 하나가 누런 액체 속에 손바닥을 펼친 채 떠 있었다. 손가락이 가늘었다. 손목에 아직 붉은 실 한 가닥이 감겨 있었다. 어머니들이 아이 손목에 매주던, 명 길라고 묶는 실.<\/p>\n<p>라벨. <span class=\"sys\">十九歲<\/span>.<\/p>\n<p>병철 오빠의 숨이 끊어지는 소리가 들렸다.<\/p>\n<p>나는 그의 얼굴을 봤다. 칠 년 동안 고속도로 사고 현장에서, 불탄 집에서, 사람의 조각을 주워 담았다던 사람. 그 얼굴이 초록 잔광 속에서 하얗게 질려 있었다. 그의 커다란 손이 내 팔을 붙잡았다. 손바닥이 땀으로 미끄러웠다.<\/p>\n<p>\"이수야.\"<\/p>\n<p>입술만 움직였다. 소리가 거의 없었다.<\/p>\n<p>\"이건 사람이 할 짓이 아이다.\"<\/p>\n<p>나는 그의 손등을 꼭 쥐었다. 떨리는 건 그였는데, 그 떨림이 내 뼈까지 옮아왔다.<\/p>\n<p>구두 소리가 계단을 내려왔다. 다섯. 여섯.<\/p>\n<p>내 오른쪽에 붙어 선 무진의 몸이 굳어 있었다. 그런데 이상했다. 그의 손이 내 손목을 쥐고 있었는데, 그 손이 떨리고 있었다.<\/p>\n<p>메스를 쥐면 절대 떨리지 않는 손. 첫날 흉골 위에 칼을 대던, 냉장실에서 영하로 떨어지는 온도 속에서도 흔들리지 않던 손. 그 손가락이 내 맥 위에서 덜덜 떨렸다. 그의 맥이 내 맥보다 빨랐다.<\/p>\n<p>여덟. 아홉.<\/p>\n<p>나는 그 걸음을 셌다. 무진도 세고 있었다. 그의 입술이 소리 없이 움직였다. 그리고 걸음 사이의 간격이 미세하게 어긋날 때, 그러니까 왼발이 반 박자 늦게 끌릴 때마다, 그의 손가락이 한 번씩 경련했다.<\/p>\n<p>그는 그 리듬을 알았다.<\/p>\n<p>평생 들어온 걸음이었다. 현관에서, 복도에서, 새벽 네 시의 전화 너머에서.<\/p>\n<p>열셋. 열넷.<\/p>\n<p>나는 그의 얼굴을 올려다봤다. 초록 잔광 속에서 그는 눈을 감고 있었다. 기도하는 사람처럼. 아니면, 무언가 오지 않기를 빌던 아이처럼.<\/p>\n<p>그날 실습실 열쇠를 가진 사람은 둘뿐이었어. 나랑, 그 사람.<\/p>\n<hr class=\"scene\">\n<p>문이 열렸다.<\/p>\n<p>백열등이 다시 켜졌다. 이번엔 하나만. 노란 빛이 방 한가운데 원을 그렸다. 그 안으로 한 남자가 걸어 들어왔다.<\/p>\n<p>검은 코트. 얼굴 아래 절반을 가린 수술용 마스크. 손에 들린 가죽 가방.<\/p>\n<p>그는 서두르지 않았다. 일곱 메스가 걸린 판 앞에 서서, 한참을 올려다봤다. 경례하는 사람처럼. 그리고 코트를 벗어 의자 등받이에 걸었다. 가방에서 흰 가운을 꺼냈다. 털어서, 팔을 끼웠다.<\/p>\n<p>왼쪽 깃에서 무언가 빛났다.<\/p>\n<p>은색 메스 핀.<\/p>\n<p>그가 마스크 끈에 손가락을 걸었다. 천천히 벗겨냈다. 은빛이 섞인 반백의 머리. 단정한 금테 안경. 온화하게 내려간 눈꼬리.<\/p>\n<p>나는 그 얼굴을 알았다.<\/p>\n<p>해부학 실습 첫날 아침, 의과대학 1동 대강당. 단상 위에서 그는 부드럽게 웃으며 마이크를 잡았었다. 여러분, 카데바는 여러분의 첫 번째 스승입니다. 이름을 두고 온 분들께 예의를 갖추십시오. 강당 전체가 박수를 쳤다. 나도 쳤다.<\/p>\n<p>해부학교실 주임교수, 서정혁.<\/p>\n<p>서무진의 아버지.<\/p>\n<p>내 손목을 쥔 무진의 손에서, 힘이 빠져나갔다. 떨림조차 멈췄다. 죽은 사람의 손처럼.<\/p>\n<p>집도의. 얼굴 없는 목소리. 냉장실 천장에서 \"둘 중 한 명만\"이라고 말하던 목소리. 내 사물함에 꼬리표를 돌려놓은 손. 영상 한 편을 지운 값으로 병철 오빠의 피 두 봉지를 가져간 사람.<\/p>\n<p>오빠의 지도교수.<\/p>\n<p>그 사람.<\/p>\n<p>서정혁은 78기 바인더를 서가에서 뽑았다. 책상 위에 펼쳤다. 만년필 뚜껑을 열고, 무언가를 적기 시작했다. 사각, 사각. 펜촉이 종이를 긁는 소리가 방 안의 유일한 소리였다.<\/p>\n<p>그러다 그가 펜을 멈췄다.<\/p>\n<p>고개는 들지 않았다. 서가 쪽을 보지도 않았다. 바인더의 다음 장을 넘기며, 첫 실습 날 강당에서처럼 온화하고 우아한 목소리로.<\/p>\n<p>그가 말했다.<\/p>\n<p>\"무진아. 손님을 모셔왔으면 차라도 내야지.\"<\/p>","chars":4858},{"title":"흑차트","html":"<div class=\"timer\">[D-2 / 03:19]<\/div>\n<p>찻잔이 받침에 닿는 소리가 표본실의 정적을 갈랐다.<\/p>\n<p>딸깍.<\/p>\n<p>서정혁 교수는 백자 주전자를 기울였다. 김이 피어올랐다. 구수한 보리차 냄새가 포르말린과 묵은 알코올 냄새 사이를 비집고 들어왔다. 그 구수함이 오히려 목구멍을 조였다.<\/p>\n<p>\"나오너라. 서가 뒤는 춥다.\"<\/p>\n<hr class=\"scene\">\n<p>무진이 먼저 걸어 나갔다. 어깨가 굳어 있었다. 병철 오빠가 내 손목을 잡아 자기 등 뒤로 끌었다. 땀에 젖은 손바닥이 뜨거웠다.<\/p>\n<p>표본실 한가운데 낡은 마호가니 탁자. 그 위에 찻잔이 이미 세 개 놓여 있었다.<\/p>\n<p>우리가 몇 명인지, 그는 처음부터 알고 있었다.<\/p>\n<p>\"교수님.\"<\/p>\n<p>무진의 목소리가 낮았다. 아버지, 가 아니었다.<\/p>\n<p>\"그래, 무진아. 열쇠는 잘 쓰고 있구나.\"<\/p>\n<p>서정혁은 찻잔 하나를 내 쪽으로 밀었다. 흰 가운 왼쪽 깃에서 은색 메스 핀이 반짝였다. 첫 실습 날 강당 연단에서 \"카데바는 여러분의 첫 번째 스승입니다\"라고 말하던 목소리 그대로였다. 온화하고, 정중하고, 따뜻했다.<\/p>\n<p>\"한이수 학생.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"도윤이를 닮았구나. 눈매가. 화가 나면 턱부터 굳는 것도.\"<\/p>\n<p>찻잔을 쥔 손끝이 하얘졌다. 오빠 이름이 그 입에서 나오자 귓속이 웅웅 울렸다.<\/p>\n<p>\"우리 오빠 이름을 니가 뭔디 그렇게 불러.\"<\/p>\n<p>사투리가 샜다. 병철 오빠가 내 팔꿈치를 꽉 쥐었다. 서정혁은 웃었다. 실수한 학생을 너그럽게 봐주는 얼굴로.<\/p>\n<p>\"지도교수였으니까. 그 아이 실습 노트에 빨간 펜을 제일 많이 댄 사람이 나란다.\"<\/p>\n<p>그는 차를 한 모금 마시고 손목시계를 봤다.<\/p>\n<p>\"이제 가 보거라. 첫차 다닐 시간이다.\"<\/p>\n<p>\"…그냥 보내준다고요?\"<\/p>\n<p>\"규칙 제4조, 지하 3층 무단 진입. 원래는 DNR이지.\"<\/p>\n<p>그가 찻잔을 내려놓았다. 도자기가 나무에 닿는 소리가 유난히 컸다.<\/p>\n<p>\"하지만 나는 미완성 증례를 중간에 덮는 사람이 아니야.\"<\/p>\n<p>무진이 내 소매를 잡아당겼다. 가자는 신호였다. 등 뒤로 그 온화한 목소리가 따라왔다.<\/p>\n<p>\"땡시에서 보자. 공부 열심히 해 오렴.\"<\/p>\n<hr class=\"scene\">\n<p>운구 통로 계단을 거꾸로 오르는 동안 아무도 말하지 않았다. 녹슨 난간의 쇠 비린내. 발밑에서 찰박이는 고인 물. 바지 주머니 속 휴대폰이 허벅지에 닿아 뜨거웠다.<\/p>\n<p>서가 틈에 숨어 있던 몇 분 사이, 손이 저절로 움직였었다. 무음 카메라. 플래시 없이. 흑차트 책등과 펼쳐진 장을 따라 셔터를 눌렀다. 몇 장인지 세지도 못했다.<\/p>\n<p>\"찍었제.\"<\/p>\n<p>병철 오빠가 숨을 몰아쉬며 물었다.<\/p>\n<p>\"…몇 장.\"<\/p>\n<p>\"잘했다. 근데 나는 못 봤다. 무전 끝.\"<\/p>\n<p>그가 웃으려다 말았다.<\/p>\n<p>함춘원 배수구 철문을 빠져나오자 새벽 공기가 폐를 찔렀다. 동백 잎마다 이슬이 맺혀 있었다. 무진은 석탑 그늘에 서서 한참 자기 손을 내려다봤다.<\/p>\n<p>\"니 손 떨린다.\"<\/p>\n<p>\"추워서.\"<\/p>\n<p>그의 귀는 빨개지지 않았다. 대신 턱 근육이 한 번 꿈틀했다.<\/p>\n<p>\"그 사람이 보내준 건 친절이 아니야. 아침에 뭔가 올 거야.\"<\/p>\n<p>\"니 아부지잖아. 니가 제일 잘 알겠네.\"<\/p>\n<p>말이 날카롭게 나갔다. 무진은 피하지 않았다. 석탑의 이끼 낀 그림자가 그의 얼굴 반을 덮고 있었다.<\/p>\n<p>\"응. 내가 제일 잘 알아.\"<\/p>\n<p>그는 그 말만 하고 먼저 걸었다. 담장 너머로 첫 버스가 브레이크를 밟는 소리가 길게 끌렸다. 병철 오빠가 내 어깨에 자기 점퍼를 걸쳐 주었다. 점퍼에서 담배 냄새와 파스 냄새가 났다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-2 / 07:00]<\/div>\n<p>카르테가 울었다. 세 사람의 휴대폰이 동시에.<\/p>\n<div class=\"doc\">[긴급 처방] 0412조 단위 공유제 시행.<\/div>\n<div class=\"doc\">조원 중 1인이라도 DNR 판정 시, 0412조 전원 −1 Unit.<\/div>\n<div class=\"doc\">동료는 당신의 활력징후입니다. — 집도의<\/div>\n<p>병철 오빠의 화면에는 혈액백이 하나뿐이었다. 붉은 액체가 바닥에서 찰랑였다. 그는 화면을 끄고 주머니에 넣었다. 아무 말도 하지 않았다.<\/p>\n<hr class=\"scene\">\n<p>오전 실습실은 이상할 만큼 조용했다. 배기 덕트가 웅웅 울었다. 누군가 핀셋을 트레이에 내려놓는 소리마저 날카로웠다.<\/p>\n<p>\"다들 봤지?\"<\/p>\n<p>재석이 장갑을 끼며 웃었다. 늘 그렇듯 다정한 목소리였다.<\/p>\n<p>\"누가 1단위인지.\"<\/p>\n<p>모두의 시선이 한 사람에게 꽂혔다. 병철 오빠는 카데바 발치에서 시트 주름을 펴고 있었다.<\/p>\n<p>\"재석아.\"<\/p>\n<p>\"아니, 형. 오해하지 마. 형 탓이라는 게 아니라.\"<\/p>\n<p>재석이 고개를 갸웃했다. 눈꼬리가 순하게 휘었다.<\/p>\n<p>\"형이 지금 우리 전원 목에 걸린 줄이라는 거지. 그건 사실이잖아.\"<\/p>\n<p>\"무슨 줄? 무슨 얘기야?\"<\/p>\n<p>박선우가 눈을 끔뻑였다. 선별을 모르는 단 한 명. 재석은 망설임 없이 선우의 어깨를 두드렸다.<\/p>\n<p>\"조별 점수 얘기야, 선우야. 땡시 조 평균.\"<\/p>\n<p>거짓말이 물처럼 매끄러웠다. 목덜미에 소름이 돋았다.<\/p>\n<p>\"오빠 단위 그렇게 된 거, 내 탓이야.\"<\/p>\n<p>내가 말했다. 집도의의 제안을 거절한 건 나였다. 벌칙이 병철 오빠에게 떨어진 것도.<\/p>\n<p>\"알아.\"<\/p>\n<p>재석이 나를 보며 웃었다.<\/p>\n<p>\"그러니까 이수 너도 짐이지.\"<\/p>\n<p>\"그만해.\"<\/p>\n<p>무진이었다. 재석은 어깨를 으쓱했다.<\/p>\n<p>\"무진아, 넌 단위도 안 보이잖아. 제일 안전한 데 선 사람이 그러면 안 되지.\"<\/p>\n<p>정적. 누군가의 침 삼키는 소리.<\/p>\n<p>병철 오빠가 장갑을 벗었다. 라텍스가 손목에서 탁, 튕겼다.<\/p>\n<p>\"맞다, 내 짐 맞다. 짐은 짐칸에 실어야제.\"<\/p>\n<p>그는 웃었다. 그리고 실습실을 나갔다. 문이 천천히 닫히며 바람이 포르말린 냄새를 한 번 뒤섞었다.<\/p>\n<p>나는 따라 나가려다 멈췄다. 무진이 내 손목 안쪽을 엄지로 눌렀다. 맥을 짚는 버릇이었다.<\/p>\n<p>\"지금 따라가면 재석이 말이 맞는 게 돼. 둘이 한 묶음이라고.\"<\/p>\n<p>\"그래서 오빠 혼자 두라고?\"<\/p>\n<p>\"한 시간만.\"<\/p>\n<p>그의 손끝이 차가웠다. 나는 손을 빼냈다. 그리고 실습대 건너편의 재석을 봤다. 그는 벌써 아무 일 없었다는 듯 박선우에게 신경 이름을 불러주고 있었다. 정중신경, 척골신경. 다정한 목소리로.<\/p>\n<p>0412의 시트 아래, 회색 손이 조용히 놓여 있었다. 나는 그 손을 보지 않으려고 핀셋 끝만 노려봤다. 오늘따라 포르말린이 눈을 너무 찔렀다.<\/p>\n<hr class=\"scene\">\n<p>점심 무렵, 비상계단에서 그 목소리를 들었다.<\/p>\n<p>\"예, 오병철입니더. …순번이 밀렸다고예?\"<\/p>\n<p>계단참 아래, 병철 오빠의 정수리가 보였다. 그는 벽에 이마를 대고 있었다. 콘크리트 벽에 담배 냄새와 락스 냄새가 배어 있었다.<\/p>\n<p>\"다음 달이면… 아니, 선생님. 우리 엄마 숨 차서 계단을 못 올라갑니더. 지금도.\"<\/p>\n<p>긴 침묵. 통화가 끊기는 짧은 전자음.<\/p>\n<p>그가 휴대폰을 내려다봤다. 화면 불빛이 그의 얼굴을 아래에서 비췄다. 나는 계단을 내려가려다 멈췄다. 그가 혼자 있고 싶어 한다는 게 등에서 보였다.<\/p>\n<p>내가 발소리를 내자 그가 휴대폰을 뒤집었다.<\/p>\n<p>\"어, 이수. 언제 왔노.\"<\/p>\n<p>\"오빠, 무슨 전화예요?\"<\/p>\n<p>\"엄마 수술 날짜 잡는 거. 별거 아이다.\"<\/p>\n<p>그는 웃었다. 나는 그 웃음을 그대로 믿었다. 주머니 속 흑차트 사진들이 손바닥에 들러붙어 있었으니까.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-2 / 20:30]<\/div>\n<p>혜화역 4번 출구 국밥집은 김으로 뿌옜다.<\/p>\n<p>뚝배기 안에서 순댓국이 끓었다. 들깻가루 냄새, 새우젓의 짠내. 옆 테이블 학생들이 시험 범위를 두고 깔깔 웃었다. 그들의 세상에는 땡시가 그냥 시험이었다.<\/p>\n<p>나는 휴대폰을 테이블에 눕혀 놓고 사진을 하나씩 넘겼다. 대부분 흔들렸다. 책등의 연도만 겨우 읽혔다. 1985. 1991. 2013.<\/p>\n<p>한 장은 펼쳐진 면이 반쯤 잡혀 있었다. 이름 옆에 붙은 짧은 단어들. <span class=\"sys\">처치 — 추락.<\/span> <span class=\"sys\">처치 — 극단적 선택 처리.<\/span> <span class=\"sys\">유족 대응 — 완료.<\/span> 처방전을 쓰듯 건조한 글씨였다. 사람 하나가 지워지는 데 단어 세 개면 충분했다.<\/p>\n<p>나는 그 이름들을 하나씩 입속으로 읽었다. 모르는 이름들이었다. 그런데 하나같이, 누군가의 오빠이거나 아들이었을 것이다.<\/p>\n<p>\"이수야, 문제 하나 내까.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"세상에서 제일 가난한 왕이 누군지 아나.\"<\/p>\n<p>\"몰라.\"<\/p>\n<p>\"최저임금.\"<\/p>\n<p>나는 사진을 확대하며 웃었다. 그도 웃었다.<\/p>\n<p>반 박자 늦게.<\/p>\n<p>자기 농담에 자기가 늦게 웃는 사람이 아니었는데. 나는 그걸 알아채지 못했다. 엄지와 검지로 화면을 벌리는 데 정신이 팔려 있었다.<\/p>\n<p>\"우리 엄마 판막이 새가꼬, 청진기 대면 쉭쉭 소리가 난다.\"<\/p>\n<p>그가 깍두기를 집었다가 내려놓았다.<\/p>\n<p>\
