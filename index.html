<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>지하서가 — 캠퍼스 스릴러 웹소설</title>
<meta name="description" content="서울대 로스쿨·의대, 지하 마법학교. 비밀결사와 생존 게임이 걸린 캠퍼스 스릴러 웹소설 3편, 각 20화.">
<meta name="theme-color" content="#F7F4EE">
<meta property="og:type" content="website">
<meta property="og:title" content="지하서가 — 캠퍼스 스릴러 웹소설">
<meta property="og:description" content="제0법정 · 카데바는 학생이었다 · 이름 없는 신입생. 각 20화 완결.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='6' y='4' width='36' height='40' rx='3' fill='%235B1F1F'/%3E%3Cpath d='M14 14h20M14 22h20M14 30h12' stroke='%23F7F4EE' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F7F4EE; --panel:#FFFDF9; --ctl:#EEE9DF; --ctl-h:#E3DDD0;
  --fg:#2A2723; --head:#1E1B18; --muted:#6F675D; --rule:#E2DBCE; --border:#D3CABA;
  --accent:#8A2E22; --accent-soft:#F1E3DD; --sys-bg:#EFEAE0; --sys-fg:#3B342C;
  --timer:#8A2E22;
  --fs:19px; --lh:1.9; --measure:34em;
  --serif:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"D2Coding","Consolas","SFMono-Regular",ui-monospace,monospace;
  --read:var(--serif);
  color-scheme:light;
}
[data-theme="sepia"]{
  --bg:#F2E8D5; --panel:#F8F0E0; --ctl:#E7DBC2; --ctl-h:#DDCFB2;
  --fg:#2E2618; --head:#241D11; --muted:#6B5D43; --rule:#DCCDAE; --border:#CFBC96;
  --accent:#7F2C1B; --accent-soft:#EBD9C4; --sys-bg:#E9DDC4; --sys-fg:#3A2F1C; --timer:#7F2C1B;
}
[data-theme="dark"]{
  --bg:#191817; --panel:#211F1D; --ctl:#2A2825; --ctl-h:#34312D;
  --fg:#D6D0C6; --head:#E6E0D5; --muted:#9A9389; --rule:#302D29; --border:#3C3834;
  --accent:#E0906E; --accent-soft:#2E211C; --sys-bg:#26231F; --sys-fg:#CFC7BA; --timer:#E0906E;
  color-scheme:dark;
}
[data-theme="night"]{
  --bg:#0C0B0A; --panel:#141312; --ctl:#1B1A18; --ctl-h:#242220;
  --fg:#A9A094; --head:#B9AFA1; --muted:#80786D; --rule:#23201E; --border:#302C28;
  --accent:#C68A67; --accent-soft:#221712; --sys-bg:#171513; --sys-fg:#A39A8D; --timer:#C68A67;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);
  transition:background .25s,color .25s;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}

/* ---------- 서가 ---------- */
.shelf{max-width:1080px;margin:0 auto;padding:56px 20px 80px}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:36px}
.mast h1{font-family:var(--serif);font-size:clamp(30px,5vw,44px);margin:0;color:var(--head);letter-spacing:-.02em}
.mast p{margin:6px 0 0;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rule);
  border-radius:10px;overflow:hidden;text-align:left;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(0,0,0,.35)}
.cover{position:relative;aspect-ratio:16/10;padding:22px 22px 20px;color:#F4EEE4;display:flex;
  flex-direction:column;justify-content:flex-end;overflow:hidden}
.cover::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 7px),
  radial-gradient(120% 90% at 85% 0%,rgba(255,255,255,.16),transparent 60%)}
.cover .no{position:absolute;top:18px;left:22px;font:600 12px/1 var(--mono);letter-spacing:.14em;opacity:.75}
.cover h2{position:relative;font-family:var(--serif);font-size:25px;line-height:1.3;margin:0;word-break:keep-all}
.cover small{position:relative;display:block;margin-top:8px;font-size:13.5px;opacity:.82;word-break:keep-all;line-height:1.5}
.card .body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
.tags{font-size:12.5px;color:var(--muted);letter-spacing:.02em}
.log{font-size:14.5px;line-height:1.7;margin:0;color:var(--fg);word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.meter{height:3px;background:var(--ctl);border-radius:2px;overflow:hidden;margin-top:auto}
.meter i{display:block;height:100%;background:var(--accent)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.foot{margin-top:56px;color:var(--muted);font-size:13px;line-height:1.7;border-top:1px solid var(--rule);padding-top:20px}

/* ---------- 작품 ---------- */
.book{max-width:760px;margin:0 auto;padding:28px 20px 80px}
.crumb{font-size:14px;color:var(--muted);padding:6px 0 18px}
.crumb button{color:var(--muted);padding:6px 0}
.crumb button:hover{color:var(--accent)}
.book .cover{border-radius:10px;aspect-ratio:auto;min-height:240px}
.book .cover h2{font-size:clamp(26px,4.6vw,34px)}
.book .lead{font-family:var(--serif);font-size:16.5px;line-height:1.85;margin:26px 0 10px;word-break:keep-all}
.notice{font-size:12.5px;line-height:1.7;color:var(--muted);border-left:2px solid var(--border);padding:2px 0 2px 12px;margin:16px 0 26px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
.btn{padding:12px 20px;border-radius:8px;background:var(--ctl);font-size:15px;font-weight:600}
.btn:hover{background:var(--ctl-h)}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.primary:hover{filter:brightness(1.08)}
.toc{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.toc li{border-bottom:1px solid var(--rule)}
.toc button{display:flex;width:100%;align-items:baseline;gap:14px;padding:15px 4px;text-align:left}
.toc button:hover{background:var(--ctl)}
.toc .n{font:600 13px var(--mono);color:var(--muted);min-width:3.2em}
.toc .t{flex:1;font-family:var(--serif);font-size:16.5px}
.toc .c{font-size:12px;color:var(--muted)}
.toc .read .t{color:var(--muted)}
.toc .read .n::after{content:" ✓";color:var(--accent)}
.toc .cur{background:var(--accent-soft)}

/* ---------- 리더 ---------- */
.bar{position:fixed;inset:0 0 auto 0;z-index:20;height:52px;display:flex;align-items:center;gap:4px;
  padding:0 8px;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);
  transition:transform .25s}
.bar.off{transform:translateY(-100%)}
.bar .ttl{flex:1;min-width:0;text-align:center;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;font-size:17px}
.ib:hover{background:var(--ctl)}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.prog{position:fixed;left:0;top:0;height:2px;background:var(--accent);z-index:30;width:0;transition:width .1s}
.reader{max-width:calc(var(--measure) + 40px);margin:0 auto;padding:96px 20px 60px}
.chhead{text-align:center;margin:10px 0 52px}
.chhead .k{font:600 12.5px var(--mono);letter-spacing:.2em;color:var(--accent)}
.chhead h2{font-family:var(--serif);font-size:calc(var(--fs) * 1.45);color:var(--head);margin:12px 0 0;line-height:1.4;word-break:keep-all}
.text{font-family:var(--read);font-size:var(--fs);line-height:var(--lh);word-break:keep-all;overflow-wrap:break-word}
.text p{margin:0 0 1.05em}
.text p.em-line{font-weight:700;color:var(--head)}
.text strong{color:var(--head)}
.text .timer{font:600 calc(var(--fs) * .74)/1 var(--mono);letter-spacing:.12em;color:var(--timer);
  display:table;margin:2.2em auto 1.6em;padding:.55em .9em;border:1px solid currentColor;border-radius:3px}
.text .timer:first-child{margin-top:0}
.text .doc{font-family:var(--sans);font-size:calc(var(--fs) * .84);line-height:1.75;background:var(--sys-bg);color:var(--sys-fg);
  border-left:3px solid var(--accent);padding:.8em 1em;margin:0 0 1.2em;border-radius:0 4px 4px 0}
.text .sys{font-family:var(--sans);font-size:.88em;background:var(--sys-bg);color:var(--sys-fg);padding:.1em .35em;border-radius:3px}
.text hr.scene{border:0;margin:2.4em 0;text-align:center;height:1em}
.text hr.scene::after{content:"◆  ◆  ◆";font-size:10px;letter-spacing:.3em;color:var(--muted)}
.endnav{display:flex;gap:12px;margin-top:64px;padding-top:28px;border-top:1px solid var(--rule)}
.endnav button{flex:1;padding:18px 16px;border-radius:10px;background:var(--ctl);text-align:left}
.endnav button:hover{background:var(--ctl-h)}
.endnav button:disabled{opacity:.35;cursor:default}
.endnav .next{text-align:right}
.endnav small{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.endnav b{font-family:var(--serif);font-weight:600;font-size:15px;word-break:keep-all}
.fin{text-align:center;font-family:var(--serif);color:var(--muted);margin:56px 0 0;font-size:15px}

/* 서랍 · 설정 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(380px,88vw);background:var(--panel);z-index:50;
  transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;border-left:1px solid var(--rule)}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 14px 20px;border-bottom:1px solid var(--rule)}
.drawer header b{font-family:var(--serif);font-size:16px}
.drawer .scroll{overflow:auto;flex:1}
.drawer .toc{border-top:0}
.drawer .toc button{padding:13px 20px}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(520px,100%);z-index:50;
  background:var(--panel);border:1px solid var(--rule);border-bottom:0;border-radius:14px 14px 0 0;
  padding:18px 20px calc(22px + env(safe-area-inset-bottom));transition:transform .25s}
.sheet.on{transform:translate(-50%,0)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.row>span{font-size:14px;color:var(--muted);min-width:4em}
.seg{display:flex;gap:6px;flex:1;justify-content:flex-end}
.seg button{flex:1;max-width:84px;padding:10px 6px;border-radius:8px;background:var(--ctl);font-size:13.5px;border:1px solid transparent}
.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.sw{width:22px;height:22px;border-radius:50%;display:inline-block;vertical-align:middle;border:1px solid var(--border)}
.val{min-width:3em;text-align:center;font:600 14px var(--mono)}

@media (max-width:560px){
  .shelf{padding-top:36px}
  .mast{flex-direction:column;align-items:flex-start}
  .reader{padding-top:84px}
  .endnav{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- 서가 -->
<main id="shelf" class="shelf hidden">
  <div class="mast">
    <div>
      <h1>지하서가</h1>
      <p>캠퍼스 지하에서 열리는 생존 게임 · 3편 · 각 20화 완결</p>
    </div>
    <button class="btn" data-act="settings">Aa 보기 설정</button>
  </div>
  <div id="grid" class="grid"></div>
  <p class="foot">모든 작품의 조직·사건·인물은 허구이며 실존 인물·기관과 무관합니다. 실제 지명·기관명은 배경으로만 차용했습니다.<br>
  읽은 위치는 이 브라우저에만 저장됩니다. 단축키 ← → 이전/다음 화 · T 목차 · Esc 닫기</p>
</main>

<!-- 작품 -->
<main id="book" class="book hidden"></main>

<!-- 리더 -->
<div id="readerWrap" class="hidden">
  <div class="prog" id="prog"></div>
  <nav class="bar" id="bar">
    <button class="ib" data-act="up" aria-label="작품으로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl" id="barTitle"></div>
    <button class="ib" data-act="settings" aria-label="보기 설정" style="font-family:var(--serif);font-weight:700">Aa</button>
    <button class="ib" data-act="toc" aria-label="목차"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  </nav>
  <article class="reader" id="reader"></article>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="목차">
  <header><b id="drawerTitle"></b><button class="ib" data-act="close" aria-label="닫기">✕</button></header>
  <div class="scroll"><ul class="toc" id="drawerToc"></ul></div>
</aside>
<section class="sheet" id="sheet" aria-label="보기 설정">
  <div class="row"><span>배경</span><div class="seg" id="segTheme">
    <button data-v="light"><i class="sw" style="background:#F7F4EE"></i></button>
    <button data-v="sepia"><i class="sw" style="background:#F2E8D5"></i></button>
    <button data-v="dark"><i class="sw" style="background:#191817"></i></button>
    <button data-v="night"><i class="sw" style="background:#0C0B0A"></i></button>
  </div></div>
  <div class="row"><span>글꼴</span><div class="seg" id="segFont">
    <button data-v="serif" style="font-family:var(--serif)">명조</button>
    <button data-v="sans">고딕</button>
  </div></div>
  <div class="row"><span>크기</span><div class="seg">
    <button data-act="fs-">가−</button><b class="val" id="fsVal"></b><button data-act="fs+">가+</button>
  </div></div>
  <div class="row"><span>줄간격</span><div class="seg" id="segLh">
    <button data-v="1.7">좁게</button><button data-v="1.9">보통</button><button data-v="2.15">넓게</button>
  </div></div>
</section>

<script>
const BOOKS = [{"slug":"courtroom-zero","color":"#5B1F1F","title":"서울대 로스쿨 제0법정","subtitle":"사형수의 딸은 유죄를 선고한다","genre":"리걸 캠퍼스 스릴러 / 서바이벌 / 비밀결사 / 금지된 로맨스","logline":"15년 전 '관악 일가족 살인'으로 사형이 확정된 아버지의 집행일이 21일 뒤로 잡힌 날, 이름을 바꾸고 서울대 로스쿨에 숨어든 정진서가 법조 비밀결사 판관회(判官會)의 지하 법정 게임 '공판'에 소환되어, 서로의 비밀을 증거로 기소하는 동기들 사이에서 끝까지 살아남아 '청원권'을 얻지 못하면 — 아버지는 교수대에 서고, 자신은 사형수의 딸로 세상에 공개된다.","notice":"서울대학교 법학전문대학원(관악캠퍼스)과 서울구치소·서울중앙지검 등 실제 지명·기관은 배경으로만 차용한다. 판관회·공판(게임)·법무법인 한결 등 모든 조직·사건·인물은 허구이며, 실존 인물·기관과 무관하다. 형사소송법 조문(제428조 재심청구와 집행정지, 제463·466조 사형 집행 명령)은 실제 규정을 근거로 하되, 극적 상황은 허구다.","chapters":[{"title":"주문(主文)","html":"<div class=\"timer\">[D-21 / 09:00]<\/div>\n<p>\"정진서 학생.\"<\/p>\n<p>출석부는 펼쳐져 있지도 않았다. 조윤강 교수는 강단 끝에 서서, 백오십 명 사이에서 정확히 나를 보고 있었다.<\/p>\n<p>\"무죄추정의 원칙이 깨지는 순간은 언제입니까?\"<\/p>\n<p>강의실의 공기가 한쪽으로 쏠렸다. 의자 삐걱이는 소리, 노트북 자판 위에서 멈춘 손가락들. 에어컨 바람이 목덜미의 땀을 식혔다.<\/p>\n<p>나는 일어섰다. 답은 알았다. 형사소송법 제275조의2. 피고인은 유죄의 판결이 확정될 때까지는 무죄로 추정된다.<\/p>\n<p>입을 열었다.<\/p>\n<p>\"그, 그건—\"<\/p>\n<p>첫 음절이 목에 걸렸다. 혀뿌리에 쇠붙이를 문 것처럼.<\/p>\n<hr class=\"scene\">\n<p>\"천천히 하세요.\"<\/p>\n<p>조윤강 교수가 웃었다. 전 대법관, 서울대 로스쿨 석좌교수. 백발을 단정히 넘긴 그는 TV 시사 프로그램에서 늘 '사법부의 양심'이라는 자막과 함께 나왔다. 목소리가 낮고 부드러웠다.<\/p>\n<p>\"법정은 원래, 말이 끝날 때까지 기다려주는 곳입니다.\"<\/p>\n<p>뒷줄 어딘가에서 킥킥거리는 소리가 났다. 나는 책상 모서리를 쥐었다.<\/p>\n<p>\"판결이, 화, 확정될 때까지는….\"<\/p>\n<p>\"그렇죠. 그럼 확정된 다음엔요?\"<\/p>\n<p>\"…무죄추정은 끝납니다.\"<\/p>\n<p>\"정답입니다. 확정되면, 그 사람은 진짜 범인이 되는 겁니다. 진실과 상관없이.\"<\/p>\n<p>그가 고개를 끄덕이고 다음 학생에게 시선을 옮겼다. 나는 의자에 주저앉았다. 엄지손톱이 검지 옆 큐티클을 파고들고 있었다. 살갗이 벗겨지는 따끔한 감각. 내려다보니 피가 한 방울 맺혀 있었다.<\/p>\n<p>옆자리에서 손 하나가 슬그머니 넘어왔다. 레몬맛 사탕.<\/p>\n<p>\"[속보] 1L 정모 씨, 콜드콜에 장렬히 전사.\"<\/p>\n<p>오달래가 입 모양으로 속삭였다. 전직 일간지 사회부 기자, 고시원 내 옆방 이웃. 그녀는 무슨 상황이든 기사 헤드라인으로 요약하는 버릇이 있었다.<\/p>\n<p>나는 사탕을 쥐고 웃는 척했다. 손바닥에 끈적한 비닐이 달라붙었다.<\/p>\n<p>그때 강의실 전체에서 휴대폰이 동시에 떨었다.<\/p>\n<p>진동이 책상을 타고 팔꿈치로 올라왔다. 백오십 개의 화면이 일제히 켜졌다. 속보 알림.<\/p>\n<div class=\"doc\">[단독] 법무부, 사형 집행 재개 검토… 1차 대상자 명단 입수<\/div>\n<p>손가락이 저절로 기사를 눌렀다.<\/p>\n<p>명단은 이니셜로 되어 있었다. 김모(61), 박모(54), 그리고 세 번째 줄.<\/p>\n<div class=\"doc\">유모(58) — 2011년 관악 일가족 살인<\/div>\n<p>귀에서 물소리가 났다. 강의실의 소음이 수조 너머로 멀어졌다.<\/p>\n<p>\"마침 좋은 교재가 생겼군요.\"<\/p>\n<p>조윤강 교수의 목소리가 그 물소리를 뚫고 들어왔다. 그는 강단의 스크린에 기사를 띄우고 있었다.<\/p>\n<p>\"2011고합1129. 관악 일가족 살인 사건. 제가 검사 시절 기소한 사건입니다. 피고인은 끝까지 무죄를 주장했죠. 하지만 판결은 확정됐습니다.\"<\/p>\n<p>그가 다시 나를 봤다. 아주 잠깐. 아니면 그렇게 느꼈을 뿐인지도 몰랐다.<\/p>\n<p>\"확정된 판결 앞에서, 피고인의 말은 더 이상 아무 의미가 없습니다. 이게 법의 무게입니다.\"<\/p>\n<p>나는 고개를 숙였다. 큐티클의 피가 손톱 끝까지 번졌다.<\/p>\n<p>유모. 58세.<\/p>\n<p>우리 아빠였다.<\/p>\n<hr class=\"scene\">\n<p>강의가 끝나고 사람들이 빠져나갈 때, 나는 일부러 가장 늦게 일어났다.<\/p>\n<p>강의실 맨 뒷줄. 아무도 없어야 할 자리에 한 사람이 남아 있었다.<\/p>\n<p>백시헌. 법무법인 한결 대표의 아들. 1학기 내내 학점 1등, 말수가 적고, 동기들 사이에서 \"얼음\"이라 불리는 남자. 그는 노트북을 닫지도 않은 채 나를 보고 있었다. 정확히는, 내 손가락을.<\/p>\n<p>피 맺힌 큐티클을.<\/p>\n<p>\"뭐.\"<\/p>\n<p>내가 먼저 말했다. 더듬지 않았다. 화가 나면 오히려 말이 매끄러워졌다.<\/p>\n<p>\"아니.\"<\/p>\n<p>그가 노트북을 덮었다. 일어서서 내 옆을 지나쳤다. 셔츠에서 서늘한 섬유유연제 냄새가 났다. 강의실 문 앞에서 그가 멈췄다.<\/p>\n<p>\"정답은 맞았어. 근데 틀렸어.\"<\/p>\n<p>\"…뭐가.\"<\/p>\n<p>\"무죄추정은 판결 확정으로 끝나는 게 아니야. 사람들이 믿기를 멈출 때 끝나지.\"<\/p>\n<p>그가 나갔다. 문이 천천히 닫히며 경첩이 끼익 울었다.<\/p>\n<p>복도에서 달래가 기다리고 있었다. 자판기 커피 두 잔을 들고.<\/p>\n<p>\"야, 너 얼굴 하얘. 아까 그 사형 기사 때문이야? 그런 거 원래 기자들이 반쯤 흘려본 거야. 진짜 집행은 무슨.\"<\/p>\n<p>\"아, 아니. 그냥… 콜드콜 때문에.\"<\/p>\n<p>엄지손톱이 다시 큐티클을 긁었다. 달래의 시선이 내 손가락에 잠깐 머물렀다가 떨어졌다. 그녀는 아무것도 묻지 않고 종이컵을 내 손에 쥐여줬다. 설탕을 두 배로 넣은 믹스커피가 혀끝에서 들척지근하게 녹았다.<\/p>\n<p>\"[기획] 콜드콜 트라우마, 해법은 당분 섭취.\"<\/p>\n<p>나는 웃었다. 이번엔 진짜로. 그게 더 미안했다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-21 / 22:47]<\/div>\n<p>녹두거리 고시원 총무실은 3평이었다. 컵라면 냄새와 오래된 장판 냄새가 뒤섞인 방. 나는 밤 열 시부터 아침 여섯 시까지 그 방에서 CCTV 모니터를 보고 민원을 받으며 월세를 면제받았다.<\/p>\n<p>우편함 정리를 하다 손이 멈췄다.<\/p>\n<p>내 이름 앞으로 온 등기 봉투. 발신인 칸이 비어 있었다. 대신 봉투 뒷면에 수입인지 한 장이 봉인처럼 붙어 있었다. 법원에 서류 낼 때 붙이는 그 인지.<\/p>\n<p>뜯었다.<\/p>\n<p>A4 세 장. 첫 장 맨 위에 궁서체.<\/p>\n<p class=\"em-line\"><strong>판 결<\/strong><\/p>\n<p class=\"em-line\"><strong>사 건  2026고합0901<\/strong><br><strong>피고인  정진서<\/strong><\/p>\n<p>목구멍이 조여들었다. 손끝이 종이 가장자리를 구겼다.<\/p>\n<p class=\"em-line\"><strong>주 문<\/strong><br><strong>피고인을 공판에 회부한다.<\/strong><\/p>\n<p>장난이다. 동기 누군가의 악질적인 장난. 오늘 콜드콜에서 더듬은 나를 놀리려는.<\/p>\n<p>그런데 이유란이 이상했다. 판결문 형식은 완벽했는데, 인용된 조문들이 엉망이었다. 형법 제3조, 제6조, 제0조. 민법 제2조. 형사소송법 제1조, 제1조, 제2조, 제9조.<\/p>\n<p>제0조 같은 건 세상에 없다.<\/p>\n<p>나는 종이를 내려다봤다. 한 번 본 문서는 잊지 않는 버릇이 이럴 때는 저주였다. 숫자들이 머릿속에서 저절로 줄을 섰다.<\/p>\n<p>3, 6, 0, 2. 1, 1, 2, 9.<\/p>\n<p>360.2. 법학도서관 형사법 서가의 분류번호.<\/p>\n<p>그리고 1129.<\/p>\n<p>2011고합1129. 아빠의 사건번호.<\/p>\n<hr class=\"scene\">\n<p>총무실 간이침대 밑에서 종이상자를 끌어냈다. 테이프가 누렇게 바랜 상자.<\/p>\n<p>편지가 들어 있었다. 183통.<\/p>\n<p>서울구치소 검열 도장이 찍힌 봉투들. 15년 동안 한 달도 빠짐없이 왔다. 보낸 사람 칸의 글씨는 매번 똑같이 단정했다. 유태석.<\/p>\n<p>나는 한 통도 답장하지 않았다. 대부분은 뜯지도 않았다.<\/p>\n<p>열한 살 겨울, 학교 칠판에 누군가 \"살인자 딸\"이라고 썼다. 엄마는 그날 밤 내 성을 바꾸는 서류를 썼다. 우리는 이사했고, 나는 정진서가 되었다. 엄마가 6년 전 병원에서 숨을 거둘 때까지, 우리 집에서 그 이름은 한 번도 불리지 않았다.<\/p>\n<p>맨 위의 편지를 꺼냈다. 지난달 소인.<\/p>\n<div class=\"doc\">진서야. 오늘 운동장에서 하늘을 봤다. 서울 하늘에도 별이 있더라. 잘 안 보일 뿐이지.<\/div>\n<p>편지 끝에는 늘 그렇듯 별자리가 그려져 있었다. 볼펜으로 콕콕 찍은 점들. 어릴 때 관악산 중턱에서 아빠가 손가락으로 하늘을 짚으며 가르쳐주던 그 모양.<\/p>\n<div class=\"doc\">별은 거기 그대로 있다. 안 보일 뿐이다.<\/div>\n<p>종이 위로 무언가 떨어졌다. 잉크가 번졌다. 나는 손등으로 눈을 문질렀다. 먼지 때문이라고 생각하기로 했다. 눈이 따가웠다.<\/p>\n<p>그날 밤이 떠올랐다. 15년 전 9월 15일 새벽, 반지하 우리 집 현관을 두드리던 주먹들. 엄마의 비명. 잠옷 바람으로 수갑을 찬 아빠가 계단을 올라가며 딱 한 번 돌아봤다. 입 모양만으로 무언가를 말했는데, 나는 그게 뭐였는지 아직도 모른다.<\/p>\n<p>그 뒤로 아빠의 얼굴은 뉴스 화면 속 모자이크로만 봤다. 법정 스케치 속 등이 굽은 남자. 피 묻은 점퍼. 현관 손잡이의 지문. 검사가 읽은 공소장 문장들을, 열한 살의 나는 TV 앞에서 전부 외워버렸다. 한 번 본 건 잊지 못하니까.<\/p>\n<p>아빠가 범인이면.<\/p>\n<p>아빠가 범인이 아니면.<\/p>\n<p>어느 쪽이든, 나는 15년 동안 그 사람의 편지를 상자에 처박아 둔 딸이었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-21 / 23:52]<\/div>\n<p>법학도서관 출입 게이트에 학생증을 댔다.<\/p>\n<p>삑. 붉은 불. 출입 불가.<\/p>\n<p>한 번 더. 삑. 이번엔 초록 불이 켜지며 게이트가 열렸다. 그런데 화면에 뜬 이름이 이상했다. 0.5초. 내가 잘못 본 거라고 생각할 만큼 짧은 순간.<\/p>\n<div class=\"doc\">유진서 — 출입 승인<\/div>\n<p>다시 보자 화면은 평소처럼 <span class=\"sys\">정진서<\/span>를 띄우고 있었다. 나는 게이트를 지나며 뒤를 돌아봤다. 로비의 경비 데스크는 비어 있었다. 천장 구석의 CCTV만 붉은 점을 깜빡이고 있었다.<\/p>\n<p>계단을 오르는 내 운동화 소리가 텅 빈 건물에 두 번씩 울렸다. 한 번은 내 발소리, 한 번은 메아리. 메아리라고 생각하기로 했다.<\/p>\n<p>법학도서관 4층 폐가 서고는 자정이 되면 불이 반만 켜졌다.<\/p>\n<p>먼지와 곰팡이와 오래된 종이 냄새. 1970년대 판례집이 빼곡한 철제 서가가 끝없이 이어졌다. 바닥에는 레일이 깔려 있었다. 손잡이를 돌리면 서가가 통째로 움직이는 밀집 서가 — 모빌랙.<\/p>\n<p>360.2. 형사법. 판례집. 1129.<\/p>\n<p>손가락으로 책등을 훑었다. 차가운 금속 선반, 바스러지는 제본 실. 있었다. 하늘색 하드커버, 금박이 다 벗겨진 판례집. 등에 붙은 라벨 <span class=\"sys\">360.2 판 1129<\/span>.<\/p>\n<p>책을 뺐다.<\/p>\n<p>그 뒤에 공간이 있었다. 책 세 권 들어갈 만큼의 어둠. 그 안에 무언가가 접혀 있었다.<\/p>\n<p>검은 천. 꺼내 펼치자 무게가 손목을 끌어내렸다. 법복이었다. 판사들이 입는 그 검은 법복. 깃에는 아무 휘장도 없었다.<\/p>\n<p>법복 아래 봉투 두 개. 수입인지로 봉인된 갈색 봉투. 겉면에 붓글씨.<\/p>\n<div class=\"doc\">갑 제7호증<br>갑 제11호증<\/div>\n<p>그 순간 주머니 속 휴대폰이 떨었다.<\/p>\n<p>화면이 저절로 켜졌다. 나는 아무것도 누르지 않았다. 검은 화면 위로 앱 하나가 설치되고 있었다. 아이콘은 검은 바탕에 흰 저울. 이름은 두 글자.<\/p>\n<div class=\"doc\">판례집<\/div>\n<p>서가 저편에서 형광등이 찌르르 울었다. 등 뒤로 차가운 바람이 지나갔다. 아무도 없는 서고에서, 어딘가 레일이 아주 미세하게 삐걱였다.<\/p>\n<p>화면에 글자가 한 줄씩 떠올랐다.<\/p>\n<div class=\"doc\">제62기 공판(公判)에 소환되셨습니다.<\/div>\n<div class=\"doc\">당사자 정진서. 귀하는 갑호증 2건을 보관하게 됩니다.<\/div>\n<div class=\"doc\">9월 2일 00:00, 제0법정.<\/div>\n<p>그리고 한 줄이 더 올라왔다. 누군가 천천히 타이핑하듯이.<\/p>\n<div class=\"doc\">귀하의 갑호증은 이미 두 사람이 보관 중입니다.<\/div>\n<div class=\"doc\">— 사건명: 유진서.<\/div>\n<p>휴대폰을 쥔 손이 떨렸다. 법복이 바닥으로 미끄러졌다.<\/p>\n<p>15년 동안 아무도 부르지 않은, 내 이름이었다.<\/p>","chars":4700},{"title":"제0법정","html":"<div class=\"timer\">[D-20 / 00:00]<\/div>\n<p>쿵.<\/p>\n<p>서고 맨 끝에서 무언가 맞물리는 소리가 났다. 이어서 낮은 모터음. 바닥의 레일이 발바닥 밑에서 웅웅 떨었다.<\/p>\n<p>아무도 손잡이를 돌리지 않았는데, 맨 끝의 모빌랙 두 개가 양쪽으로 천천히 갈라지고 있었다.<\/p>\n<p>벌어진 틈 사이로 철문이 보였다. 녹슨 쇠, 손잡이 대신 박힌 둥근 고리. 문 아래 틈새로 찬바람이 새어 나와 발목을 핥았다. 지하실 특유의 젖은 시멘트 냄새.<\/p>\n<p>그리고 그 아래 어딘가에서, 종이 울렸다.<\/p>\n<p>땡. 땡. 땡.<\/p>\n<p>학교 종이 아니었다. 낡은 놋쇠가 제 무게에 못 이겨 우는 소리. 나는 바닥에 떨어진 법복을 주워 들었다. 손이 저절로 소매를 찾아 들어갔다.<\/p>\n<p>입지 않으면 무슨 일이 생기는지, 아직 몰랐다. 그래서 입었다.<\/p>\n<hr class=\"scene\">\n<p>계단은 스물세 칸이었다. 세면서 내려갔다. 세지 않으면 다리가 멈출 것 같았다.<\/p>\n<p>마지막 칸에서 공기가 바뀌었다. 에어컨 바람과는 다른 냉기. 오래 닫혀 있던 방의, 피부 속까지 스미는 추위였다.<\/p>\n<p>법정이었다.<\/p>\n<p>목재 법대는 칠이 벗겨져 있었고, 그 위 벽에 걸린 법원 휘장은 누군가 끌로 긁어낸 듯 형체만 남아 있었다. 검사석, 변호인석, 증인석. 그리고 한가운데, 쇠 난간으로 둘러싸인 피고인석.<\/p>\n<p>방청석이 있어야 할 자리는 통째로 검은 유리였다.<\/p>\n<p>그 유리 너머에서 푸른 불빛 몇 개가 점처럼 떠 있었다. 태블릿 화면. 얼굴은 보이지 않았다. 불빛이 가끔 움직였다. 누군가 고개를 돌리는 것처럼.<\/p>\n<p>보고 있었다.<\/p>\n<p>법정 안에는 이미 사람들이 서 있었다. 모두 나와 같은 검은 법복. 나는 얼굴을 셌다. 열하나. 나까지 열둘.<\/p>\n<p>서이안이 있었다. 전 대법원장의 손녀, 1학기 내내 강의실 맨 앞줄에 은색 저울 브로치를 달고 앉던 애. 최민규가 있었다. 학식당에서 늘 혼자 밥을 먹던, 지방 국립대 출신 장학생. 권태오, 차세라, 남궁윤, 도경민, 피정훈, 안소율, 문재하. 이름은 알지만 말은 섞어본 적 없는 동기들. 다들 법복 소매 속에서 손을 꼼지락거렸다. 누군가의 법복에서 담배 냄새가, 누군가의 것에서는 독서실 방향제 냄새가 났다.<\/p>\n<p>그리고 검사석 쪽, 법대에서 가장 가까운 자리에 백시헌.<\/p>\n<p>그는 나를 보지 않았다. 손가락으로 쇠 난간을 톡, 톡, 두드리고 있었다. 일정한 박자로. 시계 초침처럼.<\/p>\n<p>\"이 바닥에 장학생도 오네.\"<\/p>\n<p>서이안이 법복 깃을 손끝으로 털며 말했다. 시선은 내 운동화에 가 있었다. 밑창이 벌어진 운동화.<\/p>\n<p>대답하기 전에, 법대 위의 문이 열렸다.<\/p>\n<hr class=\"scene\">\n<p>재판장이 들어왔다.<\/p>\n<p>법복을 입은 키 큰 실루엣. 얼굴에는 흰 가면이 씌워져 있었다. 눈구멍만 뚫린 매끈한 석고 가면. 그가 법대 의자에 앉자 천장의 종이 한 번 더 울렸다.<\/p>\n<p>\"제62기 공판을 개정합니다.\"<\/p>\n<p>목소리가 이상했다. 기계로 변조된, 높낮이가 없는 목소리. 남자인지 여자인지, 늙었는지 젊었는지 알 수 없었다. 판결문을 읽는 판사처럼 한 글자도 서두르지 않았다.<\/p>\n<p>\"당사자들은 선서하십시오. 양심에 따라 숨김과 보탬이 없이.\"<\/p>\n<p>아무도 움직이지 않았다.<\/p>\n<p>\"선서를 거부하는 당사자는 출석하지 않은 것으로 봅니다.\"<\/p>\n<p>그제야 몇몇이 오른손을 들었다. 나도 들었다. 손바닥이 차가운 공기를 갈랐다.<\/p>\n<p>\"규칙 제1조. 본 법정 안의 모든 자는 당사자다.\"<\/p>\n<p>재판장의 가면이 천천히 열두 명을 훑었다.<\/p>\n<p>\"규칙 제2조. 각 당사자는 다른 당사자 두 명의 갑호증을 보관한다. 귀하의 갑호증 역시 두 명이 보관한다. 기일 전날 23시 59분까지 갑호증을 제출한 자는 검사가 되고, 그 갑호증의 주인은 피고인이 된다.\"<\/p>\n<p>법복 주머니 속 봉투 두 개가 갑자기 무거워졌다. 갑 제7호증. 갑 제11호증. 누군가의 인생.<\/p>\n<p>\"제출이 없을 경우, 재판장이 피고인을 지정한다.\"<\/p>\n<p>\"잠깐만요.\"<\/p>\n<p>권태오였다. 그가 피고인석 난간을 밀치듯 앞으로 나섰다. 손에 작은 검은 물건이 들려 있었다. 녹음기. 빨간 불이 켜져 있었다.<\/p>\n<p>\"지금 이거 다 녹음되고 있거든요. 이거, 불법 감금이에요. 형법 제276조. 강요죄도 되고요.\"<\/p>\n<p>목소리가 떨렸지만 그는 멈추지 않았다.<\/p>\n<p>\"전 안 해요. 나갈 거고, 이거 들고 경찰 갈 거예요.\"<\/p>\n<p>재판장은 대답하지 않았다. 가면의 눈구멍이 권태오를 향한 채 멈춰 있었다. 정적. 흑유리 너머에서 푸른 불빛 하나가 아주 천천히 켜졌다.<\/p>\n<p>\"규칙 제3조.\"<\/p>\n<p>변조된 목소리가 말했다.<\/p>\n<p>\"불출석하거나 공판을 거부한 당사자의 갑호증은 즉시 집행한다.\"<\/p>\n<p>법대 뒤 벽에서 스크린이 내려왔다.<\/p>\n<hr class=\"scene\">\n<p>화면에 케이스북이 떴다. 우리 로스쿨생 전부가 하루에도 수십 번 들여다보는 익명 게시판.<\/p>\n<div class=\"doc\">[실명] 1L 권태오, 2024년 LEET 대리시험 응시 — 시험장 CCTV 캡처 有<\/div>\n<p>게시 시각이 00:07이었다. 지금이었다.<\/p>\n<p>조회수가 숫자를 갈아치웠다. 12, 48, 131. 댓글이 달리기 시작했다. 화면이 옆으로 넘어갔다. 메일 발송 창. 수신: 법학전문대학원 교학과. 제목: 입학 부정행위 제보. 첨부파일 세 개.<\/p>\n<div class=\"doc\">전송 완료<\/div>\n<p>권태오의 손에서 녹음기가 떨어졌다. 플라스틱이 돌바닥에 부딪히는 소리가 이상하게 크게 울렸다.<\/p>\n<p>그때 법정 안의 휴대폰들이 일제히 떨었다. 내 주머니도. 케이스북 알림이었다. <span class=\"sys\">인기글 1위<\/span>.<\/p>\n<p>\"아니, 아니야, 그거, 그거 지워요. 지금 지우라고!\"<\/p>\n<p>권태오가 법대를 향해 달려들었다. 증인석 앞에서 그의 무릎이 꺾였다. 아무도 그를 붙잡지 않았다. 그가 스스로 무너졌다.<\/p>\n<p>\"집행되었습니다.\"<\/p>\n<p>재판장의 목소리는 처음과 똑같았다. 한 음도 올라가지 않았다.<\/p>\n<p>\"형법 제276조를 말씀하셨지요. 그 조문은 국가의 법정에서나 유효합니다. 이곳은 국가의 법정이 아닙니다.\"<\/p>\n<p>권태오는 계단 쪽으로 기어가다시피 나갔다. 흐느끼는 소리가 스물세 칸을 타고 올라가 사라졌다. 바닥에 녹음기만 남았다. 빨간 불은 꺼져 있었다.<\/p>\n<p>나는 피고인석 난간을 쥐고 있었다. 언제 쥐었는지 몰랐다. 손바닥에 쇠의 냉기가 들러붙어 떨어지지 않았다.<\/p>\n<p>입 안에 쓴 침이 고였다.<\/p>\n<hr class=\"scene\">\n<p>\"규칙 제4조.\"<\/p>\n<p>재판장은 아무 일도 없었다는 듯 이어갔다.<\/p>\n<p>\"선고는 방청석의 판관들이 한다. 유죄 시 피고인의 갑호증을 집행한다. 무죄 시 검사의 기소는 무고로 보아 검사는 보관 중인 갑호증 하나를 잃고, 다음 기일의 피고인이 된다. 이를 반소라 한다.\"<\/p>\n<p>흑유리 너머 푸른 불빛들이 하나씩 깜빡였다. 박수 대신.<\/p>\n<p>\"규칙 제5조. 증거는 적법한 절차로 다툰다. 갑호증의 위조와 훼손, 방외인에 대한 누설, 판관 신원의 탐색은 즉시 집행 사유다.\"<\/p>\n<p>누군가 침을 삼키는 소리가 들렸다. 민규였다. 그의 목울대가 크게 움직였다.<\/p>\n<p>\"최종 기일까지 남은 당사자 세 명에게는 법복과 함께 청원권을 수여한다.\"<\/p>\n<p>재판장이 잠깐 말을 멈췄다. 가면이 아주 조금, 내 쪽으로 기울었다. 그렇게 보였다.<\/p>\n<p>\"판관회는 청원 한 건을 반드시 받아들인다. 어떤 판결도, 한 번은 뒤집힌다.\"<\/p>\n<p>어떤 판결도.<\/p>\n<p>난간을 쥔 손가락 마디가 하얗게 질렸다. 나는 그 단어를 입속으로 굴렸다. 청원권. 혀 밑에서 금속 맛이 났다.<\/p>\n<p>2011고합1129. 확정된 판결. 9월 22일 10시.<\/p>\n<p>아빠.<\/p>\n<hr class=\"scene\">\n<p>폐정 선언과 함께 종이 울렸다. 사람들이 서로를 피해 흩어지기 시작했다. 아무도 옆 사람의 얼굴을 보지 않았다. 다들 알고 있었다. 이 안의 누군가가 내 봉투를 쥐고 있다는 걸.<\/p>\n<p>계단 쪽으로 몸을 돌렸을 때, 한 사람과 눈이 마주쳤다.<\/p>\n<p>달래였다.<\/p>\n<p>검은 법복이 그녀에게 너무 컸다. 소매가 손등을 덮었다. 머리는 고시원에서 라면 끓일 때처럼 볼펜 하나로 대충 틀어 올린 그대로였다. 그녀의 입술이 반쯤 벌어진 채 멈춰 있었다.<\/p>\n<p>\"…진서야?\"<\/p>\n<p>목소리가 갈라져 있었다. 그 속사포 같던 입이, 내 이름 하나에서 막혔다.<\/p>\n<p>\"다, 달래 언니.\"<\/p>\n<p>우리는 서로 여기 있는 줄 몰랐다. 서로 그걸 숨겼다는 것도, 그 순간에야 알았다.<\/p>\n<p>달래가 무언가 말하려다 입을 다물었다. 그녀의 손이 법복 주머니 위로 올라갔다. 꽉 쥐었다. 무언가를 지키는 손.<\/p>\n<p>\"…내일 얘기해. 여기선 아무 말도 하지 마.\"<\/p>\n<p>그녀가 먼저 계단을 올라갔다. 한 번도 뒤돌아보지 않았다.<\/p>\n<p>검사석 쪽에서 톡, 톡, 소리가 멈췄다. 고개를 돌리자 시헌이 나를 보고 있었다. 이번에는 똑바로. 난간을 두드리던 손가락이 허공에서 멈춰 있었다.<\/p>\n<p>그는 아무 말도 하지 않고 등을 돌렸다.<\/p>\n<p>텅 빈 법정에 나만 남았다. 나는 피고인석 난간 앞에 섰다. 쇠 난간은 내 허리 높이였다. 누군가의 손때로 반들반들하게 닳아 있었다. 여기 서서 몇 명이 끝났을까.<\/p>\n<p>열한 살 때 TV로 본 법정 스케치가 떠올랐다. 이런 난간 뒤에 서 있던 등이 굽은 남자. 그 남자가 판결 주문을 듣는 동안 고개를 한 번도 들지 않았다고, 앵커가 말했다. 반성의 기미가 없었다고.<\/p>\n<p>나는 그 말을 믿었다. 15년 동안.<\/p>\n<p>\"서 있지 마.\"<\/p>\n<p>목소리에 어깨가 튀었다. 시헌이 계단 첫 칸에 서 있었다. 나간 줄 알았는데.<\/p>\n<p>\"거기, 서 있는 사람 자리 아니야. 세워지는 사람 자리지.\"<\/p>\n<p>\"그, 그걸 네가 어떻게—\"<\/p>\n<p>말이 걸렸다. 나는 이를 악물었다. 그는 내 말을 자르지 않았다. 계단 난간에 손을 얹은 채, 내가 다음 음절을 뱉을 때까지 가만히 기다렸다. 그 침묵이 이상하게 더 숨 막혔다.<\/p>\n<p>\"…어떻게 아는데.\"<\/p>\n<p>\"다들 처음엔 거기 서보더라.\"<\/p>\n<p>그가 계단을 올라갔다. 구두 굽 소리가 스물세 번 울리다 끊겼다. 나는 그제야 난간에서 손을 뗐다. 손바닥에 쇠 냄새가 배어 있었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-20 / 00:38]<\/div>\n<p>서고로 올라왔을 때, 철문은 이미 닫혀 있었다. 모빌랙도 원래 자리로 돌아가 있었다. 아무 일도 없었던 것처럼.<\/p>\n<p>다른 당사자들의 발소리가 계단 저편으로 멀어졌다. 출입 게이트가 몇 번 삑삑 울리고, 조용해졌다.<\/p>\n<p>나는 남았다.<\/p>\n<p>판례집 1129. 법복을 꺼낼 때 서가 바닥에 내려놨던 그 책. 내려오기 전에 분명 거기 있었다. 그런데 서가의 빈자리에 책이 없었다.<\/p>\n<p>누가 가져갔다면, 이유가 있다.<\/p>\n<p>나는 360.2 서가 사이로 들어갔다. 양옆으로 철제 선반이 천장까지 솟아 있었다. 어깨 넓이를 겨우 넘는 통로. 휴대폰 손전등을 켜고 바닥을 비췄다. 먼지 위에 발자국. 내 운동화 자국과, 그보다 큰 구두 자국 하나.<\/p>\n<p>구두 자국은 통로 안쪽으로 이어져 있었다.<\/p>\n<p>나는 숨을 죽이고 한 걸음 더 들어갔다. 곰팡이 냄새가 짙어졌다. 손끝이 차가운 선반 모서리를 스쳤다.<\/p>\n<p>찌르르.<\/p>\n<p>머리 위 형광등이 울었다.<\/p>\n<p>그리고 꺼졌다.<\/p>\n<p>완전한 어둠. 손전등 불빛만 바닥에 동그랗게 떨렸다. 내 숨소리가 너무 컸다. 귀 안쪽에서 맥박이 북처럼 울렸다.<\/p>\n<p>딸깍.<\/p>\n<p>어딘가에서 스위치가 내려가는 소리.<\/p>\n<p>등 뒤에서 모터가 웅 하고 돌았다.<\/p>\n<p>양옆의 서가가, 나를 향해 움직이기 시작했다.<\/p>","chars":4964},{"title":"모빌랙","html":"<div class=\"timer\">[D-20 / 00:41]<\/div>\n<p>철이 철을 미는 소리가 났다.<\/p>\n<p>왼쪽 서가가 먼저 어깨에 닿았다. 선반 모서리가 쇄골을 긁었다. 위에서 판례집이 쏟아졌다. 하드커버 모서리가 정수리를 때리고, 바스러진 제본 실과 먼지가 눈으로 들어갔다.<\/p>\n<p>휴대폰이 손에서 튕겨 나갔다. 바닥에서 손전등 불빛이 천장을 향해 뒤집혔다.<\/p>\n<p>통로가 좁아졌다. 한 뼘. 반 뼘.<\/p>\n<p>나는 몸을 옆으로 세웠다. 등을 한쪽 선반에, 가슴을 다른 쪽 선반에. 숨을 끝까지 뱉었다. 폐가 납작해지도록. 갈비뼈 위로 쇠의 냉기가 눌러왔다.<\/p>\n<p>비명을 지르고 싶었는데, 숨이 없었다.<\/p>\n<p>선반이 흉골을 밀었다. 뼈가 휘는 소리가 몸 안에서 들렸다. 눈앞이 하얘졌다.<\/p>\n<p>그때, 모터 소리가 뚝 끊겼다.<\/p>\n<p>끼익. 끼익. 끼익.<\/p>\n<p>통로 끝에서 누군가 수동 핸들을 반대로 돌리고 있었다. 한 바퀴마다 서가가 손가락 한 마디씩 물러났다. 나는 무릎이 꺾인 채 바닥으로 미끄러졌다. 공기가 목구멍으로 쏟아져 들어왔다. 쇠 맛이었다.<\/p>\n<p>뒤집힌 손전등 불빛 끝에, 핸들을 쥔 팔이 보였다.<\/p>\n<p>흰 셔츠 소매. 서늘한 섬유유연제 냄새.<\/p>\n<p>백시헌.<\/p>\n<hr class=\"scene\">\n<p>그는 핸들에서 손을 떼지 않았다. 서가가 완전히 벌어질 때까지 돌리고, 또 돌렸다. 그리고 핸들을 붙든 채 이마를 쇠에 댔다.<\/p>\n<p>숨소리가 이상했다.<\/p>\n<p>짧고, 얕고, 빨랐다. 나보다 그가 더 가빴다. 셔츠 등판이 땀으로 젖어 척추 모양이 비쳤다. 핸들을 쥔 손등의 힘줄이 떨리고 있었다.<\/p>\n<p>\"너, 괜찮—\"<\/p>\n<p>\"넌 여기 있으면 안 돼.\"<\/p>\n<p>그가 나를 보지 않고 말했다. 목소리가 거칠었다. 그는 좁은 통로 쪽을 한 번도 쳐다보지 않았다. 마치 거기 들어가면 안 되는 사람처럼.<\/p>\n<p>\"누, 누가 켰어. 모터.\"<\/p>\n<p>나는 선반을 짚고 일어났다. 쇄골이 쓰라렸다. 손끝에 끈적한 것이 묻어났다.<\/p>\n<p>\"방금 스위치 내리는 소리 들었어. 누가 있었어. 구두 자국도—\"<\/p>\n<p>\"판례집에 로그가 남아.\"<\/p>\n<p>그가 그제야 고개를 들었다. 형광등도 없는 어둠 속에서 그의 눈만 젖어 있었다. 땀인지 뭔지.<\/p>\n<p>\"확인해. 네 눈으로.\"<\/p>\n<p>\"너는 왜 여기 있는데.\"<\/p>\n<p>그가 핸들에서 손을 뗐다. 손바닥에 빨갛게 핸들 자국이 패어 있었다. 그는 그 손을 바지에 문질렀다. 몇 번이고. 지워지지 않는 걸 지우려는 사람처럼.<\/p>\n<p>\"지나가다.\"<\/p>\n<p>\"새벽 한 시에, 폐가 서고를.\"<\/p>\n<p>\"응.\"<\/p>\n<p>거짓말이었다. 그는 거짓말을 할 때도 눈을 피하지 않았다. 그게 더 기분 나빴다. 나는 쓰라린 쇄골을 손바닥으로 누르며 그를 노려봤다. 그 사이 그의 숨이 조금씩 길어졌다. 하나, 둘. 그가 속으로 숫자를 세고 있다는 걸, 입술 모양으로 알았다.<\/p>\n<p>\"…고마워.\"<\/p>\n<p>말하고 나서 후회했다. 갚을 수 없는 걸 받았다는 뜻이니까.<\/p>\n<p>\"고마워하지 마.\"<\/p>\n<p>그가 말했다.<\/p>\n<p>\"다음엔 안 와.\"<\/p>\n<p>그리고 그는 가버렸다. 서고 저편으로, 넓은 통로만 골라서. 나는 바닥을 더듬어 휴대폰을 찾았다. 액정에 금이 가 있었다. 금 사이로 판례집 앱의 흰 저울이 갈라져 보였다.<\/p>\n<p>앱 메뉴를 뒤졌다. <span class=\"sys\">기일 공지<\/span>, <span class=\"sys\">보관 목록<\/span>, <span class=\"sys\">투표 현황<\/span>. 그리고 맨 아래 회색 글씨. <span class=\"sys\">서고 출입 로그<\/span>. 눌렀다.<\/p>\n<div class=\"doc\">열람 권한이 없습니다. — 서기 전용<\/div>\n<p>서기. 그런 직위는 재판장이 읽은 규칙 어디에도 없었다.<\/p>\n<p>판례집 1129는 끝내 찾지 못했다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-20 / 06:12]<\/div>\n<p>총무실 모니터 속에서 고시원 복도 CCTV가 회색으로 깜빡였다. 컵라면 국물이 식어 기름이 하얗게 굳어 있었다.<\/p>\n<p>나는 판결서 인터넷 열람 사이트에 접속했다. 사건번호 입력란. 손가락이 자판 위에서 멈췄다.<\/p>\n<p>15년 동안, 한 번도 이걸 누르지 않았다.<\/p>\n<div class=\"doc\">2011고합1129<\/div>\n<p>엔터.<\/p>\n<p>비실명 처리된 판결문이 떴다. 피고인 유○○. 47쪽. 나는 첫 장부터 읽었다. 공소사실, 증거의 요지, 양형의 이유. 문장들이 눈으로 들어와 머릿속 어딘가에 쪽수와 줄 번호를 단 채 차곡차곡 쌓였다. 막을 수 없었다. 늘 그랬다.<\/p>\n<p>현관 손잡이의 지문. 피고인의 점퍼에 묻은 피해자의 혈흔. 피고인은 \"휴대폰을 돌려주러 갔을 뿐\"이라고 진술하나 이를 뒷받침할 자료가 없다.<\/p>\n<p>23쪽, 14번째 줄에서 눈이 멈췄다.<\/p>\n<div class=\"doc\">변호인이 신청한 대리운전 콜 기록은 업체 서버 장애로 제출 불가.<\/div>\n<p>한 줄이었다. 이유도, 재신청도, 아무것도 없이. 그 한 줄 뒤로 판결문은 다시 피 묻은 점퍼 이야기로 돌아갔다.<\/p>\n<p>나는 그 줄을 다시 봤다. 서버 장애. 콜 기록이 있었다면, 아빠가 몇 시에 어디서 다음 손님을 태웠는지 나왔을 것이다.<\/p>\n<p>아빠의 휴대폰은 늘 대시보드 위에 있었다. 콜이 오면 띵동, 하고 울렸다. 어릴 때 조수석에 앉아 그 소리를 따라 하면 아빠가 웃었다. 우리 진서는 콜 받는 소리도 예쁘게 낸다고.<\/p>\n<p>그 띵동 소리가 15년 전 그날 밤 몇 번 울렸는지, 아무도 묻지 않았다.<\/p>\n<p>나는 판결문의 첫 장으로 돌아갔다. 사건, 피고인, 그리고 그 아래 한 줄. <span class=\"sys\">검사 조윤강<\/span>.<\/p>\n<p>어제 아침 강단에서 나를 내려다보던 그 온화한 목소리가, 47쪽짜리 문서 맨 위에 활자로 박혀 있었다. \"천천히 하세요.\" 그 말이 귓속에서 다시 울렸다. 나는 마우스를 쥔 손에 힘을 줬다. 플라스틱이 손바닥 안에서 삐걱였다.<\/p>\n<p>창밖에서 첫 버스가 녹두거리 언덕을 올라가는 소리가 났다. 엔진이 헐떡였다. 나는 화면을 끄지 못하고, 23쪽 14번째 줄을 한 번 더 읽었다. 외우려는 게 아니었다. 이미 외웠으니까. 그냥, 그 한 줄이 아빠가 법정에서 남긴 유일한 목소리 같았다.<\/p>\n<p>목덜미의 솜털이 일어섰다. 모니터 불빛에 손등이 파랗게 질려 보였다.<\/p>\n<hr class=\"scene\">\n<p>침대 밑에서 봉투 두 개를 꺼냈다. 법복은 사물함에 숨겼지만, 이것만은 몸에서 떨어뜨릴 수 없었다.<\/p>\n<p>판례집 앱의 '보관 목록'을 열었다.<\/p>\n<div class=\"doc\">갑 제7호증 — 대상: 최민규 / 열람 가능<\/div>\n<div class=\"doc\">갑 제11호증 — 대상: 비공개 / 봉인 증거 — 공판정 개봉<\/div>\n<p>7호증 봉투를 뒤집었다. 수입인지 아래 연필로 작게, 최민규. 봉인을 뜯으려고 손톱을 밀어 넣었다가, 멈췄다.<\/p>\n<p>학식당 구석에서 혼자 김치를 뒤적이던 민규의 정수리가 떠올랐다. 이걸 열면, 나는 그 사람이 평생 숨긴 걸 알게 된다. 동의 없이.<\/p>\n<p>나는 봉투를 다시 가방에 넣었다. 11호증 봉투는 손바닥 위에서 이상하게 따뜻했다. 뒷면에는 아무 이름도 없었다. 붉은 도장 하나뿐. <span class=\"sys\">봉인<\/span>.<\/p>\n<p>누구 것인지 모르는 인생 하나가 내 가방에 들어 있었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-20 / 12:40]<\/div>\n<p>녹두거리 순댓국집은 점심시간이라 시끄러웠다. 뚝배기 끓는 소리, 들깻가루 냄새, 아저씨들의 소주잔 부딪는 소리. 우리 자리는 늘 그렇듯 가스버너가 놓인 구석 테이블이었다.<\/p>\n<p>달래는 주문만 하고 아무 말도 하지 않았다. 그게 제일 무서웠다. 오달래가 입을 다물고 있다는 것.<\/p>\n<p>고시원에서 여기까지 걸어오는 칠 분 동안에도 그랬다. 그녀는 내 반 걸음 앞에서 걸었고, 횡단보도 앞에서 한 번 내 소매를 잡아당겼다. 신호가 빨간불이었다. 나는 그것도 못 보고 있었다.<\/p>\n<p>순댓국이 나왔다. 김이 둘 사이를 가렸다. 나는 숟가락을 들었다가 내려놨다.<\/p>\n<p>\"언니.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"나….\"<\/p>\n<p>엄지손톱이 검지로 갔다. 큐티클 위에서 멈췄다. 나는 손을 테이블 아래로 내렸다. 무릎 위에서 주먹을 쥐었다.<\/p>\n<p>\"나, 정진서 아니야.\"<\/p>\n<p>달래가 고개를 들었다.<\/p>\n<p>\"유진서야. 사형수 딸.\"<\/p>\n<p>말이 걸리지 않았다. 첫 음절부터 끝까지, 한 번도. 나도 놀랐다. 손톱은 큐티클을 파고들지 않았다. 거짓말이 아니니까.<\/p>\n<p>\"2011년 관악 일가족 살인. 어제 뉴스에 나온 유모, 쉰여덟. 그게 우리 아빠야. 열한 살 때 엄마 성으로 바꿨고, 자소서 가족 사항도 다 거짓말이야. 언니한테도.\"<\/p>\n<p>옆 테이블에서 누군가 크게 웃었다. 국물이 뚝배기 가장자리에서 보글보글 넘쳤다. 달래는 숟가락을 내려놨다. 아주 천천히. 쇠붙이가 테이블에 닿는 소리가 났다.<\/p>\n<p>그녀는 오래 말이 없었다.<\/p>\n<p>나는 기다렸다. 그녀가 일어나 나가는 것. 이사 가는 것. 내 번호를 지우는 것. 열한 살 이후로 늘 그렇게 됐으니까. 다리 밑에서 무릎이 떨렸다. 맞은편으로 들리지 않게 발뒤꿈치로 바닥을 눌렀다.<\/p>\n<p>달래가 깍두기 하나를 집어 먹었다. 오래 씹었다. 그리고 말했다.<\/p>\n<p>\"[단독] 옆방 총무, 알고 보니 인생이 장편소설.\"<\/p>\n<p>웃음이 터졌는지 울음이 터졌는지 몰랐다. 코끝이 뜨거워지고 숨이 끊겼다. 나는 손등으로 입을 막았다. 달래가 휴지를 뽑아 내 쪽으로 밀었다.<\/p>\n<p>\"근데 이년아, 그걸 왜 지금 말해. 1학기 내내 라면 물을 같이 끓였는데. 내가 너 생일에 미역국까지 끓였잖아. 고시원 공용 냄비에다.\"<\/p>\n<p>\"…미안.\"<\/p>\n<p>\"미안하라고 한 말 아니야.\"<\/p>\n<p>그녀가 휴지 한 장을 더 뽑았다. 이번엔 자기 눈가를 눌렀다. 아주 빨리, 아무렇지 않은 척.<\/p>\n<p>\"그러니까 어제, 너도 무서웠겠다.\"<\/p>\n<p>그 한마디에 등이 무너졌다. 15년 동안 아무도 내게 그 말을 하지 않았다. 무서웠겠다고.<\/p>\n<p>사람들은 늘 다른 걸 물었다. 너도 알고 있었냐고. 아빠가 집에서도 무서웠냐고. 피 묻은 옷을 본 적 있냐고. 전학 간 학교의 담임은 내 생활기록부를 넘기다 손을 멈추고, 나를 오래 쳐다봤다. 그 눈빛을 나는 지금도 쪽수까지 기억한다.<\/p>\n<p>\"언니는 안 물어봐?\"<\/p>\n<p>\"뭘.\"<\/p>\n<p>\"아빠가… 진짜 했는지.\"<\/p>\n<p>달래가 순대 하나를 내 뚝배기에 옮겨 담았다. 젓가락 끝이 살짝 떨렸다.<\/p>\n<p>\"기자 5년 하면서 배운 거 하나 있어. 판결문은 기사 아니야. 판결문 믿고 쓴 기사가 제일 많이 틀려.\"<\/p>\n<p>그녀가 국물을 한 숟갈 떠먹고 인상을 썼다. 뜨겁다고. 거짓말이었다. 국은 이미 미지근했다.<\/p>\n<p>\"그리고 너는 네 아빠가 아니잖아. 그건 판결문에 안 나와도 내가 알아.\"<\/p>\n<p>나는 숟가락을 들었다. 국물이 목구멍으로 내려갔다. 어젯밤 종소리를 들은 뒤 처음으로, 밥이 넘어갔다.<\/p>\n<hr class=\"scene\">\n<p>달래가 숟가락을 다시 들었다. 그런데 국을 뜨지 않았다. 숟가락 끝이 뚝배기 위에서 허공을 맴돌았다.<\/p>\n<p>\"진서야.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"나도 할 말 있어. 근데 너처럼 멋있게는 못 해.\"<\/p>\n<p>그녀가 가방을 무릎 위로 끌어올렸다. 지퍼 여는 소리가 길었다. 주위의 소음이 멀어졌다. 버너 위에서 끓는 국물 소리만 귀에 남았다.<\/p>\n<p>달래가 갈색 봉투 하나를 꺼내 테이블에 올렸다. 법원 수입인지로 봉인된, 내 가방 속 것과 똑같은 봉투.<\/p>\n<p>봉인은 뜯기지 않은 채였다.<\/p>\n<p>\"어젯밤에 받았어. 안 열었어. 맹세코. 근데 이름은 봤어.\"<\/p>\n<p>그녀가 봉투를 뒤집어 내 쪽으로 밀었다.<\/p>\n<p>갑 제3호증. 봉투 겉면에 적힌 이름 — 유진서.<\/p>\n<p>\"나도 네 봉투 갖고 있어, 진서야.\"<\/p>","chars":4853},{"title":"갑 제7호증","html":"<div class=\"timer\">[D-20 / 12:58]<\/div>\n<p>달래가 봉투를 집어 들었다.<\/p>\n<p>내가 말릴 새도 없었다. 그녀는 봉투 양 끝을 쥐고 반으로 꺾었다. 종이가 구겨지는 소리. 그리고 테이블 구석, 순댓국 냄비 밑에서 파랗게 타는 가스불 쪽으로 손을 뻗었다.<\/p>\n<p>\"이딴 거 없으면 되잖아. 내가 안 갖고 있으면 아무도—\"<\/p>\n<p>봉투 모서리가 불꽃에 닿았다. 갈색 종이가 검게 말려 들어갔다. 탄 냄새가 들깻가루 냄새를 뚫고 올라왔다.<\/p>\n<p>나는 그녀의 손목을 잡았다.<\/p>\n<p>\"태우면 위조·훼손이야.\"<\/p>\n<p>말이 미끄러지듯 나왔다. 한 음절도 걸리지 않았다. 화가 났으니까.<\/p>\n<p>\"규칙 제5조. 즉시 집행. 언니 봉투도 그 자리에서 열려.\"<\/p>\n<p>달래의 손목이 내 손 안에서 떨었다. 맥박이 손가락 끝으로 뛰어 올라왔다. 나는 그녀의 손을 끌어당겨 봉투를 물수건 위에 눌렀다. 치익. 그을린 모서리에서 연기가 가늘게 피어올랐다.<\/p>\n<p>옆 테이블 아저씨가 힐끔 쳐다보다 다시 소주잔을 들었다.<\/p>\n<p>\"…미친년아, 그럼 어떡해.\"<\/p>\n<p>달래가 속삭였다. 눈가가 빨갰다.<\/p>\n<p>\"갖고 있어. 언니가 갖고 있는 게 제일 안전해.\"<\/p>\n<p>\"나머지 하나는? 두 명이 갖고 있다며.\"<\/p>\n<p>나는 대답하지 못했다. 그을린 봉투 위로 내 이름이 반쯤 검게 지워져 있었다. 유진, 까지만 보였다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-19 / 07:00]<\/div>\n<p>알람보다 판례집이 먼저 울었다.<\/p>\n<div class=\"doc\">[기일 공지] 제1공판 — 9월 4일 00:00, 제0법정.<\/div>\n<div class=\"doc\">갑호증 제출 마감: 9월 3일 23:59.<\/div>\n<div class=\"doc\">제출이 없을 경우 재판장이 피고인을 지정합니다.<\/div>\n<div class=\"doc\">— 지정 예정 당사자: 정진서.<\/div>\n<p>나는 간이침대에 앉은 채 그 줄을 세 번 읽었다. 세 번째에 숨이 막혔다. 피고인이 되면, 누군가 내 봉투를 연다. 유진서. 사형수의 딸. 자기소개서 허위. 그다음은 케이스북, 교학과, 그리고 뉴스. 집행 9월 22일을 앞둔 사형수의 딸이 서울대 로스쿨에.<\/p>\n<p>살려면, 내가 먼저 누군가를 피고인석에 세워야 했다.<\/p>\n<p>가방에서 7호증 봉투를 꺼냈다. 이번에는 망설이지 않았다. 손톱으로 수입인지 가장자리를 들어 올렸다. 풀이 마른 종이가 바스락 갈라졌다.<\/p>\n<p>A4 두 장. 첫 장은 궁서체였다. 판결문처럼.<\/p>\n<div class=\"doc\">갑 제7호증<\/div>\n<div class=\"doc\">당사자  최민규<\/div>\n<div class=\"doc\">1. 2021. 3. 14. 육군 제○○사단 복무 중 후임 일병 강○○ 사망 사건.<\/div>\n<div class=\"doc\">2. 위 당사자는 군사경찰 조사에서, 분대 내 가혹행위 사실을 은폐하는 허위 진술서를 작성하였다.<\/div>\n<div class=\"doc\">3. 첨부 — 진술서 사본 1부.<\/div>\n<p>둘째 장은 흐릿한 복사본이었다. 손글씨 진술서. 글씨가 작고 반듯했다. 지우개로 지운 자국이 두 군데.<\/p>\n<div class=\"doc\">본인은 강○○ 일병에 대한 폭행이나 가혹행위를 목격한 사실이 없습니다. 2021. 3. 16. 진술인 최민규.<\/div>\n<p>서명 끝이 아래로 처져 있었다. 펜을 쥔 손이 떨렸던 것처럼.<\/p>\n<p>1쪽 셋째 줄. 2쪽 둘째 줄. 문장들이 머릿속 서랍에 들어가 잠겼다. 이제 이 종이를 태워도 나는 평생 이 두 문장을 잊지 못한다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-19 / 12:20]<\/div>\n<p>학생식당 구석, 기둥 뒤 2인용 테이블. 민규는 오늘도 거기 있었다.<\/p>\n<p>나는 식판을 들고 대각선 자리에 앉았다. 제육볶음 냄새, 식판 부딪는 소리, 배식대의 김. 그는 나를 보지 않았다. 아무도 보지 않았다. 늘 입는 남색 체크 셔츠의 소매 끝이 보풀로 일어나 있었다.<\/p>\n<p>그는 밥을 빨리 먹었다. 군대에서 배운 속도. 숟가락이 식판을 긁는 소리가 일정했다.<\/p>\n<p>휴대폰이 테이블 위에서 켜졌다. 배경화면 속에서, 꽃무늬 조끼를 입은 중년 여자가 시장 좌판 앞에서 웃고 있었다. 민규가 화면을 엎었다. 메시지를 확인하지도 않고.<\/p>\n<p>나는 젓가락을 쥔 채 그 손을 봤다. 진술서의 처진 서명을 쓴 손.<\/p>\n<p>후임이 죽었다. 그는 봤다. 그리고 못 봤다고 썼다.<\/p>\n<p>그게 죄라면, 나는 그보다 더한 걸 매일 한다. 자기소개서에. 학생증에. 이름에.<\/p>\n<p>민규가 식판을 들고 일어났다. 퇴식구로 가는 길에 내 옆을 지나쳤다. 섬유유연제도 향수도 아닌, 오래 빨지 못한 면 냄새. 그가 아주 작게 고개를 숙였다. 어제 제0법정에서 나를 봤다는 뜻이었다. 그리고 나도, 그를 봤다는 걸 그는 알았다.<\/p>\n<p>나는 제육볶음을 한 점도 먹지 못했다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-19 / 14:00]<\/div>\n<p>법학관 1층 끝, 리걸클리닉 문에 흰 백합 스티커가 붙어 있었다.<\/p>\n<p>문을 열자 진짜 백합 향이 먼저 왔다. 상담 테이블 위 유리 화병에 꽂힌 흰 꽃 다섯 송이. 안쪽 책상들에서는 클리닉 수강생 대여섯 명이 의견서를 쓰고, 복사기 앞에는 서류 뭉치를 든 학생 둘이 줄을 서 있었다.<\/p>\n<p>\"정진서 씨? 재심 상담 신청하셨죠.\"<\/p>\n<p>임소라 변호사가 일어나 손을 내밀었다. 서른 후반, 단정한 단발, 회색 카디건. 손이 따뜻했다. 그녀는 내 손을 놓기 전에 아주 잠깐, 손등을 엄지로 쓸었다. 엄마가 하던 식으로.<\/p>\n<p>\"앉아요. 차부터 마셔요. 얼굴이 하얘.\"<\/p>\n<p>종이컵에 보리차가 담겨 나왔다. 구수한 김이 코끝에 닿았다.<\/p>\n<p>\"아는 사람 사건이라고 하셨죠. 사건번호는요?\"<\/p>\n<p>\"그, 그건….\"<\/p>\n<p>엄지손톱이 검지로 갔다. 큐티클이 쓰라렸다.<\/p>\n<p>\"…아직 말씀드리기 어려워요. 일반론만 여쭤봐도 될까요. 사형이 확정된 사건인데, 집행이 잡히면 재심 청구로 멈출 수 있는지.\"<\/p>\n<p>임소라 변호사는 캐묻지 않았다. 그녀는 볼펜 뚜껑을 닫고 내 눈을 봤다.<\/p>\n<p>\"재심은 집행을 못 멈춰요.\"<\/p>\n<p>목소리가 부드러웠다. 그래서 더 아팠다.<\/p>\n<p>\"형사소송법 제428조. 재심의 청구는 형의 집행을 정지하는 효력이 없다. 단, 관할 검찰청 검사는 재심 청구에 대한 재판이 있을 때까지 집행을 정지할 수 있다.\"<\/p>\n<p>그녀가 내 종이컵을 내 손 쪽으로 밀었다.<\/p>\n<p>\"검사만 멈출 수 있어요. 그러니까 필요한 건 청구서가 아니라, 검사를 움직일 증거예요.\"<\/p>\n<p>나는 보리차를 마셨다. 뜨거운 물이 식도를 타고 내려가는데, 배 속은 차가웠다.<\/p>\n<p>주머니에서 휴대폰이 울렸다. 교학과였다.<\/p>\n<p>\"정진서 학생? 2학기 장학금 서약서에 서명이 빠졌어요. 오늘 다섯 시 마감인데, 지금 2층 교학과로 올 수 있어요?\"<\/p>\n<p>나는 상담 테이블을 내려다봤다. 펼쳐놓은 노트, 판결문 출력본. 그리고 의자 옆에 기대 놓은 가방. 봉투 두 개가 든.<\/p>\n<p>\"다녀와요.\"<\/p>\n<p>임소라 변호사가 웃었다.<\/p>\n<p>\"가방은 두고. 짐 들고 오르락내리락하지 말고. 차 식기 전에 와요.\"<\/p>\n<p>복사기 앞의 학생들, 의견서를 쓰는 학생들. 문은 열려 있었고, 사람들이 계속 드나들었다. 이렇게 사람 많은 방에서 가방 하나를 누가 건드리겠나. 나는 노트를 덮고 일어났다.<\/p>\n<p>교학과 앞에는 줄이 길었다. 서명 하나 하는 데 이십 분이 걸렸다.<\/p>\n<p>돌아왔을 때 가방은 의자 옆 그 자리에 그대로 있었다. 지퍼도 내가 닫아둔 그대로. 보리차는 새로 따라져 있었고, 김이 오르고 있었다.<\/p>\n<p>\"늦었죠. 줄이 길어서요.\"<\/p>\n<p>\"교학과는 원래 그래요.\"<\/p>\n<p>그녀가 웃었다. 백합 향이 진했다.<\/p>\n<p>상담을 마치고 나오는 길, 판례집이 다시 울렸다. 기일 공지가 갱신돼 있었다. 맨 아래, 아침에 없던 한 줄.<\/p>\n<div class=\"doc\">참조 판례: 대법원 2011도1129 — &quot;확정된 판결은 진실을 다시 묻지 않는다.&quot;<\/div>\n<p>복도 한가운데서 걸음이 멈췄다. 형광등 아래, 등줄기를 따라 식은땀이 한 줄 흘러내렸다.<\/p>\n<p>1129.<\/p>\n<p>재판장은 아빠 사건을 알고 있었다. 그리고 내가 그걸 알아보리라는 것도.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-19 / 20:10]<\/div>\n<p>법학도서관 옥상 문은 고장 난 지 오래였다. 밀면 열렸다.<\/p>\n<p>시헌은 난간에 팔을 걸치고 있었다. 관악산 능선이 검게 누워 있었고, 아래로 캠퍼스 가로등이 줄지어 켜져 있었다. 바람에서 비 오기 전의 흙냄새가 났다.<\/p>\n<p>\"모터, 누가 켰어.\"<\/p>\n<p>인사도 없이 물었다. 그는 돌아보지 않았다.<\/p>\n<p>\"로그 봤어?\"<\/p>\n<p>\"권한이 없대. 서기 전용이래.\"<\/p>\n<p>\"그럼 내가 말해줄게.\"<\/p>\n<p>그가 몸을 돌렸다. 가로등 불빛이 그의 얼굴 반쪽만 비췄다.<\/p>\n<p>\"로그엔 네 이름이 있었어. 00시 41분, 당사자 정진서. 네가 직접 켰다고.\"<\/p>\n<p>웃음이 나왔다. 웃으려던 게 아닌데 입꼬리가 떨리면서 소리가 샜다.<\/p>\n<p>\"그, 그게 무슨—\"<\/p>\n<p>목에 걸렸다. 나는 침을 삼켰다. 다시.<\/p>\n<p>\"내, 내가 날 죽이려고, 내가—\"<\/p>\n<p>시헌은 말을 끊지 않았다. 난간에 등을 기댄 채, 팔짱도 끼지 않고, 그냥 기다렸다. 바람이 그의 셔츠 깃을 흔들었다. 그는 시선을 피하지도, 재촉하지도 않았다. 마치 내 말이 끝날 때까지 몇 시간이고 서 있을 수 있다는 듯이.<\/p>\n<p>나는 숨을 한 번 뱉었다.<\/p>\n<p>\"…내가 켰으면, 내가 왜 그 안에 있었겠어.\"<\/p>\n<p>\"그러니까.\"<\/p>\n<p>그가 짧게 말했다.<\/p>\n<p>\"누가 네 이름으로 켰다는 거지.\"<\/p>\n<p>그는 잠깐 입을 다물었다. 처음이었다. 그가 다음 말을 고르는 걸 본 건. 턱 근육이 한 번 움직였다.<\/p>\n<p>\"…누가 널 여기서 빼내고 싶어 해.\"<\/p>\n<p>그의 시선이 내 쇄골 위 긁힌 자국에 머물렀다가 떨어졌다.<\/p>\n<p>\"나도 그중 하나고.\"<\/p>\n<p>바람이 멎었다. 멀리서 마을버스가 경적을 울렸다. 나는 그를 봤다. 그 말이 협박인지, 경고인지, 아니면 다른 무엇인지 알 수 없었다. 그의 손가락이 난간 위에서 톡, 하고 한 번 두드리다 멈췄다.<\/p>\n<p>\"빼내서, 뭐 하게.\"<\/p>\n<p>그는 대답하지 않았다. 옥상 문이 그의 등 뒤에서 덜컹 닫혔다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-19 / 22:30]<\/div>\n<p>고시원 복도는 늘 그렇듯 어두웠다. 센서등이 한 박자 늦게 켜졌다. 누군가의 방에서 새어 나오는 인강 소리, 복도 끝 공용 주방의 하수구 냄새.<\/p>\n<p>내 방 앞에서 걸음이 멈췄다.<\/p>\n<p>센서등이 꺼졌다. 다시 발을 굴렀다. 켜졌다.<\/p>\n<p>이상했다. 문고리가 아니라, 문 한가운데가.<\/p>\n<p>옆방 문은 닫혀 있었다. 달래는 아직 도서관이었다. 복도 끝에서 누군가의 슬리퍼 소리가 멀어졌다. 나는 숨을 참고 한 걸음 다가갔다. 센서등 아래, 내 그림자가 문 위에 길게 늘어졌다.<\/p>\n<p>내 방문에 내 봉투가 테이프로 붙어 있었다.<\/p>\n<p>봉투가 아니었다. 봉투 속 종이의 복사본이었다. 네 귀퉁이를 테이프로 꼼꼼하게. 맨 위에 궁서체.<\/p>\n<div class=\"doc\">갑 제  호증<\/div>\n<p>번호 칸만 검은 매직으로 지워져 있었다. 그 아래.<\/p>\n<div class=\"doc\">당사자  유진서<\/div>\n<p>내 본명, 아빠의 이름, 사건번호. 자기소개서 가족 사항란의 한 줄 — <span class=\"sys\">부: 사망<\/span>. 내가 직접 쓴 거짓말이 활자로 박혀 있었다. 토너 냄새가 아직 따뜻했다. 방금 뽑은 것이었다.<\/p>\n<p>손끝이 종이에 닿기 직전에 멈췄다. 손이 떨려서 테이프를 떼어낼 수가 없었다.<\/p>\n<p>달래의 봉투는 뜯기지 않았다. 점심때 내가 직접 봤다. 그을린 모서리까지.<\/p>\n<p>그렇다면 이건, 나머지 한 사람이었다.<\/p>\n<p>복사본 위로 빨간 매직이 가로질러 있었다. 굵고, 한 획도 서두르지 않은 글씨.<\/p>\n<p>\"23:59까지 아무도 안 내면, 내가 낸다.\"<\/p>","chars":4872},{"title":"제1공판","html":"<div class=\"timer\">[D-18 / 00:00]<\/div>\n<p>23시 51분, 나는 판례집의 <span class=\"sys\">제출<\/span> 버튼을 눌렀다. 갑 제7호증. 화면이 한 번 깜빡이고, <span class=\"sys\">접수되었습니다<\/span>라는 글자가 떴다. 그게 다였다. 사람 하나를 고발하는 데 엄지 한 번이면 충분했다.<\/p>\n<p>땡.<\/p>\n<p>천장의 종이 울렸다. 놋쇠의 떨림이 정수리에서 발끝까지 내려갔다.<\/p>\n<p>피고인석 쇠 난간 안에 최민규가 서 있었다. 남색 체크 셔츠 위에 법복. 그는 난간을 잡지 않았다. 두 손을 배 앞에 모으고, 군대에서 열중쉬어를 하던 자세로.<\/p>\n<p>나는 검사석에 서 있었다.<\/p>\n<p>법대 위의 가면이 고개를 들었다. 변조된 목소리가 돌벽에 부딪혀 두 겹으로 울렸다.<\/p>\n<p>\"제62기 제1공판을 개정합니다. 검사, 공소사실을 진술하십시오.\"<\/p>\n<hr class=\"scene\">\n<p>일어섰다. 무릎 뒤가 의자에 걸려 의자 다리가 돌바닥을 긁었다. 끼익. 열 명의 시선이 한꺼번에 내 얼굴에 박혔다.<\/p>\n<p>입을 열었다.<\/p>\n<p>\"피, 피고인은—\"<\/p>\n<p>걸렸다.<\/p>\n<p>혀뿌리에 쇠붙이. 목구멍이 닫혔다. 나는 다시 입을 열었다. 소리가 나오지 않았다. 침 삼키는 소리만 법정 전체에 들리는 것 같았다.<\/p>\n<p>법대 뒤 스크린에 그래프가 떠 있었다. 판관 투표 실시간 현황. 푸른 막대와 붉은 막대. 붉은 쪽이 유죄, 푸른 쪽이 무죄. 내가 두 번째로 말을 더듬자, 흑유리 너머의 불빛들이 움직였다. 푸른 막대가 쑥 올라갔다.<\/p>\n<div class=\"doc\">무죄 6 : 유죄 2<\/div>\n<p>누군가 피식 웃었다. 서이안이었다. 그녀의 은색 저울 브로치가 스크린 불빛을 받아 번득였다.<\/p>\n<p>이대로 무죄면 무고. 나는 갑호증 하나를 잃고, 다음 기일 피고인석에 선다. 내 봉투가 열린다.<\/p>\n<p>눈을 감았다.<\/p>\n<p>종이를 떠올렸다. 어제 아침 7시. 간이침대 위에서 뜯은 봉투. 2쪽. 흐릿한 복사본. 지우개 자국 두 군데. 처진 서명.<\/p>\n<p>눈을 떴다. 말은 입이 아니라 기억에서 나왔다.<\/p>\n<p>\"갑 제7호증, 2쪽 둘째 줄.\"<\/p>\n<p>목소리가 걸리지 않았다.<\/p>\n<p>\"'본인은 강○○ 일병에 대한 폭행이나 가혹행위를 목격한 사실이 없습니다. 2021년 3월 16일. 진술인 최민규.' 지우개로 지운 자리가 두 곳 있습니다. 첫째는 '목격한' 앞, 둘째는 '없습니다' 앞. 피고인은 처음에 다른 문장을 썼다가 지웠습니다.\"<\/p>\n<p>법정이 조용해졌다.<\/p>\n<p>\"후임 일병은 진술서 작성 이틀 전에 사망했습니다. 피고인은 같은 분대였습니다. 피고인은 봤습니다. 그리고 못 봤다고 썼습니다.\"<\/p>\n<p>푸른 막대가 멈췄다. 붉은 막대가 조금씩 자라기 시작했다.<\/p>\n<div class=\"doc\">무죄 5 : 유죄 4<\/div>\n<hr class=\"scene\">\n<p>\"그 진술서는 맞아요.\"<\/p>\n<p>민규가 말했다. 처음으로 고개를 들었다. 눈이 벌겠다.<\/p>\n<p>\"맞아요, 제가 썼어요. 근데요.\"<\/p>\n<p>그의 목소리가 갈라졌다. 손끝이 셔츠 소매 보풀을 잡아 뜯고 있었다.<\/p>\n<p>\"저도 맞았어요. 그 분대에서. 강 일병이랑 저랑 같이. 선임이 그 진술서 내용 불러줬어요. 안 쓰면 다음은 너라고. 저도, 저도 피해자였다고요.\"<\/p>\n<p>눈물이 그의 턱 끝에서 떨어졌다. 법복 깃이 젖었다.<\/p>\n<p>\"강 일병 어머니한테 매년 문자 보내요. 답장 한 번도 안 오는데, 그래도 보내요.\"<\/p>\n<p>흑유리 너머가 술렁였다. 불빛들이 서로를 향해 기울었다. 붉은 막대가 멈추고, 푸른 막대가 다시 올라갔다.<\/p>\n<div class=\"doc\">무죄 6 : 유죄 4<\/div>\n<p>손바닥에 땀이 찼다. 검사석 책상 모서리가 미끄러웠다.<\/p>\n<p>뒤집을 문장이 필요했다. 지금.<\/p>\n<p>나는 봉투에서 1쪽을 꺼냈다. 궁서체로 인쇄된 요지. 종이를 들어 올렸다. 시선은 그래프에 박혀 있었다. 푸른 막대가 한 칸 더 오르려 하고 있었다. 입술이 종이 위의 글자를 따라 움직였다. 나는 읽었다.<\/p>\n<p>\"갑 제7호증, 1쪽. '피고인은 후임 일병 강○○에게 직접 가혹행위를 하였다.'\"<\/p>\n<p>민규의 얼굴에서 피가 빠져나갔다.<\/p>\n<p>하얘졌다. 정말로, 종이처럼. 입술까지. 그가 난간을 처음으로 붙잡았다. 손가락 마디가 쇠 위에서 하얗게 질렸다.<\/p>\n<p>\"…그런 적 없어.\"<\/p>\n<p>목소리가 너무 작아서, 처음엔 아무도 듣지 못했다.<\/p>\n<p>\"그런 적 없어. 없어요. 저 그런 적 없어요. 그거 누가 썼어요? 누가—\"<\/p>\n<p>땡.<\/p>\n<p>종이 울렸다. 그래프의 막대가 한꺼번에 뒤집혔다.<\/p>\n<div class=\"doc\">유죄 7 : 무죄 3<\/div>\n<p>\"판결을 선고합니다.\"<\/p>\n<p>재판장이 말했다. 판결문을 읽는 목소리. 쉼표 하나 서두르지 않았다.<\/p>\n<p>\"주문. 피고인 최민규, 유죄. 갑 제7호증을 집행한다.\"<\/p>\n<hr class=\"scene\">\n<p>스크린이 바뀌었다.<\/p>\n<div class=\"doc\">[실명] 1L 최민규, 군 복무 중 후임 가혹행위 가해자… 사망 사건 은폐까지<\/div>\n<p>게시 시각 00:23. 조회수가 미친 듯이 올라갔다. 댓글창이 열렸다. <span class=\"sys\">와 소름<\/span> <span class=\"sys\">이런 새끼가 법조인 되려고<\/span> <span class=\"sys\">피해자 어머니 생각하면<\/span>. 화면이 넘어갔다. PDF 한 장. 고발장. 수신: 국방부 검찰단. 피고발인: 최민규.<\/p>\n<div class=\"doc\">전송 완료<\/div>\n<p>법정 안의 휴대폰이 일제히 떨었다. 내 것도. <span class=\"sys\">인기글 1위<\/span>.<\/p>\n<p>민규는 울지 않았다. 더 이상. 그는 난간을 놓고 천천히 피고인석을 걸어 나왔다. 계단 쪽으로 가다가, 검사석 앞에서 멈췄다.<\/p>\n<p>나를 봤다.<\/p>\n<p>원망이 아니었다. 분노도 아니었다. 학식당에서 아주 작게 고개를 숙이던, 그 눈이었다. 우리가 서로를 봤다는 걸 아는 눈. 그 눈이 지금 묻고 있었다. 왜.<\/p>\n<p>그는 아무 말 없이 계단을 올라갔다. 스물세 번의 발소리. 그리고 끊겼다.<\/p>\n<p>나는 1쪽을 쥔 채 서 있었다. 종이 가장자리가 손바닥 땀에 젖어 울었다.<\/p>\n<p>\"검사 정진서.\"<\/p>\n<p>재판장의 가면이 나를 향했다.<\/p>\n<p>\"첫 기소치고는 훌륭했습니다. 기억력이 좋군요. 법정에서는 그게 언제나 무기가 됩니다.\"<\/p>\n<p>칭찬이었다. 판결문처럼 평평한 목소리의 칭찬. 흑유리 너머에서 푸른 불빛들이 하나씩 깜빡였다. 박수 대신. 나는 그 불빛들이 나를 향해 깜빡인다는 걸 알았다. 손바닥 안에서 종이가 구겨졌다.<\/p>\n<p>\"폐정합니다.\"<\/p>\n<p>사람들이 흩어졌다. 아무도 나를 보지 않았다. 그게 제일 무서웠다. 이틀 전 권태오에게 그랬듯이, 이제 다들 나를 피해 걸었다. 기소할 수 있는 사람. 실제로 기소한 사람.<\/p>\n<p>서이안만 내 옆을 지나가며 멈췄다.<\/p>\n<p>\"생각보다 잘 물어뜯네, 장학생.\"<\/p>\n<p>그녀의 향수에서 비싼 나무 냄새가 났다. 나는 대답하지 못했다. 입 안에 쓴 침이 고여서, 삼키면 무언가 같이 올라올 것 같았다.<\/p>\n<hr class=\"scene\">\n<p>계단 열한 번째 칸에서 무릎이 풀렸다.<\/p>\n<p>나는 벽을 짚고 토했다. 저녁도 먹지 않았는데 무언가 계속 올라왔다. 쓴 위액이 목구멍을 태우고 콧속까지 시큼한 냄새가 찼다. 눈물인지 침인지 모를 것이 턱을 타고 떨어졌다.<\/p>\n<p>등에 손이 닿았다. 둥글게, 천천히, 두드렸다.<\/p>\n<p>\"괜찮아. 다 뱉어. 다 뱉어도 돼.\"<\/p>\n<p>달래였다. 그녀의 손바닥이 내 법복 위를 오르내렸다. 다른 손으로 내 머리카락을 뒤로 모아 쥐었다. 그녀의 손도 떨렸다. 나는 알았다.<\/p>\n<p>\"[속보] 정진서, 첫 기소 후 계단에 저녁 반납.\"<\/p>\n<p>목소리가 젖어 있었다. 웃기려고 한 말인데, 아무도 웃지 않았다.<\/p>\n<p>\"언, 언니, 나 방금—\"<\/p>\n<p>\"알아. 봤어.\"<\/p>\n<p>\"민규 씨가, 그 눈—\"<\/p>\n<p>\"알아.\"<\/p>\n<p>그녀는 그 말만 반복했다. 알아, 알아. 묻지 않았다. 그게 고마워서 다시 속이 뒤집혔다.<\/p>\n<p>위에서 구두 소리가 났다.<\/p>\n<p>고개를 들었다. 계단 꼭대기, 서고로 통하는 철문 앞에 시헌이 서 있었다. 형광등을 등지고 있어 얼굴이 보이지 않았다. 그림자만 계단을 따라 길게 내려와 내 발끝에 닿았다.<\/p>\n<p>\"축하해.\"<\/p>\n<p>목소리가 평평했다.<\/p>\n<p>\"첫 집행.\"<\/p>\n<p>화가 났다. 화가 나면 말이 매끄러워져야 했다. 늘 그랬다. 그런데 입 안에 위액 맛이 가득했고, 목구멍이 쓰라렸고, 민규의 눈이 아직 눈앞에 있었다.<\/p>\n<p>\"다, 닥쳐.\"<\/p>\n<p>걸렸다. 화가 났는데도.<\/p>\n<p>그는 아무 말도 하지 않았다. 내가 더듬을 때 늘 그랬듯이, 기다렸다. 그런데 이번에는 내가 다음 말을 뱉지 못했다. 그가 돌아섰다. 철문이 닫히는 소리가 스물세 칸 아래까지 울려 내려왔다.<\/p>\n<p>달래가 내 등에 이마를 댔다. 우리 둘 다, 한참 동안 일어나지 못했다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-18 / 02:47]<\/div>\n<p>고시원 총무실. 형광등이 깜빡였다. 컵라면 냄새가 찌든 공기 속에서, 나는 간이침대 위에 봉투를 쏟았다.<\/p>\n<p>손을 씻었는데도 손끝에서 시큼한 냄새가 났다.<\/p>\n<p>휴대폰을 엎어두었는데도 진동은 멈추지 않았다. 케이스북 알림. 댓글 812개. 누군가 민규의 학부 졸업사진을 찾아 올렸고, 누군가는 그가 학식당 어느 자리에 앉는지까지 적었다. 기둥 뒤 2인용 테이블. 그 자리를 아는 사람은 나밖에 없는 줄 알았다.<\/p>\n<p>나는 휴대폰 전원을 껐다. 검은 화면에 내 얼굴이 비쳤다. 입가에 마른 위액 자국이 하얗게 남아 있었다.<\/p>\n<p>1쪽을 펼쳤다. 법정에서 쥐고 있던 그 종이. 땀에 젖어 울었던 가장자리가 말라서 오글거렸다.<\/p>\n<div class=\"doc\">갑 제7호증<\/div>\n<div class=\"doc\">당사자  최민규<\/div>\n<div class=\"doc\">1. 2021. 3. 14. 육군 제○○사단 복무 중 후임 일병 강○○ 사망 사건.<\/div>\n<div class=\"doc\">2. 피고인은 후임 일병 강○○에게 직접 가혹행위를 하였다.<\/div>\n<p>나는 둘째 항목을 봤다. 그리고 눈을 감았다.<\/p>\n<p>어제 아침 7시. 간이침대. 수입인지가 바스락 갈라지던 소리. 1쪽 셋째 줄.<\/p>\n<div class=\"doc\">2. 위 당사자는 군사경찰 조사에서, 분대 내 가혹행위 사실을 은폐하는 허위 진술서를 작성하였다.<\/div>\n<p>눈을 떴다.<\/p>\n<div class=\"doc\">2. 피고인은 후임 일병 강○○에게 직접 가혹행위를 하였다.<\/div>\n<p>다시 감았다. 떴다. 기억은 바뀌지 않았다. 종이도 바뀌지 않았다.<\/p>\n<p>한 번 읽은 문서는 잊지 않는다. 쪽수도, 줄도. 나는 평생 그게 저주라고 생각했다.<\/p>\n<p>손끝이 떨렸다. 나는 스탠드를 종이 가까이 끌어당겼다. 같은 궁서체였다. 그런데 '하였다'의 '하' 자, 가로획 끝이 미세하게 둥글었다. 첫 줄의 '갑' 자와 비교했다. 같은 서체인데, 같은 손이 아니었다. 종이도 조금 더 하얬다. 손가락으로 문지르자 표면이 더 매끄러웠다.<\/p>\n<p>그리고 한 단어.<\/p>\n<p>피고인.<\/p>\n<p>원본은 처음부터 끝까지 '당사자'라고 썼다. 판결이 나기 전에는 누구도 피고인이 아니니까. 이 종이를 쓴 사람은, 판결을 이미 알고 있었다.<\/p>\n<p>법정에서 이걸 읽는 동안, 나는 종이를 보고 있지 않았다. 그래프를 보고 있었다. 내 입은 글자를 읽었고, 내 눈은 막대를 읽었다. 그 사이 어딘가에서 문장 하나가 바뀌어 있었다.<\/p>\n<p>봉투는 나를 떠난 적이 없었다. 가방 안에, 늘.<\/p>\n<p>목구멍에 다시 신물이 차올랐다. 나는 두 손으로 입을 막았다. 민규의 하얗게 질린 입술. 그런 적 없어. 그 목소리가 귓속에서 계속 재생됐다. 이번엔 작지 않았다.<\/p>\n<p>그런 적 없어.<\/p>\n<p>내가 법정에서 읽은 그 문장은, 내가 처음 읽은 문장이 아니었다.<\/p>\n<p>나는 위조된 증거로 사람 하나를 끝냈다.<\/p>","chars":4798},{"title":"관악산","html":"<div class=\"timer\">[D-17 / 04:02]<\/div>\n<p>알림음은 한 번이었다.<\/p>\n<p>나는 그 문장을 스물다섯 시간째 보고 있었다. 책상 위에 펼친 갑 제7호증, 형광등 아래 하얗게 뜬 A4 한 장. <span class=\"sys\">2. 피고인은 후임 일병 강○○에게 직접 가혹행위를 하였다.<\/span> 그 위로 휴대폰 화면이 켜졌다.<\/p>\n<div class=\"doc\">케이스북 — 새 글 / 작성자: choi_mk<\/div>\n<div class=\"doc\">다 끝났다. 연주대에서 보자.<\/div>\n<p>사진도 없이 두 줄뿐이었다. 댓글이 실시간으로 붙고 있었다. ㅋㅋ 관종. 군대에서 애 죽여놓고 무슨 연주대. 신고각.<\/p>\n<p>의자가 뒤로 넘어갔다. 운동화를 찾을 시간이 없었다. 현관의 삼선 슬리퍼에 발을 꿰고 계단을 세 칸씩 뛰어 내려갔다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-17 / 04:29]<\/div>\n<p>택시 기사는 공대 쪽 등산로 입구에 세워달라는 내 말에 백미러로 슬리퍼를 봤다. 아무 말도 하지 않았다. 미터기가 넘어가는 소리만 딸깍딸깍 귀를 긁었다.<\/p>\n<p>차에서 내리자마자 119에 걸었다.<\/p>\n<p>\"과, 관악산 연주대요. 사람이 뛰어내리려고 해요.\"<\/p>\n<p>\"구조대 출동합니다. 도착까지 사십 분 정도 걸립니다. 신고자분은 절대 무리하지—\"<\/p>\n<p>끊었다. 사십 분. 민규가 글을 올린 지 벌써 이십칠 분이 지나 있었다.<\/p>\n<p>휴대폰 손전등의 동그란 빛이 젖은 바위 위에서 흔들렸다. 밤새 내린 이슬에 돌이 비누처럼 미끄러웠다. 풀 비린내와 썩은 낙엽 냄새가 목구멍까지 차올랐다. 슬리퍼 바닥이 두 번 미끄러졌고, 두 번 다 무릎이 먼저 바위에 닿았다.<\/p>\n<p>숨이 폐 끝에서 찢어졌다. 귀에서 맥박이 북처럼 울렸다.<\/p>\n<p>이 길을 안다. 아홉 살, 열 살 때. 아빠는 내 손을 잡고 이 능선을 밤에 올랐다. 손전등을 끄면 별이 더 잘 보인다고, 무서우면 아빠 손만 꽉 쥐라고.<\/p>\n<p>나는 지금 아무 손도 잡고 있지 않았다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-17 / 05:08]<\/div>\n<p>연주대 아래 바위 전망대. 철제 난간 너머, 절벽 끝에 사람이 앉아 있었다.<\/p>\n<p>최민규였다. 늘 입던 그 체크 셔츠. 발밑으로는 아무것도 없었다. 아득한 아래에서 서울의 불빛이 주황색 안개처럼 깔려 있었다. 바람이 난간을 울리며 휘파람 소리를 냈다.<\/p>\n<p>\"미, 민규 씨.\"<\/p>\n<p>그의 어깨가 움찔했다. 돌아보지 않았다.<\/p>\n<p>\"검사님이 여기까지 웬일이에요. 집행이 덜 됐어요?\"<\/p>\n<p>\"그, 그 문장.\"<\/p>\n<p>혀뿌리에 쇠붙이가 걸렸다. 나는 난간을 붙잡았다. 차가운 쇠가 땀에 젖은 손바닥에 들러붙었다. 멈추면 안 됐다. 더듬어도, 멈추면 안 됐다.<\/p>\n<p>\"그 문장, 위조야.\"<\/p>\n<p>그제야 민규가 고개를 돌렸다. 손전등 빛에 눈이 붉게 부어 있었다.<\/p>\n<p>\"…뭐라고요.\"<\/p>\n<p>\"내가 처, 처음 읽은 봉투엔 '허위 진술서 작성'이라고 돼 있었어. 직접 가혹행위라는 말은 없었어. 법정에서 읽은 종이는 달라. 글자 획이 달라, 종이도 달라. 내가 증명할게.\"<\/p>\n<p>\"증명해서 뭐 해요.\"<\/p>\n<p>그가 웃었다. 웃음 끝이 갈라졌다.<\/p>\n<p>\"엄마가 봤어요. 어제 아침에. 우리 엄마가, 케이스북 캡처를 카톡으로 받았대요. 동네 아줌마한테서.\"<\/p>\n<p>그가 일어섰다. 무릎을 펴는 그 동작 하나에 절벽 끝의 흙이 부스러져 어둠 속으로 흘렀다.<\/p>\n<p>\"민규 씨, 앉아요. 아, 앉아.\"<\/p>\n<p>\"정진서 씨는 좋겠다. 증명할 게 있어서.\"<\/p>\n<p>그가 한 발을 뒤로 뺐다. 그 발이 허공을 디뎠다.<\/p>\n<p>나는 난간을 넘었다. 생각보다 몸이 먼저 갔다. 그의 손목을 잡은 순간, 팔이 어깨에서 뽑혀 나가는 것 같았다. 사람의 무게가 그렇게 무거운 줄 몰랐다. 배가 바위 모서리에 쓸리며 끌려갔다. 슬리퍼 한 짝이 벗겨져 어둠 속으로 떨어졌다.<\/p>\n<p>떨어지는 소리가 들리지 않았다.<\/p>\n<p>\"노, 놔요! 같이 떨어져!\"<\/p>\n<p>\"싫어.\"<\/p>\n<p>손가락이 미끄러졌다. 그의 손목에 땀이, 내 손바닥에 피가. 가슴이 바위 끝을 넘어가고 있었다.<\/p>\n<p>그때 위에서 손 하나가 내 손목을 낚아챘다.<\/p>\n<p>뼈가 으스러질 만큼 세게. 몸이 뒤로 확 당겨졌다. 셋이 한 덩어리로 바위 위에 엎어졌다. 등에 돌이 박혔다. 누군가의 거친 숨이 귓바퀴에 뜨겁게 닿았다.<\/p>\n<p>백시헌이었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-17 / 05:34]<\/div>\n<p>구조대 헤드랜턴 불빛이 능선을 타고 올라왔다. 은박 담요에 싸인 민규는 들것을 거부하고 제 발로 섰다. 구조대원이 그의 팔을 잡고 계단 쪽으로 이끌었다.<\/p>\n<p>민규가 한 번 돌아봤다. 나를 봤다. 법정 계단에서 나를 보던 그 눈과 같은 눈이었다. 그런데 아주 조금, 다른 눈이었다.<\/p>\n<p>\"증명해요. 진짜로.\"<\/p>\n<p>그 말만 남기고 그는 내려갔다.<\/p>\n<p>나는 바위에 등을 기댄 채 눈을 감았다. 머릿속에서 문서가 펼쳐졌다. 내 기억은 늘 그랬다. 종이를 사진처럼 넘겼다.<\/p>\n<p>9월 3일 아침, 총무실 간이침대. 처음 봉투를 열었다. <span class=\"sys\">위 당사자는 군사경찰 조사에서, 분대 내 가혹행위 사실을 은폐하는 허위 진술서를 작성하였다.<\/span> 궁서체. 누렇고 조금 거친 종이. 처음부터 끝까지 '당사자'였다.<\/p>\n<p>법정에서 낭독한 종이는 달랐다. 같은 궁서체인데 '하였다'의 '하' 자 가로획 끝이 둥글었다. 종이는 더 하얗고 매끄러웠다. 그리고 '피고인'. 판결도 나기 전에 그 단어를 쓴 사람은, 판결을 미리 알고 있었다. 누군가 원본의 서식을 흉내 내 한 장만 다시 뽑아 끼워 넣었다. 그날 밤 내 눈은 종이가 아니라 그래프를 보고 있었다.<\/p>\n<p>그 뒤로 봉투는 한 번도 가방을 떠나지 않았다. 잘 때도 가방을 베고 잤다.<\/p>\n<p>한 번만 빼고.<\/p>\n<p>9월 3일 오후, 리걸클리닉 상담실. 나는 가방을 의자에 두고 자리를 비웠다. 교학과에 서명 하나 받으러 간 20분. 가방은 두고 가라고, 차 식기 전에 오라고 임 변호사님이 웃었다. 돌아왔을 때 보리차는 새로 따라져 김이 오르고 있었다.<\/p>\n<p>그 20분 동안 클리닉에는 학생이 열 명쯤 드나들었다. 복사기 앞에 줄 선 1L들, 공익소송 서류를 나르던 2L 상담원들, 백합 스티커가 붙은 문을 열고 닫던 손들.<\/p>\n<p>열 명. 그중 누군가가 내 가방을 열었다.<\/p>\n<p>\"20분.\"<\/p>\n<p>내가 중얼거리자 옆에서 시헌이 고개를 들었다.<\/p>\n<p>\"뭐가.\"<\/p>\n<p>\"봉투가 내 손을 떠난 시간. 리걸클리닉에서.\"<\/p>\n<p>\"거기 드나드는 사람만 하루에 서른 명이야.\"<\/p>\n<p>\"그날 그 시간엔 열 명이었어.\"<\/p>\n<p>그가 나를 봤다. 아무것도 묻지 않았다. 대신 손가락으로 무릎을 두 번 두드렸다. 법정에서 난간을 두드리던 그 리듬이었다.<\/p>\n<hr class=\"scene\">\n<p>해가 올라왔다.<\/p>\n<p>서울의 불빛이 하나씩 꺼지고, 그 자리에 잿빛 빌딩들이 드러났다. 바위가 미지근하게 데워졌다. 땀이 식은 등이 오싹했다. 입 안에서 흙 맛이 났다.<\/p>\n<p>시헌은 내 옆에 앉아 있었다. 셔츠 단추 두 개가 뜯겨 있었고, 팔꿈치에서 피가 배어 나왔다. 그 섬유유연제 냄새 위에 땀 냄새가 섞여 있었다.<\/p>\n<p>\"왜 왔어.\"<\/p>\n<p>\"케이스북은 나도 봐.\"<\/p>\n<p>\"그거 말고. 왜 왔냐고.\"<\/p>\n<p>그가 산 아래를 봤다. 한참 뒤에 말했다.<\/p>\n<p>\"너 떨어지면, 내가 쓴 집행이 살인이 되니까.\"<\/p>\n<p>내가 쓴 집행. 이상한 문법이었다. 집행은 쓰는 게 아니라 당하는 건데. 나는 그 말을 곱씹다가 그의 손을 봤다.<\/p>\n<p>떨리고 있었다.<\/p>\n<p>무릎 위에 올려둔 그의 양손이, 아주 미세하게. 그는 그걸 감추려고 손을 깍지 꼈다. 깍지 낀 손가락 마디가 하얬다.<\/p>\n<p>\"너는 알았어?\"<\/p>\n<p>\"뭘.\"<\/p>\n<p>\"그 문장이 위조라는 거. 법정에서 내가 읽을 때.\"<\/p>\n<p>그가 깍지를 풀었다가 다시 꼈다. 멀리서 까마귀가 울었다. 바람이 땀에 젖은 머리카락을 이마에 들러붙게 했다.<\/p>\n<p>\"민규가 '그런 적 없어'라고 했을 때.\"<\/p>\n<p>\"그때?\"<\/p>\n<p>\"목소리가 안 떨렸어. 거짓말하는 사람은 그 문장에서 떨어. 넌 그걸 못 봤고.\"<\/p>\n<p>못 본 게 아니었다. 봤는데, 투표 그래프가 유죄 쪽으로 기울고 있었다. 나는 그래프를 봤다. 사람 대신.<\/p>\n<p>입 안의 흙 맛이 쓴 침으로 바뀌었다. 나는 무릎을 끌어안았다.<\/p>\n<p>\"그럼 왜 말 안 했어.\"<\/p>\n<p>\"말했으면 믿었을까.\"<\/p>\n<p>대답할 수 없었다. 그는 그걸 알고 물은 거였다.<\/p>\n<p>\"…시헌아.\"<\/p>\n<p>처음이었다. 그의 이름을 소리 내어 부른 건. 목에 걸리지 않았다. 이상하게, 그 두 음절은 매끄럽게 나왔다.<\/p>\n<p>그는 대답하지 않았다. 대신 바지 주머니에서 손수건을 꺼냈다. 회색 면 손수건. 그가 내 오른손을 잡아 뒤집었다. 손바닥이 바위에 쓸려 벗겨져 있었다. 흙과 피가 뒤엉킨 살갗.<\/p>\n<p>그가 손수건으로 그 위를 감쌌다. 천천히, 매듭을 두 번. 손끝이 내 손목 안쪽 맥박 위를 스쳤다. 그 부분만 뜨거웠다.<\/p>\n<p>\"아프면 말해.\"<\/p>\n<p>\"안 아파.\"<\/p>\n<p>거짓말이었다. 그런데 큐티클을 뜯을 손이 그의 손 안에 있었다.<\/p>\n<p>나는 고개를 돌려 하늘을 봤다. 동쪽은 벌써 하얬지만, 서쪽 끝엔 아직 별 하나가 남아 있었다.<\/p>\n<p>\"어릴 때 아빠가 여기서 별 가르쳐줬어. 밤에 이 능선 올라와서. 북극성부터 찾으라고. 그럼 나머지는 저절로 보인다고.\"<\/p>\n<p>손수건 매듭을 쥔 그의 손가락이 멈췄다.<\/p>\n<p>그를 봤다. 얼굴에서 핏기가 빠져 있었다. 방금 절벽에서 사람 둘을 끌어올린 남자의 얼굴이 아니었다. 무언가를 들킨 사람의 얼굴이었다.<\/p>\n<p>\"…그 얘기.\"<\/p>\n<p>목소리가 낮았다.<\/p>\n<p>\"다른 데서 하지 마.\"<\/p>\n<p>그가 일어섰다. 내 손을 놓았다. 손수건만 내 손에 남았다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-17 / 07:41]<\/div>\n<p>하산길은 올라올 때보다 길었다. 슬리퍼 한 짝은 끝내 찾지 못했다. 맨발 밑으로 자갈이 박혔다. 시헌은 열 걸음쯤 앞에서 걸었고, 한 번도 돌아보지 않았다. 그런데 내가 멈추면 그도 멈췄다.<\/p>\n<p>북극성. 그 단어에서 그의 손가락이 멈췄다. 왜.<\/p>\n<p>그는 내 봉투를 쥔 사람 중 하나다. 내 본명도, 아빠 이름도 안다. 그러니 사형수가 딸에게 별을 가르쳤다는 얘기가 역겨웠을 수도 있다. 살인자에게도 다정한 밤이 있었다는 게.<\/p>\n<p>그런데 그건 역겨움의 얼굴이 아니었다. 나는 그 얼굴을 안다. 열한 살의 내가 거울 속에서 매일 보던 얼굴. 누군가 내 진짜 이름을 부를까 봐 숨을 참는 얼굴이었다.<\/p>\n<p>자갈 하나가 발바닥을 파고들었다. 나는 비명을 삼키고 계속 걸었다.<\/p>\n<p>등산로 입구에서 그는 말없이 택시를 잡아 내게 문을 열어줬다. 그리고 반대 방향으로 걸어갔다.<\/p>\n<p>택시 뒷좌석에서 휴대폰이 떨었다. 달래였다.<\/p>\n<div class=\"doc\">야 너 어디야 새벽에 문 열려있고 슬리퍼 없고 미친년아<\/div>\n<div class=\"doc\">민규 살았대 케이스북 난리남 너지? 너 맞지?<\/div>\n<div class=\"doc\">[속보] 1L 정모 씨, 슬리퍼로 관악산 등반… 학계 &#x27;경악&#x27;<\/div>\n<p>나는 웃다가 눈가를 문질렀다. 손수건에서 흙 냄새가 났다.<\/p>\n<p>메시지가 하나 더 왔다. 사진이었다.<\/p>\n<div class=\"doc\">이거 봐봐. 너 아버지 얘기 듣고 혹시나 해서. 교정직 있는 내 옛날 취재원한테 받았어. 서울구치소 특별접견 신청 목록. 절대 유출 금지라 캡처 한 장만.<\/div>\n<p>손가락으로 화면을 벌렸다. 흐릿한 엑셀 표. 수용자 번호, 이름, 신청인, 사유, 횟수.<\/p>\n<p>한 줄에 눈이 박혔다.<\/p>\n<div class=\"doc\">사형확정수 유태석 — 접견 신청인: 백시헌. 신청 사유: 비공개. 신청 횟수: 15회.<\/div>","chars":4926},{"title":"접견","html":"<div class=\"timer\">[D-16 / 10:00]<\/div>\n<p>열다섯 번.<\/p>\n<p>그 숫자를 손에 쥔 채, 나는 번호표를 뽑았다. 237번. 감열지가 아직 따뜻했다.<\/p>\n<p>어제 아침 택시 뒷좌석에서 그 캡처를 본 직후, 나는 15년 만에 처음으로 법무부 접견 예약 화면에 아빠 이름을 쳤다. 손가락이 자판 위에서 세 번 미끄러졌다. 유. 태. 석. 예약 완료 버튼을 누르는 데 사십 분이 걸렸다.<\/p>\n<p>의왕 서울구치소 민원실은 락스 냄새가 났다. 바닥을 방금 닦은 물기가 운동화 밑창에서 찍찍 울었다. 벽걸이 TV에서는 아침 드라마가 소리 없이 흘렀고, 플라스틱 의자에 앉은 사람들은 아무도 그걸 보지 않았다. 영치금 봉투를 쥔 할머니, 아기를 업은 여자, 정장 차림으로 서류철을 넘기는 변호사.<\/p>\n<p>열다섯 번. 백시헌은 이 의자에 열다섯 번 앉았다.<\/p>\n<div class=\"doc\">237번 고객님, 3번 접견실로 오십시오.<\/div>\n<hr class=\"scene\">\n<p>휴대폰과 가방을 사물함에 넣었다. 금속 탐지기가 내 손목의 손수건 매듭을 지날 때 잠깐 망설이듯 삑 울었다. 교도관이 손수건을 들춰보고, 까진 손바닥을 보고, 아무 말 없이 통과시켰다.<\/p>\n<p>복도는 길었다. 철문이 하나 열리고 닫힐 때마다 등 뒤에서 쇠가 쇠를 무는 소리가 났다. 쿵. 그리고 정적. 다시 쿵.<\/p>\n<p>3번 접견실은 공중전화 부스만 했다. 의자 하나, 두꺼운 유리창 하나. 유리 아래 동그란 금속 송화구. 그리고 천장 구석의 작은 램프.<\/p>\n<p>램프에 빨간 불이 들어왔다. 녹음 중.<\/p>\n<p>벽의 디지털시계가 <span class=\"sys\">10:00<\/span>에서 <span class=\"sys\">09:59<\/span>로 넘어갔다.<\/p>\n<p>유리 건너편 문이 열렸다.<\/p>\n<hr class=\"scene\">\n<p>아빠는 작았다.<\/p>\n<p>내 기억 속 아빠는 관악산 능선에서 나를 목마 태우던 사람이었다. 유리 너머의 남자는 어깨가 안으로 말려 있었다. 머리가 하얗게 셌다. 하늘색 수의의 가슴에 빨간 명찰. 번호는 <span class=\"sys\">4162<\/span>였다. 1129가 아니었다. 그런 숫자 하나에 왜 숨이 막혔는지 모르겠다.<\/p>\n<p>그가 의자에 앉았다. 송화구에 얼굴을 가까이 댔다. 눈가에 주름이 세 겹 접혔다.<\/p>\n<p>\"밥은.\"<\/p>\n<p>그게 첫마디였다. 15년 만의.<\/p>\n<p>목구멍이 막혔다. 혀뿌리가 굳었다. 쇠붙이가 아니었다. 이번엔 돌이었다.<\/p>\n<p>\"머, 먹었어.\"<\/p>\n<p>먹지 않았다. 어제 새벽 이후로 아무것도. 아빠는 고개를 한 번 끄덕였다. 믿는 건지 믿는 척하는 건지, 그 얼굴은 알 수 없었다.<\/p>\n<div class=\"doc\">08:47<\/div>\n<p>시간이 없었다. 나는 유리에 손바닥을 댔다. 차가웠다.<\/p>\n<p>\"아빠. 그날 밤. 대리운전 콜 기록, 왜 없어진 거야.\"<\/p>\n<p>아빠의 눈이 아주 조금 커졌다.<\/p>\n<p>\"판결문 읽었나.\"<\/p>\n<p>\"다 외웠어. 공판조서까지. '서버 장애로 제출 불가.' 그게 말이 돼? 아빠 국선변호인은 그걸 그냥 넘겼어?\"<\/p>\n<p>\"진서야.\"<\/p>\n<p>\"그날 몇 시에 그 집에서 나왔어. 그다음에 어디 갔어. 콜이 있었으면 알리바이가—\"<\/p>\n<p>\"진서야.\"<\/p>\n<p>목소리는 크지 않았다. 그런데 내 말이 거기서 끊겼다. 어릴 때 길을 건너려던 나를 부르던 그 목소리였다.<\/p>\n<p>\"뉴스 봤다. 여기도 TV는 나온다.\"<\/p>\n<p>그가 웃었다. 정말로 웃었다. 이가 하나 빠져 있었다.<\/p>\n<p>\"나는 괜찮다.\"<\/p>\n<p>\"안 괜찮아. 21일, 아니, 이제 16일이야. 내가 막을 거야. 방법이 있어.\"<\/p>\n<p>\"무슨 방법.\"<\/p>\n<p>입을 다물었다. 공판. 판관회. 청원권. 이 방에서는 한 마디도 할 수 없었다. 램프가 빨갛게 나를 보고 있었다.<\/p>\n<p>\"학교는.\"<\/p>\n<p>아빠가 먼저 물었다. 내가 대답하지 못하는 걸 알고, 다른 문을 열어준 거였다.<\/p>\n<p>\"다녀. 법, 법학전문대학원.\"<\/p>\n<p>\"법.\"<\/p>\n<p>그가 그 한 글자를 입 안에서 오래 굴렸다. 기뻐하는 얼굴이 아니었다. 슬퍼하는 얼굴도 아니었다. 무언가를 재는 얼굴이었다.<\/p>\n<p>\"법 하는 사람들, 조심해라. 말 잘하는 사람일수록.\"<\/p>\n<div class=\"doc\">05:30<\/div>\n<p>아빠의 눈이 내 얼굴에서 내 손목으로 내려갔다. 손수건. 회색 면, 매듭 두 번.<\/p>\n<p>얼굴이 굳었다.<\/p>\n<p>\"그 손수건.\"<\/p>\n<p>\"…넘어졌어. 산에서.\"<\/p>\n<p>\"누가 묶어줬나.\"<\/p>\n<p>나는 대답하지 않았다. 아빠가 송화구에 입을 더 가까이 댔다. 숨결에 유리가 하얗게 흐려졌다.<\/p>\n<p>\"진서야. 그 아이 만나지 마라.\"<\/p>\n<p>\"…누구.\"<\/p>\n<p>\"백가 집 아이.\"<\/p>\n<p>심장이 한 번 크게 뛰고 멈췄다. 귀에서 다시 물소리가 났다.<\/p>\n<p>\"아빠가 그 사람을 어떻게 알아.\"<\/p>\n<p>아빠가 입을 열었다. 무언가 말하려고, 숨을 들이켰다.<\/p>\n<p>등 뒤에서 교도관이 벽시계를 봤다. 구두 뒤축이 바닥을 한 번 쳤다.<\/p>\n<div class=\"doc\">01:02<\/div>\n<p>\"일 분 남았습니다.\"<\/p>\n<p>아빠의 입이 닫혔다. 그는 교도관을 한 번 보고, 램프를 한 번 보고, 나를 봤다. 그리고 유리에 대고 길게 숨을 내쉬었다.<\/p>\n<p>하얀 김이 유리 위에 번졌다.<\/p>\n<p>그가 검지를 들어 그 위에 선을 그었다. 아래로, 위로, 아래로, 위로. 점 다섯 개를 잇는 꺾인 선.<\/p>\n<p>W.<\/p>\n<p>카시오페이아. 북극성을 찾으려면 먼저 찾아야 하는 별자리. 관악산 능선에서 그가 내 손가락을 잡고 하늘에 그려주던 그 모양.<\/p>\n<p>\"편지, 다 읽었나.\"<\/p>\n<p>나는 고개를 끄덕였다. 엄지손톱이 검지 큐티클을 파고들었다. 살갗이 벗겨지는 따끔함.<\/p>\n<p>아빠가 내 손을 봤다. 그리고 아주 천천히 웃었다.<\/p>\n<p>\"거짓말할 때 손 뜯는 거. 엄마 닮았다.\"<\/p>\n<div class=\"doc\">00:00<\/div>\n<p>램프가 꺼졌다. 송화구가 먹통이 됐다. 아빠의 입이 계속 움직였는데, 아무 소리도 들리지 않았다. 교도관이 그의 팔을 잡았다. 그는 일어서면서도 유리 위의 W를 손바닥으로 지우지 않았다.<\/p>\n<p>김이 걷히면서 W가 천천히 사라졌다.<\/p>\n<hr class=\"scene\">\n<p>사물함에서 꺼낸 휴대폰이 손안에서 떨었다.<\/p>\n<div class=\"doc\">판례집 — 공지<\/div>\n<div class=\"doc\">제2공판 9월 8일 00:00. 갑호증 제출 마감 9월 7일 23:59.<\/div>\n<div class=\"doc\">미제출 시 재판장이 피고인을 지정한다.<\/div>\n<hr class=\"scene\">\n<div class=\"timer\">[D-16 / 12:20]<\/div>\n<p>서울로 돌아오는 광역버스 맨 뒷자리. 창에 머리를 기대자 엔진의 진동이 관자놀이를 타고 들어왔다. 옷에 아직 그 냄새가 배어 있었다. 락스와 쇠와 오래 닫힌 공기의 냄새. 15년 동안 아빠가 숨 쉰 냄새.<\/p>\n<p>밥은.<\/p>\n<p>그 두 글자가 머릿속에서 계속 재생됐다. 녹음 램프가 꺼진 뒤에도. 내 기억은 문서만 사진처럼 찍는 줄 알았다. 목소리도 찍었다. 낮고, 조금 쉬고, 끝을 내리는 목소리.<\/p>\n<p>열한 살 이후로 그 목소리를 떠올린 적이 없었다. 떠올리지 않으려고 편지를 뜯지 않았다.<\/p>\n<p>그런데 이제 그 목소리가 다른 장면들을 끌고 왔다. 관악산 능선의 밤. 보온병 뚜껑에 따라준 보리차. 손전등을 끈 어둠 속에서 내 검지를 잡아 하늘에 대고 선을 긋던 거친 손가락. \"저기 W 보이지. 거기서 다섯 배만 가면 북극성이다.\" 그 손가락이 오늘 유리 위에 똑같은 선을 그었다.<\/p>\n<p>15년 동안 그 손은 변하지 않았다. 변한 건 나였다.<\/p>\n<p>창밖으로 의왕의 산이 지나갔다. 버스가 덜컹일 때마다 창이 덜덜 울렸다. 그 진동에 맞춰 무언가가 가슴 안쪽에서 무너져 내렸다.<\/p>\n<p>나는 손등으로 입을 막았다. 소리가 새어 나오지 않게. 앞자리의 아저씨가 한 번 돌아봤다가 다시 고개를 돌렸다.<\/p>\n<p>아빠가 범인이면.<\/p>\n<p>그럼 나는 사람 둘을 죽인 남자를 살리려고, 다른 사람의 인생을 끝내고 있는 거다. 위조된 증거로. 절벽까지 몰아서.<\/p>\n<p>아빠가 범인이 아니면.<\/p>\n<p>그럼 나는 15년 동안 억울한 사람의 편지를 상자에 처박아 둔 딸이다. 그리고 그 사람은 16일 뒤에 죽는다.<\/p>\n<p>어느 쪽이든 나는 늦었다.<\/p>\n<p>그리고 백가 집 아이. 아빠는 시헌의 이름조차 말하지 않았다. 그런데 손수건 하나로 그를 알아봤다. 15년 동안 갇혀 있던 사람이, 바깥의 누군가를 그렇게 정확히 알고 있었다. 마치 그 이름이 올 줄 알고 기다려온 사람처럼.<\/p>\n<p>엄지손가락으로 손수건의 매듭을 문질렀다. 흙이 다 털리지 않은 면이 까끌했다. 풀어서 버릴까. 손가락이 매듭에 걸렸다가, 그대로 멈췄다.<\/p>\n<p>휴대폰이 울렸다. 달래였다.<\/p>\n<p>\"야, 너 어디야. 목소리 왜 그래. 울었어? 울었네. [속보] 정모 씨, 광역버스서 오열… 승객들 '휴지 없어 미안'.\"<\/p>\n<p>웃음인지 딸꾹질인지 모를 소리가 나왔다.<\/p>\n<p>\"접견 갔다 왔어.\"<\/p>\n<p>\"…아버지?\"<\/p>\n<p>\"응.\"<\/p>\n<p>달래가 잠깐 말이 없었다. 수화기 너머로 라이터 켜는 소리가 났다가, 다시 꺼졌다. 그녀는 내 앞에서 담배를 끊었다고 했었다.<\/p>\n<p>\"그거 말인데. 백시헌 접견 신청. 내 취재원한테 더 캐봤어.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"열다섯 번, 전부 불허야. 근데 구치소가 막은 게 아니래.\"<\/p>\n<p>창이 덜덜 떨었다. 내 손도.<\/p>\n<p>\"사형확정수 본인이 거부했대. 열다섯 번 다. 네 아버지가.\"<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-16 / 22:51]<\/div>\n<p>오늘 밤 총무 근무는 원장에게 사정해 뺐다. 달래는 그 취재원을 직접 만나러 나갔다. 3층 복도 끝, 내 방. 형광등 하나, 책상 하나, 접이식 침대 하나.<\/p>\n<p>나는 침대 밑에서 상자를 끌어냈다.<\/p>\n<p>183통. 이번엔 맨 아래부터 꺼냈다. 2011년 10월. 첫 편지. 봉투가 누렇게 바래 있었고, 검열 도장이 비뚤게 찍혀 있었다. 칼로 봉투를 갈랐다. 15년 묵은 종이 냄새가 확 올라왔다.<\/p>\n<div class=\"doc\">진서야. 아빠는 잘 있다. 밥 잘 먹어라.<\/div>\n<p>세 줄. 그리고 그림.<\/p>\n<p>볼펜으로 콕콕 찍은 점들. 큰곰자리. 그런데 이상했다. 일곱 개의 점 중 하나만 유독 진했다. 볼펜을 여러 번 눌러 종이 뒷면까지 볼록하게 튀어나와 있었다.<\/p>\n<p>두 번째 편지. 오리온자리. 이번에도 점 하나만 진했다. 세 번째. 백조자리. 하나만.<\/p>\n<p>네 번째, 다섯 번째.<\/p>\n<p>2015년 3월. 엄마가 아프기 전. <span class=\"sys\">진서야. 북극성은 움직이지 않는다. 다른 별들이 그 주위를 돈다. 길을 잃으면 그것부터 찾아라.<\/span> 그 아래 작은곰자리. 이번에도 진한 점은 북극성이 아니었다. 꼬리 쪽에서 두 번째 별.<\/p>\n<p>나는 책상 위 연습장을 끌어왔다. 날짜, 별자리, 진한 별의 위치. 한 줄씩 적었다. 큰곰 셋째. 오리온 왼쪽 어깨. 백조 날개 끝. 연필 끝이 종이를 긁는 소리만 방 안에 사각사각 찼다.<\/p>\n<p>손가락이 빨라졌다. 봉투가 바닥에 쌓였다. 모든 별자리에서, 별 하나만 눌려 있었다. 매번 다른 위치에. 실수가 아니었다. 15년 동안 한 달도 빠짐없이 반복된 실수는 없다.<\/p>\n<p>편지, 다 읽었나.<\/p>\n<p>유리 위의 W가 눈앞에 떠올랐다.<\/p>\n<p>그때 냄새가 났다.<\/p>\n<p>종이 냄새가 아니었다. 매캐하고, 플라스틱이 녹는 것 같은. 목구멍 안쪽이 따끔하게 긁혔다.<\/p>\n<p>고개를 들었다. 문 아래 틈으로 회색 실이 기어들어오고 있었다. 실이 아니었다. 연기였다. 바닥을 타고, 천천히, 그러다 갑자기 한꺼번에.<\/p>\n<p>복도 어딘가에서 화재경보기가 울리지 않았다. 고시원 화재경보기는 늘 울렸다. 라면 물만 끓여도. 오늘은 조용했다.<\/p>\n<p>나는 편지를 쥔 채 문으로 갔다.<\/p>\n<p>문틈으로 연기가 밀려들었다. 손잡이를 잡자 손바닥이 지글거렸다.<\/p>\n<p>밖에서, 누군가 문고리에 쇠사슬을 감는 소리가 들렸다.<\/p>","chars":4861},{"title":"불","html":"<div class=\"timer\">[D-16 / 23:20]<\/div>\n<p>손바닥을 떼자 살갗이 손잡이에 조금 남았다.<\/p>\n<p>쇠사슬이 문고리를 한 바퀴, 두 바퀴 감았다. 쩔그럭. 자물쇠가 채워지는 소리. 그리고 복도를 멀어지는 발소리. 서두르지 않는 발소리였다.<\/p>\n<p>\"누, 누구야! 문 열어!\"<\/p>\n<p>대답 대신 연기가 더 짙게 밀려들었다. 문틈 아래로, 이제는 실이 아니라 회색 물처럼.<\/p>\n<p>나는 돌아섰다. 바닥에 흩어진 편지들. 연습장. 상자. 생각보다 손이 먼저 움직였다. 편지를 쓸어 담아 상자 뚜껑을 닫고, 그걸 가슴에 끌어안았다.<\/p>\n<p>창문은 손바닥 두 개 크기였다. 그 바깥에 녹슨 방범창.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-16 / 23:24]<\/div>\n<p>기침이 터졌다. 눈이 따가워 눈물이 줄줄 흘렀다. 연기에서 플라스틱 타는 냄새와 장판 녹는 냄새가 났다. 혀 위에 쓴 재가 내려앉았다.<\/p>\n<p>생각해. 문서를 읽듯이.<\/p>\n<p>고시원 화재 대피 요령. 1층 게시판에 붙어 있던 A4. 나는 그걸 총무 교육 때 딱 한 번 읽었다. 그래서 전부 기억했다. <span class=\"sys\">1. 젖은 수건으로 코와 입을 막는다. 2. 문틈을 젖은 천으로 막는다. 3. 낮은 자세를 유지한다.<\/span><\/p>\n<p>책상 위 2리터 생수병. 반쯤 남아 있었다. 이불에 전부 부었다. 차가운 물이 손목의 화상 위로 흘러 비명이 새어 나왔다. 젖은 이불을 둘둘 말아 문틈에 쑤셔 넣었다. 연기가 조금 줄었다. 아주 조금.<\/p>\n<p>수건 대신 시헌의 손수건을 풀었다. 남은 물에 적셔 코와 입을 막았다. 흙 냄새가 젖은 면 사이로 희미하게 올라왔다.<\/p>\n<p>방범창. 나사 네 개. 십자 나사였다.<\/p>\n<p>드라이버는 없었다. 필통을 뒤집었다. 볼펜. 금속 클립이 달린 볼펜. 클립을 뜯어내 끝을 나사 홈에 끼웠다. 돌렸다.<\/p>\n<p>헛돌았다. 녹이 슨 나사는 꿈쩍도 하지 않았다.<\/p>\n<p>다시. 손가락에 힘을 줬다. 클립 끝이 손끝 살을 파고들었다. 끼익. 반 바퀴. 첫 번째 나사가 움직였다.<\/p>\n<p>두 번째. 세 번째에서 클립이 휘었다. 손톱으로 펴서 다시 끼웠다.<\/p>\n<p>머리가 무거워졌다. 젖은 손수건 너머로도 숨이 들어오지 않았다. 숨을 들이켤 때마다 가슴 안쪽이 불에 덴 것처럼 쓰렸다. 형광등 불빛이 연기 속에서 번져 달무리처럼 보였다.<\/p>\n<p>네 번째 나사.<\/p>\n<p>손가락이 미끄러졌다. 클립이 바닥으로 떨어졌다. 주우려고 무릎을 꿇었는데, 다시 일어설 수가 없었다.<\/p>\n<p>바닥은 조금 덜 매웠다. 상자를 끌어안은 채 옆으로 누웠다. 귀가 장판에 닿았다. 장판이 미지근했다. 아래층에서 무언가 터지는 소리가 둔하게 올라왔다.<\/p>\n<p>열한 살, 반지하 현관. 수갑 찬 아빠가 계단을 오르며 한 번 돌아봤다. 입 모양. 그게 뭐였을까.<\/p>\n<p>이번에도 모르고 끝나겠구나.<\/p>\n<p>눈이 감겼다.<\/p>\n<hr class=\"scene\">\n<p>철컥.<\/p>\n<p>금속이 금속을 끊는 소리. 묵직하고 짧은. 쇠사슬이 바닥에 떨어지며 쩔그렁 울었다.<\/p>\n<p>문이 열렸다. 젖은 이불이 밀려나고, 그 틈으로 복도의 더 짙은 연기와 손전등 불빛이 한꺼번에 쏟아졌다.<\/p>\n<p>\"정진서.\"<\/p>\n<p>목소리. 짧고, 정확하게 내 이름을 부르는.<\/p>\n<p>누군가 내 어깨를 뒤집었다. 얼굴 위로 손바닥이 덮였다. 뺨을 두 번 쳤다.<\/p>\n<p>\"눈 떠. 진서야. 눈 떠.\"<\/p>\n<p>눈꺼풀을 들었다. 연기 속에 백시헌의 얼굴이 있었다. 이마에 그을음, 셔츠 소매를 걷어 올린 팔뚝. 한 손에 빨간 손잡이의 절단기.<\/p>\n<p>\"사, 상자.\"<\/p>\n<p>\"뭐?\"<\/p>\n<p>\"상자. 편지.\"<\/p>\n<p>그가 내 팔 안의 상자를 봤다. 한 박자. 그리고 아무것도 묻지 않고 상자째 나를 들어 올렸다. 등에 업혔다. 상자가 그의 등과 내 가슴 사이에 끼었다.<\/p>\n<p>복도는 좁았다. 양옆으로 방문이 다닥다닥 붙은, 어깨 하나 겨우 지나가는 길. 연기가 천장에서부터 내려와 있었다.<\/p>\n<p>시헌이 첫걸음에 멈췄다.<\/p>\n<p>그의 등이 굳었다. 업힌 내 가슴으로 그의 심장이 미친 듯이 뛰는 게 느껴졌다. 숨이 짧게, 짧게, 짧게. 들이쉬기만 하고 내쉬지 못하는 숨.<\/p>\n<p>모빌랙에서도 그랬다. 그때도 그는 숨이 가빴다.<\/p>\n<p>\"시헌아.\"<\/p>\n<p>내가 그의 귀에 대고 말했다. 목이 쉬어서 소리가 거의 나오지 않았다.<\/p>\n<p>\"앞만 봐. 계단까지 열한 걸음이야. 내가 세 줄게.\"<\/p>\n<p>그의 숨이 한 번 걸렸다.<\/p>\n<p>\"하나.\"<\/p>\n<p>그가 걸었다.<\/p>\n<p>\"둘. 셋.\"<\/p>\n<p>연기 속에서 내 목소리만 들렸다. 더듬지 않았다. 숫자는 더듬을 필요가 없었다.<\/p>\n<p>\"열. 열하나.\"<\/p>\n<p>계단. 그가 거의 굴러떨어지듯 내려갔다. 1층 현관문을 어깨로 밀자, 밤공기가 칼처럼 폐를 찔렀다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-16 / 23:41]<\/div>\n<p>골목은 사람들로 가득했다. 슬리퍼 차림, 속옷 차림, 노트북을 끌어안은 고시생들. 소방차 사이렌이 멀리서 다가오고 있었다.<\/p>\n<p>그리고 그 한가운데에 달래가 있었다.<\/p>\n<p>소화기를 들고. 안전핀을 이빨로 뽑은 채.<\/p>\n<p>\"301호! 302호! 일어나 이 새끼들아, 불났다고! 경보기 뒤졌어, 아무도 안 울려!\"<\/p>\n<p>그녀가 옆 건물 계단 난간을 소화기로 땅땅 두드리고 있었다. 그러다 우리를 봤다. 소화기가 바닥에 떨어졌다.<\/p>\n<p>\"진서야!\"<\/p>\n<p>그녀가 뛰어왔다. 시헌의 등에서 나를 끌어내려 앉히고, 얼굴을 두 손으로 붙잡고, 눈꺼풀을 뒤집어 보고, 화상 입은 손바닥을 보고 욕을 했다. 정확히 일곱 단어였다. 전부 욕이었다.<\/p>\n<p>\"취재원 만나고 오는데 골목에서 연기가 올라오잖아. 경보기는 조용하고. 씨발, 진짜.\"<\/p>\n<p>\"달래야, 상자.\"<\/p>\n<p>\"상자? 미쳤어? 이 와중에?\"<\/p>\n<p>시헌이 말없이 상자를 내 무릎에 내려놨다.<\/p>\n<p>뚜껑을 열었다. 가장자리가 검게 말려 있었다. 손가락으로 봉투를 하나씩 넘겼다. 그을음이 손끝에 묻어났다. 탄 종이 냄새가 코를 찔렀다.<\/p>\n<p>세었다. 183통 중 41통이 그을려 있었다. 다행히 다 탄 건 하나도 없었다. 별 그림 위에 갈색 얼룩이 번진 것들. 진한 점이 얼룩 속에 잠긴 것들.<\/p>\n<p>고개를 들었다. 시헌은 소방차 불빛 속에 서서, 그을린 손으로 절단기를 쥐고 있었다.<\/p>\n<p>\"너, 너 여기 왜 있었어.\"<\/p>\n<p>그가 대답하지 않았다.<\/p>\n<p>\"절단기는. 그런 걸 왜 들고 다녀.\"<\/p>\n<p>그가 나를 봤다. 그리고 소방관이 다가오자 절단기를 슬쩍 등 뒤로 감췄다.<\/p>\n<p>내 주머니에서 휴대폰이 떨었다. 달래 것도, 시헌 것도. 골목의 고시생들 휴대폰도 하나둘 울렸다.<\/p>\n<p>케이스북 인기글.<\/p>\n<div class=\"doc\">[영상] 녹두거리 고시원 화재… 로스쿨 동기가 연기 속에서 업고 나옴 ㄷㄷ<\/div>\n<p>누군가 찍은 15초. 연기를 뚫고 나오는 남자의 등, 그 위에 축 늘어진 나. 조회수가 눈앞에서 천 단위로 넘어갔다.<\/p>\n<p>그리고 그 아래, 검은 앱이 저절로 열렸다.<\/p>\n<div class=\"doc\">판례집 — 방청석 동향<\/div>\n<p>푸른 막대그래프. '당사자 호감도'. 두 개의 막대가 나란히 치솟고 있었다. <span class=\"sys\">정진서<\/span>. <span class=\"sys\">백시헌<\/span>.<\/p>\n<p>달래가 내 화면을 들여다보다가 입술을 깨물었다.<\/p>\n<p>\"[분석] 판관님들, 로맨스물 좋아하시네.\"<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-15 / 01:10]<\/div>\n<p>응급실 커튼 안. 산소마스크의 플라스틱 냄새. 콧속으로 차갑고 건조한 바람이 들어왔다. 옆 침대에서 누군가 끙끙 앓았고, 모니터의 삑삑 소리가 일정했다.<\/p>\n<p>시헌이 침대 옆 둥근 의자에 앉아 있었다. 간호사가 두고 간 거즈와 화상 연고를 들고.<\/p>\n<p>\"내가 할게요.\"<\/p>\n<p>간호사에게 그렇게 말하는 걸 들었다. 간호사는 바쁘다는 듯 고개를 끄덕이고 나갔다.<\/p>\n<p>그가 내 오른손을 끌어다 무릎 위에 올렸다. 손바닥에 하얀 물집이 올라와 있었다. 연고를 짠 면봉이 그 위를 지났다. 차가웠다가, 쓰렸다가, 다시 차가웠다.<\/p>\n<p>가까웠다. 그의 숨이 내 손목에 닿았다. 그의 머리카락에서 그을린 냄새가 났다. 나에게서도 같은 냄새가 날 것이다.<\/p>\n<p>나는 마스크를 턱 아래로 내렸다.<\/p>\n<p>\"왜 구했어.\"<\/p>\n<p>거즈가 손바닥을 한 바퀴 감았다.<\/p>\n<p>\"두 번이야. 모빌랙, 그리고 오늘. 아니, 관악산까지 세 번.\"<\/p>\n<p>두 바퀴.<\/p>\n<p>\"아직 내가 못 끝냈으니까.\"<\/p>\n<p>\"뭘.\"<\/p>\n<p>그가 대답 대신 거즈 끝을 테이프로 붙였다. 손끝이 내 손등을 스쳤다. 일부러인지 아닌지 알 수 없을 만큼 짧게.<\/p>\n<p>그 손이 떨어지려는 순간, 나는 다른 손으로 그의 셔츠 깃을 잡았다.<\/p>\n<p>당겼다.<\/p>\n<p>그가 끌려왔다. 저항하지 않았다. 둥근 의자가 바닥을 긁는 소리. 그의 얼굴이 내 얼굴 앞에서 멈췄다. 숨과 숨이 섞이는 거리. 그의 눈 속에 응급실 형광등이 두 점으로 박혀 있었다.<\/p>\n<p>그 눈이 내 입술로 내려갔다.<\/p>\n<p>그리고 다시 내 눈으로 올라왔다.<\/p>\n<p>심장 소리가 모니터보다 컸다. 셔츠 깃을 쥔 내 손가락에 그의 맥박이 닿았다. 그도 빨랐다.<\/p>\n<p>한 뼘의 절반. 그 절반의 절반.<\/p>\n<p>그가 멈췄다. 내가 멈췄다. 누가 먼저였는지 모른다.<\/p>\n<p>\"진서야. 나는—\"<\/p>\n<p>촤르륵.<\/p>\n<p>커튼이 걷혔다.<\/p>\n<p>달래였다. 자판기 이온음료 두 캔을 들고, 우리를 내려다보고 있었다. 나는 셔츠 깃을 놓았다. 시헌은 의자를 원래 자리로 밀었다. 둘 다 너무 늦었다.<\/p>\n<p>달래가 캔 하나를 내 무릎에 던졌다. 다른 하나는 주지 않았다. 그녀의 눈은 시헌에게 박혀 있었다.<\/p>\n<p>\"[속보] 방화 현장에 왜 백시헌이 먼저 있었나.\"<\/p>\n<p>시헌이 일어섰다.<\/p>\n<p>\"…방화라고 한 적 없는데.\"<\/p>\n<p>\"경보기 다 꺼져 있었대. 소방관이 그러더라. 쇠사슬도 밖에서 감겨 있었고. 근데 절단기는 누가 미리 챙겨 오지? 불나기 전에?\"<\/p>\n<p>시헌은 대답하지 않았다. 문장에 주어가 없는 남자가, 이번엔 문장조차 없었다. 그는 달래를 지나쳐 커튼 밖으로 나갔다. 발소리가 응급실 복도 끝에서 사라졌다.<\/p>\n<p>달래가 그 자리에 앉았다. 내 거즈 감긴 손을 내려다봤다.<\/p>\n<p>\"잘 감았네. 씨발.\"<\/p>\n<p>\"달래야.\"<\/p>\n<p>\"너 걔 믿지 마. 기자 촉이야. 저 새끼 문장엔 처음부터 주어가 없었어.\"<\/p>\n<p>\"안 믿어.\"<\/p>\n<p>말하면서 엄지손톱을 검지에 댔다. 큐티클 위에 거즈가 감겨 있었다. 손톱이 하얀 천만 긁었다. 달래가 그걸 봤다. 아무 말도 하지 않았다. 그녀는 대신 이온음료 캔을 따서 내 입에 대줬다. 미지근하고 들척지근한 맛이 쓰린 목구멍을 타고 내려갔다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-15 / 03:00]<\/div>\n<p>잠깐 잠들었던 모양이다. 눈을 뜨자 달래가 의자에 앉은 채 고개를 꾸벅이고 있었다.<\/p>\n<p>그때 휴대폰 두 대가 동시에 떨었다. 침대 옆 트레이 위에서, 내 것과 달래 것이. 같은 진동, 같은 박자로.<\/p>\n<p>달래가 먼저 화면을 봤다.<\/p>\n<p>그녀의 얼굴에서 핏기가 빠지는 데 1초가 걸리지 않았다. 졸음이 걷히고, 눈이 커지고, 그다음엔 아무 표정도 남지 않았다. 기자의 얼굴도, 친구의 얼굴도 아닌.<\/p>\n<p>\"…아니야. 그건 아무도 몰라.\"<\/p>\n<p>나는 내 휴대폰을 집었다. 거즈 감긴 손가락이 화면 위에서 미끄러졌다.<\/p>\n<p>검은 화면. 흰 저울.<\/p>\n<div class=\"doc\">판례집 — 제2공판 9월 8일 00:00<\/div>\n<div class=\"doc\">피고인: 오달래(갑 제9호증, 제출자 익명). 검사: 정진서(재판장 지정). 검사 거부 시, 검사가 피고인이 된다.<\/div>","chars":4827},{"title":"제2공판","html":"<div class=\"timer\">[D-14 / 00:00]<\/div>\n<p>종이 울렸다.<\/p>\n<p>천장의 낡은 법정 종. 녹슨 쇠의 떨림이 계단을 타고 내려와 발바닥에서 무릎까지 올라왔다. 지하의 공기는 차갑고, 먼지와 곰팡이와 오래된 니스 냄새가 났다.<\/p>\n<p>피고인석의 쇠 난간 뒤에 달래가 서 있었다. 검은 법복이 그녀에게는 조금 컸다. 소매가 손등을 덮었다.<\/p>\n<p>나는 검사석에 섰다. 거즈 감긴 오른손으로 봉투를 쥐고. 갑 제9호증. 수입인지 봉인이 형광등 아래 붉게 번들거렸다.<\/p>\n<p>달래가 나를 봤다. 입술만 움직였다.<\/p>\n<div class=\"doc\">해. 괜찮아.<\/div>\n<hr class=\"scene\">\n<p>어제 오후, 녹두거리 순댓국집에서도 그녀는 같은 말을 했다. 국물이 식어 기름이 하얗게 굳을 때까지.<\/p>\n<p>\"네가 거부하면 네가 피고인이야. 네 봉투는 내가 갖고 있고, 백시헌도 갖고 있어. 사형수 딸, 자소서 허위. 그거 터지면 너 아버지 못 살려.\"<\/p>\n<p>\"그, 그럼 너는.\"<\/p>\n<p>\"나는 원래 망한 년이야. 한 번 더 망하는 거지.\"<\/p>\n<p>그녀가 웃었다. 숟가락을 쥔 손가락 마디가 하얬다.<\/p>\n<p>나는 23:58까지 판례집의 '검사 거부' 버튼 위에 엄지를 올려두고 있었다. 누르지 않았다.<\/p>\n<hr class=\"scene\">\n<p>\"개정합니다.\"<\/p>\n<p>법대 위, 가면을 쓴 재판장에게서 변조된 목소리가 울렸다. 금속을 긁는 듯한, 성별도 나이도 지워진 목소리.<\/p>\n<p>\"규칙 제5조. 증거는 적법한 절차로 다툰다.\"<\/p>\n<p>처음 이 지하에 내려온 밤, 선서와 함께 낭독된 규칙이었다. 재판장은 개정 때마다 그 조항부터 읽었다. 토씨 하나 다르지 않았다. 나는 그 문장을 쪽수 없는 판결문처럼 머릿속에 접어 넣었다.<\/p>\n<p>\"검사, 봉인 증거를 개봉하십시오.\"<\/p>\n<p>봉투를 찢었다. 종이 찢어지는 소리가 지하 법정 전체에 울렸다. 흑유리 너머에서 태블릿 불빛 수십 개가 일제히 밝아졌다.<\/p>\n<p>A4 네 장.<\/p>\n<p>첫 장. 2021년 11월자 신문 기사 출력본. 바이라인 <span class=\"sys\">오달래 기자<\/span>. 제목 <span class=\"sys\">[단독] ○○재단 요양병원, 사망 환자 기록 조작… 내부 문건 입수<\/span>.<\/p>\n<p>둘째 장. 기사 본문 중 한 문단에 형광펜. <span class=\"sys\">문건을 제보한 이 병원 간호부 소속 7년 차 책임간호사 A씨는…<\/span><\/p>\n<p>셋째 장. 메신저 대화 캡처.<\/p>\n<div class=\"doc\">A: 기자님 제 이름 안 나가죠?<br>오달래: 걱정 마세요. 절대 특정 안 돼요.<\/div>\n<p>넷째 장. 부고. 2021년 12월 3일. 52세. 사인은 적혀 있지 않았다. 대신 그 아래 한 줄. <span class=\"sys\">○○재단, 내부고발 간호사 해고 9일 후.<\/span><\/p>\n<p>넷째 장을 쥔 손가락에 힘이 빠졌다. 종이 모서리가 거즈에 걸려 구겨졌다.<\/p>\n<p>진실이었다. 위조가 아니었다. 서체도, 행간도, 인쇄 번짐도 전부 같았다. 나는 최민규 때처럼 \"이건 가짜다\"라고 말할 수 없었다. 이번엔 증거가 거짓말을 하지 않았다. 거짓말을 해주지 않았다.<\/p>\n<p>피고인석을 봤다. 달래는 내 손에 들린 부고를 보고 있었다. 눈을 깜빡이지 않았다. 그 종이를 처음 보는 눈이 아니었다. 수백 번은 본 눈이었다.<\/p>\n<p>기소하면 달래가 끝난다. 거부하면 내가 끝나고, 아빠가 끝난다.<\/p>\n<p>엄지손톱이 큐티클을 찾았다. 거즈 위에서 헛돌았다.<\/p>\n<p>\"공, 공소를 제기합니다.\"<\/p>\n<p>첫 음절이 걸렸다. 흑유리 너머의 실시간 그래프가 벽 스크린에 떴다. 막대 두 개. 유죄, 무죄. 어느 쪽도 움직이지 않았다. 모두 기다리고 있었다. 내가 친구를 어떻게 죽이는지.<\/p>\n<p>나는 종이를 내려다보지 않았다. 이미 다 외웠다.<\/p>\n<p>\"피고인은 2021년 11월 17일, 제보자의 신원을 특정할 수 있는 정보 — 소속 부서, 직급, 근속 연수 — 를 기사에 기재했습니다. 해당 병원에 그 조건을 충족하는 사람은 한 명이었습니다. 제보자는 9일 뒤 해고되었고, 16일 뒤 사망했습니다.\"<\/p>\n<p>그래프의 '유죄' 막대가 천천히 올라갔다. 3. 5. 6.<\/p>\n<p>달래는 고개를 숙이지 않았다. 난간을 쥔 손등에 핏줄이 섰다.<\/p>\n<p>\"피고인, 할 말 있습니까.\"<\/p>\n<p>재판장의 목소리.<\/p>\n<p>\"없어요.\"<\/p>\n<p>달래가 말했다. 또렷하게.<\/p>\n<p>\"맞아요. 제가 썼어요. 직급 빼라는 데스크 말 안 들었어요. 그게 있어야 기사가 살았거든요.\"<\/p>\n<p>유죄 7. 흑유리 너머에서 누군가 손뼉을 한 번 쳤다. 웃음소리가 낮게 번졌다.<\/p>\n<p>나는 그 웃음을 들었다.<\/p>\n<p>그 순간 혀뿌리의 쇠붙이가 녹았다. 화가 나면 늘 그랬다. 말이 칼날처럼 매끄러워졌다.<\/p>\n<p>\"재판장님. 검사는 한 가지를 더 밝히겠습니다.\"<\/p>\n<p>나는 셋째 장, 메신저 캡처를 들어 올렸다. 맨 위 여백. 아무도 읽지 않았을 회색 작은 글씨.<\/p>\n<p>\"이 캡처의 머리말입니다. '디지털 포렌식 추출 보고서. 대상 기기: 오달래 소유 휴대전화. 추출 일시: 2026년 8월 29일 03시 12분. 영장 번호: 해당 없음.'\"<\/p>\n<p>웅성거림이 멈췄다.<\/p>\n<p>\"피고인의 휴대전화는 영장 없이, 피고인 몰래, 공판 개시 사흘 전 새벽에 통째로 복제됐습니다. 이 대화는 그렇게 수집됐습니다.\"<\/p>\n<p>\"검사는 자신이 제출한 증거를 탄핵하는 겁니까.\"<\/p>\n<p>변조된 목소리가 반 박자 늦게 나왔다.<\/p>\n<p>\"아니요. 재판장님의 문장을 읽는 겁니다.\"<\/p>\n<p>나는 흑유리를 똑바로 봤다. 내 얼굴이 검은 유리에 비쳤다. 그 너머에 누가 있든.<\/p>\n<p>\"'규칙 제5조. 증거는 적법한 절차로 다툰다.' 형사소송법 제308조의2. 적법한 절차에 따르지 아니하고 수집한 증거는 증거로 할 수 없다. 이 증거는 이 법정의 규칙대로라면, 존재하지 않습니다.\"<\/p>\n<p>\"피고인의 자백이 있습니다.\"<\/p>\n<p>\"제310조. 피고인의 자백이 그 피고인에게 불이익한 유일의 증거인 때에는 이를 유죄의 증거로 하지 못한다. 자백을 보강할 증거는 갑 제9호증뿐입니다. 그리고 갑 제9호증은 증거가 아닙니다.\"<\/p>\n<p>숨을 한 번 쉬었다. 거즈 아래 손바닥의 물집이 터져 축축했다.<\/p>\n<p>\"그리고 이 증거를 불법으로 수집한 자는 검사가 아닙니다. 이 법정입니다. 그러므로 이 사건의 무죄는, 검사의 무고가 아닙니다.\"<\/p>\n<p>침묵.<\/p>\n<p>흑유리 너머의 태블릿 불빛들이 흔들렸다. 누군가 일어서는 실루엣. 누군가 옆 사람에게 몸을 기울이는 실루엣. 은색 저울 브로치 하나가 어둠 속에서 반짝였다.<\/p>\n<p>그래프가 움직였다.<\/p>\n<p>유죄 7이 6이 되고, 5가 되고. 무죄가 올라갔다. 4. 5. 6.<\/p>\n<p>땡.<\/p>\n<p>종이 한 번 울렸다.<\/p>\n<div class=\"doc\">무죄 6 : 유죄 4<\/div>\n<p>달래가 난간을 놓쳤다. 무릎이 꺾이는 걸 겨우 버텼다.<\/p>\n<p>당사자석 맨 끝에서 시헌이 나를 보고 있었다. 손가락이 난간을 두드리지 않았다. 처음으로, 그의 손이 멈춰 있었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-14 / 00:47]<\/div>\n<p>철문 위 계단. 형광등 하나가 깜빡였다.<\/p>\n<p>달래가 계단 중간에서 갑자기 주저앉았다. 그리고 나를 끌어당겼다. 무릎이 돌계단에 찧었는데 아프지 않았다. 그녀의 팔이 내 목을 감았다. 법복 소매에서 순댓국 냄새와 섬유탈취제 냄새가 동시에 났다.<\/p>\n<p>그녀가 울었다. 소리 내서. 기자 오달래가, 욕도 헤드라인도 없이.<\/p>\n<p>\"미친년. 미친년아. 그걸 어떻게, 그 회색 글씨를 어떻게 봤어.\"<\/p>\n<p>\"한 번 본 건 안 까먹어.\"<\/p>\n<p>\"알아. 씨발, 알아.\"<\/p>\n<p>그녀의 등이 들썩였다. 나는 거즈 감긴 손으로 그 등을 두드렸다. 제1공판 그날 밤, 계단에서 토하던 나를 그녀가 두드려주던 그 박자로.<\/p>\n<p>한참 뒤에 그녀가 말했다. 내 어깨에 얼굴을 묻은 채로.<\/p>\n<p>\"그 사람, 장례식 갔었어. 맨 뒷줄에. 그 사람 딸이 나 알아보고 소금 뿌렸어.\"<\/p>\n<p>\"…응.\"<\/p>\n<p>\"데스크는 내 탓 아니래. 병원이 해고한 거래. 다들 그랬어. 근데 나는 알아. 직급 한 줄. 내가 넣었어. 그 한 줄 없었으면 그 사람 아직 출근하고 있어.\"<\/p>\n<p>그녀가 고개를 들었다. 마스카라가 번져 눈 밑이 검었다.<\/p>\n<p>\"그 사람 이름, 아직 매일 검색해. 아침마다. 혹시 누가 아직 기억하나 해서. 아무도 안 해. 나만 해.\"<\/p>\n<p>계단 위 형광등이 지직거렸다. 지하에서 올라오는 찬 공기가 땀에 젖은 목덜미를 훑었다.<\/p>\n<p>나는 그녀의 손을 잡았다.<\/p>\n<p>\"나도 매일 아빠 이름 검색해.\"<\/p>\n<p>달래의 눈이 흔들렸다.<\/p>\n<p>\"유태석. 아침마다. 무슨 기사가 새로 떴나. 집행 날짜가 바뀌었나. 15년 동안. 편지는 안 뜯으면서. 검색은 했어.\"<\/p>\n<p>같은 상처였다. 한 사람은 죽인 이름을, 한 사람은 죽을 이름을. 매일 아침 같은 검색창에.<\/p>\n<p>달래가 코를 훌쩍이며 웃었다.<\/p>\n<p>\"[기획] 두 여자의 검색 기록… 알고리즘도 '눈물'.\"<\/p>\n<p>\"헤드라인 구려.\"<\/p>\n<p>\"닥쳐. 지금 이게 최선이야.\"<\/p>\n<p>그때 계단 아래에서 발소리가 올라왔다. 또각, 또각. 하이힐.<\/p>\n<p>서이안이었다. 법복 깃에 은색 저울 브로치. 그녀는 우리 옆을 지나치다가 두 계단 위에서 멈췄다. 돌아보지 않고 말했다.<\/p>\n<p>\"308조의2.\"<\/p>\n<p>\"…뭐.\"<\/p>\n<p>\"재판장 문구로 재판장을 친 거. 1학기 내내 장학생 소리 듣던 애가.\"<\/p>\n<p>그녀가 고개를 반쯤 돌렸다. 늘 위에서 내려다보던 그 눈이었다. 그런데 이번엔 턱을 들지 않았다. 나를 처음 보는 사람처럼, 위아래가 아니라 정면으로 봤다.<\/p>\n<p>\"나쁘지 않았어, 정진서.\"<\/p>\n<p>그녀가 계단을 올라갔다. 하이힐 소리가 철문 너머로 사라졌다.<\/p>\n<p>달래가 내 옆구리를 찔렀다.<\/p>\n<p>\"[단독] 서이안, 생애 첫 칭찬… 대상은 고시원 총무.\"<\/p>\n<hr class=\"scene\">\n<p>땡.<\/p>\n<p>종이 다시 울렸다.<\/p>\n<p>달래의 웃음이 멈췄다. 우리 둘 다 계단 아래를 내려다봤다. 폐정 선언은 이미 났다. 종이 두 번 울린 적은 없었다.<\/p>\n<div class=\"timer\">[D-14 / 00:52]<\/div>\n<p>제0법정의 스크린이 다시 켜져 있었다. 흩어지던 당사자들이 하나둘 법정 안으로 되돌아왔다. 아무도 말하지 않았다. 흑유리 너머의 태블릿 불빛들이 다시 밝아져 있었다.<\/p>\n<p>변조된 목소리.<\/p>\n<p>\"판례 변경.\"<\/p>\n<p>목덜미의 솜털이 일어섰다.<\/p>\n<p>\"검사의 고의 패소는 무고로 본다. 반소 적용.\"<\/p>\n<p>스크린에 글자가 떴다. 내가 방금 판 구멍을, 누군가 한 줄로 메웠다. 내가 재판장의 문장을 썼듯, 재판장은 이제 내 문장을 지웠다. 이 법정에서 규칙을 쓰는 손은 하나였다.<\/p>\n<p>귀에서 물소리가 났다. 지하의 찬 공기가 갑자기 무거워져 어깨를 눌렀다. 무릎 안쪽이 풀렸다. 나는 당사자석 난간을 붙잡았다. 니스 칠이 벗겨진 나무가 손바닥 거즈에 까끌하게 걸렸다.<\/p>\n<p>흑유리 너머의 실루엣들이 다시 태블릿을 들었다. 푸른 불빛이 하나씩 켜졌다. 박수 대신, 화면을 두드리는 소리. 톡, 톡, 톡. 그들은 방금 무죄를 눌렀던 바로 그 손가락으로 다음 경기를 예약하고 있었다.<\/p>\n<p>달래가 내 팔을 붙잡았다. 손톱이 법복 소매를 뚫고 살에 박혔다.<\/p>\n<p>글자가 한 줄 더 떴다.<\/p>\n<div class=\"doc\">제3공판 9월 11일 00:00. 피고인: 정진서. 검사: 백시헌 — 갑 제3호증 보관자 중 1인.<\/div>\n<p>심장이 한 박자 늦게 뛰었다.<\/p>\n<p>당사자석에서 누군가 걸어 나왔다. 구두 소리가 돌바닥 위에서 정확한 간격으로 울렸다. 그가 검사석 앞에 섰다. 방금 내가 서 있던 자리. 내 거즈에서 흘러나온 피가 아직 나무 위에 말라붙어 있는 자리.<\/p>\n<p>그가 법복 안주머니에서 갈색 봉투를 꺼냈다. 수입인지 봉인. 붓글씨 <span class=\"sys\">갑 제3호증<\/span>. 그 아래 이름.<\/p>\n<p>유진서.<\/p>\n<p>검사석 쪽에서, 시헌이 내 봉투를 들어 올렸다.<\/p>","chars":4982},{"title":"이시헌","html":"<div class=\"timer\">[D-13 / 09:10]<\/div>\n<p>빈 강의실 문을 등으로 밀어 닫자 복도의 소음이 뚝 끊겼다.<\/p>\n<p>나는 그때까지 쥐고 있던 백시헌의 셔츠 소매를 놓았다. 손바닥 땀에 젖은 천이 구겨져 있었다. 그저께 자정, 검사석에서 내 봉투를 들어 올리던, 바로 그 손목이었다.<\/p>\n<p>\"너, 우리 아빠한테 왜 열다섯 번이나 접견 신청했어.\"<\/p>\n<p>이번엔 더듬지 않았다. 화가 나 있었으니까.<\/p>\n<hr class=\"scene\">\n<p>시헌은 대답하지 않았다.<\/p>\n<p>블라인드 틈으로 아침 햇빛이 칼날처럼 들어와 그의 얼굴을 반으로 갈랐다. 분필 가루와 식은 커피 냄새. 칠판에는 지난 학기의 판례 번호가 반쯤 지워진 채 남아 있었다.<\/p>\n<p>주머니 속에서 휴대폰이 떨었다. 달래였다.<\/p>\n<div class=\"doc\">[단독] 정진서, 자기 검사 납치 시도… 목격자 &quot;눈빛이 살인적&quot;<br>5분 안에 답장 없으면 문 부수고 들어간다<\/div>\n<p>나는 답장하지 않고 휴대폰을 엎었다. 그저께 자정 제0법정 계단에서 달래가 나를 끌어안고 울던 체온이 아직 어깨에 남아 있었다. 그 대가로 나는 반소를 받았고, 내 검사는 지금 내 앞에 서 있었다.<\/p>\n<p>\"내일 밤 자정이면 넌 내 검사야. 그 전에 대답해.\"<\/p>\n<p>\"대답하면, 달라져?\"<\/p>\n<p>\"모, 몰라. 근데 모르고 피고인석에 서는 건 싫어.\"<\/p>\n<p>그가 휴대폰을 꺼냈다. 잠금을 풀고, 화면을 내 쪽으로 돌려 책상 위에 내려놓았다. 유리가 합판 위를 미끄러지는 소리가 텅 빈 강의실에 길게 울렸다.<\/p>\n<p>신문 지면 사진이었다. 누렇게 바랜 종이의 결까지 찍힌.<\/p>\n<div class=\"doc\">2011년 9월 15일 (목)<br>관악 일가족 살인… 회계사 부부 숨져, 13세 아들 옷장에서 생존<\/div>\n<p>나는 그 기사를 알았다. 열한 살 때 TV 앞에서 외워버린 문장들 중 하나였다. 셋째 문단, 둘째 줄. '아들 이모 군은 옷장 안에서 숨죽인 채 발견됐다.'<\/p>\n<p>시헌이 화면을 옆으로 넘겼다.<\/p>\n<p>가족관계증명서. 입양 전 기록. 이름 칸.<\/p>\n<div class=\"doc\">이시헌(李是憲)<\/div>\n<p>글자가 눈 안에서 번졌다가 다시 또렷해졌다. 이, 시, 헌. 이모 군.<\/p>\n<p>\"네 아버지가 죽인 사람들.\"<\/p>\n<p>그의 목소리는 평소처럼 짧았다. 너무 평평해서, 오히려 어딘가 금이 가는 소리가 들리는 것 같았다.<\/p>\n<p>\"우리 부모님이야.\"<\/p>\n<p>창밖에서 누군가 웃으며 지나갔다. 그 소리가 아주 멀었다. 나는 책상 모서리를 쥐었다. 합판 모서리가 손바닥을 파고들었다.<\/p>\n<p>\"그, 그럼.\"<\/p>\n<p>목이 막혔다. 침을 삼켰다. 쓴맛이 혀뿌리에 고였다.<\/p>\n<p>\"백정만은.\"<\/p>\n<p>\"양부. 사건 반년 뒤에 날 데려갔어. 아버지가 한결 회계사였으니까. 다들 의리라고 했지.\"<\/p>\n<p>\"공판엔 왜 들어왔어.\"<\/p>\n<p>\"서기니까.\"<\/p>\n<p>너무 쉽게 나온 단어여서, 나는 그걸 속으로 한 번 더 굴려야 했다. 서기. 판관회가 당사자들 사이에 심어둔 눈. 집행 폭로글을 쓰는 손.<\/p>\n<p>\"은사님이 자리를 줬어. 난 받았고.\" 그가 내 얼굴을 봤다. \"이유는 하나야. 살인자의 딸이 법복 입는 걸 막으려고.\"<\/p>\n<p>\"처, 처음부터 알았어? 내가 누군지.\"<\/p>\n<p>\"입학식 날부터.\"<\/p>\n<p>\"탄원서도… 네가 냈어?\"<\/p>\n<p>묻는 순간 답을 알았다. 그가 고개를 끄덕이기도 전에 귓속에서 맥박이 쿵쿵 울렸다.<\/p>\n<p>\"매년 9월. 조속히 집행해 달라고.\"<\/p>\n<p>나는 휴대폰 화면을 다시 봤다. 가족관계증명서 하단의 날짜. 입양 신고 2012년 3월. 양부 백정만. 그 이름이 활자 속에서 유난히 굵어 보였다.<\/p>\n<p>\"법정에서 들어 올린 내 봉투.\" 내가 말했다. \"열어봤어?\"<\/p>\n<p>\"아니.\"<\/p>\n<p>\"왜.\"<\/p>\n<p>\"안 열어도 아니까.\" 그가 시선을 피하지 않았다. \"유진서. 2011고합1129 피고인 유태석의 딸. 개명, 전학, 자기소개서 가족 사항 허위 기재. 맞지?\"<\/p>\n<p>그는 내 인생을 판결문 주문처럼 세 줄로 읽었다. 틀린 데가 한 군데도 없었다.<\/p>\n<p>천장의 형광등이 찌르르 울었다. 그 소리가 이빨 끝까지 저렸다.<\/p>\n<p>머릿속에서 종이 한 장이 저절로 펼쳐졌다. 아빠의 1심 판결문, 열네 번째 쪽, 증거의 요지. '증인 이○○(당시 13세)은 수사기관이 제시한 사진 중 피고인을 범인으로 지목하였다.' 나는 그 줄을 수백 번 읽었다. 이○○가 누군지 궁금해한 적은 한 번도 없었다. 그 동그라미 두 개가, 지금 내 앞에 서 있었다.<\/p>\n<p>나는 손을 내려다봤다. 엄지가 검지 큐티클 위에 얹혀 있었다. 뜯지 않았다. 지금 이 방에서 거짓말을 하는 사람은 없었으니까.<\/p>\n<p>대신 물었다.<\/p>\n<p>\"그럼 왜 날 두 번이나 구했어.\"<\/p>\n<p>모빌랙 사이에서. 쇠사슬이 감긴 고시원 문 앞에서.<\/p>\n<p>시헌의 턱이 굳었다.<\/p>\n<p>\"서가에서도, 불 속에서도. 그냥 두면 됐잖아. 그럼 사형수 딸은 법복 근처에도 못 가.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"대답해, 백시헌.\"<\/p>\n<p>나는 숨을 한 번 고르고, 다시 불렀다.<\/p>\n<p>\"아니. 이시헌.\"<\/p>\n<p>그 이름이 떨어지는 순간 그가 한 걸음 물러섰다. 등이 칠판에 닿았다. 분필 가루가 검은 셔츠 어깨에 하얗게 묻어났다.<\/p>\n<hr class=\"scene\">\n<p>그는 한참 말이 없었다. 나는 기다렸다. 그가 늘 나에게 그랬던 것처럼.<\/p>\n<p>\"같은 꿈을 꿔.\"<\/p>\n<p>목소리가 낮아져 있었다.<\/p>\n<p>\"15년 동안. 옷장 문틈. 손가락 두 개 너비. 그 틈으로 거실 불빛이 들어와. 그리고 손이 지나가.\"<\/p>\n<p>그의 오른손이 허공을 더듬었다. 보이지 않는 문틈의 가장자리를 짚듯이.<\/p>\n<p>\"얼굴은 안 보여. 손만. 바닥에 뭔가 쓰러지는 소리. 엄마가 내 이름을 부르다가… 중간에 멈추는 소리.\"<\/p>\n<p>그가 숨을 들이켰다. 들이쉰 숨이 목 중간에서 걸렸다. 좁은 곳에 들어갈 때마다 그의 숨이 그렇게 걸린다는 걸, 나는 모빌랙 사이에서 이미 들었다.<\/p>\n<p>\"법정에서 난 '그 아저씨'라고 진술했어.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"검사가 사진을 보여줬어. 대리기사 아저씨 사진. 이 사람 맞지, 하고. 난 고개를 끄덕였어.\" 그가 웃었다. 웃음이 아니었다. \"열세 살이었어. 다들 그게 맞다고 했어. 어른들이 전부.\"<\/p>\n<p>검사. 나는 그 검사의 이름을 알았다. 강단 위에서 무죄추정을 묻던, 낮고 부드러운 목소리.<\/p>\n<p>\"근데 꿈속의 손은 한 번도 그 아저씨 손 같지 않았어.\" 그가 칠판에 뒤통수를 기댔다. \"그래서 신청했어. 열다섯 번. 유리창 너머로 그 손을 보고 싶어서. 맞는지.\"<\/p>\n<p>\"아빠가 다 거절했잖아.\"<\/p>\n<p>\"응. 다.\"<\/p>\n<p>\"그래서 나한테 온 거야? 아빠 대신, 나라도 보려고?\"<\/p>\n<p>\"처음엔.\" 그가 인정했다. \"네 손을 봤어. 첫 강의 날, 큐티클 뜯는 손. 그 사람 딸 손은 어떻게 생겼나 해서.\"<\/p>\n<p>나는 반사적으로 손을 등 뒤로 감췄다. 그가 그걸 보고, 아주 작게 고개를 저었다.<\/p>\n<p>\"근데 그 손으로 판례집 쪽수까지 외워서 읽더라. 연주대에선 사람 손목을 잡고 안 놓더라. 그래서 헷갈리기 시작했어.\"<\/p>\n<p>그가 나를 봤다. 처음으로, 얼음이라는 별명이 어울리지 않는 얼굴이었다. 눈가가 붉었고 아랫입술이 미세하게 떨렸다.<\/p>\n<p>\"네가 서가 사이에 끼어 있을 때, 내 손이 먼저 핸들을 돌리고 있었어. 머리는 그냥 두라고 했는데.\"<\/p>\n<p>나는 그에게 손을 뻗었다. 그리고 멈췄다. 손끝이 그의 손등에서 한 뼘 떨어진 허공에 걸렸다.<\/p>\n<p>이 손을 잡으면 안 됐다. 내가 15년 동안 상자에 처박아 둔 이름이, 이 사람에게는 15년 동안 꿈마다 찾아오는 손이었다.<\/p>\n<p>그도 내 손을 밀어내지 않았다.<\/p>\n<p>우리는 그렇게 서 있었다. 피해자의 아들과 가해자의 딸이, 분필 냄새 나는 빈 강의실에서. 블라인드 틈의 햇빛이 조금씩 기울었다. 그의 숨과 내 숨이 같은 박자로 맞춰지는 게 들렸다. 그게 견딜 수 없이 싫었고, 견딜 수 없이 따뜻했다.<\/p>\n<p>\"미, 미안하다고는 안 할 거야.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"우리 아빠가 했다는 거, 나는 아직 못 믿어.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"근데 네가 그 옷장에 있었던 건….\"<\/p>\n<p>말이 끝나지 않았다. 목에서 뜨거운 덩어리가 치밀었다. 나는 이를 악물었다. 어금니 사이에서 비릿한 맛이 났다. 그가 기다렸다. 끝까지.<\/p>\n<p>\"…그건, 누구 잘못도 아니야. 너는 열세 살이었잖아.\"<\/p>\n<p>시헌의 눈꺼풀이 한 번, 아주 천천히 내려왔다가 올라갔다. 15년 동안 아무도 그 말을 해주지 않은 얼굴이었다.<\/p>\n<p>\"9월 15일 새벽.\" 내가 말했다. 왜 그 얘기를 꺼냈는지 나도 몰랐다. \"경찰이 우리 집 현관을 두드렸어. 반지하라 창문으로 손전등 불빛이 먼저 들어왔어. 아빠가 수갑 차고 계단 올라가면서, 딱 한 번 돌아봤어.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"그 시간에 너는 옷장 안에 있었겠네.\"<\/p>\n<p>\"구급대원이 문을 열 때까지.\" 그가 말했다. \"새벽 두 시 사십 분. 문이 열리니까 빛이 너무 밝아서, 눈을 감았어.\"<\/p>\n<p>같은 새벽이었다. 한 아이는 빛이 무서워 눈을 감았고, 다른 아이는 빛 속으로 끌려가는 등을 보고 있었다. 15년 동안 우리는 같은 새벽의 양쪽 끝에 서 있었다.<\/p>\n<p>나는 그걸 견딜 수 없어서 고개를 돌렸다. 블라인드 틈의 빛이 눈을 찔렀다. 눈이 따가웠다.<\/p>\n<hr class=\"scene\">\n<p>복도에서 종이 울렸다. 2교시. 문 너머로 발소리가 몰려왔다가 흩어졌다. 손잡이가 한 번 덜컥 돌다 멈췄다. 달래였을 것이다. 문 너머에서 낮은 욕설이 들렸고, 이어서 문틀에 등을 기대는 둔탁한 소리가 났다. 들어오지 않고, 지키겠다는 소리였다.<\/p>\n<p>주머니 속 판례집 앱이 한 번 떨었다. 꺼내 보지 않아도 알았다. <span class=\"sys\">제3공판까지 37:50:00<\/span>. 숫자가 줄어드는 소리가 들리는 것 같았다.<\/p>\n<p>시헌이 먼저 움직였다. 허공에 걸려 있던 내 손을, 그가 잡았다. 차가운 손이었다. 손가락 끝이 떨리고 있었다.<\/p>\n<p>그는 내 손을 들어 자기 왼손 앞으로 가져갔다. 그리고 내 검지로 자기 왼손 약지를 짚게 했다.<\/p>\n<p>맨살이었다. 아무것도 끼워져 있지 않은. 그런데 손가락 밑동에만, 햇빛을 오래 못 본 살갗처럼 희미한 띠 자국이 나 있었다.<\/p>\n<p>\"그날 옷장 틈으로 본 손에.\"<\/p>\n<p>그가 말했다. 한 글자씩, 판결문을 낭독하듯이.<\/p>\n<p>\"반지가 있었어. 검은 돌.\"<\/p>\n<p>나는 숨을 멈췄다.<\/p>\n<p>\"네 아버지는 반지를 낀 적 없지?\"<\/p>\n<p>없었다. 아빠는 결혼반지도 끼지 않았다. 운전대를 잡을 때 걸리적거린다고, 엄마 반지까지 같이 안방 서랍에 넣어두던 사람이었다. 그 서랍 냄새까지 기억났다. 장뇌와 녹슨 동전 냄새.<\/p>\n<p>그때 손바닥에 무언가가 닿았다.<\/p>\n<p>작고 묵직했다. 피부에 닿는 순간 얼음처럼 차가웠다가, 금세 내 체온을 빨아들였
