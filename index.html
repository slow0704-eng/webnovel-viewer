"구급대 할 때 남의 심장은 백 번도 넘게 눌러 봤다. 근데 우리 엄마 심장은 내가 못 고친다. 우습제.\"<\/p>\n<p>\"오빠가 왜 우스워.\"<\/p>\n<p>\"의사 될라꼬 5수 했는데, 의사 되기 전에 엄마가 먼저 가면. 그게 우습지.\"<\/p>\n<p>나는 고개를 들었다. 그의 눈가가 김 때문인지 젖어 있었다.<\/p>\n<p>\"안 가. 어머니 안 가셔. 내가 옆에서 다 외워줄게. 판막 수술 순서까지.\"<\/p>\n<p>\"…그래.\"<\/p>\n<p>그가 숟가락으로 국물을 휘저었다. 휘젓기만 했다.<\/p>\n<p>\"니 예과 때 응급실 견학 기억나나.\"<\/p>\n<p>\"쪽팔리게 그 얘기를 왜 해요.\"<\/p>\n<p>\"니 쓰러졌을 때 내가 업고 나왔다 아이가. 그때 니가 내 등에서 뭐라 했는지 아나.\"<\/p>\n<p>\"몰라. 기억 안 나.\"<\/p>\n<p>\"오빠, 미안해. 오빠, 미안해. 계속 그랬다.\"<\/p>\n<p>숟가락을 쥔 내 손이 멈췄다. 나는 그때 누구를 부르고 있었을까. 병철 오빠의 등이었는데, 내 입은 다른 오빠를 부르고 있었을 것이다.<\/p>\n<p>\"그래서 내가 생각했다. 아, 이 가시나는 미안한 게 많은 아다. 누가 옆에 붙어 있어야겠다.\"<\/p>\n<p>그가 내 뚝배기에 자기 순대를 덜어 넣었다. 늘 하던 짓이었다. 나는 웃었고, 목 안이 뜨거워졌다.<\/p>\n<p>\"오빠는 나한테 미안한 거 없어?\"<\/p>\n<p>농담이었다. 그는 대답 대신 소주잔 없는 손으로 물컵을 들었다. 물을 다 마실 때까지 컵을 내려놓지 않았다.<\/p>\n<p>\"이수야.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"니는 나 믿제.\"<\/p>\n<p>\"당연하지. 뭔 소리여, 갑자기.\"<\/p>\n<p>그의 숟가락이 멈췄다.<\/p>\n<p>테이블 위, 엎어둔 그의 휴대폰이 짧게 떨었다. 화면 가장자리로 검은빛이 새어 나왔다. 그는 손바닥으로 휴대폰을 덮었다. 나는 보지 못했다. 그 순간 내 화면에 한 장의 사진이 떠 있었으니까.<\/p>\n<hr class=\"scene\">\n<p>다른 사진들과 달리, 그것만은 펼쳐진 장이었다.<\/p>\n<p>서가 틈에서 가장 가까이 있던 차트. 형광등 대신 비상등 아래서 찍힌 누런 종이. 상단에 붉은 도장.<\/p>\n<div class=\"doc\">제78기 선별 운영 기록<\/div>\n<p>손가락으로 화면을 벌렸다. 글자가 뭉개졌다가, 다시 모양을 잡았다.<\/p>\n<div class=\"doc\">견습 — 한도윤<\/div>\n<p>국밥집의 소음이 멀어졌다. 뚝배기 끓는 소리도, 옆 테이블의 웃음도. 수조 속에 머리를 박은 것처럼.<\/p>\n<p>\"이수야? 와 그라노.\"<\/p>\n<p>병철 오빠의 목소리가 아주 먼 데서 들렸다.<\/p>\n<p>나는 대답하지 못했다. 손가락이 저절로 다음 줄을 따라 내려갔다. 반듯한 필체. 교과서처럼 단정한 글씨였다.<\/p>\n<p>\"한도윤 — 규칙 제4조 위반(제0표본실 무단 촬영). 처치 완료. 시신 처리: 기증 전환. 실습 배정 예정 번호 — No.0412.\"<\/p>","chars":4886},{"title":"손바닥의 흉터","html":"<div class=\"timer\">[D-2 / 22:00]<\/div>\n<p>국밥집에서 어떻게 나왔는지 기억나지 않았다.<\/p>\n<p>정신을 차렸을 때 나는 실습실 0412 앞에 서 있었다. 비상등의 초록빛. 냉각기가 낮게 웅웅 울었다. 라텍스 장갑 안에서 손바닥이 땀으로 미끄러웠다.<\/p>\n<p>나는 오른손 쪽 시트 끝을 쥐었다.<\/p>\n<p>이번에는 끝까지 볼 것이다.<\/p>\n<hr class=\"scene\">\n<p>시트가 걷혔다. 사각, 하고 마른 천이 미끄러졌다.<\/p>\n<p>회색 손이 실습대 위에 손바닥을 위로 한 채 놓여 있었다. 상지 해부 때 우리가 벗겨낸 피부가 손목 아래에서 끝나 있었다. 손바닥만은 아직 그대로였다. 실습 순서가 거기까지 오지 않았으니까.<\/p>\n<p>엄지두덩 아래, 손금이 갈라지는 자리.<\/p>\n<p>하얗게 솟은 선이 하나 있었다. 길이 1.5센티미터. 끝이 안쪽으로 둥글게 말린 모양.<\/p>\n<p>갈고리였다.<\/p>\n<p>나흘 전, 나는 이 흉터를 보고 \"흔한 흉터\"라고 중얼거렸다. 수천 명의 손바닥에 수천 개의 흉터가 있다고. 병철 오빠도 그렇게 말했다. 흔하다, 이수야. 흔하다.<\/p>\n<p>나는 두 번째 증거를 찾았다.<\/p>\n<p>왼쪽 시트를 걷었다. 왼손 새끼손가락. 장갑 낀 손가락으로 첫마디뼈를 따라 더듬었다. 고정된 조직은 차가운 고무 같았다. 그 아래, 뼈의 결이 한 군데서 어긋나 있었다. 작게 툭 튀어나온 혹. 잘못 붙은 골절의 자국.<\/p>\n<p>고등학교 2학년 겨울이었다. 오빠는 농구하다 손가락이 꺾였는데 깁스가 귀찮다고 테이프만 감고 다녔다. 엄마가 등짝을 때리며 울었다. 오빠는 웃으면서 휘어진 새끼손가락을 내 코앞에 흔들었다.<\/p>\n<p>\"봐라, 이수야. 이제 오빠는 새끼손가락으로 약속 못 한다잉. 휘어서.\"<\/p>\n<p>그래서 우리는 엄지로 도장을 찍었다. 그 뒤로 늘.<\/p>\n<p>손끝이 그 혹 위에서 멈췄다.<\/p>\n<p>장갑을 벗고 휴대폰을 꺼냈다. 사진첩 맨 아래로, 아래로. 오빠 의대 합격 날 여수역 앞에서 찍은 사진. 오빠가 나한테 엄지 도장을 내밀고 있었다. 화면을 벌렸다. 오빠 오른손 바닥, 엄지두덩 아래. 하얀 갈고리. 왼쪽 새끼손가락은 사진 가장자리에서 살짝 바깥으로 휘어 있었다.<\/p>\n<p>나는 휴대폰을 0412의 손 옆에 나란히 눕혔다.<\/p>\n<p>액정 속 분홍빛 손바닥과 실습대 위 회색 손바닥. 같은 자리, 같은 각도로 말린 하얀 선. 화면 불빛이 회색 피부 위로 푸르스름하게 번졌다.<\/p>\n<p>발치 쪽 시트 끝으로 검은 꼬리표가 보였다. No.0412. 4월 12일. 오빠 생일이면 엄마는 꼭 미역국에 소고기를 넣었다. 우리 집에서 소고기가 들어가는 유일한 날이었다.<\/p>\n<p>나는 그 꼬리표를 오늘 처음으로 사람의 이름처럼 읽었다.<\/p>\n<p>흔하지 않았다. 갈고리 흉터와 휘어진 새끼손가락이 한 사람에게 같이 있는 건, 흔하지 않았다.<\/p>\n<p>비상등이 지지직 깜빡였다. 냉각기 소리가 귀 안쪽까지 차올랐다. 나는 회색 오른손을 들어 올렸다. 생각보다 무거웠다. 오빠는 나를 업을 때 늘 가볍다고 했는데. 오빠 손은 이렇게 무거웠구나.<\/p>\n<p>흉터 위로 엄지를 갖다 댔다.<\/p>\n<p>그리고 그 여름이 쏟아졌다.<\/p>\n<hr class=\"scene\">\n<p>일곱 살, 여수 오동도 방파제.<\/p>\n<p>테트라포드 사이로 파도가 철썩였다. 갯강구들이 콘크리트 위를 우르르 흩어졌다. 짠내와 미끼로 쓴 갯지렁이 비린내. 정수리가 뜨거웠다. 하늘이 너무 파래서 눈이 아팠다.<\/p>\n<p>열두 살 오빠가 낚싯대를 휘둘렀다. 나는 줄 끝에서 반짝이는 바늘이 예뻐서 손을 뻗었다.<\/p>\n<p>\"이수야, 손 치워라!\"<\/p>\n<p>바람이 줄을 낚아챘다. 은빛 바늘이 내 손바닥을 향해 꺾여 날아왔다.<\/p>\n<p>그다음은 소리였다. 퍽, 하고 무언가에 박히는 소리.<\/p>\n<p>내 손바닥 앞에 오빠 손바닥이 있었다. 바늘이 거기 박혀 있었다. 미늘까지 깊게.<\/p>\n<p>오빠 손에서 빨간 것이 흘렀다. 손목을 타고, 팔꿈치를 타고, 내 하얀 샌들 위로 똑, 똑.<\/p>\n<p>빨갛다.<\/p>\n<p>파란 바다 한가운데에, 너무 빨갛다.<\/p>\n<p>귀가 먼저 먹먹해졌다. 파도 소리가 멀어졌다. 세상이 가장자리부터 하얗게 바랬다. 그게 내가 처음으로 쓰러진 날이었다.<\/p>\n<p>눈을 떴을 때 나는 등대 아래 그늘에 누워 있었다. 오빠가 손수건으로 손을 칭칭 감은 채 나를 내려다보고 있었다. 손수건이 반쯤 붉게 젖어 있었다. 오빠는 웃었다. 땀에 젖은 앞머리를 하고, 이를 다 드러내고.<\/p>\n<p>\"니 기절했다. 내가 다친 건디 니가 기절하믄 어쩌냐.\"<\/p>\n<p>\"오빠, 아프제. 피 나잖아.\"<\/p>\n<p>\"응, 아프다.\"<\/p>\n<p>오빠는 거짓말을 하지 않았다. 피 묻은 손으로 내 이마를 쓸었다. 비릿하고 뜨거운 냄새가 났다.<\/p>\n<p>\"피는 거짓말 안 해, 이수야. 아프면 아픈 기다.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"그랑께 니도 아프믄 아프다고 해. 숨기지 말고. 알았제?\"<\/p>\n<p>나는 고개를 끄덕였다. 그리고 그 뒤로 십사 년 동안, 한 번도 그 약속을 지키지 않았다.<\/p>\n<hr class=\"scene\">\n<p>무릎이 실습대 다리에 부딪혔다. 나는 바닥에 주저앉아 있었다.<\/p>\n<p>소리가 났다. 짐승 같은 소리가. 그게 내 목에서 나온다는 걸 한참 뒤에야 알았다. 포르말린이 혀뿌리를 태웠다. 눈물이 마스크 안으로 고였다가 턱 끝으로 흘렀다.<\/p>\n<p>\"오빠. 오빠야.\"<\/p>\n<p>회색 손은 대답하지 않았다. 나는 그 손을 두 손으로 감쌌다. 차가웠다. 4℃의 냉장실 냄새가 났다. 오빠가 마지막으로 보낸 문자가 이빨 사이에서 부서졌다.<\/p>\n<p>이수야 밥 먹었나.<\/p>\n<p>\"못 먹었어. 오빠야, 나 아직 못 먹었어….\"<\/p>\n<p>문이 열리는 소리가 났다. 고무 밑창이 리놀륨 바닥을 밟는 소리. 나는 고개를 들지 않았다. 그 발소리를 알았다. 늘 내 눈을 가리러 오던 발소리.<\/p>\n<p>무진이 내 옆에 무릎을 꿇었다. 그는 회색 손을 봤다. 그리고 내 손을 봤다. 그의 눈이 흉터 위에서 멈추지 않았다. 이미 아는 사람의 눈이었다.<\/p>\n<p>\"알았나.\"<\/p>\n<p>목이 쉬어서 말이 갈라졌다.<\/p>\n<p>그는 거짓말하지 않았다.<\/p>\n<p>\"첫날부터.\"<\/p>\n<p>숨이 멈췄다.<\/p>\n<p>첫날. 지아의 손가락에서 피가 솟던 날. 하얗게 바래던 내 눈을 덮던 차가운 손바닥. 보지 마. 내 손만 봐.<\/p>\n<p>\"그날 니가 내 눈을 가린 거.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"피 때문만이 아니었제.\"<\/p>\n<p>\"니가 쓰러지면서 시트를 잡을 것 같았어. 머리 쪽.\"<\/p>\n<p>그의 목소리가 낮게 깨졌다.<\/p>\n<p>\"그 밑에 형 얼굴이 있었어.\"<\/p>\n<p>나는 그의 가슴을 주먹으로 쳤다. 한 번. 그는 피하지 않았다. 두 번째 주먹은 가운 위에서 힘없이 펴졌다. 밀어낼 수도, 끌어당길 수도 없었다. 내 손바닥이 그의 심장 위에 그냥 얹혀 있었다. 쿵, 쿵. 빨랐다. 그는 손을 떨지 않는 사람인데.<\/p>\n<p>\"말했으면 니가 이 칼을 못 잡았을 거야. 안 잡으면 DNR이고.\"<\/p>\n<p>\"그래서 나한테 우리 오빠를 썰게 했어?\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"내가 오빠 가슴을 열었어. 오빠 팔에서 신경을 찾았어. 니 옆에서. 니는 그걸 보고 있었고.\"<\/p>\n<p>말할수록 혀가 굳었다. 여드레 동안 내 손이 지나간 자리들이 눈앞에 하나씩 떠올랐다. 대흉근. 겨드랑동맥. 정중신경. 아틀라스 페이지처럼 정확한 이름들. 그 이름들이 전부 오빠였다.<\/p>\n<p>\"매일 봤어.\"<\/p>\n<p>무진이 말했다. 바닥을 보면서.<\/p>\n<p>\"니가 칼 대는 거. 매일. 그래서 내가 먼저 잘랐어. 니 손이 덜 가게.\"<\/p>\n<p>실습 첫날의 그 첫 절개가 떠올랐다. 아무에게도 묻지 않고 흉골 위에 칼끝을 대던 손. 교과서대로 하면 오늘 안에 못 끝내. 그건 서두름이 아니었다.<\/p>\n<p>\"니가 뭔디. 니가 뭔디 그걸 골라.\"<\/p>\n<p>그는 대답하지 못했다. 대신 내 손등 위에 자기 손을 아주 조심스럽게 겹쳤다. 아프지 않을 만큼, 그러나 빠져나갈 수 없을 만큼. 그의 손가락이 떨렸다. 처음 보는 떨림이었다.<\/p>\n<p>\"미안해.\"<\/p>\n<p>그 한마디가 오래 걸려 나왔다.<\/p>\n<p>나는 그의 손을 뿌리치지 않았다. 대신 고개를 저었다.<\/p>\n<p>\"나가.\"<\/p>\n<p>\"이수야.\"<\/p>\n<p>\"오빠랑 있고 싶어. 둘이서. 나가, 무진아.\"<\/p>\n<p>그는 한참 나를 봤다. 그리고 일어났다. 나가기 전에 0412의 손 위로 시트를 덮어주려다, 멈췄다. 손을 거뒀다. 그건 이제 내가 할 일이라는 듯이.<\/p>\n<p>문이 닫혔다.<\/p>\n<p>나는 일어나 회색 손을 시트로 덮었다. 손등부터, 천천히. 휘어진 새끼손가락이 천 아래로 사라질 때까지.<\/p>\n<p>\"오빠, 나 왔어.\"<\/p>\n<p>목소리가 실습실 천장에 부딪혀 돌아왔다. 냉각기가 웅웅 대답했다.<\/p>\n<p>\"늦게 와서 미안해. 밥 먹었냐고 물었을 때 답장 못 해서 미안해. 오빠 몸에 칼 대서… 미안해.\"<\/p>\n<p>시트 위로 손바닥을 얹었다. 천 너머로 냉기가 스며 올라왔다. 오빠는 늘 손이 뜨거운 사람이었는데.<\/p>\n<p>\"근데 오빠. 나 아까 안 쓰러졌다. 오빠 손 보고도.\"<\/p>\n<p>웃음 비슷한 것이 새어 나왔다. 눈물이 시트 위에 동그랗게 번졌다.<\/p>\n<hr class=\"scene\">\n<p>얼마나 앉아 있었을까.<\/p>\n<p>문이 다시 열렸다. 이번엔 발소리가 무거웠다. 끌리듯이. 국밥 냄새와 밤바람 냄새가 같이 들어왔다.<\/p>\n<p>\"이수야.\"<\/p>\n<p>병철 오빠였다. 그는 0412의 손을 봤다. 흉터를 봤다. 그의 얼굴에서 핏기가 빠졌다. 흔하다, 이수야. 그가 했던 말이 공기 중에 떠다녔다.<\/p>\n<p>\"…맞나.\"<\/p>\n<p>나는 고개를 끄덕였다.<\/p>\n<p>그는 한 걸음 다가오다 멈췄다. 그리고 무릎이 꺾였다. 쿵. 리놀륨 바닥이 울렸다. 나는 그가 나를 안아주려는 줄 알았다. 그런데 그는 바닥에 손을 짚고 고개를 숙였다. 구급대원이 아니라, 무언가를 비는 사람의 자세로.<\/p>\n<p>\"오빠, 왜 그래. 일어나.\"<\/p>\n<p>\"이수야, 내 말 들어라. 끝까지 들어라.\"<\/p>\n<p>그의 어깨가 떨렸다. 정수리에서 땀 냄새가 났다.<\/p>\n<p>\"받았다.\"<\/p>\n<p>\"…뭘.\"<\/p>\n<p>\"원로 수혈. 3단위. 엄마 수술, 서울대병원 우선 배정.\"<\/p>\n<p>귀가 다시 먹먹해지기 시작했다. 아까 국밥집. 반 박자 늦은 웃음. 손바닥으로 덮은 휴대폰. 니는 나 믿제.<\/p>\n<p>\"조건은 땡시 때 알려준다 캤다. 그래서 눌렀다. 엄마 숨소리가 쉭쉭 하는데, 내가 뭘 할 수 있겠노.\"<\/p>\n<p>\"오빠….\"<\/p>\n<p>\"부산 병원에서 순번 밀렸다 카는 전화 받고, 오 분 만에 그게 왔다. 오 분. 다 보고 있는 기라, 이수야. 우리 엄마 심장 소리까지.\"<\/p>\n<p>그가 바닥에 짚은 손을 주먹 쥐었다. 손등의 핏줄이 불거졌다. 구급차 들것을 칠 년 동안 들어 올린 손이었다.<\/p>\n<p>\"내 단위가 올라가믄 조 전체가 산다. 공유제 아이가. 니도 살고. 그래 생각했다. 그래 생각하믄 덜 더러울 줄 알았다.\"<\/p>\n<p>나는 그의 등을 봤다. 넓은 등. 예과 1학년 응급실 복도에서 나를 업고 나오던 등. 오빠, 미안해, 하고 내가 엎드려 울었던 등.<\/p>\n<p>\"근데 조건이 오늘 왔다.\"<\/p>\n<p>그가 주머니에서 휴대폰을 꺼냈다. 손이 떨려서 두 번 떨어뜨렸다. 세 번째에야 화면이 켜졌다. 검은 바탕. 흰 십자.<\/p>\n<p>그가 그것을 내 쪽으로 내밀었다.<\/p>\n<div class=\"doc\">후원 조건 고지 — 오병철<\/div>\n<div class=\"doc\">땡시 마지막 종이 울리기 전에, 한이수의 꼬리표를 투입구에 넣을 것.<\/div>\n<p>화면 불빛이 그의 젖은 뺨을 비췄다. 그는 울고 있었다. 서른두 살의 남자가 소리도 없이, 콧물을 흘리면서.<\/p>\n<p>\"이수야.\"<\/p>\n<p>그가 말했다.<\/p>\n<p>\"나는 이미 수락했다.\"<\/p>","chars":4887},{"title":"위(胃)","html":"<div class=\"timer\">[D-1 / 00:20]<\/div>\n<p>실습실 문을 나서자 복도 끝에 무진이 서 있었다.<\/p>\n<p>벽에 등을 기댄 채. 계속 거기 있었던 사람처럼. 형광등 하나가 그의 머리 위에서 지직거렸다.<\/p>\n<p>병철 오빠는 이미 반대편 계단으로 사라진 뒤였다. 무릎에 묻은 먼지도 털지 않고. 내 꼬리표를 넣겠다는 말도, 안 넣겠다는 말도 하지 않고.<\/p>\n<p>\"형 눈이 빨갛더라.\"<\/p>\n<p>무진이 말했다.<\/p>\n<p>\"…지 엄마 얘기 했어. 수술.\"<\/p>\n<p>\"카르테 감찰 로그에 원로 후원 승인이 하나 떴어. 0412조. 이름은 마스킹돼 있고.\"<\/p>\n<p>그가 나를 봤다. 그 까만 눈이.<\/p>\n<p>\"병철이 형 맞아?\"<\/p>\n<p>목구멍이 바짝 말랐다. 맞다고 하면 무진은 감찰로서 움직일 것이다. 병철 오빠를 감시하고, 필요하면 막을 것이다. 감찰이 막는 방식이 어떤 건지, 나는 함춘원 지하의 첫 새벽, 정우람이 웃으며 걸어 나가던 뒷모습으로 알고 있었다.<\/p>\n<p>\"아니야.\"<\/p>\n<p>\"이수야.\"<\/p>\n<p>\"오빠는 안 받았어. 안 해. 그런 사람 아니야.\"<\/p>\n<p>왼쪽 귓바퀴가 화끈 달아올랐다. 피가 몰리는 게 느껴졌다. 맥박이 거기서 뛰었다.<\/p>\n<p>무진의 시선이 내 얼굴에서 아주 조금, 왼쪽으로 옮겨 갔다.<\/p>\n<p>그리고 거기 머물렀다. 하나, 둘.<\/p>\n<p>\"…그래.\"<\/p>\n<p>그는 그 말만 했다. 감시를 붙이자는 말도, 거짓말하지 말라는 말도 하지 않았다. 대신 벽에서 등을 떼고 내 옆을 지나갔다. 비누 냄새가 스쳤다.<\/p>\n<p>\"자. 내일 복부야.\"<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-1 / 13:00]<\/div>\n<p>\"오늘은 위와 장입니다. 대망부터 걷고, 위의 혈관 분포 확인하세요.\"<\/p>\n<p>고은채 조교의 목소리가 실습실 천장에 울렸다. 그녀의 가운 가슴 주머니에는 오늘도 흰 국화 한 송이가 꽂혀 있었다.<\/p>\n<p>0412의 복벽은 어제 이미 열려 있었다. 회색 장기들이 고정액 속에서 제자리를 지키고 있었다. 포르말린이 눈을 찔렀다. 나는 마스크 끈을 한 번 더 조였다.<\/p>\n<p>\"그럼 누가 위 할래? 무진이가….\"<\/p>\n<p>\"내가 할게.\"<\/p>\n<p>재석의 말을 잘랐다. 조원들이 나를 봤다.<\/p>\n<p>\"이수가? 웬일이야.\"<\/p>\n<p>재석이 웃었다. 다정하게. 박선우는 영문을 모른 채 핀셋을 건네주었다. 병철 오빠는 실습대 모서리를 쥐고 있었다. 손마디가 하얬다. 무진은 아무 말 없이 메스 손잡이를 내 쪽으로 돌려 놓았다.<\/p>\n<p>나는 머리 쪽으로 걸어갔다.<\/p>\n<p>얼굴을 덮은 시트 끝이 조금 들려 있었다. 나는 그 끝을 손가락으로 눌러 실습대 모서리 아래로 접어 넣었다. 단단하게. 바람이 불어도 들리지 않게.<\/p>\n<p>이건 보지 않을 것이다. 끝까지.<\/p>\n<p>\"이수야, 시트는 왜….\"<\/p>\n<p>\"춥잖아.\"<\/p>\n<p>재석이 웃었다. 나는 웃지 않았다.<\/p>\n<p>대망을 걷었다. 노란 지방 앞치마가 고무처럼 무겁게 넘어갔다. 그 아래, 위가 있었다. 왼쪽 갈비 아래로 휘어진 회색 주머니. 아틀라스에서 수백 번 본 모양. 들문, 바닥, 몸통, 날문.<\/p>\n<p>메스를 쥔 손을 내려다봤다.<\/p>\n<p>떨리지 않았다.<\/p>\n<p>피가 없으니까. 회색은 괜찮으니까. 오빠는 이렇게 고정되어 있어서, 내가 칼을 대도 아파하지 않으니까. 그 사실이 다행스러워서 숨이 막혔다.<\/p>\n<p>큰굽이를 따라 칼끝을 댔다. 고정된 위벽은 질긴 가죽 같았다. 사각, 사각. 메스가 지나간 자리로 두꺼운 벽이 갈라졌다. 안쪽 점막의 주름이 드러났다. 회색 고랑들이 산맥처럼 접혀 있었다.<\/p>\n<p>오빠는 여기로 국밥을 먹었다. 내가 사준 첫 월급 떡볶이도. 엄마 생일 미역국도.<\/p>\n<p>\"이수야, 괜찮나.\"<\/p>\n<p>병철 오빠의 목소리가 아주 작았다.<\/p>\n<p>\"응.\"<\/p>\n<p>나는 겸자로 위벽을 벌렸다. 장갑 낀 손가락으로 점막 주름을 따라 날문 쪽으로 훑어 내려갔다. 매끄럽고, 차갑고, 단단했다.<\/p>\n<p>그런데 날문 바로 앞에서, 손끝에 무언가 걸렸다.<\/p>\n<p>딱딱했다. 주름 사이에 박힌 작은 알맹이.<\/p>\n<p>손이 멈췄다.<\/p>\n<p>\"뭐야?\"<\/p>\n<p>박선우가 고개를 내밀었다. 나는 몸을 틀어 그의 시야를 가렸다.<\/p>\n<p>\"결석인가 봐. 고정 때 생기는 거.\"<\/p>\n<p>왼쪽 귀가 뜨거워졌다. 마스크 끈이 귀를 덮고 있어서 다행이었다.<\/p>\n<p>무진이 반대편에서 손을 뻗어 위벽을 함께 벌렸다. 그의 손은 떨리지 않았다. 나는 핀셋으로 그것을 집었다.<\/p>\n<p>길이 2센티미터쯤 되는 반투명 캡슐. 의약품 캡슐처럼 생겼는데 젤라틴이 아니었다. 실리콘이었다. 이음매가 아주 가는 실로 꼼꼼히 봉합되어 있었다. 오빠의 매듭이었다. 외과 매듭 연습할 때 오빠는 늘 세 번 감았다.<\/p>\n<p>빛에 비추자 안에 검고 납작한 것이 비쳤다.<\/p>\n<p>손톱만 한 microSD 카드.<\/p>\n<p>\"오빠가 삼켰어.\"<\/p>\n<p>내가 중얼거렸다. 무진이 아주 천천히 숨을 내쉬었다.<\/p>\n<hr class=\"scene\">\n<p>박선우는 4시 재시험이 있다며 먼저 나갔다. 고은채 조교는 옆 조 질문을 받으러 갔다. 실습대 주변에 0412조 넷만 남았다.<\/p>\n<p>나는 캡슐을 거즈에 싸서 손바닥에 쥐었다. 실리콘이 체온에 미지근해지기 시작했다.<\/p>\n<p>\"이수야.\"<\/p>\n<p>재석이 내 옆으로 다가왔다. 웃는 얼굴로.<\/p>\n<p>\"그거, 조장이 보관할게.\"<\/p>\n<p>대답하기도 전이었다.<\/p>\n<p>그의 손이 내 손목을 잡았다. 그리고 비틀었다. 관절이 꺾이는 방향으로, 정확하게. 하얀 통증이 팔꿈치까지 치솟았다. 손가락이 저절로 벌어졌다.<\/p>\n<p>\"악…!\"<\/p>\n<p>\"쉿. 아파도 조금만 참아. 금방 끝나.\"<\/p>\n<p>재석의 목소리는 여전히 다정했다. 실습 첫날의 그 묵념 때처럼. 감사합니다, 선생님.<\/p>\n<p>\"놔, 이 개새….\"<\/p>\n<p>\"이수야, 말 예쁘게 해야지.\"<\/p>\n<p>그가 거즈 뭉치를 내 손에서 비틀어 빼냈다. 동시에 내 귓가에 속삭였다.<\/p>\n<p>\"냉장실, 춥지 않았어? 도윤 선배 학생증, 칩이 옛날 거라 복제하기 쉽더라.\"<\/p>\n<p>머리가 하얘졌다. 23시 41분. 한도윤의 카드. 문을 잠근 손.<\/p>\n<p>\"다들 무진이만 봤잖아. 덕분에 편했어.\"<\/p>\n<p>그 순간 무진의 손이 재석의 팔꿈치 안쪽을 짚었다. 엄지가 깊게 파고들었다. 재석의 웃음이 처음으로 일그러졌다. 손이 풀리고, 거즈 뭉치가 떨어졌다.<\/p>\n<p>병철 오빠가 몸을 날렸다. 어깨로 재석의 허리를 들이받았다. 둘이 같이 실습대 다리에 부딪혔다. 트레이가 엎어지며 핀셋과 겸자가 바닥에 쏟아졌다. 쨍그랑, 쨍, 쨍.<\/p>\n<p>\"현장 제압. 피의자 의식 명료.\"<\/p>\n<p>병철 오빠가 재석의 팔을 등 뒤로 꺾어 누르며 헐떡였다.<\/p>\n<p>\"…성격도 명료하게 더럽네.\"<\/p>\n<p>바닥에 뺨을 댄 채, 재석이 웃었다. 그 웃음이 하나도 변하지 않아서 등줄기가 서늘해졌다.<\/p>\n<p>\"형, 이러면 형 수혈 조건은 어떡해? 형 어머니.\"<\/p>\n<p>병철 오빠의 팔이 굳었다. 재석의 꺾인 팔을 누르던 손에서 힘이 빠지는 게 보였다. 그의 목울대가 크게 한 번 움직였다.<\/p>\n<p>\"닥쳐라.\"<\/p>\n<p>\"형이 제일 잘 알잖아. 조건 읽어 봤으면.\"<\/p>\n<p>무진이 나를 봤다. 수혈 조건. 그 말이 그와 나 사이 공기에 걸렸다. 어젯밤 복도에서 내가 한 말이 그대로 되돌아오고 있었다. 오빠는 안 받았어.<\/p>\n<p>나는 그 시선을 피했다. 귀가 다시 뜨거워졌다. 무진은 아무것도 묻지 않았다. 그게 더 무서웠다.<\/p>\n<p>그때 실습실 문이 열렸다.<\/p>\n<hr class=\"scene\">\n<p>들어온 사람은 육지아였다.<\/p>\n<p>닷새 만이었다. '성적 조작' 공지와 함께 사라진 얼굴. 머리를 짧게 잘라 있었다. 회색 후드 가슴에, 손바닥만 한 검은 리본이 달려 있었다.<\/p>\n<p>그녀 뒤로 낯선 학생 둘이 따라 들어왔다. 둘 다 같은 검은 리본을 달고 있었다.<\/p>\n<p>\"민재석.\"<\/p>\n<p>지아가 휴대폰을 들어 올렸다. 화면에 카르테 대화창 캡처가 떠 있었다. 발신자 '집도의'. 수신자 '민재석'. '0412조 위장 결속 유지. 한이수 냉장실 동선 보고 완료.'<\/p>\n<p>\"턴오버에 올릴 준비 다 됐어. 넌 무명한테 선별 들킨 사람 되는 거야. 니 손으로.\"<\/p>\n<p>재석이 바닥에서 고개를 들었다. 처음으로, 웃음이 사라졌다.<\/p>\n<p>그리고 지아가 나에게 걸어왔다.<\/p>\n<p>나는 그녀의 손을 봤다. 왼손 검지. 실습 첫날 메스에 베인 자리. 반창고는 없었다. 분홍색 새살이 얇게 올라와 있었다.<\/p>\n<p>\"이수야.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"니가 내 꼬리표 가져간 거, 알아.\"<\/p>\n<p>실습실이 조용해졌다. 냉각기 소리만 남았다. 내 귀가 달아오르지 않았다. 거짓말할 필요가 없었으니까.<\/p>\n<p>\"응. 내가 가져갔어.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"미안해.\"<\/p>\n<p>짝.<\/p>\n<p>뺨이 옆으로 돌아갔다. 귀가 웅 울렸다. 혀끝에 쇠 맛이 났다. 아프지 않았다. 아니, 아팠다. 아프면 아픈 기다. 나는 피하지 않았다.<\/p>\n<p>지아의 손이 떨리고 있었다. 때린 손이 맞은 뺨보다 더 붉었다.<\/p>\n<p>\"우리 엄마, 학교에 불려 와서 교수들한테 절했어. 성적 조작한 딸 둬서 죄송하다고. 나 그거 복도에서 다 들었어.\"<\/p>\n<p>지아의 목소리가 갈라졌다. 나는 그 복도를 안다고 생각했다. 리놀륨 바닥, 소독약 냄새, 닫힌 문 너머로 새어 나오는 엄마의 목소리. 우리 엄마도 오빠 장례식장에서 그렇게 절했다. 아들이 학교에 폐를 끼쳐 죄송하다고.<\/p>\n<p>\"그날 밤에 턴오버에서 검은 리본 계정이 나한테 쪽지를 보냈어. 니 차트도 조작된 거라고. 너 말고도 일곱 명이 더 있었다고.\"<\/p>\n<p>그녀가 숨을 크게 들이쉬었다.<\/p>\n<p>\"그래서 왔어.\"<\/p>\n<p>\"…응?\"<\/p>\n<p>\"너는 미안한 줄 아니까. 미안한 줄 아는 사람이랑만, 이거 할 거야.\"<\/p>\n<p>그녀가 검은 리본 하나를 내 손에 쥐여 주었다. 천이 손바닥 안에서 따뜻했다. 나는 그것을 꽉 쥐었다. 지아가 고개를 돌렸다. 그 눈가가 젖어 있다는 걸 나는 못 본 척했다. 그녀가 나에게 그래 준 것처럼.<\/p>\n<hr class=\"scene\">\n<p>재석은 일어나서 옷을 털었다. 그리고 웃었다.<\/p>\n<p>\"올려 봐, 지아야. 누가 먼저 끝나는지.\"<\/p>\n<p>그는 아무도 붙잡지 않는 문으로 걸어 나갔다. 무명 학생들 앞에서 그를 붙잡는 순간 선별이 새어 나갈 테니까. 우리는 그걸 알았고, 그도 알았다.<\/p>\n<div class=\"timer\">[D-1 / 22:47]<\/div>\n<p>밤, 텅 빈 실습실. 고은채 조교가 낡은 노트북 한 대를 가져왔다.<\/p>\n<p>\"랜선 없어요. 와이파이 모듈도 빼놨고. 여기선 아무도 못 봐요.\"<\/p>\n<p>그녀는 흰 국화를 0412의 발치에 내려놓고 문 앞으로 물러났다. 지아와 병철 오빠가 양쪽 문을 지켰다. 무진이 내 옆에 섰다.<\/p>\n<p>캡슐의 봉합실을 자를 때 손이 처음으로 떨렸다. 오빠가 세 번 감은 매듭. 나는 그것을 가위로 끊지 못하고 한참 들여다봤다. 무진이 아무 말 없이 내 손등 위에 손을 얹었다. 둘이 같이 가위를 쥐었다. 툭, 실이 끊기는 소리가 너무 작았다.<\/p>\n<p>리더기에 microSD를 꽂았다. 노트북 팬이 쉭쉭 돌았다. 화면이 잠시 까맣다가 창 하나를 띄웠다.<\/p>\n<div class=\"doc\">암호를 입력하십시오. (3회 오류 시 데이터 영구 삭제)<\/div>\n<p>그 아래, 힌트 한 줄.<\/p>\n<div class=\"doc\">네가 처음 쓰러진 날 내가 한 말.<\/div>\n<p>손가락이 키보드 위에서 굳었다. 등대 아래 그늘. 피 묻은 손수건. 비릿하고 뜨거운 냄새.<\/p>\n<p>그런데 암호창 뒤로, 반투명하게 폴더 미리보기가 비쳐 있었다. 파일명은 깨져 있었다. 썸네일만 하나, 흐릿하게 살아 있었다.<\/p>\n<p>제0표본실 서가 앞. 카메라를 향해 장난스럽게 눈을 찡그린 오빠의 얼굴.<\/p>\n<p>그리고 그 영상 속 오빠 뒤, 철문 옆 그림자에 서 있는 사람은 서무진이었다.<\/p>","chars":4928},{"title":"피는 거짓말 안 해","html":"<div class=\"timer\">[D-1 / 23:00]<\/div>\n<p>나는 화면 속 그림자에서 눈을 떼고, 옆에 선 사람을 봤다.<\/p>\n<p>같은 얼굴이었다. 2년 전보다 턱선이 날카로워졌을 뿐. 노트북 팬이 쉭쉭 돌았다. 실습실의 냉기가 발목을 타고 올라왔다.<\/p>\n<p>병철 오빠가 문가에서 한 걸음 다가왔다. 주먹이 쥐어져 있었다.<\/p>\n<p>무진은 피하지 않았다. 내 눈을 똑바로 봤다.<\/p>\n<p>\"열어 봐.\"<\/p>\n<p>목소리가 낮았다.<\/p>\n<p>\"내가 거기서 뭘 했는지.\"<\/p>\n<hr class=\"scene\">\n<p>키보드 위에 손가락을 올렸다. 자판이 차가웠다.<\/p>\n<div class=\"doc\">네가 처음 쓰러진 날 내가 한 말.<\/div>\n<p>오동도. 등대 아래 그늘. 오빠가 한 말은 두 개였다. 아프면 아픈 기다. 그리고 그 앞의 말.<\/p>\n<p>나는 뒤의 것을 먼저 쳤다. 오빠가 그날 제일 오래 웃으며 한 말이었으니까.<\/p>\n<div class=\"doc\">아프면아픈기다<\/div>\n<p>엔터.<\/p>\n<div class=\"doc\">암호 불일치. 남은 시도: 2회.<\/div>\n<p>화면 가장자리가 빨갛게 깜빡였다. 심장이 귓속에서 뛰었다. 쿵, 쿵. 지아가 문 앞에서 숨을 들이켰다.<\/p>\n<p>\"이수야, 천천히.\"<\/p>\n<p>병철 오빠가 말했다. 구급대 무전처럼 낮고 고른 목소리. 하지만 그 목소리 끝이 떨렸다.<\/p>\n<p>나는 눈을 감았다. 비릿하고 뜨거운 냄새. 피 묻은 손이 내 이마를 쓸던 감촉. 갯강구가 흩어지던 소리.<\/p>\n<p>오빠는 그 말을 하기 전에 먼저, 피 이야기를 했다. 내가 기절한 이유. 내가 평생 무서워할 그것.<\/p>\n<p>오빠는 그걸 무섭지 않은 말로 바꿔 놓으려 했던 거다.<\/p>\n<div class=\"doc\">피는거짓말안해<\/div>\n<p>손가락이 엔터 위에서 멈췄다. 마지막 기회가 하나 더 남는다. 그런데 이게 틀리면, 나는 오빠를 두 번 모르는 사람이 된다.<\/p>\n<p>눌렀다.<\/p>\n<p>화면이 하얗게 번졌다. 그리고 폴더가 열렸다.<\/p>\n<p><span class=\"sys\">01_영상<\/span> <span class=\"sys\">02_흑차트_스캔(312)<\/span> <span class=\"sys\">03_기증서약서(11)<\/span> <span class=\"sys\">04_명단<\/span><\/p>\n<hr class=\"scene\">\n<p>영상 파일을 열었다.<\/p>\n<p>화면이 흔들리다가 멈췄다. 오른쪽 아래 타임스탬프. 2년 전 3월 9일, 02:14.<\/p>\n<p>오빠가 있었다.<\/p>\n<p>카메라 앞에 얼굴을 바짝 들이밀고, 장난스럽게 한쪽 눈을 찡그리고. 앞머리가 이마에 붙어 있었다. 살아 있는 사람의 피부색이었다. 분홍빛 볼, 붉은 입술. 나는 그 색을 보며 숨을 쉬는 법을 잊었다.<\/p>\n<p>\"녹화 시작. 제0표본실, 견습 한도윤.\"<\/p>\n<p>오빠 목소리였다. 조금 쉰 목소리. 여수 억양을 서울말로 덮으려다 끝이 샜다.<\/p>\n<p>\"무진아, 발소리 나믄 기침 두 번이다잉.\"<\/p>\n<p>카메라가 돌았다. 철문 옆 그림자에 후드를 뒤집어쓴 남자애가 서 있었다. 열아홉, 스물. 예과생 학생증이 목에 걸려 있었다. 서무진이었다. 지금보다 어리고, 지금보다 겁먹은 얼굴로. 그 애가 고개를 끄덕였다.<\/p>\n<p>\"형, 빨리요.\"<\/p>\n<p>\"오야, 오야.\"<\/p>\n<p>오빠가 서가에서 흑차트를 한 권씩 꺼내 펼치고, 찍었다. 장마다 손가락으로 줄을 짚었다. 처치. 추락. 기증 전환. 오빠의 왼손이 종이 위를 지나갈 때마다 볼펜 잉크 자국이 손날에 번져 있었다.<\/p>\n<p>나는 화면 옆, 지금의 무진을 봤다. 그는 영상을 보지 않았다. 0412의 시트 끝만 보고 있었다.<\/p>\n<p>\"형이 나를 불렀어.\"<\/p>\n<p>그가 말했다.<\/p>\n<p>\"예과 1학년 3월. 해부학교실 조교 보조 하던 나한테. 열쇠 꺼내 올 수 있냐고. 아버지 서랍에서.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"나는 그 사람이 뭘 하는지 반쯤 알았어. 확인하기 싫었어. 형이 확인해 줬어.\"<\/p>\n<p>화면 속에서 기침 소리가 두 번 났다. 콜록, 콜록. 오빠가 카메라를 품에 안았다. 화면이 까맣게 흔들렸다. 그리고 영상이 끊겼다.<\/p>\n<p>\"그날 들킨 건 형이 아니라 나였어.\"<\/p>\n<p>무진의 목소리가 아주 조용했다.<\/p>\n<p>\"그 사람이 나한테 물었어. 누가 열쇠를 가져갔냐고. 나는… 말했어.\"<\/p>\n<p>실습실 공기가 무거워졌다. 냉각기 소리가 멎은 것 같았다.<\/p>\n<p>\"그리고 그날 새벽에 날 불렀어. 실습실로. 형을 내리라고. 네가 연 문이니까, 네가 닫으라고.\"<\/p>\n<p>병철 오빠의 주먹이 풀렸다. 그는 무진을 한참 봤다. 냉장실 사건 다음 날 그 얼굴에 주먹을 꽂았던 손이, 바지 옆선을 따라 힘없이 내려갔다.<\/p>\n<p>\"니… 스무 살이었나, 그때.\"<\/p>\n<p>\"열아홉.\"<\/p>\n<p>\"열아홉이믄 애다.\"<\/p>\n<p>병철 오빠가 고개를 돌렸다. 형광등 아래 그의 턱이 떨렸다.<\/p>\n<p>\"구급차에서 그 선배가 사고 아니라 캤을 때, 나도 아무 말 안 했다. 서른 살 먹은 어른이. 니만 입 다문 거 아이다.\"<\/p>\n<p>무진은 대답하지 않았다. 대신 아주 작게, 고개를 숙였다. 병철 오빠에게. 처음 보는 모습이었다.<\/p>\n<hr class=\"scene\">\n<p>다른 폴더들을 하나씩 열었다. 지아가 옆에서 같이 숫자를 셌다.<\/p>\n<p>흑차트 스캔 312장. 1985년 이후 '극단적 선택'과 '사고'로 처리된 처치 7건. 서명일이 사망일보다 늦은 시신기증 서약서 11건. 그리고 원로 명단. 은색 메스 핀 옆에 적힌 이름들은 뉴스에서 본 이름들이었다. 병원장. 학회장. 전직 차관.<\/p>\n<p>\"이거면 다 끝난다.\"<\/p>\n<p>지아가 속삭였다. 목소리가 떨렸다.<\/p>\n<p>폴더 맨 끝에, 파일이 하나 더 있었다. 파일명이 단출했다.<\/p>\n<div class=\"doc\">이수<\/div>\n<p>열었다.<\/p>\n<p>오빠가 혼자 있었다. 장소는 어딘지 몰랐다. 어두웠고, 오빠의 얼굴만 휴대폰 불빛에 떠 있었다. 아까 영상보다 지쳐 보였다. 눈 밑이 거뭇했다.<\/p>\n<p>\"이수야.\"<\/p>\n<p>오빠가 웃었다. 카메라 너머 나를 향해서.<\/p>\n<p>\"이걸 니가 보고 있으믄… 오빠가 사고를 좀 크게 친 기다. 미안하다잉.\"<\/p>\n<p>화면 속 오빠가 고개를 숙였다가 들었다.<\/p>\n<p>\"이수야, 이걸 보면 넌 여기 있으면 안 돼.\"<\/p>\n<p>잠깐의 침묵. 오빠가 코를 훌쩍였다.<\/p>\n<p>\"근데 니는 있겠지. 니는 고집이 쎄니까.\"<\/p>\n<p>나는 웃었다. 울면서 웃었다. 그 웃음이 실습실에 이상하게 울렸다.<\/p>\n<p>\"밥 먹고 해라. 그라고, 아프면 아프다고 해라. 알았제.\"<\/p>\n<p>화면이 멈췄다. 오빠의 웃는 얼굴에서.<\/p>\n<hr class=\"scene\">\n<p>지아와 병철 오빠는 백업을 들고 나갔다. 오프라인 USB 세 개, 서로 다른 세 곳으로. 고은채 조교는 복도 끝에 섰다.<\/p>\n<p>실습실에 우리 둘만 남았다. 아니, 셋.<\/p>\n<p>무진이 0412의 오른손 쪽으로 걸어갔다. 그리고 시트를 손목까지만 걷었다. 회색 손바닥. 하얀 갈고리.<\/p>\n<p>\"형한테 한 번도 말 못 했어. 미안하다고.\"<\/p>\n<p>그가 손을 내밀었다. 회색 손 위로, 손바닥을 펴서. 그러나 닿지 못했다. 손끝이 허공에서 떨렸다.<\/p>\n<p>나는 그의 손목을 잡았다. 그리고 그 손을 오빠 손 위에 내려놓았다. 그 위에 내 손을 덮었다.<\/p>\n<p>차가운 손, 떨리는 손, 뜨거운 손.<\/p>\n<p>세 겹.<\/p>\n<p>\"니는 오빠 배신자가 아니었네.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"마지막까지 옆에 있었던 사람이네.\"<\/p>\n<p>무진의 어깨가 무너졌다. 소리 없이. 그는 손을 떼지 않았다. 나도 떼지 않았다. 포르말린 냄새 사이로 그의 비누 냄새, 그리고 아주 희미하게, 오빠의 토너 냄새가 났다. 그럴 리 없는데, 났다.<\/p>\n<p>\"형은 니 얘기만 했어.\"<\/p>\n<p>무진이 말했다. 목소리가 젖어 있었다.<\/p>\n<p>\"표본실 망보는 동안에도. 우리 이수는 피 보믄 쓰러진다. 근데 그 가시나가 의사 될 기다. 두고 봐라. 맨날 그 소리.\"<\/p>\n<p>\"…오빠 사투리 따라 하지 마. 못해, 니는.\"<\/p>\n<p>\"응. 못해.\"<\/p>\n<p>그가 웃었다. 우는 얼굴로. 나는 그런 얼굴을 처음 봤다. 오빠의 손 위에서, 그의 손가락이 내 손가락 사이로 천천히 들어왔다. 깍지가 꼈다. 회색 손바닥이 우리 둘의 손을 받치고 있었다.<\/p>\n<p>오빠, 봐라. 우리 여기 있다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-0 / 00:00]<\/div>\n<p>휴대폰이 울렸다. 증례 공지 시각이었다.<\/p>\n<p>그런데 증례가 아니었다. 개인 메시지였다.<\/p>\n<div class=\"doc\">한이수 학생. 해부학교실 주임교수실로. 혼자.<\/div>\n<p>무진이 내 손목을 잡았다.<\/p>\n<p>\"가지 마.\"<\/p>\n<p>\"가야 돼. 이번엔 내가 판을 짤 거야.\"<\/p>\n<p>나는 그의 손가락을 하나씩 풀었다. 그가 놓아주었다. 아프지 않을 만큼, 그러나 아주 오래 걸려서.<\/p>\n<p>\"microSD는 니가 갖고 있어.\"<\/p>\n<p>\"이수야.\"<\/p>\n<p>\"그 사람은 내가 들고 올 거라고 생각할 거야. 빈손으로 가야 협상이 돼.\"<\/p>\n<p>무진의 손바닥에 캡슐을 쥐여 주었다. 오빠가 세 번 감은 매듭이 끊긴 채 매달려 있었다. 그는 그것을 주먹 안에 감췄다. 그 주먹이 떨리지 않았다. 다시.<\/p>\n<p>계단을 오르는 동안 복도 CCTV의 빨간 점이 나를 따라왔다. 하나, 둘, 셋. 관람실 모니터 벽 어딘가에 지금 내 얼굴이 떠 있을 것이다. 와인잔을 든 손들이 내게 단위를 걸고 있을 것이다.<\/p>\n<p>나는 고개를 들고 카메라를 봤다. 똑바로.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-0 / 00:41]<\/div>\n<p>의과대학 2동 3층, 주임교수실.<\/p>\n<p>책장 가득한 원서들, 창가의 난초 화분, 유리장 속 반짝이는 두개골 표본. 보리차 냄새. 표본실과 같은 냄새였다.<\/p>\n<p>책상 위에는 학생 실습 노트가 한 권 펼쳐져 있었다. 빨간 펜 자국이 빽빽했다. 'ㅎ'의 꼭지가 왼쪽으로 삐뚜름한 글씨. 오빠의 노트였다. 그는 그걸 2년 동안 여기 두고 있었다.<\/p>\n<p>에어컨도 켜지 않았는데 방이 서늘했다. 내 운동화 밑창이 카펫에 소리 없이 묻혔다.<\/p>\n<p>서정혁 교수는 책상 뒤에서 일어나지도 않았다.<\/p>\n<p>\"앉거라. 차가 식는다.\"<\/p>\n<p>나는 서서 말했다.<\/p>\n<p>\"SD 복사본은 세 군데 있어요. 오빠 시신 돌려주시고, 선별 끝내세요. 그럼 안 터뜨릴게요.\"<\/p>\n<p>왼쪽 귀가 뜨겁지 않았다. 진짜 조건이었으니까.<\/p>\n<p>그가 웃었다. 온화하게.<\/p>\n<p>\"트리아지를 알지? 응급실에 환자가 열 명 들어오면, 의사는 살릴 사람을 고른다. 그건 잔인한 게 아니야. 의사의 일이지.\"<\/p>\n<p>그가 찻잔을 내 쪽으로 밀었다.<\/p>\n<p>\"너도 고르면 된다. 그 SD를 주면 너는 4위 안에 들고, 도윤이의 시신은 정중히 화장된다. 네 손으로 유골함을 들 수 있어. 이번엔 진짜를.\"<\/p>\n<p>진짜. 그 단어가 가슴 한가운데를 메스처럼 그었다. 가볍던 유골함. KTX에서 울지 않던 엄마.<\/p>\n<p>\"교수님이 왜 저를 이 조에 넣었는지 알아요.\"<\/p>\n<p>\"말해 보렴.\"<\/p>\n<p>\"오빠가 못 끝낸 걸 제가 끝내나 보고 싶었던 거죠. 끝내면 교수님 사람이 되는 거고, 못 끝내면 처치하면 되고.\"<\/p>\n<p>\"훌륭하구나. 도윤이는 거기까지 오는 데 한 달이 걸렸다.\"<\/p>\n<p>그가 손뼉을 한 번 쳤다. 칭찬하는 손이었다. 그 손이 오빠 발등을 묶었을 것이다. 나는 그 손을 보면서 숨을 고르게 쉬려고 애썼다. 하나, 둘. 무진이 가르쳐 준 대로.<\/p>\n<p>\"그래서, 답은?\"<\/p>\n<p>창밖으로 혜화로터리의 택시 한 대가 경적을 길게 울렸다. 난초 잎 끝에 맺힌 물방울이 떨어졌다. 똑.<\/p>\n<p>\"싫어요.\"<\/p>\n<p>\"…….\"<\/p>\n<p>\"우리 오빠는 증거예요. 유골함 아니고.\"<\/p>\n<p>서정혁은 잠시 나를 바라봤다. 실망한 지도교수의 눈빛으로. 그리고 서랍에서 태블릿을 꺼내 화면을 내 쪽으로 돌렸다.<\/p>\n<p>\"그럼 다른 환자 얘기를 하자꾸나.\"<\/p>\n<p>화면 속 엄마가 서울대병원 병실 침대에 묶여 잠들어 있었다. 링거 옆에, 은색 메스 핀을 단 흰 가운이 서 있었다.<\/p>","chars":4802},{"title":"Code Blue","html":"<div class=\"timer\">[D-0 / 06:00]<\/div>\n<p>서울대병원 본관 3층 복도를 나는 맨발로 뛰고 있었다.<\/p>\n<p>운동화는 계단 어딘가에 벗겨져 있었다. 리놀륨 바닥이 발바닥에 쩍쩍 달라붙었다. 소독약 냄새, 새벽 배식 카트의 미지근한 국 냄새, 그리고 내 숨소리. 쇳소리가 났다.<\/p>\n<p>주머니에서 카르테가 진동했다. 마지막 라운딩이었다.<\/p>\n<div class=\"doc\">06:00 정산 완료. 잔여 호명자 7명.<\/div>\n<p>볼 시간이 없었다.<\/p>\n<hr class=\"scene\">\n<p>\"동관 7층. 7병동 끝 1인실.\"<\/p>\n<p>무진이 휴대폰을 귀에 댄 채 앞서 달렸다. 감찰 권한으로 연 병원 전산 화면이 그의 손바닥 안에서 푸르게 깜빡였다. 환자명 칸은 비어 있었다. 등록번호만 있었다. 000412-2.<\/p>\n<p>\"오빠 생일에 하이픈 하나 붙여놨네.\"<\/p>\n<p>내 목소리가 이상하게 웃고 있었다. 무진이 돌아보지도 않고 내 손목을 잡아끌었다.<\/p>\n<p>\"웃지 마. 그 얼굴 할 때 너 제일 위험해.\"<\/p>\n<p>엘리베이터는 기다리지 않았다. 비상계단을 네 층 올랐다. 허벅지 근육이 타들어갔다. 철제 난간이 손바닥에 차갑게 달라붙었다가 떨어졌다.<\/p>\n<p>7병동 끝 병실. 문 앞에 흰 국화 한 송이가 꽂혀 있었다.<\/p>\n<p>나는 문손잡이를 쥔 채 굳었다. 국화. 장례식장의 꽃.<\/p>\n<p>\"…들어와요, 이수 학생.\"<\/p>\n<p>안에서 들린 건 고은채 조교의 목소리였다.<\/p>\n<p>문을 밀었다. 침대 위에 엄마가 누워 있었다. 손목에 억제대 자국이 붉게 남아 있었지만 끈은 풀려 있었다. 링거 줄이 천천히 떨어지고 있었다. 똑, 똑. 그 소리가 내 심장보다 느렸다.<\/p>\n<p>\"진정제예요. 미다졸람 저용량. 두 시간이면 깨요.\"<\/p>\n<p>고은채가 침대 옆 의자에서 일어났다. 흰 가운 대신 검은 니트를 입고 있었다. 무릎 위에 은색 메스 핀 하나가 놓여 있었다.<\/p>\n<p>\"이거 단 사람이 새벽 네 시에 다녀갔어요. 내가 링거를 생리식염수로 바꿨고요.\"<\/p>\n<p>\"왜요.\"<\/p>\n<p>목이 잠겨서 그 한 마디밖에 나오지 않았다.<\/p>\n<p>\"시신 관리실은 중립이라고 했죠.\"<\/p>\n<p>그녀가 엄마의 이불깃을 반듯하게 펴며 말했다.<\/p>\n<p>\"산 사람도 언젠가는 우리 손에 와요. 순서를 새치기하는 건 못 봐요.\"<\/p>\n<p>나는 엄마의 손을 잡았다. 요양원에서 남의 몸을 닦느라 마디가 굵어진 손. 손톱 밑에 락스 냄새가 배어 있었다. 따뜻했다.<\/p>\n<p>따뜻하면 됐다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-0 / 07:40]<\/div>\n<p>병철 오빠의 전화가 온 건 엄마의 눈꺼풀이 한 번 떨렸을 때였다.<\/p>\n<p>\"이수… 들리나.\"<\/p>\n<p>목소리가 이상했다. 이빨이 부딪치는 소리가 단어 사이사이에 끼어 있었다.<\/p>\n<p>\"오빠? 어디예요. 오빠!\"<\/p>\n<p>\"현장… 보고. 의식… 아직 명료. 근데 춥다.\"<\/p>\n<p>뒤에서 웅웅 하는 콤프레서 소리가 들렸다. 나는 그 소리를 안다. 엿새 전 그 밤, 내 이름표가 붙은 빈 시신 백 옆에서 들었던 소리.<\/p>\n<p>\"냉장실… 온도… 자꾸 내려간다….\"<\/p>\n<p>뚝, 끊겼다.<\/p>\n<p>다시 걸었다. 전원이 꺼져 있다는 안내 음성. 카르테를 열었다. 0412조 단위 현황. 오병철의 혈액백 아이콘 위에 회색 자물쇠가 걸려 있었다.<\/p>\n<div class=\"doc\">오병철 — 후원 계약 불이행. 징계 처치 진행 중.<\/div>\n<p>불이행. 그는 내 꼬리표를 넣지 않았다.<\/p>\n<p>무진이 내 어깨 너머로 화면을 봤다. 그의 턱 근육이 한 번 꿈틀거렸다.<\/p>\n<p>\"…거래 안 할 거라며.\"<\/p>\n<p>\"안 했잖아. 그래서 저렇게 된 거잖아.\"<\/p>\n<p>\"그러니까.\"<\/p>\n<p>그가 나를 똑바로 봤다. 형광등 아래 그의 눈이 지나치게 까맸다.<\/p>\n<p>\"그날 밤 내가 감시하자고 했을 때. 네 왼쪽 귀, 빨갰어.\"<\/p>\n<p>나는 대답하지 못했다. 귀가 다시 달아오르는 게 느껴졌다. 그때 내가 '병철이는 안 할 거야'라고만 말하지 않았더라면. 조건이 도착했다는 걸, 원로가 그를 쥐고 있다는 걸 무진에게 다 말했더라면.<\/p>\n<p>무진은 오빠 곁에 붙어 있었을 것이다. 오빠는 혼자 냉장실로 끌려가지 않았을 것이다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-0 / 08:50]<\/div>\n<p>병동 복도 끝 창문으로 연건캠퍼스가 보였다. 의과대학 2동의 회색 지붕. 저 건물 지하 1층에서 십 분 뒤 땡시가 시작된다. 지하 2층에는 오빠가 얼어가고 있었다.<\/p>\n<p>카르테가 떴다.<\/p>\n<div class=\"doc\">블록 1 해부학 실습시험 입실 마감 09:00. 미입실 호명자는 DNR 처리됩니다.<\/div>\n<p>\"넌 시험장으로 가.\"<\/p>\n<p>무진이 내 앞을 막아섰다.<\/p>\n<p>\"내가 간다. 마스터키는 나한테 있어. 넌 지각하면 끝이야.\"<\/p>\n<p>\"아니.\"<\/p>\n<p>\"한이수.\"<\/p>\n<p>\"병철이는 내가 꺼내.\"<\/p>\n<p>말이 먼저 튀어나왔다. 목소리가 갈라졌다. 사투리가 샜다.<\/p>\n<p>\"니가 뭔디 나보고 가라 마라 해. 그 오빠가 나 업고 응급실 나온 사람이여. 내가 거짓말해서 저렇게 된 거여. 내가 안 가면, 나는 4등 안에 들어도 사람 아니여.\"<\/p>\n<p>무진이 숨을 한 번 들이켰다. 그리고 말없이 돌아서서 계단 쪽으로 뛰었다.<\/p>\n<p>나는 그 뒤를 따랐다. 그가 나를 기다려주는 속도로 뛰고 있다는 걸, 계단 세 층을 내려가서야 알았다.<\/p>\n<hr class=\"scene\">\n<p>냉장실 문은 서리로 하얗게 덮여 있었다.<\/p>\n<p>무진이 카드를 댔다. 삑, 하는 소리와 함께 문이 열렸다. 냉기가 얼굴을 후려쳤다. 속눈썹이 순식간에 뻣뻣해졌다. 숨을 들이쉬자 폐 안쪽이 얼음물에 담근 것처럼 쓰라렸다.<\/p>\n<p>온도계가 −6℃를 가리키고 있었다.<\/p>\n<p>오빠는 시신 선반 맨 아래 칸에 웅크려 있었다. 내 이름표가 붙어 있던 그 빈 시신 백을 몸에 반쯤 덮은 채로. 입술이 보랏빛이었다. 떨림이 멈춰 있었다.<\/p>\n<p>떨림이 멈췄다는 건, 좋은 신호가 아니다.<\/p>\n<p>\"오빠!\"<\/p>\n<p>나는 그의 얼굴을 두 손으로 감쌌다. 그리고 봤다.<\/p>\n<p>이마. 철문 모서리에 수십 번 머리를 박은 자국. 살갗이 찢어져 있었다. 그 틈에서 붉은 것이 아주 천천히, 실처럼 흘러내리고 있었다.<\/p>\n<p>빨갛다.<\/p>\n<p>귀가 먹먹해졌다. 수조 속에 머리를 박은 것처럼 콤프레서 소리가 멀어졌다. 시야 가장자리가 하얗게 바래기 시작했다. 무릎 안쪽 힘줄이 풀리려 했다.<\/p>\n<p>차가운 손바닥이 내 눈을 덮으려고 다가오는 게 느껴졌다.<\/p>\n<p>\"보지 마. 내 손만….\"<\/p>\n<p>\"아니.\"<\/p>\n<p>나는 무진의 손을 밀어냈다.<\/p>\n<p>그리고 피를 봤다. 끝까지 봤다.<\/p>\n<p>흘러내리고 있었다. 영하의 냉장실에서, 그래도 피는 흐르고 있었다. 회색 카데바들은 피를 흘리지 않는다. 오빠의 위를 열던 날에도, 그 몸에서는 한 방울도 나오지 않았다.<\/p>\n<p>이 피는 흐른다.<\/p>\n<p>일곱 살 오동도 방파제. 낚싯바늘에 꿰인 오빠의 손바닥. 피 흘리며 웃던 얼굴.<\/p>\n<p>\"피는 거짓말 안 해.\"<\/p>\n<p>내 입에서 오빠의 목소리가 나왔다.<\/p>\n<p>\"아직 살아 있다는 기다.\"<\/p>\n<p>시야가 돌아왔다. 하얗지 않았다. 빨갛고, 선명했다.<\/p>\n<hr class=\"scene\">\n<p>\"경동맥 촉지. 약해. 분당 사십.\"<\/p>\n<p>내 손가락이 오빠 목에 닿아 있었다. 무진이 가운을 벗어 오빠 몸을 감쌌다. 나는 오빠 손을 내 겨드랑이에 끼워 넣었다. 살갗이 닿는 순간 얼음을 껴안은 것처럼 몸이 움츠러들었다.<\/p>\n<p>\"오빠. 병철 오빠. 눈 떠요. 무전 쳐요, 무전!\"<\/p>\n<p>반응이 없었다. 나는 흉골 위에 깍지 낀 손을 올렸다. 맥이 끊기면 바로 누를 수 있게. 무진이 오빠의 기도를 확보하며 고개를 젖혔다.<\/p>\n<p>등 뒤에서 철컥, 소리가 났다.<\/p>\n<p>문이 닫혔다. 무진이 돌아보며 카드를 댔다. 빨간 불. 다시. 빨간 불.<\/p>\n<div class=\"doc\">감찰 권한 정지 — 집도의 명령.<\/div>\n<p>카드 단말기의 작은 화면에 그 한 줄이 떠 있었다. 무진이 철문을 주먹으로 쳤다. 둔한 쇳소리가 냉기 속에서 금세 죽었다.<\/p>\n<p>\"…밖에서만 열리는 문이야.\"<\/p>\n<p>그가 처음으로 목소리를 떨었다.<\/p>\n<p>08:58.<\/p>\n<p>그때, 내 품 안에서 오빠가 기침을 했다.<\/p>\n<p>\"…콜록. 아이고. 천국이 와 이리 춥노.\"<\/p>\n<p>\"오빠!\"<\/p>\n<p>오빠가 눈을 반쯤 떴다. 내 얼굴을, 그다음 자기 이마에서 흐르는 피를 묻힌 내 손을, 그리고 다시 내 얼굴을 봤다.<\/p>\n<p>\"…니 안 쓰러졌네.\"<\/p>\n<p>\"지금 그게 중요해요?\"<\/p>\n<p>\"중요하지. 이 아재가 이 년을 기다렸다.\"<\/p>\n<p>그가 떨리는 손을 들어 바닥을 가리켰다. 냉장실 한가운데, 철망이 덮인 네모난 배수구.<\/p>\n<p>\"저거. 밤새 저기다 대고 소리 질렀다. 위에서 물 내려가는 소리가 나더라. 실습실 세척 소리.\"<\/p>\n<p>\"…뭐라고요?\"<\/p>\n<p>\"실습실 바닥 배수구가 여기 집수정으로 떨어진다. 옛날 운구 수로 그대로 쓴 기다. 물은 아래로 가지만은.\"<\/p>\n<p>그가 씩 웃었다. 이마의 피가 눈썹을 타고 흘렀다.<\/p>\n<p>\"사람은 거꾸로 올라가면 된다. 구조대 기본이다.\"<\/p>\n<hr class=\"scene\">\n<p>배수구 철망은 녹슬어 있었다. 무진이 두 손으로 철망을 잡고 비틀었다. 손바닥 살갗이 얼어붙은 쇠에 달라붙었다가 찢어지는 소리가 났다. 그는 얼굴 하나 찡그리지 않았다.<\/p>\n<p>철망이 뜯겨 나갔다. 아래로 좁은 수로가 비스듬히 위쪽을 향해 뻗어 있었다. 포르말린과 하수 냄새가 뒤섞여 올라왔다.<\/p>\n<p>무진이 오빠 앞에 등을 대고 쪼그려 앉았다.<\/p>\n<p>\"업혀요.\"<\/p>\n<p>\"됐다. 니한테 업힐 바에야 기어간다. 니 내한테 한 대 맞은 거 기억 안 나나.\"<\/p>\n<p>\"기억나요. 그러니까 업혀요.\"<\/p>\n<p>무진이 고개를 돌려 오빠를 봤다.<\/p>\n<p>\"그때 맞은 거, 지금 갚는 거예요.\"<\/p>\n<p>오빠가 잠깐 말이 없었다. 그러다 혀를 차며 무진의 목에 팔을 감았다.<\/p>\n<p>\"…이 자슥. 사람 혈관만 보는 줄 알았드만.\"<\/p>\n<p>무진이 일어섰다. 오빠의 무게에 그의 무릎이 한 번 흔들렸다가 버텼다.<\/p>\n<p>우리는 수로로 들어갔다. 콘크리트 벽에 어깨가 긁혔다. 무릎 아래로 얼음 같은 물이 찰박거렸다. 앞장선 나는 휴대폰 손전등을 입에 물고 기었다. 손바닥 아래로 미끈거리는 이끼, 녹슨 철근, 무언가의 뼛조각 같은 것.<\/p>\n<p>생각하지 않았다. 위로, 위로만 기었다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-0 / 09:04]<\/div>\n<p>머리 위에 철망이 보였다. 그 틈으로 형광등 빛이 쏟아졌다. 그리고 소리. 백이십 명이 동시에 숨죽인 소리. 연필이 종이를 긁는 소리.<\/p>\n<p>나는 손바닥으로 철망을 밀었다.<\/p>\n<p>해부학 실습실 바닥 한가운데로, 하수 냄새를 뒤집어쓴 내가 기어 나왔다.<\/p>\n<p>스테인리스 실습대 마흔 개가 원을 그리며 늘어서 있었다. 대마다 흰 시트, 그 위에 핀이 꽂힌 표본. 무명 동기들이 일제히 나를 돌아봤다. 감독 조교가 입을 벌린 채 굳었다.<\/p>\n<p>주머니 속 카르테가 길게 울었다.<\/p>\n<div class=\"doc\">입실 지각 — 한이수. DNR 처리 중.<\/div>\n<div class=\"doc\">잔여 시간 00:00:30<\/div>\n<p>진행 바가 줄어들고 있었다. 나는 젖은 무릎으로 일어나지도 못한 채 그 화면을 봤다. 손가락 끝이 얼어서 화면이 눌리지도 않았다.<\/p>\n<p>그때 누군가 내 손을 낚아챘다.<\/p>\n<p>장갑 낀 손. 손목에 붉은 동백 브로치가 꽂힌 소매.<\/p>\n<p>강하린이었다.<\/p>\n<p>그녀가 내 손바닥을 펴고 무언가를 쑤셔 넣었다. 차가운 금속. 음각된 숫자. No.0409.<\/p>\n<p>\"내 1단위, 가져가.\"<\/p>\n<p>하린은 나를 보지 않았다. 턱을 치켜든 그 거만한 옆얼굴로, 감독 조교 쪽만 노려보며 말했다.<\/p>\n<p>\"땡시 중 수혈 허용이랬지. 니가 룰 구멍 찔러서 생긴 거잖아, 시골 쥐.\"<\/p>\n<p>\"…니가 왜.\"<\/p>\n<p>\"착각하지 마. 빚이야. 나중에 받을 거야.\"<\/p>\n<p>내 손바닥을 누르는 그녀의 손가락이 떨리고 있었다. 늘 비싼 핸드크림 냄새가 나던 손이었다. 지금은 포르말린 냄새뿐이었다.<\/p>\n<p>카르테가 깜빡였다.<\/p>\n<div class=\"doc\">강하린 → 한이수 1 Unit 수혈 확인. DNR 처리 보류.<\/div>\n<p>등 뒤 배수구에서 무진이 오빠를 끌어올리는 소리가 났다. 오빠가 바닥에 굴러 나오며 쉰 목소리로 중얼거렸다.<\/p>\n<p>\"…현장 도착. 환자 세 명, 전원 의식 있음. 분위기, 시험장.\"<\/p>\n<p>누군가 웃음을 터뜨리려다 삼켰다.<\/p>\n<p>그 순간, 천장 스피커에서 종이 울렸다.<\/p>\n<p>땡.<\/p>\n<p>땡시의 첫 종이었다. 동기들이 일제히 1번 스테이션 쪽으로 몸을 돌렸다. 나는 하린의 꼬리표를 쥔 채 원의 끝을 봤다.<\/p>\n<p>40번, 마지막 스테이션.<\/p>\n<p>다른 실습대보다 길었다. 시트가 사람 하나를 통째로 덮고 있었다. 시트 끝으로 엄지발가락이 삐져나와 있었다. 흰 식별표 아래 묶인 검은 금속 꼬리표.<\/p>\n<div class=\"doc\">No.0412<\/div>","chars":5281},{"title":"땡시","html":"<div class=\"timer\">[D-0 / 땡시 09:05]<\/div>\n<p>땡.<\/p>\n<p>1번 스테이션. 핀이 꽂힌 상완의 신경 하나. 나는 젖은 손으로 연필을 쥐었다.<\/p>\n<p><em>N. musculocutaneus.<\/em><\/p>\n<p>글씨가 떨리지 않았다. 손톱 밑에 낀 하수구 이끼가 답안지에 초록 얼룩을 남겼다. 오른쪽 귓구멍 깊숙이 박아 넣은 콩알만 한 이어피스가 지직거렸다.<\/p>\n<p>\"…들리나. 여기는 준비실. 구급 1호차 정상 가동.\"<\/p>\n<p>병철 오빠였다. 이마에 거즈를 붙이고, 무진의 가운을 두른 채.<\/p>\n<p>땡.<\/p>\n<hr class=\"scene\">\n<p>종이 울릴 때마다 1분. 마흔 개의 스테이션. 핀이 가리키는 구조물의 이름을 쓰고, 종이 울리면 오른쪽 대로 한 칸 옮긴다. 돌아갈 수 없다. 고칠 수 없다.<\/p>\n<p>선배들은 이걸 땡시라고 불렀다. 나는 오늘 처음으로 그 이름이 왜 그렇게 가벼운지 알았다. 무거우면 아무도 못 버티니까.<\/p>\n<p>2번. 3번. 4번.<\/p>\n<p><em>A. axillaris. V. cephalica. Plexus brachialis.<\/em><\/p>\n<p>연필심이 종이를 긁는 소리가 백이십 개 겹쳐 빗소리처럼 들렸다. 실습실 천장 모서리마다 검은 반구형 CCTV가 매달려 있었다. 그중 하나에서 빨간 불이 깜빡였다.<\/p>\n<p>지금 이 순간에도 관람실의 와인잔들이 나를 보고 있었다.<\/p>\n<p>\"무진이 서버 들어갔다.\"<\/p>\n<p>오빠의 목소리가 낮아졌다.<\/p>\n<p>\"카르테 공지 채널, 관리자 권한으로 열었다 카네. 근데 이 자슥, 손이 좀 떤다.\"<\/p>\n<p>땡.<\/p>\n<p>7번. 핀이 꽂힌 건 손바닥의 엄지두덩이었다. <em>Thenar eminence.<\/em> 오빠의 아틀라스에 핀 구멍이 뚫려 있던 바로 그 자리.<\/p>\n<p>열쇠는 메스를 쥔 자의 손에 있다.<\/p>\n<p>나는 답을 썼다. 그리고 눈을 들어 원의 끝을 봤다. 40번 스테이션, 사람 하나를 통째로 덮은 시트. 아직 서른세 번의 종이 남아 있었다.<\/p>\n<p>주머니 속 카르테가 짧게 떨었다. 시험 중 휴대폰 소지는 부정행위다. 그런데 이 방의 호명자 일곱 명 전원의 주머니가 동시에 떨고 있었다.<\/p>\n<div class=\"doc\">땡시 특별 증례 — 종료 종 전까지 타 호명자 꼬리표 탈취 시 +2 Unit.<\/div>\n<p>땡.<\/p>\n<p>8번으로 옮기는 순간, 누군가 내 뒷목을 낚아챘다. 꼬리표 끈이 목살을 파고들었다. 숨이 컥 막혔다. 0415조의 남자애였다. 이름도 모르는 얼굴. 눈 흰자위가 핏발로 붉었다.<\/p>\n<p>\"미안. 미안해. 나 1단위야.\"<\/p>\n<p>끈이 끊어지기 직전, 그의 손목이 꺾였다.<\/p>\n<p>\"시험 중엔 정숙해야지.\"<\/p>\n<p>강하린이었다. 9번 스테이션에서 연필도 내려놓지 않은 채, 다른 손으로 그의 엄지를 뒤로 젖히고 있었다. 남자애가 신음을 삼켰다. 감독 조교가 고개를 돌리기 전에 하린은 손을 놓았다.<\/p>\n<p>\"내 1단위 들어간 몸이야. 흠집 내지 마.\"<\/p>\n<p>그녀는 나를 보지도 않고 답을 썼다. 나는 목에 남은 끈 자국을 손끝으로 더듬었다. 화끈거렸다. 아직 붙어 있었다.<\/p>\n<p>땡.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-0 / 땡시 09:21]<\/div>\n<p>\"관람실 시끄럽다.\"<\/p>\n<p>이어피스 너머로 다른 목소리가 끼어들었다. 무진이었다. 그의 목소리는 언제나처럼 짧고 차가웠다. 그런데 숨이 섞여 있었다.<\/p>\n<p>\"강씨 쪽 원로들이 아버지를 물고 늘어졌어. 0412 배정은 과했다고. 쇼가 아니라 증거를 남긴 거라고.\"<\/p>\n<p>\"그래서.\"<\/p>\n<p>나는 입술을 움직이지 않고 속삭였다. 마스크가 숨에 축축해졌다.<\/p>\n<p>\"서로 물어뜯는 동안은 아무도 공지 채널을 안 봐. 지금이야.\"<\/p>\n<p>땡.<\/p>\n<p>22번. 횡격막의 대정맥 구멍. <em>Foramen venae cavae.<\/em> 피는 심장으로 돌아간다. 오빠가 족보 맨 뒤에 적어둔 문장이 연필 끝에서 저절로 따라 나왔다.<\/p>\n<p>\"지아한테 신호 보냈다.\"<\/p>\n<p>병철 오빠였다.<\/p>\n<p>\"턴오버 업로드 대기. 검은 리본 계정 서른두 개, 동시에 쏜다. 그리고 실습실 방송 장비, 내가 무전기로 물렸다. 구급대에서 젤 많이 한 게 고장 난 무전기 살리는 기다.\"<\/p>\n<p>\"오빠, 머리는요.\"<\/p>\n<p>\"멀쩡하다. 니 덕에 피가 아직 돈다 아이가.\"<\/p>\n<p>땡.<\/p>\n<p>24번에서 나는 감독 조교와 눈이 마주쳤다. 그녀가 내 귓바퀴 쪽을 봤다. 나는 숨을 멈췄다. 그녀의 가운 왼쪽 깃이 비어 있었다. 메스 핀도, 동백도 없었다. 무명.<\/p>\n<p>그녀는 아무것도 못 본 척 다음 줄로 걸어갔다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-0 / 땡시 09:36]<\/div>\n<p>37번 스테이션에 섰을 때, 누군가 내 옆에 섰다.<\/p>\n<p>무진이었다. 감찰 완장을 찬 흰 가운. 감독관처럼 뒷짐을 지고 있었다. 실습실 문을 어떻게 지나왔는지 묻지 않았다. 그의 손바닥에 냉장실 철망이 남긴 상처가 거즈 밖으로 붉게 번져 있었다.<\/p>\n<p>그 붉은색을 봐도, 이제 세상이 하얘지지 않았다.<\/p>\n<p>그가 뒷짐 진 손에서 휴대폰 하나를 내 손바닥으로 밀어 넣었다. 화면에 버튼 하나.<\/p>\n<div class=\"doc\">전체 송출<\/div>\n<p>그 위로 미리보기 창이 떠 있었다. 흑차트 스캔 312장. 위조 기증 서약서 11건. 그리고 오빠의 영상.<\/p>\n<p>2년 전 3월의 제0표본실. 흑차트를 촬영하는 오빠의 뒷모습. 그리고 그 뒤, 유리병 그림자 사이에서 망을 보는 앳된 얼굴.<\/p>\n<p>서무진.<\/p>\n<p>손가락이 버튼 위에서 멈췄다.<\/p>\n<p>이걸 누르면 저 얼굴도 나간다. 백이십 명의 휴대폰으로, 턴오버로, 내일 아침 뉴스로. 무진은 그날 밤 오빠를 내린 손으로 기소될 것이다. 오빠의 몸은 국과수 부검대 위에서 한 번 더 열릴 것이다. 그리고 엄마는.<\/p>\n<p>땡.<\/p>\n<p>38번으로 옮기는 내 다리가 무거웠다. 답안지에 아무것도 쓰지 못했다.<\/p>\n<p>\"…니 얼굴도 나가.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"니 아부지도. 니도. 다 끝나.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"그라믄 왜….\"<\/p>\n<p>목소리가 사투리로 무너졌다. 마스크 안쪽이 젖어 들었다. 짠맛이 입술에 닿았다.<\/p>\n<p>\"니가 왜 그걸 감당해야 되는디. 니는 그때 겨우 예과 1학년이었어. 니는 그냥, 형 따라간 거잖아.\"<\/p>\n<p>무진이 뒷짐을 풀었다.<\/p>\n<p>그의 손이 내 손등 위에 얹혔다. 냉장실에서 쇠에 찢긴 손바닥이 따뜻했다. 그가 내 손가락 위로 자기 손가락을 겹쳤다. 아프지 않을 만큼, 그러나 빠져나갈 수 없을 만큼.<\/p>\n<p>\"형이 원한 거야.\"<\/p>\n<p>그가 내 귀에만 들리게 말했다.<\/p>\n<p>\"나도.\"<\/p>\n<p>우리는 같이 눌렀다.<\/p>\n<hr class=\"scene\">\n<div class=\"timer\">[D-0 / 땡시 09:39]<\/div>\n<p>땡.<\/p>\n<p>서른아홉 번째 종이 울린 순간, 실습실 벽면의 모든 모니터가 동시에 켜졌다.<\/p>\n<p>시험 안내 화면이 사라졌다. 그 자리에 흑차트의 첫 장이 떴다. 1985년. 이름. 처치 완료. 극단적 선택 처리.<\/p>\n<p>동기들의 주머니에서 일제히 진동이 울렸다. 백이십 대의 휴대폰이 한꺼번에 떠는 소리는 벌집을 걷어찬 것 같았다. 감독 조교가 자기 휴대폰을 꺼내 보고 손으로 입을 막았다.<\/p>\n<p>턴오버 알림. 카르테 공지. 실습실 스피커.<\/p>\n<p>그리고 오빠의 목소리.<\/p>\n<p>\"…이수야. 이걸 보면 넌 여기 있으면 안 돼.\"<\/p>\n<p>천장 스피커에서, 2년 전의 오빠가 말하고 있었다. 장난스럽고, 조금 쉰 목소리.<\/p>\n<p>\"근데 니는 있겠지.\"<\/p>\n<p>누군가 흐느꼈다. 지아였다. 그녀는 실습실 문간에 서 있었다. 가슴에 검은 리본을 달고, 손에 든 노트북 화면을 높이 쳐든 채.<\/p>\n<div class=\"doc\">[턴오버] 서울의대 해부학교실 시신 위조 기증 — 원본 312장 공개<\/div>\n<p>조회수가 숫자를 셀 수 없는 속도로 올라가고 있었다.<\/p>\n<p>이어피스 너머로 병철 오빠가 숨을 몰아쉬었다.<\/p>\n<p>\"관람실 화면도 다 우리 거다. 원로들 지금 와인잔 엎고 일어선다. 문 쪽으로 뛰는 사람, 셋. 넷.\"<\/p>\n<p>\"전부 찍혀요?\"<\/p>\n<p>\"얼굴 다 나간다. 지들이 깔아놓은 카메라로.\"<\/p>\n<p>나는 천장의 빨간 불을 올려다봤다. 열흘 동안 나를 핥던 렌즈였다. 지금은 그 렌즈가 반대쪽을 보고 있었다.<\/p>\n<hr class=\"scene\">\n<p>실습실 뒷문이 열렸다.<\/p>\n<p>발소리. 느리고 정확한 걸음. 무진의 어깨가 먼저 굳었다. 나는 돌아보지 않아도 알았다. 이틀 전 그 표본실에서, 서가 틈으로 들었던 리듬.<\/p>\n<p>서정혁 교수가 걸어 들어왔다.<\/p>\n<p>흰 가운. 왼쪽 깃의 은색 메스 핀. 손에는 메스 한 자루가 들려 있었다. 동기들이 그를 위해 길을 열었다. 아무도 비명을 지르지 않았다. 그는 첫 실습 날 연단에서 \"카데바는 여러분의 첫 번째 스승\"이라고 말하던 그 온화한 얼굴 그대로였다.<\/p>\n<p>\"이수 학생.\"<\/p>\n<p>그가 40번 스테이션 앞에 선 나를 보며 웃었다.<\/p>\n<p>\"시험 중엔 휴대폰을 쓰면 안 되지. 부정행위야.\"<\/p>\n<p>\"선생님이 하실 말씀은 아닌 것 같은데요.\"<\/p>\n<p>내 목소리는 떨리지 않았다. 왼쪽 귀도 뜨겁지 않았다.<\/p>\n<p>그가 한 걸음 다가왔다. 메스 날이 형광등을 받아 하얗게 빛났다. 포르말린 냄새 사이로 그의 애프터셰이브 향이 스쳤다. 시더우드. 우아하고 차가운 냄새.<\/p>\n<p>\"도윤이도 꼭 너처럼 말했지. 마지막까지.\"<\/p>\n<p>그의 손이 시트 쪽으로 뻗었다. 0412의 얼굴을 덮은 시트로.<\/p>\n<p>\"보여줄까? 네가 그동안 메스를 대던 게 누구였는지. 저 카메라 앞에서.\"<\/p>\n<p>그 손목을, 다른 손이 붙잡았다.<\/p>\n<p>무진이었다.<\/p>\n<p>메스를 쥔 아버지의 손목. 무진의 손가락이 정확히 요골동맥 위를 짚고 있었다. 맥을 재는 의사처럼. 급소를 아는 사람처럼.<\/p>\n<p>천장의 CCTV 빨간 불이 깜빡였다. 송출은 끝나지 않았다. 관람실로, 턴오버로, 백이십 대의 휴대폰으로, 지금 이 장면이 그대로 나가고 있었다.<\/p>\n<p>\"무진아.\"<\/p>\n<p>서정혁의 목소리가 처음으로 낮아졌다.<\/p>\n<p>\"손 놔라. 너는 내 아들이다.\"<\/p>\n<p>\"그래서 말하는 거예요.\"<\/p>\n<p>무진의 목소리는 짧고 차가웠다. 그런데 그 끝이 무너지고 있었다. 이 세상에서 나만 들을 수 있는 방식으로.<\/p>\n<p>그가 카메라를 올려다봤다.<\/p>\n<p>\"2년 전 3월, 새벽. 해부학 실습실. 한도윤 선배는 자살하지 않았습니다.\"<\/p>\n<p>손목을 쥔 그의 손등에 핏줄이 섰다.<\/p>\n<p>\"아버지가 형을 죽였어요. 제가 형을 내렸습니다.\"<\/p>\n<p>실습실이 숨을 멈췄다. 백이십 명이 동시에 침을 삼키는 소리가 들렸다.<\/p>\n<p>나는 0412의 시트 위에 손을 얹었다. 천 너머로 차가운 어깨가 느껴졌다. 2년 동안 4℃에 누워 있던 몸. 내가 열흘 동안 메스를 대던 몸.<\/p>\n<p>오빠. 들었어?<\/p>\n<p>시트 아래에서 대답은 없었다. 대신 무진의 손등에 선 핏줄이 한 번 크게 뛰었다. 그가 아버지의 손목을 놓지 않은 채, 아주 짧게 나를 봤다. 그 눈이 젖어 있었다.<\/p>\n<hr class=\"scene\">\n<p>땡.<\/p>\n<p>마흔 번째 종이었다.<\/p>\n<p>실습실 앞문이 부서질 듯 열렸다. \"경찰입니다! 전원 그 자리에!\" 제복들이 쏟아져 들어왔다. 맨 앞의 혜화지구대 경위가 준비실 쪽을 돌아보며 고개를 끄덕였다. 거즈를 붙인 병철 오빠가 무전기를 들어 보였다.<\/p>\n<p>\"상황 종료. 환자 인계합니다.\"<\/p>\n<p>서정혁은 저항하지 않았다. 메스가 그의 손가락에서 미끄러져 스테인리스 바닥에 떨어졌다. 맑은 쇳소리가 실습실 끝까지 울렸다.<\/p>\n<p>그는 웃고 있었다.<\/p>\n<p>수갑이 그의 손목에 채워졌다. 경찰이 그를 끌고 가며 내 옆을 지나쳤다. 그가 고개를 아주 조금 숙였다. 시더우드 냄새가 다시 한 번 코끝을 스쳤다.<\/p>\n<p>우아하고, 온화한 목소리가 내 귓바퀴에 닿았다.<\/p>\n<p>\"나는 집도의일 뿐이야.\"<\/p>\n<p>그의 숨이 차가웠다.<\/p>\n<p>\"널 이 조에 넣으라고 명한 건 — 원장님이시다.\"<\/p>","chars":4915},{"title":"생존자 1명","html":"<div class=\"doc\">[선별 종료 / 3월 13일 12:00]<\/div>\n<p>땡.<\/p>\n<p>정오의 종이 울렸을 때, 실습실에는 경찰 폴리스라인이 둘러져 있었다.<\/p>\n<p>카르테 화면이 하얗게 번졌다. 혈액백 아이콘이 하나씩 터지듯 사라졌다. 랭킹도, 후원 알림도, 검은 바탕의 흰 십자도. 마지막으로 남은 건 텅 빈 흰 화면뿐이었다.<\/p>\n<p>아무도 승급하지 않았다.<\/p>\n<p>나는 40번 스테이션 앞 바닥에 주저앉아 그 흰 화면을 오래 봤다. 손바닥에 하린의 꼬리표가 아직 쥐여 있었다. 금속이 체온에 미지근해져 있었다.<\/p>\n<hr class=\"scene\">\n<p>그 뒤의 일주일은 뉴스로 기억된다.<\/p>\n<div class=\"doc\">[속보] 서울의대 해부학교실 압수수색… &quot;시신 기증 서약서 위조 정황&quot;<\/div>\n<div class=\"doc\">[단독] 해부학 주임교수 서모 씨 구속… 2년 전 의대생 사망 사건 재수사<\/div>\n<p>혜화역 4번 출구 편의점 TV에서, 국밥집 벽걸이 TV에서, 기숙사 휴게실에서. 화면 속 서정혁은 수갑을 찬 채 고개를 숙이지 않았다. 카메라를 향해 아주 조금 웃었다.<\/p>\n<p>그런데 이상했다.<\/p>\n<p>원로 명단은 312장 중 4장에 걸쳐 있었다. 이름 스물여섯 개. 뉴스에 나온 건 열세 개였다. 나머지 열세 개는 기사마다, 채널마다, 똑같이 모자이크되거나 빠져 있었다.<\/p>\n<p>\"누가 언론을 쥐고 있네.\"<\/p>\n<p>국밥집에서 병철 오빠가 깍두기를 씹으며 말했다. 이마의 거즈는 반창고로 바뀌어 있었다. 그의 휴대폰에 부산 병원 문자가 떠 있었다. 오병철 님 보호자 — 최정자 님 승모판막 치환술 정상 종료. 원래 순번 그대로였다.<\/p>\n<p>\"절반만 잡은 기다. 꼬리 자르고 대가리 숨긴 거지.\"<\/p>\n<p>나는 대답 대신 TV를 봤다. 서울대병원 명예원장의 기자회견이 나오고 있었다. 백발의 노인이 허리를 깊이 숙였다.<\/p>\n<p>\"참담한 일입니다. 병원은 수사에 전적으로 협조하겠습니다.\"<\/p>\n<p>그 옆에서 강하린이 울고 있었다. 할아버지의 가슴에 얼굴을 묻은 채. 노인의 주름진 손이 그녀의 등을 천천히 쓸었다. 인자한 손이었다.<\/p>\n<hr class=\"scene\">\n<div class=\"doc\">[3월 14일 / 서울중앙지검]<\/div>\n<p>검찰청 복도는 형광등이 너무 밝았다. 대기 의자의 인조가죽이 허벅지에 쩍 달라붙었다. 커피 자판기가 웅웅 울었다.<\/p>\n<p>무진이 조사실에서 나온 건 밤 열한 시였다. 수갑은 없었다. 대신 변호사와 수사관이 양옆에 붙어 있었다. 열네 시간 만이었다. 그의 셔츠 깃이 땀에 젖어 구겨져 있었다.<\/p>\n<p>나는 일어섰다. 그가 나를 보고 걸음을 멈췄다.<\/p>\n<p>\"왜 왔어.\"<\/p>\n<p>\"몰라.\"<\/p>\n<p>\"가. 기자들 있어.\"<\/p>\n<p>\"니가 뭔디 나보고 가라 마라 해.\"<\/p>\n<p>그가 숨을 내쉬었다. 웃음인지 한숨인지 모를 소리였다. 수사관이 시계를 봤다. 1분, 하고 손가락 하나를 들었다.<\/p>\n<p>땡시처럼.<\/p>\n<p>무진이 내 앞에 섰다. 손을 들었다가, 내 눈 앞에서 멈췄다. 첫 실습 날처럼 눈을 가리려는 손이었다. 그러다 그는 손을 내렸다. 대신 내 손목을 잡았다. 엄지가 내 맥을 찾았다.<\/p>\n<p>\"이제 안 가려도 되지.\"<\/p>\n<p>\"응. 이제 안 가려도 돼.\"<\/p>\n<p>\"…다행이다.\"<\/p>\n<p>그 말을 하는 그의 목소리가 무너졌다. 나만 들을 수 있는 방식으로. 수사관이 헛기침을 했다. 그는 손을 놓고 복도 끝으로 걸어갔다. 한 번도 돌아보지 않았다. 나는 손목에 남은 그의 체온이 식을 때까지 서 있었다.<\/p>\n<hr class=\"scene\">\n<div class=\"doc\">[3월 17일]<\/div>\n<p>오빠는 국과수에서 돌아왔다.<\/p>\n<p>부검 결과지 한 장. 사인: 경부 압박에 의한 질식, 타살 추정. 발등의 결박흔. 위 내 이물 제거 흔적. 그리고 맨 아래, 담당 법의관이 손으로 덧붙인 한 줄.<\/p>\n<div class=\"doc\">좌측 제5수지 구 골절 유합, 우측 수장부 갈고리형 반흔. 가족 진술과 일치.<\/div>\n<p>엄마가 그 종이를 두 손으로 받았다. 요양원에서 남의 몸을 닦던 굵은 손마디가 하얗게 떨렸다. 엄마는 2년 전 KTX 안에서처럼 울지 않았다. 대신 종이를 가슴에 대고, 아주 오래 숨을 쉬었다.<\/p>\n<p>\"…가벼웠어야. 그때 그거.\"<\/p>\n<p>엄마가 말했다.<\/p>\n<p>\"유골함이 너무 가벼웠어야. 내가 알았어야 했는디.\"<\/p>\n<p>나는 엄마를 안았다. 엄마 몸에서 락스와 병원 비누 냄새가 났다.<\/p>\n<hr class=\"scene\">\n<div class=\"doc\">[3월 18일 / 23:00]<\/div>\n<p>혜화역 국밥집, 구석 4인석.<\/p>\n<p>병철 오빠, 지아, 그리고 무진. 무진은 검찰 조사 중이었다. 공범 혐의, 증거 은닉, 사체 유기 방조. 변호사가 붙었고, 휴학계가 처리됐다. 오늘은 조사 사이 잠깐 풀려난 저녁이었다.<\/p>\n<p>\"순대국 넷이요. 하나는 순대 빼고.\"<\/p>\n<p>병철 오빠가 무진을 가리켰다.<\/p>\n<p>\"이 자슥 순대 못 먹는다 카더라. 해부학 수석이 내장을 못 먹는다. 이기 말이 되나.\"<\/p>\n<p>\"…먹을 수 있어요. 안 먹는 거예요.\"<\/p>\n<p>\"그기 그기다.\"<\/p>\n<p>지아가 웃음을 터뜨렸다. 그녀의 가슴에 검은 리본은 없었다. 대신 복학 신청서 접수증이 가방에 꽂혀 있었다. 그녀가 국물을 한 숟갈 뜨다가 나를 봤다.<\/p>\n<p>\"이수야. 너 그 꼬리표 아직 갖고 있어?\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"버려.\"<\/p>\n<p>\"…응.\"<\/p>\n<p>국밥 김이 안경에 서렸다. 깍두기 국물 냄새, 소주잔 부딪는 소리, 옆 테이블 의대생들의 시험 얘기. 검은 꼬리표를 보기 전의 평범한 밤이 잠깐 이 테이블에 돌아와 앉은 것 같았다.<\/p>\n<p>무진이 나를 보고 있었다. 그러다 아주 작게 웃었다. 나는 그가 웃는 걸 처음 봤다.<\/p>\n<p>\"뭐.\"<\/p>\n<p>\"지금 빨개.\"<\/p>\n<p>\"뭐가.\"<\/p>\n<p>\"왼쪽 귀.\"<\/p>\n<p>나는 귀를 손으로 덮었다. 손바닥 아래에서 귓바퀴가 뜨거웠다. 병철 오빠가 숟가락을 내려놓고 박수를 쳤다.<\/p>\n<p>\"무전 칩니다. 현장 분위기, 수상함. 매우 수상함.\"<\/p>\n<p>그날 밤 기숙사에서, 나는 오빠의 아틀라스를 끌어안고 잤다. 핀 구멍이 뚫린 페이지들이 뺨에 까슬하게 닿았다. 종이에서 오래된 토너 냄새가 났다.<\/p>\n<p>유골함보다 무거웠다. 그게 좋았다.<\/p>\n<hr class=\"scene\">\n<div class=\"doc\">[3월 19일 / 해부학 감사제]<\/div>\n<p>의과대학 1동 강당. 흰 국화가 단상 아래를 덮고 있었다.<\/p>\n<p>해마다 학기 말에 하는 해부학 감사제가, 올해는 3월에 한 번 더 열렸다. 고은채 조교가 시신 관리실 이름으로 요청했다고 했다. 기증이 아니었던 열한 분을 위해서.<\/p>\n<p>내 이름이 불렸다. 나는 단상에 올라 접은 종이를 폈다. 마이크가 내 숨소리를 크게 키웠다.<\/p>\n<p>\"0412 선생님께.\"<\/p>\n<p>목소리가 한 번 갈라졌다. 나는 다시 읽었다.<\/p>\n<p>\"선생님은 제 첫 번째 스승이었습니다. 저는 선생님의 가슴을 열었고, 손을 열었고, 위를 열었습니다. 그동안 저는 한 번도 쓰러지지 않았습니다. 피가 없었으니까요.\"<\/p>\n<p>강당은 조용했다. 누군가 코를 훌쩍이는 소리만 들렸다.<\/p>\n<p>\"근데 오빠.\"<\/p>\n<p>종이에 없는 말이 나왔다. 사투리가 샜다.<\/p>\n<p>\"나 이제 피 봐도 안 쓰러져. 병철이 오빠 이마 피 보고도 안 쓰러졌당께. 오빠가 그랬잖아. 피는 거짓말 안 한다고. 아프면 아픈 거고, 흐르면 산 거라고.\"<\/p>\n<p>손이 떨려서 종이가 바스락거렸다.<\/p>\n<p>\"그러니까 이제 나 걱정 말고. 밥 먹었냐고 묻지 말고. …내가 물을게. 오빠, 밥 먹었나.\"<\/p>\n<p>2년 전에 답장하지 못한 문자였다.<\/p>\n<p>나는 단상을 내려왔다. 맨 앞줄의 엄마가 손수건을 내밀었다. 그 옆자리의 고은채가 흰 국화 한 송이를 내 손에 쥐여줬다.<\/p>\n<hr class=\"scene\">\n<div class=\"doc\">[3월 20일]<\/div>\n<p>서울대병원 장례식장 특1호실.<\/p>\n<p>영정 속 오빠는 웃고 있었다. 예과 때 찍은 학생증 사진이었다. 'ㅎ' 꼭지를 왼쪽으로 삐뚜름하게 쓰던 사람답게, 사진 속에서도 고개가 살짝 왼쪽으로 기울어 있었다.<\/p>\n<p>이번 관은 무거웠다. 운구하던 병철 오빠가 \"아이고, 니 오빠 살 좀 쪘네\" 하다가 혼자 울었다.<\/p>\n<p>조문객 줄은 길었다. 동기들, 무명의 선배들, 턴오버를 보고 찾아온 모르는 얼굴들. 나는 상주 자리에서 한 사람씩 손을 잡았다. 차가운 손, 땀 찬 손, 떨리는 손.<\/p>\n<p>끝에서 두 번째는 강하린이었다.<\/p>\n<p>검은 원피스. 붉은 동백 브로치는 없었다. 그녀는 향을 꽂고, 절을 하고, 일어서서 내 앞에 섰다. 눈가가 부어 있었다. 화장으로도 가려지지 않았다.<\/p>\n<p>\"꼬리표.\"<\/p>\n<p>그녀가 손바닥을 내밀었다. 나는 상복 주머니에서 No.0409를 꺼내 그 위에 올려놓았다. 하린이 금속을 쥐었다. 손가락 마디가 하얘지도록.<\/p>\n<p>\"빚은 이걸로 퉁 친 거 아니다, 시골 쥐.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"나중에 받으러 올 거야. 크게.\"<\/p>\n<p>그녀는 그렇게 말하고 돌아섰다. 돌아서는 순간 그녀의 어깨가 한 번 떨렸다. 그녀가 걸어간 곳에, 그녀의 할아버지가 있었다.<\/p>\n<p>줄 맨 끝에, 백발의 노인이 서 있었다.<\/p>\n<p>검은 양복. 지팡이. 뉴스에서 허리를 숙이던 그 얼굴. 서울대병원 명예원장, 강명헌.<\/p>\n<p>그가 내 손을 두 손으로 감쌌다. 마른 손이었다. 손바닥이 놀랍도록 따뜻했다. 오래된 한약 냄새와 고급 향수가 섞인 냄새가 났다.<\/p>\n<p>\"도윤이는 훌륭한 학생이었다.\"<\/p>\n<p>인자한 목소리였다. 할아버지가 손주에게 하는 목소리.<\/p>\n<p>\"너도 그렇구나.\"<\/p>\n<p>그의 엄지가 내 손등을 한 번 쓸었다. 정확히 요골동맥 위를. 맥을 짚듯이.<\/p>\n<p>그리고 그는 떠났다. 지팡이 소리가 복도 끝까지 또각또각 멀어졌다. 나는 그의 뒷모습에서 눈을 떼지 못했다. 검은 양복 왼쪽 깃에, 작은 브로치 하나가 달려 있었다.<\/p>\n<p>붉은 동백.<\/p>\n<hr class=\"scene\">\n<p>그날 밤 기숙사 방은 조용했다.<\/p>\n<p>나는 상복을 벗지도 못하고 침대에 걸터앉아 있었다. 손등에 그 엄지의 온기가 아직 남아 있는 것 같았다. 비누로 세 번 씻었는데도.<\/p>\n<p>휴대폰이 진동했다.<\/p>\n<p>화면이 저절로 켜졌다.<\/p>\n<p>나는 아무것도 누르지 않았다. 압수수색 다음 날 내 손으로 지웠던 앱이었다. 경찰 포렌식 팀이 서버째 들어냈다고 했다. 그런데 홈 화면 위로 검은 사각형이 번졌다. 설치 진행 바가 순식간에 차올랐다.<\/p>\n<p>검은 바탕에 흰 십자.<\/p>\n<p>그리고 이번에는, 혈액백이 없었다. 대신 은색 메스 한 자루가 화면 한가운데 천천히 떠올랐다.<\/p>\n<div class=\"doc\">KARTE<\/div>\n<p>글자가 한 줄씩 떠올랐다. 누군가 타이핑하듯이.<\/p>\n<div class=\"doc\">제79기 선별 종료.<\/div>\n<div class=\"doc\">생존자 1명 — 한이수.<\/div>\n<p>심장이 귓속에서 뛰었다. 쿵, 쿵. 창밖으로 대학로의 취객 웃음소리가 멀리 지나갔다. 열이레 전, 처음 그 앱이 깔리던 밤과 똑같은 소리였다.<\/p>\n<div class=\"doc\">원장의 명으로 귀하를 제80기 선별의 집도의로 임명합니다.<\/div>\n<div class=\"doc\">거부 시, 최순임 님의 차트가 열립니다.<\/div>\n<p>손끝이 얼어붙었다. 냉장실의 −6℃가 방 안으로 밀려 들어온 것 같았다. 나는 엄마에게 전화를 걸었다. 신호가 가는 동안 화면 위쪽에 작은 창이 겹쳐 떴다. 서울대병원 환자 조회 화면. 등록번호 칸.<\/p>\n<div class=\"doc\">000412-2<\/div>\n<p>여수로 내려간 엄마의 이름이, 아직 그 병원 전산에 살아 있었다.<\/p>\n<p>\"…여보세요? 이수냐?\"<\/p>\n<p>엄마의 잠긴 목소리가 들렸다. 나는 대답하지 못했다. 목구멍에 쓴 침이 고였다. 왼쪽 귀가 화끈 달아올랐다. 거짓말을 할 준비를 하고 있었다.<\/p>\n<p>\"응, 엄마. 아무 일 없어.\"<\/p>\n<p>화면 맨 아래, 발신자 서명란.<\/p>\n<div class=\"doc\">— 원장<\/div>\n<p>그 서명 옆에, 붉은 동백 한 송이가 피어 있었다.<\/p>","chars":4864}]},{"slug":"nameless","color":"#2B2547","title":"이름 없는 신입생은 7일 안에 사라진다","subtitle":"","genre":"현대 판타지 / 마법학교물 / 서바이벌 / 로맨스","logline":"아무에게도 하루 이상 기억되지 못하는 열여덟 살 강하루가, 서울 지하의 마법학교 명부원(名簿院)이 여는 7일간의 생존 시험 '낙명제(落名祭)'에 끌려 들어가, 마감 자정까지 명패를 지키고 자신의 잃어버린 진명(眞名)을 되찾지 못하면 세상에서 완전히 지워진다.","notice":"","chapters":[{"title":"신입이야?","html":"<p>[낙명제 개막까지 2시간 02분]<\/p>\n<p>새벽 3시 58분에 편의점 자동문이 열렸다.<\/p>\n<p>딩동, 하는 맥 빠진 소리. 나는 삼각김밥 유통기한을 확인하던 손을 멈추지 않았다. 이 시간에 오는 손님은 셋 중 하나다. 취객, 택시 기사, 아니면 컵라면 하나에 인생을 거는 재수생.<\/p>\n<p>그런데 냄새가 달랐다.<\/p>\n<p>쇠 냄새. 비 오는 날 녹슨 난간을 손으로 쥐었을 때 나는 냄새. 고개를 들자 노인이 계산대에 기대 서 있었다. 회색 코트 앞섶이 검게 젖어 있었다.<\/p>\n<p>젖은 게 아니었다. 피였다.<\/p>\n<p>\"저, 저기요. 119—\"<\/p>\n<p>노인의 손이 내 손목을 낚아챘다. 마른 나뭇가지 같은 손가락인데 힘이 무서웠다. 차가웠다. 손톱 밑까지 핏기가 없었다.<\/p>\n<p>\"네가….\"<\/p>\n<p>노인이 나를 올려다봤다. 흐린 눈동자가 내 얼굴 위를 천천히 더듬었다. 눈썹, 눈꼬리, 입매. 무언가를 맞춰 보는 사람처럼.<\/p>\n<p>\"네가 연이 딸이구나.\"<\/p>\n<p>나는 대답하지 못했다.<\/p>\n<p>연이가 누군지 몰랐다. 딸이라는 단어도 낯설었다. 나는 누구의 딸이었던 적이 없다. 신설동 보육원 앞 계단, 그게 내 출생지였다.<\/p>\n<p>\"사람 잘못 보셨어요. 일단 앉으세요, 구급차—\"<\/p>\n<p>\"시간이 없다.\"<\/p>\n<p>노인이 코트 안쪽에서 무언가를 꺼내 내 손바닥에 눌러 쥐여 줬다. 손바닥만 한 금속판. 동전처럼 묵직하고, 체온처럼 미지근했다.<\/p>\n<p>표면에는 아무것도 새겨져 있지 않았다.<\/p>\n<p>\"4시 44분. 신설동 유령역.\"<\/p>\n<p>노인이 쉰 목소리로 한 글자씩 끊어 말했다. 입가에서 피거품이 터졌다.<\/p>\n<p>\"0호선을 타라. 안 타면 넌 7일 안에 사라진다.\"<\/p>\n<p>\"무슨 말인지—\"<\/p>\n<p>\"이미 사라지고 있잖니.\"<\/p>\n<p>나는 입을 다물었다.<\/p>\n<p>노인의 시선이 내 명찰에 가 닿았다. 편의점 조끼 가슴팍, 매직으로 쓴 '강하루'. 노인이 웃었다. 우는 것처럼.<\/p>\n<p>\"하루. 하루만 기억되는 아이라고, 그렇게 지었구나.\"<\/p>\n<p>목뒤의 솜털이 일제히 섰다.<\/p>\n<p>어떻게 알았지. 그건 보육원 원장 선생님이 술에 취해 딱 한 번 했던 말이었다. 너는 이상하게 하루만 지나면 다들 잊어버려서, 그래서 하루야.<\/p>\n<p>오늘 아침에도 그랬다.<\/p>\n<p>교대하러 들어온 사장님이 나를 보고 눈을 동그랗게 떴다. \"어, 신입이야?\" 1년 4개월째 듣는 질문이었다. 나는 늘 그렇듯 \"네, 오늘부터요\" 하고 웃었다. 그게 편했다. 정정하는 것보다.<\/p>\n<p>담임도, 짝꿍도, 매일 아침 나를 처음 본다. 나는 그게 원래 그런 건 줄 알았다. 세상에는 그냥 그런 사람도 있는 거라고.<\/p>\n<p>\"할아버지, 저를 어떻게—\"<\/p>\n<p>자동문이 열렸다.<\/p>\n<p>딩동.<\/p>\n<p>이번엔 소리가 났는데도 바람이 들어오지 않았다. 공기가 멈춘 것 같았다. 냉장고 모터 소리마저 숨을 죽였다.<\/p>\n<p>청년이 들어왔다.<\/p>\n<p>검은 코트, 검은 머리. 키가 컸고 얼굴이 하얗다 못해 창백했다. 표정이 없었다. 무표정이 아니라, 표정이라는 게 원래 설치되지 않은 얼굴 같았다.<\/p>\n<p>오른손에만 장갑을 끼고 있었다.<\/p>\n<p>은색. 형광등 아래에서 물고기 비늘처럼 번들거리는 장갑.<\/p>\n<p>노인의 손이 내 손목에서 툭 떨어졌다.<\/p>\n<p>\"숨어라.\"<\/p>\n<p>노인이 입술만 움직였다. 나는 왜 그 말을 들었는지 모르겠다. 몸이 먼저 움직였다. 무릎이 꺾이고, 나는 계산대 밑으로 미끄러져 들어갔다. 담배 박스와 비닐봉지 뭉치 사이, 먼지 냄새.<\/p>\n<p>계산대 밑 틈새로 두 사람의 다리가 보였다.<\/p>\n<p>\"허문 사서님.\"<\/p>\n<p>청년의 목소리는 낮고 평평했다. 차가운 물이 바닥에 고이는 소리 같았다.<\/p>\n<p>\"명부원 금서고에서 참가 명패 하나가 사라졌습니다.\"<\/p>\n<p>\"그래서, 날 지우러 왔나. 제하야.\"<\/p>\n<p>\"명령입니다.\"<\/p>\n<p>\"그 사람 명령이겠지.\"<\/p>\n<p>대화가 끊겼다. 구두 굽이 바닥을 한 번 긁었다.<\/p>\n<p>나는 두 손으로 입을 틀어막았다. 심장이 갈비뼈를 안에서 두드렸다. 쿵, 쿵, 쿵. 이렇게 시끄러운데 저 사람한테 안 들릴 리가 없었다.<\/p>\n<p>은색 장갑이 노인의 가슴에 닿았다.<\/p>\n<p>거기 무언가가 달려 있었다. 내 손안에 있는 것과 똑같은 금속판. 다만 그쪽에는 글자가 새겨져 있었다. 許文. 한자 두 글자.<\/p>\n<p>청년이 그 글자 위에 손바닥을 얹고, 무언가를 읊조렸다.<\/p>\n<p>거꾸로였다. 말을 거꾸로 감은 테이프처럼, 음절들이 뒤에서부터 앞으로 빨려 들어갔다. 듣는 순간 어금니가 시렸다.<\/p>\n<p>\"문, 허….\"<\/p>\n<p>노인의 코트가 펄럭였다.<\/p>\n<p>바람이 없는데.<\/p>\n<p>그리고 노인이 무너졌다. 쓰러진 게 아니었다. 무너졌다. 모래성에 파도가 닿은 것처럼, 손끝부터, 머리카락부터, 회색 가루가 되어 흩어졌다. 재가 형광등 불빛 속에서 반짝이며 떨어졌다. 탄 종이 냄새가 났다.<\/p>\n<p>비명을 지르려고 했다. 목구멍에서 아무 소리도 나오지 않았다.<\/p>\n<p>몇 초. 계산대 앞에는 코트도, 피도 남지 않았다. 바닥 위에 재 한 줌이 소복했다. 그것마저 청년이 지나가자 흩날려 사라졌다.<\/p>\n<p>나는 계산대 밑 모니터를 봤다.<\/p>\n<p>CCTV 화면. 4분할 중 계산대 쪽 화면이 3시 58분부터 되감기듯 지직거렸다. 문이 열리고, 아무도 들어오지 않았다. 내가 혼자 계산대에 서서 허공에 대고 말을 하다가, 혼자 쪼그려 앉았다.<\/p>\n<p>노인이 없었다.<\/p>\n<p>처음부터.<\/p>\n<p>손안의 금속판을 너무 세게 쥐어서 모서리가 손바닥을 파고들었다. 아니, 손바닥이 아니었다. 아까 쪼그려 앉을 때 계산대 철제 모서리에 손날을 베었다. 따끔거리는 줄도 몰랐다. 미지근한 피가 손목을 타고 흘렀다.<\/p>\n<p>발소리가 멈췄다.<\/p>\n<p>계산대 바로 앞에서.<\/p>\n<p>\"….\"<\/p>\n<p>나는 숨을 참았다. 하나, 둘, 셋. 긴장하면 숫자를 세는 버릇이 있다. 새벽마다 재고를 세던 버릇이다. 바나나우유 열둘, 삼각김밥 스물넷, 하나, 둘, 셋.<\/p>\n<p>청년이 계산대를 지나쳤다. 구두 끝이 문 쪽으로 돌았다.<\/p>\n<p>그리고, 멈췄다.<\/p>\n<p>\"거기.\"<\/p>\n<p>심장이 떨어졌다.<\/p>\n<p>\"나와.\"<\/p>\n<p>나는 나가지 않았다. 나갈 수 없었다. 무릎이 내 것이 아니었다.<\/p>\n<p>계산대 위로 그림자가 졌다. 청년이 상체를 숙여 계산대 너머를 내려다봤다. 위에서 떨어지는 형광등 빛 때문에 얼굴이 반쯤 그늘에 잠겨 있었다. 눈동자는 회색이었다. 비 오기 직전의 하늘 같은.<\/p>\n<p>우리는 눈이 마주쳤다.<\/p>\n<p>그는 한참 나를 봤다. 처음엔 사냥감을 보는 눈이었다. 그런데 이상했다. 시선이 내 얼굴 위에서 자꾸 미끄러졌다. 다시 붙잡았다. 또 미끄러졌다. 렌즈의 초점을 맞추려는 사람처럼 미간이 살짝 좁혀졌다.<\/p>\n<p>\"너.\"<\/p>\n<p>\"…저, 아무것도 못 봤어요.\"<\/p>\n<p>내가 생각해도 한심한 대사였다. 목소리가 갈라졌다.<\/p>\n<p>청년의 시선이 내 손으로 내려갔다. 피로 젖은 주먹. 그는 그 안에 뭐가 있는지 아는 것 같았다. 은색 장갑이 계산대 위로 천천히 내려왔다.<\/p>\n<p>나는 주먹을 더 꽉 쥐었다.<\/p>\n<p>그런데 그 손이 멈췄다.<\/p>\n<p>허공에서. 내 주먹에서 한 뼘 떨어진 곳에서.<\/p>\n<p>\"…이름.\"<\/p>\n<p>\"네?\"<\/p>\n<p>\"이름이 뭐야.\"<\/p>\n<p>나는 조끼 명찰을 내려다봤다. 강하루. 그가 그걸 보지 못할 리 없었다.<\/p>\n<p>\"강하루요.\"<\/p>\n<p>그가 고개를 아주 조금 기울였다. 그 이름이 아니라는 듯이. 은색 장갑이 다시 거둬졌다. 그는 상체를 펴고, 나를 내려다봤다.<\/p>\n<p>\"아니야.\"<\/p>\n<p>\"…뭐가요.\"<\/p>\n<p>대답은 없었다.<\/p>\n<p>그는 대신 계산대 위 진열대를 봤다. 껌, 사탕, 일회용 라이터. 아무 의미 없는 것들을 하나하나 확인하듯이. 그리고 다시 나를 봤다. 마치 눈을 떼면 내가 사라질까 봐 확인하는 사람처럼.<\/p>\n<p>이상한 일이었다. 사람들은 보통 나를 보다가 눈을 뗀다. 자연스럽게, 아무렇지도 않게. 내 얼굴은 사람들 시선이 미끄러져 내려가는 비탈길 같은 거였다.<\/p>\n<p>이 사람은 자꾸 다시 올라왔다.<\/p>\n<p>그는 등을 돌렸다. 자동문이 열렸다. 딩동. 새벽 공기가 밀려 들어왔다. 겨울의 끝자락, 젖은 아스팔트 냄새.<\/p>\n<p>나는 그제야 숨을 쉬었다. 폐가 타는 것처럼 아팠다. 다리에 힘이 풀려 담배 박스 위로 엉덩방아를 찧었다.<\/p>\n<p>괜찮아. 괜찮아. 어차피 내일이면 아무도 나 기억 못 해. 이 사람도. 이 일도.<\/p>\n<p>나는 늘 그렇게 버텼다. 잊히는 건 슬프지만, 잊히면 아무 일도 없었던 게 된다. 망신도, 실수도, 들킨 비밀도. 하루만 버티면 다 리셋된다. 그게 내가 가진 유일한 특권이었다.<\/p>\n<p>나는 휴대폰을 꺼냈다. 1, 1, 2. 통화 버튼 위에서 엄지가 멈췄다.<\/p>\n<p>뭐라고 말하지. 노인이 피를 흘리며 들어왔는데, 장갑 낀 남자가 손을 대니까 재가 됐다고? CCTV에는 아무도 없다고? 경찰이 오면, 그 경찰은 내일 아침 나를 기억하지도 못할 거다. 조서에 적힌 이름만 남을 거다. 강하루. 아무도 얼굴을 떠올리지 못하는 이름.<\/p>\n<p>화면이 꺼졌다. 검은 액정에 내 얼굴이 비쳤다. 핏기 없는 입술, 땀에 젖어 이마에 들러붙은 앞머리.<\/p>\n<p>나는 일어나 노인이 서 있던 자리를 봤다. 바닥 타일은 깨끗했다. 방금 대걸레질을 한 것처럼. 쭈그려 앉아 손가락으로 쓸어 봤다. 손끝에 아주 미세한 회색 가루가 묻어났다. 비벼 보니 종이 재처럼 바스러졌다.<\/p>\n<p>있었다. 분명히 있었다.<\/p>\n<p>나만 기억하는 사람.<\/p>\n<p>그 생각을 하자 이상하게 목이 메었다. 처음 보는 노인이었다. 이름도 몰랐다. 아니, 알았다. 장갑 낀 남자가 불렀다. 허문 사서님.<\/p>\n<p>허문.<\/p>\n<p>나는 입속으로 그 이름을 한 번 굴렸다. 누군가 기억해 줘야 할 것 같았다. 아무도 모르게 사라지는 게 얼마나 무서운 일인지, 나는 잘 아니까.<\/p>\n<p>나는 주먹을 폈다.<\/p>\n<p>피범벅이 된 금속판. 앞면은 매끈했다. 아무것도 쓰여 있지 않았다. 뒤집었다.<\/p>\n<p>뒷면 한가운데, 먹물로 찍은 점 하나.<\/p>\n<p>붓끝을 꾹 눌렀다가 살짝 틀어 올린, 물방울 같은 점이었다. 서예 시간에 한 번 배운 적이 있었다. 글씨의 첫 획. 이름은 기억나지 않았다.<\/p>\n<p>딩동.<\/p>\n<p>자동문이 다시 열렸다.<\/p>\n<p>청년이 문턱에 서 있었다. 나가다 말고 돌아선 자세 그대로. 회색 눈이 계산대 너머의 나를 찾아냈다. 이번에는 미끄러지지 않았다.<\/p>\n<p>\"넌 이상하다.\"<\/p>\n<p>그가 말했다. 평평한 목소리에 처음으로 금이 가 있었다.<\/p>\n<p>\"아까부터 네가 계속 기억나.\"<\/p>\n<p>나는 그 말이 무슨 뜻인지 몰랐다. 세상에서 그런 말을 들어 본 적이 없으니까.<\/p>\n<p>\"그 명패, 버려.\"<\/p>\n<p>그가 시선을 내 손에 고정한 채 말했다.<\/p>\n<p>\"그걸 가진 사람은 7일 뒤에 전부 사라져.\"<\/p>\n<p>문이 닫혔다.<\/p>\n<p>바람이 멎었다. 냉장고 모터가 다시 웅웅거리기 시작했다. 세상이 아무 일도 없었다는 듯 숨을 쉬었다.<\/p>\n<p>손바닥이 뜨거웠다.<\/p>\n<p>내려다보니, 베인 손날에서 흐른 피가 금속판 위로 번지고 있었다. 아니. 번지는 게 아니었다. 빨려 들어가고 있었다. 매끈한 표면이 스펀지처럼 내 피를 마셨다. 붉은 선이 금속 안쪽으로 가라앉으며 무언가를 그렸다.<\/p>\n<p>이름이 아니었다.<\/p>\n<p>숫자였다.<\/p>\n<div class=\"doc\">49<\/div>\n<p>벽시계의 초침이 째깍, 넘어갔다.<\/p>\n<p>04:31.<\/p>","chars":4834},{"title":"0호선","html":"<p>[낙명제 1일째 · 마감까지 162시간]<\/p>\n<p>04시 44분, 신설동 유령역.<\/p>\n<p>나는 편의점 조끼를 입은 채 폐승강장 끝에 서 있었다.<\/p>\n<p>어떻게 여기까지 왔는지 설명하라면 못 한다. 사장님이 5시에 교대하러 오기 전에 가게를 비우면 안 된다는 생각은 했다. 그런데 손바닥 위 금속판이 자꾸 뜨거워졌다. 4시 35분이 되자 손바닥이 데일 것처럼 달아올랐다. 나는 셔터도 내리지 않고 뛰쳐나왔다.<\/p>\n<p>2호선 환승 통로 끝, '관계자 외 출입금지' 철문. 평소엔 녹슨 자물쇠가 걸려 있는 문이었다. 명패를 쥔 손을 가까이 대자, 자물쇠가 혼자 툭 떨어졌다.<\/p>\n<p>그 아래로 계단이 있었다.<\/p>\n<p>곰팡이 냄새. 물 떨어지는 소리. 타일 벽에 1970년대 글씨체로 '신설동'이라고 적힌 표지판이 반쯤 떨어져 매달려 있었다. 형광등은 다 죽어 있었다. 휴대폰 손전등 불빛이 먼지를 눈송이처럼 비췄다.<\/p>\n<p>추웠다. 조끼 안으로 냉기가 파고들었다. 이가 딱딱 부딪쳤다.<\/p>\n<p>미쳤다. 진짜 미쳤다, 강하루.<\/p>\n<p>나는 철로를 내려다봤다. 녹슨 레일 위로 쥐 한 마리가 지나갔다. 열차가 들어올 리 없었다. 이 역은 수십 년 전에 버려졌으니까. 그 노인도, 장갑 낀 남자도, 피를 마신 금속판도 전부 새벽 근무가 만든 환각일지 몰랐다.<\/p>\n<p>그런데 손바닥이 뜨거웠다. 49라는 숫자가 피부를 통해 맥박처럼 뛰었다.<\/p>\n<p>휴대폰 시계가 4:44로 넘어갔다.<\/p>\n<p>바람이 불었다.<\/p>\n<p>터널 안쪽에서 미지근한 바람이 밀려 나왔다. 쇠 냄새와 오래된 종이 냄새가 섞인 바람. 레일이 진동했다. 소리는 없었다. 진동만 발바닥을 타고 올라왔다.<\/p>\n<p>어둠 속에서 불빛 두 개가 떠올랐다.<\/p>\n<p>열차였다.<\/p>\n<p>녹슨 녹색 차체, 창문마다 노란 불빛. 앞머리 행선판에 숫자 하나가 떠 있었다. <span class=\"sys\">0<\/span>. 열차는 소리 없이 미끄러져 들어와 내 앞에 멈췄다. 문이 열렸다. 치익, 하는 압축 공기 소리조차 없었다.<\/p>\n<p>안에서 시선들이 쏟아졌다.<\/p>\n<p>또래들이었다. 열일곱, 열여덟, 스물쯤 된 얼굴들. 교복도 있고 트레이닝복도 있고 코트도 있었다. 공통점은 하나였다. 모두 가슴에 금속판을 달고 있었다.<\/p>\n<p>글자가 새겨진 금속판.<\/p>\n<p>나는 내 것을 내려다봤다. 49. 이름 대신 숫자.<\/p>\n<p>\"탈 거야, 말 거야? 문 닫힌다?\"<\/p>\n<p>문 옆에 앉은 남자애가 말했다. 나는 엉겁결에 올라탔다. 문이 등 뒤에서 닫혔다. 열차가 움직였다. 이번에도 소리가 없었다. 창밖으로 터널 벽이 흘러갔다. 아니, 내려갔다. 열차는 앞으로 가는 게 아니라 아래로 기울어 가고 있었다.<\/p>\n<p>빈자리는 아까 말을 건 남자애 옆뿐이었다.<\/p>\n<p>\"앉아, 앉아. 서 있으면 멀미해. 이거 경사가 미쳤거든. 우리 아빠 말로는 7층 깊이를 15분에 내려간대. 엘리베이터 생각하면 돼. 엘리베이터가 사선으로 떨어지는 거.\"<\/p>\n<p>남자애는 숨도 안 쉬고 말했다. 곱슬머리, 뿔테 안경, 목에 감은 낡은 머플러. 무릎 위에 철제 공구함을 끌어안고 있었다. 가슴의 금속판은 녹이 슬어 가장자리가 초록색이었다.<\/p>\n<p>奉道俊.<\/p>\n<p>\"봉도준. 31번.\"<\/p>\n<p>그가 내 시선을 따라 자기 명패를 툭 쳤다.<\/p>\n<p>\"너는? 처음 보는 얼굴인데. 칠명가는 아니지? 칠명가는 저쪽 칸 따로 타. 우리 같은 몰명은 이 칸이고.\"<\/p>\n<p>\"몰명이 뭔데.\"<\/p>\n<p>도준이 안경 너머로 눈을 깜박였다.<\/p>\n<p>\"…너 진짜 아무것도 몰라?\"<\/p>\n<p>\"오늘 새벽까지 편의점에서 삼각김밥 진열했어.\"<\/p>\n<p>도준이 내 조끼를 봤다. 가슴팍 매직 글씨. 강하루. 그리고 그 아래 내 명패를 봤다. 그의 입이 천천히 벌어졌다.<\/p>\n<p>\"야. 너 명패 왜 비었어?\"<\/p>\n<p>\"비었다니?\"<\/p>\n<p>\"이름이 없잖아. 숫자만 있고. 그런 거 처음 봐.\"<\/p>\n<p>그 순간이었다.<\/p>\n<p>열차 앞쪽 칸에서 쿵, 하는 소리가 났다. 차체가 흔들렸다. 사람들이 일제히 고개를 돌렸다.<\/p>\n<p>통로 한가운데 거인이 서 있었다.<\/p>\n<p>키가 2미터는 될 것 같았다. 천장 손잡이에 머리가 닿아 고개를 숙이고 있었다. 어깨가 문틀만 했다. 그 거대한 손에 마른 소년 하나가 멱살을 잡힌 채 매달려 있었다. 소년의 발끝이 바닥에서 떨어져 버둥거렸다.<\/p>\n<p>\"곽태산이다.\"<\/p>\n<p>도준이 속삭였다. 목소리가 떨렸다.<\/p>\n<p>\"7번. 작년에 낙명제 미리 참관하러 왔다가 집행관이랑 붙어서 살아남았다는 놈. 개막 전엔 빼앗아도 무효인데….\"<\/p>\n<p>거인, 곽태산이 소년의 가슴에서 명패를 뜯어냈다. 실밥이 터지는 소리가 났다. 소년이 비명을 질렀다.<\/p>\n<p>\"돌려줘! 개막 전이잖아! 규칙 위반—\"<\/p>\n<p>\"연습.\"<\/p>\n<p>태산이 짧게 말했다. 그리고 명패에 새겨진 이름을 소리 내어 읽었다.<\/p>\n<p>\"정, 우, 진.\"<\/p>\n<p>명패가 빛났다.<\/p>\n<p>희미한 푸른빛이 금속판에서 피어올라 태산의 손목을 타고 팔뚝으로 스며들었다. 태산의 어깨가 미세하게 부풀었다. 그는 짧게 숨을 들이쉬었다. 배부른 사람처럼.<\/p>\n<p>반대로, 소년의 얼굴에서 무언가가 빠져나갔다.<\/p>\n<p>핏기가 아니었다. 그보다 더 깊은 것. 윤곽이었다. 소년의 얼굴이 아주 미세하게, 초점이 나간 사진처럼 흐려졌다. 그를 보고 있는데도 그의 얼굴이 기억에 잘 붙지 않았다.<\/p>\n<p>나는 그 감각을 알았다.<\/p>\n<p>매일 아침 사장님이 나를 볼 때의 눈빛. 이 사람 누구였더라.<\/p>\n<p>태산이 소년을 놓았다. 소년은 바닥에 주저앉아 자기 손을 들여다봤다. 손바닥을 뒤집고, 또 뒤집었다. 그리고 울기 시작했다. 소리 없이.<\/p>\n<p>태산은 빈 명패를 소년의 무릎 위에 떨어뜨렸다. 글자가 지워진 매끈한 금속판.<\/p>\n<p>\"개막하면 진짜로 한다.\"<\/p>\n<p>거인이 칸 전체를 둘러보며 말했다. 협박이 아니었다. 예보였다.<\/p>\n<p>그의 시선이 우리 쪽을 지나갔다. 도준이 공구함을 끌어안고 몸을 움츠렸다. 태산의 눈이 내 가슴께에서 잠깐 멈췄다. 숫자 49. 그는 미간을 찌푸렸다가, 흥미 없다는 듯 지나쳤다.<\/p>\n<p>이름 없는 명패는 사냥감이 아니었다.<\/p>\n<p>\"…설명해 줘.\"<\/p>\n<p>나는 도준에게 말했다. 손이 떨려서 무릎 사이에 끼웠다.<\/p>\n<p>\"전부. 지금.\"<\/p>\n<p>도준은 마른침을 삼켰다. 그리고 말하기 시작했다. 무서우면 말이 많아지는 타입인 것 같았다.<\/p>\n<p>\"명패엔 진명이 새겨져. 진짜 이름. 태어날 때 최초의 명부라는 데 적힌 거. 남의 명패를 뺏어서 그 이름을 소리 내 부르면, 그 사람 마력이 내 거 돼. 뺏긴 사람은 마법 못 써. 방금 봤지? 얼굴이 흐려지는 거. 이름이 닳으면 사람들이 그 사람을 잘 기억 못 하게 돼.\"<\/p>\n<p>\"그다음엔.\"<\/p>\n<p>\"7일 동안 명패를 못 되찾으면, 마감 때 말소.\"<\/p>\n<p>\"말소.\"<\/p>\n<p>\"지워져. 존재째로. 아무도 기억 못 하고, 몸도….\"<\/p>\n<p>도준이 손가락을 펼쳐 흩날리는 시늉을 했다. 재처럼.<\/p>\n<p>편의점 바닥에 쌓였던 회색 가루가 떠올랐다.<\/p>\n<p>\"우리 아빠도 그렇게 됐어.\"<\/p>\n<p>도준이 덧붙였다. 아무렇지 않은 척하는 목소리였다. 그는 안경을 고쳐 쓰고 금세 말을 이었다.<\/p>\n<p>\"아무튼! 명패 잃으면 끝이야. 근데 넌 이상하다. 이름이 없으면 뺏어도 부를 게 없잖아. 그럼 넌 사냥 안 당하는 거 아냐? 와, 개꿀인데?\"<\/p>\n<p>\"마법은?\"<\/p>\n<p>\"…어?\"<\/p>\n<p>\"이름이 없으면 마법도 못 쓰는 거 아냐?\"<\/p>\n<p>도준이 입을 다물었다. 그는 내 명패를 다시 봤다. 동정과 계산이 동시에 떠오른 얼굴이었다. 나는 그 표정을 탓할 생각이 없었다. 여기서는 다들 그렇게 살아남을 테니까.<\/p>\n<p>\"너 진짜 이상하다.\"<\/p>\n<p>그가 결국 그렇게 말했다. 그리고 웃었다. 앞니 하나가 살짝 깨져 있었다.<\/p>\n<p>나도 웃었다. 웃을 상황이 아닌데. 입꼬리가 저 혼자 올라갔다. 누군가 내 옆에서, 나에 대해 궁금해하고 있었다. 그게 너무 오랜만이라 웃음이 났다.<\/p>\n<p>동시에 머릿속 한구석이 차갑게 계산했다.<\/p>\n<p>이 애도 내일이면 날 잊는다.<\/p>\n<p>정들지 마. 기대하지 마. 그게 하루짜리 인생의 규칙이었다.<\/p>\n<p>열차가 터널을 빠져나왔다.<\/p>\n<p>빛이 쏟아졌다.<\/p>\n<p>나는 창에 이마를 붙였다. 숨이 멎었다.<\/p>\n<p>거대한 구멍이었다. 땅속에 수직으로 뚫린 원통형 공간. 지름이 축구장 몇 개는 될 것 같았다. 벽면을 따라 층층이 건물이 박혀 있었다. 회랑, 아치, 계단, 기와지붕과 철골이 뒤섞인 기괴한 도시. 층마다 등불이 수천 개 매달려 흔들렸다.<\/p>\n<p>그리고 맨 꼭대기, 지상이 있어야 할 자리에 둥근 빛이 떠오르고 있었다.<\/p>\n<p>태양이었다. 아니, 태양을 흉내 낸 무언가. 노란 등잔불을 백만 배로 키운 것 같은 빛 덩어리가 천천히 차올랐다. 빛이 닿는 층부터 차례로 그림자가 짧아졌다.<\/p>\n<p>\"등(燈)이야.\"<\/p>\n<p>도준이 속삭였다.<\/p>\n<p>\"6시 정각에 떠. 저게 뜨면 개막이야.\"<\/p>\n<p>명부원(名簿院).<\/p>\n<p>열차가 멈췄다. 문이 열렸다. 밀가루 같은 빛과 함께, 수백 개의 종이 동시에 울렸다.<\/p>\n<p>대광장에는 이미 사람들이 모여 있었다. 마흔아홉 명. 몰명 칸에서 내린 우리와, 다른 칸에서 내린 화려한 코트 차림의 아이들. 칠명가였다. 그들의 명패는 금빛이었다. 우리 것은 녹슨 동색이었다.<\/p>\n<p>광장 위 허공에 거울이 떠 있었다.<\/p>\n<p>수십 개. 크고 작은 타원형 거울들이 빙글빙글 돌며 광장을 비췄다. 거울마다 참가자들의 얼굴이 하나씩 클로즈업되었다.<\/p>\n<p>\"명경. 저 너머에서 칠명가 어른들이 다 보고 있어.\"<\/p>\n<p>도준이 이를 악물고 말했다.<\/p>\n<p>\"마음에 드는 애한테 후원도 해. 빵이라든지, 약이라든지. 그러니까 웃어. 불쌍해 보이게.\"<\/p>\n<p>나는 웃지 못했다. 거울 하나가 내 앞에서 멈췄다.<\/p>\n<p>거울 속 나는 흐릿했다.<\/p>\n<p>다른 아이들의 얼굴은 모공까지 선명했다. 내 얼굴만 김 서린 유리 너머처럼 번져 있었다. 거울이 초점을 맞추려는 듯 몇 번 깜박이다가, 포기하고 다른 사람에게로 돌아갔다.<\/p>\n<p>거울도 나를 기억하지 못했다.<\/p>\n<p>종소리가 멎었다.<\/p>\n<p>광장 정면, 높은 단상 위에 남자가 나타났다.<\/p>\n<p>쉰 남짓. 은발이 섞인 머리를 단정히 빗어 넘겼고, 먹색 두루마기 위에 코트를 걸쳤다. 안경 너머 눈매가 온화했다. 동네 서점 주인처럼 생긴 사람이었다. 웃는 얼굴이 사람 좋아 보였다.<\/p>\n<p>\"반갑습니다, 여러분.\"<\/p>\n<p>목소리가 광장 전체에 고르게 퍼졌다. 크게 외치지 않는데도 귀 바로 옆에서 속삭이는 것처럼 들렸다.<\/p>\n<p>\"명부원 원장, 남궁현입니다.\"<\/p>\n<p>그의 뒤, 단상 옆으로 검은 코트 차림의 사람들이 줄지어 섰다. 모두 오른손에 은색 장갑을 끼고 있었다.<\/p>\n<p>그 줄의 맨 끝.<\/p>\n<p>회색 눈.<\/p>\n<p>나는 숨을 삼켰다. 편의점의 그 남자였다. 그는 앞만 보고 있었다. 무표정한 얼굴, 정확히 각도를 맞춘 어깨. 마네킹처럼.<\/p>\n<p>\"이름은 유한합니다.\"<\/p>\n<p>원장이 말했다.<\/p>\n<p>\"약한 이름을 걸러야 강한 이름이 삽니다. 그것이 사백 년 동안 이 학교를 지켜 온 원칙입니다. 앞으로 7일. 마감 시각에 명패를 지닌 사람은 살아남습니다. 그중 가장 많은 이름을 거둔 일곱 명이 명부원의 신입생이 됩니다.\"<\/p>\n<p>차분한 목소리였다. 일기예보를 읽듯이.<\/p>\n<p>\"명패를 잃은 사람은 — 아시지요.\"<\/p>\n<p>아무도 대답하지 않았다. 광장에 마흔아홉 명의 숨소리만 가득했다. 내 옆에서 도준이 공구함 손잡이를 너무 세게 쥐어 손등에 핏줄이 섰다.<\/p>\n<p>등이 완전히 떠올랐다. 6시 정각.<\/p>\n<p>\"그럼, 낙명제를 시작하겠습니다.\"<\/p>\n<p>박수는 없었다. 명경들 너머 어딘가에서 웃음소리 같은 것이 희미하게 흘러나왔을 뿐.<\/p>\n<p>그때 원장이 고개를 돌렸다.<\/p>\n<p>천천히. 마흔아홉 명의 얼굴을 하나하나 쓰다듬듯 훑던 시선이, 군중 한가운데에서 멈췄다.<\/p>\n<p>나였다.<\/p>\n<p>명경조차 초점을 못 맞춘 내 얼굴을, 그는 단번에 찾아냈다. 안경 너머 눈이 가늘게 휘었다. 오래 기다린 손님을 맞는 주인처럼, 다정하게.<\/p>\n<p>\"49번.\"<\/p>\n<p>그가 말했다. 광장의 모든 귀에 똑같이 들리는 목소리로.<\/p>\n<p>\"어서 오렴. 오래 기다렸단다.\"<\/p>\n<p>아무도 나를 모르는 곳에서.<\/p>\n<p>그는 나를 알고 있었다.<\/p>","chars":5271},{"title":"이름 없는 명패","html":"<p>[낙명제 1일째 · 마감까지 147시간]<\/p>\n<p>마흔여덟 개의 고개가 일제히 나를 향했다.<\/p>\n<p>시선이 피부에 꽂혔다. 따가웠다. 칠명가 아이들의 금빛 명패가 등빛에 번쩍였다. 누군가 \"49번이 누구야?\" 하고 수군거렸다. 누군가는 내 빈 명패를 손가락질했다.<\/p>\n<p>하나, 둘, 셋.<\/p>\n<p>나는 숫자를 셌다.<\/p>\n<p>넷, 다섯.<\/p>\n<p>시선이 흐려지기 시작했다.<\/p>\n<p>여섯, 일곱.<\/p>\n<p>사람들의 눈동자가 내 얼굴 위에서 미끄러졌다. 이마를 찌푸리고, 고개를 갸웃하고, 옆 사람에게 뭔가를 물으려다 입을 다물었다. 질문이 뭐였는지 잊은 얼굴로.<\/p>\n<p>여덟.<\/p>\n<p>광장의 고개들이 하나둘 단상으로 돌아갔다.<\/p>\n<p>익숙한 감각이었다. 학기 초 자기소개 시간에 일어나서 이름을 말하면, 앉기도 전에 다들 다음 사람을 봤다. 나는 늘 그렇게 지워졌다. 서운하지 않은 척하는 게 특기였다.<\/p>\n<p>오늘은 처음으로 그게 고마웠다.<\/p>\n<p>단상 위 원장만이 여전히 나를 보고 있었다. 미소를 지운 적 없는 얼굴로. 그 옆, 장갑 낀 줄의 맨 끝에서도 회색 눈 하나가 나를 놓지 않고 있었다.<\/p>\n<p>\"야, 너, 너….\"<\/p>\n<p>도준이 내 소매를 잡아당겼다. 그는 나를 보고 있었다. 아직 기억하고 있었다.<\/p>\n<p>\"원장이 너를 왜 알아?\"<\/p>\n<p>\"나도 몰라.\"<\/p>\n<p>\"그럼 우린 지금 망한 거네?\"<\/p>\n<p>\"우린?\"<\/p>\n<p>도준이 눈을 끔뻑였다. 그리고 공구함을 고쳐 안으며 빠르게 말했다.<\/p>\n<p>\"동맹하자. 나 혼자면 첫날 뜯겨. 진짜야, 나 싸움 못 해. 근데 너 눈치 빠르잖아. 아까 열차에서 태산 오기 전에 이미 손 숨기는 거 봤어. 그리고 너는 뺏겨도 안 죽잖아. 그러니까 내 명패 좀 같이 지켜 줘. 대신 나는 자물쇠 따고, 부적 고치고, 소문 다 알아.\"<\/p>\n<p>말이 쏟아졌다. 숨 쉴 틈도 없이. 나는 그 말들 사이에서 가장 중요한 단어 하나만 건졌다.<\/p>\n<p>같이.<\/p>\n<p>\"…좋아.\"<\/p>\n<p>\"진짜? 와, 나 고백 처음 받아 줬어.\"<\/p>\n<p>\"고백 아니거든.\"<\/p>\n<p>낮은 길었다.<\/p>\n<p>등이 떠 있는 동안 명부원은 거대한 사냥터였다. 지하 1층부터 6층까지, 회랑과 계단과 강의실이 전부 아레나였다. 개막 종이 울린 지 30분 만에 첫 비명이 들렸다. 1시간 만에 명경 하나가 공중에서 누군가의 흐려진 얼굴을 클로즈업했다. 박수 같은 소리가 명경 너머에서 흘러나왔다.<\/p>\n<p>우리는 지하 2층 기숙 구역에 숨었다. 벌집처럼 작은 방이 다닥다닥 붙은 복도. 문마다 놋쇠 번호판이 달려 있었고, 공기에선 오래된 이불과 촛농 냄새가 났다.<\/p>\n<p>\"여긴 개막 첫날 비워 둬. 해 질 때까지 아무도 안 와.\"<\/p>\n<p>도준이 확신에 차서 말했다.<\/p>\n<p>10분 뒤 그 확신이 박살 났다.<\/p>\n<p>쿵.<\/p>\n<p>복도 끝 방문이 경첩째 날아갔다. 나무 파편이 우리 발치까지 튀었다. 먼지 속에서 거대한 그림자가 허리를 숙이고 나왔다.<\/p>\n<p>곽태산이었다.<\/p>\n<p>그의 가슴에는 자기 명패 외에도 세 개가 더 매달려 있었다. 이미 세 명. 개막 4시간 만에. 그의 손에 들린 누군가의 목덜미가 축 늘어져 있었다. 태산은 그 아이의 명패를 뜯고, 이름을 부르고, 아이를 복도에 내려놓았다. 짐을 내려놓듯이.<\/p>\n<p>그리고 이쪽을 봤다.<\/p>\n<p>\"뛰어.\"<\/p>\n<p>내가 말했고, 도준은 이미 뛰고 있었다.<\/p>\n<p>복도는 길었다. 우리는 방 사이로 꺾어 들고, 계단을 두 칸씩 뛰어올랐다. 등 뒤에서 바닥이 울렸다. 쿵, 쿵, 쿵. 태산은 빠르지 않았다. 그런데 멈추지도 않았다. 거리가 줄어드는 게 발바닥으로 느껴졌다.<\/p>\n<p>\"막다른 길!\"<\/p>\n<p>도준이 비명을 질렀다. 복도 끝에 창문 하나. 창밖은 7층 깊이의 허공이었다.<\/p>\n<p>나는 돌아섰다.<\/p>\n<p>태산이 복도를 꽉 채우며 다가오고 있었다. 숨소리 하나 거칠지 않았다. 이마에 땀 한 방울 없었다. 그 거대한 손이 도준의 녹슨 명패를 향해 뻗어 왔다.<\/p>\n<p>나는 도준 앞을 막아섰다.<\/p>\n<p>왜 그랬는지 모른다. 다리가 먼저 나갔다. 오늘 처음 만난 애였다. 내일이면 나를 잊을 애였다.<\/p>\n<p>태산의 손이 방향을 틀어 내 가슴을 낚아챘다.<\/p>\n<p>뜯겼다. 조끼 천과 함께. 숨이 턱 막혔다. 태산은 내 명패를 눈앞에 들어 올렸다. 그리고 입을 열었다. 이름을 부르려고.<\/p>\n<p>입이 그대로 멈췄다.<\/p>\n<p>\"….\"<\/p>\n<p>태산이 명패를 뒤집었다. 다시 뒤집었다. 앞면에는 피로 새겨진 숫자 하나뿐이었다. 49.<\/p>\n<p>\"사십구.\"<\/p>\n<p>그가 읽었다. 아무 일도 일어나지 않았다. 빛도, 흐름도 없었다.<\/p>\n<p>\"사, 십, 구.\"<\/p>\n<p>또 읽었다. 금속판은 그냥 금속판이었다.<\/p>\n<p>거인의 미간에 처음으로 주름이 잡혔다. 당황이었다. 거짓말을 못 하는 얼굴이었다. 어린애가 계산이 안 맞는 숙제를 들여다보는 표정.<\/p>\n<p>부를 이름이 없다.<\/p>\n<p>뺏을 게 없다.<\/p>\n<p>그 순간 머릿속에서 뭔가가 딸깍 맞물렸다. 편의점에서 유통기한 지난 바코드를 찍었을 때 '판매 불가' 뜨는 그 느낌. 시스템이 나를 읽지 못한다.<\/p>\n<p>나는 손을 뻗어 태산의 손가락 사이에서 명패를 낚아챘다.<\/p>\n<p>그가 너무 당황해서 쥐는 힘이 풀려 있었다. 차가운 금속이 손바닥에 돌아왔다.<\/p>\n<p>\"도준아, 창문!\"<\/p>\n<p>\"여기 7층—\"<\/p>\n<p>\"아래 차양 있어!\"<\/p>\n<p>창밖 반 층 아래, 회랑 지붕의 기와가 보였다. 도준이 뭐라고 비명을 지르며 창틀을 넘었다. 나도 뛰었다. 몸이 허공에 떴다. 바람이 귀를 찢었다. 기와가 무릎을 받아 냈다. 아팠다. 굴렀다. 살았다.<\/p>\n<p>위를 올려다봤다.<\/p>\n<p>창가에 태산이 서 있었다. 쫓아오지 않았다. 그 거대한 덩치로는 저 창틀을 못 넘었다. 그는 텅 빈 자기 손바닥과 나를 번갈아 보고 있었다.<\/p>\n<p>나를 기억하려는 듯이 오래.<\/p>\n<p>그러다 눈을 깜박였다. 그리고 고개를 갸웃했다. 방금 자기가 뭘 쫓고 있었는지 잊은 사람처럼.<\/p>\n<p>그는 돌아섰다.<\/p>\n<p>밤이 되었다.<\/p>\n<p>등이 저물자 명부원은 갑자기 추워졌다. 지하의 밤은 지상보다 빨랐다. 빛이 사라지자마자 돌벽이 냉기를 토해 냈다.<\/p>\n<p>우리는 지하 3층 끝, 버려진 강의실에 숨었다. 칠판에는 누군가 수십 년 전에 쓰다 만 한자들이 반쯤 지워져 있었다. 책상은 다 뒤집혀 있었고, 창문 하나가 깨져 바람이 휘파람을 불었다.<\/p>\n<p>도준이 공구함 바닥에서 뭔가를 꺼냈다.<\/p>\n<p>컵라면 두 개.<\/p>\n<p>\"너 그거 어디서 났어.\"<\/p>\n<p>\"매점. 오늘은 아무도 안 지키더라고. 다들 사냥하느라.\"<\/p>\n<p>\"훔쳤네.\"<\/p>\n<p>\"빌린 거야. 7일 안에 갚을 거야. 살아 있으면.\"<\/p>\n<p>그는 부적 한 장을 꺼내 손가락으로 튕겼다. 종이 끝에 불꽃이 피었다. 작은 냄비에 물을 데우는 손놀림이 능숙했다. 김이 피어올랐다. 매콤한 스프 냄새가 강의실을 채웠다. 그 냄새 하나에 갑자기 배가 고팠다. 새벽부터 아무것도 안 먹었다.<\/p>\n<p>우리는 뒤집힌 책상에 등을 기대고 나란히 앉아 라면을 먹었다. 뜨거운 국물이 목을 타고 내려가자, 그제야 손끝이 덜 떨렸다.<\/p>\n<p>\"아까.\"<\/p>\n<p>도준이 면을 후후 불며 말했다.<\/p>\n<p>\"왜 막았어? 내 앞에.\"<\/p>\n<p>\"몰라.\"<\/p>\n<p>\"몰라가 뭐야.\"<\/p>\n<p>\"진짜 몰라. 다리가 먼저 나갔어.\"<\/p>\n<p>도준이 젓가락을 멈췄다. 김 너머로 그의 안경이 뿌옇게 흐려졌다. 그는 안경을 벗어 머플러 끝으로 닦으며, 아무렇지 않은 척 말했다.<\/p>\n<p>\"우리 아빠도 그런 사람이었대. 남 앞을 막는 사람.\"<\/p>\n<p>나는 가만히 있었다.<\/p>\n<p>\"7년 전 낙명제에서 말소됐어. 같은 몰명 친구 대신 집행관 앞에 섰다더라. 근데 웃긴 게 뭔지 알아? 다음 날 집안 사람 전부 아빠를 잊었어. 엄마도, 할머니도. 식탁에 아빠 숟가락이 왜 있는지 몰라서 치웠어.\"<\/p>\n<p>그가 안경을 다시 썼다. 웃고 있었다.<\/p>\n<p>\"나만 기억했어. 3일 동안. 4일째 아침에 일어나니까… 아빠 얼굴이 안 떠오르더라.\"<\/p>\n<p>라면 국물이 식어 갔다. 깨진 창으로 들어온 바람이 우리 사이를 지나갔다.<\/p>\n<p>나는 뭔가 말해야 할 것 같았다. 위로 같은 거. 그런데 나는 위로받아 본 적이 없어서 그게 어떻게 생긴 건지 몰랐다.<\/p>\n<p>대신 내 얘기를 했다.<\/p>\n<p>\"나, 하루만 기억되는 애야.\"<\/p>\n<p>도준이 고개를 돌렸다.<\/p>\n<p>\"사람들이 나를 하루 지나면 잊어. 전부. 편의점 사장님은 1년 넘게 매일 아침 나한테 신입이냐고 물어. 학교에선 출석 부를 때마다 선생님이 '강하루? 전학생이니?' 해. 그래서 이름도 하루야. 보육원 원장님이 지어 줬어.\"<\/p>\n<p>입 밖으로 내니까 생각보다 별거 아니었다. 별거 아닌 척하는 목소리가 내 입에서 나왔다. 늘 그랬다. 농담처럼.<\/p>\n<p>\"그러니까 너도 내일이면 나 몰라. 오늘 고마웠어, 미리.\"<\/p>\n<p>도준이 나를 빤히 봤다.<\/p>\n<p>그리고 콧방귀를 뀌었다.<\/p>\n<p>\"에이, 그런 게 어딨어.\"<\/p>\n<p>\"있어. 여기.\"<\/p>\n<p>\"없어. 나 기억력 좋아. 원주율 마흔 자리까지 외워.\"<\/p>\n<p>\"그거랑 상관없—\"<\/p>\n<p>\"내가 내일 아침에.\"<\/p>\n<p>도준이 내 말을 끊었다. 그는 빈 컵라면 용기를 나에게 건배하듯 들어 올렸다.<\/p>\n<p>\"제일 먼저 인사해 줄게. 강하루, 좋은 아침. 이렇게.\"<\/p>\n<p>나는 웃었다. 웃으려고 했는데 목구멍 안쪽이 뜨거워져서 웃음이 반쯤만 나왔다. 그 반쪽짜리 웃음을 도준은 못 본 척해 줬다.<\/p>\n<p>자정이 넘어 우리는 강의실 바닥에 코트를 깔고 누웠다.<\/p>\n<p>나는 잠이 오지 않았다. 천장을 봤다. 균열 사이로 아주 멀리 위층의 등불 하나가 별처럼 깜박였다. 손바닥 위 명패를 엄지로 문질렀다. 뒷면의 점. 붓끝이 눌렸다 튀어 오른 자국.<\/p>\n<p>옆에서 볼펜 긁는 소리가 났다.<\/p>\n<p>고개를 돌리자 도준이 등을 돌린 채 웅크리고 있었다. 왼팔 소매를 걷어 올리고, 손목 안쪽에 뭔가를 쓰고 있었다. 내가 보는 걸 눈치채자 그는 후다닥 소매를 내렸다.<\/p>\n<p>\"뭐 써?\"<\/p>\n<p>\"아무것도. 모기 물렸어.\"<\/p>\n<p>\"지하 7층에 모기가 있어?\"<\/p>\n<p>\"…자라, 좀.\"<\/p>\n<p>나는 돌아누웠다. 웃음이 났다. 그러다 금세 가슴이 서늘해졌다.<\/p>\n<p>기대하지 마, 강하루.<\/p>\n<p>나는 눈을 감고 숫자를 셌다. 바나나우유 열둘. 삼각김밥 스물넷. 하나, 둘, 셋.<\/p>\n<p>언제 잠들었는지 모른다.<\/p>\n<p>눈을 뜬 건 등이 떠오르는 빛 때문이었다. 깨진 창으로 금빛 햇살 같은 것이 비스듬히 들어와 강의실 먼지를 비추고 있었다. 공기가 차가웠다. 코끝이 시렸다.<\/p>\n<p>도준이 먼저 일어나 있었다.<\/p>\n<p>그는 공구함 앞에 무릎을 꿇고 앉아 있었다. 나는 몸을 일으키며 입을 열었다. 좋은 아침, 하고 먼저 말해 볼까. 어제 그가 약속한 것처럼.<\/p>\n<p>도준이 고개를 돌렸다.<\/p>\n<p>나와 눈이 마주쳤다.<\/p>\n<p>그의 얼굴에서 핏기가 확 빠졌다. 그는 뒤로 물러나다 공구함에 걸려 엉덩방아를 찧었다. 손을 허겁지겁 품에 넣어 부적 한 장을 꺼냈다. 부적 끝에서 지지직, 푸른 불꽃이 튀었다. 그는 그것을 나에게 겨눴다. 손이 덜덜 떨렸다.<\/p>\n<p>\"…누구세요?\"<\/p>\n<p>목소리가 갈라져 있었다.<\/p>\n<p>\"내 명패 노리고 왔어?\"<\/p>","chars":4770},{"title":"하루 노트","html":"<p>[낙명제 2일째 · 마감까지 137시간]<\/p>\n<p>부적 끝에서 튀는 불꽃이 내 코끝 한 뼘 앞에서 지지직거렸다.<\/p>\n<p>탄내가 났다. 머리카락 끝이 그슬리는 냄새. 도준의 손은 덜덜 떨리고 있었는데, 부적을 쥔 손가락만은 하얗게 질릴 만큼 단단했다.<\/p>\n<p>웃음이 날 것 같았다.<\/p>\n<p>울음이 날 것 같았다.<\/p>\n<p>둘 중 뭐가 먼저 나올지 몰라서 나는 입술을 깨물었다. 거봐. 내가 말했잖아. 기대하지 말랬잖아, 강하루. 좋은 아침 같은 건 없다고.<\/p>\n<p>\"움직이지 마. 진짜 쏜다? 나 이거 쏘면 너 눈썹 다 탄다?\"<\/p>\n<p>\"…쏘지 마.\"<\/p>\n<p>\"그럼 누군데! 왜 여기 있는데! 나 왜 여기서 자고 있는데!\"<\/p>\n<p>도준이 소리를 질렀다. 그 서슬에 부적을 쥔 손목이 소매 밖으로 쑥 빠져나왔다.<\/p>\n<p>거기 글씨가 있었다.<\/p>\n<p>손목 안쪽, 정맥 위에 볼펜으로 꾹꾹 눌러 쓴 글씨. 밤새 땀에 번져 조금 흐려져 있었다. 그래도 읽혔다.<\/p>\n<p class=\"em-line\"><strong>강하루 = 내 친구. 믿어도 됨. 질문 금지.<\/strong><\/p>\n<p>나는 그 글씨를 봤다.<\/p>\n<p>모기 물렸다던 자리였다.<\/p>\n<p>목구멍이 꽉 막혔다. 나는 아무 말도 못 하고 그 손목만 가리켰다. 도준이 내 손가락을 따라 시선을 내렸다. 자기 손목을 봤다. 눈이 커졌다. 손목을 뒤집었다. 다시 봤다.<\/p>\n<p>\"…이거 내 글씨인데.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"내가 썼어?\"<\/p>\n<p>\"어젯밤에. 나 몰래.\"<\/p>\n<p>도준이 나를 봤다. 손목을 봤다. 나를 봤다. 부적의 불꽃이 피식, 꺼졌다.<\/p>\n<p>\"강하루.\"<\/p>\n<p>\"응.\"<\/p>\n<p>\"너야?\"<\/p>\n<p>\"응.\"<\/p>\n<p>그는 한참 동안 자기 글씨를 노려봤다. 무슨 계약서 약관을 읽는 사람처럼. 그리고 갑자기 버럭 했다.<\/p>\n<p>\"아니, 질문 금지는 왜 써 놨냐, 나야! 지금 질문이 백 개인데!\"<\/p>\n<p>나는 터졌다.<\/p>\n<p>웃음이었다. 다행히도. 배를 잡고, 차가운 바닥에 이마를 박고, 숨이 넘어가도록 웃었다. 웃다가 눈물이 났는데, 그건 웃어서 나는 눈물이라고 우길 수 있었다.<\/p>\n<p>도준은 어이없다는 얼굴로 나를 보다가, 결국 따라 웃었다. 자기가 왜 웃는지도 모르면서.<\/p>\n<p>\"좋아. 일단 믿을게. 과거의 내가 믿으래. 과거의 나는 나보다 너를 더 오래 알았으니까.\"<\/p>\n<p>그는 공구함에서 낡은 수첩 하나와 몽당연필을 꺼냈다. 표지가 닳아 모서리가 둥글어진 수첩이었다.<\/p>\n<p>\"근데 이건 아니다. 매일 아침 이러면 내가 언젠가 진짜 쏜다.\"<\/p>\n<p>그가 수첩 첫 장에 큼지막하게 썼다.<\/p>\n<p class=\"em-line\"><strong>하루 노트.<\/strong><\/p>\n<p>\"매일 밤 내가 여기다 오늘 있었던 일 쓸게. 매일 아침 이거 읽을게. 그럼 아침마다 너는 나한테 처음부터 설명 안 해도 되잖아.\"<\/p>\n<p>나는 웃음을 멈췄다.<\/p>\n<p>그는 별것 아니라는 듯 연필 끝을 혀에 찍었다. 그리고 내 앞에 수첩을 내밀었다.<\/p>\n<p>\"자. 어제 무슨 일 있었는지 불러 봐. 받아 적을게.\"<\/p>\n<p>나는 그 수첩을 오래 봤다.<\/p>\n<p>하루짜리 인생에 처음으로 생긴 기록이었다.<\/p>\n<p>나는 어제를 불렀다. 편의점, 0호선, 태산, 창문, 컵라면. 도준은 받아 적다가 군데군데 멈췄다. \"내가 창문에서 뛰었다고? 7층에서?\" \"반 층이었어.\" \"그래도!\" 그리고 아버지 이야기 대목에서는 연필을 한동안 움직이지 않았다.<\/p>\n<p>마지막 줄에 그는 이렇게 썼다.<\/p>\n<p class=\"em-line\"><strong>강하루: 나보다 용감함. 근데 자기가 그런 거 모름.<\/strong><\/p>\n<p>\"그건 내가 안 불렀는데.\"<\/p>\n<p>\"추론이야.\"<\/p>\n<p>수첩이 덮였다.<\/p>\n<p>나는 명패를 꺼냈다. 아침 빛에 비춰 보니, 어제는 못 본 것이 보였다. 금속판 테두리, 머리카락보다 가는 선으로 새겨진 글자들. 손톱으로 긁은 것 같은 미세한 각인.<\/p>\n<p class=\"em-line\"><strong>넷째 층, 가로로 누운 것 아래.<\/strong><\/p>\n<p>\"허문 할아버지 글씨야.\"<\/p>\n<p>내가 말했다. 확신은 없었다. 그래도 그 노인 말고는 이 명패에 손댄 사람이 없었다.<\/p>\n<p>도준이 안경을 치켜올렸다.<\/p>\n<p>\"넷째 층이면 지하 4층. 지하 4층에 있는 거라곤 강의동이랑… 금서고.\"<\/p>\n<p>\"금서고?\"<\/p>\n<p>\"말소된 사람들 기록 모아 두는 데. 출입 금지. 들어가면 집행관이 온대.\"<\/p>\n<p>그는 말하면서 이미 공구함을 열고 있었다. 가느다란 철사 꾸러미가 짤랑거렸다.<\/p>\n<p>\"…가자는 거야?\"<\/p>\n<p>\"질문 금지래매.\"<\/p>\n<p>지하 3층에서 4층으로 내려가는 나선 계단에서 우리는 첫 번째 시체를 봤다.<\/p>\n<p>시체라고 부를 수 있는 게 남아 있지 않았다. 계단참 구석, 회색 재 한 무더기. 그 위에 녹슨 명패 하나가 얹혀 있었다. 글자는 지워져 매끈했다. 재 옆에 운동화 한 짝이 있었다. 끈이 반쯤 풀린 채로.<\/p>\n<p>\"어젯밤 집행이야.\"<\/p>\n<p>도준이 고개를 돌리며 말했다. 그는 재를 밟지 않으려고 벽에 바짝 붙어 지나갔다. 나도 따라갔다. 그런데 계단 세 칸쯤 내려갔을 때, 나는 돌아봤다.<\/p>\n<p>운동화 끈. 누군가 아침에 묶었을 끈.<\/p>\n<p>이 사람 이름이 뭐였을까. 아무도 모를 거다. 명경 너머 귀족들은 벌써 잊었을 거고, 같이 열차를 탄 애들도 잊었을 거다. 나는 그 앞에 잠깐 서서, 이름 대신 숫자를 셌다. 하나. 그 사람 몫으로 하나.<\/p>\n<p>\"하루야, 빨리!\"<\/p>\n<p>나는 계단을 마저 내려갔다. 발목이 저렸다. 어제 기와 위로 뛰어내릴 때 접질린 데가 이제야 욱신거렸다.<\/p>\n<p>지하 4층은 조용했다.<\/p>\n<p>사냥 소리가 거기까지는 닿지 않았다. 복도엔 먼지가 쌓였고, 벽등은 절반쯤 꺼져 있었다. 공기에서 오래된 종이와 곰팡이와 먹 냄새가 났다. 서예 학원 문을 열었을 때 나는 냄새였다.<\/p>\n<p>금서고 문은 검은 쇠문이었다. 일곱 개의 먹점이 둥글게 찍힌 문양. 칠명회의 표식이라고 도준이 속삭였다.<\/p>\n<p>자물쇠는 세 개였다. 도준은 철사 두 가닥을 구멍에 넣고 귀를 문에 댔다. 혀끝이 입술 사이로 비죽 나왔다. 딸깍. 딸깍. 세 번째에서 그의 이마에 땀이 맺혔다.<\/p>\n<p>\"빨리.\"<\/p>\n<p>\"재촉하면 느려져.\"<\/p>\n<p>딸깍.<\/p>\n<p>문이 열렸다. 차가운 바람이 안쪽에서 흘러나왔다. 동굴 바람이었다.<\/p>\n<p>안은 끝이 보이지 않았다. 천장까지 닿는 서가가 미로처럼 늘어서 있었다. 서가마다 두꺼운 장부가 빼곡했다. 등을 들고 들어가자 장부 등에 쓰인 연도가 불빛에 떠올랐다. 1620. 1734. 1899. 사백 년 치 말소자들.<\/p>\n<p>\"가로로 누운 것….\"<\/p>\n<p>나는 서가 사이를 걸었다. 책은 전부 세로로 꽂혀 있었다. 가로로 누운 게 없었다. 서가 맨 아래 칸을 하나하나 비춰 봤다. 손끝이 시렸다. 시간이 흐르는 게 느껴졌다. 집행관이 언제 올지 몰랐다.<\/p>\n<p>\"하루야. 이거.\"<\/p>\n<p>도준이 서가 하나 앞에서 쪼그려 앉아 있었다.<\/p>\n<p>서가가 아니라 선반이었다. 맨 아래 칸 선반 앞면, 나뭇결 위에 먹으로 그은 가로획 하나. 붓을 왼쪽에서 눌러 시작해 오른쪽으로 힘 있게 그어 끝에서 살짝 멈춘 획.<\/p>\n<p>나는 명패를 뒤집었다. 뒷면의 점.<\/p>\n<p>점, 그리고 가로획.<\/p>\n<p>\"붓글씨 기본 획 같은데.\"<\/p>\n<p>도준이 말했다.<\/p>\n<p>\"서당에서 첫날 배우는 거. 점 찍고, 가로 긋고, 세로 긋고….\"<\/p>\n<p>\"누가 이걸 일부러 흩어 놨다는 거야?\"<\/p>\n<p>\"아니면 우연이겠지. 우연이 이렇게 친절할 리 없지만.\"<\/p>\n<p>가로로 누운 것 아래. 나는 선반 아래 틈에 손을 넣었다. 먼지가 손가락 사이로 밀려 들어왔다. 손끝에 딱딱한 모서리가 걸렸다.<\/p>\n<p>장부였다. 다른 것들보다 얇고, 검은 천으로 장정한.<\/p>\n<p>표지에 연도가 없었다.<\/p>\n<p>펼쳤다. 이름과 날짜와 사유. 줄줄이. 잉크가 바랬고 종이가 바스러질 것 같았다. 몇 장을 넘기자, 종이 사이에 끼워진 사진 한 장이 미끄러져 나왔다.<\/p>\n<p>흑백이었다. 명부원 교복을 입은 여자. 스물쯤 됐을까. 카메라를 정면으로 보지 않고 살짝 비켜 웃고 있었다. 어딘가 귀찮다는 듯이, 그러면서 즐겁다는 듯이.<\/p>\n<p>나는 숨을 멈췄다.<\/p>\n<p>눈매가 똑같았다.<\/p>\n<p>매일 아침 편의점 화장실 거울에서 보는 눈. 눈꼬리가 아래로 살짝 처졌다가 끝에서 올라가는 모양. 웃으면 왼쪽만 조금 더 접히는 모양.<\/p>\n<p>엄마.<\/p>\n<p>머릿속에서 그 단어가 굴러갔다. 입 밖으로 내 본 적 없는 말. 혀가 그 모양을 몰랐다. 사탕을 처음 입에 넣은 아이처럼 나는 그 단어를 조심스럽게 굴렸다.<\/p>\n<p>엄마.<\/p>\n<p>손이 떨렸다. 사진 모서리가 떨렸다.<\/p>\n<p>그때 발소리가 들렸다.<\/p>\n<p>입구 쪽. 또각, 또각. 구두 굽. 서두르지 않는 걸음.<\/p>\n<p>도준이 사색이 되어 내 팔을 잡았다. 우리는 서가 사이로 몸을 숨겼다. 하지만 서가 사이는 좁았고, 등불은 꺼지지 않았다. 도준이 등을 입으로 불어 껐다. 어둠. 먹 냄새.<\/p>\n<p>발소리가 가까워졌다.<\/p>\n<p>서가 끝에 그림자가 섰다.<\/p>\n<p>은색 장갑이 어둠 속에서 희미하게 빛났다.<\/p>\n<p>\"나와. 둘 다.\"<\/p>\n<p>그 목소리였다.<\/p>\n<p>평평하고 차가운. 편의점에서, 개막식 단상 끝에서. 나는 도준을 뒤로 밀고 혼자 일어났다. 그가 나를 볼 거다. 그럼 끝이다.<\/p>\n<p>제하가 나를 봤다.<\/p>\n<p>이번에도 시선이 미끄러지지 않았다. 처음부터 나를 정확히 찾아냈다. 회색 눈이 내 얼굴에, 그리고 내 손의 사진에 머물렀다.<\/p>\n<p>\"여기 오면 안 되는 거 알지.\"<\/p>\n<p>\"알아.\"<\/p>\n<p>\"알면서 왔어.\"<\/p>\n<p>\"응.\"<\/p>\n<p>그가 한 걸음 다가왔다. 나는 물러서지 않았다. 물러설 데가 없었다. 등 뒤가 서가였다. 그가 손을 들었다. 은색 장갑이. 나는 눈을 질끈 감았다.<\/p>\n<p>어깨에 손이 닿았다.<\/p>\n<p>밀렸다. 옆으로. 서가와 서가 사이, 더 깊은 틈으로. 나는 눈을 떴다. 그가 내 어깨를 누른 채, 입구 쪽을 보고 있었다. 가까웠다. 너무 가까웠다. 그의 코트에서 차가운 밤공기 냄새가 났다. 장갑에서는 쇠 냄새. 숨소리가 들렸다. 그의 것인지 내 것인지 몰랐다.<\/p>\n<p>\"소리 내지 마.\"<\/p>\n<p>그가 입술만으로 말했다.<\/p>\n<p>입구 쪽에서 다른 발소리가 들렸다. 여럿. 누군가 외쳤다. \"제하 선배님? 금서고 문이 열려 있어서요!\"<\/p>\n<p>\"확인했다. 아무도 없어.\"<\/p>\n<p>제하가 돌아서며 말했다. 목소리에 아무 흔들림도 없었다.<\/p>\n<p>\"쥐다. 문 잠가.\"<\/p>\n<p>\"네!\"<\/p>\n<p>발소리들이 멀어졌다. 제하도 걸어 나갔다. 서가 끝에서 한 번, 아주 잠깐 멈췄다. 돌아보지는 않았다.<\/p>\n<p>\"그 사진.\"<\/p>\n<p>그가 등을 보인 채 말했다.<\/p>\n<p>\"보지 마. 보면 못 돌아가.\"<\/p>\n<p>쇠문이 닫혔다. 철컥. 잠기는 소리.<\/p>\n<p>나는 그 자리에 주저앉았다. 어깨에 그의 손자국이 남아 있는 것 같았다. 차갑지 않았다. 장갑 너머로, 이상하게 따뜻했다.<\/p>\n<p>\"…저 사람 뭐야? 지우개잖아. 은색 장갑. 너 아는 사이야?\"<\/p>\n<p>도준이 어둠 속에서 속삭였다. 목소리가 떨렸다.<\/p>\n<p>\"몰라.\"<\/p>\n<p>진짜 몰랐다. 왜 날 숨겨 줬는지. 왜 날 기억하는지.<\/p>\n<p>도준이 다시 등에 불을 붙였다. 나는 사진을 내려다봤다. 보지 말라고 했다. 보면 못 돌아간다고.<\/p>\n<p>어차피 돌아갈 데도 없었다. 편의점 사장님은 오늘 아침에도 신입을 기다렸을 거다.<\/p>\n<p>사진이 끼워져 있던 장부의 쪽을 펼쳤다. 맨 위 줄. 반듯한 붓글씨.<\/p>\n<p class=\"em-line\"><strong>南宮蓮(남궁연). 명부원 졸업생 수석.<\/strong><\/p>\n<p class=\"em-line\"><strong>17년 전 말소.<\/strong><\/p>\n<p class=\"em-line\"><strong>사유: 명부 훼손 — 자기 딸의 진명 삭제.<\/strong><\/p>\n<p>손끝에서 피가 빠져나갔다.<\/p>\n<p>자기 딸의 진명 삭제.<\/p>\n<p>아래로 한 줄 더 있었다. 붉은 인주로 찍은 도장 옆, 다른 사람의 필체로 덧붙인 글씨.<\/p>\n<p class=\"em-line\"><strong>딸 — 행방 수색 중.<\/strong><\/p>\n<p class=\"em-line\"><strong>수색 담당: 원장 직속.<\/strong><\/p>","chars":4930},{"title":"공시, 배급","html":"<p>[낙명제 2일째 · 마감까지 129시간]<\/p>\n<p>수색 담당: 원장 직속.<\/p>\n<p>나는 그 여섯 글자를 손가락으로 짚었다. 인주가 오래돼 갈색으로 변해 있었다. 말라붙은 피 같았다.<\/p>\n<p>원장. 개막식 단상 위의 온화한 얼굴. 어서 오렴, 오래 기다렸단다.<\/p>\n<p>17년 동안 찾았다는 거였다. 엄마가 이름을 지워 숨긴 딸을.<\/p>\n<p>나를.<\/p>\n<p>데엥—<\/p>\n<p>종이 울렸다.<\/p>\n<p>금서고의 돌벽이 진동했다. 서가의 장부들이 일제히 떨었다. 두 번, 세 번. 종소리가 지하 도시 전체를 뚫고 내려왔다. 배 속까지 울리는 소리였다.<\/p>\n<p>\"공시다.\"<\/p>\n<p>도준이 벌떡 일어났다.<\/p>\n<p>\"첫 번째 공시. 전원 대광장 집합. 안 가면 그 자리에서 실격이야.\"<\/p>\n<p>\"우리 갇혔잖아.\"<\/p>\n<p>\"안에서 여는 건 쉬워.\"<\/p>\n<p>도준은 철사를 꺼내 쇠문 자물쇠에 꽂았다. 이번엔 세 번째 자물쇠도 금방 열렸다. 나는 사진과 장부 한 장을 찢어 조끼 안주머니에 넣었다. 심장 바로 위. 종이가 바스락거릴 때마다 엄마의 웃는 얼굴이 가슴을 긁었다.<\/p>\n<p>대광장은 등빛에 하얗게 달아올라 있었다.<\/p>\n<p>마흔아홉 명이 모였다. 어제보다 얼굴들이 흐렸다. 명패를 뺏긴 아이들은 윤곽이 번진 채로 무리 가장자리에 서 있었다. 아무도 그들 곁에 서지 않았다. 흐려진 사람 옆에 있으면 자기도 흐려질 것처럼.<\/p>\n<p>곽태산은 광장 한가운데 서 있었다. 그의 가슴에 매달린 명패는 여섯 개로 늘어 있었다.<\/p>\n<p>단상에 시험관이 올라섰다. 회색 두루마기의 마른 여자. 목소리가 칼날처럼 얇았다.<\/p>\n<p>\"공시 1. 배급.\"<\/p>\n<p>그녀가 손을 들자, 광장 바닥이 열리며 나무 상자 하나가 솟아올랐다. 뚜껑이 닫힌 상자였다.<\/p>\n<p>\"오늘 밤 등이 지는 순간부터, 지하 2층 기숙 구역을 제외한 전 구역은 집행관의 사냥 구역이 된다. 기숙 구역의 방문은 숙소 열쇠로만 열린다.\"<\/p>\n<p>시험관이 상자를 손끝으로 두드렸다.<\/p>\n<p>\"열쇠는 마흔여덟 개.\"<\/p>\n<p>광장이 술렁였다.<\/p>\n<p>마흔아홉 명. 열쇠 마흔여덟 개. 한 명.<\/p>\n<p>\"열쇠로 문을 연 자는, 해가 뜰 때까지 집행 대상에서 제외한다. 이상.\"<\/p>\n<p>\"장난해?\"<\/p>\n<p>누군가 외쳤다. 그 외침에 불이 붙었다. \"한 명은 그냥 죽으라는 거야?\" \"이게 무슨 시험이야!\" \"명패가 있어도 집행한다는 게 말이 돼?\"<\/p>\n<p>마흔아홉 명이 처음으로 같은 방향을 봤다. 단상 위 시험관을. 명경 수십 개가 그 장면을 빙글빙글 돌며 비췄다.<\/p>\n<p>\"조용.\"<\/p>\n<p>한 목소리가 소란을 갈랐다.<\/p>\n<p>무리 앞쪽, 금빛 명패를 단 여자애가 걸어 나왔다. 허리까지 오는 검은 머리를 하나로 묶었고, 하얀 코트 깃이 칼처럼 섰다. 턱을 들고 걷는 걸음에 망설임이 없었다. 다른 칠명가 아이들이 저절로 그녀에게 길을 텄다.<\/p>\n<p>南宮世娥.<\/p>\n<p>남궁. 원장과 같은 성.<\/p>\n<p>\"남궁세아. 1번.\"<\/p>\n<p>도준이 속삭였다.<\/p>\n<p>\"원장 딸이야. 칠명가 서열 1위.\"<\/p>\n<p>나는 조끼 안주머니에 손을 댔다. 종이가 바스락거렸다.<\/p>\n<p>南宮蓮. 南宮世娥.<\/p>\n<p>같은 두 글자. 같은 성. 장부 속 엄마의 이름 앞에 붙어 있던 글자가, 지금 저 애의 금빛 명패 위에서 등빛에 번쩍이고 있었다. 우연일 수도 있었다. 칠명가라는 게 일곱 가문뿐이라면, 남궁이 한둘이 아닐 리 없었다.<\/p>\n<p>그런데 저 턱선. 고개를 살짝 비틀어 사람을 내려다보는 각도.<\/p>\n<p>사진 속 엄마가 카메라를 비켜 웃던 각도와 닮아 있었다.<\/p>\n<p>나는 시선을 돌렸다. 지금은 아니었다. 지금은 살아남는 게 먼저였다.<\/p>\n<p>세아가 단상 아래에서 시험관을 올려다봤다.<\/p>\n<p>\"시험관님. 참가자 전원이 열쇠 하나씩을 양보 없이 나누면, 남는 한 명은 공정한 방식으로 정하겠습니다. 제비뽑기든 뭐든. 그러니 상자를 우리에게 넘기세요. 칠명가 대표로서 배분을 맡겠습니다.\"<\/p>\n<p>말투가 공문서 같았다. 그런데 사람들이 그 말에 고개를 끄덕였다. 처음으로 이 광장에 질서 같은 게 생겼다. 몰명 아이들도, 흐려진 아이들도 세아 뒤로 모여들었다. 우리 대 저들. 참가자 대 시험.<\/p>\n<p>뭉쳤다. 마흔아홉 명이.<\/p>\n<p>나는 그게 30초도 못 갈 거라는 걸 알았다.<\/p>\n<p>편의점에서 1+1 행사 마지막 하나를 두고 아줌마 둘이 싸우는 걸 백 번은 봤다. 처음엔 다들 양보한다. 물건이 눈앞에 보이기 전까진.<\/p>\n<p>시험관이 웃었다. 처음으로.<\/p>\n<p>\"좋습니다.\"<\/p>\n<p>상자 뚜껑이 열렸다.<\/p>\n<p>놋쇠 열쇠 마흔여덟 개가 등빛에 일제히 번쩍였다.<\/p>\n<p>그 순간이었다.<\/p>\n<p>맨 앞의 남자애가 상자로 몸을 던졌다. 그 뒤의 아이가 그의 등을 밟았다. 세아가 \"멈춰!\" 하고 외쳤지만, 그 목소리는 백 개의 발소리에 묻혔다. 질서가 깨지는 데 정확히 2초가 걸렸다.<\/p>\n<p>광장이 폭발했다.<\/p>\n<p>손이 뻗고, 팔꿈치가 날고, 누군가 비명을 질렀다. 놋쇠 열쇠가 공중에 튀어 올라 반짝였다. 땀 냄새, 피 냄새, 짓밟힌 돌바닥의 먼지 냄새. 나는 도준의 머플러를 붙잡고 무리 가장자리로 빠졌다.<\/p>\n<p>곽태산이 상자 쪽으로 걸어갔다. 사람들이 파도처럼 그를 피해 갈라졌다. 그는 상자에 손을 넣어 열쇠 한 줌을 쥐었다. 그리고 그 거대한 주먹을 꽉 쥐었다.<\/p>\n<p>뚜둑.<\/p>\n<p>놋쇠가 엿가락처럼 휘어 부러졌다. 그는 부서진 열쇠들을 바닥에 흩뿌렸다. 경쟁자를 줄이는 가장 간단한 방법이었다.<\/p>\n<p>\"미친놈….\"<\/p>\n<p>도준이 신음했다.<\/p>\n<p>광장 바닥에는 이제 남은 열쇠가 몇 개 없었다. 그걸 차지하려고 아이들이 짐승처럼 엉겨 붙었다. 몇 명은 이미 등을 돌려 기숙 구역 쪽으로 달리고 있었다. 열쇠를 쥔 채로.<\/p>\n<p>열쇠 없이 남는 건 한 명이 아니었다. 열 명은 넘을 것 같았다.<\/p>\n<p>\"하루야, 어떡해, 어떡해, 우리 열쇠 없어—\"<\/p>\n<p>\"잠깐.\"<\/p>\n<p>나는 시험관의 말을 머릿속에서 되감았다. 편의점 행사 문구를 읽듯이. 함정은 늘 작은 글씨에 있었다.<\/p>\n<p>열쇠로 문을 연 자는, 해가 뜰 때까지 집행 대상에서 제외한다.<\/p>\n<p>열쇠를 '가진' 자가 아니었다.<\/p>\n<p>'문을 연' 자.<\/p>\n<p>문은 열쇠 하나로 한 번 열린다. 그런데 열린 문으로 들어가는 사람 수는 정해져 있지 않았다.<\/p>\n<p>\"도준아. 열쇠 하나만 있으면 돼.\"<\/p>\n<p>\"하나도 없다니까!\"<\/p>\n<p>나는 광장 바닥을 훑었다. 사람들 발밑, 부서진 열쇠 더미, 엉켜 넘어진 몸들 사이. 반짝이는 것 하나. 누군가 놓친 열쇠가 돌 틈에 박혀 있었다. 그 위로 운동화 하나가 막 내려앉으려 하고 있었다.<\/p>\n<p>나는 뛰었다.<\/p>\n<p>아무도 나를 보지 않았다. 아무도 나를 기억하지 않았다. 나는 엉킨 몸들 사이를 물처럼 빠져나갔다. 손을 뻗었다. 열쇠가 손바닥에 들어왔다. 차갑고 묵직했다.<\/p>\n<p>기숙 구역 복도. 문들이 하나둘 쾅쾅 닫히고 있었다. 나는 아무 문이나 골라 열쇠를 꽂았다. 돌렸다. 철컥.<\/p>\n<p>문이 열렸다.<\/p>\n<p>나는 뒤돌아 외쳤다.<\/p>\n<p>\"들어와! 다 들어와!\"<\/p>\n<p>복도에서 우왕좌왕하던 아이들이 멈칫했다. 흐려진 얼굴들, 열쇠를 놓친 손들.<\/p>\n<p>\"문을 연 사람이 아니라, 문을 열고 들어간 사람이야! 규칙에 인원 제한 없어! 들어와!\"<\/p>\n<p>첫 번째로 도준이 뛰어들었다. 두 번째로 흐려진 남자애 둘. 세 번째로 키 작은 여자애 하나. 네 번째, 다섯 번째. 좁은 방이 순식간에 사람으로 찼다.<\/p>\n<p>복도 끝에서 시선 하나가 나를 꿰뚫었다.<\/p>\n<p>남궁세아였다. 그녀는 이미 자기 열쇠로 방문을 열고 있었다. 그런데 문지방에 선 채, 돌아서서 나를 보고 있었다. 눈이 가늘었다. 계산하는 눈이었다.<\/p>\n<p>열쇠 마흔여덟 개 중 하나로 일곱 명을 살린 이름 없는 아이를.<\/p>\n<p>나는 문을 닫았다.<\/p>\n<p>등이 졌다.<\/p>\n<p>방 안은 어둡고 비좁았다. 2층 침대 하나에 여덟 명이 끼어 앉았다. 서로의 체온 때문에 겨우 추위를 버텼다. 누군가 계속 훌쩍였다.<\/p>\n<p>\"언니.\"<\/p>\n<p>옆에서 작은 목소리가 났다.<\/p>\n<p>키 작은 여자애였다. 열여섯, 열일곱쯤. 동그란 얼굴에 앞머리를 일자로 잘랐다. 가슴에 녹슨 명패. 22번. 銀率.<\/p>\n<p>\"언니 맞죠? 열쇠.\"<\/p>\n<p>\"…응.\"<\/p>\n<p>\"고마워요, 언니.\"<\/p>\n<p>여자애가 내 팔에 매달렸다. 따뜻하고 작은 손이었다. 은솔이라고 했다. 이번 낙명제 최연소래. 무서워서 하루 종일 화장실에 숨어 있었다고.<\/p>\n<p>나는 그 '언니'라는 말을 어떻게 받아야 할지 몰랐다.<\/p>\n<p>아무도 나를 그렇게 부른 적이 없었다. 보육원에서도, 동생들은 매일 아침 나를 새로 온 선생님인 줄 알았다. 언니. 입안에서 녹는 사탕 같은 말이었다. 너무 달아서 이가 시렸다.<\/p>\n<p>어둠 속에서 연필 긁는 소리가 났다. 도준이 무릎 위에 하루 노트를 펴고 등잔불 아래서 뭔가를 적고 있었다. 나는 고개를 빼서 훔쳐봤다.<\/p>\n<p class=\"em-line\"><strong>은솔(22번): 착함. 하루를 언니라고 부름.<\/strong><\/p>\n<p class=\"em-line\"><strong>하루 표정 이상해짐(좋은 쪽).<\/strong><\/p>\n<p>\"야.\"<\/p>\n<p>\"사실만 적는다.\"<\/p>\n<p>나는 고개를 돌렸다. 볼이 뜨거웠다. 어둠이라 다행이었다.<\/p>\n<p>자정이 조금 넘었을 때였다.<\/p>\n<p>비명이 들렸다.<\/p>\n<p>복도였다. 문 바로 바깥. 방 안의 모든 숨이 멎었다. 은솔이 내 팔을 꽉 쥐었다. 손톱이 살을 파고들었다.<\/p>\n<p>\"제발, 제발요, 문 좀, 누가 문 좀 열어 줘요—!\"<\/p>\n<p>남자애 목소리였다. 문을 두드리는 소리. 쾅, 쾅. 우리 방 문이었다. 문짝이 떨렸다.<\/p>\n<p>아무도 움직이지 않았다.<\/p>\n<p>나도.<\/p>\n<p>열면 안 됐다. 규칙은 '문을 열고 들어간 자'였다. 지금 이 문을 다시 열면, 우리가 다시 연 자가 되는 건지, 바깥이 들어오는 건지 몰랐다. 모르는 채로 일곱 명의 목숨을 걸 수는 없었다.<\/p>\n<p>나는 그렇게 생각했다. 그렇게 생각하는 나를, 나는 아주 멀리서 지켜봤다.<\/p>\n<p>두드리는 소리가 멎었다.<\/p>\n<p>대신 구두 소리가 났다. 또각, 또각. 서두르지 않는 걸음.<\/p>\n<p>\"…아니야, 아니에요, 잘못했어요, 저 명패 있어요, 있다고요—\"<\/p>\n<p>그리고 낮은 목소리.<\/p>\n<p>거꾸로 감기는 음절들. 어금니가 시려 오는 소리.<\/p>\n<p>나는 일어났다. 은솔의 손을 떼어 내고, 문 쪽으로 기어갔다. 도준이 \"하지 마\" 하고 입 모양으로 말렸다. 나는 문틈에 눈을 댔다.<\/p>\n<p>복도 등불 아래.<\/p>\n<p>쓰러진 남자애. 그의 가슴 명패 위에 얹힌 손. 은색 장갑.<\/p>\n<p>재가 날렸다. 회색 가루가 등불 빛 속에서 눈처럼 반짝이며 흩어졌다. 한 사람이 통째로 공기가 되는 데 3초도 걸리지 않았다. 탄 종이 냄새가 문틈으로 스며들었다.<\/p>\n<p>장갑 낀 손이 거둬졌다.<\/p>\n<p>그 손의 주인이 천천히 고개를 들었다.<\/p>\n<p>검은 코트. 창백한 얼굴. 회색 눈.<\/p>\n<p>어제 금서고에서 내 어깨를 밀어 숨겨 준 사람. 편의점에서 허문 할아버지를 지운 사람. 같은 손이었다. 처음부터 같은 손이었다.<\/p>\n<p>지우개.<\/p>\n<p>그가 문을 봤다.<\/p>\n<p>문틈을. 손가락 한 마디 너비의 어둠을.<\/p>\n<p>그 안의 나를.<\/p>\n<p>회색 눈이 정확히 내 눈과 마주쳤다. 문 한 장을 사이에 두고.<\/p>","chars":4757},{"title":"강자 사냥","html":"<p>[낙명제 3일째 · 마감까지 110시간]<\/p>\n<p>도준은 노트를 읽으며 입술을 달싹였다.<\/p>\n<p>\"강하루, 내 친구. 열쇠 장난 성공. 은솔, 착함. 언니라고 부름. 하루 표정 이상해짐, 좋은 쪽…….\"<\/p>\n<p>그는 손목의 글씨와 노트를 번갈아 보더니, 나를 향해 어색하게 손을 들었다.<\/p>\n<p>\"어, 안녕. 친구.\"<\/p>\n<p>\"안녕.\"<\/p>\n<p>나는 웃어 주었다. 웃는 얼굴 근육이 뻣뻣했다. 밤새 한숨도 못 잤으니까.<\/p>\n<p>눈을 감으면 문틈이 보였다. 은색 장갑. 재가 된 사람. 그리고 고개를 들던 얼굴.<\/p>\n<p>금서고에서 나를 서가 뒤로 밀어 넣던 손이, 사람을 지우는 손이었다.<\/p>\n<p>쾅.<\/p>\n<p>숙소 문이 안쪽으로 튕겨 열렸다. 경첩이 비명을 질렀고, 은솔이 이불을 뒤집어쓴 채 비명을 따라 질렀다.<\/p>\n<p>문가에 남궁세아가 서 있었다. 검은 교복 코트, 가슴에 반짝이는 1번 명패. 칠명가의 금박이 새벽 등불을 받아 번들거렸다.<\/p>\n<p>\"어제 그 열쇠 장난.\"<\/p>\n<p>세아의 시선이 방 안을 훑다가 내 얼굴에서 멈췄다. 정확히는, 멈추려다 미끄러졌다. 그녀는 미간을 좁히고 다시 나를 찾았다.<\/p>\n<p>\"……너지? 얼굴이 자꾸 흐려지는 애.\"<\/p>\n<p>\"칭찬이야?\"<\/p>\n<p>\"거래하자는 거야.\"<\/p>\n<hr class=\"scene\">\n<p>세아는 바닥에 지하 3층 평면도를 펼쳤다. 종이에서 비싼 먹 냄새가 났다.<\/p>\n<p>\"곽태산. 어젯밤까지 흡수한 명패가 아홉 개야.\"<\/p>\n<p>도준이 침을 꿀꺽 삼켰다. 그 소리가 방 안에 크게 울렸다.<\/p>\n<p>\"아, 아홉 개면 그, 사람 아홉 명 마력이…….\"<\/p>\n<p>\"한 몸에 들어 있다는 뜻이지. 맨손으로 벽을 뜯어. 내 측근 둘이 어제 명패를 잃을 뻔했어.\"<\/p>\n<p>\"그래서 칠명가 아가씨께서 몰명 나부랭이한테 도와달라고?\"<\/p>\n<p>도준이 말끝을 흐렸다. 세아의 눈이 그를 베듯 지나갔다.<\/p>\n<p>\"혼자선 못 이겨. 아무도. 그러니까 다 같이 잡는 거야. 잡고 나면 각자 갈 길 가고.\"<\/p>\n<p>나는 지도 위 붉은 동그라미를 봤다. 폐역 환기구. 지하 3층에서 지상 쪽으로 뚫린 수직 통로.<\/p>\n<p>\"미끼가 필요하겠네.\"<\/p>\n<p>세아가 처음으로 웃었다. 입꼬리만.<\/p>\n<p>\"역시 너 눈치 빠르다. 넌 사냥당하지 않잖아. 명패가 비어서.\"<\/p>\n<p>은솔이 내 소매를 잡았다. 작은 손이 떨리고 있었다.<\/p>\n<p>\"언니, 하지 마요. 위험해요.\"<\/p>\n<p>\"괜찮아.\"<\/p>\n<p>괜찮지 않았다. 하지만 숫자는 단순했다. 태산이 살아 있으면, 도준의 명패는 오늘 안에 뜯긴다. 은솔의 것도.<\/p>\n<p>\"할게. 대신 조건.\"<\/p>\n<p>\"말해.\"<\/p>\n<p>\"태산 쓰러지면 걔 명패는 네가 가져. 우리 건 건드리지 마.\"<\/p>\n<p>세아는 망설이지 않았다.<\/p>\n<p>\"약속하지.\"<\/p>\n<p>너무 빨랐다. 그게 마음에 걸렸다.<\/p>\n<p>세아는 손가락으로 지도를 짚어 가며 작전을 풀었다. 설명은 짧았다. 설명이 짧은 사람은 대개 이미 여러 번 머릿속으로 돌려 본 사람이다.<\/p>\n<p>\"하루가 태산을 환기구까지 끌고 와. 통로가 좁아서 그 덩치로는 몸을 못 돌려. 위에서 해원이랑 지강이 사슬 부적을 던져. 묶이면 내가 마무리.\"<\/p>\n<p>세아 옆에 서 있던 단발머리 여자애, 해원이 고개를 까딱했다. 말이 없는 애였다. 손가락 마디마다 먹물이 배어 있었다.<\/p>\n<p>\"사슬 부적은 내가 고칠게.\"<\/p>\n<p>도준이 손을 들었다. 손이 떨려서 손가락 다섯 개가 따로 놀았다.<\/p>\n<p>\"어젯밤에 보니까 너네 부적, 매듭이 반 바퀴씩 덜 감겨 있던데. 그 상태로 던지면 태산 팔에 감기기 전에 터져.\"<\/p>\n<p>세아가 처음으로 도준을 제대로 봤다. 아주 잠깐.<\/p>\n<p>\"몰명치고 눈이 좋네.\"<\/p>\n<p>\"몰명이라서 좋은 거야. 우린 고쳐 써야 되거든, 다.\"<\/p>\n<p>은솔은 지도 귀퉁이를 꼭 잡고 있었다. 종이가 그녀 손에서 구겨졌다.<\/p>\n<p>\"저는요? 저는 뭐 해요?\"<\/p>\n<p>\"넌 출구 지켜. 소리 지르는 거 잘하잖아.\"<\/p>\n<p>세아의 말에 은솔이 볼을 붉혔다. 그 순간만은 칠명가 영애도, 몰명도, 최연소도 없었다. 같은 괴물을 무서워하는 여섯 명이 지도 하나를 둘러싸고 있을 뿐이었다.<\/p>\n<p>나는 그 풍경이 낯설었다. 무리 안에 있다는 것. 누군가 내 몫의 역할을 정해 준다는 것.<\/p>\n<p>내일이면 다들 잊을 텐데. 그 생각이 들자 가슴 한쪽이 얼얼하게 식었다.<\/p>\n<hr class=\"scene\">\n<p>지하 3층 폐역은 비린내가 났다.<\/p>\n<p>고인 물, 녹슨 레일, 오래전 누군가 흘린 피가 돌에 스민 냄새. 천장 등은 반쯤 나가서 그림자가 길게 늘어졌다.<\/p>\n<p>도준과 은솔은 무너진 매표소 뒤에 숨었다. 세아와 측근들은 환기구 위쪽으로 돌아갔다. 플랫폼에는 나 혼자였다.<\/p>\n<p>편의점 야간 근무가 생각났다. 새벽 세 시, 손님 하나 없는 매장에서 냉장고 모터 소리만 듣던 시간. 그때도 혼자였다. 그때는 아무도 오지 않을까 봐 무서웠다.<\/p>\n<p>지금은 누가 올까 봐 무서웠다. 차라리 이게 나았다. 적어도 나를 찾아오는 사람이 있으니까.<\/p>\n<p>나는 플랫폼 가운데 서서 숫자를 셌다. 하나, 둘, 셋.<\/p>\n<p>여덟에서 발소리가 들렸다.<\/p>\n<p>쿵. 쿵. 바닥이 울렸다.<\/p>\n<p>곽태산은 사람이라기보다 움직이는 벽이었다. 가슴에 주렁주렁 매단 남의 명패들이 걸을 때마다 쨍그랑거렸다. 아홉 개의 이름이 부딪치는 소리.<\/p>\n<p>\"또 너냐.\"<\/p>\n<p>그가 나를 내려다봤다. 첫날, 내 명패를 뜯었다가 부를 이름이 없어서 멍청하게 서 있던 그 얼굴.<\/p>\n<p>\"이번엔 그냥 밟아 줄게. 이름 없어도 뼈는 있잖아.\"<\/p>\n<p>\"그건 그렇지.\"<\/p>\n<p>나는 뒤돌아 뛰었다.<\/p>\n<p>레일을 건너고, 무너진 개찰구를 넘고, 폐쇄된 환기구 철문 쪽으로. 등 뒤에서 태산이 달려오는 진동이 발바닥으로 올라왔다. 심장이 목구멍까지 차올랐다.<\/p>\n<p>철문 안은 좁은 수직 통로였다. 위로 까마득하게, 손잡이용 철근이 박혀 있었다.<\/p>\n<p>나는 철근을 잡고 올라갔다. 손바닥에 녹이 쓸려 따끔거렸다.<\/p>\n<p>그때 보였다.<\/p>\n<p>통로 벽면을 따라, 위에서 아래로 길게 그어진 먹선 하나. 손가락 굵기. 수십 년은 된 듯 바랬지만 끊기지 않고 곧게 내려가는 선.<\/p>\n<p>세로획.<\/p>\n<p>점, 가로, 그리고 세로. 허문 할아버지의 명패 뒷면에서 시작된 것들이 하나씩 늘어나고 있었다.<\/p>\n<p>\"거기 있었네.\"<\/p>\n<p>아래에서 태산의 목소리가 울렸다. 그가 철문을 비집고 들어왔다. 통로가 그의 어깨에 꽉 찼다.<\/p>\n<p>\"지금!\"<\/p>\n<p>세아의 외침과 함께 위쪽 환기구 덮개가 열렸다. 세아의 측근 둘이 쇠사슬 부적을 던졌다. 도준이 밤새 고친 부적이었다. 사슬이 태산의 팔을 감고 전기처럼 튀었다.<\/p>\n<p>태산이 포효했다. 통로 전체가 흔들렸다.<\/p>\n<p>그리고 내가 잡고 있던 철근이, 벽에서 뽑혀 나왔다.<\/p>\n<hr class=\"scene\">\n<p>떨어진다는 걸 아는 데 반 박자가 걸렸다.<\/p>\n<p>배 속이 허공에 남겨진 채 몸만 아래로 끌려갔다. 비명도 안 나왔다. 머릿속에 이상하게 침착한 문장 하나가 떠올랐다.<\/p>\n<p>아, 이번엔 진짜 아무도 모르게 사라지겠구나.<\/p>\n<p>손목이 잡혔다.<\/p>\n<p>어깨가 빠질 듯 당겨졌다. 쇠 냄새. 차가운 금속의 감촉이 손목을 감쌌다.<\/p>\n<p>은색 장갑이었다.<\/p>\n<p>윤제하가 통로 옆 정비용 틈에 한 발을 걸친 채 나를 붙들고 있었다. 무표정이었다. 숨소리조차 고요했다.<\/p>\n<p>그는 나를 틈 안으로 끌어올렸다. 한마디도 없이.<\/p>\n<p>그리고 내 손목을 놓았다. 장갑이 떨어져 나간 자리가 이상하게 시렸다.<\/p>\n<p>그가 등을 돌렸다.<\/p>\n<p>\"잠깐.\"<\/p>\n<p>나는 그의 코트 자락을 잡았다. 손이 떨렸다. 추락 때문인지, 이 사람 때문인지 알 수 없었다.<\/p>\n<p>\"왜 구해줘?\"<\/p>\n<p>그는 대답하지 않았다.<\/p>\n<p>\"너 지우개잖아. 어젯밤에 봤어. 그 사람처럼, 날 그냥 지우면 되잖아.\"<\/p>\n<p>목소리가 갈라졌다. 문틈 너머로 흩날리던 재가 아직 눈 안에 있었다.<\/p>\n<p>제하가 천천히 돌아봤다. 회색빛 눈이 나를 내려다봤다. 아무것도 담기지 않은 눈인데, 이상하게 오래 머물렀다.<\/p>\n<p>\"넌 지울 이름이 없어.\"<\/p>\n<p>\"그거 말고.\"<\/p>\n<p>\"……\"<\/p>\n<p>\"진짜 이유.\"<\/p>\n<p>정적. 아래쪽 어딘가에서 태산의 신음과 사슬 끌리는 소리가 멀게 울렸다. 물방울이 똑, 떨어졌다.<\/p>\n<p>제하의 입술이 한 번 열렸다가 닫혔다. 그가 무언가를 삼키는 게 보였다. 목울대가 움직였다.<\/p>\n<p>\"그리고.\"<\/p>\n<p>목소리가 아주 조금, 흔들렸다.<\/p>\n<p>\"넌 내일도 기억나.\"<\/p>\n<p>나는 숨을 멈췄다.<\/p>\n<p>\"그게 문제야.\"<\/p>\n<p>그는 내 손에서 코트 자락을 빼냈다. 부드럽게. 그리고 어둠 속으로 사라졌다.<\/p>\n<p>나는 정비용 틈에 쪼그려 앉았다. 무릎이 제멋대로 떨렸다.<\/p>\n<p>내일도 기억나.<\/p>\n<p>열여덟 해 동안, 누구에게도 들어본 적 없는 문장이었다. 기뻤다. 심장이 아플 만큼.<\/p>\n<p>그리고 무서웠다. 나를 기억하는 유일한 사람이, 사람을 지우는 사람이라는 게.<\/p>\n<p>나는 손목을 문질렀다. 장갑이 감쌌던 자리에 아직 차가운 감촉이 남아 있었다. 손가락 자국이 붉게 떠올라 있었다. 내일이면 이 멍도 나만 보게 될 것이다.<\/p>\n<p>아니. 그 사람도 볼 것이다.<\/p>\n<p>그 생각이 들자 얼굴이 화끈거렸다. 나는 스스로에게 짜증이 났다. 바보야. 저 사람은 어젯밤에 사람을 재로 만들었어. 네가 문틈으로 봤잖아.<\/p>\n<p>하지만 문틈으로 본 그 얼굴은, 고개를 들기 직전까지 아무 표정이 없었다. 화도, 쾌감도, 망설임도. 마치 손이 혼자 일을 하고 얼굴은 그 자리에 없는 사람처럼.<\/p>\n<p>지금 내 앞에서 흔들리던 목소리와, 그 얼굴이 같은 사람이라는 게 이해가 되지 않았다.<\/p>\n<p>이
